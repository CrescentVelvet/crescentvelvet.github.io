<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办清单</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f8fa;
            --text: #1f2329;
            --text-muted: #6b7280;
            --todo: #64748b;
            --doing: #ea580c;
            --done: #16a34a;
            --dropped: #94a3b8;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        .wrap {
            position: relative;
            height: 100vh;
            overflow: hidden;
        }
        .panel {
            position: absolute;
            top: 14px;
            left: 14px;
            width: 340px;
            max-width: calc(100vw - 28px);
            max-height: calc(100vh - 28px);
            overflow-y: auto;
            background: #fff;
            border: 1px solid #e3e6eb;
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,.10);
            z-index: 10;
        }
        h1 { font-size: 1.2em; margin: 0 0 2px; }
        .subtitle { color: var(--text-muted); font-size: 12px; margin: 12px 0 0; line-height: 1.5; }
        a.home {
            display: inline-block;
            margin-bottom: 12px;
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
        }
        a.home:hover { text-decoration: underline; }

        svg.mindmap {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: block;
            user-select: none;
            cursor: grab;
            touch-action: none;
        }
        svg.mindmap.panning { cursor: grabbing; }

        /* connectors */
        .link {
            fill: none;
            stroke: #c7ccd4;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;
            transition: stroke-dashoffset .7s ease, stroke .2s, stroke-width .2s;
        }
        .ready .link { stroke-dashoffset: 0; }
        .node.lit > .kids > .links > .link { stroke: #6366f1; stroke-width: 2.6; }

        /* nodes (rounded pills) */
        .bubble {
            cursor: default;
            opacity: 0;
            transition: opacity .5s ease, stroke-width .18s ease, fill .2s ease;
        }
        .ready .bubble { opacity: 1; }
        .bubble.parent, .bubble.root { cursor: pointer; }
        .bubble.parent:hover, .bubble.root:hover { stroke: #ffffff; stroke-width: 2.5; }
        .node.collapsed > .bubble { stroke: #d1d5db; stroke-dasharray: 3 3; }
        .node.leaf.done .lbl { text-decoration: line-through; opacity: .55; }
        /* 已放弃：空心虚线轮廓 + 深灰文字。用「形状」而非仅色相与「已完成」的实心绿区分，
           避免缩小时只剩色相差（对色觉障碍也不友好）。 */
        .node.leaf.dropped > .bubble {
            fill: #ffffff;
            stroke: var(--dropped);
            stroke-width: 1.6;
            stroke-dasharray: 4 3;
        }
        .node.leaf.dropped .lbl {
            fill: #6b7280;
            text-decoration: line-through;
        }

        /* labels */
        .lbl {
            font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
            font-size: 13px;
            fill: #ffffff;
            pointer-events: none;
            opacity: 0;
            transition: opacity .5s ease;
        }
        .ready .lbl { opacity: 1; }
        .lbl.root { font-family: 'ZCOOL QingKe HuangYou', 'DotGothic16', monospace; font-size: 17px; font-weight: 400; }
        .lbl.lbl-on { font-family: 'ZCOOL QingKe HuangYou', 'DotGothic16', monospace; font-size: 15px; font-weight: 400; }

        /* collapse animation */
        .kids {
            transform-box: view-box;
            transform-origin: 0 0;
            transition: opacity .32s ease, transform .32s ease;
        }
        .node.collapsed > .kids {
            opacity: 0;
            transform: scale(.4);
            pointer-events: none;
        }
        .legend {
            display: flex; gap: 16px; flex-wrap: wrap;
            font-size: 12px; color: var(--text-muted);
            margin-top: 12px;
        }
        .legend span { display: inline-flex; align-items: center; gap: 5px; }
        .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
        .legend .i-todo { background: var(--todo); }
        .legend .i-doing { background: var(--doing); }
        .legend .i-done { background: var(--done); }
        .legend .i-dropped { background: transparent; border: 1.5px dashed var(--dropped); }
        .legend .hint { margin-left: auto; }

        /* selected node + editor */
        .node.selected > .bubble { stroke: #f59e0b; stroke-width: 3; }
        .toolbar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .editor {
            margin-top: 12px;
            background: #fff;
            border: 1px solid #e3e6eb;
            border-radius: 12px;
            padding: 12px 14px;
        }
        .ed-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
        .ed-row:last-child { margin-bottom: 0; }
        .sel-info { font-size: 12px; color: var(--text-muted); }
        .ed-btn {
            border: 1px solid #d0d4da;
            background: #fff;
            color: var(--text);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background .15s, border-color .15s, color .15s;
        }
        .ed-btn:hover:not(:disabled) { background: #f3f4f6; }
        .ed-btn:disabled { opacity: .45; cursor: default; }
        .ed-btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
        .ed-btn.primary:hover { background: #1d4ed8; }
        .ed-btn.danger { color: #dc2626; border-color: #fecaca; }
        .ed-btn.danger:hover { background: #fef2f2; }
        .ed-input {
            flex: 1; min-width: 160px;
            padding: 7px 10px;
            border: 1px solid #d0d4da;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .ed-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        .ed-select {
            padding: 7px 10px;
            border: 1px solid #d0d4da;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            font-family: inherit;
        }

        /* ── 口令锁：加密模式下遮挡整页，解锁前不渲染任何数据 ── */
        body.locked .panel, body.locked svg.mindmap { visibility: hidden; }
        .lock {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 20px;
        }
        body.locked .lock { display: flex; }
        .lock-card {
            width: 100%;
            max-width: 360px;
            background: #fff;
            border: 1px solid #e3e6eb;
            border-radius: 12px;
            padding: 22px 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,.10);
            text-align: center;
        }
        .lock-card h2 { margin: 0 0 6px; font-size: 1.15em; }
        .lock-card > p { margin: 0 0 14px; font-size: 12px; color: var(--text-muted); }
        .lock-row { display: flex; gap: 8px; }
        .lock-row input {
            flex: 1; min-width: 0;
            padding: 8px 10px;
            border: 1px solid #d0d4da;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .lock-row input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        .lock-status { margin: 12px 0 0; font-size: 12px; min-height: 1em; color: var(--text-muted); }
        .lock-status.error { color: #dc2626; }

        /* ── 明文模式警示条 ── */
        .notice {
            margin-top: 12px;
            padding: 10px 12px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 10px;
            font-size: 12px;
            color: #92400e;
            line-height: 1.6;
        }
        .notice p { margin: 0; }
        .notice code { font-size: 11px; }
        .notice-row { display: flex; gap: 8px; margin-top: 8px; }
        .notice-row input {
            flex: 1; min-width: 0;
            padding: 6px 10px;
            border: 1px solid #fcd34d;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            background: #fff;
        }
        .notice-row input:focus { outline: none; border-color: #b45309; }
        .notice .ed-btn { padding: 5px 12px; font-size: 12px; }
        .notice .ed-btn.primary { background: #b45309; border-color: #b45309; }
        .notice .ed-btn.primary:hover { background: #92400e; }
    </style>
</head>
<body>
    <div class="wrap">
        <svg class="mindmap" id="mindmap" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="panel">
            <a href="/" class="home">&larr; 返回首页</a>
            <h1>待办清单</h1>
            <div class="legend">
                <span><i class="i-todo"></i>待办</span>
                <span><i class="i-doing"></i>进行中</span>
                <span><i class="i-done"></i>已完成</span>
                <span><i class="i-dropped"></i>已放弃</span>
            </div>
            <div class="notice" id="notice" style="display:none">
                <p id="noticeMsg"><strong>⚠️ 明文模式</strong>：数据以明文 <code>todo_list.json</code> 存放，公网可直接读取，建议尽快加密迁移。</p>
                <div class="toolbar" style="margin-top:8px">
                    <button id="btnMigrate" class="ed-btn primary" type="button">加密迁移</button>
                </div>
                <div class="notice-row" id="migrateRow" style="display:none">
                    <input type="password" id="migratePw" placeholder="输入口令以生成 todo_list.enc">
                    <button id="migrateGo" class="ed-btn primary" type="button">生成</button>
                </div>
            </div>
            <div class="toolbar">
                <button id="btnExport" class="ed-btn primary" type="button">导出 JSON</button>
                <button id="btnPlain" class="ed-btn" type="button" style="display:none">导出明文备份</button>
                <button id="btnReset" class="ed-btn" type="button">重置（重载文件）</button>
            </div>
            <div class="editor" id="editor" style="display:none">
                <div class="ed-row">
                    <span id="selInfo" class="sel-info"></span>
                </div>
                <div class="ed-row">
                    <input id="selTitle" type="text" class="ed-input" placeholder="标题">
                    <select id="selStatus" class="ed-select">
                        <option value="todo">待办</option>
                        <option value="doing">进行中</option>
                        <option value="done">已完成</option>
                        <option value="dropped">已放弃</option>
                    </select>
                </div>
                <div class="ed-row">
                    <button id="btnAddChild" class="ed-btn" type="button">+ 子节点</button>
                    <button id="btnMoveUp" class="ed-btn" type="button">↑ 上移</button>
                    <button id="btnMoveDown" class="ed-btn" type="button">↓ 下移</button>
                    <button id="btnCollapse" class="ed-btn" type="button">折叠/展开</button>
                    <button id="btnDelete" class="ed-btn danger" type="button">删除</button>
                </div>
            </div>
            <p class="subtitle">滚轮缩放 · 拖拽平移 · 双击空白复位 · 单击节点折叠（父）并选中编辑 · Alt+↑/↓ 或「↑ 上移/↓ 下移」按钮交换同级顺序 · 改完点导出按钮下载，覆盖对应的数据文件 <span id="hintTail"></span></p>
        </div>
    </div>

    <div class="lock" id="lock">
        <div class="lock-card">
            <h2>待办清单</h2>
            <p>该页面已加密，请输入口令解锁</p>
            <div class="lock-row">
                <input type="password" id="pw" placeholder="请输入口令" autocomplete="current-password">
                <button id="unlockBtn" class="ed-btn primary" type="button">解锁</button>
            </div>
            <p class="lock-status" id="lockStatus"></p>
        </div>
    </div>

    <script src="/assets/js/diary-crypto.js"></script>
    <script>
    (function () {
        // 待办数据优先取密文 /assets/data/todo_list.enc，缺失时回退明文 todo_list.json
        var tasks = [];

        var STATUS = { todo: "#64748b", doing: "#ea580c", done: "#16a34a", dropped: "#94a3b8" };

        // 父节点颜色：按到根的距离在 蓝→紫 间渐变（depth 越深越偏紫）
        function lerpHex(c1, c2, t) {
            var r1 = parseInt(c1.slice(1, 3), 16), g1 = parseInt(c1.slice(3, 5), 16), b1 = parseInt(c1.slice(5, 7), 16);
            var r2 = parseInt(c2.slice(1, 3), 16), g2 = parseInt(c2.slice(3, 5), 16), b2 = parseInt(c2.slice(5, 7), 16);
            var r = Math.round(r1 + (r2 - r1) * t), g = Math.round(g1 + (g2 - g1) * t), b = Math.round(b1 + (b2 - b1) * t);
            return "#" + [r, g, b].map(function (x) { var h = x.toString(16); return h.length < 2 ? "0" + h : h; }).join("");
        }
        var PARENT_NEAR = "#8B4513", PARENT_FAR = "#FF00FF";
        function parentColor(depth) {
            var t = maxDepth > 0 ? Math.min(depth / maxDepth, 1) : 0;
            return lerpHex(PARENT_NEAR, PARENT_FAR, t);
        }

        var LEVEL_X = 210;   // 列间距
        var LEAF_GAP = 40;   // 叶子纵向间距
        var TOP = 50;
        var LEFT = 70;
        var cursor = { y: TOP };
        var maxDepth = 0;

        function layout(node, depth) {
            node.depth = depth;
            node.x = LEFT + depth * LEVEL_X;
            if (depth > maxDepth) maxDepth = depth;
            if (node.children && node.children.length) {
                node.children.forEach(function (c) { layout(c, depth + 1); });
                var ys = node.children.map(function (c) { return c.y; });
                node.y = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
            } else {
                node.y = cursor.y;
                cursor.y += LEAF_GAP;
            }
        }

        function escapeXml(s) {
            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function linkPath(x1, y1, x2, y2) {
            var mx = (x1 + x2) / 2;
            return "M " + x1 + " " + y1 + " C " + mx + " " + y1 + ", " + mx + " " + y2 + ", " + x2 + " " + y2;
        }

        function renderNode(node, parentX, parentY) {
            var lx = node.x - parentX;
            var ly = node.y - parentY;
            var isRoot = node.depth === 0;
            var isLeaf = !node.children || !node.children.length;
            var hasKids = !isLeaf;
            var status = node.status || "todo";
            var color = STATUS[status] || STATUS.todo;

            var fill = isLeaf ? color : parentColor(node.depth);
            var nodeCls = "node" + (isLeaf ? " leaf " + status : "") + (hasKids ? " parent" : "") + (node.collapsed ? " collapsed" : "");
            var bubbleCls = "bubble" + (isRoot ? " root" : (isLeaf ? " leaf" : " parent"));
            var lblCls = "lbl" + (isRoot ? " root" : (hasKids ? " lbl-on" : ""));

            var html = '<g class="' + nodeCls + '" data-id="' + node._id + '" transform="translate(' + lx + "," + ly + ')">';

            if (hasKids) {
                html += '<g class="kids"><g class="links">';
                node.children.forEach(function (c) {
                    var clx = c.x - node.x;
                    var cly = c.y - node.y;
                    html += '<path class="link" d="' + linkPath(0, 0, clx, cly) + '"/>';
                });
                html += '</g><g class="nodes">';
                node.children.forEach(function (c) {
                    html += renderNode(c, node.x, node.y);
                });
                html += '</g></g>';
            }

            // pill: sized to text after render (sizePills); 父节点随深度:字号/padding/字距/颜色均递减(根最大最深)
            var padX = hasKids ? Math.max(12, 40 - node.depth * 6) : 15;
            var fs = hasKids ? Math.max(14, 30 - node.depth * 6) : 13;
            var ls = hasKids ? Math.max(0, 4 - node.depth) : 0;
            html += '<rect class="' + bubbleCls + '" x="-40" y="-15" width="80" height="30" rx="15" fill="' + fill + '" data-pad="' + padX + '"/>';
            var tstyle = hasKids ? ' style="font-size:' + fs + 'px;letter-spacing:' + ls + 'px"' : "";
            html += '<text class="' + lblCls + '"' + tstyle + ' x="0" y="1" text-anchor="middle" dominant-baseline="central">' + escapeXml(node.title) + '</text>';
            html += "</g>";
            return html;
        }

        function sizePills() {
            var rects = svg.querySelectorAll("rect.bubble");
            for (var i = 0; i < rects.length; i++) {
                var rect = rects[i];
                var text = rect.nextElementSibling;
                if (!text || text.tagName.toLowerCase() !== "text") continue;
                var bb = text.getBBox();
                if (!bb.width) continue;
                var padAttr = rect.getAttribute("data-pad");
                var padX = padAttr != null ? parseFloat(padAttr) : 15, padY = 7;
                var w = bb.width + padX * 2, h = bb.height + padY * 2;
                rect.setAttribute("x", (-w / 2).toFixed(1));
                rect.setAttribute("y", (-h / 2).toFixed(1));
                rect.setAttribute("width", w.toFixed(1));
                rect.setAttribute("height", h.toFixed(1));
                rect.setAttribute("rx", (h / 2).toFixed(1));
            }
        }
        function isRootOf(rect) { return rect.classList.contains("root"); }

        var root = null;
        var svg = document.getElementById("mindmap");
        var selectedId = null;
        var nextId = 1;

        function assignIds(node, parent) {
            node._id = nextId++;
            node._parent = parent;
            if (node.children) node.children.forEach(function (c) { assignIds(c, node); });
        }
        function findNode(id, n) {
            n = n || root;
            if (n._id === id) return n;
            if (n.children) for (var i = 0; i < n.children.length; i++) { var r = findNode(id, n.children[i]); if (r) return r; }
            return null;
        }
        function isLeaf(n) { return !n.children || !n.children.length; }

        // —— 视图：滚轮缩放、拖拽平移、双击复位 ——
        var homeBox = null;      // 内容自适应视图（缩放下限/复位基准）
        var interacted = false;  // 用户已缩放或平移则禁止字体就绪时覆盖
        function getView() {
            var v = (svg.getAttribute("viewBox") || "").split(" ");
            if (v.length < 4) return null;
            v = v.map(parseFloat);
            if (v.some(isNaN)) return null;
            return { x: v[0], y: v[1], w: v[2], h: v[3] };
        }
        function setView(v) { svg.setAttribute("viewBox", v.x + " " + v.y + " " + v.w + " " + v.h); }
        function fitView() {
            var cb = svg.getBBox();
            if (!cb.width || !cb.height) return;
            var pad = 30;
            homeBox = { x: cb.x - pad, y: cb.y - pad, w: cb.width + pad * 2, h: cb.height + pad * 2 };
            setView(homeBox);
            interacted = false;
        }
        function clampView(v) {
            if (!homeBox) return v;
            var maxW = homeBox.w, maxH = homeBox.h;
            var minW = maxW / 20, minH = maxH / 20;
            v.w = Math.min(maxW, Math.max(minW, v.w));
            v.h = Math.min(maxH, Math.max(minH, v.h));
            // 平移缓冲：整屏余地，放大后内容也不易贴边消失
            v.x = Math.min(homeBox.x + homeBox.w, Math.max(homeBox.x - v.w, v.x));
            v.y = Math.min(homeBox.y + homeBox.h, Math.max(homeBox.y - v.h, v.y));
            return v;
        }
        svg.addEventListener("wheel", function (e) {
            e.preventDefault();
            var v = getView(); if (!v || !homeBox) return;
            interacted = true;
            var rect = svg.getBoundingClientRect();
            var mx = v.x + (e.clientX - rect.left) / rect.width * v.w;
            var my = v.y + (e.clientY - rect.top) / rect.height * v.h;
            var s = e.deltaY < 0 ? 0.88 : 1.14;
            var nv = clampView({ x: mx - (mx - v.x) * s, y: my - (my - v.y) * s, w: v.w * s, h: v.h * s });
            setView(nv);
        }, { passive: false });

        var pan = { active: false, moved: false, x: 0, y: 0, vx: 0, vy: 0, w: 0, h: 0 };
        svg.addEventListener("mousedown", function (e) {
            var v = getView(); if (!v) return;
            pan.active = true; pan.moved = false;
            pan.x = e.clientX; pan.y = e.clientY;
            pan.vx = v.x; pan.vy = v.y; pan.w = v.w; pan.h = v.h;
        });
        window.addEventListener("mousemove", function (e) {
            if (!pan.active) return;
            var rect = svg.getBoundingClientRect();
            var dx = e.clientX - pan.x, dy = e.clientY - pan.y;
            if (!pan.moved && Math.hypot(dx, dy) > 4) { pan.moved = true; svg.classList.add("panning"); interacted = true; }
            if (!pan.moved) return;
            var nv = clampView({ x: pan.vx - dx / rect.width * pan.w, y: pan.vy - dy / rect.height * pan.h, w: pan.w, h: pan.h });
            setView(nv);
        });
        window.addEventListener("mouseup", function () { pan.active = false; svg.classList.remove("panning"); });
        svg.addEventListener("dblclick", function (e) {
            if (e.target.closest(".bubble")) return;
            fitView();
        });

        function render(rootNode) {
            cursor.y = TOP;
            maxDepth = 0;
            layout(rootNode, 0);
            svg.innerHTML = renderNode(rootNode, 0, 0);
            sizePills();
            if (!svg.getAttribute("viewBox")) {
                var width = LEFT + maxDepth * LEVEL_X + 240;
                var height = cursor.y + 40;
                svg.setAttribute("viewBox", "0 0 " + width + " " + height);
            }
            requestAnimationFrame(function () { sizePills(); svg.classList.add("ready"); });
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizePills);
            applyState();
        }
        function applyState() {
            var prev = svg.querySelector(".node.selected");
            if (prev) prev.classList.remove("selected");
            if (selectedId != null) {
                var sg = svg.querySelector('[data-id="' + selectedId + '"]');
                if (sg) sg.classList.add("selected");
            }
            updatePanel();
        }

        var panel = document.getElementById("editor");
        var selInfo = document.getElementById("selInfo");
        var selTitle = document.getElementById("selTitle");
        var selStatus = document.getElementById("selStatus");
        var btnAddChild = document.getElementById("btnAddChild");
        var btnDelete = document.getElementById("btnDelete");
        var btnCollapse = document.getElementById("btnCollapse");
        var btnMoveUp = document.getElementById("btnMoveUp");
        var btnMoveDown = document.getElementById("btnMoveDown");

        function updatePanel() {
            var n = selectedId == null ? null : findNode(selectedId);
            if (!n) { panel.style.display = "none"; return; }
            panel.style.display = "";
            var kind = n === root ? "根节点" : (isLeaf(n) ? "叶子任务" : "父节点");
            var chain = n._parent ? " · 上级：" + n._parent.title : "";
            selInfo.textContent = kind + chain;
            if (document.activeElement !== selTitle) selTitle.value = n.title || "";
            var leaf = isLeaf(n);
            selStatus.style.display = leaf ? "" : "none";
            if (leaf && document.activeElement !== selStatus) selStatus.value = n.status || "todo";
            btnAddChild.disabled = false;
            btnDelete.disabled = (n === root);
            btnCollapse.style.display = leaf ? "none" : "";
            var isRoot = n === root;
            var sibs = isRoot ? null : n._parent.children;
            var idx = sibs ? sibs.indexOf(n) : -1;
            btnMoveUp.disabled = isRoot || idx <= 0;
            btnMoveDown.disabled = isRoot || idx < 0 || idx >= sibs.length - 1;
        }

        selTitle.addEventListener("input", function () {
            var n = findNode(selectedId);
            if (!n) return;
            n.title = selTitle.value;
            render(root);
        });
        selStatus.addEventListener("change", function () {
            var n = findNode(selectedId);
            if (!n || !isLeaf(n)) return;
            n.status = selStatus.value;
            render(root);
        });
        btnAddChild.addEventListener("click", function () {
            var n = findNode(selectedId);
            if (!n) return;
            n.children = n.children || [];
            var child = { title: "新节点", status: "todo", _parent: n, _id: nextId++ };
            n.children.push(child);
            selectedId = child._id;
            render(root);
            selTitle.focus();
            selTitle.select();
        });
        btnDelete.addEventListener("click", function () {
            var n = findNode(selectedId);
            if (!n || n === root) return;
            var p = n._parent;
            var i = p.children.indexOf(n);
            if (i >= 0) p.children.splice(i, 1);
            selectedId = p._id;
            render(root);
        });
        btnCollapse.addEventListener("click", function () {
            var n = findNode(selectedId);
            if (!n || isLeaf(n)) return;
            n.collapsed = !n.collapsed;
            render(root);
        });

        // 交换当前选中节点与上一个/下一个同级节点（dir=-1 上移，dir=+1 下移）
        function swapSibling(dir) {
            var n = findNode(selectedId);
            if (!n || n === root) return false;
            var p = n._parent;
            var i = p.children.indexOf(n);
            var j = i + dir;
            if (j < 0 || j >= p.children.length) return false;
            p.children[i] = p.children[j];
            p.children[j] = n;
            render(root);
            return true;
        }
        // Alt+↑/↓：交换同级顺序（新增节点后即可使用）
        document.addEventListener("keydown", function (e) {
            if (!e.altKey) return;
            if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
            if (swapSibling(e.key === "ArrowUp" ? -1 : 1)) e.preventDefault();
        });
        btnMoveUp.addEventListener("click", function () { swapSibling(-1); });
        btnMoveDown.addEventListener("click", function () { swapSibling(1); });

        function cleanNode(n) {
            var o = { title: n.title };
            if (n.status && isLeaf(n)) o.status = n.status;
            if (n.prio) o.prio = n.prio;
            if (n.due) o.due = n.due;
            if (n.note) o.note = n.note;
            if (n.collapsed && n.children && n.children.length) o.collapsed = true;
            if (n.children && n.children.length) o.children = n.children.map(cleanNode);
            return o;
        }
        // ── 模式：'enc' 读密文 todo_list.enc（需口令）· 'plain' 回退明文 todo_list.json ──
        var ENC_URL = "/assets/data/todo_list.enc";
        var PLAIN_URL = "/assets/data/todo_list.json";
        var ENVELOPE_URL = "/assets/data/key.envelope";
        var MODE = null;
        var dek = null;         // 解锁后仅驻内存，不写任何存储
        var pendingEnc = null;  // 探测阶段读到的密文，解锁时复用，避免重复请求

        function download(name, text, mime) {
            var blob = new Blob([text], { type: mime || "text/plain" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }
        function cleanJson() { return JSON.stringify(cleanNode(root), null, 2); }

        function adopt(text) {
            root = JSON.parse(text.replace(/,\s*([}\]])/g, "$1"));
            nextId = 1;
            assignIds(root, null);
            selectedId = root._id;
            interacted = false;
            render(root);
            requestAnimationFrame(fitView);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!interacted) fitView(); });
        }

        function applyMode() {
            var isEnc = MODE === "enc";
            document.getElementById("notice").style.display = isEnc ? "none" : "";
            document.getElementById("btnExport").textContent = isEnc ? "导出 .enc" : "导出明文 JSON";
            document.getElementById("btnPlain").style.display = isEnc ? "" : "none";
            document.getElementById("hintTail").textContent = isEnc
                ? "（assets/data/todo_list.enc）"
                : "（当前明文模式：assets/data/todo_list.json）";
        }

        async function boot() {
            try {
                var r = await fetch(ENC_URL, { cache: "no-store" });
                if (r.ok) pendingEnc = await r.text();
            } catch (e) { /* 网络异常按「无密文」处理，走明文回退 */ }
            if (pendingEnc) {
                MODE = "enc";
                document.body.classList.add("locked");
                applyMode();
                document.getElementById("pw").focus();
                return;
            }
            var plainText = null;
            try {
                var r2 = await fetch(PLAIN_URL, { cache: "no-store" });
                if (r2.ok) plainText = await r2.text();
            } catch (e) { /* 同上 */ }
            if (plainText) {
                MODE = "plain";
                applyMode();
                try { adopt(plainText); }
                catch (e) { svg.textContent = "待办数据解析失败：" + e.message; }
                return;
            }
            svg.textContent = "未找到待办数据：todo_list.enc 与 todo_list.json 均不可读";
        }

        async function unlock() {
            var pwEl = document.getElementById("pw");
            var st = document.getElementById("lockStatus");
            if (!pwEl.value) { st.className = "lock-status error"; st.textContent = "请输入口令"; return; }
            st.className = "lock-status";
            st.textContent = "正在派生密钥（PBKDF2 60 万迭代）…";
            try {
                var env = JSON.parse(await window.DiaryCrypto.fetchText(ENVELOPE_URL));
                dek = await window.DiaryCrypto.openEnvelope(pwEl.value, env);
            } catch (e) {
                dek = null;
                st.className = "lock-status error";
                st.textContent = "口令错误（或信封文件损坏）";
                return;
            }
            try {
                var ct = pendingEnc || await window.DiaryCrypto.fetchText(ENC_URL);
                adopt(await window.DiaryCrypto.decryptData(dek, ct));
            } catch (e) {
                dek = null;
                st.className = "lock-status error";
                st.textContent = "密文解密失败：" + (e.message || e);
                return;
            }
            pwEl.value = "";
            st.textContent = "";
            document.body.classList.remove("locked");
        }
        document.getElementById("unlockBtn").addEventListener("click", unlock);
        document.getElementById("pw").addEventListener("keydown", function (e) {
            if (e.key === "Enter") unlock();
        });

        // 明文 → 密文迁移：口令解信封拿 DEK（与日志同一信封、同一口令）
        async function migrate() {
            var msg = document.getElementById("noticeMsg");
            var pwEl = document.getElementById("migratePw");
            if (!pwEl.value) { msg.textContent = "请输入口令"; return; }
            msg.textContent = "正在派生密钥（PBKDF2 60 万迭代）…";
            if (!dek) {
                try {
                    var env = JSON.parse(await window.DiaryCrypto.fetchText(ENVELOPE_URL));
                    dek = await window.DiaryCrypto.openEnvelope(pwEl.value, env);
                } catch (e) {
                    msg.textContent = "口令错误（或信封文件损坏），请重试";
                    return;
                }
            }
            pwEl.value = "";
            try {
                download("todo_list.enc", await window.DiaryCrypto.encryptData(dek, cleanJson()));
            } catch (e) {
                msg.textContent = "生成密文失败：" + (e.message || e);
                return;
            }
            document.getElementById("migrateRow").style.display = "none";
            msg.innerHTML = "<strong>已生成 todo_list.enc</strong>：放入 <code>assets/data/</code>，随后删除 <code>todo_list.json</code> 并提交；上线后本页自动进入加密模式。";
        }
        document.getElementById("btnMigrate").addEventListener("click", function () {
            document.getElementById("migrateRow").style.display = "";
            document.getElementById("migratePw").focus();
        });
        document.getElementById("migrateGo").addEventListener("click", migrate);
        document.getElementById("migratePw").addEventListener("keydown", function (e) {
            if (e.key === "Enter") migrate();
        });

        document.getElementById("btnExport").addEventListener("click", async function () {
            if (MODE !== "enc" || !dek) { download("todo_list.json", cleanJson(), "application/json"); return; }
            try {
                download("todo_list.enc", await window.DiaryCrypto.encryptData(dek, cleanJson()));
            } catch (e) {
                svg.textContent = "导出密文失败：" + (e.message || e);
            }
        });
        document.getElementById("btnPlain").addEventListener("click", function () {
            download("todo_list.json", cleanJson(), "application/json");
        });
        document.getElementById("btnReset").addEventListener("click", function () {
            if (MODE === "enc" && dek) {
                window.DiaryCrypto.fetchText(ENC_URL)
                    .then(function (t) { return window.DiaryCrypto.decryptData(dek, t); })
                    .then(adopt)
                    .catch(function (e) { svg.textContent = "重载失败：" + (e.message || e); });
            } else {
                boot();
            }
        });

        function toggleCollapse(n) {
            n.collapsed = !n.collapsed;
            var g = svg.querySelector('[data-id="' + n._id + '"]');
            if (g) g.classList.toggle("collapsed");
        }
        svg.addEventListener("click", function (e) {
            if (pan.moved) return;  // 本次为拖拽平移，不触发选择
            var bubble = e.target.closest(".bubble");
            if (!bubble) return;
            var node = bubble.closest(".node");
            selectedId = parseInt(node.getAttribute("data-id"), 10);
            if (bubble.classList.contains("parent") || bubble.classList.contains("root")) {
                var n = findNode(selectedId);
                if (n) toggleCollapse(n);
            }
            applyState();
        });
        svg.addEventListener("mouseover", function (e) {
            var bubble = e.target.closest(".bubble.parent, .bubble.root");
            if (!bubble) return;
            bubble.closest(".node").classList.add("lit");
        });
        svg.addEventListener("mouseout", function (e) {
            var bubble = e.target.closest(".bubble.parent, .bubble.root");
            if (!bubble) return;
            bubble.closest(".node").classList.remove("lit");
        });

        boot();
    })();
    </script>
<script src="/assets/js/last-updated.js" data-corner="top-right"></script>
</body>
