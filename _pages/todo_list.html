<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办清单</title>
    <style>
        :root {
            --bg: #f7f8fa;
            --text: #1f2329;
            --text-muted: #6b7280;
            --todo: #9ca3af;
            --doing: #f59e0b;
            --done: #16a34a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }
        h1 { font-size: 1.2em; margin: 0 0 2px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin: 0 0 14px; }
        a.home {
            display: inline-block;
            margin-bottom: 12px;
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
        }
        a.home:hover { text-decoration: underline; }

        svg.mindmap { display: block; width: 100%; height: auto; user-select: none; }

        /* connectors */
        .link {
            fill: none;
            stroke: #c7ccd4;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;
            transition: stroke-dashoffset .7s ease, stroke .2s, stroke-width .2s;
        }
        .ready .link { stroke-dashoffset: 0; }
        .node.lit > .kids > .links > .link { stroke: #6366f1; stroke-width: 2.6; }

        /* bubbles */
        .bubble {
            cursor: default;
            transform-box: fill-box;
            transform-origin: center;
            transition: r .18s ease, filter .2s ease;
            opacity: 0;
            transition: opacity .5s ease, r .18s ease, filter .2s ease;
        }
        .ready .bubble { opacity: 1; }
        .bubble.parent, .bubble.root { cursor: pointer; }
        .bubble.parent:hover, .bubble.root:hover {
            filter: drop-shadow(0 2px 6px rgba(99,102,241,.45));
        }
        .node.collapsed > .bubble { stroke-dasharray: 3 3; }
        .node.leaf.done .lbl { text-decoration: line-through; fill: var(--text-muted); }

        /* labels */
        .lbl {
            font-size: 13px;
            fill: var(--text);
            pointer-events: none;
            opacity: 0;
            transition: opacity .5s ease;
        }
        .ready .lbl { opacity: 1; }
        .bubble + .lbl-on { fill: #fff; font-weight: 700; font-size: 12px; }

        /* root pulse halo */
        .halo {
            fill: #2563eb;
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
        }
        .ready .halo { animation: pulse 2.6s ease-out infinite; }
        @keyframes pulse {
            0%   { opacity: .35; transform: scale(1); }
            70%  { opacity: 0;   transform: scale(1.7); }
            100% { opacity: 0;   transform: scale(1.7); }
        }

        /* collapse animation */
        .kids {
            transform-box: view-box;
            transform-origin: 0 0;
            transition: opacity .32s ease, transform .32s ease;
        }
        .node.collapsed > .kids {
            opacity: 0;
            transform: scale(.4);
            pointer-events: none;
        }
        .legend {
            display: flex; gap: 16px; flex-wrap: wrap;
            font-size: 12px; color: var(--text-muted);
            margin-top: 12px; padding: 0 6px;
        }
        .legend span { display: inline-flex; align-items: center; gap: 5px; }
        .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
        .legend .i-todo { background: var(--todo); }
        .legend .i-doing { background: var(--doing); }
        .legend .i-done { background: var(--done); }
        .legend .hint { margin-left: auto; }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="/" class="home">&larr; 返回首页</a>
        <h1>待办清单</h1>
        <p class="subtitle">点击圆形节点展开 / 收起子节点。源码 <code>tasks</code> 树中改叶子 <code>status</code> 即更新</p>

        <svg class="mindmap" id="mindmap" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="legend">
            <span><i class="i-todo"></i>待办</span>
            <span><i class="i-doing"></i>进行中</span>
            <span><i class="i-done"></i>已完成</span>
            <span class="hint">圆节点可点击折叠</span>
        </div>
    </div>

    <script>
    (function () {
        // ============================================================
        //  待办数据（树状）：在此增删节点
        //  · 父节点：{ title, children:[...] }
        //  · 叶子任务：{ title, status }，可选 prio/due/note
        //  · status：'todo' / 'doing' / 'done'
        // ============================================================
        var tasks = [
            {
                title: "搬迁方面",
                children: [
                    { title: "收拾行李",       status: "todo", prio: "high", due: "2026-08-30", note: "先打包非必需物品" },
                    { title: "公寓申请退房",   status: "todo", due: "2026-08-25", note: "联系物业提交退房申请" },
                    { title: "路由器退还",     status: "todo", note: "宽带运营商归还设备" },
                    { title: "电竞桌打包",     status: "todo" },
                    { title: "显示器打包",     status: "todo", note: "原装箱+气泡膜" },
                    { title: "电脑主机打包",   status: "todo", prio: "high", note: "防震填充" },
                    { title: "快递寄送",       status: "todo", due: "2026-08-28", note: "预约上门取件" }
                ]
            },
            {
                title: "工作方面",
                children: [
                    { title: "HYPIR模型编译",        status: "todo", prio: "high" },
                    { title: "人脸增强任务转测",     status: "todo" },
                    { title: "人体微动任务探索",     status: "todo", note: "调研+方案设计" },
                    { title: "新视界端侧服务修改",   status: "todo" },
                    { title: "新视界云侧服务部署",   status: "todo", note: "联调环境" }
                ]
            }
        ];

        var STATUS = { todo: "#9ca3af", doing: "#f59e0b", done: "#16a34a" };

        var LEVEL_X = 210;   // 列间距
        var LEAF_GAP = 40;   // 叶子纵向间距
        var TOP = 50;
        var LEFT = 70;
        var cursor = { y: TOP };

        function layout(node, depth) {
            node.depth = depth;
            node.x = LEFT + depth * LEVEL_X;
            if (node.children && node.children.length) {
                node.children.forEach(function (c) { layout(c, depth + 1); });
                var ys = node.children.map(function (c) { return c.y; });
                node.y = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
            } else {
                node.y = cursor.y;
                cursor.y += LEAF_GAP;
            }
        }

        function escapeXml(s) {
            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function linkPath(x1, y1, x2, y2) {
            var mx = (x1 + x2) / 2;
            return "M " + x1 + " " + y1 + " C " + mx + " " + y1 + ", " + mx + " " + y2 + ", " + x2 + " " + y2;
        }

        function renderNode(node, parentX, parentY) {
            var lx = node.x - parentX;
            var ly = node.y - parentY;
            var isRoot = node.depth === 0;
            var isLeaf = !node.children || !node.children.length;
            var hasKids = !isLeaf;
            var status = node.status || "todo";
            var color = STATUS[status] || STATUS.todo;

            var r = isRoot ? 36 : (isLeaf ? 8 : 28);
            var cls = "bubble" + (isRoot ? " root" : (isLeaf ? " leaf" : " parent"));
            var fill = isRoot ? "url(#g-root)" : (isLeaf ? color : "url(#g-branch)");
            var stroke = isLeaf ? "#fff" : "none";
            var nodeCls = "node" + (isLeaf ? " leaf " + status : "") + (hasKids ? " parent" : "");

            var html = '<g class="' + nodeCls + '" transform="translate(' + lx + "," + ly + ')">';

            if (isRoot) html += '<circle class="halo" r="' + (r + 2) + '"/>';

            if (hasKids) {
                html += '<g class="kids">';
                html += '<g class="links">';
                node.children.forEach(function (c) {
                    var clx = c.x - node.x;
                    var cly = c.y - node.y;
                    html += '<path class="link" d="' + linkPath(0, 0, clx, cly) + '"/>';
                });
                html += '</g>';
                html += '<g class="nodes">';
                node.children.forEach(function (c) {
                    html += renderNode(c, node.x, node.y);
                });
                html += '</g>';
                html += '</g>';
            }

            html += '<circle class="' + cls + '" r="' + r + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>';

            if (isLeaf) {
                html += '<text class="lbl" x="' + (r + 10) + '" y="4">' + escapeXml(node.title) + "</text>";
            } else {
                html += '<text class="lbl lbl-on" x="0" y="4" text-anchor="middle">' + escapeXml(node.title) + "</text>";
            }
            html += "</g>";
            return html;
        }

        var root = { title: "待办清单", children: tasks };
        layout(root, 0);
        var width = LEFT + 2 * LEVEL_X + 230;
        var height = cursor.y + 40;

        var svg = document.getElementById("mindmap");
        svg.setAttribute("viewBox", "0 0 " + width + " " + height);
        svg.innerHTML =
              '<defs>'
            + '<radialGradient id="g-root" cx="35%" cy="30%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/></radialGradient>'
            + '<radialGradient id="g-branch" cx="35%" cy="30%"><stop offset="0%" stop-color="#a5b4fc"/><stop offset="100%" stop-color="#6366f1"/></radialGradient>'
            + '</defs>'
            + renderNode(root, 0, 0);

        requestAnimationFrame(function () {
            svg.classList.add("ready");
        });

        svg.addEventListener("click", function (e) {
            var bubble = e.target.closest(".bubble.parent, .bubble.root");
            if (!bubble) return;
            bubble.closest(".node").classList.toggle("collapsed");
        });

        svg.addEventListener("mouseover", function (e) {
            var bubble = e.target.closest(".bubble.parent, .bubble.root");
            if (!bubble) return;
            bubble.closest(".node").classList.add("lit");
        });
        svg.addEventListener("mouseout", function (e) {
            var bubble = e.target.closest(".bubble.parent, .bubble.root");
            if (!bubble) return;
            bubble.closest(".node").classList.remove("lit");
        });
    })();
    </script>
</body>
</html>
