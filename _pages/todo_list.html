<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办清单</title>
    <style>
        :root {
            --bg: #f7f8fa;
            --text: #1f2329;
            --text-muted: #6b7280;
            --todo: #9ca3af;
            --doing: #f59e0b;
            --done: #16a34a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }
        h1 { font-size: 1.2em; margin: 0 0 2px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin: 0 0 14px; }
        a.home {
            display: inline-block;
            margin-bottom: 12px;
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
        }
        a.home:hover { text-decoration: underline; }

        svg.mindmap { display: block; width: 100%; height: auto; user-select: none; }

        /* connectors */
        .link {
            fill: none;
            stroke: #c7ccd4;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;
            transition: stroke-dashoffset .7s ease, stroke .2s, stroke-width .2s;
        }
        .ready .link { stroke-dashoffset: 0; }
        .node.lit > .kids > .links > .link { stroke: #6366f1; stroke-width: 2.6; }

        /* nodes (rounded pills) */
        .bubble {
            cursor: default;
            opacity: 0;
            transition: opacity .5s ease, stroke-width .18s ease, fill .2s ease;
        }
        .ready .bubble { opacity: 1; }
        .bubble.parent, .bubble.root { cursor: pointer; }
        .bubble.parent:hover, .bubble.root:hover { stroke: #ffffff; stroke-width: 2.5; }
        .node.collapsed > .bubble { stroke: #d1d5db; stroke-dasharray: 3 3; }
        .node.leaf.done .lbl { text-decoration: line-through; opacity: .55; }

        /* labels */
        .lbl {
            font-size: 13px;
            fill: #ffffff;
            pointer-events: none;
            opacity: 0;
            transition: opacity .5s ease;
        }
        .ready .lbl { opacity: 1; }
        .lbl.root { font-size: 15px; font-weight: 800; }
        .lbl.lbl-on { font-weight: 700; }

        /* collapse animation */
        .kids {
            transform-box: view-box;
            transform-origin: 0 0;
            transition: opacity .32s ease, transform .32s ease;
        }
        .node.collapsed > .kids {
            opacity: 0;
            transform: scale(.4);
            pointer-events: none;
        }
        .legend {
            display: flex; gap: 16px; flex-wrap: wrap;
            font-size: 12px; color: var(--text-muted);
            margin-top: 12px; padding: 0 6px;
        }
        .legend span { display: inline-flex; align-items: center; gap: 5px; }
        .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
        .legend .i-todo { background: var(--todo); }
        .legend .i-doing { background: var(--doing); }
        .legend .i-done { background: var(--done); }
        .legend .hint { margin-left: auto; }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="/" class="home">&larr; 返回首页</a>
        <h1>待办清单</h1>
        <p class="subtitle">点击圆形节点展开 / 收起子节点。源码 <code>tasks</code> 树中改叶子 <code>status</code> 即更新</p>

        <svg class="mindmap" id="mindmap" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="legend">
            <span><i class="i-todo"></i>待办</span>
            <span><i class="i-doing"></i>进行中</span>
            <span><i class="i-done"></i>已完成</span>
            <span class="hint">圆节点可点击折叠</span>
        </div>
    </div>

    <script>
    (function () {
        // ============================================================
        //  待办数据（树状）：在此增删节点
        //  · 父节点：{ title, children:[...] }
        //  · 叶子任务：{ title, status }，可选 prio/due/note
        //  · status：'todo' / 'doing' / 'done'
        // ============================================================
        var tasks = [
            {
                title: "生活方面",
                children: [
                    { title: "收拾行李",       status: "todo", prio: "high", due: "2026-08-30", note: "先打包非必需物品" },
                    { title: "公寓申请退房",   status: "todo", due: "2026-08-25", note: "联系物业提交退房申请" },
                    { title: "路由器退还",     status: "todo", note: "宽带运营商归还设备" },
                    { title: "电竞桌打包",     status: "todo" },
                    { title: "显示器打包",     status: "todo", note: "原装箱+气泡膜" },
                    { title: "电脑主机打包",   status: "todo", prio: "high", note: "防震填充" },
                    { title: "快递寄送",       status: "todo", due: "2026-08-28", note: "预约上门取件" }
                ]
            },
            {
                title: "工作方面",
                children: [
                    {
                        title: "人脸增强模块",
                        children: [
                            { title: "HYPIR模型复现",   status: "done" },
                            { title: "退化数据集构建",   status: "done" },
                            { title: "美颜数据集构建",   status: "done" },
                            { title: "模型训练",         status: "done" },
                            { title: "自测实验报告",     status: "done" },
                            { title: "转测邮件",         status: "done" }
                        ]
                    },
                    {
                        title: "人脸微动模块",
                        children: [
                            { title: "论文调研与探索", status: "todo" },
                            { title: "实习生安排",     status: "todo" }
                        ]
                    },
                    {
                        title: "去噪重建模块",
                        children: [
                            { title: "端侧稠密重建算法卡片", status: "done" },
                            { title: "端侧去噪重建算法卡片", status: "done" },
                            { title: "端侧路由配置",         status: "done" },
                            { title: "云侧docker-compose",   status: "done" },
                            { title: "云侧端到端脚本",       status: "todo" },
                            { title: "端云接口对齐",         status: "todo" },
                            { title: "云侧算法查询回调",     status: "todo" }
                        ]
                    }
                ]
            }
        ];

        var STATUS = { todo: "#9ca3af", doing: "#f59e0b", done: "#16a34a" };

        var LEVEL_X = 210;   // 列间距
        var LEAF_GAP = 40;   // 叶子纵向间距
        var TOP = 50;
        var LEFT = 70;
        var cursor = { y: TOP };
        var maxDepth = 0;

        function layout(node, depth) {
            node.depth = depth;
            node.x = LEFT + depth * LEVEL_X;
            if (depth > maxDepth) maxDepth = depth;
            if (node.children && node.children.length) {
                node.children.forEach(function (c) { layout(c, depth + 1); });
                var ys = node.children.map(function (c) { return c.y; });
                node.y = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
            } else {
                node.y = cursor.y;
                cursor.y += LEAF_GAP;
            }
        }

        function escapeXml(s) {
            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function linkPath(x1, y1, x2, y2) {
            var mx = (x1 + x2) / 2;
            return "M " + x1 + " " + y1 + " C " + mx + " " + y1 + ", " + mx + " " + y2 + ", " + x2 + " " + y2;
        }

        function renderNode(node, parentX, parentY) {
            var lx = node.x - parentX;
            var ly = node.y - parentY;
            var isRoot = node.depth === 0;
            var isLeaf = !node.children || !node.children.length;
            var hasKids = !isLeaf;
            var status = node.status || "todo";
            var color = STATUS[status] || STATUS.todo;

            var fill = isRoot ? "#2563eb" : (isLeaf ? color : "#6366f1");
            var nodeCls = "node" + (isLeaf ? " leaf " + status : "") + (hasKids ? " parent" : "");
            var bubbleCls = "bubble" + (isRoot ? " root" : (isLeaf ? " leaf" : " parent"));
            var lblCls = "lbl" + (isRoot ? " root" : (hasKids ? " lbl-on" : ""));

            var html = '<g class="' + nodeCls + '" transform="translate(' + lx + "," + ly + ')">';

            if (hasKids) {
                html += '<g class="kids"><g class="links">';
                node.children.forEach(function (c) {
                    var clx = c.x - node.x;
                    var cly = c.y - node.y;
                    html += '<path class="link" d="' + linkPath(0, 0, clx, cly) + '"/>';
                });
                html += '</g><g class="nodes">';
                node.children.forEach(function (c) {
                    html += renderNode(c, node.x, node.y);
                });
                html += '</g></g>';
            }

            // pill: sized to text after render (sizePills)
            html += '<rect class="' + bubbleCls + '" x="-40" y="-15" width="80" height="30" rx="15" fill="' + fill + '"/>';
            html += '<text class="' + lblCls + '" x="0" y="1" text-anchor="middle" dominant-baseline="central">' + escapeXml(node.title) + '</text>';
            html += "</g>";
            return html;
        }

        function sizePills() {
            var rects = svg.querySelectorAll("rect.bubble");
            for (var i = 0; i < rects.length; i++) {
                var rect = rects[i];
                var text = rect.nextElementSibling;
                if (!text || text.tagName.toLowerCase() !== "text") continue;
                var bb = text.getBBox();
                if (!bb.width) continue;
                var padX = isRootOf(rect) ? 20 : 15, padY = 7;
                var w = bb.width + padX * 2, h = bb.height + padY * 2;
                rect.setAttribute("x", (-w / 2).toFixed(1));
                rect.setAttribute("y", (-h / 2).toFixed(1));
                rect.setAttribute("width", w.toFixed(1));
                rect.setAttribute("height", h.toFixed(1));
                rect.setAttribute("rx", (h / 2).toFixed(1));
            }
            var cb = svg.getBBox();
            if (cb.width && cb.height) {
                var pad = 30;
                svg.setAttribute("viewBox", (cb.x - pad) + " " + (cb.y - pad) + " " + (cb.width + pad * 2) + " " + (cb.height + pad * 2));
            }
        }
        function isRootOf(rect) { return rect.classList.contains("root"); }

        var root = { title: "待办清单", children: tasks };
        layout(root, 0);
        var width = LEFT + maxDepth * LEVEL_X + 240;
        var height = cursor.y + 40;

        var svg = document.getElementById("mindmap");
        svg.setAttribute("viewBox", "0 0 " + width + " " + height);
        svg.innerHTML = renderNode(root, 0, 0);

        sizePills();
        requestAnimationFrame(function () {
            sizePills();
            svg.classList.add("ready");
        });

        svg.addEventListener("click", function (e) {
            var bubble = e.target.closest(".bubble.parent, .bubble.root");
            if (!bubble) return;
            bubble.closest(".node").classList.toggle("collapsed");
        });

        svg.addEventListener("mouseover", function (e) {
            var bubble = e.target.closest(".bubble.parent, .bubble.root");
            if (!bubble) return;
            bubble.closest(".node").classList.add("lit");
        });
        svg.addEventListener("mouseout", function (e) {
            var bubble = e.target.closest(".bubble.parent, .bubble.root");
            if (!bubble) return;
            bubble.closest(".node").classList.remove("lit");
        });
    })();
    </script>
</body>
</html>
