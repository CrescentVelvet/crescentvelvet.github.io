layout: null
title: "待办清单"
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办清单</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f8fa;
            --text: #1f2329;
            --text-muted: #6b7280;
            --todo: #64748b;
            --doing: #ea580c;
            --done: #16a34a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }
        h1 { font-size: 1.2em; margin: 0 0 2px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin: 0 0 14px; }
        a.home {
            display: inline-block;
            margin-bottom: 12px;
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
        }
        a.home:hover { text-decoration: underline; }

        svg.mindmap { display: block; width: 100%; height: auto; user-select: none; }

        /* connectors */
        .link {
            fill: none;
            stroke: #c7ccd4;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;
            transition: stroke-dashoffset .7s ease, stroke .2s, stroke-width .2s;
        }
        .ready .link { stroke-dashoffset: 0; }
        .node.lit > .kids > .links > .link { stroke: #6366f1; stroke-width: 2.6; }

        /* nodes (rounded pills) */
        .bubble {
            cursor: default;
            opacity: 0;
            transition: opacity .5s ease, stroke-width .18s ease, fill .2s ease;
        }
        .ready .bubble { opacity: 1; }
        .bubble.parent, .bubble.root { cursor: pointer; }
        .bubble.parent:hover, .bubble.root:hover { stroke: #ffffff; stroke-width: 2.5; }
        .node.collapsed > .bubble { stroke: #d1d5db; stroke-dasharray: 3 3; }
        .node.leaf.done .lbl { text-decoration: line-through; opacity: .55; }

        /* labels */
        .lbl {
            font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
            font-size: 13px;
            fill: #ffffff;
            pointer-events: none;
            opacity: 0;
            transition: opacity .5s ease;
        }
        .ready .lbl { opacity: 1; }
        .lbl.root { font-family: 'ZCOOL QingKe HuangYou', 'DotGothic16', monospace; font-size: 17px; font-weight: 400; }
        .lbl.lbl-on { font-family: 'ZCOOL QingKe HuangYou', 'DotGothic16', monospace; font-size: 15px; font-weight: 400; }

        /* collapse animation */
        .kids {
            transform-box: view-box;
            transform-origin: 0 0;
            transition: opacity .32s ease, transform .32s ease;
        }
        .node.collapsed > .kids {
            opacity: 0;
            transform: scale(.4);
            pointer-events: none;
        }
        .legend {
            display: flex; gap: 16px; flex-wrap: wrap;
            font-size: 12px; color: var(--text-muted);
            margin-top: 12px; padding: 0 6px;
        }
        .legend span { display: inline-flex; align-items: center; gap: 5px; }
        .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
        .legend .i-todo { background: var(--todo); }
        .legend .i-doing { background: var(--doing); }
        .legend .i-done { background: var(--done); }
        .legend .hint { margin-left: auto; }

        /* selected node + editor */
        .node.selected > .bubble { stroke: #f59e0b; stroke-width: 3; }
        .toolbar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .editor {
            margin-top: 12px;
            background: #fff;
            border: 1px solid #e3e6eb;
            border-radius: 12px;
            padding: 12px 14px;
        }
        .ed-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
        .ed-row:last-child { margin-bottom: 0; }
        .sel-info { font-size: 12px; color: var(--text-muted); }
        .ed-btn {
            border: 1px solid #d0d4da;
            background: #fff;
            color: var(--text);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background .15s, border-color .15s, color .15s;
        }
        .ed-btn:hover:not(:disabled) { background: #f3f4f6; }
        .ed-btn:disabled { opacity: .45; cursor: default; }
        .ed-btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
        .ed-btn.primary:hover { background: #1d4ed8; }
        .ed-btn.danger { color: #dc2626; border-color: #fecaca; }
        .ed-btn.danger:hover { background: #fef2f2; }
        .ed-input {
            flex: 1; min-width: 160px;
            padding: 7px 10px;
            border: 1px solid #d0d4da;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .ed-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        .ed-select {
            padding: 7px 10px;
            border: 1px solid #d0d4da;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="/" class="home">&larr; 返回首页</a>
        <h1>待办清单</h1>

        <svg class="mindmap" id="mindmap" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="legend">
            <span><i class="i-todo"></i>待办</span>
            <span><i class="i-doing"></i>进行中</span>
            <span><i class="i-done"></i>已完成</span>
        </div>

        <div class="toolbar">
            <button id="btnExport" class="ed-btn primary" type="button">导出 JSON</button>
            <button id="btnReset" class="ed-btn" type="button">重置（重载文件）</button>
        </div>

        <div class="editor" id="editor" style="display:none">
            <div class="ed-row">
                <span id="selInfo" class="sel-info"></span>
            </div>
            <div class="ed-row">
                <input id="selTitle" type="text" class="ed-input" placeholder="标题">
                <select id="selStatus" class="ed-select">
                    <option value="todo">待办</option>
                    <option value="doing">进行中</option>
                    <option value="done">已完成</option>
                </select>
            </div>
            <div class="ed-row">
                <button id="btnAddChild" class="ed-btn" type="button">+ 子节点</button>
                <button id="btnMoveUp" class="ed-btn" type="button">↑ 上移</button>
                <button id="btnMoveDown" class="ed-btn" type="button">↓ 下移</button>
                <button id="btnCollapse" class="ed-btn" type="button">折叠/展开</button>
                <button id="btnDelete" class="ed-btn danger" type="button">删除</button>
            </div>
        </div>

        <p class="subtitle" style="margin:14px 0 0">单击节点折叠（父）并选中编辑 · Alt+↑/↓ 或「↑ 上移/↓ 下移」按钮交换同级顺序 · 改完点「导出 JSON」下载覆盖 <code>assets/data/todo_list.json</code></p>
    </div>

    <script>
    (function () {
        // 待办数据已外置到 /assets/data/todo_list.json，下方通过 fetch 加载
        var tasks = [];

        var STATUS = { todo: "#64748b", doing: "#ea580c", done: "#16a34a" };

        // 父节点颜色：按到根的距离在 蓝→紫 间渐变（depth 越深越偏紫）
        function lerpHex(c1, c2, t) {
            var r1 = parseInt(c1.slice(1, 3), 16), g1 = parseInt(c1.slice(3, 5), 16), b1 = parseInt(c1.slice(5, 7), 16);
            var r2 = parseInt(c2.slice(1, 3), 16), g2 = parseInt(c2.slice(3, 5), 16), b2 = parseInt(c2.slice(5, 7), 16);
            var r = Math.round(r1 + (r2 - r1) * t), g = Math.round(g1 + (g2 - g1) * t), b = Math.round(b1 + (b2 - b1) * t);
            return "#" + [r, g, b].map(function (x) { var h = x.toString(16); return h.length < 2 ? "0" + h : h; }).join("");
        }
        var PARENT_NEAR = "#8B4513", PARENT_FAR = "#FF00FF";
        function parentColor(depth) {
            var t = maxDepth > 0 ? Math.min(depth / maxDepth, 1) : 0;
            return lerpHex(PARENT_NEAR, PARENT_FAR, t);
        }

        var LEVEL_X = 210;   // 列间距
        var LEAF_GAP = 40;   // 叶子纵向间距
        var TOP = 50;
        var LEFT = 70;
        var cursor = { y: TOP };
        var maxDepth = 0;

        function layout(node, depth) {
            node.depth = depth;
            node.x = LEFT + depth * LEVEL_X;
            if (depth > maxDepth) maxDepth = depth;
            if (node.children && node.children.length) {
                node.children.forEach(function (c) { layout(c, depth + 1); });
                var ys = node.children.map(function (c) { return c.y; });
                node.y = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
            } else {
                node.y = cursor.y;
                cursor.y += LEAF_GAP;
            }
        }

        function escapeXml(s) {
            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function linkPath(x1, y1, x2, y2) {
            var mx = (x1 + x2) / 2;
            return "M " + x1 + " " + y1 + " C " + mx + " " + y1 + ", " + mx + " " + y2 + ", " + x2 + " " + y2;
        }

        function renderNode(node, parentX, parentY) {
            var lx = node.x - parentX;
            var ly = node.y - parentY;
            var isRoot = node.depth === 0;
            var isLeaf = !node.children || !node.children.length;
            var hasKids = !isLeaf;
            var status = node.status || "todo";
            var color = STATUS[status] || STATUS.todo;

            var fill = isLeaf ? color : parentColor(node.depth);
            var nodeCls = "node" + (isLeaf ? " leaf " + status : "") + (hasKids ? " parent" : "") + (node.collapsed ? " collapsed" : "");
            var bubbleCls = "bubble" + (isRoot ? " root" : (isLeaf ? " leaf" : " parent"));
            var lblCls = "lbl" + (isRoot ? " root" : (hasKids ? " lbl-on" : ""));

            var html = '<g class="' + nodeCls + '" data-id="' + node._id + '" transform="translate(' + lx + "," + ly + ')">';

            if (hasKids) {
                html += '<g class="kids"><g class="links">';
                node.children.forEach(function (c) {
                    var clx = c.x - node.x;
                    var cly = c.y - node.y;
                    html += '<path class="link" d="' + linkPath(0, 0, clx, cly) + '"/>';
                });
                html += '</g><g class="nodes">';
                node.children.forEach(function (c) {
                    html += renderNode(c, node.x, node.y);
                });
                html += '</g></g>';
            }

            // pill: sized to text after render (sizePills); 父节点随深度:字号/padding/字距/颜色均递减(根最大最深)
            var padX = hasKids ? Math.max(12, 40 - node.depth * 6) : 15;
            var fs = hasKids ? Math.max(14, 30 - node.depth * 6) : 13;
            var ls = hasKids ? Math.max(0, 4 - node.depth) : 0;
            html += '<rect class="' + bubbleCls + '" x="-40" y="-15" width="80" height="30" rx="15" fill="' + fill + '" data-pad="' + padX + '"/>';
            var tstyle = hasKids ? ' style="font-size:' + fs + 'px;letter-spacing:' + ls + 'px"' : "";
            html += '<text class="' + lblCls + '"' + tstyle + ' x="0" y="1" text-anchor="middle" dominant-baseline="central">' + escapeXml(node.title) + '</text>';
            html += "</g>";
            return html;
        }

        function sizePills() {
            var rects = svg.querySelectorAll("rect.bubble");
            for (var i = 0; i < rects.length; i++) {
                var rect = rects[i];
                var text = rect.nextElementSibling;
                if (!text || text.tagName.toLowerCase() !== "text") continue;
                var bb = text.getBBox();
                if (!bb.width) continue;
                var padAttr = rect.getAttribute("data-pad");
                var padX = padAttr != null ? parseFloat(padAttr) : 15, padY = 7;
                var w = bb.width + padX * 2, h = bb.height + padY * 2;
                rect.setAttribute("x", (-w / 2).toFixed(1));
                rect.setAttribute("y", (-h / 2).toFixed(1));
                rect.setAttribute("width", w.toFixed(1));
                rect.setAttribute("height", h.toFixed(1));
                rect.setAttribute("rx", (h / 2).toFixed(1));
            }
            var cb = svg.getBBox();
            if (cb.width && cb.height) {
                var pad = 30;
                svg.setAttribute("viewBox", (cb.x - pad) + " " + (cb.y - pad) + " " + (cb.width + pad * 2) + " " + (cb.height + pad * 2));
            }
        }
        function isRootOf(rect) { return rect.classList.contains("root"); }

        var root = null;
        var svg = document.getElementById("mindmap");
        var selectedId = null;
        var nextId = 1;

        function assignIds(node, parent) {
            node._id = nextId++;
            node._parent = parent;
            if (node.children) node.children.forEach(function (c) { assignIds(c, node); });
        }
        function findNode(id, n) {
            n = n || root;
            if (n._id === id) return n;
            if (n.children) for (var i = 0; i < n.children.length; i++) { var r = findNode(id, n.children[i]); if (r) return r; }
            return null;
        }
        function isLeaf(n) { return !n.children || !n.children.length; }

        function render(rootNode) {
            cursor.y = TOP;
            maxDepth = 0;
            layout(rootNode, 0);
            var width = LEFT + maxDepth * LEVEL_X + 240;
            var height = cursor.y + 40;
            svg.setAttribute("viewBox", "0 0 " + width + " " + height);
            svg.innerHTML = renderNode(rootNode, 0, 0);
            sizePills();
            requestAnimationFrame(function () { sizePills(); svg.classList.add("ready"); });
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizePills);
            applyState();
        }
        function applyState() {
            var prev = svg.querySelector(".node.selected");
            if (prev) prev.classList.remove("selected");
            if (selectedId != null) {
                var sg = svg.querySelector('[data-id="' + selectedId + '"]');
                if (sg) sg.classList.add("selected");
            }
            updatePanel();
        }

        var panel = document.getElementById("editor");
        var selInfo = document.getElementById("selInfo");
        var selTitle = document.getElementById("selTitle");
        var selStatus = document.getElementById("selStatus");
        var btnAddChild = document.getElementById("btnAddChild");
        var btnDelete = document.getElementById("btnDelete");
        var btnCollapse = document.getElementById("btnCollapse");
        var btnMoveUp = document.getElementById("btnMoveUp");
        var btnMoveDown = document.getElementById("btnMoveDown");

        function updatePanel() {
            var n = selectedId == null ? null : findNode(selectedId);
            if (!n) { panel.style.display = "none"; return; }
            panel.style.display = "";
            var kind = n === root ? "根节点" : (isLeaf(n) ? "叶子任务" : "父节点");
            var chain = n._parent ? " · 上级：" + n._parent.title : "";
            selInfo.textContent = kind + chain;
            if (document.activeElement !== selTitle) selTitle.value = n.title || "";
            var leaf = isLeaf(n);
            selStatus.style.display = leaf ? "" : "none";
            if (leaf && document.activeElement !== selStatus) selStatus.value = n.status || "todo";
            btnAddChild.disabled = false;
            btnDelete.disabled = (n === root);
            btnCollapse.style.display = leaf ? "none" : "";
            var isRoot = n === root;
            var sibs = isRoot ? null : n._parent.children;
            var idx = sibs ? sibs.indexOf(n) : -1;
            btnMoveUp.disabled = isRoot || idx <= 0;
            btnMoveDown.disabled = isRoot || idx < 0 || idx >= sibs.length - 1;
        }

        selTitle.addEventListener("input", function () {
            var n = findNode(selectedId);
            if (!n) return;
            n.title = selTitle.value;
            render(root);
        });
        selStatus.addEventListener("change", function () {
            var n = findNode(selectedId);
            if (!n || !isLeaf(n)) return;
            n.status = selStatus.value;
            render(root);
        });
        btnAddChild.addEventListener("click", function () {
            var n = findNode(selectedId);
            if (!n) return;
            n.children = n.children || [];
            var child = { title: "新节点", status: "todo", _parent: n, _id: nextId++ };
            n.children.push(child);
            selectedId = child._id;
            render(root);
            selTitle.focus();
            selTitle.select();
        });
        btnDelete.addEventListener("click", function () {
            var n = findNode(selectedId);
            if (!n || n === root) return;
            var p = n._parent;
            var i = p.children.indexOf(n);
            if (i >= 0) p.children.splice(i, 1);
            selectedId = p._id;
            render(root);
        });
        btnCollapse.addEventListener("click", function () {
            var n = findNode(selectedId);
            if (!n || isLeaf(n)) return;
            n.collapsed = !n.collapsed;
            render(root);
        });

        // 交换当前选中节点与上一个/下一个同级节点（dir=-1 上移，dir=+1 下移）
        function swapSibling(dir) {
            var n = findNode(selectedId);
            if (!n || n === root) return false;
            var p = n._parent;
            var i = p.children.indexOf(n);
            var j = i + dir;
            if (j < 0 || j >= p.children.length) return false;
            p.children[i] = p.children[j];
            p.children[j] = n;
            render(root);
            return true;
        }
        // Alt+↑/↓：交换同级顺序（新增节点后即可使用）
        document.addEventListener("keydown", function (e) {
            if (!e.altKey) return;
            if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
            if (swapSibling(e.key === "ArrowUp" ? -1 : 1)) e.preventDefault();
        });
        btnMoveUp.addEventListener("click", function () { swapSibling(-1); });
        btnMoveDown.addEventListener("click", function () { swapSibling(1); });

        function cleanNode(n) {
            var o = { title: n.title };
            if (n.status && isLeaf(n)) o.status = n.status;
            if (n.prio) o.prio = n.prio;
            if (n.due) o.due = n.due;
            if (n.note) o.note = n.note;
            if (n.collapsed && n.children && n.children.length) o.collapsed = true;
            if (n.children && n.children.length) o.children = n.children.map(cleanNode);
            return o;
        }
        document.getElementById("btnExport").addEventListener("click", function () {
            var blob = new Blob([JSON.stringify(cleanNode(root), null, 2)], { type: "application/json" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = "todo_list.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        });
        document.getElementById("btnReset").addEventListener("click", load);

        function toggleCollapse(n) {
            n.collapsed = !n.collapsed;
            var g = svg.querySelector('[data-id="' + n._id + '"]');
            if (g) g.classList.toggle("collapsed");
        }
        svg.addEventListener("click", function (e) {
            var bubble = e.target.closest(".bubble");
            if (!bubble) return;
            var node = bubble.closest(".node");
            selectedId = parseInt(node.getAttribute("data-id"), 10);
            if (bubble.classList.contains("parent") || bubble.classList.contains("root")) {
                var n = findNode(selectedId);
                if (n) toggleCollapse(n);
            }
            applyState();
        });
        svg.addEventListener("mouseover", function (e) {
            var bubble = e.target.closest(".bubble.parent, .bubble.root");
            if (!bubble) return;
            bubble.closest(".node").classList.add("lit");
        });
        svg.addEventListener("mouseout", function (e) {
            var bubble = e.target.closest(".bubble.parent, .bubble.root");
            if (!bubble) return;
            bubble.closest(".node").classList.remove("lit");
        });

        function load() {
            fetch("assets/data/todo_list.json")
                .then(function (r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.text();
                })
                .then(function (text) {
                    return JSON.parse(text.replace(/,\s*([}\]])/g, "$1"));
                })
                .then(function (data) {
                    root = data;
                    nextId = 1;
                    assignIds(root, null);
                    selectedId = root._id;
                    render(root);
                })
                .catch(function (e) {
                    svg.textContent = "加载待办数据失败：" + e.message;
                });
        }
        load();
    })();
    </script>
</body>
</html>
