<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办清单</title>
    <style>
        :root {
            --bg: #f7f8fa;
            --card: #ffffff;
            --border: #e3e6eb;
            --text: #1f2329;
            --text-muted: #8a909a;
            --line: #c8ced6;
            --root-bg: #2563eb;
            --branch-bg: #eef2ff;
            --branch-bd: #c7d2fe;
            --todo: #9ca3af;
            --doing: #f59e0b;
            --done: #16a34a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .wrap {
            max-width: 920px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        h1 { font-size: 1.25em; margin: 0 0 4px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin: 0 0 18px; }
        a.home {
            display: inline-block;
            margin-bottom: 14px;
            color: var(--root-bg);
            text-decoration: none;
            font-size: 13px;
        }
        a.home:hover { text-decoration: underline; }

        .tree {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 16px;
        }
        .node { position: relative; }
        .node-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 0;
        }
        .children {
            margin-left: 10px;
            padding-left: 18px;
            border-left: 2px dashed var(--line);
        }
        .node.collapsed > .children { display: none; }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            white-space: nowrap;
        }
        .pill.root {
            font-weight: 800;
            font-size: 15px;
            background: var(--root-bg);
            color: #fff;
            border-color: var(--root-bg);
        }
        .pill.parent {
            font-weight: 700;
            background: var(--branch-bg);
            border-color: var(--branch-bd);
        }
        .pill.leaf.done {
            text-decoration: line-through;
            color: var(--text-muted);
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex: 0 0 auto;
            box-shadow: 0 0 0 2px rgba(0,0,0,.04);
        }
        .dot.todo { background: var(--todo); }
        .dot.doing { background: var(--doing); }
        .dot.done { background: var(--done); }
        .caret {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            cursor: pointer;
            color: var(--text-muted);
            user-select: none;
            transition: transform .15s;
            border-radius: 4px;
            font-size: 10px;
        }
        .caret:hover { background: #eef1f4; color: var(--text); }
        .node.collapsed > .node-row > .caret { transform: rotate(-90deg); }
        .caret-spacer { display: inline-block; width: 18px; flex: 0 0 auto; }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="/" class="home">&larr; 返回首页</a>
        <h1>待办清单</h1>
        <p class="subtitle">在源码 <code>tasks</code> 树中增删节点；叶子任务改 <code>status</code> 即更新（todo / doing / done）</p>

        <div class="tree" id="tree"></div>
    </div>

    <script>
    (function () {
        // ============================================================
        //  待办数据（树状）：在此增删节点
        //  · 父节点：{ title, children:[...] }
        //  · 叶子任务：{ title, status }，可选 prio/due/note
        //  · status 取值：'todo'（待办）/ 'doing'（进行中）/ 'done'（已完成）
        // ============================================================
        var tasks = [
            {
                title: "搬迁方面",
                children: [
                    { title: "收拾行李",       status: "todo", prio: "high", due: "2026-08-30", note: "先打包非必需物品" },
                    { title: "公寓申请退房",   status: "todo", due: "2026-08-25", note: "联系物业提交退房申请" },
                    { title: "路由器退还",     status: "todo", note: "宽带运营商归还设备" },
                    { title: "电竞桌打包",     status: "todo" },
                    { title: "显示器打包",     status: "todo", note: "原装箱+气泡膜" },
                    { title: "电脑主机打包",   status: "todo", prio: "high", note: "防震填充" },
                    { title: "快递寄送",       status: "todo", due: "2026-08-28", note: "预约上门取件" }
                ]
            },
            {
                title: "工作方面",
                children: [
                    { title: "HYPIR模型编译",        status: "todo", prio: "high" },
                    { title: "人脸增强任务转测",     status: "todo" },
                    { title: "人体微动任务探索",     status: "todo", note: "调研+方案设计" },
                    { title: "新视界端侧服务修改",   status: "todo" },
                    { title: "新视界云侧服务部署",   status: "todo", note: "联调环境" }
                ]
            }
        ];

        var treeEl = document.getElementById("tree");

        function escapeHtml(s) {
            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function renderNode(node, isRoot) {
            var hasChildren = node.children && node.children.length;
            var isLeaf = !hasChildren;
            var status = node.status || "todo";

            var caret = hasChildren
                ? '<span class="caret" title="展开/折叠" tabindex="0">&#9660;</span>'
                : '<span class="caret-spacer"></span>';

            var pillCls = isRoot ? "pill root"
                : (isLeaf ? "pill leaf " + status : "pill parent");
            var dot = isLeaf ? '<span class="dot ' + status + '"></span>' : "";

            var childrenHtml = hasChildren
                ? '<div class="children">' + node.children.map(function (c) { return renderNode(c, false); }).join("") + "</div>"
                : "";

            return '<div class="node">'
                + '<div class="node-row">' + caret
                + '<span class="' + pillCls + '">' + dot + escapeHtml(node.title) + "</span></div>"
                + childrenHtml
                + "</div>";
        }

        treeEl.innerHTML = renderNode({ title: "待办清单", children: tasks }, true);

        treeEl.addEventListener("click", function (e) {
            var caret = e.target.closest(".caret");
            if (!caret) return;
            caret.closest(".node").classList.toggle("collapsed");
        });
        treeEl.addEventListener("keydown", function (e) {
            if (e.key !== "Enter" && e.key !== " ") return;
            var caret = e.target.closest(".caret");
            if (!caret) return;
            e.preventDefault();
            caret.closest(".node").classList.toggle("collapsed");
        });
    })();
    </script>
</body>
</html>
