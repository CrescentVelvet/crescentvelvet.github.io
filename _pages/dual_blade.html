<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════════════════════
   §0  常量
   ════════════════════════════════════════════════════════════════════ */

const FIXED_DT = 1 / 60;          // 逻辑步长，恒 60Hz（规格 §3.3，禁止改成可变 dt）
const MAX_CATCHUP = 5;            // 单帧最多补几步，防止后台回来一次性追帧爆炸
const VIEW_W = 960, VIEW_H = 540;

const WORLD = {
  left: 0, right: 2400,
  zMin: 0, zMax: 46,              // 纵深范围（世界单位）
  zScale: 5.4,                    // 1 世界单位 → 5.4 屏幕像素（纵向）
  baseY: 252,                     // z=0 处的地面屏幕 y
  actorW: 18, actorH: 44,
};

// 地面投影：纵深 z → 屏幕 y。z 越大越靠近镜头（画面上越靠下）。
const GROUND_Y = (z) => WORLD.baseY + z * WORLD.zScale;
// 极轻微透视：远处略小。幅度刻意压小，避免剪影失真。
const DEPTH_SCALE = (z) => 1 + z * 0.0032;

const COMBAT = {
  hitZTol: 15,      // ★ 两轴对齐阈值：|Δz| >= 此值必然打空（边界为开区间）
  hitYUp: 26,       // 目标比攻击者高超过此值 → 打不到（于是「跳起来躲」成立）
  hitYDown: 62,     // 攻击者比目标高不超过此值 → 跳劈可中
  airThreshold: 6,  // h 超过此值算「在空中」（用于绕过角斗士的正面格挡）
  edgeMargin: 30,   // 战锤把人打飞到屏边时的留白
};

// 血量口径（峰哥 2026-09-24 定）：初始 10 滴，被打一下扣 1 滴，
// HUD 用 5 颗爱心表示（1 心 = 2 滴 ⇒ 扣 1 滴显示半心）。
// ⚠️ 因此**敌人 atk.dmg 必须恒为 1** —— 谁改成别的值，爱心就会开始「一次掉一整颗」或「卡住不减」。
const PLAYER_HP = 10;
const PLAYER_SPEED_X = 118;
const PLAYER_SPEED_Z = 78;
const JUMP_V0 = -330;
const GRAVITY = 980;
const IFRAMES = 48;               // 受击后无敌 0.8s（规格 §3.5 起始值 0.6~1.0s）
const INPUT_BUFFER = 8;           // 攻击输入缓冲 6~8 帧
const HITSTOP_BASE = 3, HITSTOP_HEAVY = 5;
const DEAD_LINGER = 46;           // 死亡后仍留 46 帧 —— 让「被打飞到屏边」这件事看得见

/* ════════════════════════════════════════════════════════════════════
   §1  内容定义表（规格 §3.4：内容与逻辑分离，行为用标签组合描述）
       —— 想加一种武器/敌人，只加一条数据，不碰下面的逻辑。
   ════════════════════════════════════════════════════════════════════ */

const WEAPONS = {
  sword: {
    id: 'sword', name: '剑', tint: '#cfd6df',
    reach: 40,
    startup: 9, active: 4, recover: 11,     // 起手 9 帧（规格 §3.5：8~10 帧）
    dmg: 1,
    comboCount: 2,                          // 两段连击（原版 1-1：一次剑连击可击杀士兵）
    // ⚠️ 连击差别**不靠加长判定**。`comboReach` 原写成 [1, 1.12]，那是错的：
    //    判定边界 = reach + 半身宽(9)；而刀尖能伸多远由「手部枢轴 + 刀刃长度」决定。
    //    给第二段单独加 reach ⇒ 判定比刀锋长出一截 =「刀没碰到却算中」。
    //    差别改由**弧线方向**承担（下劈 / 撩），这才是玩家真能感知的差别。
    comboReach: [1, 1],
    handLen: 43,                            // 手部枢轴 → 刀尖
    // 挥击弧线（度，0 = 水平向前）：① 斜下劈 ② 反手撩。三个数各有分工：
    //   wind = 预备的过冲角度（**比出招起点拉得更远**，读作蓄力）
    //   from→to = 出招区间，刀锋匀速扫过。★★ 区间**必须跨过 0°**。
    //   为什么要拆出 wind：判定是「水平向前 reach+9 = 49px 的固定盒」，
    //   而 active 只有 4 帧。若出招起点就在 -58°（第一版），首帧刀尖水平只到 28.8px，
    //   判定却已经亮着 ⇒ 那 1 帧是「挥空也算中」。把出招起点收到 -30°、
    //   让**预备**去过冲（-72°），首帧刀锋就已经贴在 43.2px，最差只差 5.8px。
    comboArc: [{ wind: -72, from: -30, to: 38 }, { wind: 44, from: 33, to: -40 }],
    onHit: [{ knockback: 0.5 }],            // 0.5 倍身高 ≈ 22px
    dropWhenSwapped: false,                 // 默认/回退武器：换武器时不落地
  },
  hammer: {
    id: 'hammer', name: '战锤', tint: '#b86944',
    reach: 46,
    startup: 12, active: 5, recover: 19,
    dmg: 2,
    comboCount: 1,
    handLen: 49,                            // 枢轴 → 锤头外缘（= 46 + 9 − 6）
    comboArc: [{ wind: -58, from: -26, to: 30 }],   // 单段：抡下去
    onHit: [{ stun: 30 }, { knockback: 'toEdge' }],
    dropWhenSwapped: true,
  },
};

const ENEMIES = {
  soldier: {
    id: 'soldier', name: '士兵', tint: '#7d8896', trim: '#5c6672',
    hp: 2,                                  // 剑 2 下死（规格 §1.5 锚点）
    speedX: 56, speedZ: 40,
    bodyScale: 1.0, headgear: 'helm',
    weapon: null,                           // 空手（不落武器）
    facingLock: false,                      // 持续转向玩家
    guardFront: false,
    atk: { reach: 32, startup: 16, active: 4, recover: 16, dmg: 1,
           onHit: [{ knockback: 0.4 }] },
    ai: { aggro: 320, standoff: 30, zAlign: 12, think: 26, turn: 18 },
  },
  gladiator: {
    id: 'gladiator', name: '角斗士', tint: '#4f5b66', trim: '#b86944',
    hp: 6,                                  // 耐久高
    speedX: 48, speedZ: 34,
    bodyScale: 1.16, headgear: 'crest',
    weapon: 'hammer',                       // 持战锤 → 击倒后掉落，让玩家能体验第二把武器
    facingLock: true,                       // ★ 只在出招瞬间转向 ⇒「绕到背后打」成为可能
    guardFront: true,                       // ★ 正面格挡：「空中打或从背后打」才有效
    atk: { reach: 38, startup: 20, active: 5, recover: 20, dmg: 1,
           onHit: [{ knockback: 0.5 }] },
    ai: { aggro: 360, standoff: 34, zAlign: 12, think: 34, turn: 40 },
  },
};

// 关卡：手写 spawn 时间轴数组（规格 §3.7）。at = 推进线（玩家 x 越过即触发）。
// ⚠️ 尖刺坑的几何有观感约束：z 带宽 24 单位 × zScale 5.4 = 130px，而 x 向只有 110px
//    ⇒ 比宽还高，渲染出来读成「一扇黑门」而不是「地面上的坑」。
//    现在 z 0~14（76px 高）× x 160px 宽 ≈ 2:1，才读成横向的坑。
//    玩家出生 z = 30，安全区是 z > 14。
const LEVEL = {
  width: WORLD.right,
  goalX: 2320,
  hazards: [
    { type: 'spike', x0: 760, x1: 920, z0: 0, z1: 10, stun: 42 },
  ],
  waves: [
    { at: 180,  spawns: [
      { type: 'soldier', from: 'right', z: 20 },
      { type: 'soldier', from: 'right', z: 34 } ] },
    { at: 700,  spawns: [
      { type: 'soldier', from: 'left',  z: 12 },
      { type: 'soldier', from: 'right', z: 36 },
      { type: 'soldier', from: 'left',  z: 30 } ] },
    { at: 1240, spawns: [
      { type: 'gladiator', from: 'right', z: 26 } ] },
    { at: 1760, spawns: [
      { type: 'soldier',   from: 'left',  z: 12 },
      { type: 'soldier',   from: 'right', z: 30 },
      { type: 'gladiator', from: 'right', z: 38, weapon: null } ] },
  ],
};

const PLAYER_START = { x: 120, z: 30 };

/* ════════════════════════════════════════════════════════════════════
   §2  输入（规格 §3.6：players 数组 + 输入映射表，为双人预留）
   ════════════════════════════════════════════════════════════════════ */

const INPUT_MAPS = [
  { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],
    attack: ['Comma'], jump: ['Period'], drop: ['KeyK'] },
  // 地图 1 预留给第二人（双人模式后期扩展，规格 §3.6）
  { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'],
    attack: ['KeyG'], jump: ['KeyH'], drop: ['KeyT'] },
];

const heldKeys = new Set();      // 记录 e.code
let inputOverride = null;        // 无头探针用：直接注入输入状态

function readInput(pi) {
  if (inputOverride) return inputOverride;
  const m = INPUT_MAPS[pi];
  const down = (arr) => arr.some((c) => heldKeys.has(c));
  return {
    left: down(m.left), right: down(m.right),
    up: down(m.up), down: down(m.down),
    attack: down(m.attack), jump: down(m.jump), drop: down(m.drop),
  };
}
// 边沿检测：本帧刚按下
const prevInput = [];
function edge(pi, cur) {
  const p = prevInput[pi] || {};
  const r = { attack: cur.attack && !p.attack, jump: cur.jump && !p.jump, drop: cur.drop && !p.drop };
  prevInput[pi] = cur;
  return r;
}

/* ════════════════════════════════════════════════════════════════════
   §3  运行时状态
   ════════════════════════════════════════════════════════════════════ */

let S = null;
let uid = 0;

function newState() {
  return {
    tick: 0,
    players: [makePlayer(0)],           // ★ 数组（规格 §3.6：加第二人时不重构）
    enemies: [],
    drops: [],                          // 地上的武器
    fx: [],                             // 粒子
    camera: { x: 0 },
    hitstop: 0,
    shake: 0,
    waveFired: LEVEL.waves.map(() => false),
    kills: 0,
    phase: 'play',                      // play | win | lose
    toast: { text: '', t: 0 },
    flags: { sawSpike: false, sawGladiator: false, sawHammer: false, usedHammer: false },
    lastKnock: null,                    // 供断言 #3
  };
}

function toast(text, frames = 200) {
  S.toast.text = text;
  S.toast.t = frames;
}

/* ════════════════════════════════════════════════════════════════════
   §4  角色工厂
   ════════════════════════════════════════════════════════════════════ */

function baseActor(x, z) {
  return {
    id: ++uid,
    x, z, h: 0, vy: 0,
    facing: 1,
    hp: 1, maxHp: 1,
    state: 'idle',                      // idle | attack | dead
    dead: false, deadT: 0,
    asp: 0,                             // 攻击步数计数
    combo: 0,
    buf: 0,                             // 攻击输入缓冲
    stun: 0,
    iframes: 0,
    spikeCd: 0,
    kb: null,                           // { dir, toEdge, speed, remain }
    hitSet: new Set(),                  // 本次挥击已命中的目标 id
    turnCd: 0,
    thinkCd: 0,
    anim: 0,
    flash: 0,                           // 命中白闪剩余帧
    squash: 1,                          // 挤压（>1 表示被打扁）
    atk: null, reachNow: 0,             // 当前生效的攻击描述与判定距离
    weapon: null, def: null,
    tint: '#888', trim: '#444', bodyScale: 1, headgear: 'helm',
  };
}

function makePlayer(i) {
  const a = baseActor(PLAYER_START.x, PLAYER_START.z);
  a.kind = 'player';
  a.playerIndex = i;
  a.isPlayer = true;
  a.hp = a.maxHp = PLAYER_HP;
  a.defaultWeapon = 'sword';
  a.weapon = 'sword';
  a.tint = '#d94a3d'; a.trim = '#f0a08c';
  a.bodyScale = 1.0;
  a.headgear = 'douli';               // ★ 靠头饰形状区分，不靠颜色（红绿盲友好）
  return a;
}

function makeEnemy(type, opts) {
  const def = ENEMIES[type];
  const a = baseActor(0, opts.z);
  a.kind = 'enemy'; a.type = type; a.def = def;
  a.hp = a.maxHp = def.hp;
  a.tint = def.tint; a.trim = def.trim;
  a.bodyScale = def.bodyScale;
  a.headgear = def.headgear;
  a.weapon = opts.weapon !== undefined ? opts.weapon : def.weapon;
  a.facing = opts.from === 'left' ? 1 : -1;
  return a;
}

/* ════════════════════════════════════════════════════════════════════
   §5  ★ 两轴对齐判定（规格 §3.2 / §4 断言 #2）
       这是整个游戏手感的核心：判定盒是扁平的，|Δz| 超了就是打空。
   ════════════════════════════════════════════════════════════════════ */

function canHit(a, t) {
  if (!a || !t || t.dead) return false;
  // Z 轴对齐：边界为开区间（|Δz| === hitZTol 判为打空）
  if (Math.abs(a.z - t.z) >= COMBAT.hitZTol) return false;
  // Y 轴：非对称。目标在头顶过高 → 打空（于是「跳起来躲」成立）。
  if (t.h - a.h > COMBAT.hitYUp) return false;
  if (a.h - t.h > COMBAT.hitYDown) return false;
  // X 轴：朝向前方的 reach 范围
  const halfW = WORLD.actorW * 0.5;
  const dx = (t.x - a.x) * a.facing;
  if (dx < -halfW) return false;
  if (dx - halfW > a.reachNow) return false;
  return true;
}

/* 探针：只按 Δz（同道高度）构造一对标准对手 —— 断言 #2 用 */
function probeZHit(dz) {
  const A = { x: 500, z: 20, h: 0, facing: 1, reachNow: WEAPONS.sword.reach, dead: false };
  const T = { x: 520, z: 20 + dz, h: 0, dead: false };
  return canHit(A, T);
}
/* 探针：只按两方高度差（同道纵深）构造 —— 「跳劈可中 / 跳躲可避」用 */
function probeYHit(attackerH, targetH) {
  const A = { x: 500, z: 20, h: attackerH, facing: 1, reachNow: WEAPONS.sword.reach, dead: false };
  const T = { x: 520, z: 20, h: targetH, dead: false };
  return canHit(A, T);
}

/* ════════════════════════════════════════════════════════════════════
   §6  战斗
   ════════════════════════════════════════════════════════════════════ */

function beginAttack(a, spec) {
  a.state = 'attack';
  a.asp = 0;
  a.hitSet = new Set();
  a.atk = spec;
  a.combo = (a.combo || 0) + 1;
  if (a.combo > (spec.comboCount || 1)) a.combo = 1;
  const mul = (spec.comboReach && spec.comboReach[a.combo - 1]) || 1;
  a.reachNow = spec.reach * mul;
  a.buf = 0;
}

function specFor(a) {
  if (a.isPlayer) return WEAPONS[a.weapon] || WEAPONS[a.defaultWeapon];
  return a.def.atk;
}

function attackTotal(spec) { return spec.startup + spec.active + spec.recover; }

function phaseOf(a, spec) {
  if (a.state !== 'attack') return null;
  if (a.asp < spec.startup) return 'startup';
  if (a.asp < spec.startup + spec.active) return 'active';
  return 'recover';
}

/* ★ 角斗士的正面格挡：攻击者落地 + 站在其「面朝的一侧」⇒ 不受伤。
   判据：sign(攻击者.x - 目标.x) === 目标.facing
   （正负号写反过一次：写反时「正面无敌」会变成「背面无敌」，且实测不易察觉） */
function isGuarded(a, t) {
  if (!t.def || !t.def.guardFront) return false;
  if (a.h >= COMBAT.airThreshold) return false;             // 空中攻击无视格挡
  return Math.sign(a.x - t.x) === t.facing;
}

function applyOnHit(a, t, spec) {
  let heavy = false;
  const dir = a.facing >= 0 ? 1 : -1;
  for (const tag of spec.onHit || []) {
    if (tag.stun) t.stun = Math.max(t.stun, tag.stun);
    if (tag.knockback === 'toEdge') {
      // ★ 战锤：朝攻击方向把人打飞到屏幕边缘（断言 #3）
      t.kb = { dir, toEdge: true, speed: 620, remain: Infinity, from: t.x, to: null };
      heavy = true;
    } else if (typeof tag.knockback === 'number') {
      t.kb = { dir, toEdge: false, speed: 330, remain: tag.knockback * WORLD.actorH, from: t.x, to: null };
    }
  }
  return heavy;
}

function damage(a, t, spec) {
  t.hp -= spec.dmg;
  t.flash = 2;                                   // 白闪 2 帧（规格 §3.8）
  t.squash = 1.15;                               // 受击方 1.15× 挤压
  const heavy = applyOnHit(a, t, spec);
  S.hitstop = Math.max(S.hitstop, heavy ? HITSTOP_HEAVY : HITSTOP_BASE);
  S.shake = Math.max(S.shake, heavy ? 7 : 3);
  spawnSpark(t, heavy);
  if (t.isPlayer) t.iframes = IFRAMES;
  if (t.hp <= 0) killActor(t);
}

function killActor(t) {
  t.dead = true;
  t.hp = 0;
  t.deadT = DEAD_LINGER;
  if (t.isPlayer) return;
  S.kills++;
  // 掉落手上的武器（士兵空手 ⇒ 不掉；角斗士持战锤 ⇒ 掉）
  if (t.weapon && WEAPONS[t.weapon]) {
    S.drops.push({ id: ++uid, weapon: t.weapon, x: t.x, z: t.z, h: 0, life: 900 });
    if (!S.flags.sawHammer && t.weapon === 'hammer') {
      S.flags.sawHammer = true;
      toast('「,」拾取战锤 —— 命中会把人击晕并打飞到屏边', 260);
    }
  }
  spawnDust(t.x, t.z, 6);
}

function resolveSwing(a) {
  const spec = a.atk;
  const targets = a.isPlayer ? S.enemies : S.players;
  for (const t of targets) {
    if (t.dead || a.hitSet.has(t.id)) continue;
    if (t.iframes > 0) continue;
    if (!canHit(a, t)) continue;
    a.hitSet.add(t.id);
    if (isGuarded(a, t)) {
      // 格挡：不扣血，出火花 + 轻微顿帧，把「正面无效」这件事讲清楚
      S.hitstop = Math.max(S.hitstop, 2);
      S.shake = Math.max(S.shake, 2);
      spawnSpark(t, false, '#b86944');
      toast('角斗士正面架住了 —— 跳到空中打，或绕到背后打', 160);
      continue;
    }
    damage(a, t, spec);
    if (a.isPlayer && a.weapon === 'hammer' && !S.flags.usedHammer) {
      S.flags.usedHammer = true;
      toast('战锤命中：击晕 + 击飞到屏幕边缘', 200);
    }
  }
}

/* ════════════════════════════════════════════════════════════════════
   §7  粒子
   ════════════════════════════════════════════════════════════════════ */

function spawnSpark(t, heavy, color) {
  const n = heavy ? 10 : 5;
  for (let i = 0; i < n; i++) {
    const ang = -0.9 + Math.random() * 1.8;
    const sp = (heavy ? 260 : 150) * (0.5 + Math.random());
    S.fx.push({ kind: 'spark', x: t.x, z: t.z, h: WORLD.actorH * 0.55,
      vx: Math.cos(ang) * sp, vh: Math.sin(ang) * sp - 40,
      life: heavy ? 14 : 9, max: heavy ? 14 : 9,
      color: color || (t.isPlayer ? '#ffd9c9' : '#fff3c4') });
  }
}
function spawnDust(x, z, n) {
  for (let i = 0; i < n; i++) {
    S.fx.push({ kind: 'dust', x, z, h: 4,
      vx: (Math.random() - 0.5) * 90, vh: 40 + Math.random() * 60,
      life: 18, max: 18, color: '#8b7f70' });
  }
}

/* ════════════════════════════════════════════════════════════════════
   §8  逻辑步（固定 dt，唯一入口）
   ════════════════════════════════════════════════════════════════════ */

function stepLogic(dt) {
  S.tick++;

  // 顿帧（hitstop）：世界冻结，但 tick 继续走 —— 这是打击感的来源
  if (S.hitstop > 0) { S.hitstop--; if (S.toast.t > 0) S.toast.t--; return; }

  if (S.toast.t > 0) S.toast.t--;
  if (S.shake > 0) S.shake *= 0.86;

  updateWaves();
  for (const p of S.players) updatePlayer(p, dt);
  for (const e of S.enemies) updateEnemy(e, dt);

  const all = [...S.players, ...S.enemies];
  for (const t of all) physics(t, dt);
  for (const t of all) hazardCheck(t);

  resolveOverlaps();
  updateDrops();
  updateFx(dt);
  cleanup();
  updateCamera();
  updateTutorial();

  if (S.phase === 'play') {
    const p = S.players[0];
    if (p.dead) { S.phase = 'lose'; showOver('倒下了', '关卡的节奏还没掌握'); }
    else if (p.x >= LEVEL.goalX) { S.phase = 'win'; showOver('切片一完成', '通用战斗 · 武器拾取 · 两轴判定 均成立'); }
  }
}

/* ── 玩家 ─────────────────────────────────────────────────────────── */
function updatePlayer(p, dt) {
  if (p.dead) return;
  const inp = readInput(p.playerIndex);
  const ed = edge(p.playerIndex, inp);         // 边沿检测必须在任何提前 return 之前

  if (p.buf > 0) p.buf--;
  if (p.iframes > 0) p.iframes--;
  if (p.spikeCd > 0) p.spikeCd--;
  if (p.stun > 0) { p.stun--; return; }
  if (p.kb) return;                            // 被击退期间不可操作

  // 丢弃武器：交出当前武器，回退到默认武器（断言 #5）
  if (ed.drop) dropWeapon(p);

  // 攻击（含输入缓冲）
  if (p.state === 'attack') {
    const spec = p.atk;
    if (ed.attack) p.buf = INPUT_BUFFER;
    p.asp++;
    const ph = phaseOf(p, spec);
    if (ph === 'active') resolveSwing(p);
    if (ph === 'recover') {                    // 收招期可缓慢移动
      if (inp.left)  { p.x -= PLAYER_SPEED_X * 0.35 * dt; p.facing = -1; }
      if (inp.right) { p.x += PLAYER_SPEED_X * 0.35 * dt; p.facing = 1; }
    }
    if (p.asp >= attackTotal(spec)) {
      p.state = 'idle'; p.atk = null; p.reachNow = 0;
      if (p.buf > 0) beginAttack(p, specFor(p));   // 缓冲兑现 → 连段
    }
    return;
  }

  // 拾取优先于出招：站在可拾取物上按攻击键 = 拾取（原版行为）
  const drop = nearestPickup(p);
  if (ed.attack && drop && canPickup(p, drop)) { pickUp(p, drop); return; }
  if (ed.attack) { beginAttack(p, specFor(p)); return; }

  // 跳跃（仅在地面）
  if (ed.jump && p.h <= 0.001) { p.vy = JUMP_V0; p.h = 0.01; }

  let mvx = 0, mvz = 0;
  if (inp.left)  { mvx -= 1; p.facing = -1; }
  if (inp.right) { mvx += 1; p.facing = 1; }
  if (inp.up)    { mvz -= 1; }
  if (inp.down)  { mvz += 1; }
  if (p.h > 0.001) mvz = 0;                    // 空中不改纵深（纵深是地面轴）
  p.x += mvx * PLAYER_SPEED_X * dt;
  p.z += mvz * PLAYER_SPEED_Z * dt;
  if (mvx || mvz) p.anim += dt * 9;
}

/* ── 敌人 AI ──────────────────────────────────────────────────────── */
function updateEnemy(e, dt) {
  if (e.dead) return;
  if (e.stun > 0) { e.stun--; return; }
  if (e.kb) return;                            // 被击退期间不做决策
  if (e.turnCd > 0) e.turnCd--;

  if (e.state === 'attack') {
    const spec = e.atk;
    e.asp++;
    if (phaseOf(e, spec) === 'active') resolveSwing(e);
    if (e.asp >= attackTotal(spec)) { e.state = 'idle'; e.atk = null; e.reachNow = 0; }
    return;
  }

  const p = S.players[0];
  if (p.dead) return;

  const dxs = p.x - e.x, dzs = p.z - e.z;
  const adx = Math.abs(dxs), adz = Math.abs(dzs);
  const ai = e.def.ai;

  // 朝向：持续型（士兵）每 turn 帧跟一次；锁定型（角斗士）只在出招瞬间转
  if (!e.def.facingLock && e.turnCd <= 0) { e.facing = dxs >= 0 ? 1 : -1; e.turnCd = ai.turn; }

  if (adx + adz > ai.aggro) return;

  // 先对齐纵深，再接近（清版动作的标准走位）
  let mvx = 0, mvz = 0;
  if (adz > ai.zAlign) mvz = Math.sign(dzs);
  else if (adx > e.def.atk.reach * 0.75) mvx = Math.sign(dxs);
  if (mvx !== 0 && !e.def.facingLock) e.facing = Math.sign(mvx);

  if (mvz === 0 && adx <= e.def.atk.reach + 8 && adz <= ai.zAlign) {
    if (e.thinkCd > 0) { e.thinkCd--; }
    else {
      e.thinkCd = ai.think;
      e.facing = dxs >= 0 ? 1 : -1;             // 出招瞬间转向（锁定型的唯一转向时机）
      beginAttack(e, e.def.atk);
      return;
    }
  }

  e.x += mvx * e.def.speedX * dt;
  e.z += mvz * e.def.speedZ * dt;
  if (mvx || mvz) e.anim += dt * 8;
}

/* ── 物理 ─────────────────────────────────────────────────────────── */
function physics(a, dt) {
  // ★ 击退先于死亡判定：死亡也要继续飞，否则「打飞到屏边」看不见（也断不了断言 #3）
  if (a.kb) {
    let stop = false;
    if (a.kb.toEdge) {
      const camL = S.camera.x, camR = S.camera.x + VIEW_W;
      const edge = a.kb.dir > 0 ? camR - COMBAT.edgeMargin : camL + COMBAT.edgeMargin;
      a.x += a.kb.dir * a.kb.speed * dt;
      if ((a.kb.dir > 0 && a.x >= edge) || (a.kb.dir < 0 && a.x <= edge)) { a.x = edge; stop = true; }
    } else {
      const use = Math.min(a.kb.speed * dt, Math.max(0, a.kb.remain));
      a.x += a.kb.dir * use;
      a.kb.remain -= use;
      if (a.kb.remain <= 0.001) stop = true;
    }
    if (a.x <= WORLD.left + 8 || a.x >= WORLD.right - 8) {
      a.x = Math.max(WORLD.left + 8, Math.min(WORLD.right - 8, a.x));
      stop = true;
    }
    if (stop) {
      S.lastKnock = { from: +a.kb.from.toFixed(2), to: +a.x.toFixed(2),
                      toEdge: !!a.kb.toEdge, id: a.id, tick: S.tick };
      a.kb = null;
    }
  }

  if (a.dead) { a.deadT--; return; }

  // 重力 / 跳跃（h 向上为正，vy 取负值表示向上）
  if (a.h > 0 || a.vy !== 0) {
    a.vy += GRAVITY * dt;
    a.h -= a.vy * dt;
    if (a.h <= 0) { a.h = 0; a.vy = 0; a.kb = null; }   // 落地即中断击退
  }

  a.x = Math.max(WORLD.left + 8, Math.min(WORLD.right - 8, a.x));
  a.z = Math.max(WORLD.zMin, Math.min(WORLD.zMax, a.z));

  if (a.squash > 1) a.squash = Math.max(1, a.squash - dt * 1.5);
  if (a.flash > 0) a.flash--;
}

/* ── 角色互相推挤（同 z 才推，纯观感） ───────────────────────────── */
function resolveOverlaps() {
  const all = [];
  for (const a of S.players) if (!a.dead) all.push(a);
  for (const a of S.enemies) if (!a.dead) all.push(a);
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      const a = all[i], b = all[j];
      if (Math.abs(a.z - b.z) > 8) continue;     // 纵深差够大 = 不算撞在一起
      const d = b.x - a.x;
      if (Math.abs(d) < WORLD.actorW) {
        const push = (WORLD.actorW - Math.abs(d)) * 0.2 * (d >= 0 ? 1 : -1);
        a.x -= push; b.x += push;
      }
    }
  }
}

/* ── 掉落与拾取 ───────────────────────────────────────────────────── */
function nearestPickup(p) {
  let best = null, bd = 1e9;
  for (const d of S.drops) {
    const dist = Math.abs(d.x - p.x) + Math.abs(d.z - p.z) * 1.2;
    if (dist < 34 && dist < bd) { bd = dist; best = d; }
  }
  return best;
}
function canPickup(p, d) {
  // 原版规则：手持同类型武器时无法拾取同类武器
  return p.weapon !== d.weapon;
}
function pickUp(p, d) {
  const old = p.weapon;
  p.weapon = d.weapon;
  S.drops = S.drops.filter((x) => x !== d);
  const oldDef = WEAPONS[old];
  if (oldDef && oldDef.dropWhenSwapped) {
    S.drops.push({ id: ++uid, weapon: old, x: p.x + (p.facing > 0 ? -24 : 24), z: p.z, h: 0, life: 900 });
  }
  toast('拾取：' + WEAPONS[p.weapon].name, 90);
}
function dropWeapon(p) {
  if (!p.weapon || p.weapon === p.defaultWeapon) return;
  const w = p.weapon;
  S.drops.push({ id: ++uid, weapon: w, x: p.x, z: p.z, h: 0, life: 900 });
  p.weapon = p.defaultWeapon;               // ★ 回退到默认武器（断言 #5）
  toast('丢弃' + WEAPONS[w].name + ' → 回到' + WEAPONS[p.defaultWeapon].name, 120);
}
function updateDrops() {
  for (const d of S.drops) d.life--;
  S.drops = S.drops.filter((d) => d.life > 0);
  const p = S.players[0];
  const near = nearestPickup(p);
  if (near && !p.dead && S.phase === 'play' && p.state !== 'attack') {
    elPrompt.innerHTML = canPickup(p, near)
      ? '按 <b>,</b> 拾取 ' + WEAPONS[near.weapon].name
      : '同类武器不可重复拾取';
    elPrompt.classList.add('on');
  } else elPrompt.classList.remove('on');
}

/* ── 粒子 ─────────────────────────────────────────────────────────── */
function updateFx(dt) {
  for (const f of S.fx) {
    f.life--;
    f.x += f.vx * dt;
    f.h += f.vh * dt;
    f.vh -= 900 * dt;
    if (f.h < 0) { f.h = 0; f.vh *= -0.3; }
  }
  S.fx = S.fx.filter((f) => f.life > 0);
}

/* ── 清理 ─────────────────────────────────────────────────────────── */
function cleanup() {
  S.enemies = S.enemies.filter((e) => !e.dead || e.deadT > 0);
}

/* ── 关卡推进（线性推进：越过 at 即触发该波） ────────────────────── */
function updateWaves() {
  const p = S.players[0];
  for (let i = 0; i < LEVEL.waves.length; i++) {
    const w = LEVEL.waves[i];
    if (S.waveFired[i] || p.x < w.at) continue;
    S.waveFired[i] = true;
    for (const sp of w.spawns) {
      const e = makeEnemy(sp.type, sp);
      e.x = sp.from === 'left' ? S.camera.x + 26 : S.camera.x + VIEW_W - 26;
      e.x = Math.max(WORLD.left + 12, Math.min(WORLD.right - 12, e.x));
      S.enemies.push(e);
      if (sp.type === 'gladiator' && !S.flags.sawGladiator) {
        S.flags.sawGladiator = true;
        toast('角斗士：跳到空中打，或绕到背后打', 260);
      }
    }
  }
}

/* ── 危险物：尖刺坑（接触 = 眩晕，可从 z 轴绕过） ────────────────── */
function hazardCheck(a) {
  if (a.dead || a.h > 0.5 || a.spikeCd > 0) return;
  for (const hz of LEVEL.hazards) {
    if (hz.type !== 'spike') continue;
    if (a.x < hz.x0 || a.x > hz.x1) continue;
    if (a.z < hz.z0 || a.z > hz.z1) continue;
    a.stun = Math.max(a.stun, hz.stun);
    a.kb = null;
    a.spikeCd = hz.stun + 60;              // 避免眩晕锁死
    if (a.isPlayer) {
      toast('踩到尖刺 —— 眩晕。用「↓」绕到下沿通过', 180);
      spawnDust(a.x, a.z, 5);
    }
    return;
  }
}

/* ── 教学提示 ─────────────────────────────────────────────────────── */
function updateTutorial() {
  const p = S.players[0];
  const hz = LEVEL.hazards[0];
  // ⚠️ 必须限定在坑前的一个「窗口」内：只判 p.x > x0-190 的话，玩家一旦越过就永远成立，
  //    后续任何时刻都会被这条过期的提示顶上来（实测把角斗士的教学提示盖掉了）。
  if (!S.flags.sawSpike && p.x > hz.x0 - 200 && p.x < hz.x1 + 140) {
    S.flags.sawSpike = true;
    toast('前方尖刺坑：z 轴只占上沿 —— 用「↓」绕到下沿通过', 300);
  }
}

/* ── 相机：线性推进 + 屏边约束 ───────────────────────────────────── */
function camTarget() {
  const p = S.players[0];
  return Math.max(0, Math.min(LEVEL.width - VIEW_W, p.x - VIEW_W * 0.42));
}
function snapCamera() { S.camera.x = camTarget(); }
function updateCamera() {
  const target = camTarget();
  S.camera.x += (target - S.camera.x) * 0.14;
  if (Math.abs(target - S.camera.x) < 0.3) S.camera.x = target;
}

/* ════════════════════════════════════════════════════════════════════
   §9  渲染（Canvas 2D，零位图 —— 全部几何绘制）
   ════════════════════════════════════════════════════════════════════ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
  const w = Math.round(VIEW_W * s), h = Math.round(VIEW_H * s);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  document.getElementById('frame').style.width = w + 'px';
  document.getElementById('frame').style.height = h + 'px';
}
window.addEventListener('resize', resize);

const sx = (x) => x - S.camera.x;

function render() {
  const k = cv.width / VIEW_W;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);

  const sh = S.shake > 0.4 ? S.shake : 0;
  if (sh) ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);

  drawBackdrop();
  drawGround();
  drawHazards();

  // ★ z 深度排序：z 小的先画（远），z 大的后画（近，压在别人身上）
  const drawables = [];
  for (const e of S.enemies) drawables.push(e);
  for (const p of S.players) if (!p.dead) drawables.push(p);
  for (const d of S.drops) drawables.push({ __drop: d, z: d.z });
  drawables.sort((a, b) => a.z - b.z);
  for (const o of drawables) {
    if (o.__drop) drawDrop(o.__drop); else drawActor(o);
  }

  drawFx();
  drawSwingArcs();

  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawVignette();
}

function drawBackdrop() {
  const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, '#241f1b');
  g.addColorStop(0.55, '#2e2823');
  g.addColorStop(1, '#1b1815');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // 远景山脊（视差 0.15 / 0.32 / 0.55）
  // ⚠️ 每段 step 再取中点会画成锯齿状。用固定细步长 20px + 两条正弦叠加，
  //    山脊才是连绵的轮廓而不是折线。
  const layers = [
    { p: 0.15, y: 216, amp: 52, col: '#29231e' },
    { p: 0.32, y: 238, amp: 38, col: '#312a23' },
    { p: 0.55, y: 254, amp: 24, col: '#38302a' },
  ];
  const STEP = 20;
  for (const L of layers) {
    const par = -S.camera.x * L.p;
    const off = ((par % STEP) + STEP) % STEP;
    const base = Math.floor(par / STEP);
    ctx.fillStyle = L.col;
    ctx.beginPath();
    ctx.moveTo(-STEP, VIEW_H);
    const n = Math.ceil(VIEW_W / STEP) + 3;
    for (let i = -1; i <= n; i++) {
      const k = base + i;
      const prof = Math.abs(Math.sin(k * 0.37)) * 0.66 + Math.abs(Math.sin(k * 0.13 + 1.7)) * 0.34;
      ctx.lineTo(i * STEP + off, L.y - prof * L.amp);
    }
    ctx.lineTo(VIEW_W + STEP, VIEW_H);
    ctx.closePath();
    ctx.fill();
  }
}

function drawGround() {
  const yTop = GROUND_Y(WORLD.zMin), yBot = GROUND_Y(WORLD.zMax);
  const g = ctx.createLinearGradient(0, yTop, 0, yBot + 60);
  g.addColorStop(0, '#3a332c');
  g.addColorStop(1, '#2a2521');
  ctx.fillStyle = g;
  ctx.fillRect(0, yTop, VIEW_W, VIEW_H - yTop);

  // 纵深参考线（让 z 轴在画面上可读）
  ctx.strokeStyle = 'rgba(255,255,255,.045)';
  ctx.lineWidth = 1;
  for (let z = WORLD.zMin + 8; z <= WORLD.zMax; z += 9) {
    const y = GROUND_Y(z);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VIEW_W, y); ctx.stroke();
  }

  // 地面纵向刻痕（跟着相机滚动）
  ctx.strokeStyle = 'rgba(0,0,0,.16)';
  for (let wx = 0; wx < LEVEL.width; wx += 96) {
    const x = sx(wx);
    if (x < -60 || x > VIEW_W + 60) continue;
    ctx.beginPath();
    ctx.moveTo(x, yTop);
    ctx.lineTo(x + (yBot + 60 - yTop) * 0.28, yBot + 60);
    ctx.stroke();
  }

  // 关卡右端墙
  const xr = sx(LEVEL.width);
  if (xr < VIEW_W) {
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.fillRect(Math.max(0, xr), 0, VIEW_W, VIEW_H);
  }
}

function drawHazards() {
  for (const hz of LEVEL.hazards) {
    const x0 = sx(hz.x0), x1 = sx(hz.x1);
    if (x1 < -20 || x0 > VIEW_W + 20) continue;
    const yT = GROUND_Y(hz.z0), yB = GROUND_Y(hz.z1);

    // 坑体：不能是纯黑方块（实测读成「黑门」而不是「地面上的坑」）。
    // 关键三点：① 宽高比 ≥ 2:1（几何层面，见 LEVEL 处的注释）；
    //          ② 填充用下沉渐变而非纯黑；③ 近边（下沿）压一条暖色高光当「坑沿」。
    const g = ctx.createLinearGradient(0, yT, 0, yB);
    g.addColorStop(0, '#2b241d');
    g.addColorStop(0.22, '#191411');
    g.addColorStop(1, '#0d0a09');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x0, yT); ctx.lineTo(x1, yT); ctx.lineTo(x1, yB); ctx.lineTo(x0, yB);
    ctx.closePath(); ctx.fill();

    // 远边暗影（上沿） + 近边坑沿高光（下沿）
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(x0, yT, x1 - x0, 3);
    ctx.fillStyle = 'rgba(184,105,68,.30)';
    ctx.fillRect(x0, yB - 2, x1 - x0, 2);

    // ⚠️ 尖刺必须「基座贴近边、尖顶留在坑内」。基座贴远边时尖顶会冒出远边之外，
    //    整块读成「平台上插了一排栅栏」，而不是「坑里的尖刺」（已实测踩过）。
    const step = 14, hh = 16, baseY = yB - 5;
    for (let x = x0 + 6; x < x1 - 6; x += step) {
      ctx.fillStyle = '#5a5348';
      ctx.beginPath();
      ctx.moveTo(x, baseY); ctx.lineTo(x + step * 0.5, baseY - hh); ctx.lineTo(x + step, baseY);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c4bcac';
      ctx.beginPath();
      ctx.moveTo(x + step * 0.3, baseY - hh * 0.4);
      ctx.lineTo(x + step * 0.5, baseY - hh);
      ctx.lineTo(x + step * 0.7, baseY - hh * 0.4);
      ctx.closePath(); ctx.fill();
    }

    // 危险描边 + 上沿警示刻度（「这一带不能走」）
    ctx.strokeStyle = 'rgba(184,105,68,.55)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x0, yT, x1 - x0, yB - yT);
    ctx.fillStyle = 'rgba(184,105,68,.45)';
    for (let x = x0 + 3; x < x1 - 3; x += 11) ctx.fillRect(x, yT - 4, 5, 2);
  }
}

/* ── 角色：实心剪影 + 亮边（规格 §3.8） ─────────────────────────── */
function drawActor(a) {
  const zy = GROUND_Y(a.z);
  const bs = (a.bodyScale || 1) * DEPTH_SCALE(a.z);
  const px = sx(a.x);
  const feetY = zy - a.h;

  // 投影
  ctx.save();
  ctx.globalAlpha = a.dead ? 0.16 : 0.34;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(px, zy, 15 * bs, 4.6 * bs, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(px, feetY);
  if (a.dead) ctx.globalAlpha = Math.max(0.05, a.deadT / DEAD_LINGER);
  ctx.scale(a.facing >= 0 ? 1 : -1, 1);
  ctx.scale(bs * a.squash, bs / a.squash);
  if (a.dead) ctx.rotate((Math.PI / 2) * Math.min(1, (DEAD_LINGER - a.deadT) / 12));  // 倒地

  const tint = a.flash > 0 ? '#ffffff' : a.tint;
  const trim = a.flash > 0 ? '#ffffff' : a.trim;
  const walk = Math.abs((a.anim % 2) - 1);          // 0..1 摆腿
  const inAir = a.h > 2;
  const ang = swingAngle(a) * Math.PI / 180;

  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.55)';
  ctx.lineWidth = 1.6;

  // 腿
  ctx.fillStyle = shade(tint, -0.34);
  drawLeg(-4, inAir ? 6 : walk * 9);
  drawLeg(4, inAir ? -6 : -walk * 9);

  // 躯干
  ctx.fillStyle = tint;
  roundRect(-8.5, -38, 17, 22, 5);
  ctx.fill(); ctx.stroke();

  // 腰带
  ctx.fillStyle = trim;
  ctx.fillRect(-8.5, -22.5, 17, 3.6);

  // 头
  ctx.fillStyle = shade(tint, 0.22);
  ctx.beginPath(); ctx.arc(0, -44, 6.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // ★ 头饰形状区分（不靠颜色）
  drawHeadgear(a.headgear, trim);

  // 手臂 + 武器：绕**手部枢轴**整体旋转（该枢轴是绘制与判定的共同基准）
  ctx.save();
  ctx.translate(HAND_PIVOT.x, HAND_PIVOT.y);
  ctx.rotate(ang);
  drawWeaponOnHand(a);
  ctx.restore();

  ctx.restore();

  // 眩晕星（不随挤压/镜像变换）
  if (a.stun > 0 && !a.dead) {
    ctx.save();
    ctx.fillStyle = '#f5c84c';
    for (let i = 0; i < 3; i++) {
      const t2 = S.tick * 0.09 + i * 2.1;
      ctx.beginPath();
      ctx.arc(px + Math.cos(t2) * 10, feetY - 58 * bs + Math.sin(t2) * 3.5, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 敌人血条（未满血时才显示）
  if (a.kind === 'enemy' && !a.dead && a.hp < a.maxHp) {
    const w = 26 * bs, yy = feetY - 62 * bs;
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(px - w / 2, yy, w, 3);
    ctx.fillStyle = a.type === 'gladiator' ? '#b86944' : '#cfd6df';
    ctx.fillRect(px - w / 2, yy, w * Math.max(0, a.hp / a.maxHp), 3);
  }

  function drawLeg(ox, sw) {
    ctx.save();
    ctx.translate(ox, -18);
    ctx.rotate(sw * Math.PI / 180);
    roundRect(-3, 0, 6, 19, 2.4);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

function drawHeadgear(kind, trim) {
  ctx.fillStyle = trim;
  ctx.strokeStyle = 'rgba(0,0,0,.55)';
  ctx.lineWidth = 1.6;
  if (kind === 'douli') {                 // 玩家：斗笠（大三角）
    ctx.beginPath();
    ctx.moveTo(-13, -47); ctx.lineTo(0, -58); ctx.lineTo(13, -47);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (kind === 'helm') {           // 士兵：方盔
    roundRect(-7, -52, 14, 8, 2);
    ctx.fill(); ctx.stroke();
  } else if (kind === 'crest') {          // 角斗士：双角盔
    roundRect(-7.6, -52, 15.2, 8, 2.6);
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-7, -52); ctx.lineTo(-14, -58); ctx.lineTo(-6, -54); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7, -52); ctx.lineTo(14, -58); ctx.lineTo(6, -54); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
}

/* 手臂 + 武器：以手部枢轴为原点沿 +x 展开，**打击面外缘必须落在 specHandLen 上**。
   ⚠️ 这个长度不能临时改 —— 判定半径是按它反推的（bladeReach()）。
   敌我共用一个函数：敌人用自己的 atk 作为 spec，空手时手臂伸到打击距离，
   于是「拳头离人 13px 却能打到 41px」这类不一致也一并消失。 */
function drawWeaponOnHand(a) {
  const wid = a.isPlayer ? a.weapon : (a.weapon || 'fist');
  const def = WEAPONS[wid];
  // 玩家按武器表；敌人按自己的 atk（那才是它判定的来源）
  const spec = (a.isPlayer && def) ? def : ((a.def && a.def.atk) || def || a.atk || { reach: 18 });
  const R = specHandLen(spec);

  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.62)';
  ctx.lineWidth = 1.4;

  // 前臂：枢轴就在肩处，所以持械手只有一小截；空手则要把手臂伸到打击距离
  const armLen = wid === 'fist' ? Math.max(8, R - 13) : 10;
  ctx.fillStyle = shade(a.tint, 0.08);
  roundRect(-3.5, -3.5, armLen, 7, 3.5);
  ctx.fill(); ctx.stroke();

  if (wid === 'hammer') {
    ctx.fillStyle = shade(def.tint, -0.42);                    // 杆
    ctx.fillRect(2, -2.1, R - 13, 4.2);
    ctx.fillStyle = def.tint;                                  // 锤头（外缘正好在 R）
    ctx.fillRect(R - 11, -9, 11, 18);
    ctx.strokeRect(R - 11, -9, 11, 18);
    ctx.fillStyle = 'rgba(255,255,255,.24)';                   // 亮边
    ctx.fillRect(R - 11, -9, 11, 2.4);
  } else if (wid === 'sword') {
    ctx.fillStyle = shade(def.tint, -0.55);                    // 缠柄
    roundRect(-7, -2.2, 11.5, 4.4, 2.2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = a.trim || '#b86944';                       // 刀镡
    roundRect(4.4, -4.8, 3.4, 9.6, 1.2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();                                           // 刃：收腰 + 收锋
    ctx.moveTo(8.6, -2.8);
    ctx.lineTo(R - 5.5, -2.0);
    ctx.lineTo(R, -0.4);
    ctx.lineTo(R, 0.9);
    ctx.lineTo(R - 5.5, 2.1);
    ctx.lineTo(8.6, 2.8);
    ctx.closePath();
    ctx.fillStyle = def.tint;
    ctx.fill(); ctx.stroke();
    ctx.beginPath();                                           // 刃线（规格 §3.8「亮边」）
    ctx.moveTo(9.6, -1.6); ctx.lineTo(R - 4.6, -1.1);
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 1.05;
    ctx.stroke();
  } else if (wid === 'fist') {
    ctx.fillStyle = shade(a.tint, 0.14);
    ctx.beginPath(); ctx.arc(R - 4.5, 0, 4.8, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  } else {
    ctx.fillStyle = def ? def.tint : '#8d8377';
    ctx.fillRect(0, -2.4, R, 4.8);
  }
}

/* ── 刀锋几何：**绘制与判定共用的唯一口径** ──────────────────────────
   判定边界 = 身体中心向前 reach + 半身宽(9)
   刀尖能伸多远 = 手部枢轴(HAND_PIVOT.x) + 刃长(handLen)
   两者必须相等。否则就是「看得到够不着 / 够不着却算中」——
   切片一第一版正是后者：弧线 0→−70→+75 几乎全程近垂直，刀尖水平只伸到
   18~22px，而判定给到 49px ⇒ 玩家完全读不出攻击距离。 */

const REST_ANG = -12;                       // 待机：剑指向前上方 12°
const HAND_PIVOT = { x: 6, y: -32 };        // 手部枢轴（身体局部坐标，y 向下为正）

/** 枢轴 → 打击面外缘的长度。未声明 handLen 的按 reach 反推，保证与判定一致。 */
function specHandLen(spec) {
  if (spec.handLen) return spec.handLen;
  return spec.reach + WORLD.actorW * 0.5 - HAND_PIVOT.x;
}
// 未声明 comboArc 者（例如敌人的 atk）用这条默认弧：预备过冲到 −68°，
// 出招 −30° → +38°，同样跨过水平面 ⇒ 敌人的空手判定也与其手臂长度自洽。
const DEFAULT_ARC = { wind: -68, from: -30, to: 38 };

function specArc(spec, combo) {
  const arcs = spec.comboArc || [DEFAULT_ARC];
  const ci = Math.min(arcs.length, Math.max(1, combo || 1)) - 1;
  return arcs[ci] || arcs[0];
}
/** 出招区间是否跨过 0°（水平）。⚠️ 判据必须与符号无关：
    写成 `from<=0 && to>=0` 时，{46,-52} 这种「从下往上撩」会被误判为「不跨」，
    于是 bladeReach 取到 26.87 而不是 40 —— 我第一版就是这么错的。 */
function arcCrossesHorizon(arc) {
  return Math.min(arc.from, arc.to) <= 0 && Math.max(arc.from, arc.to) >= 0;
}
/** 该弧线**出招区间内**刀尖向前最远能到多少（区间跨 0° 就取 0°，否则取更近 0° 的端点） */
function tipMaxForward(spec, combo) {
  const arc = specArc(spec, combo);
  const ang = arcCrossesHorizon(arc) ? 0
            : (Math.abs(arc.from) < Math.abs(arc.to) ? arc.from : arc.to);
  return HAND_PIVOT.x + specHandLen(spec) * Math.cos(ang * Math.PI / 180);
}
/** 该武器「视觉上」能达到的判定半径 —— 应恒等于 spec.reach */
function bladeReach(spec, combo) {
  return tipMaxForward(spec, combo) - WORLD.actorW * 0.5;
}

/* 挥击角度。⭐ 把 asp 当**显式参数**（纯函数）：弧光拖尾要回看前几帧的角度，
   角度一旦藏在 a.asp 里就没法回看。 */
function swingAngleAt(a, pos) {
  const spec = a.atk;
  if (!spec) return REST_ANG;
  const arc = specArc(spec, a.combo);
  const wind = (arc.wind === undefined) ? arc.from : arc.wind;
  const w1 = spec.startup, w2 = spec.startup + spec.active;
  if (pos < w1) {
    // 预备分两拍：先前 62% 过冲到 wind（蓄力），再回一点到出招起点（起势）。
    // 若让 startup 直接停在 wind，出招首帧会从 wind「跳」到 from（曾达 42°），肉眼是一记抽帧。
    const t = pos / Math.max(1, w1);
    if (t < 0.62) {
      const u = t / 0.62;
      return REST_ANG + (wind - REST_ANG) * (1 - (1 - u) * (1 - u));
    }
    const u = (t - 0.62) / 0.38;
    return wind + (arc.from - wind) * (u * u);
  }
  if (pos < w2) {                            // 出招：from → to 匀速（刀速恒定才像真砍）
    return arc.from + (arc.to - arc.from) * ((pos - w1) / Math.max(1, spec.active));
  }
  const t = (pos - w2) / Math.max(1, spec.recover);   // 收招：快速回位后缓落
  return arc.to + (REST_ANG - arc.to) * (1 - (1 - t) * (1 - t));
}
function swingAngle(a) { return swingAngleAt(a, a.atk ? a.asp : 0); }

/* 弧光 = 沿轨迹的渐隐拖尾。
   半径直接用 specHandLen（刀尖绕枢轴画出的圆）⇒ 弧光与刀锋**天然同长**。
   上一版写死 a.reachNow*0.86：半径 34.4，而刀尖在 52 —— 观感与判定两边都不对。 */
function drawSwingArcs() {
  const all = [...S.players, ...S.enemies];
  const TRAIL = 5;
  for (const a of all) {
    if (a.dead || !a.atk) continue;
    if (phaseOf(a, a.atk) !== 'active') continue;
    const spec = a.atk, R = specHandLen(spec);
    const dir = a.facing >= 0 ? 1 : -1;
    const px = sx(a.x) + HAND_PIVOT.x * dir;
    const py = GROUND_Y(a.z) - a.h + HAND_PIVOT.y;
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(dir, 1);
    ctx.lineCap = 'round';
    for (let k = 0; k < TRAIL; k++) {
      const pos = a.asp - k;
      if (pos < spec.startup) break;
      const a1 = swingAngleAt(a, pos - 0.4) * Math.PI / 180;
      const a0 = swingAngleAt(a, Math.max(spec.startup, pos - 1.5)) * Math.PI / 180;
      if (Math.abs(a1 - a0) < 0.02) continue;
      ctx.strokeStyle = 'rgba(255,250,240,' + (0.52 * (1 - k / TRAIL)).toFixed(3) + ')';
      ctx.lineWidth = 3.9 - k * 0.62;
      ctx.beginPath();
      ctx.arc(0, 0, R, Math.min(a0, a1), Math.max(a0, a1));
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawDrop(d) {
  const px = sx(d.x), zy = GROUND_Y(d.z);
  const def = WEAPONS[d.weapon];
  const blink = d.life < 180 && Math.floor(S.tick / 6) % 2 === 0;
  const bob = Math.sin(S.tick * 0.09) * 2;
  ctx.save();
  ctx.globalAlpha = blink ? 0.32 : 1;
  ctx.translate(px, zy - 4);
  ctx.fillStyle = def ? def.tint : '#8d8377';
  ctx.strokeStyle = 'rgba(0,0,0,.6)';
  ctx.lineWidth = 1.5;
  if (d.weapon === 'hammer') {
    ctx.fillRect(-13, -2 + bob, 26, 4);
    ctx.fillRect(13, -8 + bob, 10, 16);
    ctx.strokeRect(13, -8 + bob, 10, 16);
  } else {
    ctx.fillRect(-14, -2.4 + bob, 28, 4.8);
    ctx.beginPath(); ctx.moveTo(14, -2.4 + bob); ctx.lineTo(20, bob); ctx.lineTo(14, 2.4 + bob);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 0.28;
  ctx.strokeStyle = '#f5c84c';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, 4, 16, 5, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawFx() {
  for (const f of S.fx) {
    const px = sx(f.x), py = GROUND_Y(f.z) - f.h;
    const al = Math.max(0, f.life / f.max);
    ctx.globalAlpha = al;
    if (f.kind === 'spark') {
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 2;
      const len = 7 * al + 2;
      const ang = Math.atan2(f.vh, f.vx);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(ang) * len, py - Math.sin(ang) * len);
      ctx.stroke();
    } else {
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(px, py, 2.4 * al + 1, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawVignette() {
  const g = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.42,
                                     VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.92);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

/* ── 小工具 ───────────────────────────────────────────────────────── */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= (1 + amt); g *= (1 + amt); b *= (1 + amt); }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}

const elHpText   = document.getElementById('hp-text');
const elWeapon   = document.getElementById('weapon-name');
const elProg     = document.getElementById('prog-fill');
const elKill     = document.getElementById('kill-text');

/* ── 生命：5 颗爱心 = 10 滴（峰哥 2026-09-24 定） ─────────────────────
   每颗心 = 2 滴 ⇒「被打一下扣 1 滴」正好显示为半心：
   心形路径只定义一次，暗底 + 亮面两层叠放，亮面用 clip-path 从右往左切。 */
const HEARTS = 5;
const HEART_PATH = 'M12 20.6C12 20.6 1.9 14.1 1.9 7.7 1.9 4.1 4.6 1.4 7.7 1.4c2 0 3.4 1.1 4.3 2.5.9-1.4 2.3-2.5 4.3-2.5 3.1 0 5.8 2.7 5.8 6.3 0 6.4-10.1 12.9-10.1 12.9Z';
const elHearts = [];
let lastHpShown = null;

function buildHearts() {
  elHearts.length = 0;
  const box = document.getElementById('hearts');
  box.innerHTML = '';
  for (let i = 0; i < HEARTS; i++) {
    const cell = document.createElement('i');
    cell.className = 'heart';
    cell.innerHTML =
      '<svg viewBox="0 0 24 22"><path class="dim" d="' + HEART_PATH + '"/></svg>' +
      '<svg viewBox="0 0 24 22" class="lit"><path d="' + HEART_PATH + '"/></svg>';
    box.appendChild(cell);
    elHearts.push(cell);
  }
}

function updateHud() {
  const p = S.players[0];
  const hp = Math.max(0, p.hp);
  for (let i = 0; i < elHearts.length; i++) {
    const f = Math.max(0, Math.min(1, (hp - i * 2) / 2));           // 0 / 0.5 / 1
    elHearts[i].querySelector('.lit').style.clipPath =
      'inset(0 ' + ((1 - f) * 100).toFixed(1) + '% 0 0)';
  }
  // 掉血时弹一下「丢掉的那一滴」所在的心（第 n 滴归属 floor((n−1)/2) 号心）
  if (lastHpShown !== null && hp < lastHpShown) {
    const idx = Math.min(HEARTS - 1, Math.max(0, Math.floor((lastHpShown - 1) / 2)));
    const el = elHearts[idx];
    if (el) { el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
  }
  lastHpShown = hp;
  elHpText.textContent = hp + ' / ' + p.maxHp + ' 滴';
  const wdef = WEAPONS[p.weapon];
  elWeapon.textContent = wdef ? wdef.name : '—';
  elWeapon.style.color = p.weapon === p.defaultWeapon ? '#f2ece1' : '#b86944';
  elProg.style.width = Math.min(100, p.x / LEVEL.goalX * 100) + '%';
  elKill.textContent = '击倒 ' + S.kills;
  if (S.toast.t > 0 && S.toast.text) {
    elToast.textContent = S.toast.text;
    elToast.classList.add('on');
  } else elToast.classList.remove('on');
}

function showOver(title, sub) {
  elOverTitle.textContent = title;
  elOverSub.textContent = sub;
  elOver.classList.add('on');
}

/* ════════════════════════════════════════════════════════════════════
   §11  主循环（固定步长 accumulator）
   ════════════════════════════════════════════════════════════════════ */

let acc = 0, lastT = 0, paused = false;

function frame(now) {
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.25) dt = 0.25;                 // 后台回来后不要一次追一大堆帧
  if (!paused) {
    acc += dt;
    let guard = 0;
    while (acc >= FIXED_DT && guard++ < MAX_CATCHUP) {
      stepLogic(FIXED_DT);
      acc -= FIXED_DT;
    }
    if (guard >= MAX_CATCHUP) acc = 0;
  }
  render();
  updateHud();
  requestAnimationFrame(frame);
}

/* ════════════════════════════════════════════════════════════════════
   §12  键盘
   ════════════════════════════════════════════════════════════════════ */

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyR') { reset(); e.preventDefault(); return; }
  if (e.code === 'KeyP') { paused = !paused; e.preventDefault(); return; }
  if (e.code === 'Comma' || e.code === 'Period' || e.code === 'Space') e.preventDefault();
  heldKeys.add(e.code);
}, { passive: false });
window.addEventListener('keyup', (e) => heldKeys.delete(e.code));
window.addEventListener('blur', () => heldKeys.clear());

/* ════════════════════════════════════════════════════════════════════
   §13  探针（规格 §4 断言用）
        ⚠️ 探针会改状态，断言之间请先 reset()。
   ════════════════════════════════════════════════════════════════════ */

window.__dbg = {
  version: 'dual_blade.slice1',
  consts: { FIXED_DT, WORLD, COMBAT, WEAPONS, ENEMIES, LEVEL, INPUT_MAPS, PLAYER_HP, PLAYER_START, HAND_PIVOT, REST_ANG },
  GROUND_Y, canHit, probeZHit, probeYHit, phaseOf, attackTotal, specFor,
  specHandLen, specArc, tipMaxForward, bladeReach, swingAngleAt, swingAngle,

  step(n) { const k = n || 1; for (let i = 0; i < k; i++) stepLogic(FIXED_DT); return S.tick; },
  setInput(o) {
    inputOverride = o ? Object.assign(
      { left: 0, right: 0, up: 0, down: 0, attack: 0, jump: 0, drop: 0 }, o) : null;
  },
  clearInput() { inputOverride = null; },
  ticks() { return S.tick; },

  snapshot() {
    const mk = (a) => ({
      id: a.id, kind: a.kind, type: a.type || null,
      x: +a.x.toFixed(3), z: +a.z.toFixed(3), h: +a.h.toFixed(3),
      hp: a.hp, maxHp: a.maxHp, facing: a.facing, state: a.state,
      weapon: a.weapon || null, stun: a.stun, iframes: a.iframes,
      spikeCd: a.spikeCd, dead: !!a.dead, deadT: a.deadT,
      kb: a.kb ? { dir: a.kb.dir, toEdge: !!a.kb.toEdge } : null,
    });
    return {
      tick: S.tick, phase: S.phase, hitstop: S.hitstop,
      cameraX: +S.camera.x.toFixed(2),
      players: S.players.map(mk), playerCount: S.players.length,
      enemies: S.enemies.map(mk),
      drops: S.drops.map((d) => ({ weapon: d.weapon, x: +d.x.toFixed(2), z: +d.z.toFixed(2) })),
      kills: S.kills, lastKnock: S.lastKnock,
      toast: S.toast.t > 0 ? S.toast.text : '',
    };
  },

  /** 静音关卡波次 —— 探针期间绝不能刷出小兵：它们会推挤玩家 → 相机漂移
      → 战锤击退的「屏边」跟着漂 → 断言不再确定。所有探针都必须先调它。 */
  silenceWaves() { for (let i = 0; i < LEVEL.waves.length; i++) S.waveFired[i] = true; },

  /** 真实走一遍命中判定（不是只调 canHit）：给出 Δz 与两方高度差，返回血量变化 */
  duelTest(o) {
    o = o || {};
    S = newState(); this.silenceWaves(); snapCamera();
    const p = S.players[0];
    p.x = 600; p.z = 30; p.h = o.ph || 0; p.facing = 1; p.iframes = 99999;
    p.weapon = o.weapon || 'sword';
    const e = makeEnemy('gladiator', { z: 30 + (o.dz || 0), from: 'right' });
    e.x = 632;
    e.facing = (o.gladFacing === undefined) ? 1 : o.gladFacing;
    e.h = o.eh || 0;
    e.stun = 9999;
    S.enemies.push(e);
    const hpBefore = e.hp;
    this.setInput({ attack: 1 });
    this.step(1);
    this.setInput({});
    this.step(20);
    return { hpBefore, hpAfter: e.hp, damage: hpBefore - e.hp,
             dz: o.dz || 0, ph: o.ph || 0, eh: o.eh || 0 };
  },

  /** 40 实体压力：逻辑步进均耗时（帧预算 16.67ms） */
  stressTest(n, frames) {
    S = newState(); this.silenceWaves(); snapCamera();
    S.players[0].x = 300; S.players[0].z = 30; S.players[0].iframes = 99999;
    S.enemies = [];
    for (let i = 0; i < (n || 40); i++) {
      const e = makeEnemy(i % 3 === 0 ? 'gladiator' : 'soldier', { z: 8, from: i % 2 ? 'left' : 'right' });
      e.x = 340 + (i % 10) * 22;
      e.z = 6 + (i % 7) * 5;
      S.enemies.push(e);
    }
    const count = S.enemies.length;
    const f = frames || 120;
    const t0 = performance.now();
    this.step(f);
    const ms = performance.now() - t0;
    return { entities: count, frames: f, totalMs: +ms.toFixed(2), perStepMs: +(ms / f).toFixed(4) };
  },

  goto(x) { S.players[0].x = x; snapCamera(); this.step(1); },
  snapCamera, reset() { reset(); }, lastKnock() { return S.lastKnock; },
  forceClearEnemies() { S.enemies = []; S.lastKnock = null; },

  /** 断言 #3：战锤 toEdge 击退。
      靶子 z 与玩家差 10（> 8 ⇒ 不触发推挤，> 15 才算打空 ⇒ 命中）；
      这样相机不会被推挤带偏，击退终点才可精确断言。 */
  hammerKnockTest() {
    const p = S.players[0];
    p.x = 600; p.z = 20; p.h = 0; p.facing = 1; p.stun = 0; p.kb = null;
    p.iframes = 9999; p.state = 'idle'; p.asp = 0; p.weapon = 'hammer';
    S.enemies = []; S.lastKnock = null; S.hitstop = 0;
    this.silenceWaves();
    snapCamera();

    const e = makeEnemy('gladiator', { z: 30, from: 'right' });   // hp 6 ⇒ 一击不死，能飞完
    e.x = 632; e.facing = 1;         // 背对玩家 ⇒ 不触发正面格挡
    e.stun = 9999;                   // 冻住 AI，保证测量确定性
    S.enemies.push(e);

    const camR = S.camera.x + VIEW_W;
    this.setInput({ attack: 1 });
    this.step(1);
    this.setInput({});
    this.step(90);
    return {
      camR: +camR.toFixed(2),
      expectedEdge: +(camR - COMBAT.edgeMargin).toFixed(2),
      lastKnock: S.lastKnock,
      enemy: { x: +e.x.toFixed(2), z: +e.z.toFixed(2), hp: e.hp, stun: e.stun, dead: e.dead },
    };
  },

  /** 断言 #3b：正面格挡 —— 落地正面打角斗士必须不掉血；背后打必须掉血 */
  guardTest() {
    const p = S.players[0];
    const run = (gladFacing) => {
      S = newState(); this.silenceWaves(); snapCamera();
      const pp = S.players[0];
      pp.x = 600; pp.z = 20; pp.h = 0; pp.facing = 1; pp.iframes = 9999;
      const e = makeEnemy('gladiator', { z: 20, from: 'right' });
      e.x = 632; e.facing = gladFacing; e.stun = 9999;
      S.enemies.push(e);
      this.setInput({ attack: 1 }); this.step(1); this.setInput({});
      this.step(20);
      return { hp: e.hp, maxHp: e.maxHp };
    };
    const front = run(-1);   // 角斗士朝左（面朝玩家）⇒ 格挡
    const back  = run(1);    // 角斗士朝右（背对玩家）⇒ 掉血
    return { front, back };
  },

  /** 断言 #4：尖刺坑眩晕（眩晕期间位移必须为 0） */
  spikeTest() {
    S.enemies = []; S.hitstop = 0;
    const p = S.players[0];
    const hz = LEVEL.hazards[0];
    this.silenceWaves();
    p.x = hz.x0 + 4; p.z = (hz.z0 + hz.z1) / 2; p.h = 0;
    p.stun = 0; p.spikeCd = 0; p.kb = null; p.iframes = 9999;
    snapCamera();
    this.setInput({ right: 1 });
    this.step(1);                   // 本帧踩中 → 生效
    const stunApplied = p.stun > 0;
    const stunFrames = p.stun;
    const x1 = p.x;                 // 以「已眩晕」为起点量位移
    this.step(30);
    const moved = Math.abs(p.x - x1);
    this.setInput({});
    return { stunApplied, stunFrames, movedWhileStunned: +moved.toFixed(4) };
  },

  /** 断言 #4b：贴在尖刺坑下沿（安全区）走，必须无事通过 */
  spikeSafeLaneTest() {
    S.enemies = []; S.hitstop = 0;
    const p = S.players[0];
    const hz = LEVEL.hazards[0];
    this.silenceWaves();
    p.x = hz.x0 - 30; p.z = hz.z1 + 2; p.h = 0;   // 下沿外侧
    p.stun = 0; p.spikeCd = 0; p.kb = null; p.iframes = 9999;
    snapCamera();
    this.setInput({ right: 1 });
    // 帧数由几何算出，不写死魔法数字（坑的 x0/x1 一改，写死的帧数就会静默失效）
    const need = Math.ceil((hz.x1 + 20 - p.x) / PLAYER_SPEED_X * 60) + 10;
    this.step(need);
    const passed = p.x > hz.x1;
    const stunned = p.stun > 0;
    this.setInput({});
    return { passed, stunned, x: +p.x.toFixed(1), steps: need, z: +p.z.toFixed(1) };
  },

  /** 断言 #5：交出武器后默认武器回到手上 */
  dropTest() {
    const p = S.players[0];
    p.weapon = 'hammer';
    const before = S.drops.length;
    dropWeapon(p);
    return {
      weaponNow: p.weapon, defaultWeapon: p.defaultWeapon,
      droppedToGround: S.drops.length - before,
      groundWeapons: S.drops.map((d) => d.weapon),
    };
  },

  /** 断言 #6：数据驱动 —— 新增一条武器定义即生效，逻辑代码一行未改 */
  addWeaponTest() {
    WEAPONS.__probe = { id: '__probe', name: '探针武器', tint: '#00ff00', reach: 99,
      startup: 1, active: 1, recover: 1, dmg: 1, comboCount: 1, onHit: [], dropWhenSwapped: true };
    const p = S.players[0];
    const bak = p.weapon;
    p.weapon = '__probe';
    const spec = specFor(p);
    const ok = !!spec && spec.reach === 99;
    p.weapon = bak;
    delete WEAPONS.__probe;
    return { ok, resolvedReach: spec && spec.reach };
  },

  /** 断言 #18：刀锋**视觉**与**判定**必须一致。
      判定边界 = reach + 半身宽；刀尖能伸多远 = 枢轴 + handLen。两者必须相等，
      否则就是「看着够不到却算中」（切片一第一版：弧线全程近垂直，
      刀尖水平只到 18~22px，判定却给 49px ⇒ 玩家读不出攻击距离）。
      另外每段弧**必须扫过 0°（水平）**，否则刀尖永远到不了判定距离。 */
  reachTest() {
    const rows = [];
    for (const w of Object.values(WEAPONS)) {
      const n = w.comboCount || 1;
      for (let c = 1; c <= n; c++) {
        rows.push({ id: w.id, combo: c, declared: w.reach,
          visual: +bladeReach(w, c).toFixed(3), handLen: +specHandLen(w).toFixed(2) });
      }
    }
    for (const e of Object.values(ENEMIES)) {
      rows.push({ id: e.id, combo: 1, declared: e.atk.reach,
        visual: +bladeReach(e.atk, 1).toFixed(3), handLen: +specHandLen(e.atk).toFixed(2) });
    }
    const swept = [];
    for (const w of Object.values(WEAPONS)) {
      const n = w.comboCount || 1;
      for (let c = 1; c <= n; c++) {
        const arc = specArc(w, c);
        swept.push({ id: w.id, combo: c, wind: arc.wind === undefined ? arc.from : arc.wind,
          from: arc.from, to: arc.to, crossesHorizon: arcCrossesHorizon(arc) });
      }
    }
    let maxErr = 0;
    for (const r of rows) maxErr = Math.max(maxErr, Math.abs(r.visual - r.declared));
    return {
      rows, swept, maxErr: +maxErr.toFixed(3),
      allConsistent: maxErr < 0.01 && swept.every((s) => s.crossesHorizon),
      horizonOk: swept.every((s) => s.crossesHorizon),
    };
  },

  /** 挥击分解：把一段攻击从第 1 帧到结束逐帧的「角度 / 刀尖向前偏移 / 刀尖离地」列出来。
      用于人工核对「刀有没有穿地」「刀尖什么时候真正到达判定距离」。 */
  swingBreakdown(o) {
    o = o || {};
    const spec = o.weapon ? WEAPONS[o.weapon] : WEAPONS.sword;
    const combo = o.combo || 1;
    const R = specHandLen(spec);
    const fake = { atk: spec, combo: combo, h: 0, z: 0, facing: 1, x: 0, asp: 0, state: 'attack' };
    const out = [];
    for (let p = 0; p < attackTotal(spec); p++) {
      const ang = swingAngleAt(fake, p);
      const rad = ang * Math.PI / 180;
      out.push({
        p, phase: p < spec.startup ? 'startup'
          : (p < spec.startup + spec.active ? 'active' : 'recover'),
        ang: +ang.toFixed(1),
        tipFwd: +(HAND_PIVOT.x + R * Math.cos(rad)).toFixed(1),
        tipDy: +(HAND_PIVOT.y + R * Math.sin(rad)).toFixed(1),   // < 0 = 在地面之上
      });
    }
    return { weapon: spec.id, combo: combo, handLen: R, reach: spec.reach,
      hitEdge: spec.reach + WORLD.actorW * 0.5, frames: out };
  },

  /** 断言 #19：生命口径 —— 10 滴 / 5 颗爱心 / 扣 1 滴显示半心（亮面 50%） */
  hpProbe(n) {
    const p = S.players[0];
    if (n !== undefined) p.hp = n;
    updateHud();
    const fillPct = elHearts.map((el) => {
      // ⚠️ 读**计算值**并容错解析：浏览器会把 `inset(0 50% 0 0)` 规范化成
      //    `inset(0px 50% 0px 0px)`，用 /inset\(0\s+([\d.]+)%/ 会匹配不到 →
      //    探针回退成 100%，于是「爱心全满」看起来像通过（第一版就是这么假通过的）。
      const cp = getComputedStyle(el.querySelector('.lit')).clipPath || '';
      const m = /inset\(([^)]*)\)/.exec(cp);
      if (!m) return null;
      const parts = m[1].trim().split(/\s+/).map((t) => parseFloat(t));
      const cut = parts.length >= 2 ? parts[1] : 0;
      return Number.isFinite(cut) ? +(100 - cut).toFixed(1) : null;
    });
    return { hp: p.hp, maxHp: p.maxHp, hearts: elHearts.length,
      fillPct: fillPct, text: elHpText.textContent,
      enemyDmg: Object.values(ENEMIES).map((e) => e.atk.dmg) };
  },

  /** 摆拍：把玩家钉在某一挥击帧上（逐帧核对刀锋位置用）。
      ⚠️ 先按 P 暂停再调 —— 否则 rAF 主循环每帧都会把 asp 往前推。 */
  poseAt(pos, combo) {
    const p = S.players[0];
    this.silenceWaves();
    S.enemies = []; S.drops = []; S.hitstop = 0; S.fx = [];
    p.state = 'attack'; p.atk = specFor(p); p.combo = combo || 1;
    p.asp = pos; p.h = 0; p.vy = 0; p.stun = 0; p.dead = false; p.iframes = 9999;
    p.reachNow = p.atk.reach * ((p.atk.comboReach && p.atk.comboReach[p.combo - 1]) || 1);
    snapCamera();
    // 顺带给出「脚底在视口里的坐标」——取证截图要靠它裁切到角色身上
    const rect = document.getElementById('cv').getBoundingClientRect();
    const sc = rect.width / VIEW_W;
    return { pos: pos, combo: p.combo, ang: +swingAngle(p).toFixed(1),
             phase: phaseOf(p, p.atk), reachNow: p.reachNow,
             anchor: { x: +(rect.left + (p.x - S.camera.x) * sc).toFixed(1),
                       y: +(rect.top + (GROUND_Y(p.z) - p.h) * sc).toFixed(1),
                       scale: +sc.toFixed(3) } };
  },

  /** 清场并走到终点（验证关卡可达与胜利判定） */
  marchToGoal() {
    const p = S.players[0];
    this.forceClearEnemies();
    for (let i = 0; i < LEVEL.waves.length; i++) S.waveFired[i] = true;
    p.z = LEVEL.hazards[0].z1 + 4;
    this.setInput({ right: 1 });
    let n = 0;
    while (p.x < LEVEL.goalX && n < 3000) { this.step(1); n++; }
    this.setInput({});
    return { reached: p.x >= LEVEL.goalX, steps: n, phase: S.phase, x: +p.x.toFixed(1) };
  },
};

/* ════════════════════════════════════════════════════════════════════
   §14  启动
   ════════════════════════════════════════════════════════════════════ */

function reset() {
  S = newState();
  inputOverride = null;
  heldKeys.clear();
  prevInput.length = 0;
  acc = 0; lastT = 0;
  lastHpShown = null;                    // 重开时不要弹出「掉血」动画
  elOver.classList.remove('on');
  snapCamera();
  toast('「←→」移动 ·「↑↓」纵深 ·「.」跳跃 ·「,」攻击', 340);
  updateHud();
}

buildHearts();                            // 爱心：DOM 结构只建一次，之后只改 clip-path
S = newState();
resize();
snapCamera();
toast('「←→」移动 ·「↑↓」纵深 ·「.」跳跃 ·「,」攻击', 340);
requestAnimationFrame(frame);

})();
</script>
