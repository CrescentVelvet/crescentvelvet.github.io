         * ============================================================
         * 十一、战场地图绘制系统
         * ============================================================
         *
         *   设计目标:
         *     - 真实战场比例: 单位缩小, 战场容纳更多单位, 呈现大规模战役
         *     - 地形程序化绘制: 按想定 terrain 字段切换草原/废墟/沙漠风格
         *     - 性能: 静态地形一次绘制缓存, 动态单位用 DOM 叠加
         *
         *   单位尺寸缩小表 (适应 1100×750 战场, 仅视觉缩小):
         *     兵种类    v2.0  v3.0   说明
         *     坦克系    36    22     保留炮塔/履带/炮管像素细节
         *     火炮系    32    20     保留驻锄/炮盾/车轮
         *     火箭炮    32    20     保留多管发射架
         *     步兵系    22    14     保留头身比例, 简化细节
         *     车辆系    28    18     侦察车/装甲运兵车/补给车/指挥车
         *   注: 碰撞/射程/视野数值不变 (战术平衡保持)
         *       单位 DOM 仍用 div, 内部像素 div 按比例缩放
         *
         *   战场地图分层结构:
         *     ┌──────────────────────────────────┐
         *     │ Layer 3: DOM 单位层 (div)        │ 可交互, z=10
         *     │ Layer 2: DOM 掩体层 (div)        │ 可碰撞, z=4
         *     │ Layer 1: Canvas 装饰层           │ 瓦砾/草丛/弹坑, 静态
         *     │ Layer 0: Canvas 地形底层         │ 底色+纹理+河流道路
         *     └──────────────────────────────────┘
         *   .battlefield 容器内:
         *     <canvas id="terrainCanvas">   绝对定位 z=0  (底色+河流)
         *     <canvas id="decorCanvas">     绝对定位 z=1  (瓦砾/草丛)
         *     <div class="obstacle">...     绝对定位 z=4  (可碰撞掩体)
         *     <div class="unit">...         绝对定位 z=10 (可交互单位)
         *
         *   地形类型绘制规范 (按想定 terrain.type):
         *     steppe (草原, 普罗霍罗夫卡):
         *       底色: 草绿 #7a8a3a + 噪点纹理
         *       装饰: 麦田色块(麦黄 #c4b06a) + 泥土路径(棕 #4a4a2a)
         *       要素: 铁路堤(直线灰条) + 河流(蓝灰曲线)
         *     urban_ruin (城市废墟, 斯大林格勒):
         *       底色: 灰白 #6b6660 + 焦黑斑驳
         *       装饰: 瓦砾散布(灰白碎块) + 弹坑(黑环) + 烟尘
         *       要素: 破墙断壁(灰色长条) + 伏尔加河(蓝灰)
         *     desert (沙漠, 预留):
         *       底色: 沙黄 #c4a46a + 沙丘纹路
         *       装饰: 沙丘起伏 + 稀疏石块
         *       要素: 油井设施 + 雷区标识
         *
         *   TerrainRenderer 类设计:
         *     class TerrainRenderer {
         *       constructor(terrainCanvas, decorCanvas, scenario)
         *       render() {
         *         this.drawGround()      // 底色 + 噪点
         *         this.drawFeatures()    // 河流/道路/铁路
         *         this.drawDecorations() // 瓦砾/草丛/弹坑
         *       }
         *       // 按 palette.ground 填充 + 程序化噪点
         *       drawGround()
         *       // 按 obstacles[type=river/embankment] 绘制地形要素
         *       drawFeatures()
         *       // 按 terrain.type 程序化散布装饰 (种子化, 可复现)
         *       drawDecorations()
         *     }
         *   静态绘制一次完成, 切换想定时重绘
         *
         *   与想定数据衔接:
         *     scenario.terrain.palette  → drawGround 配色
         *     scenario.terrain.pattern  → drawDecorations 装饰风格
         *     scenario.obstacles[type=river/embankment] → drawFeatures
         *     scenario.obstacles[type=house/ruin/wall] → DOM 掩体层 (可碰撞)
         *
         *   迁移说明:
         *     现有 .battlefield CSS 背景渐变 → 替换为 Canvas 绘制
         *     保留 .battlefield 容器作为定位上下文
         *     现有单位 CSS (.unit.tank --unit-size:36px) → 改为 22px
         */

        class GameObject {
            constructor(x, y, type, team, health) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.team = team;
                this.health = health;
                this.maxHealth = health;
                this.pointCost = (typeof UNIT_PRESETS !== 'undefined' && UNIT_PRESETS[type] && UNIT_PRESETS[type].pointCost) || 0;
                // v3.0 士气系统
                this.baseMorale = (type === 'tank') ? 80 : (type === 'artillery' || type === 'rocket') ? 65 : 60;
                this.morale = this.baseMorale;
                // v3.0 伤害类型系统
                this.armorType = 'infantry';
                this.damageTable = { infantry: 1, vehicle: 1, tank: 1 };
                this.element = null;
                this.selected = false;
                this.angle = 0;
                this.desiredAngle = 0;
                this.maxTurnSpeed = 140; // 度/秒
                this.state = 'patrol';
                this.currentTarget = null;
                
                // 实时移动和攻击系统
                this.targetX = x;
                this.targetY = y;
                this.path = [];
                this.pathTargetX = x;
                this.pathTargetY = y;
                this.lastPathTime = 0;
                this.pathCooldown = 450;
                this.isMoving = false;
                this.lastAttackTime = 0;
                this.attackCooldown = 1000; // 1秒攻击冷却
                this.lastMoveTime = 0;
                this.moveCooldown = 2000; // 2秒移动冷却
                this.velocity = { x: 0, y: 0 };
                this.maxSpeed = 22; // 像素/秒
                this.strafeDirection = Math.random() > 0.5 ? 1 : -1;
                this.lastStrafeSwitch = Date.now();

                // 履带车辆（坦克/火炮）：只能沿车体朝向前进/后退，
                // 改变方向需先原地旋转对准再行驶；步兵可自由平移
                this.isTracked = false;
                this.alignTolerance = 12;
                // 侧向绕行：视线被障碍物遮挡时，沿垂直方向移动寻找清晰射线
                this.flankDir = Math.random() > 0.5 ? 1 : -1;
                this.flankBlockedUntil = 0;

                // ---- 反复移动循环修复：状态滞回与目标稳定 ----
                // 目标锁定：避免在两个等距敌人间反复切换
                this.targetLockUntil = 0;
                // 卡死检测：三轴全堵时累计时间，超阈值才重寻路
                this.stuckTime = 0;
                // 稳定的撤退锚点（仅在目标大幅移动时重算）
                this.strafeAnchorX = NaN;
                this.strafeAnchorY = NaN;
            }

            // 模板方法
            createElement() {
                this.element = document.createElement('div');
                this.element.className = `unit ${this.type} ${this.team}`;
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                this.element.style.width = this.getSize() + 'px';
                this.element.style.height = this.getSize() + 'px';

                this.element.innerHTML = this.getDisplayMarkup();
                this.bodyElement = this.element.querySelector('.unit-body');
                this.element.onclick = () => this.select();
                this.element.onmouseover = (e) => this.showInfo(e);
                this.element.onmouseout = () => this.hideInfo();

                return this.element;
            }

            getSize() {
                if (this.type === 'tank') return 22;
                if (this.type === 'artillery' || this.type === 'rocket' || this.type === 'mortar' || this.type === 'catapult') return 20;
                if (this.type === 'command' || this.type === 'supply' || this.type === 'scout' || this.type === 'apc' || this.type === 'cavalry') return 18;
                return 14;
            }

            getDisplayMarkup() {
                let body;
                if (this.type === 'tank' || this.type === 'lightTank') {
                    body = '<div class="tank-track left"></div><div class="tank-track right"></div><div class="tank-body"></div><div class="tank-turret"></div><div class="tank-barrel"></div>';
                } else if (this.type === 'tankDestroyer') {
                    body = '<div class="td-track left"></div><div class="td-track right"></div><div class="td-hull"></div><div class="td-barrel"></div>';
                } else if (this.type === 'command') {
                    body = '<div class="command-body"></div><div class="command-antenna"></div><div class="command-star"></div>';
                } else if (this.type === 'supply') {
                    body = '<div class="supply-body"></div><div class="supply-cross"></div>';
                } else if (this.type === 'engineer') {
                    body = '<div class="soldier-head"></div><div class="soldier-body"></div><div class="engineer-tool"></div>';
                } else if (this.type === 'medic') {
                    body = '<div class="soldier-head"></div><div class="soldier-body"></div><div class="medic-cross"></div>';
                } else if (this.type === 'antitank') {
                    body = '<div class="soldier-head"></div><div class="soldier-body"></div><div class="antitank-tube"></div>';
                } else if (this.type === 'scout') {
                    body = '<div class="scout-body"></div><div class="scout-wheel left"></div><div class="scout-wheel right"></div><div class="scout-antenna"></div>';
                } else if (this.type === 'apc') {
                    body = '<div class="apc-body"></div><div class="apc-wheel f1"></div><div class="apc-wheel f2"></div><div class="apc-wheel f3"></div>';
                } else if (this.type === 'mortar') {
                    body = '<div class="mortar-base"></div><div class="mortar-tube"></div>';
                } else if (this.type === 'melee') {
                    body = '<div class="soldier-head"></div><div class="soldier-body"></div><div class="melee-spear"></div>';
                } else if (this.type === 'archer') {
                    body = '<div class="soldier-head"></div><div class="soldier-body"></div><div class="archer-bow"></div>';
                } else if (this.type === 'cavalry') {
                    body = '<div class="cavalry-horse"></div><div class="cavalry-rider"></div><div class="cavalry-head"></div><div class="cavalry-spear"></div>';
                } else if (this.type === 'catapult') {
                    body = '<div class="catapult-base"></div><div class="catapult-arm"></div><div class="catapult-sling"></div><div class="catapult-wheel left"></div><div class="catapult-wheel right"></div>';
                } else if (this.type === 'crossbow') {
                    body = '<div class="soldier-head"></div><div class="soldier-body"></div><div class="crossbow-div"></div><div class="crossbow-string"></div>';
                } else {
                    body = '<div class="soldier-head"></div><div class="soldier-body"></div>';
                }

                return `<div class="unit-body">${body}</div><div class="hp-bar"><div class="hp-fill" style="width: ${this.getHealthPercent()}%"></div></div>`;
            }

            getHealthPercent() {
                return Math.max(0, Math.min(100, (this.health / this.maxHealth) * 100));
            }

            updateVisual() {
                if (!this.element) return;

                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';

                if (this.bodyElement) {
                    this.bodyElement.style.setProperty('--angle', `${this.angle}deg`);
                }

                const hpFill = this.element.querySelector('.hp-fill');
                if (hpFill) {
                    hpFill.style.width = this.getHealthPercent() + '%';
                    hpFill.style.background = this.getHealthPercent() < 35 ? '#e74c3c' : '#2ecc71';
                }

                this.element.classList.toggle('moving', this.isMoving);
            }

            normalizeAngle(angle) {
                return ((angle % 360) + 360) % 360;
            }

            shortestAngleDelta(from, to) {
                return ((to - from + 540) % 360) - 180;
            }

            getAngleTo(target) {
                const dx = target.x - this.x;
                const dy = target.y - this.y;
                return this.normalizeAngle(Math.atan2(dy, dx) * 180 / Math.PI + 90);
            }

            setDesiredAngle(angle) {
                this.desiredAngle = this.normalizeAngle(angle);
            }

            updateRotation(deltaTime) {
                const delta = this.shortestAngleDelta(this.angle, this.desiredAngle);
                const maxStep = this.maxTurnSpeed * deltaTime;

                if (Math.abs(delta) <= maxStep) {
                    this.angle = this.desiredAngle;
                } else {
                    this.angle = this.normalizeAngle(this.angle + Math.sign(delta) * maxStep);
                }
            }

            isFacing(target, tolerance = 14) {
                return Math.abs(this.shortestAngleDelta(this.angle, this.getAngleTo(target))) <= tolerance;
            }

            angleToPoint(x, y) {
                const dx = x - this.x;
                const dy = y - this.y;
                return this.normalizeAngle(Math.atan2(dy, dx) * 180 / Math.PI + 90);
            }

            forwardVector() {
                const radians = (this.angle - 90) * Math.PI / 180;
                return {
                    x: Math.cos(radians),
                    y: Math.sin(radians)
                };
            }

            select() {
                // 取消其他单位的选择
                document.querySelectorAll('.unit.selected').forEach(unit => {
                    unit.classList.remove('selected');
                });
                
                this.selected = true;
                this.element.classList.add('selected');
            }

            showInfo(event) {
                const info = document.getElementById('unitInfo');
                const typeName = unitTypeName(this.type);
                let extra = '';
                if (this.type === 'artillery' && this.deployed !== undefined) {
                    extra = ` (${this.deployed ? '已部署' : (this.deploying ? '部署中' : '未部署')})`;
                }
                info.innerHTML = `
                    <strong>${typeName}</strong><br>
                    阵营: ${this.team === 'ally' ? '友军' : '敌军'}<br>
                    生命值: ${this.health}/${this.maxHealth}${extra}<br>
                    士气: ${Math.round(this.morale)}<br>
                    状态: ${this.getStateText()}
                `;
                info.style.display = 'block';
                info.style.left = event.pageX + 10 + 'px';
                info.style.top = event.pageY - 10 + 'px';
            }

            // 单位状态文本 (溃退/撤退/瞄准/部署中/机动/收起/追击/跟随/后撤/侧绕/巡逻/射击/作战/停止/待命)
            getStateText() {
                if (this.morale < 15 || this.state === 'flee') return '溃退';
                if (this.state === 'retreat') return '撤退';
                // 火炮特殊状态
                if (this.state === 'standby') return '瞄准';      // 滞回盲区原地待命朝敌旋转
                if (this.state === 'deploying') return '部署中';
                if (this.state === 'maneuver') return '机动';
                if (this.state === 'fallback') return '收起';
                if (this.isMoving) {
                    if (this.state === 'chase') return '追击';
                    if (this.state === 'follow') return '跟随';
                    if (this.state === 'backoff') return '后撤';
                    if (this.state === 'flank') return '侧绕';
                    if (this.state === 'patrol') return '巡逻';
                    return '移动';
                }
                if (this.state === 'hold') {
                    const now = Date.now();
                    if (now - this.lastAttackTime < 2000) return '射击';
                    return '作战';  // hold 状态攻击冷却中也是作战 (非待命)
                }
                if (this.state === 'chase') return '停止';  // 追击中停下 (卡住/到达 target)
                return '待命';
            }

            hideInfo() {
                document.getElementById('unitInfo').style.display = 'none';
            }

            // v3.0 伤害类型: baseDamage × damageTable[target.armorType]
            getAttackDamage(target) {
                let dmg = this.attackPower + Math.floor(Math.random() * 10);
                if (target && this.damageTable && target.armorType) {
                    dmg = Math.round(dmg * (this.damageTable[target.armorType] || 1));
                }
                return Math.max(1, dmg);
            }

            move(dx, dy) {
                this.x += dx;
                this.y += dy;
                this.updateVisual();
            }

            smoothMove(targetX, targetY, duration = 1000) {
                if (!this.element) return;
                
                // 添加移动状态
                this.element.classList.add('moving');
                
                const startX = this.x;
                const startY = this.y;
                const deltaX = targetX - startX;
                const deltaY = targetY - startY;
                const startTime = performance.now();
                
                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // 使用缓动函数
                    const easeProgress = this.easeInOutCubic(progress);
                    
                    this.x = startX + deltaX * easeProgress;
                    this.y = startY + deltaY * easeProgress;
                    
                    if (this.element) {
                        this.element.style.left = this.x + 'px';
                        this.element.style.top = this.y + 'px';
                    }
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        // 移动完成，移除移动状态
                        if (this.element) this.element.classList.remove('moving');
                    }
                };
                
                requestAnimationFrame(animate);
            }

            easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1;
            }

            // 实时更新方法
            update(deltaTime, allUnits) {
                if (this.isDead()) return;

                // v3.0 士气更新
                this.updateMorale(deltaTime, allUnits);

                const nearestEnemy = this.acquireTarget(allUnits);

                // v3.0 士气溃退: morale < 15 全速远离敌人, 无视玩家指令
                if (this.morale < 15 && nearestEnemy) {
                    this.state = 'flee';
                    this.moveAwayFrom(nearestEnemy, 220);
                    this.updatePosition(deltaTime, allUnits);
                    return;
                }

                if (nearestEnemy) {
                    const distance = this.getDistance(nearestEnemy);
                    const range = this.attackRange;

                    // 滞回带（hysteresis）：根据当前状态使用不同阈值，杜绝边界反复跳变
                    let chaseLine, backoffLine;
                    if (this.state === 'chase') {
                        chaseLine = range * 0.82;
                        backoffLine = range * 0.40;
                    } else if (this.state === 'backoff') {
                        chaseLine = range * 0.96;
                        backoffLine = range * 0.60;
                    } else {
                        chaseLine = range * 0.96;
                        backoffLine = range * 0.40;
                    }

                    // 动摇(morale<30)只降攻速不后撤 (避免后撤→孤立→崩溃正反馈), 仅溃退(<15)才 FLEE
                    if (distance > chaseLine) {
                        if (this.state !== 'chase') {
                            this.state = 'chase';
                        }
                        this.moveTowards(nearestEnemy);
                    } else if (distance < backoffLine) {
                        if (this.isTracked) {
                            // 履带车不后退逃离, 正面迎敌开火 (坦克正面减伤)
                            this.state = 'hold';
                            this.holdAndAttack(nearestEnemy, distance, range);
                        } else {
                            if (this.state !== 'backoff') {
                                this.state = 'backoff';
                            }
                            this.moveAwayFrom(nearestEnemy, 90);
                        }
                    } else if (!this.hasLineOfSight(nearestEnemy)) {
                        // 视线被掩体挡: 接近敌人位置寻路绕过掩体, path 用完且 1.5s 后重规划 (避免中途反复变 path 扭头)
                        this.state = 'chase';
                        this.moveTowards(nearestEnemy, 0.0);
                        if (this.path.length === 0 && (!this.lastRepathTime || Date.now() - this.lastRepathTime > 1500)) {
                            this.lastRepathTime = Date.now();
                            this.updatePathToTarget(true);
                        }
                        this.tryAttack(nearestEnemy);
                    } else {
                        // 最佳射程带：视线清晰，停下攻击，间歇性机动走位
                        this.state = 'hold';
                        this.holdAndAttack(nearestEnemy, distance, range);
                    }
                } else {
                    this.state = 'patrol';
                    this.randomMove(deltaTime);
                }

                this.updatePosition(deltaTime, allUnits);
            }

            findNearestEnemy(allUnits) {
                let nearestEnemy = null;
                let nearestScore = Infinity;

                for (const unit of allUnits) {
                    if (unit !== this && unit.team !== this.team && !unit.isDead()) {
                        const distance = this.getDistance(unit);
                        const penalty = unit.type === 'artillery' ? 100 : 0;
                        const losPenalty = this.hasLineOfSight(unit) ? 0 : 150;
                        const score = distance + penalty + losPenalty;
                        if (score < nearestScore) {
                            nearestScore = score;
                            nearestEnemy = unit;
                        }
                    }
                }

                return nearestEnemy;
            }

            acquireTarget(allUnits) {
                const now = Date.now();
                if (
                    this.currentTarget &&
                    !this.currentTarget.isDead() &&
                    this.currentTarget.team !== this.team &&
                    allUnits.includes(this.currentTarget) &&
                    this.getDistance(this.currentTarget) < this.attackRange * 1.8 &&
                    now < this.targetLockUntil
                ) {
                    return this.currentTarget;
                }

                const newTarget = this.findNearestEnemy(allUnits);
                if (newTarget && newTarget !== this.currentTarget) {
                    // 目标切换：锁定较长时间，避免在等距敌人间反复翻转
                    this.targetLockUntil = now + 700;
                } else if (newTarget) {
                    // 同一目标续锁：允许周期性重评估但不逐帧切换
                    this.targetLockUntil = now + 350;
                }
                this.currentTarget = newTarget;
                return this.currentTarget;
            }

            getDistance(target) {
                const myCenterX = this.x + this.getSize() / 2;
                const myCenterY = this.y + this.getSize() / 2;
                const targetCenterX = target.x + target.getSize() / 2;
                const targetCenterY = target.y + target.getSize() / 2;

                const dx = targetCenterX - myCenterX;
                const dy = targetCenterY - myCenterY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            // 视线检测：判断与目标之间是否有障碍物遮挡
            hasLineOfSight(target) {
                if (!battlefieldManager || battlefieldManager.obstacles.length === 0) return true;
                const myCX = this.x + this.getSize() / 2;
                const myCY = this.y + this.getSize() / 2;
                const tCX = target.x + target.getSize() / 2;
                const tCY = target.y + target.getSize() / 2;
                // 检查尺寸与子弹/单位匹配 (避免视线通过但子弹被挡循环射击)
                const checkSize = Math.max(8, Math.floor(this.getSize() / 2));
                return !battlefieldManager.pathBlockedByObstacle(myCX, myCY, tCX, tCY, checkSize);
            }

            // v3.0 士气系统: 每帧更新士气 (血量上限/孤立/被集火/溃逃传染)
            updateMorale(deltaTime, allUnits) {
                if (this.isDead()) return;
                const healthFactor = Math.max(0, this.health / this.maxHealth);

                let delta = 0;
                let hasAllyNear = false;
                let hasCommander = false;
                let hasLogistics = false;
                let panicNearby = false;
                let hasEnemyNear = false;
                let attackerCount = 0;

                // 一次遍历: 友军(孤立/指挥车/后勤/溃逃传染) + 敌人(附近/被集火)
                for (const u of allUnits) {
                    if (u === this || u.isDead()) continue;
                    const d = this.getDistance(u);
                    if (u.team === this.team) {
                        if (d < 100) hasAllyNear = true;
                        if (u.type === 'command' && d < 150) hasCommander = true;
                        if ((u.type === 'supply' || u.type === 'engineer' || u.type === 'medic') && d < 100) hasLogistics = true;
                        if (u.morale !== undefined && u.morale < 20 && d < 120) panicNearby = true;
                    } else {
                        if (d < 300) hasEnemyNear = true;
                        if (u.currentTarget === this) attackerCount++;
                    }
                }
                // 负面因素 (降低强度避免双方快速崩溃)
                // 队友鼓舞/孤立: 有队友 +5/s (逃跑时队友来可恢复回头), 无队友 -3
                if (hasAllyNear) delta += 5;
                else delta -= 3;
                if (panicNearby) delta -= 3;
                if (attackerCount > 1) delta -= 2 * (attackerCount - 1);
                // 恢复因素
                if (hasLogistics) delta += 5;
                if (!hasEnemyNear) delta += 5;

                // 士气上限: 血量奖励 (满血 +30, 血量低降, 满血不易溃退)
                const moraleCap = this.baseMorale + 30 * healthFactor + (hasCommander ? 15 : 0);

                this.morale += delta * deltaTime;
                if (this.morale > moraleCap) this.morale = moraleCap;
                if (this.morale < 0) this.morale = 0;
            }

            // 士气档位: 返回攻速 cooldown 倍率 (1.0 正常, 0.9 高昂, 1.3 动摇, 0 溃退不开火)
            getMoraleAttackFactor() {
                if (this.morale < 15) return 0;       // 溃退: 不开火
                if (this.morale < 30) return 1.3;      // 动摇: 攻速 -30% (不后撤, 只降攻速)
                if (this.morale > 70) return 0.9;      // 高昂: 攻速 +10%
                return 1.0;                            // 稳定
            }

            tryAttack(target) {
                // v3.0 士气: 溃退不开火, 动摇攻速降, 高昂攻速升
                const moraleFactor = this.getMoraleAttackFactor();
                if (moraleFactor === 0) return;
                const now = Date.now();
                // 指挥车光环: 攻速 +15%
                const buffed = this.commandBuffUntil && this.commandBuffUntil > now;
                const cooldown = this.attackCooldown * moraleFactor * (buffed ? 0.85 : 1);
                if (now - this.lastAttackTime < cooldown) return;

                const distance = this.getDistance(target);
                if (distance <= this.attackRange && target.team !== this.team && !target.isDead()) {
                    this.turnToward(target);
                    // 轻坦行进间开火: canMoveFire 跳过 isFacing 检查
                    if (!this.canMoveFire && !this.isFacing(target)) return;

                    if (!this.hasLineOfSight(target)) return;

                    this.lastAttackTime = now;
                    // 指挥车光环: 攻击 +10% (伤害类型: baseDamage × damageTable[target.armorType])
                    let damage = this.getAttackDamage(target);
                    if (buffed) damage = Math.round(damage * 1.1);
                    battlefieldManager.spawnProjectile(this, target, damage);
                }
            }

            turnToward(target) {
                this.setDesiredAngle(this.getAngleTo(target));
            }

            clampTarget() {
                const battlefield = document.getElementById('battlefield');
                const maxX = battlefield.offsetWidth - this.getSize();
                const maxY = battlefield.offsetHeight - this.getSize();

                this.targetX = Math.max(0, Math.min(maxX, this.targetX));
                this.targetY = Math.max(0, Math.min(maxY, this.targetY));
                this.updatePathToTarget();
                this.isMoving = true;
            }

            updatePathToTarget(force = false) {
                if (!battlefieldManager || battlefieldManager.obstacles.length === 0) {
                    this.path = [];
                    return;
                }

                const now = Date.now();
                const targetMoved = Math.abs(this.targetX - this.pathTargetX) > 24 || Math.abs(this.targetY - this.pathTargetY) > 24;
                const lineBlocked = battlefieldManager.pathBlockedByObstacle(this.x, this.y, this.targetX, this.targetY, this.getSize());

                if (!lineBlocked) {
                    this.path = [];
                    this.pathTargetX = this.targetX;
                    this.pathTargetY = this.targetY;
                    return;
                }

                if (!force && !targetMoved && this.path.length > 0 && now - this.lastPathTime < this.pathCooldown) {
                    return;
                }

                if (!force && now - this.lastPathTime < this.pathCooldown) {
                    return;
                }

                this.path = battlefieldManager.findPath(this.x, this.y, this.targetX, this.targetY, this.getSize());
                this.pathTargetX = this.targetX;
                this.pathTargetY = this.targetY;
                this.lastPathTime = now;
            }

            getMoveTarget() {
                if (this.path.length === 0) {
                    return { x: this.targetX, y: this.targetY, isWaypoint: false };
                }

                const waypoint = this.path[0];
                const dx = waypoint.x - this.x;
                const dy = waypoint.y - this.y;
                if (Math.sqrt(dx * dx + dy * dy) < 8) {
                    this.path.shift();
                    return this.getMoveTarget();
                }

                return { x: waypoint.x, y: waypoint.y, isWaypoint: true };
            }

            moveTowards(target, stopFactor) {
                const targetCenterX = target.x + target.getSize() / 2;
                const targetCenterY = target.y + target.getSize() / 2;
                const myCenterX = this.x + this.getSize() / 2;
                const myCenterY = this.y + this.getSize() / 2;

                const dx = targetCenterX - myCenterX;
                const dy = targetCenterY - myCenterY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) {
                    const stopDist = this.attackRange * (stopFactor !== undefined ? stopFactor : 0.88);
                    const ratio = Math.max(0, dist - stopDist) / dist;

                    this.targetX = myCenterX + dx * ratio - this.getSize() / 2;
                    this.targetY = myCenterY + dy * ratio - this.getSize() / 2;
                    this.setDesiredAngle(Math.atan2(dy, dx) * 180 / Math.PI + 90);
                    if (Math.abs(this.targetX - this.pathTargetX) > 6 ||
                        Math.abs(this.targetY - this.pathTargetY) > 6 || !this.isMoving) {
                        this.clampTarget();
                    }
                }
            }

            moveAwayFrom(target, distance) {
                const dx = this.x - target.x;
                const dy = this.y - target.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;

                this.targetX = this.x + (dx / dist) * distance;
                this.targetY = this.y + (dy / dist) * distance;
                this.setDesiredAngle(Math.atan2(-dy, -dx) * 180 / Math.PI + 90);
                if (Math.abs(this.targetX - this.pathTargetX) > 6 ||
                    Math.abs(this.targetY - this.pathTargetY) > 6 || !this.isMoving) {
                    this.clampTarget();
                }
            }

            strafeAround(target) {
                // 保留接口兼容，实际逻辑由 holdAndAttack 接管
                this.holdAndAttack(target, this.getDistance(target), this.attackRange);
            }

            // 视线被障碍物遮挡时，沿垂直于敌人方向的侧向移动，
            // 寻找能直射敌人的位置；方向固定且定期翻转，避免原地打转
            flankForShot(target) {
                // 正在走向侧向目标点时让其走完，不每帧重算（否则目标随单位漂移→永续轨道）
                if (this.isMoving && this.path.length === 0) {
                    const moveTarget = this.getMoveTarget();
                    const mdx = moveTarget.x - this.x;
                    const mdy = moveTarget.y - this.y;
                    if (Math.sqrt(mdx * mdx + mdy * mdy) > 4) {
                        return;
                    }
                    this.isMoving = false;
                    if (this.element) this.element.classList.remove('moving');
                }

                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const perpX = -dy / dist;
                const perpY = dx / dist;

                const now = Date.now();
                const bf = document.getElementById('battlefield');
                const maxX = bf.offsetWidth - this.getSize();
                const maxY = bf.offsetHeight - this.getSize();
                const nearEdge = this.x < 30 || this.x > maxX - 30 ||
                    this.y < 30 || this.y > maxY - 30;
                if (now > this.flankBlockedUntil && (nearEdge || Math.random() < 0.02)) {
                    this.flankDir *= -1;
                    this.flankBlockedUntil = now + 1200;
                }

                const flankDist = 55 + Math.random() * 15;
                const rangeCorrection = (dist - this.attackRange * 0.7) * 0.15;
                let fX = Math.max(0, Math.min(maxX,
                    this.x + perpX * this.flankDir * flankDist + (dx / dist) * rangeCorrection));
                let fY = Math.max(0, Math.min(maxY,
                    this.y + perpY * this.flankDir * flankDist + (dy / dist) * rangeCorrection));

                // 侧向目标点在障碍物内：翻转方向重试，仍不行则原地等待
                if (battlefieldManager.obstacles.length > 0 &&
                    battlefieldManager.collidesWithObstacle(fX, fY, this.getSize(), this.getSize(), 4)) {
                    this.flankDir *= -1;
                    this.flankBlockedUntil = now + 800;
                    fX = Math.max(0, Math.min(maxX,
                        this.x + perpX * this.flankDir * flankDist + (dx / dist) * rangeCorrection));
                    fY = Math.max(0, Math.min(maxY,
                        this.y + perpY * this.flankDir * flankDist + (dy / dist) * rangeCorrection));
                    if (battlefieldManager.collidesWithObstacle(fX, fY, this.getSize(), this.getSize(), 4)) {
                        return;
                    }
                }

                this.targetX = fX;
                this.targetY = fY;
                this.path = [];
                this.isMoving = true;
            }

            // 最佳射程带内的行为：停下攻击 + 间歇性短促走位
            // 关键修复：strafe 目标点只在周期到期或目标大幅移动时重算，
            // 不再每帧随单位位置漂移（这是导致永续轨道运动的根因）
            holdAndAttack(target, distance, range) {
                const now = Date.now();

                // 履带车辆: 进入最佳射程带后停车转向敌人开火
                // 轻坦(canMoveFire)行进间开火, 不停车
                if (this.isTracked) {
                    if (!this.canMoveFire && this.isMoving) {
                        this.isMoving = false;
                        this.path = [];
                        if (this.element) this.element.classList.remove('moving');
                    }
                    this.turnToward(target);
                    this.tryAttack(target);
                    return;
                }

                // 步兵：停下攻击 + 间歇性侧向走位（闪避）
                this.turnToward(target);
                this.tryAttack(target);

                // 若正在执行一次走位机动，让其完成再停下
                if (this.isMoving && this.path.length === 0) {
                    const moveTarget = this.getMoveTarget();
                    const mdx = moveTarget.x - this.x;
                    const mdy = moveTarget.y - this.y;
                    if (Math.sqrt(mdx * mdx + mdy * mdy) > 4) {
                        this.tryAttack(target);
                        return;
                    }
                    this.isMoving = false;
                    if (this.element) this.element.classList.remove('moving');
                }

                const strafeInterval = 2200 + Math.random() * 1800;
                if (now - this.lastStrafeSwitch > strafeInterval) {
                    this.lastStrafeSwitch = now;
                    this.strafeDirection *= -1;

                    const dx = target.x - this.x;
                    const dy = target.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const perpX = -dy / dist;
                    const perpY = dx / dist;
                    const rangeCorrection = (dist - range * 0.7) * 0.2;
                    const strafeDist = 32 + Math.random() * 22;

                    const bf = document.getElementById('battlefield');
                    const maxX = bf.offsetWidth - this.getSize();
                    const maxY = bf.offsetHeight - this.getSize();
                    let sX = Math.max(0, Math.min(maxX,
                        this.x + perpX * this.strafeDirection * strafeDist + (dx / dist) * rangeCorrection));
                    let sY = Math.max(0, Math.min(maxY,
                        this.y + perpY * this.strafeDirection * strafeDist + (dy / dist) * rangeCorrection));

                    // 走位目标点在障碍物内：翻转方向重试，仍不行则跳过本次走位
                    if (battlefieldManager.obstacles.length > 0 &&
                        battlefieldManager.collidesWithObstacle(sX, sY, this.getSize(), this.getSize(), 4)) {
                        this.strafeDirection *= -1;
                        sX = Math.max(0, Math.min(maxX,
                            this.x + perpX * this.strafeDirection * strafeDist + (dx / dist) * rangeCorrection));
                        sY = Math.max(0, Math.min(maxY,
                            this.y + perpY * this.strafeDirection * strafeDist + (dy / dist) * rangeCorrection));
                        if (battlefieldManager.collidesWithObstacle(sX, sY, this.getSize(), this.getSize(), 4)) {
                            return;
                        }
                    }

                    this.targetX = sX;
                    this.targetY = sY;
                    this.path = [];
                    this.isMoving = true;
                }
            }

            // 撤退：选定一个稳定的远离方向目标，避免每帧随相对位置漂移
            retreatFrom(target) {
                // 锚点失效条件：目标大幅移动、或锚点尚未设定
                const anchorStale = isNaN(this.strafeAnchorX) ||
                    Math.abs(target.x - this.strafeAnchorX) > 60 ||
                    Math.abs(target.y - this.strafeAnchorY) > 60;

                if (anchorStale || !this.isMoving) {
                    const dx = this.x - target.x;
                    const dy = this.y - target.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const bf = document.getElementById('battlefield');
                    const maxX = bf.offsetWidth - this.getSize();
                    const maxY = bf.offsetHeight - this.getSize();
                    // 撤退到尽可能远的位置
                    this.targetX = Math.max(0, Math.min(maxX, this.x + (dx / dist) * 220));
                    this.targetY = Math.max(0, Math.min(maxY, this.y + (dy / dist) * 220));
                    this.strafeAnchorX = target.x;
                    this.strafeAnchorY = target.y;
                    this.setDesiredAngle(Math.atan2(-dy, -dx) * 180 / Math.PI + 90);
                    this.clampTarget();
                }
            }

            randomMove(deltaTime) {
                const now = Date.now();
                if (this.lastMoveTime > 0 && now - this.lastMoveTime < this.moveCooldown) return;

                const battlefield = document.getElementById('battlefield');
                const maxX = battlefield.offsetWidth - this.getSize();
                const maxY = battlefield.offsetHeight - this.getSize();

                const angle = Math.random() * Math.PI * 2;
                const moveDistance = 55 + Math.random() * 65;
                
                this.targetX = Math.max(0, Math.min(maxX, this.x + Math.cos(angle) * moveDistance));
                this.targetY = Math.max(0, Math.min(maxY, this.y + Math.sin(angle) * moveDistance));
                this.setDesiredAngle(angle * 180 / Math.PI + 90);
                this.isMoving = true;
                this.lastMoveTime = now;
            }

            updatePosition(deltaTime, allUnits) {
                // 1. 视觉朝向
                // 履带车辆移动时必须朝移动方向（否则无法行驶），
                // 停下时才转向敌人开火
                if (this.isTracked && this.isMoving && this.stuckTime < 0.2) {
                    // 正常移动: 朝移动方向 (卡住时切朝敌人, 避免背对)
                    const moveTarget = this.getMoveTarget();
                    this.setDesiredAngle(this.angleToPoint(moveTarget.x, moveTarget.y));
                } else if (this.isTracked && this.currentTarget && !this.currentTarget.isDead()) {
                    // 履带车停下时朝敌人 (retreat/flee 朝远离)
                    if (this.state === 'retreat' || this.state === 'flee') {
                        const dx = this.x - this.currentTarget.x;
                        const dy = this.y - this.currentTarget.y;
                        this.setDesiredAngle(Math.atan2(-dy, -dx) * 180 / Math.PI + 90);
                    } else {
                        this.setDesiredAngle(this.getAngleTo(this.currentTarget));
                    }
                } else if (this.currentTarget && !this.currentTarget.isDead() &&
                    (this.state === 'hold' || this.state === 'skirmish' ||
                     this.state === 'flank' ||
                     this.state === 'firing' || this.state === 'deploying' ||
                     this.state === 'standby')) {
                    this.setDesiredAngle(this.getAngleTo(this.currentTarget));
                } else if (this.isMoving) {
                    const moveTarget = this.getMoveTarget();
                    this.setDesiredAngle(this.angleToPoint(moveTarget.x, moveTarget.y));
                }
                this.updateRotation(deltaTime);

                // 2. 处理分离（防止重叠）
                this.handleSeparation(allUnits);

                // 3. 处理主动移动（方向无关平移）
                if (this.isMoving) {
                    this.moveTowardTarget(deltaTime, allUnits);
                }

                // 4. 更新 DOM
                if (this.element) {
                    this.updateVisual();
                } else {
                    console.warn('Unit element missing for updatePosition');
                }
            }

            moveTowardTarget(deltaTime, allUnits) {
                const moveTarget = this.getMoveTarget();
                const dx = moveTarget.x - this.x;
                const dy = moveTarget.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 3) {
                    if (moveTarget.isWaypoint) {
                        this.path.shift();
                    } else {
                        this.x = this.targetX;
                        this.y = this.targetY;
                        this.isMoving = false;
                    }
                    if (this.element) this.element.classList.remove('moving');
                    this.stuckTime = 0;
                    return;
                }

                // 履带车辆（坦克/火炮）：只能沿车体朝向前进或后退，
                // 侧向偏移过大时先原地旋转对准再行驶
                if (this.isTracked) {
                    const moveAngle = this.angleToPoint(moveTarget.x, moveTarget.y);
                    const angleDelta = this.shortestAngleDelta(this.angle, moveAngle);

                    if (Math.abs(angleDelta) > this.alignTolerance) {
                        // 未对准：原地旋转，不产生位移（updateRotation 负责转向）
                        this.stuckTime = 0;
                        return;
                    }

                    // 已对准：沿车体前方轴线行驶
                    const forward = this.forwardVector();
                    const dirX = dx / distance;
                    const dirY = dy / distance;
                    const dot = forward.x * dirX + forward.y * dirY;
                    const reverseFactor = dot >= 0 ? 1 : 0.5;
                    const moveSpeed = this.maxSpeed * reverseFactor * deltaTime;
                    const stepX = forward.x * moveSpeed * Math.sign(dot || 1);
                    const stepY = forward.y * moveSpeed * Math.sign(dot || 1);
                    const nextX = this.x + stepX;
                    const nextY = this.y + stepY;

                    if (!this.checkCollision(nextX, nextY, allUnits)) {
                        this.x = nextX;
                        this.y = nextY;
                        this.stuckTime = 0;
                    } else {
                        // 前方受阻：履带车不可侧滑, 尝试逃脱 + 卡住则停下重新决策
                        this.stuckTime += deltaTime;
                        if (this.stuckTime > 0.3) {
                            const inObstacle = battlefieldManager &&
                                battlefieldManager.collidesWithObstacle(this.x, this.y, this.getSize(), this.getSize(), 0);
                            // 仅在掩体内才 8 方向脱困 (友军挡时不朝任意方向跳/后退)
                            if (inObstacle) {
                                let escaped = false;
                                for (let a = 0; a < Math.PI * 2 && !escaped; a += Math.PI / 4) {
                                    const esc = 20;
                                    const nx = this.x + Math.cos(a) * esc * deltaTime * 20;
                                    const ny = this.y + Math.sin(a) * esc * deltaTime * 20;
                                    if (!this.checkCollision(nx, ny, allUnits)) {
                                        this.x = nx;
                                        this.y = ny;
                                        escaped = true;
                                    }
                                }
                            }
                            // 友军挡: 不逃脱, 等友军移开
                            if (this.stuckTime > 0.6) {
                                // 卡死: 停下让 update 重新决策
                                this.updatePathToTarget(true);
                                this.isMoving = false;
                                this.stuckTime = 0;
                                if (this.element) this.element.classList.remove('moving');
                            }
                        }
                    }
                    return;
                }

                // 自由平移（步兵等）：直接朝目标移动 + 碰撞滑行
                const moveSpeed = this.maxSpeed * deltaTime;
                const nextX = this.x + (dx / distance) * moveSpeed;
                const nextY = this.y + (dy / distance) * moveSpeed;

                if (!this.checkCollision(nextX, nextY, allUnits)) {
                    this.x = nextX;
                    this.y = nextY;
                    this.stuckTime = 0;
                } else if (!this.checkCollision(nextX, this.y, allUnits)) {
                    this.x = nextX;
                    this.stuckTime = 0;
                } else if (!this.checkCollision(this.x, nextY, allUnits)) {
                    this.y = nextY;
                    this.stuckTime = 0;
                } else {
                    this.stuckTime += deltaTime;
                    if (this.stuckTime > 0.5) {
                        // 在掩体内: 8 方向朝外脱困; 否则随机逃脱
                        const inObstacle = battlefieldManager &&
                            battlefieldManager.collidesWithObstacle(this.x, this.y, this.getSize(), this.getSize(), 0);
                        let escaped = false;
                        for (let a = 0; a < Math.PI * 2 && !escaped; a += Math.PI / 4) {
                            const esc = inObstacle ? 20 : (14 + Math.random() * 16);
                            const nx = this.x + Math.cos(a) * esc * deltaTime * 20;
                            const ny = this.y + Math.sin(a) * esc * deltaTime * 20;
                            if (!this.checkCollision(nx, ny, allUnits)) {
                                this.x = nx;
                                this.y = ny;
                                escaped = true;
                            }
                        }
                        if (this.stuckTime > 1.0) {
                            this.updatePathToTarget(true);
                            this.stuckTime = 0;
                        }
                    }
                }
            }

            handleSeparation(allUnits) {
                const mySize = this.getSize();
                const myCenterX = this.x + mySize / 2;
                const myCenterY = this.y + mySize / 2;

                let pushX = 0, pushY = 0;
                for (const other of allUnits) {
                    if (other === this || other.isDead()) continue;

                    const otherSize = other.getSize();
                    const otherCenterX = other.x + otherSize / 2;
                    const otherCenterY = other.y + otherSize / 2;

                    const dx = myCenterX - otherCenterX;
                    const dy = myCenterY - otherCenterY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = (mySize + otherSize) / 2;

                    if (dist < minDist && dist > 0) {
                        // 累加排斥力 (避免堵塞堆叠)
                        const pushForce = (minDist - dist) * 0.4;
                        pushX += (dx / dist) * pushForce;
                        pushY += (dy / dist) * pushForce;
                    }
                }

                // 限制总推斥位移 (轨迹连续, 不闪现)
                const dt = (typeof battlefieldManager !== 'undefined' && battlefieldManager.deltaTime) || 0.016;
                const pushMag = Math.sqrt(pushX * pushX + pushY * pushY);
                const maxPush = Math.max(0.4, this.maxSpeed * dt);
                if (pushMag > maxPush) {
                    pushX = pushX / pushMag * maxPush;
                    pushY = pushY / pushMag * maxPush;
                }
                // 履带车: 推斥只沿车体朝向 (前后), 不侧移 (符合履带行驶逻辑)
                if (this.isTracked) {
                    const forward = this.forwardVector();
                    const proj = pushX * forward.x + pushY * forward.y;
                    pushX = forward.x * proj;
                    pushY = forward.y * proj;
                }
                const finalMag = Math.sqrt(pushX * pushX + pushY * pushY);
                if (finalMag > 0.01) {
                    const nx = this.x + pushX;
                    const ny = this.y + pushY;
                    // 不推入掩体 (避免被队友挤进障碍物卡死)
                    if (!battlefieldManager || !battlefieldManager.collidesWithObstacle(nx, ny, mySize, mySize, 2)) {
                        this.x = nx;
                        this.y = ny;
                    }
                    // 边界检查
                    const battlefield = document.getElementById('battlefield');
                    this.x = Math.max(0, Math.min(battlefield.offsetWidth - mySize, this.x));
                    this.y = Math.max(0, Math.min(battlefield.offsetHeight - mySize, this.y));
                }
            }

            checkCollision(nextX, nextY, allUnits) {
                const mySize = this.getSize();
                const myCenterX = nextX + mySize / 2;
                const myCenterY = nextY + mySize / 2;

                if (battlefieldManager && battlefieldManager.collidesWithObstacle(nextX, nextY, mySize, mySize)) {
                    return true;
                }

                // 方案A: 友军不硬挡(可穿过移动, 靠handleSeparation推斥散开), 只检查敌军碰撞
                for (const other of allUnits) {
                    if (other === this || other.isDead()) continue;
                    if (other.team === this.team) continue;  // 友军不挡

                    const otherSize = other.getSize();
                    const otherCenterX = other.x + otherSize / 2;
                    const otherCenterY = other.y + otherSize / 2;

                    const dist = Math.sqrt(Math.pow(myCenterX - otherCenterX, 2) + Math.pow(myCenterY - otherCenterY, 2));
                    const minDist = (mySize + otherSize) / 2 * 0.9; // 允许 10% 重叠

                    if (dist < minDist) return true;
                }
                return false;
            }

            takeDamage(damage) {
                // v3.0 APC 掩护: 步兵在 APC 40px 内受击减伤 30%
                if (this.armorType === 'infantry' && battlefieldManager) {
                    for (const u of battlefieldManager.units) {
                        if (u === this || u.isDead() || u.team !== this.team) continue;
                        if (u.type === 'apc' && this.getDistance(u) < (u.coverRadius || 40)) {
                            damage = Math.round(damage * (1 - (u.coverReduction || 0.3)));
                            break;
                        }
                    }
                }
                this.health = Math.max(0, this.health - damage);
                this.updateVisual();
                return this.health <= 0;
            }

            isDead() {
                return this.health <= 0;
            }
        }

        // 火炮类（牵引火炮：需架设才能开火，有最小射程盲区）
        class Artillery extends GameObject {
            constructor(x, y, team, health) {
                super(x, y, 'artillery', team, health);
                this.attackRange = 420;
                this.minRange = 120;
                this.attackPower = 45;
                this.maxSpeed = 18;
                this.maxTurnSpeed = 70;
                this.attackCooldown = 3000;
                this.moveCooldown = 600;
                this.isTracked = true;
                this.deployed = false;
                this.deploying = false;
                this.deployStartTime = 0;
                this.deployDuration = 2000;
                // v3.0 高爆: 对步兵140%/车辆100%/坦克75%
                this.armorType = 'vehicle';
                this.damageTable = { infantry: 1.4, vehicle: 1.0, tank: 0.75 };
            }

            getSize() { return 20; }

            getDisplayMarkup() {
                const body = '<div class="artillery-wheel left"></div><div class="artillery-wheel right"></div><div class="artillery-chassis"></div><div class="artillery-trail"></div><div class="artillery-barrel"></div><div class="artillery-shield"></div><div class="artillery-stabilizer left"></div><div class="artillery-stabilizer right"></div><div class="deploy-dot"></div>';
                return `<div class="unit-body">${body}</div><div class="hp-bar"><div class="hp-fill" style="width:${this.getHealthPercent()}%"></div></div>`;
            }

            updateVisual() {
                super.updateVisual();
                if (!this.element) return;
                this.element.classList.toggle('deployed', this.deployed);
                this.element.classList.toggle('deploying', this.deploying && !this.deployed);
            }

            update(deltaTime, allUnits) {
                if (this.isDead()) return;
                const nearestEnemy = this.acquireTarget(allUnits);

                if (nearestEnemy) {
                    const distance = this.getDistance(nearestEnemy);
                    const minR = this.minRange;
                    const maxR = this.attackRange;

                    if (this.deploying) {
                        const elapsed = Date.now() - this.deployStartTime;
                        if (elapsed >= this.deployDuration) {
                            this.deployed = true;
                            this.deploying = false;
                            this.state = 'firing';
                        } else if (this.isMoving || distance < minR * 1.1) {
                            // 部署中被打断：仅当真正开始移动或敌人极其靠近才取消
                            this.deploying = false;
                            this.state = 'fallback';
                            if (distance < minR * 1.1) this.moveAwayFrom(nearestEnemy, 200);
                        }
                    } else if (this.deployed) {
                        // 已部署：使用更宽松的滞回带，避免距离小幅波动导致反复收起
                        if (distance < minR * 1.05) {
                            this.deployed = false;
                            this.state = 'fallback';
                            this.moveAwayFrom(nearestEnemy, 220);
                        } else if (distance <= maxR && distance >= minR) {
                            if (this.hasLineOfSight(nearestEnemy)) {
                                this.state = 'firing';
                                this.turnToward(nearestEnemy);
                                if (this.isFacing(nearestEnemy)) this.tryAttack(nearestEnemy);
                            } else {
                                // 视线被障碍物遮挡：收起部署，机动到有清晰射线的位置
                                this.deployed = false;
                                this.state = 'maneuver';
                                this.moveTowards(nearestEnemy, 0.4);
                            }
                        } else if (distance > maxR) {
                            this.deployed = false;
                            this.state = 'maneuver';
                            this.moveTowards(nearestEnemy);
                        }
                    } else {
                        // 未部署：使用与已部署不同的阈值，形成滞回
                        // 部署要求距离更远离 minRange（留足安全余量），
                        // 这样已部署时的小幅靠近不会立刻触发收起→重新部署循环
                        if (distance < minR * 1.7) {
                            this.state = 'fallback';
                            this.moveAwayFrom(nearestEnemy, 220);
                        } else if (distance >= minR * 1.9 && distance <= maxR * 0.85) {
                            this.isMoving = false;
                            this.deploying = true;
                            this.deployStartTime = Date.now();
                            this.state = 'deploying';
                            this.turnToward(nearestEnemy);
                        } else if (distance > maxR * 0.85) {
                            this.state = 'maneuver';
                            this.moveTowards(nearestEnemy);
                        } else {
                            // minR*1.7 ≤ distance < minR*1.9 滞回盲区：保持原地待命
                            this.state = 'standby';
                            this.isMoving = false;
                            this.turnToward(nearestEnemy);
                        }
                    }
                } else {
                    this.state = 'patrol';
                    this.deployed = false;
                    this.deploying = false;
                    this.randomMove(deltaTime);
                }

                this.updatePosition(deltaTime, allUnits);
            }

            tryAttack(target) {
                if (!this.deployed) return;
                const distance = this.getDistance(target);
                if (distance < this.minRange) return;
                super.tryAttack(target);
            }

            moveTowards(target, stopFactor) {
                this.deployed = false;
                this.deploying = false;
                super.moveTowards(target, stopFactor);
            }

            moveAwayFrom(target, dist) {
                this.deployed = false;
                this.deploying = false;
                super.moveAwayFrom(target, dist);
            }

            strafeAround(target) {
                this.deployed = false;
                this.deploying = false;
                super.strafeAround(target);
            }

            randomMove(deltaTime) {
                this.deployed = false;
                this.deploying = false;
                super.randomMove(deltaTime);
            }
        }

        // 火箭炮类（多管火箭炮：6连发齐射+随机散布+面溅射，无需架设）
        class RocketLauncher extends Artillery {
            constructor(x, y, team, health) {
                super(x, y, team, health);
                this.type = 'rocket';
                this.attackRange = 380;
                this.minRange = 100;
                this.attackPower = 25;
                this.maxSpeed = 20;
                this.maxTurnSpeed = 70;
                this.attackCooldown = 4000;
                this.moveCooldown = 600;
                this.isTracked = true;
                this.deployDuration = 0;
                this.volleySize = 6;
                this.volleyInterval = 150;
                this.volleyCount = 0;
                this.volleyTimer = 0;
            }

            getDisplayMarkup() {
                const body = '<div class="rocket-rack"></div><div class="rocket-tube t1"></div><div class="rocket-tube t2"></div><div class="rocket-tube t3"></div><div class="rocket-tube t4"></div><div class="rocket-chassis"></div><div class="rocket-wheel left"></div><div class="rocket-wheel right"></div>';
                return `<div class="unit-body">${body}</div><div class="hp-bar"><div class="hp-fill" style="width:${this.getHealthPercent()}%"></div></div>`;
            }

            update(deltaTime, allUnits) {
                if (this.isDead()) return;

                // 齐射进行中：停车不动，逐发发射，齐射期间不受状态机干扰
                if (this.volleyCount > 0) {
                    this.volleyTimer += deltaTime * 1000;
                    if (this.volleyTimer >= this.volleyInterval) {
                        this.volleyTimer = 0;
                        this.fireOneRocket(this.currentTarget);
                        this.volleyCount--;
                        if (this.volleyCount === 0) {
                            this.lastAttackTime = Date.now();
                        }
                    }
                    this.state = 'firing';
                    this.isMoving = false;
                    if (this.currentTarget && !this.currentTarget.isDead()) {
                        this.turnToward(this.currentTarget);
                    }
                    this.updatePosition(deltaTime, allUnits);
                    return;
                }

                const nearestEnemy = this.acquireTarget(allUnits);

                if (nearestEnemy) {
                    const distance = this.getDistance(nearestEnemy);

                    if (distance < this.minRange) {
                        this.state = 'fallback';
                        this.moveAwayFrom(nearestEnemy, 220);
                    } else if (distance > this.attackRange) {
                        this.state = 'maneuver';
                        this.moveTowards(nearestEnemy);
                    } else if (this.hasLineOfSight(nearestEnemy)) {
                        this.state = 'firing';
                        this.isMoving = false;
                        this.turnToward(nearestEnemy);
                        if (this.isFacing(nearestEnemy)) {
                            this.startVolley(nearestEnemy);
                        }
                    } else {
                        this.state = 'flank';
                        this.flankForShot(nearestEnemy);
                    }
                } else {
                    this.state = 'patrol';
                    this.randomMove(deltaTime);
                }

                this.updatePosition(deltaTime, allUnits);
            }

            startVolley(target) {
                if (this.volleyCount > 0) return;
                const now = Date.now();
                // 士气 + 指挥车光环影响攻速
                const moraleFactor = this.getMoraleAttackFactor();
                if (moraleFactor === 0) return;
                const buffed = this.commandBuffUntil && this.commandBuffUntil > now;
                const cooldown = this.attackCooldown * moraleFactor * (buffed ? 0.85 : 1);
                if (now - this.lastAttackTime < cooldown) return;
                this.volleyCount = this.volleySize;
                this.volleyTimer = this.volleyInterval;
                this.currentTarget = target;
            }

            fireOneRocket(target) {
                if (!target || target.isDead()) {
                    this.volleyCount = 0;
                    return;
                }
                let damage = this.getAttackDamage(target);
                // 指挥车光环: 攻击 +10%
                if (this.commandBuffUntil && this.commandBuffUntil > Date.now()) damage = Math.round(damage * 1.1);
                const scatterX = (Math.random() - 0.5) * 40;
                const scatterY = (Math.random() - 0.5) * 40;
                const targetX = target.x + target.getSize() / 2 + scatterX;
                const targetY = target.y + target.getSize() / 2 + scatterY;
                battlefieldManager.spawnScatterProjectile(this, target, targetX, targetY, damage);
            }

            tryAttack(target) {
                this.startVolley(target);
            }
        }

            }

            findSupportTarget(allUnits) {
                let best = null, bestDist = Infinity;
                for (const u of allUnits) {
                    if (u === this || u.isDead() || u.team !== this.team) continue;
                    // 只跟战斗单位 (坦克/火炮/火箭炮), 排除其他支援单位避免互相跟随静止
                    if (u.type === 'tank' || u.type === 'artillery' || u.type === 'rocket') {
                        const d = this.getDistance(u);
                        if (d < bestDist) { bestDist = d; best = u; }
                    }
                }
                return best;
            }

            applySupport(deltaTime, allUnits) { /* 子类实现 */ }

            tryAttack(target) { /* 支援单位无攻击 */ }

            update(deltaTime, allUnits) {

                let attacked = false;

                this.updatePosition(deltaTime, allUnits);

            // 找最近友军步兵集群 (步兵/反坦/工程/医疗)
            findInfantryCluster(allUnits) {
                let best = null, bestDist = Infinity;
                for (const u of allUnits) {
                    if (u === this || u.isDead() || u.team !== this.team) continue;
                    if (u.type === 'soldier' || u.type === 'antitank' ||
                        u.type === 'engineer' || u.type === 'medic') {
                        const d = this.getDistance(u);
                        if (d < bestDist) { bestDist = d; best = u; }

            }

        // 迫击炮: 高爆溅射, 无需架设, 最小射程60
        class Mortar extends Tank {
            constructor(x, y, team, health) {
                super(x, y, team, health);
                this.type = 'mortar';
                this.attackRange = 300;
                this.minRange = 60;
                this.attackPower = 38;
                this.maxSpeed = 28;
                this.attackCooldown = 2500;
                // 高爆: 对步兵150%/车辆100%/坦克70%
                this.armorType = 'vehicle';
                this.damageTable = { infantry: 1.5, vehicle: 1.0, tank: 0.7 };
            }

            tryAttack(target) {
                const moraleFactor = this.getMoraleAttackFactor();
                if (moraleFactor === 0) return;
                const now = Date.now();
                const buffed = this.commandBuffUntil && this.commandBuffUntil > now;
                const cooldown = this.attackCooldown * moraleFactor * (buffed ? 0.85 : 1);
                if (now - this.lastAttackTime < cooldown) return;

                const distance = this.getDistance(target);
                // 迫击炮: 最小射程 60, 最大射程 300
                if (distance <= this.attackRange && distance >= this.minRange &&
                    target.team !== this.team && !target.isDead()) {
                    this.turnToward(target);
                    if (!this.canMoveFire && !this.isFacing(target)) return;
                    if (!this.hasLineOfSight(target)) return;

                    this.lastAttackTime = now;
                    let damage = this.getAttackDamage(target);
                    if (buffed) damage = Math.round(damage * 1.1);
                    // 迫击炮: 散布 + 60px 溅射
                    const scatterX = (Math.random() - 0.5) * 30;
                    const scatterY = (Math.random() - 0.5) * 30;
                    const targetX = target.x + target.getSize() / 2 + scatterX;
                    const targetY = target.y + target.getSize() / 2 + scatterY;
                    battlefieldManager.spawnScatterProjectile(this, target, targetX, targetY, damage);
                    const proj = battlefieldManager.projectiles[battlefieldManager.projectiles.length - 1];
                    if (proj) proj.splashRadius = 60;
                }
            }
        }

        // ── 古代兵种 (陆战) ──
        // 近战步兵: 短程高伤, 阵营色 + 银盔 + 长矛
        class MeleeInfantry extends Soldier {

        // 弓箭手: 远程低伤, 阵营色 + 弓
        class Archer extends Soldier {
            constructor(x, y, team, health) {
                super(x, y, team, health);

            }

        // 骑兵: 快速冲击近战, 马身 + 骑士
        class Cavalry extends Soldier {
            constructor(x, y, team, health) {
                super(x, y, team, health);
                this.type = 'cavalry';
                this.attackRange = 40;
                this.attackPower = 22;
                this.maxSpeed = 70;  // 最快
                this.origMaxSpeed = 70;  // 保存原始速度 (冲锋加速用)
                this.attackCooldown = 1000;
                this.armorType = 'cavalry';  // 骑兵护甲 (被长矛克)
                this.damageTable = { infantry: 1.3, cavalry: 1.0, vehicle: 1.0, tank: 0.8 };  // 骑兵克步兵/弓箭
                this._flankDir = Math.random() > 0.5 ? 1 : -1;  // 侧翼方向 (固定一侧)
            }

            // 骑兵重写: 侧翼包抄(chase 朝敌人侧方) + 冲锋加速(接近<150px)
            update(deltaTime, allUnits) {
                if (this.isDead()) return;
                this.updateMorale(deltaTime, allUnits);
                const nearestEnemy = this.acquireTarget(allUnits);

                if (this.morale < 15 && nearestEnemy) {
                    this.maxSpeed = this.origMaxSpeed;
                    this.state = 'flee';
                    this.moveAwayFrom(nearestEnemy, 220);
                    this.updatePosition(deltaTime, allUnits);
                    return;
                }

                if (nearestEnemy) {
                    const distance = this.getDistance(nearestEnemy);
                    const range = this.attackRange;

                    // 方案3: 冲锋加速 (接近 <150px 时 ×1.5)
                    this.maxSpeed = (distance < 150) ? this.origMaxSpeed * 1.5 : this.origMaxSpeed;

                    if (distance > range * 0.96) {
                        // 方案1: 侧翼包抄 (朝敌人侧方移动, 不直线冲, 绕到侧翼)
                        this.state = 'chase';
                        this.flankApproach(nearestEnemy);
                        this.tryAttack(nearestEnemy);
                    } else if (distance < range * 0.4) {
                        // 太近: 略退 (hit and run 雏形)
                        this.state = 'backoff';
                        this.moveAwayFrom(nearestEnemy, 60);
                    } else if (!this.hasLineOfSight(nearestEnemy)) {
                        this.state = 'chase';
                        this.moveTowards(nearestEnemy, 0.0);
                        this.tryAttack(nearestEnemy);
                    } else {
                        this.state = 'hold';
                        this.holdAndAttack(nearestEnemy, distance, range);
                    }
                } else {
                    this.maxSpeed = this.origMaxSpeed;
                    this.state = 'patrol';
                    this.randomMove(deltaTime);
                }
                this.updatePosition(deltaTime, allUnits);
            }

            // 侧翼包抄: target 朝敌人方向 + 垂直侧翼偏移 (绕到侧方再攻击)
            flankApproach(target) {
                const myCX = this.x + this.getSize() / 2;
                const myCY = this.y + this.getSize() / 2;
                const tCX = target.x + target.getSize() / 2;
                const tCY = target.y + target.getSize() / 2;
                const dx = tCX - myCX;
                const dy = tCY - myCY;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                // 垂直方向 (侧翼)
                const perpX = -dy / dist;
                const perpY = dx / dist;
                // 侧翼偏移 (固定一侧, 接近敌人 50% + 侧方 80px)
                const lateralOffset = 80;
                const approachRatio = 0.5;
                let tx = myCX + (dx / dist) * dist * approachRatio + perpX * this._flankDir * lateralOffset;
                let ty = myCY + (dy / dist) * dist * approachRatio + perpY * this._flankDir * lateralOffset;
                // 边界限制
                const bf = document.getElementById('battlefield');
                const sz = this.getSize();
                tx = Math.max(0, Math.min(bf.offsetWidth - sz, tx));
                ty = Math.max(0, Math.min(bf.offsetHeight - sz, ty));
                this.targetX = tx;
                this.targetY = ty;
                this.setDesiredAngle(Math.atan2(dy, dx) * 180 / Math.PI + 90);
                if (Math.abs(this.targetX - this.pathTargetX) > 6 ||
                    Math.abs(this.targetY - this.pathTargetY) > 6 || !this.isMoving) {
                    this.clampTarget();
                }
            }
        }

        // 投石车: 重型远程溅射, 机械投臂
