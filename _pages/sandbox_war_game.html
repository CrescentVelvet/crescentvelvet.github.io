<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙盘战争 - 像素战场</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-bg: #2c3e50;
            --pixel-primary: #3498db;
            --pixel-secondary: #e74c3c;
            --pixel-accent: #f1c40f;
            --pixel-text: #ecf0f1;
            --pixel-border: 4px;
        }

        * {
            font-family: 'ZCOOL QingKe HuangYou', 'DotGothic16', monospace;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'ZCOOL QingKe HuangYou', 'Press Start 2P', 'DotGothic16', monospace;
            font-size: 25px;
            background-color: #2c3e50;
            background-image:
                linear-gradient(30deg, #34495e 12%, transparent 12.5%, transparent 87%, #34495e 87.5%, #34495e),
                linear-gradient(150deg, #34495e 12%, transparent 12.5%, transparent 87%, #34495e 87.5%, #34495e),
                linear-gradient(30deg, #34495e 12%, transparent 12.5%, transparent 87%, #34495e 87.5%, #34495e),
                linear-gradient(150deg, #34495e 12%, transparent 12.5%, transparent 87%, #34495e 87.5%, #34495e),
                linear-gradient(60deg, #2c3e5077 25%, transparent 25.5%, transparent 75%, #2c3e5077 75%, #2c3e5077),
                linear-gradient(60deg, #2c3e5077 25%, transparent 25.5%, transparent 75%, #2c3e5077 75%, #2c3e5077);
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;
            min-height: 100vh;
            color: var(--pixel-text);
            image-rendering: pixelated;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 4px 4px 0px #000;
            font-family: 'ZCOOL QingKe HuangYou', 'Press Start 2P', 'DotGothic16', monospace;
            font-size: 3.2em;
            color: var(--pixel-accent);
            line-height: 1.5;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
        }

        .game-ui {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .controls-panel {
            flex: 1;
            min-width: 300px;
            background: #000;
            border: 4px solid var(--pixel-text);
            padding: 20px;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            font-family: inherit;
        }

        .control-row label {
            font-family: 'ZCOOL QingKe HuangYou', 'DotGothic16', monospace;
            font-size: 20px;
            color: var(--pixel-text);
        }

        .pixel-btn {
            font-family: 'ZCOOL QingKe HuangYou', 'Press Start 2P', 'DotGothic16', monospace;
            padding: 10px 15px;
            border: 4px solid;
            background: transparent;
            color: var(--pixel-text);
            cursor: pointer;
            text-transform: uppercase;
            font-size: 20px;
            line-height: 1.2;
            box-sizing: border-box;
            position: relative;
            transition: transform 0.1s;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .btn-ally { border-color: var(--pixel-primary); color: var(--pixel-primary); }
        .btn-enemy { border-color: var(--pixel-secondary); color: var(--pixel-secondary); }
        .btn-action { border-color: var(--pixel-accent); color: var(--pixel-accent); }
        .btn-obstacle { border-color: #9b8f6a; color: #d8c98b; }
        .btn-danger { border-color: #95a5a6; color: #95a5a6; }

        .btn-unit { border-color: #7f8c8d; color: #95a5a6; }
        .btn-unit.active {
            border-color: var(--pixel-accent);
            color: var(--pixel-accent);
            background: rgba(241, 196, 15, 0.12);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5), 0 0 6px rgba(241, 196, 15, 0.35);
        }

        .pixel-input, .pixel-select {
            font-family: 'ZCOOL QingKe HuangYou', 'Press Start 2P', 'DotGothic16', monospace;
            background: #000;
            border: 2px solid var(--pixel-text);
            color: var(--pixel-text);
            padding: 8px;
            font-size: 20px;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
        }

        .battlefield {
            width: 100%;
            height: 750px;
            background: #26362c;
            border: 4px solid var(--pixel-text);
            position: relative;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 18% 22%, rgba(160, 135, 82, 0.45) 0 18px, transparent 19px),
                radial-gradient(circle at 74% 68%, rgba(60, 90, 62, 0.7) 0 30px, transparent 31px),
                linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(135deg, rgba(29, 46, 36, 0.9), rgba(50, 58, 38, 0.9));
            background-size: 220px 180px, 260px 220px, 40px 40px, 40px 40px, auto;
        }

        .terrain-canvas,
        .decor-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            image-rendering: pixelated;
        }
        .terrain-canvas { z-index: 0; }
        .decor-canvas   { z-index: 1; }

        #debugPathLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            display: none;
        }

        #synergyLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 6;
            display: none;
        }

        /* 掩体类型变体 (DOM 层, 可碰撞) */
        .obstacle.obstacle-house  { background: #8a7a5a; border-color: #3a3322; }
        .obstacle.obstacle-ruin   { background: #7a7570; border-color: #2a2520; }
        .obstacle.obstacle-wall       { background: #5a5550; border-color: #1a1510; }

        .unit {
            position: absolute;
            width: var(--unit-size);
            height: var(--unit-size);
            cursor: pointer;
            image-rendering: pixelated;
            z-index: 10;
        }

        .unit-body {
            width: var(--body-size, var(--unit-size));
            height: var(--body-size, var(--unit-size));
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(var(--angle, 0deg)) scale(var(--scale, 1));
            transform-origin: center;
        }

        .unit.tank {
            --unit-size: 22px;
            --body-size: 36px;
            --scale: 0.611;
        }

        .tank-track,
        .tank-body,
        .tank-turret,
        .tank-barrel,
        .soldier-body,
        .soldier-head {
            position: absolute;
        }

        .tank-track {
            width: 8px;
            height: 27px;
            top: 5px;
            background: #15191b;
            box-shadow: inset 0 0 0 2px #30383b;
        }

        .tank-track.left { left: 3px; }
        .tank-track.right { right: 3px; }

        .tank-body {
            width: 22px;
            height: 24px;
            left: 7px;
            top: 6px;
            background: var(--color-dark);
            box-shadow: inset 0 0 0 3px var(--color), 0 3px 0 rgba(0,0,0,0.45);
        }

        .tank-turret {
            width: 15px;
            height: 15px;
            left: 10px;
            top: 10px;
            background: var(--color-light);
            box-shadow: inset 0 0 0 3px var(--color);
        }

        .tank-barrel {
            width: 5px;
            height: 19px;
            left: 15px;
            top: -5px;
            background: var(--color-light);
            box-shadow: inset 0 0 0 2px var(--color);
        }

        .unit.soldier {
            --unit-size: 14px;
            --body-size: 22px;
            --scale: 0.636;
        }

        .soldier-body {
            width: 12px;
            height: 13px;
            left: 5px;
            top: 6px;
            background: var(--color);
            box-shadow: inset 0 0 0 2px var(--color-dark), 0 2px 0 rgba(0,0,0,0.45);
        }

        .soldier-head {
            width: 9px;
            height: 8px;
            left: 6px;
            top: 1px;
            background: var(--color-light);
            box-shadow: inset 0 0 0 2px var(--color);
        }

        .unit.ally { --color: #3498db; --color-dark: #2980b9; --color-light: #5dade2; }
        .unit.enemy { --color: #e74c3c; --color-dark: #c0392b; --color-light: #ec7063; }

        /* ---- 火炮 (32px) ---- */
        .unit.artillery {
            --unit-size: 20px;
            --body-size: 32px;
            --scale: 0.625;
        }

        .artillery-wheel {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #1a1a1a;
            box-shadow: inset 0 0 0 1px #444;
            top: 21px;
        }
        .artillery-wheel.left  { left: 2px; }
        .artillery-wheel.right { right: 2px; }

        .artillery-chassis {
            position: absolute;
            width: 20px;
            height: 8px;
            left: 6px;
            top: 20px;
            background: var(--color-dark);
            box-shadow: inset 0 0 0 2px var(--color);
        }

        .artillery-trail {
            position: absolute;
            width: 4px;
            height: 9px;
            left: 14px;
            top: 25px;
            background: var(--color-dark);
            box-shadow: inset 0 0 0 1px var(--color);
        }

        .artillery-barrel {
            position: absolute;
            width: 3px;
            height: 22px;
            left: 14px;
            top: -2px;
            background: var(--color-light);
            box-shadow: inset 0 0 0 1px var(--color);
        }

        .artillery-shield {
            position: absolute;
            width: 14px;
            height: 4px;
            left: 9px;
            top: 17px;
            background: var(--color);
            box-shadow: inset 0 0 0 1px var(--color-dark);
        }

        .unit.artillery .artillery-stabilizer { display: none; }
        .unit.artillery.deployed .artillery-stabilizer { display: block; }
        .artillery-stabilizer {
            position: absolute;
            width: 5px;
            height: 12px;
            background: var(--color-dark);
            box-shadow: inset 0 0 0 1px var(--color);
            top: 18px;
        }
        .artillery-stabilizer.left  { left: -2px;  transform: rotate(-20deg); }
        .artillery-stabilizer.right { right: -2px; transform: rotate(20deg); }

        .unit.artillery .deploy-dot {
            display: none;
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #f1c40f;
            left: 50%;
            margin-left: -2px;
            bottom: -7px;
            z-index: 2;
        }
        .unit.artillery.deployed .deploy-dot { display: block; }
        .unit.artillery.deploying .deploy-dot {
            display: block;
            background: #e67e22;
            animation: deployPulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes deployPulse {
            from { opacity: 0.3; }
            to   { opacity: 1; }
        }

        /* ---- 火箭炮 (32px) ---- */
        .unit.rocket {
            --unit-size: 20px;
            --body-size: 32px;
            --scale: 0.625;
        }

        .rocket-chassis {
            position: absolute;
            width: 26px;
            height: 9px;
            left: 3px;
            top: 18px;
            background: var(--color-dark);
            box-shadow: inset 0 0 0 2px var(--color), 0 2px 0 rgba(0,0,0,0.45);
        }

        .rocket-wheel {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #1a1a1a;
            box-shadow: inset 0 0 0 1px #444;
            top: 24px;
        }
        .rocket-wheel.left  { left: 3px; }
        .rocket-wheel.right { right: 3px; }

        .rocket-rack {
            position: absolute;
            width: 20px;
            height: 13px;
            left: 6px;
            top: 4px;
            background: var(--color);
            box-shadow: inset 0 0 0 2px var(--color-dark);
        }

        .rocket-tube {
            position: absolute;
            width: 3px;
            height: 9px;
            background: #222;
            box-shadow: inset 0 0 0 1px #555;
            top: 6px;
        }
        .rocket-tube.t1 { left: 9px; }
        .rocket-tube.t2 { left: 13px; }
        .rocket-tube.t3 { left: 17px; }
        .rocket-tube.t4 { left: 21px; }

        /* 指挥车 (18px, 基于 28px 设计) */
        .unit.command {
            --unit-size: 18px;
            --body-size: 28px;
            --scale: 0.643;
        }
        .command-body {
            position: absolute;
            width: 20px; height: 14px;
            left: 4px; top: 7px;
            background: var(--color);
            box-shadow: inset 0 0 0 2px var(--color-dark), 0 2px 0 rgba(0,0,0,0.45);
        }
        .command-antenna {
            position: absolute;
            width: 2px; height: 10px;
            left: 18px; top: 0;
            background: #95a5a6;
        }
        .command-star {
            position: absolute;
            width: 5px; height: 5px;
            left: 11px; top: 11px;
            background: #f1c40f;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        /* 补给车 (18px, body 阵营色 + 白十字) */
        .unit.supply {
            --unit-size: 18px;
            --body-size: 28px;
            --scale: 0.643;
        }
        .supply-body {
            position: absolute;
            width: 20px; height: 14px;
            left: 4px; top: 7px;
            background: var(--color);
            box-shadow: inset 0 0 0 2px var(--color-dark), 0 2px 0 rgba(0,0,0,0.45);
        }
        .supply-cross {
            position: absolute;
            width: 4px; height: 4px;
            left: 12px; top: 12px;
            background: #ecf0f1;
        }

        /* 工程兵 (14px, body 阵营色 + 黄头 + 金工具箱) */
        .unit.engineer {
            --unit-size: 14px;
            --body-size: 22px;
            --scale: 0.636;
        }
        .unit.engineer .soldier-body { background: var(--color); box-shadow: inset 0 0 0 2px var(--color-dark), 0 2px 0 rgba(0,0,0,0.45); }
        .unit.engineer .soldier-head { background: #f5cba7; box-shadow: inset 0 0 0 2px #d68910; }
        .engineer-tool {
            position: absolute;
            width: 3px; height: 4px;
            left: 14px; top: 8px;
            background: #f1c40f;
        }

        /* 医疗兵 (14px, body 阵营色 + 白头 + 红十字) */
        .unit.medic {
            --unit-size: 14px;
            --body-size: 22px;
            --scale: 0.636;
        }
        .unit.medic .soldier-body { background: var(--color); box-shadow: inset 0 0 0 2px var(--color-dark), 0 2px 0 rgba(0,0,0,0.45); }
        .unit.medic .soldier-head { background: #fadbd8; box-shadow: inset 0 0 0 2px #bdc3c7; }
        .medic-cross {
            position: absolute;
            width: 3px; height: 3px;
            left: 5px; top: 6px;
            background: #e74c3c;
        }

        /* 反坦克步兵 (14px, body 阵营色 + 火箭筒) */
        .unit.antitank {
            --unit-size: 14px;
            --body-size: 22px;
            --scale: 0.636;
        }
        .unit.antitank .soldier-body { background: var(--color); box-shadow: inset 0 0 0 2px var(--color-dark), 0 2px 0 rgba(0,0,0,0.45); }
        .unit.antitank .soldier-head { background: var(--color-light); box-shadow: inset 0 0 0 2px var(--color); }
        .antitank-tube {
            position: absolute;
            width: 3px; height: 8px;
            left: 14px; top: 8px;
            background: #2c3e50;
        }

        /* 轻型坦克 (22px, body 阵营中色 + 细长炮管, 区分主战坦克深色粗管) */
        .unit.lightTank {
            --unit-size: 22px;
            --body-size: 36px;
            --scale: 0.611;
        }
        .unit.lightTank .tank-body { background: var(--color); box-shadow: inset 0 0 0 3px var(--color-dark), 0 3px 0 rgba(0,0,0,0.45); }
        .unit.lightTank .tank-turret { background: var(--color-light); box-shadow: inset 0 0 0 3px var(--color); }
        .unit.lightTank .tank-barrel { width: 3px; height: 24px; left: 16px; }

        /* 坦克歼击车 (22px, 低矮车身 + 长管 + 无炮塔) */
        .unit.tankDestroyer {
            --unit-size: 22px;
            --body-size: 36px;
            --scale: 0.611;
        }
        .td-hull {
            position: absolute;
            width: 26px; height: 16px;
            left: 5px; top: 10px;
            background: var(--color);
            box-shadow: inset 0 0 0 3px var(--color-dark), 0 3px 0 rgba(0,0,0,0.45);
        }
        .td-barrel {
            position: absolute;
            width: 4px; height: 24px;
            left: 16px; top: -4px;
            background: var(--color-light);
            box-shadow: inset 0 0 0 2px var(--color);
        }
        .td-track {
            position: absolute;
            width: 8px; height: 20px;
            top: 8px;
            background: #15191b;
            box-shadow: inset 0 0 0 2px #30383b;
        }
        .td-track.left { left: 3px; }
        .td-track.right { right: 3px; }

        /* 侦察车 (18px, 阵营色吉普 + 银天线) */
        .unit.scout {
            --unit-size: 18px;
            --body-size: 28px;
            --scale: 0.643;
        }
        .scout-body {
            position: absolute;
            width: 20px; height: 12px;
            left: 4px; top: 8px;
            background: var(--color);
            box-shadow: inset 0 0 0 2px var(--color-dark), 0 2px 0 rgba(0,0,0,0.45);
        }
        .scout-wheel {
            position: absolute;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #1a1a1a;
            top: 18px;
        }
        .scout-wheel.left { left: 4px; }
        .scout-wheel.right { right: 4px; }
        .scout-antenna {
            position: absolute;
            width: 2px; height: 8px;
            left: 14px; top: 0;
            background: #bdc3c7;
        }

        /* 装甲运兵车 (18px, 阵营色六轮) */
        .unit.apc {
            --unit-size: 18px;
            --body-size: 28px;
            --scale: 0.643;
        }
        .apc-body {
            position: absolute;
            width: 22px; height: 14px;
            left: 3px; top: 7px;
            background: var(--color);
            box-shadow: inset 0 0 0 2px var(--color-dark), 0 2px 0 rgba(0,0,0,0.45);
        }
        .apc-wheel {
            position: absolute;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #1a1a1a;
            top: 19px;
        }
        .apc-wheel.f1 { left: 3px; }
        .apc-wheel.f2 { left: 11px; }
        .apc-wheel.f3 { right: 3px; }

        /* 迫击炮 (20px, 阵营色底盘 + 阵营色短管) */
        .unit.mortar {
            --unit-size: 20px;
            --body-size: 32px;
            --scale: 0.625;
        }
        .mortar-base {
            position: absolute;
            width: 14px; height: 6px;
            left: 9px; top: 22px;
            background: var(--color-dark);
            box-shadow: inset 0 0 0 1px var(--color);
        }
        .mortar-tube {
            position: absolute;
            width: 4px; height: 18px;
            left: 14px; top: 4px;
            background: var(--color);
            box-shadow: inset 0 0 0 2px var(--color-dark);
            transform: rotate(30deg);
            transform-origin: bottom;
        }

        /* ===== 古代兵种 ===== */
        /* 近战步兵 (14px, 阵营色 + 银盔 + 长矛) */
        .unit.melee {
            --unit-size: 14px;
            --body-size: 22px;
            --scale: 0.636;
        }
        .unit.melee .soldier-body { background: var(--color); box-shadow: inset 0 0 0 2px var(--color-dark), 0 2px 0 rgba(0,0,0,0.45); }
        .unit.melee .soldier-head { background: #bdc3c7; box-shadow: inset 0 0 0 2px #7f8c8d; }
        .melee-spear {
            position: absolute;
            width: 2px; height: 12px;
            left: 14px; top: 2px;
            background: #95a5a6;
        }

        /* 弓箭手 (14px, 阵营色 + 绿衣 + 弓) */
        .unit.archer {
            --unit-size: 14px;
            --body-size: 22px;
            --scale: 0.636;
        }
        .unit.archer .soldier-body { background: var(--color); box-shadow: inset 0 0 0 2px var(--color-dark), 0 2px 0 rgba(0,0,0,0.45); }
        .unit.archer .soldier-head { background: #d4a373; box-shadow: inset 0 0 0 2px #8a5a3c; }
        .archer-bow {
            position: absolute;
            width: 4px; height: 8px;
            left: 14px; top: 6px;
            border: 1px solid #6b4423;
            border-radius: 50% 0 0 50%;
            background: transparent;
        }

        /* 骑兵 (18px, 马身 + 骑士) */
        .unit.cavalry {
            --unit-size: 18px;
            --body-size: 28px;
            --scale: 0.643;
        }
        .cavalry-horse {
            position: absolute;
            width: 22px; height: 10px;
            left: 3px; top: 12px;
            background: #5d4a3a;
            box-shadow: inset 0 0 0 2px #3a2a1a, 0 2px 0 rgba(0,0,0,0.45);
            border-radius: 3px 6px 3px 3px;
        }
        .cavalry-rider {
            position: absolute;
            width: 8px; height: 8px;
            left: 10px; top: 4px;
            background: var(--color);
            box-shadow: inset 0 0 0 1px var(--color-dark);
        }
        .cavalry-head {
            position: absolute;
            width: 5px; height: 4px;
            left: 11px; top: 1px;
            background: #d4a373;
            box-shadow: inset 0 0 0 1px #8a5a3c;
        }
        .cavalry-spear {
            position: absolute;
            width: 2px; height: 14px;
            left: 18px; top: 0;
            background: #95a5a6;
        }

        /* 投石车 (20px, 机械投臂 + 底座) */
        .unit.catapult {
            --unit-size: 20px;
            --body-size: 32px;
            --scale: 0.625;
        }
        .catapult-base {
            position: absolute;
            width: 18px; height: 6px;
            left: 7px; top: 22px;
            background: #5d4a3a;
            box-shadow: inset 0 0 0 1px #3a2a1a;
        }
        .catapult-arm {
            position: absolute;
            width: 3px; height: 18px;
            left: 14px; top: 4px;
            background: #7f8c8d;
            transform: rotate(-25deg);
            transform-origin: bottom;
        }
        .catapult-sling {
            position: absolute;
            width: 5px; height: 5px;
            left: 15px; top: 2px;
            background: #3a2a1a;
            border-radius: 50%;
        }
        .catapult-wheel {
            position: absolute;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #3a2a1a;
            top: 24px;
        }
        .catapult-wheel.left { left: 7px; }
        .catapult-wheel.right { right: 7px; }

        /* 连弩手 (14px, 阵营色 + 弩) */
        .unit.crossbow {
            --unit-size: 14px;
            --body-size: 22px;
            --scale: 0.636;
        }
        .unit.crossbow .soldier-body { background: var(--color); box-shadow: inset 0 0 0 2px var(--color-dark), 0 2px 0 rgba(0,0,0,0.45); }
        .unit.crossbow .soldier-head { background: #d4a373; box-shadow: inset 0 0 0 2px #8a5a3c; }
        .crossbow-div {
            position: absolute;
            width: 6px; height: 5px;
            left: 12px; top: 7px;
            background: #5d4a3a;
            box-shadow: inset 0 0 0 1px #3a2a1a;
        }
        .crossbow-string {
            position: absolute;
            width: 1px; height: 9px;
            left: 17px; top: 5px;
            background: #3a2a1a;
        }

        .unit.selected {
            filter: drop-shadow(0 0 4px #f1c40f);
            z-index: 100;
        }

        .unit.moving {
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.25));
        }

        .hp-bar {
            position: absolute;
            left: 2px;
            right: 2px;
            bottom: -6px;
            height: 3px;
            background: rgba(0,0,0,0.8);
            z-index: 1;
        }

        .hp-fill {
            width: 100%;
            height: 100%;
            background: #2ecc71;
        }

        .projectile {
            position: absolute;
            box-sizing: border-box;
            background: #f7e07b;
            border: 2px solid #fff6bd;
            box-shadow: 0 0 8px #f7e07b;
            pointer-events: none;
            z-index: 6;
        }

        .obstacle {
            position: absolute;
            background: #6f664f;
            border: 4px solid #2f2b22;
            box-shadow:
                inset 0 0 0 4px rgba(255,255,255,0.08),
                6px 6px 0 rgba(0,0,0,0.35);
            z-index: 4;
        }

        .obstacle::before,
        .obstacle::after {
            content: '';
            position: absolute;
            background: rgba(0,0,0,0.22);
        }

        .obstacle::before {
            width: 45%;
            height: 6px;
            left: 12%;
            top: 28%;
        }

        .obstacle::after {
            width: 34%;
            height: 6px;
            right: 10%;
            bottom: 24%;
        }

        .impact {
            position: absolute;
            width: 22px;
            height: 22px;
            margin-left: -11px;
            margin-top: -11px;
            border: 3px solid #ffd166;
            background: rgba(231, 76, 60, 0.35);
            animation: impactFlash 0.25s ease-out forwards;
            pointer-events: none;
            z-index: 7;
        }

        @keyframes impactFlash {
            from { transform: scale(0.4); opacity: 1; }
            to { transform: scale(1.8); opacity: 0; }
        }

        .battle-log {
            height: 150px;
            background: #000;
            border: 4px solid var(--pixel-text);
            padding: 10px;
            font-family: 'ZCOOL QingKe HuangYou', 'DotGothic16', monospace;
            font-size: 23px;
            overflow-y: auto;
            color: #2ecc71;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            margin-top: 20px;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
        }

        .log-entry { margin: 2px 0; line-height: 1.4; font-family: 'ZCOOL QingKe HuangYou', 'DotGothic16', monospace; }
        .log-entry.ally { color: #3498db; }
        .log-entry.enemy { color: #e74c3c; }

        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #000;
            border: 4px solid var(--pixel-text);
            font-family: 'ZCOOL QingKe HuangYou', 'DotGothic16', monospace;
            font-size: 20px;
            color: var(--pixel-accent);
            margin-top: 10px;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
        }

        /* 移除旧样式干扰 */
        .back-button, .sidebar, .main-content { display: none; }
        .container { display: block; }

        /* 单位信息浮窗 */
        .unit-info {
            display: none;
            position: absolute;
            background: #000;
            border: 3px solid var(--pixel-accent);
            color: var(--pixel-text);
            padding: 8px 10px;
            font-family: 'ZCOOL QingKe HuangYou', 'DotGothic16', monospace;
            font-size: 20px;
            line-height: 1.6;
            z-index: 200;
            pointer-events: none;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.6);
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
        }

        /* ===== 移动端适配 ===== */
        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            h1 {
                font-size: 1.8em;
                text-shadow: 2px 2px 0px #000;
                margin-bottom: 12px;
            }

            .game-ui {
                flex-direction: column;
                gap: 10px;
            }

            .controls-panel {
                min-width: unset;
                padding: 12px;
                border-width: 3px;
                box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
                gap: 8px;
            }

            .control-row {
                gap: 6px;
            }

            .pixel-btn {
                font-size: 16px;
                padding: 8px 10px;
                border-width: 3px;
                box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            }

            .pixel-select, .pixel-input {
                font-size: 16px;
                padding: 6px;
            }

            .battlefield {
                height: 450px;
                border-width: 3px;
                box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            }

            .battle-log {
                height: 100px;
                font-size: 20px;
                padding: 6px;
                margin-top: 10px;
            }

            .status-bar {
                font-size: 16px;
                padding: 6px;
                flex-wrap: wrap;
                gap: 4px;
            }

            .control-row label {
                font-size: 16px;
            }

            .container {
                gap: 10px;
            }
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 1.5em;
            }

            .pixel-btn {
                font-size: 14px;
                padding: 6px 8px;
            }

            .pixel-select, .pixel-input {
                font-size: 14px;
                padding: 4px;
            }

            .battlefield {
                height: 340px;
            }

            .battle-log {
                height: 80px;
                font-size: 18px;
            }

            .status-bar {
                font-size: 14px;
            }

            .control-row label {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="unit-info" id="unitInfo"></div>

    <script>
        /*
         * ╔══════════════════════════════════════════════════════════════╗
         * ║            PIXEL WAR — RTS 兵棋推演 架构框架文档            ║
         * ╚══════════════════════════════════════════════════════════════╝
         *
         * ─── 版本: 2.0 (重构设计) ───
         * ─── 风格: 红色警戒 / 命令与征服 ───
         *
         * ============================================================
         * 一、设计哲学
         * ============================================================
         *
         * 核心原则:
         *   1. 纯战斗推演 — 无建筑/生产/资源，用户投放兵力，AI 自主战斗
         *   2. 移动与攻击完全解耦 — 朝向仅作视觉，不参与物理/伤害计算
         *   3. 属性驱动涌现 — 前排后排自然形成，无需显式编队指令
         *   4. 兵种克制协同 — 不同兵种各司其职，1+1 > 2
         *
         * 用户操作:
         *   - 选择兵种 + 阵营 → 点击投放
         *   - 点击 START → AI 接管，自动协同作战
         *
         * ============================================================
         * 二、五大子系统
         * ============================================================
         *
         * ┌─────────────────────────────────────────────────────────┐
         * │ 1. 单位系统 (Unit System)                               │
         * │    职责: 兵种基类 + 子类差异化属性 + 血条/视觉渲染      │
         * │    关键约定:                                             │
         * │      - 基类统一移动逻辑 (方向无关自由平移)              │
         * │      - 子类只覆写: 攻击方式、特殊能力、视觉渲染         │
         * │      - 车体/炮塔朝向 → 视觉平滑跟随，不参与速度计算    │
         * ├─────────────────────────────────────────────────────────┤
         * │ 2. 行为系统 (Behavior System)                           │
         * │    职责: 层次状态机 + 目标选择 + 决策评估               │
         * │    关键约定:                                             │
         * │      - 每个 tick 评估 → 决定 state → 执行动作           │
         * │      - 目标选择独立于状态 (实时更新目标不重置状态)     │
         * │      - 撤退/逃跑状态优先级高于攻击命令                 │
         * ├─────────────────────────────────────────────────────────┤
         * │ 3. 协调系统 (Coordination System)                       │
         * │    职责: 友军间距保持 + 集火分配 + 阵型自然涌现        │
         * │    关键约定:                                             │
         * │      - 不显式编队，属性驱动前后排分布                   │
         * │      - 支援单位自动跟随最近的高价值友军                 │
         * │      - 多个友军攻击同一目标时分散站位避免遮挡          │
         * ├─────────────────────────────────────────────────────────┤
         * │ 4. 寻路系统 (Pathfinding System)                        │
         * │    职责: A* 网格寻路 + 障碍物碰撞 + 动态重寻路         │
         * │    关键约定:                                             │
         * │      - 格子大小 32px，适配当前地图                      │
         * │      - 直线无阻挡时跳过寻路直接移动                     │
         * │      - 路径被友军阻挡时短暂等待而非重新寻路            │
         * ├─────────────────────────────────────────────────────────┤
         * │ 5. 战场管理器 (Battlefield Manager)                     │
         * │    职责: 主循环驱动 + 单位/弹丸生命周期 + FPS/胜负判定 │
         * │    关键约定:                                             │
         * │      - 统一 deltaTime 驱动，所有单位在同一帧更新       │
         * │      - 弹丸碰撞检测: 目标判定 + 障碍物穿透             │
         * │      - 移动端降帧 (30fps) 自适应                       │
         * └─────────────────────────────────────────────────────────┘
         *
         * ============================================================
         * 三、地面兵种体系 (14 兵种)
         * ============================================================
         *
         * 命名约定:
         *   className: 英文 CamelCase
         *   显示名: 中文
         *   单位尺寸: 统一 20px (步兵) / 28px (车辆/火炮) / 30px (坦克)
         *
         * ── 步兵系 (4种) ──────────────────────────────────────────
         *
         *   Rifleman (步枪兵)
         *     尺寸:20 射程:100 速度:42 血量:60 伤害:12
         *     伤害类型: 轻武器 (对步兵 100% | 对车辆 40% | 对坦克 15%)
         *     视觉: 绿色小人, 步枪
         *     定位: 基础步兵, 人海战术, 数量优势
         *
         *   RocketSoldier (火箭兵)
         *     尺寸:20 射程:180 速度:32 血量:50 伤害:35
         *     伤害类型: 反装甲 (对步兵 60% | 对车辆 130% | 对坦克 150%)
         *     视觉: 红色小人, 肩扛火箭筒
         *     定位: 反坦克步兵, 克制一切装甲单位
         *
         *   Engineer (工程兵)
         *     尺寸:20 射程:60(维修) 速度:30 血量:40 伤害:0
         *     伤害类型: 无攻击力
         *     特殊: 自动维修周围 80px 内友军车辆 (+8 HP/s)
         *     视觉: 黄色小人, 工具箱
         *     定位: 后勤维修, 跟随坦克编队
         *
         *   Medic (医疗兵)
         *     尺寸:20 射程:80(治疗) 速度:35 血量:45 伤害:0
         *     伤害类型: 无攻击力
         *     特殊: 自动治疗周围 80px 内友军步兵 (+6 HP/s)
         *     视觉: 白色小人, 十字标志
         *     定位: 步兵续航, 跟随步兵集群
         *
         * ── 车辆系 (2种) ──────────────────────────────────────────
         *
         *   ScoutCar (侦察车)
         *     尺寸:28 射程:90 速度:65 血量:80 伤害:15
         *     伤害类型: 轻武器 (对步兵 120% | 对车辆 60% | 对坦克 20%)
         *     特殊: 视野范围 +50% (更早发现敌人)
         *     视觉: 灰色吉普车, 天线

         *
         * ============================================================
         * 四、伤害类型与克制矩阵
         * ============================================================
         *
         *               轻武器    穿甲      重型穿甲   高爆
         *   ─────────  ──────    ──────    ────────   ──────
         *   步兵        100%      60%       30%       140%
         *   车辆         50%     125%      150%       100%
         *   坦克         20%     110%      180%        75%
         *
         * 伤害计算: baseDamage × 类型倍率 × 方向加成 × 光环加成
         *
         * ============================================================
         * 五、行为状态机 (Behavior FSM)
         * ============================================================
         *
         * 状态列表 (优先级从高到低):
         *
         *   FLEE (逃跑)         — 血量 < 15%, 全速远离所有敌人
         *   RETREAT (撤退)      — 血量 < 30% 或 支援单位遇敌
         *   ATTACK (攻击)       — 敌人在射程内且面向正确 → 开火
         *   SKIRMISH (周旋)     — 敌人在射程内但被压制 → 侧向移动
         *   CHASE (追击)        — 有目标但超出射程 → 靠近
         *   PATROL (巡逻)       — 无目标 → 随机小范围移动
         *   IDLE (闲置)         — 刚部署, 等待首次 tick
         *
         * 转换规则:
         *   IDLE → PATROL               首次 update()
         *   PATROL → CHASE              发现敌人 (在视野内)
         *   CHASE → ATTACK              敌人进入射程
         *   ATTACK → SKIRMISH           自身被多个敌人瞄准
         *   ATTACK → CHASE              目标逃出射程
         *   ANY → RETREAT               HP < 30% 且有撤退空间
         *   RETREAT → FLEE              HP < 15%
         *   RETREAT → PATROL            脱离危险 (无近距离敌人)
         *   FLEE → PATROL               脱离危险
         *
         * ============================================================
         * 六、目标选择算法 (Target Acquisition)
         * ============================================================
         *
         * 每 tick 对所有可见敌人评分, 选最高分:
         *
         *   score = 基础分 + 威胁分 + 斩杀分 + 克制分 + 集火分
         *
         *   基础分 (Base):
         *     = 200 - distance/2           (越近越高)
         *
         *   威胁分 (Threat):
         *     = 80                         正在攻击我
         *     = 40                         正在攻击友军
         *     = 0                          未攻击
         *
         *   斩杀分 (Execute):
         *     = 60                         血量 < 20%
         *     = 30                         血量 < 40%
         *     = 0                          血量 >= 40%
         *
         *   克制分 (Counter):
         *     = 50                         我的伤害类型克制目标护甲
         *     = -30                        目标的伤害类型克制我
         *     = 0                          无克制关系
         *
         *   集火分 (Focus):
         *     = 20 × 正在攻击该目标的友军数量   (最多 +60)
         *
         * 特殊规则:
         *   - 支援单位 (无攻击力): 不评分, 选择最近友军跟随
         *   - 火炮类: 优先选择静止/慢速目标 (命中率更高)
         *   - 反装甲类: 坦克/车辆分数 ×1.5
         *
         * ============================================================
         * 七、AI 协同规则
         * ============================================================
         *
         * 1. 天然阵型形成 (属性驱动, 无需显式编队)
         *
         *   前排 (Tank Line):
         *     - 条件: 血量 ≥ 中等 (150+) 且 射程 ≤ 220
         *     - 行为: 主动向敌人方向移动, 保持与敌人 60%~80% 射程距离
         *     - 代表: 主战坦克、轻型坦克
         *
         *   中排 (Support Line):
         *     - 条件: 血量中等 (80-150) 或 支援单位
         *     - 行为: 保持在前排后方 50-100px, 不主动接敌
         *     - 代表: 装甲运兵车、补给车、指挥车、工程兵
         *
         *   后排 (Artillery Line):
         *     - 条件: 射程 ≥ 280
         *     - 行为: 保持最大射程距离, 有最小射程盲区
         *     - 代表: 迫击炮、榴弹炮、火箭炮、坦克歼击车
         *
         * 2. 间距保持
         *    - 友军之间最小间距: 单位尺寸 × 1.3
         *    - 同类型单位间距加倍 (防止叠成一点)
         *    - 前排单位间距略小 (允许密集阵型)
         *
         * 3. 集火策略
         *    - 优先集火: 正在攻击己方支援单位的敌人
         *    - 次优先: 被多个友军瞄准的残血目标
         *    - 分散射击: 如果目标充足, 每个单位选择不同目标
         *
         * 4. 支援单位行为
         *    - 工程兵 → 跟随最近坦克/车辆 (距离 ≤ 80px)
         *    - 医疗兵 → 跟随最近步兵 (距离 ≤ 80px)
         *    - 补给车 → 跟随最近坦克编队 (距离 ≤ 120px)
         *    - 指挥车 → 保持在前排后方 80-150px
         *
         * 5. 火炮行为
         *    - 迫击炮: 跟随前排移动, 边移动边射击
         *    - 榴弹炮: 寻找安全位置架设, 优先攻击敌方后排
         *    - 火箭炮: 攻击步兵集群 (目标周围 3+ 步兵时优先)
         *
         * ============================================================
         * 八、移动系统约定
         * ============================================================
         *
         * 核心改动 (v2.0):
         *   ✗ 旧: speed = cos(angleDelta) × maxSpeed  → 侧面速度为 0
         *   ✓ 新: speed = maxSpeed (恒定)             → 朝目标点直接平移
         *
         * 实现:
         *   1. 所有单位使用基类 moveTowardTarget() — 方向无关平移
         *   2. 车体朝向 angle = lerp(angle, targetAngle, turnRate × dt)
         *      仅在基类 updateVisual() 中用于旋转 DOM 元素
         *   3. 坦克炮管朝向独立于车体 — 始终指向当前攻击目标
         *   4. 步兵/火炮无炮塔概念 — 整体朝向跟随移动方向
         *   5. 碰撞检测保持 — 阻挡时尝试侧向绕行而非停止
         *
         * ============================================================
         * 九、战斗结算
         * ============================================================
         *
         * 受击流程:
         *   1. 弹丸到达目标位置或碰撞体
         *   2. 计算伤害: baseDamage × 类型倍率
         *   3. 方向判定: 攻击方向与目标朝向夹角
         *      - 正面 (±30°): 坦克类 ×0.75, 其他 ×1.0
         *      - 侧面 (±30°~±90°): ×1.0
         *      - 背面 (±90°~±180°): ×1.25
         *   4. 光环修正: 指挥车光环 (攻击方) / APC掩护 (受击方)
         *   5. 扣除血量, 更新血条
         *   6. 击杀: 移除单位 DOM, 记录击杀日志
         *
         * ============================================================
         * 十、实施路线图
         * ============================================================
         *
         * Phase 1 [当前]: 架构文档 ← 你在这里
         * Phase 2: 重构基类 GameObject — 解耦移动/朝向
         * Phase 3: 实现完整行为状态机 (FSM)
         * Phase 4: 实现目标选择算法 + AI 协同
         * Phase 5: 逐个实现 14 个兵种子类
         * Phase 6: 伤害类型系统 + 克制矩阵
         * Phase 7: 支援单位 AI (跟随/治疗/维修/光环)
         * Phase 8: 视觉优化 (像素兵种外观)
         *
         * ============================================================
         * v3.0 战术推演层 — 兵棋严谨 × 自动战斗畅快
         * ============================================================
         *
         * 核心循环: 组队(点值) → 自由部署 → 下达战术指令
         *         → 开战 AI 执行 → 复盘评分
         *
         * ─── 一、设计哲学升级 ───
         *
         *   v2.0: 投放兵力 → AI 混战 (战术深度不足)
         *   v3.0: 战前推演 + 战时执行 (玩家用脑不动手)
         *   严谨来自: 决策有后果 (朝向/阵型/点值/协同/想定)
         *   畅快来自: 决策后纯 AI 演算 + 实时视觉反馈
         *   玩家不在战斗中操作单位, 只在暂停时修改指令层
         *
         * ─── 二、兵力点值系统 (无上限挑战) ───
         *
         *   原则: 不设总预算上限, 实时展示总消耗点值
         *   评分: 战后按"点值效率"评级, 用更少兵力取胜 = 更高评价
         *     效率比 = 敌方点值 / 己方点值
         *     损失比 = 己方损失点值 / 敌方损失点值
         *     综合分 = 效率比 × 0.6 + 损失比 × 0.4
         *     评级: S(>1.5) / A(1.2~1.5) / B(0.9~1.2) / C(0.6~0.9) / D(<0.6)
         *   兵种点值表 (基于战斗力归一化):
         *     步兵系: 步枪兵 3 / 火箭兵 6 / 工程兵 4 / 医疗兵 4
         *     车辆系: 侦察车 8 / 装甲运兵车 12
         *     坦克系: 轻坦 18 / 主战坦克 30 / 坦克歼击车 22
         *     火炮系: 迫击炮 14 / 榴弹炮 24 / 火箭炮 20
         *     支援系: 补给车 10 / 指挥车 25
         *
         * ─── 三、自由部署 (真实战场无分区) ───
         *
         *   取消前/中/后部署限制区, 玩家在己方半场任意位置部署
         *   部署朝向锁定: 拖动决定单位初始朝向 (影响正面减伤)
         *   阵型模板一键套用:
         *     - 横队: 一字排开, 火力集中正面
         *     - 纵队: 纵深推进, 适合穿插
         *     - 楔形: 箭头突击, 集中突破
         *     - L 型伏击: 一翼隐藏, 主力诱敌
         *     - 钳形: 两翼包抄, 合围歼灭
         *   障碍物/掩体: 由想定预设, 玩家不可编辑
         *
         * ─── 四、士气系统 (替代硬撤退阈值) ───
         *
         *   士气值 0~100, 初始 = 兵种基础士气 + 指挥官光环加成
         *   基础士气: 步兵 60 / 车辆 70 / 坦克 80 / 火炮 65 / 支援 55
         *   影响因素 (每 tick 累积):
         *     - 血量损失: 士气 ≈ 当前血量% × 基础士气 (线性衰减)
         *     - 孤立无援: 周围 100px 内无友军, -5/s
         *     - 被集火: 被多个敌人瞄准, 每多 1 个 -3/s
         *     - 战友阵亡: 视野内同阵营单位阵亡 -8 (范围传染)
         *     - 指挥车光环: 150px 内 +15 持有
         *     - 后勤在位: 周围有工程兵/医疗兵/补给车, +3/s
         *     - 撤退路线: 背后无敌人且近地图边缘, +5/s
         *   士气档位与行为:
         *     高昂 >70: 攻速 +10%, 主动寻敌
         *     稳定 40~70: 正常作战
         *     动摇 20~40: 攻速 -30%, 移动犹豫 (走停), 倾向后撤
         *     溃退 <20: 全速远离最近敌人, 不开火, 无视玩家指令
         *   与 v2.0 FSM 衔接:
         *     取消 v2.0 的 retreat/lowHealth 硬阈值
         *     士气 < 20 → FLEE 状态 (AI 自主, 玩家不可控)
         *     士气 20~40 → 倾向 SKIRMISH/后撤
         *     士气 > 40 → 正常 FSM 流转
         *   溃逃传染: 一个单位溃逃会降低附近同阵营单位士气 (雪崩效应)
         *
         * ─── 五、战术指令系统 (4 条) ───
         *
         *   战前下达, 战时 AI 严格执行, 玩家可随时暂停修改
         *     1. 进攻轴线: 地图上画主攻方向, 部队沿轴线推进
         *        - 替代 v2.0 "扑最近敌人", 形成整体推进方向
         *        - 可画多条轴线 (主攻 + 侧翼)
         *     2. 集火优先级: 高价值 / 反装甲 / 支援 / 最近
         *        - 修改 v2.0 目标选择算法的权重
         *     3. 支援跟随规则: 工程兵跟哪支部队 / 补给车支援谁
         *        / 指挥车光环覆盖谁
         *        - 显式绑定, 替代"自动跟随最近"
         *     4. 作战目标: 全歼 / 占领某点 / 护送某单位 / 坚守 N 分钟
         *        - 决定胜负条件, 影响 AI 优先级
         *   已删除指令:
         *     - 接敌距离 (由士气与 AI 自主判断)
         *     - 撤退触发 (由士气系统接管)
         *
         * ─── 六、兵种协同链可视化 ───
         *
         *   部署完成自动检测并画连接线 (战场顶部叠加层):
         *     侦察-打击链: 侦察车 → 点亮 → 榴弹炮/火箭炮超视距打击
         *     前线-后勤链: 主战坦克 ← 工程兵维修 ← 补给车续航
         *     反装甲协同: 火箭兵保护坦克侧翼 (针对敌方反装甲)
         *     指挥链: 指挥车光环覆盖核心战区
         *   协同链状态:
         *     绿色实线: 协同成立, 增益生效
         *     黄色虚线: 部分成立 (距离过远/单位缺失)
         *     红色警告: 关键协同断链 (如指挥车无护卫)
         *   玩家直观看到搭配是否成立, 引导深度兵种搭配
         *
         * ─── 七、历史真实战役系统 ───
         *
         *   核心理念: 玩家穿越历史, 体验真实战役
         *   每场战役有: 年代 + 真实历史背景 + 该年代兵种表
         *              + 该战役地形图 + 双方真实兵力配置 + 胜负条件
         *
         *   战役数据结构:
         *     {
         *       id, name(中文战役名), year, era(年代标签),
         *       mode: 'pvp_custom' | 'pve_historical',  // 战役模式
         *       historicalBrief(历史背景, 2-3 句),
         *       terrain: { type, palette, obstacleSet },
