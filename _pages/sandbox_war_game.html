        class Projectile {
            constructor(source, target, damage) {
                this.source = source;
                this.target = target;
                this.team = source.team;
                this.damage = damage;
                // 各兵种子弹: 尺寸/速度/碰撞半径/光晕 (步兵小, 坦克中, 火炮缩小, 反装甲/迫击炮橙色)
                const specs = {
                    soldier:       { size: 4, border: 1, glow: 3, glowColor: '#f7e07b', speed: 340, radius: 8 },
                    antitank:      { size: 6, border: 1, glow: 5, glowColor: '#e67e22', speed: 320, radius: 8 },
                    tank:          { size: 7, border: 2, glow: 6, glowColor: '#f7e07b', speed: 520, radius: 11 },
                    lightTank:     { size: 6, border: 2, glow: 5, glowColor: '#f7e07b', speed: 540, radius: 10 },
                    tankDestroyer: { size: 8, border: 2, glow: 7, glowColor: '#f7e07b', speed: 560, radius: 12 },
                    artillery:     { size: 8, border: 2, glow: 8, glowColor: '#f7e07b', speed: 280, radius: 10 },
                    rocket:        { size: 8, border: 2, glow: 9, glowColor: '#e67e22', speed: 240, radius: 8 },
                    mortar:        { size: 7, border: 2, glow: 7, glowColor: '#e67e22', speed: 300, radius: 9 },
                    scout:         { size: 4, border: 1, glow: 3, glowColor: '#f7e07b', speed: 380, radius: 7 },
                    apc:           { size: 4, border: 1, glow: 3, glowColor: '#f7e07b', speed: 360, radius: 8 },
                    // 古代兵种
                    melee:    { size: 3, border: 1, glow: 2, glowColor: '#f7e07b', speed: 600, radius: 6 },
                    archer:   { size: 4, border: 1, glow: 3, glowColor: '#f7e07b', speed: 400, radius: 7 },
                    cavalry:  { size: 3, border: 1, glow: 2, glowColor: '#f7e07b', speed: 650, radius: 6 },
                    catapult: { size: 9, border: 2, glow: 8, glowColor: '#e67e22', speed: 260, radius: 10 },
                    crossbow: { size: 3, border: 1, glow: 2, glowColor: '#f7e07b', speed: 450, radius: 6 }
                };
                const spec = specs[source.type] || specs.soldier;
                this.size = spec.size;
                this.speed = spec.speed;
                this.radius = spec.radius;

                // 散布弹道：若设置则飞向固定点而非追踪目标，到达后溅射
                this.scatterX = undefined;
                this.scatterY = undefined;
                this.splashRadius = 0;

                this.x = source.x + source.getSize() / 2;
                this.y = source.y + source.getSize() / 2;
                this.element = document.createElement('div');
                this.element.className = `projectile ${this.team}`;
                this.element.style.width = this.size + 'px';
                this.element.style.height = this.size + 'px';
                this.element.style.borderWidth = spec.border + 'px';
                this.element.style.boxShadow = `0 0 ${spec.glow}px ${spec.glowColor}`;
                this.element.style.background = this.team === 'ally' ? '#8fd3ff' : '#ff9a8f';
                this.element.style.borderColor = this.team === 'ally' ? '#d6f1ff' : '#ffd3cd';
                this.updateVisual();
            }

            update(deltaTime) {
                // 散布弹道：飞向固定点，到达后对范围内所有敌方单位溅射
                if (this.scatterX !== undefined) {
                    if (battlefieldManager.collidesWithObstacle(this.x, this.y, 8, 8)) {
                        this.doSplashDamage(this.x, this.y);
                        this.createImpact(this.x, this.y);
                        return false;
                    }

                    const dx = this.scatterX - this.x;
                    const dy = this.scatterY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist <= this.radius) {
                        this.doSplashDamage(this.scatterX, this.scatterY);
                        this.createImpact(this.scatterX, this.scatterY);
                        return false;
                    }

                    const step = Math.min(dist, this.speed * deltaTime);
                    this.x += (dx / dist) * step;
                    this.y += (dy / dist) * step;
                    if (battlefieldManager.collidesWithObstacle(this.x, this.y, 8, 8)) {
                        this.doSplashDamage(this.x, this.y);
                        this.createImpact(this.x, this.y);
                        return false;
                    }
                    this.updateVisual();
                    return true;
                }

                // 追踪弹道（原有逻辑）
                if (!this.target || this.target.isDead()) return false;

                if (battlefieldManager.collidesWithObstacle(this.x, this.y, 8, 8)) {
                    this.createImpact(this.x, this.y);
                    return false;
                }

                const targetX = this.target.x + this.target.getSize() / 2;
                const targetY = this.target.y + this.target.getSize() / 2;
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist <= this.radius) {
                    const killed = this.target.takeDamage(this.damage);
                    logBattle(`${this.team === 'ally' ? '友军' : '敌军'} ${unitTypeName(this.source.type)} 命中 ${this.target.team === 'ally' ? '友军' : '敌军'} ${unitTypeName(this.target.type)} (-${this.damage})${killed ? ' 击毁！' : ''}`, `${this.team} attack`);
                    this.createImpact(targetX, targetY);
                    return false;
                }

                const step = Math.min(dist, this.speed * deltaTime);
                this.x += (dx / dist) * step;
                this.y += (dy / dist) * step;
                if (battlefieldManager.collidesWithObstacle(this.x, this.y, 8, 8)) {
                    this.createImpact(this.x, this.y);
                    return false;
                }
                this.updateVisual();
                return true;
            }

            doSplashDamage(ix, iy) {
                if (!this.splashRadius) return;
                for (const unit of battlefieldManager.units) {
                    if (unit.team === this.team || unit.isDead()) continue;
                    const ux = unit.x + unit.getSize() / 2;
                    const uy = unit.y + unit.getSize() / 2;
                    const dx = ux - ix;
                    const dy = uy - iy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist <= this.splashRadius) {
                        const killed = unit.takeDamage(this.damage);
                        logBattle(`${this.team === 'ally' ? '友军' : '敌军'} 火箭溅射命中 ${unit.team === 'ally' ? '友军' : '敌军'} ${unitTypeName(unit.type)} (-${this.damage})${killed ? ' 击毁！' : ''}`, `${this.team} attack`);
                    }
                }
            }

            updateVisual() {
                this.element.style.left = (this.x - this.size / 2) + 'px';
                this.element.style.top = (this.y - this.size / 2) + 'px';
            }

            createImpact(x, y) {
                const impact = document.createElement('div');
                impact.className = 'impact';
                impact.style.left = x + 'px';
                impact.style.top = y + 'px';
                document.getElementById('battlefield').appendChild(impact);
                setTimeout(() => impact.remove(), 260);
            }

            remove() {
                this.element.remove();
            }
        }

        class Obstacle {
            constructor(x, y, width, height, type = 'house') {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.type = type;
                this.element = document.createElement('div');
                this.element.className = 'obstacle obstacle-' + type;
                this.updateVisual();
            }

            updateVisual() {
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                this.element.style.width = this.width + 'px';
                this.element.style.height = this.height + 'px';
            }

            remove() {
                this.element.remove();
            }
        }

        // DOM 层掩体类型 (可碰撞), 其余由 Canvas 绘制
        const DOM_OBSTACLE_TYPES = new Set(['house', 'ruin', 'wall']);

        // v3.0 兵种 type → 现有实现 type 映射 (P8 实现 14 兵种后移除)
        const SCENARIO_TYPE_MAP = {
            mediumTank: 'tank',    heavyTank: 'tank',     lightTank: 'lightTank',

        // ── v3.0 战场地图绘制器 ──
        class TerrainRenderer {
            constructor(terrainCanvas, decorCanvas, scenario) {
                this.terrainCanvas = terrainCanvas;
                this.terrainCtx = terrainCanvas.getContext('2d');
                this.decorCanvas = decorCanvas;
                this.decorCtx = decorCanvas.getContext('2d');
                this.scenario = scenario;
                this._seed = 0;
                this.w = 1;
                this.h = 1;
                this.resize();
            }

            resize() {
                const rect = this.terrainCanvas.getBoundingClientRect();
                this.w = Math.max(1, Math.floor(rect.width));
                this.h = Math.max(1, Math.floor(rect.height));
                const dpr = window.devicePixelRatio || 1;
                [this.terrainCanvas, this.decorCanvas].forEach(c => {
                    c.width = this.w * dpr;
                    c.height = this.h * dpr;
                    const ctx = c.getContext('2d');
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    ctx.imageSmoothingEnabled = false;
                });
            }

            render() {
                this.resize();
                this.drawGround();
                this.drawFeatures();
                this.drawDecorations();
            }

            drawGround() {
                const ctx = this.terrainCtx;
                const p = this.scenario.terrain.palette;
                const type = this.scenario.terrain.type;
                this.seed(this.scenario.id + ':ground');

                if (type === 'beach') {
                    // 海水区 (西侧 0-150px, 像素蓝)
                    ctx.fillStyle = '#2c5f7c';
                    ctx.fillRect(0, 0, 150, this.h);
                    ctx.save();
                    ctx.fillStyle = '#3a7a9c';
                    for (let i = 0; i < 500; i++) ctx.fillRect(this.randInt(150), this.randInt(this.h), 4, 4);
                    ctx.fillStyle = '#1f4a5c';
                    for (let i = 0; i < 250; i++) ctx.fillRect(this.randInt(150), this.randInt(this.h), 4, 4);
                    ctx.restore();
                    // 湿沙交界 (150-175px)
                    ctx.fillStyle = '#b89860';
                    ctx.fillRect(150, 0, 25, this.h);
                    // 沙滩区 (175px+)
                    ctx.fillStyle = p.ground;
                    ctx.fillRect(175, 0, this.w - 175, this.h);
                    // 沙滩像素噪点
                    ctx.save();
                    ctx.globalAlpha = 0.15;
                    ctx.fillStyle = p.shadow;
                    for (let i = 0; i < 1500; i++) ctx.fillRect(175 + this.randInt(this.w - 175), this.randInt(this.h), 2, 2);
                    ctx.restore();
                    // 水陆交界波浪
                    ctx.strokeStyle = '#6fb0d8';
                    ctx.lineWidth = 2;
                    for (let y = 0; y < this.h; y += 8) {
                        ctx.beginPath();
                        ctx.moveTo(147, y);
                        ctx.lineTo(147 + Math.sin(y * 0.3) * 3, y + 4);
                        ctx.stroke();
                    }
                } else if (type === 'desert') {
                    // 深沙底色
                    ctx.fillStyle = p.ground;
                    ctx.fillRect(0, 0, this.w, this.h);
                    // 沙丘条纹 (像素瓦片感, 深浅交替)
                    ctx.save();
                    ctx.fillStyle = p.shadow;
                    ctx.globalAlpha = 0.22;
                    for (let i = 0; i < 400; i++) ctx.fillRect(this.randInt(this.w), this.randInt(this.h), 6 + this.randInt(8), 4);
                    ctx.fillStyle = p.accent;
                    ctx.globalAlpha = 0.25;
                    for (let i = 0; i < 300; i++) ctx.fillRect(this.randInt(this.w), this.randInt(this.h), 4, 4);
                    ctx.restore();
                } else {
                    // 默认: palette + 噪点
                    ctx.fillStyle = p.ground;
                    ctx.fillRect(0, 0, this.w, this.h);
                    this.scatter(p.shadow, 0.12, 2400, 2, 5);
                    this.scatter(p.accent, 0.08, 1400, 2, 4);
                }
            }

            scatter(color, alpha, count, minSize, maxSize) {
                const ctx = this.terrainCtx;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = color;
                for (let i = 0; i < count; i++) {
                    const x = this.randInt(this.w);
                    const y = this.randInt(this.h);
                    const s = minSize + this.randInt(maxSize - minSize + 1);
                    ctx.fillRect(x, y, s, s);
                }
                ctx.restore();
            }

            drawFeatures() {
                const ctx = this.terrainCtx;
                for (const o of this.scenario.obstacles) {
                    if (o.type === 'embankment') {
                        // 铁路堤/海堤: 低矮长条 (非掩体, 子弹可穿, 单位可过)
                        ctx.fillStyle = '#5a554a';
                        ctx.fillRect(o.x, o.y, o.w, o.h);
                        ctx.fillStyle = '#7a756a';
                        ctx.fillRect(o.x, o.y, o.w, 3);
                        ctx.fillStyle = '#3a3530';
                        ctx.fillRect(o.x + 3, o.y, 2, o.h);
                        ctx.fillRect(o.x + o.w - 5, o.y, 2, o.h);
                    } else if (o.type === 'river') {
                        ctx.fillStyle = '#3a4a5a';
                        ctx.fillRect(o.x, o.y, o.w, o.h);
                        ctx.strokeStyle = 'rgba(120,140,160,0.4)';
                        ctx.lineWidth = 1;
                        for (let y = 8; y < o.h; y += 12) {
                            ctx.beginPath();
                            ctx.moveTo(o.x + 4, o.y + y);
                            for (let x = 4; x < o.w; x += 8) {
                                ctx.lineTo(o.x + x, o.y + y + Math.sin(x * 0.3) * 2);
                            }
                            ctx.stroke();
                        }
                    }
                }
            }

            drawDecorations() {
                const ctx = this.decorCtx;
                ctx.clearRect(0, 0, this.w, this.h);
                const type = this.scenario.terrain.type;
                this.seed(this.scenario.id + ':decor');

                if (type === 'steppe') {
                    ctx.save();
                    ctx.globalAlpha = 0.5;
                    ctx.fillStyle = this.scenario.terrain.palette.accent;
                    for (let i = 0; i < 6; i++) {
                        const x = this.randInt(this.w);
                        const y = this.randInt(this.h);
                        const w = 60 + this.randInt(80);
                        const h = 40 + this.randInt(50);
                        ctx.fillRect(x, y, w, h);
                    }
                    ctx.restore();
                    ctx.fillStyle = '#5a6a2a';
                    for (let i = 0; i < 300; i++) {
                        ctx.fillRect(this.randInt(this.w), this.randInt(this.h), 2, 2);
                    }
                    for (const o of this.scenario.obstacles) {
                        if (o.type === 'mound') {
                            ctx.fillStyle = 'rgba(196,176,106,0.35)';
                            ctx.beginPath();
                            ctx.ellipse(o.x + o.w / 2, o.y + o.h / 2, o.w / 2, o.h / 2, 0, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                } else if (type === 'urban_ruin') {
                    ctx.save();
                    ctx.fillStyle = '#4a4540';
                    for (let i = 0; i < 400; i++) {
                        const x = this.randInt(this.w);
                        const y = this.randInt(this.h);
                        const s = 2 + this.randInt(5);
                        ctx.globalAlpha = 0.3 + this.rand() * 0.5;
                        ctx.fillRect(x, y, s, s);
                    }
                    ctx.restore();
                    ctx.strokeStyle = 'rgba(20,15,10,0.6)';
                    ctx.fillStyle = 'rgba(20,15,10,0.25)';
                    for (let i = 0; i < 20; i++) {
                        const x = this.randInt(this.w);
                        const y = this.randInt(this.h);
                        const r = 6 + this.randInt(10);
                        ctx.beginPath();
                        ctx.arc(x, y, r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    }
                    ctx.save();
                    ctx.fillStyle = '#2a2520';
                    for (let i = 0; i < 8; i++) {
                        ctx.globalAlpha = 0.1 + this.rand() * 0.1;
                        const x = this.randInt(this.w);
                        const y = this.randInt(this.h);
                        const r = 30 + this.randInt(40);
                        ctx.beginPath();
                        ctx.arc(x, y, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                } else if (type === 'desert') {
                    // 沙漠: 沙丘纹路 + 稀疏石块
                    ctx.strokeStyle = 'rgba(138,106,48,0.2)';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 15; i++) {
                        const y = this.randInt(this.h);
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        for (let x = 0; x < this.w; x += 30) {
                            ctx.lineTo(x, y + Math.sin(x * 0.05) * 8);
                        }
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#8a6a30';
                    for (let i = 0; i < 40; i++) {
                        ctx.globalAlpha = 0.3;
                        ctx.fillRect(this.randInt(this.w), this.randInt(this.h), 4 + this.randInt(4), 4 + this.randInt(4));
                    }
                } else if (type === 'snow') {
                    // 雪地: 雪花纹理 + 深绿树丛
                    ctx.save();
                    ctx.fillStyle = '#ffffff';
                    for (let i = 0; i < 500; i++) {
                        ctx.globalAlpha = 0.3;
                        ctx.fillRect(this.randInt(this.w), this.randInt(this.h), 2, 2);
                    }
                    ctx.restore();
                    ctx.fillStyle = '#2d4a2d';
                    for (let i = 0; i < 30; i++) {
                        ctx.globalAlpha = 0.6;
                        ctx.beginPath();
                        ctx.arc(this.randInt(this.w), this.randInt(this.h), 8 + this.randInt(6), 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (type === 'beach') {
                    // 沙滩: 贝壳/碎石散布 (仅沙滩区, 避开海水)
                    ctx.save();
                    ctx.fillStyle = this.scenario.terrain.palette.shadow;
                    for (let i = 0; i < 200; i++) {
                        ctx.globalAlpha = 0.25;
                        ctx.fillRect(175 + this.randInt(this.w - 175), this.randInt(this.h), 2, 2);
                    }
                    ctx.restore();
                }
            }

            seed(s) {
                this._seed = this.hashStr(s);
            }

            rand() {
                this._seed = (this._seed + 0x6D2B79F5) | 0;
                let t = this._seed;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            }

            randInt(max) { return Math.floor(this.rand() * Math.max(1, max)); }

            hashStr(s) {
                let h = 2166136261;
                for (let i = 0; i < s.length; i++) {
                    h ^= s.charCodeAt(i);
                    h = Math.imul(h, 16777619);
                }
                return h >>> 0;
            }
        }

        // 战场管理器（组合模式的核心）
        class BattlefieldManager {
            constructor() {
                this.units = [];
                this.projectiles = [];
                this.obstacles = [];
                this.battlefield = document.getElementById('battlefield');
                this.terrainRenderer = null;
                this.currentScenario = null;
                this.debugPaths = false;
                this.synergyShown = false;
                // v3.0 兵力点值系统
                this.allyDeployedPoints = 0;
                this.enemyDeployedPoints = 0;
                this.allyLostPoints = 0;
                this.enemyLostPoints = 0;
                this.isBattleActive = false;
                this.isPaused = false;
                this.lastUpdateTime = 0;
                this.deltaTime = 0;
                this.animationId = null;
                
                // 帧率控制相关
                this.lastFrameTime = 0;
                this.fps = 0;
                this.framesThisSecond = 0;
                this.lastFpsUpdate = 0;
                this.targetFPS = 60;
                this.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                // 移动端优化
                if (this.isMobile) {
                    this.targetFPS = 30; // 移动端目标30fps
                    this.maxDeltaTime = 1/20; // 最大deltaTime限制为20fps
                } else {
                    this.maxDeltaTime = 1/30; // PC端最大deltaTime限制为30fps
                }
                
            }

            addUnit(unit) {
                const emptyState = this.battlefield.querySelector('.empty-state');
                if (emptyState) emptyState.remove();

                this.units.push(unit);
                const element = unit.createElement();
                this.battlefield.appendChild(element);
                // v3.0 累加部署点值
                if (unit.team === 'ally') this.allyDeployedPoints += (unit.pointCost || 0);
                else this.enemyDeployedPoints += (unit.pointCost || 0);
                this.updatePointsDisplay();
                logBattle(`部署 ${unit.team === 'ally' ? '友军' : '敌军'} ${unitTypeName(unit.type)}`, unit.team);
            }

            addObstacle(obstacle) {
                const emptyState = this.battlefield.querySelector('.empty-state');
                if (emptyState) emptyState.remove();

                this.obstacles.push(obstacle);
                this.battlefield.appendChild(obstacle.element);
                logBattle('掩体已放置', 'info');
            }

            // ── v3.0 加载想定: 渲染地形 + 部署 DOM 掩体 ──
            loadScenario(scenarioId) {
                const scenario = SCENARIOS[scenarioId];
                if (!scenario) {
                    console.warn('想定未找到:', scenarioId);
                    return;
                }
                this.currentScenario = scenario;
                const terrainCanvas = document.getElementById('terrainCanvas');
                const decorCanvas = document.getElementById('decorCanvas');
                if (terrainCanvas && decorCanvas) {
                    this.terrainRenderer = new TerrainRenderer(terrainCanvas, decorCanvas, scenario);
                    this.terrainRenderer.render();
                }
                this.loadScenarioObstacles(scenario);
                // PVE 模式: 自动部署双方兵力
                if (scenario.mode === 'pve_historical') {
                    this.deployScenarioForces(scenario);
                }
                // 应用模式 UI (PVE 隐藏 enemy 投放)
                this.applyMode(scenario.mode);
                // 按年代显示对应兵种按钮
                this.applyEra(scenario.era);
                // 同步选择框
                const select = document.getElementById('scenarioSelect');
                if (select) select.value = scenarioId;
                logBattle('加载想定: ' + scenario.name + (scenario.year ? ' (' + scenario.year + ')' : ''), 'info');
                logBattle(scenario.historicalBrief, 'info');
            }

            loadScenarioObstacles(scenario) {
                const emptyState = this.battlefield.querySelector('.empty-state');
                if (emptyState) emptyState.remove();
                for (const o of scenario.obstacles) {
                    if (DOM_OBSTACLE_TYPES.has(o.type)) {
                        const obs = new Obstacle(o.x, o.y, o.w, o.h, o.type);
                        this.obstacles.push(obs);
                        this.battlefield.appendChild(obs.element);
                    }
                }
            }

            // PVE 模式: 按想定自动部署双方兵力
            deployScenarioForces(scenario) {
                // 部署敌方兵力 (按位置/朝向/数量, 散布)
                for (const group of scenario.enemyForce) {
                    const mappedType = SCENARIO_TYPE_MAP[group.type] || 'soldier';
                    for (let i = 0; i < (group.count || 1); i++) {
                        const ox = (Math.random() - 0.5) * 36;
                        const oy = (Math.random() - 0.5) * 36;
                        this.spawnScenarioUnit('enemy', mappedType, group.x + ox, group.y + oy, group.angle || 0);
                    }
                }
                // 部署玩家方兵力 (按 playerZone 网格散布)
                const layout = (scenario.playerForce && scenario.playerForce.defaultLayout) || [];
                const zone = scenario.playerZone || { x: 0, y: 0, w: 500, h: 750 };
                let idx = 0;
                for (const group of layout) {
                    const mappedType = SCENARIO_TYPE_MAP[group.type] || 'soldier';
                    for (let i = 0; i < (group.count || 1); i++) {
                        const col = idx % 5;
                        const row = Math.floor(idx / 5);
                        const px = zone.x + 40 + col * 60 + (Math.random() - 0.5) * 16;
                        const py = zone.y + 60 + row * 50 + (Math.random() - 0.5) * 16;
                        this.spawnScenarioUnit('ally', mappedType, px, py, 90);
                        idx++;
                    }
                }
            }

            spawnScenarioUnit(team, type, x, y, angle) {
                const health = UNIT_PRESETS[type].health;
                const unitSize = (type === 'tank') ? 22 : (type === 'artillery' || type === 'rocket') ? 20 : 14;
                const bf = this.battlefield;
                x = Math.max(10, Math.min(bf.offsetWidth - unitSize - 10, x));
                y = Math.max(10, Math.min(bf.offsetHeight - unitSize - 10, y));
                // 碰撞避让: 找附近可用位置
                if (this.collidesWithObstacle(x, y, unitSize, unitSize, 6) ||
                    this.collidesWithUnit(x, y, unitSize, unitSize)) {
                    let placed = false;
                    for (let r = 12; r < 100 && !placed; r += 12) {
                        for (let a = 0; a < Math.PI * 2 && !placed; a += Math.PI / 6) {
                            const nx = x + Math.cos(a) * r;
                            const ny = y + Math.sin(a) * r;
                            if (!this.collidesWithObstacle(nx, ny, unitSize, unitSize, 6) &&
                                !this.collidesWithUnit(nx, ny, unitSize, unitSize)) {
                                x = nx; y = ny; placed = true;
                            }
                        }
                    }
                }
                let unit;
                if (type === 'tank') unit = new Tank(x, y, team, health);
                else if (type === 'artillery') unit = new Artillery(x, y, team, health);
                else if (type === 'rocket') unit = new RocketLauncher(x, y, team, health);
                else if (type === 'command') unit = new CommandVehicle(x, y, team, health);
                else if (type === 'supply') unit = new SupplyTruck(x, y, team, health);
                else if (type === 'engineer') unit = new Engineer(x, y, team, health);
                else if (type === 'medic') unit = new Medic(x, y, team, health);
                else if (type === 'antitank') unit = new RocketSoldier(x, y, team, health);
                else if (type === 'lightTank') unit = new LightTank(x, y, team, health);
                else if (type === 'tankDestroyer') unit = new TankDestroyer(x, y, team, health);
                else if (type === 'scout') unit = new ScoutCar(x, y, team, health);
                else if (type === 'apc') unit = new APC(x, y, team, health);
                else if (type === 'mortar') unit = new Mortar(x, y, team, health);
                else if (type === 'melee') unit = new MeleeInfantry(x, y, team, health);
                else if (type === 'archer') unit = new Archer(x, y, team, health);
                else if (type === 'cavalry') unit = new Cavalry(x, y, team, health);
                else if (type === 'catapult') unit = new Catapult(x, y, team, health);
                else if (type === 'crossbow') unit = new Crossbowman(x, y, team, health);
                else unit = new Soldier(x, y, team, health);
                unit.angle = angle;
                unit.desiredAngle = angle;
                this.addUnit(unit);
            }

            applyMode(mode) {
                const enemyRow = document.getElementById('enemyControlRow');
                if (enemyRow) {
                    enemyRow.style.display = (mode === 'pve_historical') ? 'none' : '';
                }
            }

            // 按战役年代显示对应兵种按钮 (ww2/ancient, custom 显示全部)
            applyEra(era) {
                const showWw2 = (era === 'ww2' || era === 'custom');
                const showAncient = (era === 'ancient' || era === 'custom');
                document.querySelectorAll('.btn-era-ww2').forEach(b => b.style.display = showWw2 ? '' : 'none');
                document.querySelectorAll('.btn-era-ancient').forEach(b => b.style.display = showAncient ? '' : 'none');
            }

            updatePointsDisplay() {
                const a = document.getElementById('allyPoints');
                const e = document.getElementById('enemyPoints');
                if (a) a.textContent = this.allyDeployedPoints;
                if (e) e.textContent = this.enemyDeployedPoints;
            }

            // debug 路线显示开关 + 渲染
            toggleDebugPaths() {
                this.debugPaths = !this.debugPaths;
                const svg = document.getElementById('debugPathLayer');
                if (svg) {
                    svg.style.display = this.debugPaths ? 'block' : 'none';
                    if (!this.debugPaths) svg.innerHTML = '';
                }
                logBattle('调试路线: ' + (this.debugPaths ? '开启' : '关闭'), 'info');
            }

            renderDebugPaths() {
                const svg = document.getElementById('debugPathLayer');
                if (!svg) return;
                svg.innerHTML = '';
                const ns = 'http://www.w3.org/2000/svg';
                for (const unit of this.units) {
                    if (unit.isDead() || !unit.isMoving) continue;
                    const color = unit.team === 'ally' ? '#3498db' : '#e74c3c';
                    const half = unit.getSize() / 2;
                    const pts = [[unit.x + half, unit.y + half]];
                    for (const wp of unit.path) {
                        pts.push([wp.x + half, wp.y + half]);
                    }
                    // path 用完才画到 target (避免 target 在掩体内画穿掩体)
                    if (unit.path.length === 0) {
                        pts.push([unit.targetX + half, unit.targetY + half]);
                    }
                    if (pts.length < 2) continue;
                    const poly = document.createElementNS(ns, 'polyline');
                    poly.setAttribute('points', pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '));
                    poly.setAttribute('stroke', color);
                    poly.setAttribute('stroke-width', '2');
                    poly.setAttribute('fill', 'none');
                    poly.setAttribute('stroke-dasharray', '5,3');
                    poly.setAttribute('opacity', '0.75');
                    svg.appendChild(poly);
                    // 末端箭头 (target 处)
                    const last = pts[pts.length - 1];
                    const prev = pts[pts.length - 2];
                    const ang = Math.atan2(last[1] - prev[1], last[0] - prev[0]);
                    const s = 8;
                    const ax1 = last[0] - s * Math.cos(ang - Math.PI / 6);
                    const ay1 = last[1] - s * Math.sin(ang - Math.PI / 6);
                    const ax2 = last[0] - s * Math.cos(ang + Math.PI / 6);
                    const ay2 = last[1] - s * Math.sin(ang + Math.PI / 6);
                    const arrow = document.createElementNS(ns, 'polygon');
                    arrow.setAttribute('points', last[0].toFixed(1) + ',' + last[1].toFixed(1) + ' ' + ax1.toFixed(1) + ',' + ay1.toFixed(1) + ' ' + ax2.toFixed(1) + ',' + ay2.toFixed(1));
                    arrow.setAttribute('fill', color);
                    svg.appendChild(arrow);
                }
            }

            // ── v3.0 P5 兵种协同链可视化 ──
            toggleSynergy() {
                this.synergyShown = !this.synergyShown;
                const svg = document.getElementById('synergyLayer');
                if (svg) {
                    svg.style.display = this.synergyShown ? 'block' : 'none';
                    if (!this.synergyShown) svg.innerHTML = '';
                }
                logBattle('协同链: ' + (this.synergyShown ? '开启' : '关闭'), 'info');
            }

            renderSynergy() {
                const svg = document.getElementById('synergyLayer');
                if (!svg) return;
                svg.innerHTML = '';
                const ns = 'http://www.w3.org/2000/svg';
                for (const unit of this.units) {
                    if (unit.isDead()) continue;
                    const ux = unit.x + unit.getSize() / 2;
                    const uy = unit.y + unit.getSize() / 2;

                    // 侦察-打击链: 侦察车 → 火炮/火箭炮/迫击炮
                    if (unit.type === 'scout') {
                        const spotter = this.findNearestAllyType(unit, ['artillery', 'rocket', 'mortar']);
                        if (spotter) {
                            const d = unit.getDistance(spotter);
                            this.drawSynergyLine(svg, ns, ux, uy, spotter,
                                d < 250 ? '#2ecc71' : '#f1c40f', d < 250 ? '' : '5,3');
                        }
                    }

                    // 前线-后勤链: 坦克 ← 工程兵/补给车
                    if (unit.type === 'tank' || unit.type === 'lightTank' || unit.type === 'tankDestroyer') {
                        const repair = this.findNearestAllyType(unit, ['engineer', 'supply']);
                        if (repair) {
                            const d = unit.getDistance(repair);
                            this.drawSynergyLine(svg, ns, ux, uy, repair,
                                d < 120 ? '#2ecc71' : '#f1c40f', d < 120 ? '' : '5,3');
                        }
                    }

                    // 反装甲协同: 坦克 ← 反坦克兵 (侧翼保护)
                    if (unit.type === 'tank' || unit.type === 'lightTank') {
                        const at = this.findNearestAllyType(unit, ['antitank']);
                        if (at && unit.getDistance(at) < 100) {
                            this.drawSynergyLine(svg, ns, ux, uy, at, '#2ecc71', '');
                        }
                    }

                    // 指挥链: 指挥车 → 光环内友军 (紫色光环), 孤立则红色警告
                    if (unit.type === 'command') {
                        let hasEscort = false;
                        for (const u of this.units) {
                            if (u === unit || u.isDead() || u.team !== unit.team) continue;
                            if (unit.getDistance(u) < 150) {
                                hasEscort = true;
                                this.drawSynergyLine(svg, ns, ux, uy, u, '#9b59b6', '3,2');
                            }
                        }
                        if (!hasEscort) {
                            // 指挥车孤立无护卫, 红色警告圈
                            const warn = document.createElementNS(ns, 'circle');
                            warn.setAttribute('cx', ux);
                            warn.setAttribute('cy', uy);
                            warn.setAttribute('r', '14');
                            warn.setAttribute('stroke', '#e74c3c');
                            warn.setAttribute('stroke-width', '2');
                            warn.setAttribute('fill', 'none');
                            warn.setAttribute('opacity', '0.8');
                            svg.appendChild(warn);
                        }
                    }
                }
            }

            findNearestAllyType(unit, types) {
                let best = null, bestDist = Infinity;
                for (const u of this.units) {
                    if (u === unit || u.isDead() || u.team !== unit.team) continue;
                    if (types.includes(u.type)) {
                        const d = unit.getDistance(u);
                        if (d < bestDist) { bestDist = d; best = u; }
                    }
                }
                return best;
            }

            drawSynergyLine(svg, ns, x1, y1, target, color, dash) {
                const x2 = target.x + target.getSize() / 2;
                const y2 = target.y + target.getSize() / 2;
                const line = document.createElementNS(ns, 'line');
                line.setAttribute('x1', x1.toFixed(1));
                line.setAttribute('y1', y1.toFixed(1));
                line.setAttribute('x2', x2.toFixed(1));
                line.setAttribute('y2', y2.toFixed(1));
                line.setAttribute('stroke', color);
                line.setAttribute('stroke-width', '2');
                line.setAttribute('fill', 'none');
                line.setAttribute('opacity', '0.6');
                if (dash) line.setAttribute('stroke-dasharray', dash);
                svg.appendChild(line);
            }

            switchToScenario(scenarioId) {
                // 清空所有元素 (保留 canvas)
                this.units.forEach(u => { if (u.element) u.element.remove(); });
                this.projectiles.forEach(p => p.remove());
                this.obstacles.forEach(o => o.element.remove());
                this.units = []; this.projectiles = []; this.obstacles = [];
                this.isBattleActive = false; this.isPaused = false;
                // v3.0 重置点值
                this.allyDeployedPoints = 0;
                this.enemyDeployedPoints = 0;
                this.allyLostPoints = 0;
                this.enemyLostPoints = 0;
                if (this.animationId) { cancelAnimationFrame(this.animationId); this.animationId = null; }
                resetBattleButton();
                this.updatePointsDisplay();
                // 加载新想定
                this.loadScenario(scenarioId);
            }

            collidesWithObstacle(x, y, width, height, padding = 2) {
                return this.obstacles.some(obstacle => {
                    return !(
                        x + width < obstacle.x - padding ||
                        x > obstacle.x + obstacle.width + padding ||
                        y + height < obstacle.y - padding ||
                        y > obstacle.y + obstacle.height + padding
                    );
                });
            }

            collidesWithUnit(x, y, width, height) {
                const centerX = x + width / 2;
                const centerY = y + height / 2;

                return this.units.some(unit => {
                    if (unit.isDead()) return false;

                    const unitSize = unit.getSize();
                    const unitCenterX = unit.x + unitSize / 2;
                    const unitCenterY = unit.y + unitSize / 2;
                    const minDist = (Math.max(width, height) + unitSize) / 2;
                    const dist = Math.sqrt((centerX - unitCenterX) ** 2 + (centerY - unitCenterY) ** 2);

                    return dist < minDist;
                });
            }

            pathBlockedByObstacle(startX, startY, endX, endY, size) {
                const dx = endX - startX;
                const dy = endY - startY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const steps = Math.max(1, Math.ceil(distance / 18));

                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const x = startX + dx * t;
                    const y = startY + dy * t;
                    if (this.collidesWithObstacle(x, y, size, size, 4)) {
                        return true;
                    }
                }

                return false;
            }

            findPath(startX, startY, endX, endY, size) {
                const cellSize = 32;
                const cols = Math.max(1, Math.ceil(this.battlefield.offsetWidth / cellSize));
                const rows = Math.max(1, Math.ceil(this.battlefield.offsetHeight / cellSize));
                const toCell = (x, y) => ({
                    x: Math.max(0, Math.min(cols - 1, Math.floor((x + size / 2) / cellSize))),
                    y: Math.max(0, Math.min(rows - 1, Math.floor((y + size / 2) / cellSize)))
                });
                const toPoint = (cell) => ({
                    x: Math.max(0, Math.min(this.battlefield.offsetWidth - size, cell.x * cellSize + cellSize / 2 - size / 2)),
                    y: Math.max(0, Math.min(this.battlefield.offsetHeight - size, cell.y * cellSize + cellSize / 2 - size / 2))
                });
                const key = (cell) => `${cell.x},${cell.y}`;
                const walkable = (cell) => {
                    if (cell.x < 0 || cell.y < 0 || cell.x >= cols || cell.y >= rows) return false;

                    const point = toPoint(cell);
                    // 掩体边缘扩展半个车身 + 余量, waypoint 离掩体足够远 (不卡 waypoint)
                    return !this.collidesWithObstacle(point.x, point.y, size, size, Math.floor(size / 2) + 2);
                };
                const nearestWalkable = (cell) => {
                    if (walkable(cell)) return cell;

                    for (let radius = 1; radius < 8; radius++) {
                        for (let y = cell.y - radius; y <= cell.y + radius; y++) {
                            for (let x = cell.x - radius; x <= cell.x + radius; x++) {
                                const candidate = { x, y };
                                if (walkable(candidate)) return candidate;
                            }
                        }
                    }

                    return null;
                };

                const start = nearestWalkable(toCell(startX, startY));
                const goal = nearestWalkable(toCell(endX, endY));
                if (!start || !goal) return [];

                const open = [start];
                const cameFrom = new Map();
                const gScore = new Map([[key(start), 0]]);
                const fScore = new Map([[key(start), Math.hypot(goal.x - start.x, goal.y - start.y)]]);
                const closed = new Set();
                const directions = [
                    { x: 1, y: 0, cost: 1 }, { x: -1, y: 0, cost: 1 },
                    { x: 0, y: 1, cost: 1 }, { x: 0, y: -1, cost: 1 },
                    { x: 1, y: 1, cost: 1.4 }, { x: 1, y: -1, cost: 1.4 },
                    { x: -1, y: 1, cost: 1.4 }, { x: -1, y: -1, cost: 1.4 }
                ];

                let iterations = 0;
                while (open.length && iterations++ < 700) {
                    open.sort((a, b) => (fScore.get(key(a)) ?? Infinity) - (fScore.get(key(b)) ?? Infinity));
                    const current = open.shift();
                    const currentKey = key(current);

                    if (current.x === goal.x && current.y === goal.y) {
                        const cells = [current];
                        let traceKey = currentKey;
                        while (cameFrom.has(traceKey)) {
                            const previous = cameFrom.get(traceKey);
                            cells.unshift(previous);
                            traceKey = key(previous);
                        }

                        return this.smoothPath(cells
                            .slice(1)
                            .filter((cell, index) => index % 2 === 0 || cell.x === goal.x && cell.y === goal.y)
                            .map(toPoint));
                    }

                    closed.add(currentKey);

                    for (const direction of directions) {
                        const neighbor = { x: current.x + direction.x, y: current.y + direction.y };
                        const neighborKey = key(neighbor);
                        if (closed.has(neighborKey) || !walkable(neighbor)) continue;

                        if (direction.x !== 0 && direction.y !== 0) {
                            if (!walkable({ x: current.x + direction.x, y: current.y }) || !walkable({ x: current.x, y: current.y + direction.y })) {
                                continue;
                            }
                        }

                        const tentative = (gScore.get(currentKey) ?? Infinity) + direction.cost;
                        if (tentative < (gScore.get(neighborKey) ?? Infinity)) {
                            cameFrom.set(neighborKey, current);
                            gScore.set(neighborKey, tentative);
                            fScore.set(neighborKey, tentative + Math.hypot(goal.x - neighbor.x, goal.y - neighbor.y));
                            if (!open.some(cell => cell.x === neighbor.x && cell.y === neighbor.y)) {
                                open.push(neighbor);
                            }
                        }
                    }
                }

                return [];
            }

            // path 平滑: 合并共线 waypoint (去锯齿, 减少转折点, 履带车更易跟踪)
            smoothPath(points) {
                if (points.length < 3) return points;
                const result = [points[0]];
                for (let i = 1; i < points.length - 1; i++) {
                    const a = result[result.length - 1];
                    const b = points[i];
                    const c = points[i + 1];
                    // 共线检查 (向量叉积 ≈ 0)
                    const cross = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
                    if (Math.abs(cross) < 0.5) continue;
                    result.push(b);
                }
                result.push(points[points.length - 1]);
                return result;
            }

            removeUnit(unit) {
                const index = this.units.indexOf(unit);
                if (index > -1) {
                    this.units.splice(index, 1);
                    if (unit.element) {
                        unit.element.remove();
                    }
                }
            }

            clearAll() {
                this.units.forEach(unit => {
                    if (unit.element) {
                        unit.element.remove();
                    }
                });
                this.projectiles.forEach(projectile => projectile.remove());
                this.obstacles.forEach(obstacle => obstacle.remove());
                this.units = [];
                this.projectiles = [];
                this.obstacles = [];
                this.isBattleActive = false;
                this.isPaused = false;
                // v3.0 重置点值
                this.allyDeployedPoints = 0;
                this.enemyDeployedPoints = 0;
                this.allyLostPoints = 0;
                this.enemyLostPoints = 0;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
                this.updatePointsDisplay();
                // 保留 canvas, 重渲染当前想定地形 + obstacles
                if (this.currentScenario && this.terrainRenderer) {
                    this.terrainRenderer.render();
                    this.loadScenarioObstacles(this.currentScenario);
                }
                // 显示 empty-state (若不存在)
                const hasEmpty = this.battlefield.querySelector('.empty-state');
                if (!hasEmpty) {
                    this.battlefield.insertAdjacentHTML('beforeend',
                        '<div class="empty-state" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; opacity: 0.5; pointer-events: none; z-index: 2;"><p>投放兵力开始战斗</p><p style="font-size: 0.8em; margin-top: 10px;">点击按钮添加兵力</p></div>');
                }
                resetBattleButton();
                logBattle('战场已清空', 'info');
            }

            spawnProjectile(source, target, damage) {
                const projectile = new Projectile(source, target, damage);
                this.projectiles.push(projectile);
                this.battlefield.appendChild(projectile.element);
            }

            spawnScatterProjectile(source, target, scatterX, scatterY, damage) {
                const projectile = new Projectile(source, target, damage);
                projectile.scatterX = scatterX;
                projectile.scatterY = scatterY;
                projectile.splashRadius = 24;
                this.projectiles.push(projectile);
                this.battlefield.appendChild(projectile.element);
            }

            startBattle() {
                if (this.units.length < 2) {
                    alert('至少投放2个兵力！');
                    return;
                }

                this.isBattleActive = true;
                this.isPaused = false;
                this.lastUpdateTime = performance.now();
                this.lastFrameTime = 0; // 重置帧时间
                this.framesThisSecond = 0; // 重置帧计数
                logBattle('战斗开始！', 'info');
                
                this.animationId = requestAnimationFrame((timestamp) => this.gameLoop(timestamp));
            }

            gameLoop(timestamp) {
                if (!this.isBattleActive) return;

                // 初始化帧时间
                if (!this.lastFrameTime) {
                    this.lastFrameTime = timestamp;
                    this.lastFpsUpdate = timestamp; // 初始化FPS计算时间
                    this.animationId = requestAnimationFrame((ts) => this.gameLoop(ts));
                    return;
                }

                // 计算deltaTime
                this.deltaTime = (timestamp - this.lastFrameTime) / 1000; // 转换为秒
                this.lastFrameTime = timestamp;

                // 安全校验：限制deltaTime避免异常情况
                if (this.deltaTime <= 0 || this.deltaTime > this.maxDeltaTime) {
                    this.animationId = requestAnimationFrame((ts) => this.gameLoop(ts));
                    return;
                }

                // 更新FPS计算
                this.framesThisSecond++;
                if (timestamp > this.lastFpsUpdate + 1000) {
                    this.fps = this.framesThisSecond;
                    this.framesThisSecond = 0;
                    this.lastFpsUpdate = timestamp;
                    
                    // 更新显示
                    const fpsElement = document.getElementById('fpsValue');
                    const unitCountElement = document.getElementById('unitCount');
                    
                    if (fpsElement) {
                        fpsElement.textContent = this.fps;
                    }
                    if (unitCountElement) {
                        unitCountElement.textContent = this.units.length;
                    }
                }

                if (!this.isPaused) {
                    this.updateAllUnits();
                    this.updateProjectiles();
                    this.checkBattleEnd();
                }
                if (this.debugPaths) this.renderDebugPaths();
                if (this.synergyShown) this.renderSynergy();

                this.animationId = requestAnimationFrame((ts) => this.gameLoop(ts));
            }

            updateAllUnits() {
                // 更新所有单位
                for (const unit of this.units) {
                    if (!unit.isDead()) {
                        unit.update(this.deltaTime, this.units);
                    }
                }

                // 移除死亡的单位
                this.units = this.units.filter(unit => {
                    if (unit.isDead() && unit.element) {
                        unit.element.remove();
                        // v3.0 累加损失点值
                        if (unit.team === 'ally') this.allyLostPoints += (unit.pointCost || 0);
                        else this.enemyLostPoints += (unit.pointCost || 0);
                        // v3.0 战友阵亡: 附近同阵营单位士气 -8 (传染)
                        for (const u of this.units) {
                            if (u === unit || u.isDead() || u.team !== unit.team) continue;
                            if (u.morale !== undefined && unit.getDistance(u) < 150) {
                                u.morale = Math.max(0, u.morale - 8);
                            }
                        }
                        this.updatePointsDisplay();
                        return false;
                    }
                    return true;
                });
            }

            updateProjectiles() {
                this.projectiles = this.projectiles.filter(projectile => {
                    const active = projectile.update(this.deltaTime);
                    if (!active) {
                        projectile.remove();
                    }
                    return active;
                });
            }

            checkBattleEnd() {
                const allyUnits = this.units.filter(unit => unit.team === 'ally' && !unit.isDead());
                const enemyUnits = this.units.filter(unit => unit.team === 'enemy' && !unit.isDead());
                
                if (allyUnits.length === 0 || enemyUnits.length === 0) {
                    this.endBattle();
                }
            }

            pauseBattle() {
                if (!this.isBattleActive) return;
                
                this.isPaused = !this.isPaused;
                
                if (this.isPaused) {
                    logBattle('战斗暂停', 'info');
                } else {
                    logBattle('战斗继续', 'info');
                }
            }


            endBattle() {
                this.isBattleActive = false;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
                this.projectiles.forEach(projectile => projectile.remove());
                this.projectiles = [];
                resetBattleButton();
                
                const allyUnits = this.units.filter(unit => unit.team === 'ally' && !unit.isDead());
                const enemyUnits = this.units.filter(unit => unit.team === 'enemy' && !unit.isDead());
                
                if (allyUnits.length === 0 && enemyUnits.length === 0) {
                    logBattle('游戏结束：平局', 'info');
                } else if (allyUnits.length === 0) {
                    logBattle('游戏结束：敌军获胜！', 'info');
                } else if (enemyUnits.length === 0) {
                    logBattle('游戏结束：友军获胜！', 'info');
                } else {
                    logBattle('战斗中止', 'info');
                }
                // v3.0 效率评分
                this.computeEfficiency();
            }

            computeEfficiency() {
                const efficiency = this.allyDeployedPoints > 0
                    ? this.enemyDeployedPoints / this.allyDeployedPoints : 0;
                const lossRatio = this.enemyLostPoints > 0
                    ? this.allyLostPoints / this.enemyLostPoints
                    : (this.allyLostPoints === 0 ? 0 : 99);
                const score = efficiency * 0.6 + lossRatio * 0.4;
                let rating = 'D';
                if (score > 1.5) rating = 'S';
                else if (score > 1.2) rating = 'A';
                else if (score > 0.9) rating = 'B';
                else if (score > 0.6) rating = 'C';
                logBattle(`效率评分: ${rating} | 效率比 ${efficiency.toFixed(2)} | 损失比 ${lossRatio.toFixed(2)} | 综合分 ${score.toFixed(2)}`, 'info');
                logBattle(`点值消耗 友军 ${this.allyDeployedPoints} (损失 ${this.allyLostPoints}) / 敌军 ${this.enemyDeployedPoints} (损失 ${this.enemyLostPoints})`, 'info');
            }
        }

        // 全局变量
        const battlefieldManager = new BattlefieldManager();

        // 兵种预置属性：血量由兵种决定，不再由玩家设定
        const UNIT_PRESETS = {
            tank:      { health: 300, pointCost: 30 },
            soldier:   { health: 80,  pointCost: 3 },
            artillery: { health: 90,  pointCost: 24 },
            rocket:    { health: 70,  pointCost: 20 },
            command:   { health: 100, pointCost: 25 },
            supply:    { health: 130, pointCost: 10 },
            engineer:  { health: 40,  pointCost: 4 },
            medic:     { health: 45,  pointCost: 4 },
            antitank:      { health: 50,  pointCost: 6 },
            lightTank:     { health: 200, pointCost: 18 },
            tankDestroyer: { health: 180, pointCost: 22 },
            scout:         { health: 80,  pointCost: 8 },
            apc:           { health: 150, pointCost: 12 },
            mortar:        { health: 70,  pointCost: 14 },
            // 古代兵种
            melee:    { health: 90,  pointCost: 5 },
            archer:   { health: 50,  pointCost: 4 },
            cavalry:  { health: 120, pointCost: 12 },
            catapult: { health: 60,  pointCost: 18 },
            crossbow: { health: 50, pointCost: 5 }
        };

        // 工具函数
        function unitTypeName(type) {
            if (type === 'tank') return '坦克';
            if (type === 'artillery') return '火炮';
            if (type === 'rocket') return '火箭炮';
            if (type === 'command') return '指挥车';
            if (type === 'supply') return '补给车';
            if (type === 'engineer') return '工程兵';
            if (type === 'medic') return '医疗兵';
            if (type === 'antitank') return '反坦克兵';
            if (type === 'lightTank') return '轻型坦克';
            if (type === 'tankDestroyer') return '坦克歼击车';
            if (type === 'scout') return '侦察车';
            if (type === 'apc') return '装甲运兵车';
            if (type === 'mortar') return '迫击炮';
            if (type === 'melee') return '近战步兵';
            if (type === 'archer') return '弓箭手';
            if (type === 'cavalry') return '骑兵';
            if (type === 'catapult') return '投石车';
            if (type === 'crossbow') return '连弩手';
            return '步兵';
        }

        function logBattle(message, type = 'info') {
            const logContent = document.getElementById('battleLog'); // 修改了ID
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContent.appendChild(logEntry);
            logContent.scrollTop = logContent.scrollHeight;
        }

        function addObstacle() {
            const battlefield = document.getElementById('battlefield');
            const sizes = [
                { width: 86, height: 46 },
                { width: 64, height: 64 },
                { width: 118, height: 34 }
            ];
            const size = sizes[Math.floor(Math.random() * sizes.length)];
            const margin = 32;

            for (let attempt = 0; attempt < 60; attempt++) {
                const x = margin + Math.random() * (battlefield.offsetWidth - size.width - margin * 2);
                const y = margin + Math.random() * (battlefield.offsetHeight - size.height - margin * 2);

                if (
                    !battlefieldManager.collidesWithObstacle(x, y, size.width, size.height, 18) &&
                    !battlefieldManager.collidesWithUnit(x, y, size.width, size.height)
                ) {
                    battlefieldManager.addObstacle(new Obstacle(x, y, size.width, size.height));
                    return;
                }
            }

            logBattle('无空间放置掩体', 'info');
        }

        function addUnit(team, type) {
            const health = UNIT_PRESETS[type].health;
            const battlefield = document.getElementById('battlefield');
            let unitSize;
            if (type === 'tank' || type === 'lightTank' || type === 'tankDestroyer') unitSize = 22;
            else if (type === 'artillery' || type === 'rocket' || type === 'mortar' || type === 'catapult') unitSize = 20;
            else if (type === 'command' || type === 'supply' || type === 'scout' || type === 'apc' || type === 'cavalry') unitSize = 18;
            else unitSize = 14;
            const deploymentDepth = Math.min(280, battlefield.offsetWidth * 0.28);
            let x = 0;
            let y = 0;
            let placed = false;

            for (let attempt = 0; attempt < 60; attempt++) {
                x = team === 'ally'
                    ? 30 + Math.random() * deploymentDepth
                    : battlefield.offsetWidth - deploymentDepth - unitSize - 30 + Math.random() * deploymentDepth;
                y = 40 + Math.random() * (battlefield.offsetHeight - unitSize - 80);

                if (
                    !battlefieldManager.collidesWithObstacle(x, y, unitSize, unitSize, 8) &&
                    !battlefieldManager.collidesWithUnit(x, y, unitSize, unitSize)
                ) {
                    placed = true;
                    break;
                }
            }

            if (!placed) {
                logBattle('无空间投放兵力', 'info');
                return;
            }

            let unit;
            if (type === 'tank') {
                unit = new Tank(x, y, team, health);
            } else if (type === 'artillery') {
                unit = new Artillery(x, y, team, health);
            } else if (type === 'rocket') {
                unit = new RocketLauncher(x, y, team, health);
            } else if (type === 'command') {
                unit = new CommandVehicle(x, y, team, health);
            } else if (type === 'supply') {
                unit = new SupplyTruck(x, y, team, health);
            } else if (type === 'engineer') {
                unit = new Engineer(x, y, team, health);
            } else if (type === 'medic') {
                unit = new Medic(x, y, team, health);
            } else if (type === 'antitank') {
                unit = new RocketSoldier(x, y, team, health);
            } else if (type === 'lightTank') {
                unit = new LightTank(x, y, team, health);
            } else if (type === 'tankDestroyer') {
                unit = new TankDestroyer(x, y, team, health);
            } else if (type === 'scout') {
                unit = new ScoutCar(x, y, team, health);
            } else if (type === 'apc') {
                unit = new APC(x, y, team, health);
            } else if (type === 'mortar') {
                unit = new Mortar(x, y, team, health);
            } else if (type === 'melee') {
                unit = new MeleeInfantry(x, y, team, health);
            } else if (type === 'archer') {
                unit = new Archer(x, y, team, health);
            } else if (type === 'cavalry') {
                unit = new Cavalry(x, y, team, health);
            } else if (type === 'catapult') {
                unit = new Catapult(x, y, team, health);
            } else if (type === 'crossbow') {
                unit = new Crossbowman(x, y, team, health);
            } else {
                unit = new Soldier(x, y, team, health);
            }

            battlefieldManager.addUnit(unit);
        }

        function toggleBattle() {
            const battleBtn = document.getElementById('battleBtn');

            if (!battlefieldManager.isBattleActive) {
                if (battlefieldManager.units.length < 2) {
                    alert('至少投放2个兵力！');
                    return;
                }

                battlefieldManager.startBattle();
                battleBtn.textContent = '暂停';
                battleBtn.style.color = '#f1c40f';
                battleBtn.style.borderColor = '#f1c40f';
            } else {
                battlefieldManager.pauseBattle();

                if (battlefieldManager.isPaused) {
                    battleBtn.textContent = '继续';
                    battleBtn.style.color = '#2ecc71';
                    battleBtn.style.borderColor = '#2ecc71';
                } else {
                    battleBtn.textContent = '暂停';
                    battleBtn.style.color = '#f1c40f';
                    battleBtn.style.borderColor = '#f1c40f';
                }
            }
        }

        function clearBattlefield() {
            battlefieldManager.clearAll();
        }

        function switchScenario() {
            const select = document.getElementById('scenarioSelect');
            if (select) battlefieldManager.switchToScenario(select.value);
        }

        function resetBattleButton() {
            const battleBtn = document.getElementById('battleBtn');
            if (!battleBtn) return;

            battleBtn.textContent = '开战';
            battleBtn.style.color = '#f1c40f';
            battleBtn.style.borderColor = '#f1c40f';
        }

        // 移动端触摸优化
        function addMobileOptimizations() {
            if (battlefieldManager.isMobile) {
                // 禁用双击缩放
                document.addEventListener('touchstart', function(e) {
                    if (e.touches.length > 1) {
                        e.preventDefault();
                    }
                }, { passive: false });

                // 禁用页面滚动（仅限战场区域，避免影响日志滚动）
                document.getElementById('battlefield').addEventListener('touchmove', function(e) {
                    e.preventDefault();
                }, { passive: false });

                // 添加触摸反馈
                const battlefield = document.getElementById('battlefield');
                battlefield.addEventListener('touchstart', function(e) {
                    const touch = e.touches[0];
                    const rect = battlefield.getBoundingClientRect();
                    const x = touch.clientX - rect.left;
                    const y = touch.clientY - rect.top;
                    
                    // 创建触摸反馈效果
                    const feedback = document.createElement('div');
                    feedback.style.cssText = `
                        position: absolute;
                        left: ${x - 10}px;
                        top: ${y - 10}px;
                        width: 20px;
                        height: 20px;
                        background: rgba(255, 255, 255, 0.5);
                        border-radius: 50%;
                        pointer-events: none;
                        animation: touchFeedback 0.3s ease-out forwards;
                    `;
                    
                    battlefield.appendChild(feedback);
                    
                    setTimeout(() => {
                        feedback.remove();
                    }, 300);
                });
            }
        }

        // 添加触摸反馈动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes touchFeedback {
                0% {
                    transform: scale(0);
                    opacity: 1;
                }
                100% {
                    transform: scale(2);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            logBattle('系统就绪', 'info');
            addMobileOptimizations();
            // v3.0 加载默认想定 (斯大林格勒保卫战 PVE)
            battlefieldManager.loadScenario('stalingrad');
            // debug 路线开关 (按 D 键) + 协同链开关 (按 S 键)
            document.addEventListener('keydown', function(e) {
                if (e.key === 'd' || e.key === 'D') battlefieldManager.toggleDebugPaths();
                if (e.key === 's' || e.key === 'S') battlefieldManager.toggleSynergy();
            });
            const lastModifiedSpan = document.getElementById('lastModified');
            if (lastModifiedSpan) {
                lastModifiedSpan.textContent = document.lastModified;
            }
        });
    </script>
