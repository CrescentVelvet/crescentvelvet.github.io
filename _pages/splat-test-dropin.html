<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>dropin probe</title>
<style>body { margin:0; background:#222233; overflow:hidden; }</style>
<script>
const ver = new URLSearchParams(location.search).get('ver') || 'r185';
const threeUrl = ver === 'r160' ? '/assets/splat-test/three160.module.js' : '/assets/splat-vendor/three.module.js';
const im = document.createElement('script');
im.type = 'importmap';
im.textContent = JSON.stringify({
    imports: { 'three': threeUrl, '@mkkellogg/gaussian-splats-3d': '/assets/splat-vendor/gaussian-splats-3d.module.js' }
});
document.head.appendChild(im);
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { DropInViewer, OrbitControls, SceneFormat } from '@mkkellogg/gaussian-splats-3d';

// ===== 1:1 复刻 splat-compare.html 的 DropInViewer 路径 =====
const src = new URLSearchParams(location.search).get('src') || '/assets/splat-test/synth.ply';
const isBlob = new URLSearchParams(location.search).get('blob') === '1';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x222233, 1);
renderer.setSize(900, 640, false);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(65, 900/640, 0.1, 500);
camera.position.set(2, 2, 3);
camera.up.set(0, 1, 0);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const splatGroup = new DropInViewer({
    gpuAcceleratedSort: true,
    halfPrecisionCovariancesOnGPU: true,
    sharedMemoryForWorkers: false,
    integerBasedSort: true,
    dynamicScene: false,
    webXRMode: 0
});
const scene = new THREE.Scene();
scene.add(splatGroup);

let url = src;
if (isBlob) {
    // 复刻 blob URL 路径
    const resp = await fetch(src);
    const blob = await resp.blob();
    url = URL.createObjectURL(new Blob([await blob.arrayBuffer()], { type: 'application/octet-stream' }));
    console.log('[dropin] using blob url:', url.slice(0, 50));
}

console.log('[dropin] 开始 addSplatScene');
await splatGroup.addSplatScene(url, {
    splatAlphaRemovalThreshold: 1,
    showLoadingUI: false,
    format: SceneFormat.Ply,
    position: [0, 0, 0],
    rotation: [0, 0, 0, 1],
    scale: [1, 1, 1],
    progressiveLoad: false
});
console.log('[dropin] addSplatScene 完成');

// 复刻 splat-compare 的 scene0.position 操作
const splatMesh = splatGroup.viewer.getSplatMesh();
const scene0 = splatMesh.getScene(0);
const splatBuffer = scene0.splatBuffer;
const sceneCenter = splatBuffer.sceneCenter.clone();
console.log('[dropin] sceneCenter=', sceneCenter.x, sceneCenter.y, sceneCenter.z);
scene0.position.copy(sceneCenter).multiplyScalar(-1);
scene0.scale.set(1, 1, 1);
scene0.updateMatrix();

window.__dropinViewer = splatGroup.viewer;
window.__splatGroup = splatGroup;

// 渲染循环（同 splat-compare）
let frame = 0;
function tick() {
    requestAnimationFrame(tick);
    controls.update();
    renderer.render(scene, camera);
    frame++;
    if (frame === 2 || frame === 60) {
        const gl = renderer.getContext();
        const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
        const px = new Uint8Array(4 * 400);
        let idx = 0, nonBg = 0;
        for (let y = 0; y < 20; y++) {
            for (let x = 0; x < 20; x++) {
                const rx = Math.floor(x / 20 * w), ry = Math.floor(y / 20 * h);
                gl.readPixels(rx, ry, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px, idx * 4);
                const rr = px[idx*4], gg = px[idx*4+1], bb = px[idx*4+2];
                if (Math.abs(rr-34) > 25 || Math.abs(gg-34) > 25 || Math.abs(bb-51) > 25) nonBg++;
                idx++;
            }
        }
        console.log('[dropin] frame', frame, 'nonBg/400=', nonBg,
            'splatCount=', splatMesh.getSplatCount(),
            'splatGroup.children=', splatGroup.children.map(c => c.type).join(','),
            'splatMesh.visible=', splatMesh.visible,
            'splatRenderReady=', splatGroup.viewer.splatRenderReady);
    }
}
tick();
window.__running = true;
</script>
</body>
</html>
