<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Splat 渍染版本 A/B 测试</title>
<style>
body { background:#111; color:#ddd; font-family: monospace; margin: 0; padding: 10px; }
button { padding: 8px 16px; final margin: 4px; cursor: pointer; }
#cwrap { width: 800px; height: 500px; border: 1px solid #444; margin-top: 8px; }
#log { white-space: pre-wrap; color: #8f8; margin-top: 8px; max-height: 200px; overflow-y: auto; }
canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
    "three": "/assets/splat-vendor/three.module.js",
    "@mkkellogg/gaussian-splats-3d": "/assets/splat-vendor/gaussian-splats-3d.module.js"
} }
</script>
</head>
<body>
<h3>Splat 渲染版本 A/B 测试（合成 PLY）</h3>
<div>
版本：
<label><input type="radio" name="ver" value="r185" checked> r185 (vendor)</label>
<label><input type="radio" name="ver" value="r160"> r160 (0.4.7 官方锁定)</label>
<button id="btn-run">加载并渲染</button>
<button id="btn-clear">清空</button>
</div>
<div id="cwrap"></div>
<div id="log"></div>

<script type="module">
const logEl = document.getElementById('log');
function log(msg) { logEl.textContent += msg + "\n"; logEl.scrollTop = logEl.scrollHeight; }
log('点击「加载并渲染」在 iframe 中运行指定版本的 inner 测试页。');
document.getElementById('btn-run').onclick = () => {
    const ver = document.querySelector('input[name=ver]:checked').value;
    document.getElementById('cwrap').innerHTML =
        `<iframe src="/splat-test/inner/?ver=${ver}" style="width:100%;height:100%;border:0"></iframe>`;
    log('已加载 ' + ver + ' inner 测试页');
};
document.getElementById('btn-clear').onclick = () => {
    document.getElementById('cwrap').innerHTML = '';
    logEl.textContent = '';
};
</script>
</body>
</html>
