        let explosions = []; // 爆炸效果数组
        let healthPowerUps = []; // 绿色方块数组（生命奖励）
        let shootingPowerUps = []; // 金色方块数组（射击奖励）
        let invinciblePowerUps = []; // 蓝色方块数组（无敌奖励）
        let healthPowerUpsTimeInterval = 23; // 每23个敌人生成一个绿色方块
        let shootingPowerUpsTimeInterval = 13; // 每13个敌人生成一个金色方块
        let invinciblePowerUpsTimeInterval = 17; // 每17个敌人生成一个蓝色方块
        let enemyMaxLevel = 100; // 最大敌机等级
        let lastEnemyTime = 0; // 上次生成敌机的时间
        let enemyInterval = 1000; // 初始敌机生成间隔（毫秒）
        // 难度动态调整参数
        let minEnemyInterval = 350; // 最快生成间隔
        let enemyIntervalDecay = 0.995; // 每帧递减
        let minEnemySpeed = 1.2; // 敌机最小速度
        let maxEnemySpeed = 4.5; // 敌机最大速度
        // 敌机体型: 亚线性增长 + 封顶, 防止后期铺满屏幕
        // size = min(75, 30 + 8 * sqrt(level-1))  调 8=增长快慢, 75=封顶
        const maxEnemySize = 75;
        const enemySizeGrowth = 8;
        function enemySizeForLevel(level) {
            return Math.min(maxEnemySize, 30 + enemySizeGrowth * Math.sqrt(Math.max(0, level - 1)));
        }

        // 子弹数组
        let bullets = [];
        let bulletSpeed = 7; // let: 升级可重算

        // 敌机数组
        let enemies = [];
        const enemySpeed = 3;

        let stars = [];

        // 星星对象的构造函数
        function Star(x, y, size) {
            this.x = x;
            this.y = y;
            this.size = size;
            this.life = Math.random() * 5 + 3; // 3-8秒的生命周期
            this.age = 0;
            this.twinkleSpeed = Math.random() * 5 + 3; // 随机闪烁速度
            this.twinklePhase = Math.random() * Math.PI * 2; // 随机初始相位
        }

        // 绘制星星背景
        function drawStars(deltaTime) { // 确保接收 deltaTime 参数
            const starCount = 100;
            const gridX = 10;
            const gridY = 10;
            const cellWidth = canvas.width / gridX;
            const cellHeight = canvas.height / gridY;
            const starsPerCell = Math.ceil(starCount / (gridX * gridY));
            
            // 更新现有星星
            stars = stars.filter(star => {
                // star.age += 1/60; // 假设60fps
                star.age += deltaTime; // <--- 修改为这行
                if (star.age >= star.life) return false;
                
                // 计算星星的亮度
                let lifePhase = star.age / star.life;
                let twinkle = Math.sin(gameTime * star.twinkleSpeed + star.twinklePhase);
                let fadeIn = Math.min(1, star.age * 2); // 0.5秒淡入
                let fadeOut = Math.min(1, (star.life - star.age) * 2); // 0.5秒淡出
                let alpha = (0.3 + twinkle * 0.3) * fadeIn * fadeOut;
                
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                return true;
            });
            
            // 在每个网格中生成新星星
            for (let gx = 0; gx < gridX; gx++) {
                for (let gy = 0; gy < gridY; gy++) {
                    const currentStarsInCell = stars.filter(star => 
                        star.x >= gx * cellWidth && star.x < (gx + 1) * cellWidth &&
                        star.y >= gy * cellHeight && star.y < (gy + 1) * cellHeight
                    ).length;
                    
                    // 如果当前网格中的星星数量少于目标数量，添加新星星
                    if (currentStarsInCell < starsPerCell && Math.random() < 0.1) { // 10%概率生成新星星
                        const x = gx * cellWidth + Math.random() * cellWidth;
                        const y = gy * cellHeight + Math.random() * cellHeight;
                        const size = 1 + Math.random() * 2;
                        stars.push(new Star(x, y, size));
                    }
                }
            }
        }

        // 绘制星形（用于金色方块）
        function drawStar(cx, cy, radius, spikes) {
            let rot = Math.PI / 2 * 3;
            let step = Math.PI / spikes;
            
            ctx.beginPath();
            ctx.moveTo(cx, cy - radius);
            
            for (let i = 0; i < spikes; i++) {
                ctx.lineTo(
                    cx + Math.cos(rot) * radius,
                    cy + Math.sin(rot) * radius
                );
                rot += step;
                
                ctx.lineTo(
                    cx + Math.cos(rot) * radius * 0.4,
                    cy + Math.sin(rot) * radius * 0.4
                );
                rot += step;
            }
            
            ctx.lineTo(cx, cy - radius);
            ctx.closePath();
            ctx.fill();
        }

        // 绘制盾牌形状（用于无敌奖励）
        function drawShield(cx, cy, radius) {
            ctx.beginPath();
            ctx.moveTo(cx, cy - radius);
            ctx.quadraticCurveTo(
                cx + radius, cy - radius * 0.8,
                cx + radius, cy
            );
            ctx.quadraticCurveTo(
                cx + radius, cy + radius,
                cx, cy + radius
            );
            ctx.quadraticCurveTo(
                cx - radius, cy + radius,
                cx - radius, cy
            );
            ctx.quadraticCurveTo(
                cx - radius, cy - radius * 0.8,
                cx, cy - radius
            );
            ctx.closePath();
            ctx.fill();
            
            // 添加盾牌内部细节
            ctx.beginPath();
            ctx.moveTo(cx, cy - radius * 0.4);
            ctx.lineTo(cx, cy + radius * 0.4);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(cx - radius * 0.4, cy);
            ctx.lineTo(cx + radius * 0.4, cy);
            ctx.stroke();
        }

        // 创建敌机
        function createEnemy() {
            // 每隔一段时间或达到一定条件生成敌机
            if (Date.now() - lastEnemyTime > enemyInterval) {
                lastEnemyTime = Date.now();
                
                // 根据游戏时间动态调整敌机等级，最大等级enemyMaxLevel是100级，每10秒增加1级，基础等级为1
                const level = Math.min(enemyMaxLevel, 1 + Math.floor(gameTime / 10)); 

                // 根据等级设置敌机属性
                const enemyWidth = enemySizeForLevel(level); // 等级越高体积越大(亚线性+封顶)
                const enemyHeight = enemySizeForLevel(level);
                // 敌机速度随时间递增，难度平滑提升
                let baseSpeed = Math.max(minEnemySpeed, maxEnemySpeed - (level - 1) * 0.18 - gameTime * 0.01);
                baseSpeed = Math.max(minEnemySpeed, Math.min(maxEnemySpeed, baseSpeed));
                const enemySpeed = baseSpeed;
                
                enemies.push({
                    x: Math.random() * (canvas.width - enemyWidth),
                    y: -enemyHeight,
                    width: enemyWidth,
                    height: enemyHeight,
                    level: level, // 敌机等级
                    spawnLevel: level, // 生成时等级(用于计算经验)
                    speed: enemySpeed, // 敌机速度
                    originalSpeed: enemySpeed, // 记录原始速度
                    vx: (Math.random() - 0.5) * 2, // 随机左右速度，范围在 -1 到 1 之间
                    hitTime: 0 // 记录被击中的时间
                });
                enemyCounter++; // 每创建一个敌人就计数
                // 难度递增：每生成一个敌人，生成间隔略微减少
                enemyInterval = Math.max(minEnemyInterval, enemyInterval * enemyIntervalDecay);
            }
        }

        // 更新敌机位置
        function updateEnemies(deltaTime) { // 添加 deltaTime 参数
            enemies = enemies.filter(enemy => {
                // 速度恢复逻辑：被击中后1秒内逐渐恢复到原始速度
                if (enemy.hitTime > 0) {
                    const timeSinceHit = Date.now() - enemy.hitTime;
                    const recoveryTime = 1000; // 1秒恢复时间
                    
                    if (timeSinceHit < recoveryTime) {
                        // 线性插值恢复速度
                        const progress = timeSinceHit / recoveryTime;
                        enemy.speed = enemy.speed + (enemy.originalSpeed - enemy.speed) * progress * 0.1;
                    } else {
                        // 完全恢复
                        enemy.speed = enemy.originalSpeed;
                        enemy.hitTime = 0;
                    }
                }

                enemy.y += enemy.speed * deltaTime * 60; // 垂直移动乘以 deltaTime
                enemy.x += enemy.vx * deltaTime * 60; // 水平移动乘以 deltaTime

                // 左右墙壁反弹
                if (enemy.x <= 0 || enemy.x + enemy.width >= canvas.width) {
                    enemy.vx *= -1; // 反转水平方向
                }

                // // 顶部墙壁反弹 (如果需要，通常敌机不会向上反弹)
                // if (enemy.y <= -100) { // 这里设置为 -10 以确保敌机不会留在空中下不来
                //     enemy.speed *= -1; // 反转垂直方向
                // }

                return enemy.y < canvas.height; // 移除超出屏幕底部的敌机
            });


            // 敌机之间的碰撞检测
            for (let i = 0; i < enemies.length; i++) {
                for (let j = i + 1; j < enemies.length; j++) {
                    const enemy1 = enemies[i];
                    const enemy2 = enemies[j];
                    
                    // 检测碰撞
                    if (enemy1.x < enemy2.x + enemy2.width &&
                        enemy1.x + enemy1.width > enemy2.x &&
                        enemy1.y < enemy2.y + enemy2.height &&
                        enemy1.y + enemy1.height > enemy2.y) {
                        
                        // 简单的弹性碰撞：交换水平速度
                        const tempVx = enemy1.vx;
                        enemy1.vx = enemy2.vx * 0.8; // 添加一些能量损失
                        enemy2.vx = tempVx * 0.8;
                        
                        // 分离重叠的敌机
                        const overlapX = (enemy1.x + enemy1.width/2) - (enemy2.x + enemy2.width/2);
                        const overlapY = (enemy1.y + enemy1.height/2) - (enemy2.y + enemy2.height/2);
                        
                        if (Math.abs(overlapX) > Math.abs(overlapY)) {
                            // 水平分离
                            if (overlapX > 0) {
                                enemy1.x += 2;
                                enemy2.x -= 2;
                            } else {
                                enemy1.x -= 2;
                                enemy2.x += 2;
                            }
                        } else {
                            // 垂直分离
                            if (overlapY > 0) {
                                enemy1.y += 2;
                                enemy2.y -= 2;
                            } else {
                                enemy1.y -= 2;
                                enemy2.y += 2;
                            }
                        }
                    }
                }
            }

        }

        // 碰撞检测
        function checkCollisions() {

            // 辅助函数：处理敌机被击中时的逻辑
            function handleEnemyDamage(enemy, bullet) { // bullet is now an optional parameter
                // 降低敌机等级 (按子弹伤害; 玩家撞击为 1)
                let dmg = (bullet && bullet.damage) ? bullet.damage : 1;
                if (bullet && bullet.crit && Math.random() < 0.15 * bullet.crit) dmg *= 2; // 暴击双倍
                enemy.level -= dmg;
                
                // 更新敌机体积和速度
                enemy.width = enemySizeForLevel(enemy.level);
                enemy.height = enemySizeForLevel(enemy.level);

                // enemy.speed = Math.max(-0.5, 4 - (enemy.level - 1)); // 速度上限为4，下限为-0.5，避免被子弹撞得下不来
                // 确保速度始终为正，并设置最小下落速度，避免向上飞出屏幕
                const baseSpeed = 4;
                const speedReductionPerLevel = 0.2; // 每级降低的速度
                const minFallSpeed = 0.5; // 最小下落速度
                const newOriginalSpeed = Math.max(minFallSpeed, baseSpeed - (enemy.level - 1) * speedReductionPerLevel);
                enemy.originalSpeed = newOriginalSpeed;

                // 如果敌机碰到顶部并且向上移动，则反弹
                if (enemy.y < 0 && enemy.speed < 0) { // 检查是否在顶部且向上移动
                    enemy.speed = Math.abs(enemy.speed) * 0.5; // 反弹并减速
                }

                // 子弹击中敌机时，给敌机一个短暂的向上阻碍
                if (bullet) {
                    const impulseStrength = 3; // 减小冲量强度
                    enemy.speed = -impulseStrength; // 短暂向上
                    enemy.hitTime = Date.now(); // 记录被击中时间
                    
                    // 稍微影响水平速度
                    if (typeof bullet.vx !== 'undefined') {
                        enemy.vx += bullet.vx * 0.05;
                    }
                }

                // 根据敌机等级计算颜色，与drawEnemy函数中的逻辑保持一致
                const hue = (enemy.level * 20) % 360;
                const saturation = 80;
                const lightness = 50;
                const enemyColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                
                // 创建小爆炸效果
                createExplosion(
                    enemy.x + enemy.width / 2,
                    enemy.y + enemy.height / 2,
                    enemy.width,
                    enemyColor // 使用敌机颜色
                );
                
                // 如果敌机等级降为0，则移除敌机并增加分数
                if (enemy.level <= 0) {
                    // 创建大爆炸效果
                    createExplosion(
                        enemy.x + enemy.width / 2,
                        enemy.y + enemy.height / 2,
                        enemy.width * 2,
                        enemyColor // 使用敌机颜色
                    );
                    
                    // 移除被击中的敌机
                    enemy.dead = true; // 标记死亡, 统一在 checkCollisions 末尾过滤(避免 splice 扰乱循环)

                    // 不管是不是子弹击中，都增加分数和击杀数
                    score += 100;
                    kills++;
                    scoreElement.textContent = score;
                    killsElement.textContent = kills;
                    gainXP(5 + (enemy.spawnLevel || 1) * 3); // 肉鸽: 击杀经验
                }
            }

            // 子弹击中敌机
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                if (!bullet.hits) bullet.hits = new Set();
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (enemy.dead) continue;
                    if (bullet.x < enemy.x + enemy.width &&
                        bullet.x + bullet.width > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + bullet.height > enemy.y) {

                        // 同一颗子弹不重复命中同一敌机 (穿透时关键)
                        if (bullet.hits.has(enemy)) continue;
                        bullet.hits.add(enemy);

                        handleEnemyDamage(enemy, bullet);
                        if (bullet.split > 0) spawnSplitFragments(bullet);

                        // 穿透: 还有次数则继续, 否则消亡
                        if (bullet.pierce > 0) {
                            bullet.pierce--;
                            continue; // 同帧可能再命中下一敌机
                        } else {
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            // 玩家碰到绿色方块（生命奖励）
            healthPowerUps.forEach((powerUp, index) => {
                if (
                    player.x < powerUp.x + powerUp.width &&
                    player.x + player.width > powerUp.x &&
                    player.y < powerUp.y + powerUp.height &&
                    player.y + player.height > powerUp.y
                ) {
                    healthPowerUps.splice(index, 1); // 移除道具
                    if (lives < maxLives) { // 生命值上限为 maxLives
                        lives++;
                        livesElement.textContent = lives;
                    }
                }
            });

            // 玩家碰到金色方块（射击奖励）
            shootingPowerUps.forEach((powerUp, index) => {
                if (player.x < powerUp.x + powerUp.width &&
                    player.x + player.width > powerUp.x &&
                    player.y < powerUp.y + powerUp.height &&
                    player.y + player.height > powerUp.y) {
                    // 移除金色方块
                    shootingPowerUps.splice(index, 1);
                    // 激活特殊能力
                    shootingPowerUpActive = true;
                    shootingPowerUpTimeLeft = shootingPowerUpDuration; // 5秒特殊能力时间
                }
            });

            // 玩家碰到蓝色方块（无敌奖励）
            invinciblePowerUps.forEach((powerUp, index) => {
                if (player.x < powerUp.x + powerUp.width &&
                    player.x + player.width > powerUp.x &&
                    player.y < powerUp.y + powerUp.height &&
                    player.y + player.height > powerUp.y) {
                    // 移除蓝色方块
                    invinciblePowerUps.splice(index, 1);
                    // 激活无敌特殊能力
                    invinciblePowerUpActive = true;
                    invinciblePowerUpTimeLeft = invinciblePowerUpDuration; // 3秒无敌时间
                    player.invincible = true; // 设置玩家为无敌状态
                }
            });

            // 敌机撞击玩家
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                if (enemy.dead) continue;
                if (player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y) {
                    
                    handleEnemyDamage(enemy); // 调用辅助函数处理敌机伤害，不用传入子弹颜色
                    
                    // 只有在非无敌状态下才受到伤害
                    if (!player.invincible) {
                        lives--;
                        livesElement.textContent = lives;
                        if (lives <= 0) {
                            gameOver = true;
                        } else {
                            // 设置无敌状态
                            player.invincible = true;
                            setTimeout(() => {
                                player.invincible = false;
                            }, player.invincibleTime);
                        }
                    }
                }
            }
            // 统一清除本帧标记为死亡的敌机 (穿透/分裂不再即时 splice, 避免扰乱循环)
            enemies = enemies.filter(e => !e.dead);
        }

        // 创建绿色方块（生命奖励）
        function createHealthPowerUp() {
            // 只在enemyCounter是23的倍数，且大于0时创建一个绿色方块
            if (enemyCounter % healthPowerUpsTimeInterval === 0 && enemyCounter > 0 && healthPowerUps.length === 0) {
                healthPowerUps.push({
                    x: Math.random() * (canvas.width - 20),
                    y: -20,
                    width: 20,
                    height: 20,
                    speed: 2
                });
            }
        }

        // 创建金色方块（射击奖励）
        function createShootingPowerUp() {
            // 只在enemyCounter是11的倍数，且大于0时创建一个金色方块
            if (enemyCounter % shootingPowerUpsTimeInterval === 0 && enemyCounter > 0 && shootingPowerUps.length === 0) {
                shootingPowerUps.push({
                    x: Math.random() * (canvas.width - 20),
                    y: -20,
                    width: 20,
                    height: 20,
                    speed: 2
                });
            }
        }

        // 创建蓝色方块（无敌奖励）
        function createInvinciblePowerUp() {
            // 只在enemyCounter是17的倍数，且大于0时创建一个蓝色方块
            if (enemyCounter % invinciblePowerUpsTimeInterval === 0 && enemyCounter > 0 && invinciblePowerUps.length === 0) {
                invinciblePowerUps.push({
                    x: Math.random() * (canvas.width - 20),
                    y: -20,
                    width: 20,
                    height: 20,
                    speed: 2
                });
            }
        }

        // 更新绿色方块位置
        // 道具吸附 (被动 pickup 范围内把道具拉向玩家)
        function applyPickupMagnet(pu) {
            if (pickupRange <= 0) return;
            const pcx = player.x + player.width / 2, pcy = player.y + player.height / 2;
            const cx = pu.x + pu.width / 2, cy = pu.y + pu.height / 2;
            const dx = pcx - cx, dy = pcy - cy;
            const d = Math.hypot(dx, dy) || 1;
            if (d < pickupRange) {
                const pull = 4;
                pu.x += (dx / d) * pull;
                pu.y += (dy / d) * pull;
            }
        }

        function updateHealthPowerUps(deltaTime) {
            healthPowerUps = healthPowerUps.filter(powerUp => {
                powerUp.y += powerUp.speed * deltaTime * 60;
                applyPickupMagnet(powerUp);
                return powerUp.y < canvas.height;
            });
        }

        // 更新金色方块位置
        function updateShootingPowerUp(deltaTime) {
            shootingPowerUps = shootingPowerUps.filter(powerUp => {
                powerUp.y += powerUp.speed  * deltaTime * 60;
                applyPickupMagnet(powerUp);
                return powerUp.y < canvas.height;
            });

            // 更新特殊能力时间
            if (shootingPowerUpActive) {
                shootingPowerUpTimeLeft = Math.max(0, shootingPowerUpTimeLeft - deltaTime * 1000); // 假设60fps，约16ms每帧
                if (shootingPowerUpTimeLeft <= 0) {
                    shootingPowerUpActive = false;
                }
            }
        }

        // 更新蓝色方块位置
        function updateInvinciblePowerUps(deltaTime) {
            invinciblePowerUps = invinciblePowerUps.filter(powerUp => {
                powerUp.y += powerUp.speed * deltaTime * 60;
                applyPickupMagnet(powerUp);
                return powerUp.y < canvas.height;
            });
        
            // 更新无敌特殊能力时间
            if (invinciblePowerUpActive) {
                invinciblePowerUpTimeLeft = Math.max(0, invinciblePowerUpTimeLeft - deltaTime * 1000); // 假设60fps，约16ms每帧
                if (invinciblePowerUpTimeLeft <= 0) {
                    invinciblePowerUpActive = false;
                    player.invincible = false; // 无敌状态结束
                }
            }
        }

        // 玩家飞机
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            width: 40,
            height: 40,
            speed: 5,
            vx: 0, // Added for touch movement
            vy: 0, // Added for touch movement
            invincible: false,
            invincibleTime: 2000 // 无敌时间2秒
        };

        // 按键状态
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            ArrowUp: false,
            ArrowDown: false,
            Space: false,
            KeyA: false,
            KeyD: false,
            KeyW: false,
            KeyS: false
        };

        // 监听键盘事件
        document.addEventListener('keydown', (e) => {
            // G 键: 切换图鉴
            if (e.code === 'KeyG') { toggleCodex(); return; }
            // 图鉴打开期间: Esc 关闭, 屏蔽其余按键
            if (codexOpen) {
                if (e.code === 'Escape') closeCodex();
                return;
            }
            // 升级选择期间: 1/2/3 选卡, 屏蔽其余按键
            if (awaitingUpgrade) {
                if (e.code === 'Digit1' || e.code === 'Numpad1') pickUpgrade(0);
                else if (e.code === 'Digit2' || e.code === 'Numpad2') pickUpgrade(1);
                else if (e.code === 'Digit3' || e.code === 'Numpad3') pickUpgrade(2);
                return;
            }
            if (e.code in keys) {
                keys[e.code] = true;

                // 空格键用于暂停/继续游戏
                if (e.code === 'Space' && !gameOver) {
                    gamePaused = !gamePaused;

                    // 如果继续游戏，更新开始时间以避免时间跳跃
                    if (!gamePaused) {
                        const pauseDuration = Date.now() - pauseStartTime;
                        startTime += pauseDuration;
                    } else {
                        pauseStartTime = Date.now();
                    }
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code in keys) {
                keys[e.code] = false;
            }
        });

        // 更新玩家位置
        function updatePlayer(deltaTime) {
            // 键盘控制
            if (keys.ArrowLeft) {
                player.x -= player.speed * deltaTime * 60;
            }
            if (keys.ArrowRight) {
                player.x += player.speed * deltaTime * 60;
            }
            if (keys.ArrowUp) {
                player.y -= player.speed * deltaTime * 60;
            }
            if (keys.ArrowDown) {
                player.y += player.speed * deltaTime * 60;
            }

            // 触摸控制
            player.x += player.vx * deltaTime * 60; // player.vx 是由 touchmove 设置的
            player.y += player.vy * deltaTime * 60; // player.vy 是由 touchmove 设置的

            // 防止玩家出界
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
        }

        // 创建子弹: 已由 fireWeapons() 接管 (见 P2 武器系统)

        // 更新子弹位置
        function updateBullets(deltaTime) {
            bullets = bullets.filter(bullet => {
                // 片段生命期 (分裂产物)
                if (bullet.life !== undefined) {
                    bullet.life -= deltaTime;
                    if (bullet.life <= 0) return false;
                }
                // 追踪: 朝最近敌机转向 (转向强度随等级)
                if (bullet.homing > 0) {
                    const target = findNearestEnemy(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2);
                    if (target) {
                        const tx = target.x + target.width / 2 - (bullet.x + bullet.width / 2);
                        const ty = target.y + target.height / 2 - (bullet.y + bullet.height / 2);
                        const d = Math.hypot(tx, ty) || 1;
                        let vx = bullet.vx || 0;
                        let vy = (bullet.vy !== undefined) ? bullet.vy : -bulletSpeed;
                        const speed = Math.hypot(vx, vy) || bulletSpeed;
                        const steer = 0.08 + 0.04 * bullet.homing;
                        vx += (tx / d) * speed * steer;
                        vy += (ty / d) * speed * steer;
                        const ns = Math.hypot(vx, vy) || 1;
                        bullet.vx = vx / ns * speed;
                        bullet.vy = vy / ns * speed;
                    }
                }
                const vx = bullet.vx || 0;
                const vy = (bullet.vy !== undefined) ? bullet.vy : -bulletSpeed;
                bullet.x += vx * deltaTime * 60;
                bullet.y += vy * deltaTime * 60;
                // 折射: 撞侧墙反弹 (仅左右, 避免子弹向下飞)
                if (bullet.bounce > 0) {
                    if (bullet.x <= 0) { bullet.x = 0; bullet.vx = Math.abs(vx); bullet.bounce--; }
                    else if (bullet.x + bullet.width >= canvas.width) {
                        bullet.x = canvas.width - bullet.width; bullet.vx = -Math.abs(vx); bullet.bounce--;
                    }
                }
                // 子弹在画布范围内才保留 (含侧炮横向飞出)
                return bullet.y > -20 && bullet.x > -20 && bullet.x < canvas.width + 20;
            });
        }

        // 在draw函数中更新子弹绘制，要提前加载小爱心图片
        let heartImage = new Image();
        let heartImageLoaded = false;
        heartImage.src = 'images/heart.png'; // 请确保图像路径正确
        heartImage.onload = () => {
            heartImageLoaded = true;
        };

        // ===== 像素艺术系统 =====

        // 玩家飞机精灵 (16x16 像素网格) - 战斗机造型
        // 机头朝上：尖锐机头 + 后掠主翼 + 尾翼 + 双引擎 + 座舱
        const PLAYER_SPRITE = [
            '         #          ',
            '        ###         ',
            '       W###W        ',
            '      WW#C#WW       ',
            '        ###         ',
            '       ##C##        ',
            '      ##CCC##       ',
            '     ##CCCCC##      ',
            '  W##############W  ',
            'WW################WW',
            '  W##  #####  ##W   ',
            '        ###         ',
            '       # # #        ',
            '       # E #        ',
            '       ## ##        ',
            '        EEE         ',
        ];

        const PLAYER_PALETTE = {
            '#': '#7a8a9a',  // 机身
            'C': '#4dc9f6',  // 座舱
            'E': '#ff6622',  // 引擎
            'W': '#3a4a5a',  // 机翼深色（后掠翼边缘）
        };

        // 敌机精灵 (10x11 像素网格) - 菱形
        const ENEMY_SPRITE = [
            '    11    ',
            '   1221   ',
            '  123321  ',
            ' 12333321 ',
            '1233333321',
            '1233333321',
            ' 12333321 ',
            ' 12333321 ',
            '  123321  ',
            '   1221   ',
            '    11    ',
        ];

        // 通用像素精灵绘制函数
        function drawPixelSprite(sprite, x, y, width, height, palette) {
            const rows = sprite.length;
            const cols = sprite[0].length;
            const pixelW = width / cols;
            const pixelH = height / rows;

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const ch = sprite[row][col];
                    if (ch === ' ') continue;

                    ctx.fillStyle = palette[ch] || '#fff';
                    ctx.fillRect(
                        Math.round(x + col * pixelW),
                        Math.round(y + row * pixelH),
                        Math.ceil(pixelW),
                        Math.ceil(pixelH)
                    );
                }
            }
        }

        // 绘制玩家飞机 (像素风格)
        function drawPlayer() {
            drawPixelSprite(PLAYER_SPRITE, player.x, player.y, player.width, player.height, PLAYER_PALETTE);

            // 引擎火焰 (双发喷流，匹配战斗机双引擎)
            const flameHeight = 8 + Math.random() * 5;
            const flameGradient = ctx.createLinearGradient(
                player.x + player.width / 2, player.y + player.height * 0.95,
                player.x + player.width / 2, player.y + player.height + flameHeight
            );
            flameGradient.addColorStop(0, '#ffff00');
            flameGradient.addColorStop(0.4, '#ff9900');
            flameGradient.addColorStop(1, 'rgba(255, 0, 0, 0)');

            ctx.fillStyle = flameGradient;
            // 左引擎火焰
            ctx.beginPath();
            ctx.moveTo(player.x + player.width * 0.40, player.y + player.height * 0.96);
            ctx.lineTo(player.x + player.width * 0.46, player.y + player.height + flameHeight);
            ctx.lineTo(player.x + player.width * 0.52, player.y + player.height * 0.96);
            ctx.closePath();
            ctx.fill();
            // 右引擎火焰
            ctx.beginPath();
            ctx.moveTo(player.x + player.width * 0.48, player.y + player.height * 0.96);
            ctx.lineTo(player.x + player.width * 0.54, player.y + player.height + flameHeight);
            ctx.lineTo(player.x + player.width * 0.60, player.y + player.height * 0.96);
            ctx.closePath();
            ctx.fill();

            // 无敌状态光效
            if (player.invincible) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(player.x - 2, player.y - 2, player.width + 4, player.height + 4);
            }
        }

        function draw() {
            // Background and stars are now drawn directly in gameLoop before this call

            // 绘制生命值爱心
            if (heartImageLoaded) {
                const heartSize = 25; // 爱心图像的大小
                const heartSpacing = 30; // 爱心图像之间的间隔

                for (let i = 0; i < lives; i++) {
                    ctx.drawImage(heartImage, 20 + i * heartSpacing, 20, heartSize, heartSize);
                }
            }

            // 绘制玩家（无敌状态闪烁）
            if (!player.invincible || Math.floor(Date.now() / 100) % 2) {
                drawPlayer();
            }
        
            // 绘制子弹
            bullets.forEach(bullet => {
                // 创建子弹的渐变色 (按 bullet.color 通用着色)
                const bColor = bullet.color || '#fff';
                const bulletGradient = ctx.createLinearGradient(
                    bullet.x, bullet.y,
                    bullet.x, bullet.y + bullet.height
                );
                bulletGradient.addColorStop(0, bColor);
                bulletGradient.addColorStop(1, 'rgba(255,255,255,0.25)');

                ctx.fillStyle = bulletGradient;
                
                // 绘制圆形子弹
                ctx.beginPath();
                ctx.ellipse(
                    bullet.x + bullet.width / 2,
                    bullet.y + bullet.height / 2,
                    bullet.width / 2,
                    bullet.height / 2,
                    0, 0, Math.PI * 2
                );
                ctx.fill();
                
                // 添加发光效果
                ctx.shadowBlur = 5;
                ctx.shadowColor = bullet.color || '#fff';
                ctx.fill();
                ctx.shadowBlur = 0; // 重置阴影
            });
        
            // 绘制敌机 (像素风格)
            enemies.forEach(enemy => {
                const hue = (enemy.level * 20) % 360;

                // 根据敌机HSL动态生成调色板
                const enemyPalette = {
                    '1': `hsl(${hue}, 80%, 30%)`,
                    '2': `hsl(${hue}, 80%, 42%)`,
                    '3': `hsl(${hue}, 80%, 55%)`,
                };

                drawPixelSprite(ENEMY_SPRITE, enemy.x, enemy.y, enemy.width, enemy.height, enemyPalette);

                // 等级数字
                const fontSize = Math.max(10, enemy.width / 4);
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${fontSize}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeText(enemy.level, enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                ctx.fillText(enemy.level, enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
            });

            // 绘制绿色方块（生命奖励）
            healthPowerUps.forEach(powerUp => {
                // 创建绿色方块的渐变
                const healthGradient = ctx.createLinearGradient(
                    powerUp.x, powerUp.y,
                    powerUp.x + powerUp.width, powerUp.y + powerUp.height
                );
                healthGradient.addColorStop(0, '#00FF00'); // 绿色
                healthGradient.addColorStop(0.5, '#00CC00');
                healthGradient.addColorStop(1, '#00FF00');

                ctx.fillStyle = healthGradient;

                // 绘制闪烁的十字形状
                const time = Date.now() / 200;
                const scale = 0.9 + Math.sin(time) * 0.1; // 脉动效果

                ctx.save();
                ctx.translate(powerUp.x + powerUp.width / 2, powerUp.y + powerUp.height / 2);
                ctx.scale(scale, scale);

                // 绘制十字
                ctx.fillRect(-powerUp.width / 8, -powerUp.height / 2, powerUp.width / 4, powerUp.height);
                ctx.fillRect(-powerUp.width / 2, -powerUp.height / 8, powerUp.width, powerUp.height / 4);

                ctx.restore();
            });

            // 绘制金色方块（射击奖励）
            shootingPowerUps.forEach(powerUp => {
                // 创建金色方块的渐变
                const powerUpGradient = ctx.createLinearGradient(
                    powerUp.x, powerUp.y,
                    powerUp.x + powerUp.width, powerUp.y + powerUp.height
                );
                powerUpGradient.addColorStop(0, '#FFD700');
                powerUpGradient.addColorStop(0.5, '#FFC000');
                powerUpGradient.addColorStop(1, '#FFD700');
            
                ctx.fillStyle = powerUpGradient;
                
                // 绘制闪烁的星形
                const time = Date.now() / 200;
                const scale = 0.9 + Math.sin(time) * 0.1; // 脉动效果
                
                ctx.save();
                ctx.translate(powerUp.x + powerUp.width / 2, powerUp.y + powerUp.height / 2);
                ctx.scale(scale, scale);
                
                drawStar(0, 0, powerUp.width / 2, 5);
                
                ctx.restore();
            });
        
            // 绘制蓝色方块（无敌奖励）
            invinciblePowerUps.forEach(powerUp => {
                // 创建蓝色方块的渐变
                const invincibleGradient = ctx.createLinearGradient(
                    powerUp.x, powerUp.y,
                    powerUp.x + powerUp.width, powerUp.y + powerUp.height
                );
                invincibleGradient.addColorStop(0, '#00BFFF');
                invincibleGradient.addColorStop(0.5, '#0080FF');
                invincibleGradient.addColorStop(1, '#00BFFF');
            
                ctx.fillStyle = invincibleGradient;
                
                // 绘制闪烁的盾牌形状
                const time = Date.now() / 200;
                const scale = 0.9 + Math.sin(time) * 0.1; // 脉动效果
                
                ctx.save();
                ctx.translate(powerUp.x + powerUp.width / 2, powerUp.y + powerUp.height / 2);
                ctx.scale(scale, scale);
                
                drawShield(0, 0, powerUp.width / 2);
                
                ctx.restore();
            });
            
            // 绘制爆炸效果
            explosions.forEach(particle => {
                const alpha = particle.life / particle.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        
            // 显示暂停状态
            if (gamePaused && !gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制暂停文字
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('游戏暂停', canvas.width / 2, canvas.height / 2);
                
                // 绘制继续提示
                ctx.font = '24px Arial';
                ctx.fillText('按空格键继续', canvas.width / 2, canvas.height / 2 + 40);
                
                // 绘制暂停图标
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2 - 80, 40, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.fillStyle = '#fff';
                ctx.fillRect(canvas.width / 2 - 15, canvas.height / 2 - 100, 10, 40);
                ctx.fillRect(canvas.width / 2 + 5, canvas.height / 2 - 100, 10, 40);
            }
        
            // 游戏结束
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制游戏结束文字
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 50);
                
                // 绘制得分信息
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.fillText(`最终得分: ${score}`, canvas.width / 2, canvas.height / 2);
                ctx.fillText(`击杀数: ${kills}`, canvas.width / 2, canvas.height / 2 + 30);
                ctx.fillText(`游戏时间: ${gameTime}秒`, canvas.width / 2, canvas.height / 2 + 60);
                
                // 绘制重新开始提示
                ctx.fillStyle = '#4a90e2';
                ctx.fillText('按空格键或点击屏幕重新开始', canvas.width / 2, canvas.height / 2 + 100);
            }
        }



        // 创建爆炸效果
        function createExplosion(x, y, size, color) {
            const particleCount = 20 + Math.floor(size / 5);
            
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 3;
                const radius = 1 + Math.random() * 3;
                const life = 30 + Math.random() * 20;
                
                explosions.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: radius,
                    color: color,
                    life: life,
                    maxLife: life
                });
            }
        }
        
        // 更新爆炸效果
        function updateExplosions() {
            explosions = explosions.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life--;
                return particle.life > 0;
            });
        }
        
        // 游戏循环
        function gameLoop(timestamp) {
            if (!lastFrameTime) { // 第一次调用 gameLoop
                lastFrameTime = timestamp; // 初始化 lastFrameTime
                requestAnimationFrame(gameLoop); // 请求下一帧，当前帧不进行计算和绘制
                return; // 退出当前帧的处理
            }

            const deltaTime = (timestamp - lastFrameTime) / 1000; // deltaTime in seconds
            lastFrameTime = timestamp; // 更新 lastFrameTime 供下一帧使用

            // 安全校验：如果deltaTime异常，可以设置一个上限或者跳过该帧
            if (deltaTime <= 0 || deltaTime > 0.5) { // 例如，如果deltaTime为0、负数或过大（可能因为页面失焦后恢复）
                // console.warn("Abnormal deltaTime:", deltaTime, "Skipping frame or using default.");
                // deltaTime = 1/60; // 可以选择使用一个默认值，或者直接跳过更新
                requestAnimationFrame(gameLoop);
                return; // 跳过这一帧的更新和绘制，避免潜在问题
            }

            // console.log("deltaTime:", deltaTime); // 调试时可以取消注释

            if (!gamePaused && !awaitingUpgrade && !codexOpen) {
                if (!gameOver) { // Game logic updates only if not game over
                    gameTime += deltaTime;
                    timeElement.textContent = Math.floor(gameTime);

                    // 回血 (被动 regen)
                    if (regenInterval > 0 && lives < maxLives) {
                        regenTimer += deltaTime;
                        if (regenTimer >= regenInterval) {
                            regenTimer -= regenInterval;
                            lives++;
                            livesElement.textContent = lives;
                        }
                    }

                    // Game logic updates
                    updatePlayer(deltaTime);
                    fireWeapons();
                    updateBullets(deltaTime);
                    createEnemy();
                    updateEnemies(deltaTime);
                    createHealthPowerUp();
                    createShootingPowerUp();
                    createInvinciblePowerUp();
                    updateHealthPowerUps(deltaTime);
                    updateShootingPowerUp(deltaTime);
                    updateInvinciblePowerUps(deltaTime);
                    updateExplosions();
                    checkCollisions();
                    // updateTime(); // Effectively removed as its logic is integrated above
                }

                // 计算FPS
                framesThisSecond++;
                if (timestamp > lastFpsUpdate + 1000) { // 每秒更新一次FPS
                    fps = framesThisSecond;
                    framesThisSecond = 0;
                    lastFpsUpdate = timestamp;
                    if (fpsElement) fpsElement.textContent = fps; // 更新FPS显示
                }
            } else if (!codexOpen && gameOver && (keys.Space || isMobile)) { // Restart logic
                // 重置游戏
                score = 0;
                lives = 3;
                kills = 0;
                gameTime = 0;
                startTime = Date.now();
                enemyCounter = 0; // 重置敌人计数器
                scoreElement.textContent = score;
                livesElement.textContent = lives;
                killsElement.textContent = kills;
                timeElement.textContent = gameTime;
                player.x = canvas.width / 2;
                player.invincible = false;
                shootingPowerUpActive = false;
                shootingPowerUpTimeLeft = 0;
                bullets = [];
                enemies = [];
                shootingPowerUps = [];
                invinciblePowerUps = [];
                gameOver = false;
                gamePaused = false;
                enemyInterval = 1000; // 重置难度
                resetUpgrades(); // 肉鸽: 复位等级/升级
            }

            // 清除画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制星空背景
            ctx.fillStyle = '#0a0a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制一些随机的星星
            drawStars(deltaTime); // Pass deltaTime

            // 绘制游戏画面
            draw();

            // 继续游戏循环
            requestAnimationFrame(gameLoop);
        }

        // 开始游戏
        gameLoop();

        // 检测是否为移动设备
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // 调整画布大小
        function resizeCanvas() {
            const maxWidth = window.innerWidth - 20;
            const maxHeight = window.innerHeight - 150;
            const ratio = 400 / 600;

            let newWidth = maxWidth;
            let newHeight = maxWidth / ratio;

            if (newHeight > maxHeight) {
                newHeight = maxHeight;
                newWidth = maxHeight * ratio;
            }

            canvas.width = newWidth;
            canvas.height = newHeight;

            // 调整玩家位置
            player.x = canvas.width / 2;
            player.y = canvas.height - 50;
        }

        // 监听窗口大小变化
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 移动设备控制
        if (isMobile) {
            const mobileControls = document.getElementById('mobileControls');
            mobileControls.innerHTML = '';
            mobileControls.className = 'game-controls';
            
            // 创建暂停按钮
            const pauseBtn = document.createElement('button');
            pauseBtn.className = 'control-btn';
            pauseBtn.id = 'pauseBtn';
            pauseBtn.innerHTML = '⏸️';
            mobileControls.appendChild(pauseBtn);
            
            let touchStartX = 0;
            let touchStartY = 0;
            
            // 触摸控制
            const handleTouchStart = (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                // 如果点击暂停按钮
                if (e.target === pauseBtn) {
                    if (!gameOver && !awaitingUpgrade) {
                        gamePaused = !gamePaused;
                        if (!gamePaused) {
                            const pauseDuration = Date.now() - pauseStartTime;
                            startTime += pauseDuration;
                        } else {
                            pauseStartTime = Date.now();
                        }
                    }
                    return;
                }
                
                // 记录触摸起始位置
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                
                // 清除所有按键状态
                keys['ArrowLeft'] = false;
                keys['ArrowRight'] = false;
                keys['ArrowUp'] = false;
                keys['ArrowDown'] = false;
            };
            
            const handleTouchMove = (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                if (e.target === pauseBtn) return;
                
                const touchX = e.touches[0].clientX;
                const touchY = e.touches[0].clientY;
                
                // 计算触摸点移动的距离
                const deltaX = touchX - touchStartX;
                const deltaY = touchY - touchStartY;
                
                // 根据移动距离设置玩家飞机的速度 (可以调整缩放因子 1.0)
                player.vx = deltaX * 1.0; // <--- 这里的 1.0 是一个灵敏度因子
                player.vy = deltaY * 1.0; // <--- 这里的 1.0 是一个灵敏度因子
                
                // 更新触摸起始位置，以便下一次计算相对移动
                touchStartX = touchX;
                touchStartY = touchY;
            };
            
            const handleTouchEnd = () => {
                // 清除移动状态
                player.vx = 0;
                player.vy = 0;
            };
            
            // 添加触摸事件监听
            canvas.addEventListener('touchstart', handleTouchStart);
            canvas.addEventListener('touchmove', handleTouchMove);
            canvas.addEventListener('touchend', handleTouchEnd);
            canvas.addEventListener('touchcancel', handleTouchEnd);            
            pauseBtn.addEventListener('touchstart', handleTouchStart);
            
            // 隐藏移动端双击缩放
            document.documentElement.addEventListener('touchstart', (e) => {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });

            // 禁止页面滚动
            document.body.addEventListener('touchmove', (e) => {
                e.preventDefault();
            }, { passive: false });

            // 游戏结束后点击屏幕快速重开
            canvas.addEventListener('touchend', function(e) {
                if (gameOver) {
                    // 重置游戏
                    score = 0;
                    lives = 3;
                    kills = 0;
                    gameTime = 0;
                    startTime = Date.now();
                    enemyCounter = 0;
                    scoreElement.textContent = score;
                    livesElement.textContent = lives;
                    killsElement.textContent = kills;
                    timeElement.textContent = gameTime;
                    player.x = canvas.width / 2;
                    player.invincible = false;
                    shootingPowerUpActive = false;
                    shootingPowerUpTimeLeft = 0;
                    bullets = [];
                    enemies = [];
                    shootingPowerUps = [];
                    invinciblePowerUps = [];
                    gameOver = false;
                    gamePaused = false;
                    enemyInterval = 1000;
                    resetUpgrades(); // 肉鸽: 复位等级/升级
                }
            });
        } else {
            // 在非移动设备上隐藏控制按钮
            document.getElementById('mobileControls').style.display = 'none';
            // PC端也支持点击画布重开
            canvas.addEventListener('mousedown', function(e) {
                if (gameOver) {
                    score = 0;
                    lives = 3;
                    kills = 0;
                    gameTime = 0;
                    startTime = Date.now();
                    enemyCounter = 0;
                    scoreElement.textContent = score;
                    livesElement.textContent = lives;
                    killsElement.textContent = kills;
                    timeElement.textContent = gameTime;
                    player.x = canvas.width / 2;
                    player.invincible = false;
                    shootingPowerUpActive = false;
                    shootingPowerUpTimeLeft = 0;
                    bullets = [];
                    enemies = [];
                    shootingPowerUps = [];
                    invinciblePowerUps = [];
                    gameOver = false;
                    gamePaused = false;
                    enemyInterval = 1000;
                    resetUpgrades(); // 肉鸽: 复位等级/升级
                }
            });
        }
    </script>
</body>
</html>

<!-- 在 gameInfo div 后添加 -->
<div id="lastModified"></div>

<script>
// 在游戏循环开始前添加
const lastModifiedElement = document.getElementById('lastModified');

// 获取并显示最后修改时间
fetch(window.location.href)
    .then(response => {
        const lastModified = response.headers.get('last-modified');
        if (lastModified) {
            const date = new Date(lastModified);
            const formattedDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            const formattedTime = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
            lastModifiedElement.textContent = `最后更新: ${formattedDate} ${formattedTime}`;
        } else {
            lastModifiedElement.textContent = '最后更新时间未知';
        }
    })
    .catch(() => {
        lastModifiedElement.textContent = '最后更新时间未知';
    });
</script>
