<body>
    <div id="gameInfo">
        <div>生命值: <span id="lives">3</span></div>
        <div>击杀数: <span id="kills">0</span></div>
        <div>时间: <span id="time">0</span></div>
        <div>分数: <span id="score">0</span></div>
        <div>当前帧率: <span id="fps">0</span></div>
        <div>等级: <span id="level">1</span></div>
        <div>经验: <span id="xpText">0/20</span></div>
        <div id="xpBarWrap"><div id="xpBar"></div></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="mobileControls">
        <!-- Mobile controls will be created dynamically -->
    </div>
    <div id="upgradePanel" class="hidden">
        <!-- 升级三选一浮窗，由 JS 动态生成 -->
    </div>
    <button id="codexBtn">📖 图鉴 (G)</button>
    <div id="codexPanel" class="hidden">
        <!-- 图鉴浮层，由 JS 动态生成 -->
    </div>

    <script>
        /*
         * ╔══════════════════════════════════════════════════════════════╗
         * ║          飞机大战 (PIXEL PLANE) 架构设计文档                 ║
         * ╚══════════════════════════════════════════════════════════════╝
         *
         * ─── 版本: 1.0 ───
         * ─── 风格: 竖版卷轴射击 / 像素艺术 ───
         *
         * ============================================================
         * 一、设计哲学
         * ============================================================
         *
         * 核心原则:
         *   1. 单文件零依赖 — 纯原生 Canvas 2D，无引擎无框架
         *   2. deltaTime 驱动 — 所有位移乘以 deltaTime*60，帧率无关
         *   3. 难度平滑递增 — 敌机等级/速度/生成间隔随时间演化，无突变
         *   4. 像素艺术统一 — 玩家与敌机均用字符网格精灵绘制，调色板驱动
         *
         * 玩家操作:
         *   - PC: 方向键/WASD 移动，空格暂停/重开，子弹自动连发
         *   - 移动端: 触摸拖动飞船（相对位移驱动 vx/vy），⏸️ 按钮暂停
         *
         * ============================================================
         * 二、游戏循环与状态机
         * ============================================================
         *
         *   gameLoop(timestamp)  ── requestAnimationFrame 自递归
         *     │
         *     ├─ 计算 deltaTime（秒），异常值 (>0.5s 或 ≤0) 跳帧
         *     │
         *     ├─ if !gamePaused:
         *     │    └─ if !gameOver:
         *     │         更新 gameTime → updatePlayer → fireWeapons
         *     │         → updateBullets → createEnemy → updateEnemies
         *     │         → createXxxPowerUp ×3 → updateXxxPowerUps ×3
         *     │         → updateExplosions → checkCollisions
         *     │    (gameOver 时按空格/点击进入重置分支)
         *     │
         *     ├─ FPS 统计（每秒采样一次）
         *     │
         *     └─ 渲染: clearRect → 星空背景 drawStars → draw()
         *
         *   状态标志:
         *     gameOver  — 生命归零，显示结算画面，等待重开输入
         *     gamePaused — 空格切换，半透明遮罩 + 暂停图标，时间补偿
         *
         * ============================================================
         * 三、核心实体与数组
         * ============================================================
         *
         * ┌─────────────────────────────────────────────────────────┐
         * │ player (单例对象)                                       │
         * │   x,y,width,height(40),speed(5,强化时8)                 │
         * │   vx,vy — 触摸相对位移注入的速度                         │
         * │   invincible / invincibleTime(2000ms) — 受伤后短暂无敌   │
         * ├─────────────────────────────────────────────────────────┤
         * │ bullets[] — 玩家子弹                                   │
         * │   width4 height10, bulletSpeed=7, dx(斜射分量), color   │
         * │   冷却: 各武器独立 cooldown, ×fireRateMul(被动 fire_rate) │
         * │   强化态: 同时发射中+左斜+右斜三发 (dx=-2/0/+2)         │
         * ├─────────────────────────────────────────────────────────┤
         * │ enemies[] — 下落敌机                                   │
         * │   width/height = 30 + (level-1)*10 (等级越高越大)       │
         * │   speed/originalSpeed — 被击中减速后线性恢复(1秒)       │
         * │   vx — 随机水平速度(-1~1)，碰墙反弹，敌机间弹性碰撞    │
         * │   level — 每击中一次 -1，归零时销毁并 +100分/+1击杀     │
         * ├─────────────────────────────────────────────────────────┤
         * │ 道具 ×3 (均为 20×20 方块，下落速度 2)                  │
         * │   healthPowerUps[]   绿色十字    生命+1 (上限5)        │
         * │   shootingPowerUps[] 金色星形    5秒射击强化(三发散射) │
         * │   invinciblePowerUps[] 蓝色盾牌  3秒无敌              │
         * │   生成条件: enemyCounter % interval === 0 且当前无存货 │
         * ├─────────────────────────────────────────────────────────┤
         * │ explosions[] — 粒子爆炸(20+个粒子,径向扩散,life递减)   │
         * │ stars[] — 网格化星空背景(10×10格,淡入淡出+闪烁)        │
         * └─────────────────────────────────────────────────────────┘
         *
         * ============================================================
         * 四、难度曲线
         * ============================================================
         *
         *   敌机等级: min(100, 1 + floor(gameTime/10))  — 每10秒+1级
         *   敌机速度: max(minSpeed, maxSpeed - (level-1)*0.18 - gameTime*0.01)
         *             范围 [minEnemySpeed=1.2, maxEnemySpeed=4.5]
         *   生成间隔: enemyInterval *= 0.995/帧, 下限 350ms
         *             初始 1000ms，每生成一只递减
         *   道具周期: 生命每23只 / 射击每13只 / 无敌每17只敌机
         *
         *   注: handleEnemyDamage 中敌机受伤后 speed 重算依赖 level，
         *       level 越高体积越大但下落越慢，给玩家击杀窗口。
         *
         * ============================================================
         * 五、像素艺术系统
         * ============================================================
         *
         *   drawPixelSprite(sprite, x, y, w, h, palette)
         *     - sprite: 字符串数组，每行一串，字符 = 调色板键
         *     - ' ' (空格) = 透明，跳过
         *     - 自动按 w/cols、h/rows 切分像素块
         *
         *   PLAYER_SPRITE (19×16)  战斗机: 机头/座舱/后掠翼/双引擎
         *     调色板: #机身 C座舱 E引擎 W机翼深色
         *     附加: 双引擎火焰渐变(黄→橙→红透明)，无敌时白色描边
         *
         *   ENEMY_SPRITE (10×11)  菱形: 3层亮度梯度
         *     调色板: 按敌机等级 hue=(level*20)%360 动态生成
         *     1=暗 2=中 3=亮，中央叠加等级数字(白字黑描边)
         *
         *   道具图形: drawStar(星形,5角) / drawShield(盾牌+十字)
         *             + 呼吸缩放 scale=0.9+sin(t)*0.1
         *
         * ============================================================
         * 六、碰撞检测 (AABB)
         * ============================================================
         *
         *   通用矩形相交四条件判断，分四类处理:
         *     1. 子弹×敌机   → handleEnemyDamage(enemy, bullet)
         *                     敌机 -1级，子弹施加向上冲量 + 水平扰动
         *     2. 玩家×生命道具 → lives+1 (上限5)
         *     3. 玩家×射击道具 → 5秒强化(三发散射+移速8)
         *     4. 玩家×无敌道具 → 3秒无敌
         *     5. 玩家×敌机   → 敌机受伤-1级; 玩家非无敌时 lives-1
         *                     玩家受伤后 2秒无敌(闪烁渲染)
         *
         *   handleEnemyDamage(enemy, bullet?):
         *     - level-- 后按新 level 重算 width/height/originalSpeed
         *     - bullet 存在时: speed=-3 (向上阻碍), hitTime=Date.now()
         *     - level≤0: 大爆炸 + 销毁 + score+100 + kills+1
         *
         * ============================================================
         * 七、输入与适配
         * ============================================================
         *
         *   PC:
         *     keys 状态对象(Arrow/WASD/Space)，keydown/keyup 维护
         *     Space: 暂停切换(gameOver时空格重开)
         *     gameOver 后 mousedown 画布也可重开
         *
         *   移动端 (navigator.userAgent 检测):
         *     touchstart/move: 相对位移 → player.vx/vy (灵敏度1.0)
         *     ⏸️ 按钮: 暂停切换
         *     touchend (gameOver): 点击重开
         *     禁止多指/滚动/双击缩放
         *
         *   画布尺寸:
         *     setCanvasSize() — dpr 缩放，窗口<500px 时自适应宽度
         *     resizeCanvas()  — 保持 400:600 比例，限制最大宽高
         *     注意: 两套尺寸逻辑并存，resizeCanvas 会覆盖前者
         *
         * ============================================================
         * 八、UI 与状态显示
         * ============================================================
         *
         *   #gameInfo (左上): 生命/击杀/时间/分数/FPS，蓝字高亮
         *   #lastModified (右上): fetch 自响应头 last-modified
         *   画布内: 生命爱心(images/heart.png)、暂停遮罩、结算画面
         *
         * ============================================================
         * 九、修改指引（常见改动锚点）
         * ============================================================
         *
         *   调难度     → 顶部 enemyInterval / Decay / minMaxSpeed / 等级公式
         *   调道具     → healthPowerUpsTimeInterval 等三个 interval
         *               / 各 duration 常量 / 道具 speed
         *   调玩家     → player 对象 speed/invincibleTime / fireRateMul(射速)
         *   调敌机     → createEnemy 等级公式 / handleEnemyDamage 速度重算
         *   换皮肤     → PLAYER_SPRITE/PALETTE / ENEMY_SPRITE / 调色板生成
         *   加新道具   → 仿 shootingPowerUps 三件套(create/update/draw/collision)
         *   加新敌人种 → enemies[] 增加 type 字段, drawEnemy 分支渲染
         *
         * ============================================================
         * 十、肉鸽改造路线图 (v2 规划 — 尚未实现)
         * ============================================================
         *
         * 目标: 把当前线性射击改为局内成长的肉鸽构筑玩法。
         *
         * 【已锁定决策】
         *   - 生命: 半心制。1 颗心 = 2 HP，小伤害扣半心，最大心数可升级。
         *           爱心美术保留，半心用半颗/灰心表示。
         *   - 旧道具: 折叠进升级树。
         *           射击强化(金) → 永久武器；无敌(蓝) → 稀有主动/翻滚；
         *           生命(绿) → 保留为地面回血掉落。
         *   - 升级堆叠: 分等级可叠。武器/修饰/被动均可重复抽到并升阶
         *           (如散射 Lv1→Lv2→Lv3 数量/伤害递增)。
         *   - 选择 UX: 三选一浮窗。升级时暂停，画布中央 3 张卡
         *           (图标+名称+描述+稀有度边框)，鼠标/触屏选 1。
         *
         * 【三层正交架构】
         *   Weapon   (发射模式)  何时/几个/方向生成子弹
         *   Modifier (子弹修饰)  pierce / bounce / homing / boomerang / split / crit
         *   Passive  (数值)      射速/伤害/移速/最大HP/拾取范围/子弹速度/回血
         *   修饰不是自由贴任意武器, 而是【槽位+互斥】(B 方案):
         *     每件武器有有限修饰槽(1~2), 维护互斥表挡掉超模组合。
         *     后续若要加深, 可在此基础上追加 C 进化路径(P6)。
         *
         *   互斥表(草案):
         *     主炮     槽2  可:全部            拒:—
         *     散射     槽2  可:追踪/折射/暴击  拒:分裂(指数爆炸)
         *     重炮     槽1  可:穿透/分裂        拒:追踪/折射(巨大弹不弹墙追踪)
         *     回旋镖   槽1  可:穿透/暴击        拒:折射/回旋/追踪
         *     环形轨道 槽1  可:穿透/暴击        拒:追踪/折射
         *
         *   抽卡时: 已满槽的武器不再出修饰卡; 互斥的修饰不出现在选项里。
         *
         * 【升级目录(草案)】
         *   主动武器(可共存, 各有等级):
         *     主炮(默认) / 散炮(3/5/7路) / 侧炮 / 后炮 / 环形轨道
         *     / 重炮(缓慢巨大弹) / 回旋镖(飞出返回, 往返两判)
         *   子弹修饰(给所有武器加属性, 可升级):
         *     穿透+N / 追踪(转向强度↑) / 折射+N墙反弹 / 分裂(命中spawn片段)
         *     / 暴击(概率双倍)
         *   被动: 射速+ / 伤害+ / 移速+ / 最大HP+ / 拾取范围+ / 子弹速度+ / 回血
         *
         * 【经验/等级】
         *   击杀 xp = 5 + enemyLevel*3；阈值 next = 20 * 1.35^level (指数增长)
         *   升级 → 暂停 → 三选一浮窗 → 选 1 → 继续
         *
         * 【子弹结构升级】
         *   旧: {x,y,w,h,dx,color}
         *   新: {x,y,vx,vy,damage,pierce,bounce,homing,split,life,behavior,...}
         *       通用 updateBullets 按 flag 分支: 追踪转向/撞墙反弹/回旋反向/穿透不消亡
         *
         * 【分阶段实施(慢慢来)】
         *   P1 地基: 经验/等级 + 三选一浮窗骨架 + 升级注册表(占位被动) — 已实现
         *   P1.5 图鉴: 📖图鉴按钮(右上)+G键, DOM浮层暂停面板,
         *             全部可见(武器/修饰/被动三栏, 含互斥分支),
         *             数据自动来自 P1 注册表。 — 已实现
         *   P2 武器: 主炮/散射/侧炮/重炮 + 等级提升 + 多武器独立冷却发射 — 已实现
         *   P3 修饰: pierce / 追踪 / 折射 / 分裂 + 槽位互斥 — 已实现
         *   P4 被动+平衡: 暴击修饰 + 伤害/拾取/回血被动 + 稀有度加权 + maxLives — 已实现
         *   P5 收尾: 半心制 HP(1心=2HP) + 旧道具折叠 + 回血掉落 + UI 打磨
         *   P6(可选) 进化: 在 B 互斥表基础上追加 C 进化路径,
         *             图鉴补"满级进化终极武器"栏
         *
         * ============================================================
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const livesElement = document.getElementById('lives');
        const killsElement = document.getElementById('kills');
        const timeElement = document.getElementById('time');
        const scoreElement = document.getElementById('score');
        const fpsElement = document.getElementById('fps'); // 新增：获取FPS元素

        // 设置画布大小
        // 适配高分屏，自动缩放
        function setCanvasSize() {
            const dpr = window.devicePixelRatio || 1;
            let width = 400;
            let height = 600;
            if (window.innerWidth < 500) {
                width = Math.min(400, window.innerWidth - 10);
                height = width * 1.5;
            }
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        // 游戏状态
        let score = 0;
        let lives = 3;
        let kills = 0;
        let gameTime = 0;
        let gameOver = false;
        let gamePaused = false; // 添加暂停状态变量
        let startTime = Date.now();
        let pauseStartTime = 0; // 暂停开始时间
        let shootingPowerUpActive = false; // 射击特殊能力状态
        let shootingPowerUpTimeLeft = 0; // 射击特殊能力剩余时间
        let shootingPowerUpDuration = 5000; // 射击特殊能力持续5秒
        let invinciblePowerUpActive = false; // 无敌特殊能力状态
        let invinciblePowerUpTimeLeft = 0; // 无敌特殊能力剩余时间
        let invinciblePowerUpDuration = 3000; // 无敌特殊能力持续3秒
        let enemyCounter = 0; // 敌人计数器
        let fireRateMul = 1; // 全局射速倍率(被动 fire_rate 设置, 越小越快; 乘在各武器冷却上)
        let damageBonus = 0; // 全子弹伤害加成(被动 damage)
        let pickupRange = 0; // 道具吸附范围(被动 pickup)
        let maxLives = 3;    // 最大生命上限(被动 max_lives 提升, 硬上限 5)
        let regenInterval = 0; // 回血间隔秒数(被动 regen; 0=关闭)
        let regenTimer = 0;    // 回血计时器
        // 稀有度权重: 越稀有出现概率越低
        const RARITY_WEIGHT = { common: 1.0, uncommon: 0.5, rare: 0.25 };
        let lastFrameTime = 0; // 用于计算 deltaTime
        let fps = 0; // 新增：用于存储计算出的FPS
        let framesThisSecond = 0; // 新增：用于计算每秒的帧数
        let lastFpsUpdate = 0; // 新增：上次FPS更新的时间

        // ===== 肉鸽 P1: 经验/等级/三选一升级 =====
        let playerLevel = 1;
        let playerXP = 0;
        let pendingLevelUps = 0;   // 待结算的升级次数(可叠加)
        let awaitingUpgrade = false; // 升级选择期间暂停游戏逻辑
        let currentChoices = [];   // 当前浮窗展示的 3 张卡
        let codexOpen = false;     // 图鉴打开期间暂停游戏逻辑

        function xpToNext(lv) { return Math.floor(20 * Math.pow(1.35, lv - 1)); }

        // 升级数值据此重算; 重开时回到 BASE
        const UPGRADE_BASE = { fireRateMul: 1, bulletSpeed: 7, playerSpeed: 5, damageBonus: 0, pickupRange: 0 };

        // 升级注册表 (P1 被动 + P2 武器; P3 再加修饰)
        // level: 当前等级(运行时, 重开复位); apply(lv): 按新等级重算效果
        // rarity: 抽卡权重(common/uncommon/rare); 武器 accepts/rejects 为互斥分支
        const UPGRADE_REGISTRY = [
            // ── 被动 ──
            { id:'fire_rate', name:'射速', desc:'全武器冷却 ×0.9/级', icon:'⚡', type:'passive', maxLevel:5, level:0, rarity:'common',
              apply(lv){ fireRateMul = Math.max(0.4, 1 - 0.1 * lv); } },
            { id:'bullet_speed', name:'子弹速度', desc:'子弹速度 +1/级', icon:'🚀', type:'passive', maxLevel:5, level:0, rarity:'common',
              apply(lv){ bulletSpeed = UPGRADE_BASE.bulletSpeed + lv; } },
            { id:'move_speed', name:'移速', desc:'移动速度 +1/级', icon:'👟', type:'passive', maxLevel:5, level:0, rarity:'common',
              apply(lv){ player.speed = UPGRADE_BASE.playerSpeed + lv; } },
            { id:'damage', name:'伤害', desc:'全子弹伤害 +1/级', icon:'🗡️', type:'passive', maxLevel:5, level:0, rarity:'uncommon',
              apply(lv){ damageBonus = UPGRADE_BASE.damageBonus + lv; } },
            { id:'pickup', name:'拾取范围', desc:'道具吸附范围 +30/级', icon:'🧲', type:'passive', maxLevel:3, level:0, rarity:'common',
              apply(lv){ pickupRange = UPGRADE_BASE.pickupRange + 30 * lv; } },
            { id:'max_lives', name:'最大生命', desc:'最大生命 +1/级 (上限5)', icon:'❤️', type:'passive', maxLevel:2, level:0, rarity:'uncommon',
              apply(lv){ maxLives = Math.min(5, 3 + lv); lives = maxLives; livesElement.textContent = lives; } },
            { id:'regen', name:'回血', desc:'每 8/6/4 秒回 1 心', icon:'➕', type:'passive', maxLevel:3, level:0, rarity:'rare',
              apply(lv){ regenInterval = [0, 8, 6, 4][lv]; regenTimer = 0; } },
            // ── 武器 (P2) ──
            { id:'main', name:'主炮', desc:'前向单发, 伤害=等级', icon:'🔫', type:'weapon', maxLevel:5, level:1, slots:2, rarity:'common',
              accepts:['穿透','追踪','分裂','暴击'], rejects:['折射'],
              apply(lv){ ownedWeapons.main = lv; } },
            { id:'spread', name:'散炮', desc:'扇形 3/5/7 发', icon:'🌟', type:'weapon', maxLevel:3, level:0, slots:2, rarity:'uncommon',
              accepts:['折射','暴击'], rejects:['分裂','追踪'],
              apply(lv){ ownedWeapons.spread = lv; } },
            { id:'side', name:'侧炮', desc:'左右各发射 lv 发', icon:'↔️', type:'weapon', maxLevel:3, level:0, slots:1, rarity:'uncommon',
              accepts:['穿透','暴击'], rejects:['追踪','折射','分裂'],
              apply(lv){ ownedWeapons.side = lv; } },
            { id:'heavy', name:'重炮', desc:'缓慢巨大弹, 高伤', icon:'💣', type:'weapon', maxLevel:3, level:0, slots:1, rarity:'rare',
              accepts:['穿透','分裂'], rejects:['追踪','折射'],
              apply(lv){ ownedWeapons.heavy = lv; } },
        ];
        const TYPE_LABEL = { weapon:'武器', modifier:'修饰', passive:'被动' };

        // ===== 肉鸽 P2: 武器发射系统 =====
        // 每件武器独立冷却; fire(lv, player, push) 生成子弹, push = b => bullets.push(b)
        // bullet 字段: x,y,width,height,vx,vy,color,damage,type
        const WEAPONS = {
            main: { cooldown: 300, fire(lv, pl, push) {
                const color = shootingPowerUpActive ? '#FFD700' : '#fff';
                push({ x: pl.x + pl.width/2 - 2, y: pl.y, width:4, height:10, vx:0, vy:-bulletSpeed, color, damage: lv, type:'main' });
                if (shootingPowerUpActive) { // 射击强化道具: 主炮追加左右斜射
                    push({ x: pl.x + pl.width/2 - 2, y: pl.y, width:4, height:10, vx:-2, vy:-bulletSpeed, color, damage: lv, type:'main' });
                    push({ x: pl.x + pl.width/2 - 2, y: pl.y, width:4, height:10, vx:2, vy:-bulletSpeed, color, damage: lv, type:'main' });
                }
            }},
            spread: { cooldown: 600, fire(lv, pl, push) {
                const count = 3 + 2 * (lv - 1); // 3/5/7
                for (let i = 0; i < count; i++) {
                    const t = count > 1 ? (i / (count - 1) - 0.5) : 0; // -0.5..0.5
                    push({ x: pl.x + pl.width/2 - 2, y: pl.y, width:4, height:10, vx: t * 6, vy:-bulletSpeed, color:'#9cf', damage:1, type:'spread' });
                }
            }},
            side: { cooldown: 700, fire(lv, pl, push) {
                for (let i = 0; i < lv; i++) {
                    const off = (i - (lv - 1) / 2) * 6;
                    const y = pl.y + pl.height/2 + off;
                    push({ x: pl.x + pl.width/2 - 5, y, width:10, height:4, vx:-4, vy:0, color:'#f9f', damage:1, type:'side' });
                    push({ x: pl.x + pl.width/2 - 5, y, width:10, height:4, vx:4, vy:0, color:'#f9f', damage:1, type:'side' });
                }
            }},
            heavy: { cooldown: 1200, fire(lv, pl, push) {
                push({ x: pl.x + pl.width/2 - 8, y: pl.y - 6, width:16, height:16, vx:0, vy:-2.5, color:'#f80', damage: 3 + lv, type:'heavy' });
            }},
        };
        let ownedWeapons = { main: 1 }; // 运行时: weaponId -> 等级 (main 默认拥有)
        let weaponLastFire = {};        // 运行时: weaponId -> 上次发射时间

        function fireWeapons() {
            const now = Date.now();
            for (const id in ownedWeapons) {
                const w = WEAPONS[id];
                if (!w) continue;
                const lv = ownedWeapons[id];
                const mods = weaponMods[id] || {};
                const cd = w.cooldown * fireRateMul;
                if (now - (weaponLastFire[id] || 0) >= cd) {
                    weaponLastFire[id] = now;
                    // push 回调: 给每颗子弹注入本武器已安装的修饰 flag + 全局伤害加成
                    w.fire(lv, player, (b) => {
                        b.pierce = mods.pierce || 0;
                        b.homing = mods.homing || 0;
                        b.bounce = mods.bounce || 0;
                        b.split = mods.split || 0;
                        b.crit = mods.crit || 0;
                        b.damage = (b.damage || 1) + damageBonus;
                        bullets.push(b);
                    });
                }
            }
        }

        // ===== 肉鸽 P3: 修饰系统 (槽位 + 互斥) =====
        // MODIFIERS: 修饰目录; weaponMods[weaponId][modId] = 等级 (运行时)
        // bullet 修饰字段: pierce(剩余穿透次数), homing(等级), bounce(剩余反弹次数), split(等级)
        const MODIFIERS = {
            pierce:  { name:'穿透', desc:'子弹多穿透 N 个敌机', icon:'➡️', maxLevel:3, rarity:'common' },
            homing:  { name:'追踪', desc:'子弹转向追击附近敌机', icon:'🎯', maxLevel:3, rarity:'uncommon' },
            bounce:  { name:'折射', desc:'子弹撞侧墙反弹 N 次', icon:'↩️', maxLevel:3, rarity:'common' },
            split:   { name:'分裂', desc:'命中时分裂出片段', icon:'✴️', maxLevel:3, rarity:'uncommon' },
            crit:    { name:'暴击', desc:'15%/级 概率双倍伤害', icon:'💥', maxLevel:3, rarity:'uncommon' },
        };
        let weaponMods = {}; // weaponId -> { modId: level }

        function findRegistryWeapon(id) { return UPGRADE_REGISTRY.find(u => u.id === id); }
        function installedModCount(weaponId) {
            const m = weaponMods[weaponId]; if (!m) return 0;
            return Object.keys(m).filter(k => m[k] > 0).length;
        }
        // (weaponId, modId) 是否可安装: 已拥有 / 武器接受(非互斥) / 未满级 / 新装时有空闲槽
        function isValidModInstall(weaponId, modId) {
            if (!ownedWeapons[weaponId]) return false;
            const w = findRegistryWeapon(weaponId);
            const mod = MODIFIERS[modId];
            if (!w || !mod) return false;
            if (!w.accepts || !w.accepts.includes(mod.name)) return false; // 互斥
            const cur = (weaponMods[weaponId] && weaponMods[weaponId][modId]) || 0;
            if (cur >= mod.maxLevel) return false; // 满级
            if (cur === 0 && installedModCount(weaponId) >= (w.slots || 0)) return false; // 槽满
            return true;
        }
        function installMod(weaponId, modId) {
            if (!weaponMods[weaponId]) weaponMods[weaponId] = {};
            weaponMods[weaponId][modId] = (weaponMods[weaponId][modId] || 0) + 1;
        }

        // 最近的敌机 (追踪用)
        function findNearestEnemy(x, y) {
            let best = null, bestD = Infinity;
            for (const e of enemies) {
                if (e.dead) continue;
                const dx = e.x + e.width / 2 - x;
                const dy = e.y + e.height / 2 - y;
                const d = dx * dx + dy * dy;
                if (d < bestD) { bestD = d; best = e; }
            }
            return best;
        }

        // 分裂: 命中时生成短命片段
        function spawnSplitFragments(bullet) {
            const count = 2 + (bullet.split || 0); // Lv1→3, Lv2→4, Lv3→5
            const cx = bullet.x + bullet.width / 2;
            const cy = bullet.y + bullet.height / 2;
            for (let i = 0; i < count; i++) {
                const ang = (i / count) * Math.PI * 2;
                bullets.push({
                    x: cx - 2, y: cy - 2, width: 4, height: 4,
                    vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4,
                    color: bullet.color || '#fff', damage: 1, type: 'split',
                    pierce: 0, homing: 0, bounce: 0, split: 0, life: 0.6
                });
            }
        }

        function updateXPDisplay() {
            const need = xpToNext(playerLevel);
            document.getElementById('level').textContent = playerLevel;
            document.getElementById('xpText').textContent = playerXP + '/' + need;
            document.getElementById('xpBar').style.width =
                (need > 0 ? Math.min(100, playerXP / need * 100) : 0) + '%';
        }

        function gainXP(amount) {
            if (gameOver) return;
            playerXP += amount;
            while (playerXP >= xpToNext(playerLevel)) {
                playerXP -= xpToNext(playerLevel);
                playerLevel++;
                pendingLevelUps++;
            }
            updateXPDisplay();
            if (pendingLevelUps > 0 && !awaitingUpgrade) showUpgradeChoices();
        }

        // 构建升级候选 (offer): 注册表条目 + "修饰→武器" 安装组合 (受槽位/互斥约束)
        function buildOffers() {
            const offers = [];
            // 注册表条目 (被动/武器)
            UPGRADE_REGISTRY.forEach(u => {
                if (u.level < u.maxLevel) {
                    offers.push({
                        icon: u.icon,
                        name: u.name + ' → Lv.' + (u.level + 1),
                        desc: u.desc,
                        typeLabel: TYPE_LABEL[u.type] || u.type,
                        rarity: u.rarity || 'common',
                        apply() { u.level++; u.apply(u.level); }
                    });
                }
            });
            // 修饰安装: 每件已拥有武器 × 每个可装修饰
            for (const weaponId in ownedWeapons) {
                if (!ownedWeapons[weaponId]) continue;
                const w = findRegistryWeapon(weaponId);
                if (!w) continue;
                for (const modId in MODIFIERS) {
                    if (!isValidModInstall(weaponId, modId)) continue;
                    const mod = MODIFIERS[modId];
                    const cur = (weaponMods[weaponId] && weaponMods[weaponId][modId]) || 0;
                    offers.push({
                        icon: mod.icon,
                        name: mod.name + ' → ' + w.name + ' Lv.' + (cur + 1),
                        desc: mod.desc + ' (' + installedModCount(weaponId) + '/' + (w.slots || 0) + ' 槽)',
                        typeLabel: '修饰',
                        rarity: mod.rarity || 'common',
                        apply() { installMod(weaponId, modId); }
                    });
                }
            }
            return offers;
        }

        // 按稀有度加权随机抽 n 张 (不放回): 越稀有权重越低
        function weightedPick(offers, n) {
            const pool = offers.slice();
            const result = [];
            for (let k = 0; k < n && pool.length > 0; k++) {
                const weights = pool.map(o => RARITY_WEIGHT[o.rarity] || 1);
                let total = 0;
                for (const w of weights) total += w;
                let r = Math.random() * total;
                let idx = 0;
                for (let i = 0; i < pool.length; i++) {
                    r -= weights[i];
                    if (r <= 0) { idx = i; break; }
                }
                result.push(pool[idx]);
                pool.splice(idx, 1);
            }
            return result;
        }

        function showUpgradeChoices() {
            if (pendingLevelUps <= 0) { awaitingUpgrade = false; return; }
            const offers = buildOffers();
            if (offers.length === 0) {
                pendingLevelUps = 0; // 无可选项: 跳过
                awaitingUpgrade = false;
                return;
            }
            awaitingUpgrade = true;
            // 按稀有度加权抽 3 张 (不足则取全部)
            currentChoices = weightedPick(offers, Math.min(3, offers.length));
            renderUpgradePanel();
        }

        function renderUpgradePanel() {
            const panel = document.getElementById('upgradePanel');
            panel.innerHTML = '';
            const title = document.createElement('div');
            title.className = 'upgrade-title';
            title.textContent = '升级！剩余 ' + pendingLevelUps + ' 次选择';
            panel.appendChild(title);
            const cards = document.createElement('div');
            cards.className = 'upgrade-cards';
            currentChoices.forEach((o, idx) => {
                const card = document.createElement('button');
                card.className = 'upgrade-card';
                card.innerHTML =
                    '<div class="uc-icon">' + o.icon + '</div>' +
                    '<div class="uc-name">' + o.name + '</div>' +
                    '<div class="uc-desc">' + o.desc + '</div>' +
                    '<div class="uc-type">' + o.typeLabel + ' · 按 ' + (idx + 1) + '</div>';
                card.addEventListener('click', () => pickUpgrade(idx));
                cards.appendChild(card);
            });
            panel.appendChild(cards);
            panel.classList.remove('hidden');
        }

        function pickUpgrade(idx) {
            const o = currentChoices[idx];
            if (!o) return;
            o.apply();
            pendingLevelUps--;
            updateXPDisplay();
            if (pendingLevelUps > 0) {
                showUpgradeChoices();
            } else {
                awaitingUpgrade = false;
                currentChoices = [];
                document.getElementById('upgradePanel').classList.add('hidden');
            }
        }

        function resetUpgrades() {
            playerLevel = 1;
            playerXP = 0;
            pendingLevelUps = 0;
            awaitingUpgrade = false;
            currentChoices = [];
            UPGRADE_REGISTRY.forEach(u => u.level = (u.id === 'main' ? 1 : 0));
            fireRateMul = UPGRADE_BASE.fireRateMul;
            bulletSpeed = UPGRADE_BASE.bulletSpeed;
            player.speed = UPGRADE_BASE.playerSpeed;
            damageBonus = UPGRADE_BASE.damageBonus;
            pickupRange = UPGRADE_BASE.pickupRange;
            maxLives = 3;
            regenInterval = 0;
            regenTimer = 0;
            ownedWeapons = { main: 1 };
            weaponLastFire = {};
            weaponMods = {};
            document.getElementById('upgradePanel').classList.add('hidden');
            updateXPDisplay();
        }

        updateXPDisplay(); // 初始化经验条显示

        // ===== 肉鸽 P1.5/P3: 图鉴 (武器/修饰/被动, 含已装修饰与槽位) =====

        function renderCodex() {
            const panel = document.getElementById('codexPanel');
            let html = '<div class="codex-header">'
                + '<div class="codex-title">📖 图鉴</div>'
                + '<button class="codex-close" id="codexCloseBtn">关闭 (G)</button>'
                + '</div><div class="codex-body">';

            // ── 武器 ──
            const weapons = UPGRADE_REGISTRY.filter(u => u.type === 'weapon');
            html += '<div class="codex-section"><h3>武器 (' + weapons.length + ')</h3>';
            weapons.forEach(u => {
                const owned = (ownedWeapons[u.id] || 0) > 0;
                const mods = weaponMods[u.id] || {};
                const installed = Object.keys(mods).filter(k => mods[k] > 0)
                    .map(k => MODIFIERS[k].name + ' Lv' + mods[k]);
                html += '<div class="codex-item">'
                    + '<div class="codex-icon">' + u.icon + '</div>'
                    + '<div class="codex-info">'
                    + '<div class="codex-name">' + u.name
                    + '<span class="codex-lv">Lv.' + u.level + '/' + u.maxLevel

        // 图鉴内滚动不冒泡到 body (移动端 body 禁止 touchmove)
