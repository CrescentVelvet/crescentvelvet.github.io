<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>inner</title>
<style>body { margin:0; background:#222233; overflow:hidden; }</style>
<script>
// 根据 ?ver= 动态注入 importmap（必须在任何 module script 之前）
const ver = new URLSearchParams(location.search).get('ver') || 'r185';
const threeUrl = ver === 'r160'
    ? '/assets/splat-test/three160.module.js'
    : '/assets/splat-vendor/three.module.js';
const im = document.createElement('script');
im.type = 'importmap';
im.textContent = JSON.stringify({
    imports: {
        'three': threeUrl,
        '@mkkellogg/gaussian-splats-3d': '/assets/splat-vendor/gaussian-splats-3d.module.js'
    }
});
document.head.appendChild(im);
</script>
</head>
<body>
<script type="module">
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const ver = new URLSearchParams(location.search).get('ver') || 'r185';

// 标准自驱动 Viewer 模式（库全托管，排除集成代码干扰）
const viewer = new GaussianSplats3D.Viewer({
    cameraUp: [0, 1, 0],
    initialCameraPosition: [0, 1, 4],
    initialCameraLookAt: [0, 0, 0],
    sharedMemoryForWorkers: false,
    gpuAcceleratedSort: false,   // 排除 GPU transform feedback 的变量
    antialias: true
});
document.body.appendChild(viewer.rootElement);
viewer.rootElement.style.width = '100%';
viewer.rootElement.style.height = '100%';

const src = new URLSearchParams(location.search).get('src') || '/assets/splat-test/synth.ply';

viewer.addSplatScene(src, {
    splatAlphaRemovalThreshold: 1,
    showLoadingUI: true
}).then(() => {
    console.log('[inner] addSplatScene RESOLVED');
    window.__resolved = true;
    // 深度探针
    window.viewer = viewer;
    const sm = viewer.splatMesh;
    console.log('[inner] splatCount=', sm.getSplatCount(), 'maxSplatCount=', sm.getMaxSplatCount(),
                'splatRenderReady=', viewer.splatRenderReady, 'initialized=', viewer.initialized,
                'sortWorker=', !!viewer.sortWorker);
    // hook render：统计 draw call + 渲染后立即 readPixels
    const origRender = viewer.renderer.render.bind(viewer.renderer);
    let frame = 0;
    viewer.renderer.render = function(scene, camera) {
        const r = origRender(scene, camera);
        frame++;
        if (frame === 1 || frame === 30) {
            const gl = viewer.renderer.getContext();
            const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
            const px = new Uint8Array(4 * 400);
            // 采样 20x20 网格
            let idx = 0, nonBg = 0, alphaLow = 0;
            for (let y = 0; y < 20; y++) {
                for (let x = 0; x < 20; x++) {
                    const rx = Math.floor(x / 20 * w), ry = Math.floor(y / 20 * h);
                    gl.readPixels(rx, ry, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px, idx * 4);
                    const rr = px[idx*4], gg = px[idx*4+1], bb = px[idx*4+2], aa = px[idx*4+3];
                    if (Math.abs(rr-34) > 25 || Math.abs(gg-34) > 25 || Math.abs(bb-51) > 25) nonBg++;
                    if (aa < 200) alphaLow++;
                    idx++;
                }
            }
            console.log('[inner] frame', frame, 'scene=', scene.type, 'nonBg/400=', nonBg, 'alphaLow/400=', alphaLow,
                        'info.render.drawCalls=', viewer.renderer.info.render.calls,
                        'info.render.triangles=', viewer.renderer.info.render.triangles);
        }
        return r;
    };
    viewer.start();
    // DOM 布局探针
    setTimeout(() => {
        const canvas = document.querySelector('canvas');
        if (canvas) {
            const rect = canvas.getBoundingClientRect();
            const cs = getComputedStyle(canvas);
            console.log('[inner] canvas rect=', JSON.stringify({x: rect.x, y: rect.y, w: rect.width, h: rect.height}),
                        'style=', cs.display, cs.visibility, cs.opacity, 'z=', cs.zIndex, 'pos=', cs.position,
                        'parent=', canvas.parentElement.tagName, canvas.parentElement.className);
            console.log('[inner] bodyChildren=', [...document.body.children].map(e => e.tagName + '.' + e.className + '#' + (e.style?.width||'')).join(' | '));
        } else {
            console.log('[inner] NO CANVAS in DOM');
        }
    }, 2000);
    setTimeout(() => {
        window.parent.postMessage({
            type: 'splatTest',
            ver: ver,
            splatCount: viewer.splatMesh ? viewer.splatMesh.getSplatCount() : -1,
            initialized: viewer.initialized
        }, '*');
    }, 3000);
}).catch(e => {
    console.log('[inner] addSplatScene REJECTED:', String(e));
    window.__rejected = String(e);
    window.parent.postMessage({ type: 'splatTest', ver: ver, error: String(e) }, '*');
});
</script>
</body>
</html>
