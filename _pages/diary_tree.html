            canvas.style.cursor = 'pointer';
        } else {
            canvas.style.cursor = 'grab';
        }
        requestRender();
    }
});

canvas.addEventListener('mouseup', (e) => {
    if (dragging) {
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        if (Math.abs(dx) < 3 && Math.abs(dy) < 3) {
            // Click
            const mx = (e.clientX - viewX) / scale;
            const my = (e.clientY - viewY) / scale;
            const node = hitTest(mx, my);
            if (node) {
                if (node.type === 'month') {
                    // 单击月份卡 = 单月聚焦（原位浮层）。月统计并入浮层头部，不再单独弹。
                    hidePopup();
                    showMonthFocus(node.year, node.month);
                } else {
                    showPopup(node, e.clientX, e.clientY);
                }
            } else {
                hidePopup();
                hideMonthFocus();
            }
        }
    }
    dragging = false;
});

canvas.addEventListener('mouseleave', () => {
    dragging = false;
    hoveredNode = null;
    requestRender();
});

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

// ═══ Touch events ═══
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 1) {
        dragging = true;
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        touchStartX = dragStartX;
        touchStartY = dragStartY;
        touchMoved = false;
        touchWasZooming = false;
        dragViewX = viewX;
        dragViewY = viewY;
    } else if (e.touches.length === 2) {
        dragging = false;
        touchWasZooming = true;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchDist0 = Math.hypot(dx, dy);
        touchScale0 = scale;
    }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && dragging) {
        const dx = e.touches[0].clientX - dragStartX;
        const dy = e.touches[0].clientY - dragStartY;
        if (Math.hypot(e.touches[0].clientX - touchStartX, e.touches[0].clientY - touchStartY) > 6) {
            touchMoved = true;
        }
        viewX = dragViewX + dx;
        viewY = dragViewY + dy;
        requestRender();
    } else if (e.touches.length === 2) {
        touchWasZooming = true;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if (touchDist0 > 0) {
            const factor = dist / touchDist0;
            const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            zoomAt(cx, cy, factor);
            touchDist0 = dist;
            touchScale0 = scale;
        }
    }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
        const touch = e.changedTouches[0];
        if (touch && !touchWasZooming && !touchMoved) {
            const mx = (touch.clientX - viewX) / scale;
            const my = (touch.clientY - viewY) / scale;
            const node = hitTest(mx, my);
            if (node) {
                showPopup(node, touch.clientX, touch.clientY);
            } else {
                hidePopup();
            }
        }
        dragging = false;
        touchMoved = false;
        touchWasZooming = false;
    }
});

// ═══ Keyboard ═══
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hidePopup();
    if (e.key === '0' && !e.ctrlKey && !e.metaKey) {
        resetView();
    }
});

// ═══ Auth & data loading ═══
// 解锁流（manifest 架构）：PBKDF2 解信封得 DEK → 解 manifest 索引 → 骨架建树
// 首屏零正文；正文在日详情/月聚焦时按需 fetch+解密（见 hydrateMonth）。

document.getElementById('unlockBtn').onclick = async function() {
    const password = document.getElementById('password').value;
    const status = document.getElementById('auth-status');
    if (!password) {
        status.textContent = '请输入密码';
        status.className = 'error';
        return;
    }
    status.textContent = '正在派生密钥（PBKDF2 60 万迭代）…';
    status.className = 'loading';

    // ── ① 拉信封，解出 DEK（GCM tag 校验 = 错口令直接抛错，替代旧「解析 0 条」启发式）──
    let envelope;
    try {
        const res = await fetch('/assets/data/key.envelope');
        if (!res.ok) throw new Error(`key.envelope 拉取失败 (${res.status})`);
        envelope = JSON.parse(await res.text());
    } catch (e) {
        status.textContent = '信封文件不存在或不可读（迁移前旧数据格式，请先跑 tools/migrate_diary.js）';
        status.className = 'error';
        console.error('[diary_tree] envelope fetch:', e);
        return;
    }
    try {
        diaryDek = await window.DiaryCrypto.openEnvelope(password, envelope);
    } catch (e) {
        status.textContent = '密码错误';
        status.className = 'error';
        return;
    }

    // ── ② 拉 manifest（几 KB 聚合索引），解密后直接建树渲染 —— 首屏不含任何正文 ──
    status.textContent = '正在解密索引…';
    let manifestEnc;
    try {
        const res = await fetch('/assets/data/manifest.enc');
        if (!res.ok) throw new Error(`manifest.enc 拉取失败 (${res.status})`);
        manifestEnc = await res.text();
    } catch (e) {
        status.textContent = '索引文件不存在或不可读';
        status.className = 'error';
        console.error('[diary_tree] manifest fetch:', e);
        return;
    }
    try {
        manifestData = JSON.parse(await window.DiaryCrypto.decryptData(diaryDek, manifestEnc));
    } catch (e) {
        status.textContent = '索引解密失败（数据可能损坏）';
        status.className = 'error';
        console.error('[diary_tree] manifest decrypt:', e);
        return;
    }

    allEntries = skeletonFromManifest(manifestData);
    window.allEntries = allEntries;
    treeData = buildTree(allEntries);

    console.log('[diary_tree] manifest:', allEntries.length, 'entries,',
        Object.keys(manifestData.days).length, 'days,',
        manifestData.years.length, 'years [' + manifestData.years[0] + '-' + manifestData.years[manifestData.years.length - 1] + ']');

    document.getElementById('auth-overlay').classList.add('hidden');
    resize();
    rebuildAll();
    fitAllYears();
    render();

    const dayCount = Object.keys(manifestData.days).length;
    status.textContent = `已载入索引：${manifestData.years.length} 年 / ${dayCount} 天 / ${allEntries.length} 篇（正文按需解密）`;

    // ── ③ B 端兜底：window.files 有、manifest 没有的月份，后台静默合并 ──
    mergeMissingMonths();   // 不 await —— 不挡首屏
};

// Allow Enter key to submit
document.getElementById('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('unlockBtn').click();
});

// ═══ Init ═══
window.addEventListener('resize', resizeAndRender);
resize();
render();
</script>
<script src="/assets/js/last-updated.js" data-corner="top-right"></script>
