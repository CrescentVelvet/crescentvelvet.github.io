title: "日志时间轴"
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志时间轴</title>

    <style>
        :root {
            --bg: #f7f4ee;
            --panel-bg: rgba(255, 255, 255, 0.78);
            --panel-solid: #fffdf9;
            --text: #2f2a28;
            --muted: #877d78;
            --accent: #b86944;
            --accent-hover: #965236;
            --accent-soft: rgba(184, 105, 68, 0.16);
            --border: rgba(126, 93, 73, 0.16);
            --shadow: 0 18px 56px rgba(88, 61, 41, 0.13);
            --radius: 20px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background:
                radial-gradient(circle at 18% 12%, rgba(255, 206, 161, 0.36), transparent 34%),
                radial-gradient(circle at 86% 8%, rgba(171, 190, 255, 0.22), transparent 30%),
                linear-gradient(135deg, #faf7f1 0%, #f2efe9 52%, #f8f3eb 100%);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #auth-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top left, rgba(255, 198, 143, 0.44), transparent 34%),
                radial-gradient(circle at bottom right, rgba(131, 153, 224, 0.23), transparent 36%),
                rgba(248, 244, 238, 0.94);
            backdrop-filter: blur(16px);
        }
        #auth-overlay.hidden { display: none; }
        .auth-card {
            background: var(--panel-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.72);
            padding: 34px 28px 28px;
            width: 380px;
            max-width: 90vw;
            backdrop-filter: blur(24px);
        }
        .auth-card h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 8px;
            font-size: 1.65rem;
            letter-spacing: 0.08em;
        }
        .auth-card .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }
        .auth-card input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
            background: rgba(255,255,255,0.84);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-card input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }
        .auth-card button {
            width: 100%;
            padding: 10px 0;
            background: linear-gradient(135deg, #c8754d, #9f5a3f);
            color: #fff;
            border: none;
            border-radius: 999px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(184,105,68,0.24);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .auth-card button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 32px rgba(184,105,68,0.32);
        }
        .auth-card .error {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 8px;
            text-align: center;
        }
        .auth-card .loading {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 8px;
            text-align: center;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #canvas:active { cursor: grabbing; }
        #info-popup {
            position: fixed;
            z-index: 100;
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.78);
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(56,42,31,0.2);
            padding: 18px 24px;
            width: min(560px, calc(100vw - 24px));
            max-height: 84vh;
            overflow-y: auto;
            pointer-events: auto;
            display: none;
            font-size: 14px;
            line-height: 1.6;
            backdrop-filter: blur(22px);
        }
        #info-popup.visible {
            display: block;
            animation: floatIn 0.18s ease-out;
        }
        #info-popup h3 {
            color: rgba(66, 44, 32, 0.94);
            margin-bottom: 4px;
            font: 600 22px Georgia, "Times New Roman", serif;
            letter-spacing: 0.01em;
        }
        #info-popup .popup-meta {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }
        #info-popup .popup-meta .pdot {
            display: inline-block; width: 7px; height: 7px; border-radius: 50%;
            margin: 0 3px 0 10px; vertical-align: middle;
        }
        #info-popup .popup-preview {
            color: var(--text);
            max-height: 66vh;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 6px;
        }
        /* 篇级分节头 + 正文排版。
           定案：单栏长文 · 正文宋体 16px / 行高 1.95 / 段首缩进 2 字 · 段距 8px。
           宋体的字体栈必须给 ≥2 个候选：本机没有 "Songti SC"（探针实测它与通用回退同宽），
           只写一个会静默退到通用字体，而且退得毫无痕迹。 */
        #info-popup .dsec { margin-bottom: 18px; }
        #info-popup .dsec:last-child { margin-bottom: 0; }
        #info-popup .dsec-head {
            display: flex; align-items: baseline; gap: 8px;
            border-left: 3px solid rgba(126, 93, 73, 0.5);
            padding: 2px 0 2px 9px; margin-bottom: 8px;
        }
        #info-popup .dsec-head .dsec-no { font: 600 13px "Segoe UI","Microsoft YaHei",sans-serif; color: rgba(66,44,32,0.9); }
        #info-popup .dsec-head .dsec-cat { font: 400 13px "Segoe UI","Microsoft YaHei",sans-serif; color: rgba(91,74,64,0.85); }
        #info-popup .dsec-head .dsec-meta { margin-left: auto; font-size: 11px; color: rgba(135,125,120,0.9); }
        #info-popup .dsec-body {
            font-family: "Songti SC", "SimSun", Georgia, serif;
            font-size: 16px;
            line-height: 1.95;
            color: rgba(50, 36, 28, 0.92);
        }
        #info-popup .dsec-body .dpara { margin: 0 0 8px; text-indent: 2em; }
        #info-popup .dsec-body .dpara:last-child { margin-bottom: 0; }
        /* 惰性正文加载态：与 auth-status 的提示语同语言，节奏用细呼吸而非转圈 */
        #info-popup         .dsec-loading {
            padding: 18px 4px;
            font: 400 13px/1 "Segoe UI","Microsoft YaHei",sans-serif;
            color: rgba(135,125,120,0.85);
            text-align: center;
            animation: diary-loading-pulse 1.4s ease-in-out infinite;
        }
        #info-popup .dsec-error { animation: none; color: rgba(176, 74, 50, 0.95); }
        @keyframes diary-loading-pulse {
            0%, 100% { opacity: 0.55; }
            50%      { opacity: 1; }
        }
        /* Diary inline-highlight classes — reuse enc_reader's semantics but map
           them to the tree's category palette so colored spans fit the theme. */
        #info-popup .popup-preview .leisure-highlight { color: #d35f05; font-weight: 600; }
        #info-popup .popup-preview .dream-highlight   { color: #8A2BE2; font-weight: 600; }
        #info-popup .popup-preview .video-highlight   { color: #0056b3; font-weight: 600; }
        #info-popup .popup-preview .review-highlight  { color: #0d9488; background: rgba(13,148,136,0.10); border-left: 3px solid #0d9488; padding-left: 6px; }
        #info-popup .popup-preview .date-highlight    { color: var(--accent); font-weight: 700; }
        #info-popup .popup-preview p { margin: 0 0 6px; }
        #info-popup .popup-preview .popup-sep { display: block; color: var(--muted); font-size: 0.75rem; text-align: center; margin: 6px 0; opacity: 0.6; }
        #info-popup .popup-close {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--muted);
            padding: 0;
            line-height: 1;
        }
        /* 顶栏：原来左上角那张 360×110 的卡片式 HUD，正好压住第一年（2023）的年表头。
           而年表头只能待在"列顶"，所以这个问题不能靠挪年份的位置解决
           （竖排年份也试过，同样被压）—— 只能把 HUD 本身压成一条全宽细带。 */
        #tree-hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            height: 36px;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 0 18px;
            background: rgba(255, 255, 255, 0.74);
            border-bottom: 1px solid rgba(126, 93, 73, 0.12);
            color: var(--text);
            backdrop-filter: blur(18px);
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
        }
        #tree-hud .hud-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
            flex: 0 0 auto;
        }
        #tree-hud .hud-sep {
            width: 1px;
            height: 15px;
            background: rgba(126, 93, 73, 0.20);
            flex: 0 0 auto;
        }
        #tree-hud .hud-summary {
            color: var(--muted);
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #tree-hud .hud-right {
            margin-left: auto;
            /* 站点全局的「最后修改时间」角标固定在 top:8/right:8（z-index 900），
               会压在顶栏右端，所以这里给它让出位置。 */
            margin-right: 200px;
            color: var(--muted);
            font-size: 11px;
            flex: 0 0 auto;
        }
        #tree-hud .hud-right b { color: var(--accent); font-weight: 700; }
        #legend {
            position: fixed;
            bottom: 16px;
            left: 16px;
            z-index: 50;
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.72);
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(56,42,31,0.1);
            padding: 4px 6px;
            font-size: 12px;
            color: var(--muted);
            display: flex;
            gap: 2px;
            align-items: center;
            flex-wrap: wrap;
            backdrop-filter: blur(18px);
            pointer-events: auto;
        }
        /* 图例就是筛选器：可点击。压暗未选中项，让"哪一类写在哪几个月"一眼可见。 */
        #legend .lg {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 0;
            background: transparent;
            font: inherit;
            font-size: 12px;
            color: inherit;
            cursor: pointer;
            padding: 6px 11px;
            border-radius: 999px;
            transition: background .15s, opacity .15s;
        }
        #legend .lg:hover { background: rgba(126, 93, 73, 0.08); }
        #legend .lg b { font-weight: 600; opacity: 0.58; }
        #legend .lg.active {
            background: #fffdf9;
            box-shadow: inset 0 0 0 1px rgba(126, 93, 73, 0.28);
            color: var(--text);
        }
        #legend .lg.active b { opacity: 0.85; }
        #legend.filtering .lg:not(.active):not(.lg-reset) { opacity: 0.34; }
        #legend .lg-reset { color: var(--accent); }
        #legend span { display: flex; align-items: center; gap: 4px; }
        #legend .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        #zoom-panel {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 50;
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.72);
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(56,42,31,0.1);
            padding: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(18px);
        }
        #zoom-panel button {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.66);
            color: var(--accent);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        #zoom-panel button:hover {
            background: #fff;
            transform: translateY(-1px);
        }
        #zoom-indicator {
            min-width: 104px;
            padding: 0 8px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            white-space: nowrap;
        }
        /* ═══ 单月聚焦（原位浮层）═══
           卡片原地浮起、盖住邻居，布局一点不变。背景只压暗 0.38 ——
           压暗太重就看不出"布局没变"，而背景里的柱子正是它在证明这一点。
           用 DOM 而不是 canvas：右列「当月目录」需要滚动，canvas 里做滚动得不偿失。 */
        #focus-backdrop {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(250, 247, 241, 0.38);
            display: none;
        }
        #focus-backdrop.visible { display: block; animation: fadeIn 0.18s ease-out; }
        #month-focus {
            position: fixed;
            z-index: 61;
            background: var(--panel-solid);
            border: 1px solid rgba(126, 93, 73, 0.20);
            border-radius: 16px;
            box-shadow: 0 22px 60px rgba(60, 38, 24, 0.28);
            padding: 18px 22px 14px;
            display: none;
            flex-direction: column;
        }
        #month-focus.visible { display: flex; animation: floatIn 0.18s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #month-focus .mf-head { display: flex; align-items: center; gap: 10px; }
        #month-focus .mf-title { font: 600 21px Georgia,"Times New Roman",serif; color: rgba(66,44,32,0.94); }
        #month-focus .mf-seal {
            display: none; align-items: center; gap: 6px;
            color: rgba(160,80,58,0.92); font-size: 11px;
        }
        /* 月相语言：常显（有日志就显示盈亏名），不再只满月出现。 */
        #month-focus.has-moon .mf-seal { display: inline-flex; }
        #month-focus .mf-seal i {
            width: 12px; height: 12px; border-radius: 50%;
            background: radial-gradient(circle,
                rgba(255,196,110,0.5) 0%, rgba(255,196,110,0.5) 68%,
                rgba(255,196,110,0) 100%);
            background-color: #eaba56;
            box-shadow: 0 0 4px rgba(255,196,110,0.55);
        }
        #month-focus .mf-stats { margin-left: auto; color: var(--muted); font-size: 12px; }
        #month-focus .mf-close {
            border: 0; background: transparent; cursor: pointer; color: var(--muted);
            font-size: 20px; line-height: 1; padding: 1px 6px; border-radius: 6px;
        }
        #month-focus .mf-close:hover { background: rgba(126, 93, 73, 0.10); }
        #month-focus .mf-bar {
            display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 12px 0 8px;
        }
        #month-focus .mf-bar i { display: block; }
        #month-focus .mf-legend {
            display: flex; flex-wrap: wrap; gap: 4px 14px;
            font-size: 11px; color: rgba(91, 74, 64, 0.82);
        }
        #month-focus .mf-legend span { display: inline-flex; align-items: center; gap: 5px; }
        #month-focus .mf-legend .dot { width: 7px; height: 7px; }
        #month-focus .mf-body { display: flex; gap: 22px; margin-top: 12px; min-height: 0; }
        #month-focus .mf-cal { flex: 0 0 auto; }
        #month-focus .mf-list {
            flex: 1 1 auto; min-width: 0; overflow-y: auto;
            max-height: 268px; padding-right: 4px;
        }
        #month-focus .mf-list h4 {
            font: 600 12px "Segoe UI","Microsoft YaHei",sans-serif;
            color: rgba(66,44,32,0.86); margin: 0 0 6px;
        }
        #month-focus .mf-row {
            display: flex; align-items: baseline; gap: 6px;
            padding: 5px 2px; border-bottom: 1px solid rgba(126,93,73,0.08); cursor: pointer;
        }
        #month-focus .mf-row:hover { background: rgba(126, 93, 73, 0.06); }
        #month-focus .mf-row .dot { width: 7px; height: 7px; flex: 0 0 auto; }
        #month-focus .mf-row .d { font-size: 11px; color: rgba(91,74,64,0.92); white-space: nowrap; }
        #month-focus .mf-row .w { margin-left: auto; font-size: 11px; color: rgba(135,125,120,0.92); white-space: nowrap; }
        #month-focus .mf-row .x {
            font-size: 11px; color: rgba(66,44,32,0.62);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%;
        }
        /* 目录摘要的骨架占位线：宽度固定 34 字位，与真摘要同视觉重量 */
        #month-focus .mf-loading-line {
            display: inline-block; width: 120px; height: 9px;
            border-radius: 4px; background: rgba(126,93,73,0.14);
            animation: diary-loading-pulse 1.4s ease-in-out infinite;
        }
        #month-focus .mf-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
        #month-focus .mf-foot button {
            border: 0; background: rgba(184, 105, 68, 0.10); color: rgba(150, 82, 54, 0.95);
            font-size: 11px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
        }
        #month-focus .mf-foot button:hover { background: rgba(184, 105, 68, 0.18); }
        #month-focus .mf-hint { margin-left: auto; font-size: 11px; color: rgba(135, 125, 120, 0.9); }
        #month-focus .mf-cal table { border-collapse: collapse; }
        #month-focus .mf-cal th {
            font: 400 10px "Microsoft YaHei",sans-serif;
            color: rgba(135, 125, 120, 0.8); padding: 1px 0 5px; font-weight: 400;
        }
        #month-focus .mf-cal td { padding: 1.5px; }
        #month-focus .mf-cell {
            width: 38px; height: 38px; border-radius: 6px;
            display: flex; align-items: flex-start; justify-content: flex-start;
            padding: 4px 0 0 5px; box-sizing: border-box;
            font: 600 11px "Segoe UI",sans-serif; color: rgba(255,255,255,0.96);
            position: relative; cursor: pointer;
        }
        #month-focus .mf-cell.empty {
            background: transparent !important;
            box-shadow: inset 0 0 0 1px rgba(126, 93, 73, 0.16);
            color: rgba(135, 125, 120, 0.55); font-weight: 400; cursor: default;
        }
        #month-focus .mf-cell .multi {
            position: absolute; top: 4px; right: 5px;
            width: 5px; height: 5px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
        }
        #month-focus .mf-cell:not(.empty):hover { box-shadow: 0 0 0 2px rgba(184, 105, 68, 0.55); }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @media (max-width: 1100px) {
            #tree-hud .hud-right { display: none; }
        }
        @media (max-width: 600px) {
            #tree-hud { gap: 9px; padding: 0 11px; }
            #legend { bottom: 64px; left: 8px; gap: 8px; font-size: 10px; padding: 6px 10px; max-width: calc(100vw - 16px); }
            #zoom-panel { bottom: 8px; right: 8px; }
            #info-popup { max-width: 90vw; max-height: 70vh; }
        }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-card">
        <h1>日志时间轴</h1>
        <p class="subtitle">输入密码以解密并浏览日志树状时间轴</p>
        <input type="password" id="password" placeholder="请输入解密密码" autofocus>
        <button id="unlockBtn">解密</button>
        <div id="auth-status"></div>
    </div>
</div>

<canvas id="canvas"></canvas>

<div id="tree-hud">
    <div class="hud-title">日志时间轴</div>
    <div class="hud-sep"></div>
    <div class="hud-summary" id="hud-summary">解密后可以缩小看月份概览，放大看每日记录。</div>
    <div class="hud-right" id="hud-scale"></div>
</div>

<div id="focus-backdrop"></div>
<div id="month-focus">
    <div class="mf-head">
        <div class="mf-title" id="mf-title"></div>
        <span class="mf-seal"><i></i><span id="mf-seal-name"></span></span>
        <div class="mf-stats" id="mf-stats"></div>
        <button class="mf-close" id="mf-close" type="button" title="收起">&times;</button>
    </div>
    <div class="mf-bar" id="mf-bar"></div>
    <div class="mf-legend" id="mf-legend"></div>
    <div class="mf-body">
        <div class="mf-cal"><table id="mf-cal"></table></div>
        <div class="mf-list"><h4>当月目录</h4><div id="mf-list-rows"></div></div>
    </div>
    <div class="mf-foot">
        <button id="mf-prev" type="button">‹ 上月</button>
        <button id="mf-next" type="button">下月 ›</button>
        <span class="mf-hint">点日期查看当天日志 · Esc 收起</span>
    </div>
</div>

<div id="info-popup">
    <button class="popup-close" id="popup-close">&times;</button>
    <h3 id="popup-title"></h3>
    <div class="popup-meta" id="popup-meta"></div>
    <div class="popup-preview" id="popup-preview"></div>
</div>

<div id="legend"></div>
<div id="zoom-panel" aria-label="缩放控制">
    <button id="zoomOut" type="button" title="缩小">−</button>
    <button id="zoomReset" type="button" title="重置">⌂</button>
    <button id="zoomIn" type="button" title="放大">+</button>
    <div id="zoom-indicator">100% · 月概览</div>
</div>

<script src="/assets/js/diary-crypto.js"></script>
<script src="/assets/js/diary-parse.js"></script>
<script>
window.files = [
    {% for file in site.static_files %}
    {% if file.path contains '/assets/data/' and file.extname == '.txt' %}
        '{{ file.name }}',
    {% endif %}
    {% endfor %}
];
</script>
<script>
window.files = window.files.filter(f => f && f.trim());

// ═══ Global state ═══
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const popup = document.getElementById('info-popup');
const popupTitle = document.getElementById('popup-title');
const popupMeta = document.getElementById('popup-meta');
const popupPreview = document.getElementById('popup-preview');
const zoomIndicator = document.getElementById('zoom-indicator');
const hudSummary = document.getElementById('hud-summary');
const hudScale = document.getElementById('hud-scale');

let allEntries = [];       // { year, month, day, text, wordCount, paraCount, category }
let treeData = {};         // year → month → day → entries[]
let viewX = 0, viewY = 0;
let scale = 1;
const SCALE_MIN = 0.15, SCALE_MAX = 5;

// ═══ LOD：由 k = scale / fitScale 驱动 ═══
// k 是「相对 fitAllYears 的倍数」，**不是绝对像素** —— 绝对阈值在"只有两年"或大屏上，
// 静止态本身就把阈值越过去了，用户还没想细看就先跳进了下一档。
// 两个阈值各自只当"闸门"，底下还要再叠一层「装得下才画」的护栏（见 drawMonthBars）。
const LOD = { ROUND: 1.30, NUM: 1.60 };
function zoomRatio() {
    return scale / Math.max(0.0001, layout.fitScale || 1);
}

// ═══ 柱高标尺（分段堆叠柱）═══
// 分母 = 全局「单日合计字数」最大值 × DENOM_RATIO，且**全局统一** ⇒ 柱高可跨月比较。
// 实测（4 年 41 月样本）：截平 13.2%、中位日填 47%。分母放大到 0.5× 则中位日只填 33%（卡片半空），
// 缩到 0.25× 截平升到 22.3%（最忙的月份四成日子被压平）。完整取舍表见
// _design/diary_tree_redesign.md 第 2.1 节。
const DENOM_RATIO = 0.35;
// 季节淡彩：月 → 色调（春青 / 夏赭 / 秋金 / 冬黛）。仅作底纹，不承载数据。
const SEASON_TINT = (m) => (m >= 3 && m <= 5) ? [124, 158, 92]
    : (m >= 6 && m <= 8) ? [192, 144, 74]
    : (m >= 9 && m <= 11) ? [186, 118, 56] : [106, 122, 152];
let scaleAxis = { denom: 0, globalMaxDay: 0, clipDays: 0, dayCount: 0 };

// 标尺从「已缓存的单日统计」里推，保证与柱高用的是同一份数据。
function computeScaleAxis() {
    let maxDay = 0;
    for (const st of statsCache.day.values()) {
        if (st.wordCount > maxDay) maxDay = st.wordCount;
    }
    const denom = Math.max(1, maxDay * DENOM_RATIO);
    let clip = 0;
    for (const st of statsCache.day.values()) {
        if (st.wordCount > denom) clip++;
    }
    scaleAxis = {
        denom,
        globalMaxDay: maxDay,
        clipDays: clip,
        dayCount: statsCache.day.size
    };
    // 截平比例是**数据相关**的：同一套 DENOM_RATIO 在不同分布上差别很大
    // （示意页样本 13%、dev 样本 30%）。所以把它打到控制台，便于拿真实数据回来调这一个常量。
    console.log('[diary_tree] 柱高标尺 denom=' + Math.round(denom)
        + ' 全局最大单日=' + maxDay
        + ' 截平=' + clip + '/' + statsCache.day.size + ' 天 ('
        + (clip / Math.max(1, statsCache.day.size) * 100).toFixed(1) + '%)');
}
let dragging = false;
let dragStartX = 0, dragStartY = 0;
let dragViewX = 0, dragViewY = 0;
let hoveredNode = null;
let selectedNode = null;
let animationId = null;

// Layout computed values (recomputed on resize / data change)
let layout = { years: [], yearWidth: 0, monthHeight: 0, colGap: 0, totalWidth: 0, totalHeight: 0, fitScale: 1 };

// Cached stats (recomputed on data change). draw() reads these instead of
// re-iterating every entry each frame.
let statsCache = { month: new Map(), day: new Map(), year: new Map(), all: null };

// rAF coalescing: multiple input events in one frame collapse into a single draw.
let renderPending = false;

// Touch state
let touchDist0 = 0;
let touchScale0 = 1;
let touchStartX = 0;
let touchStartY = 0;
let touchMoved = false;
let touchWasZooming = false;

// ═══ Coordinate convention ═══
// Layout is computed once at scale = 1 (base/world coordinates). Visual zoom is
// applied uniformly in draw() via ctx.scale(scale, scale). Because world
// coordinates no longer depend on `scale`, the anchor math in zoomAt() keeps the
// point under the cursor fixed — no sideways drift.

function monthGap() {
    return 7;
}

// 顶部让位 = 36px 全宽顶栏 + 60px 年表头（衬线年份 / 统计 / 渐隐横线 / 365 概览条）。
// 底部再留 50px 给图例与缩放控件。年表头必须占据列顶，所以这段空间不能让给任何浮层。
const TOPBAR_H = 36;
const HEADER_BAND = 60;
const BOTTOM_BAND = 50;
const TOP_OFFSET = TOPBAR_H + HEADER_BAND;

function getMonthY(month) {
    return (month - 1) * (layout.monthHeight + monthGap()) + TOP_OFFSET;
}

// 原 dayNodePositions()（把 30+ 个日圆点排成自适应网格）已删除 ——
// 日粒度改由柱区的 31 个固定槽位表达，不再需要"为了塞下圆点而逐步缩小半径"这套布局。

function getViewMode() {
    // 用 k（相对 fitAllYears 的倍数）而不是绝对 scale，含义是"用户相对默认视图放大了多少"。
    const k = zoomRatio();
    if (k >= LOD.NUM) return '日详情';
    if (k >= LOD.ROUND) return '日节点';
    return '月概览';
}

function formatCompactNumber(num) {
    // 单一中文缩写：≥10000 用「万」，否则直接数字。避免「k字」与「万字」混用。
    if (num >= 10000) return (num / 10000).toFixed(num >= 100000 ? 0 : 1) + '万';
    return String(num);
}

// ═══ 按需解密层（manifest 架构）═══
// 解锁时只解密 manifest（聚合统计，无正文），时间轴全部即时渲染；
// 正文在「点开日详情/月聚焦」时才 fetch+解密对应月份文件（WebCrypto 亚秒级）。
// 桥接策略：manifest 聚合 → 伪 entry 骨架（wordCount/paraCount/category 齐全、
// text=''）喂给现有 treeData/statsCache 管线，渲染层零改动；
// 正文懒加载后回填到同一批 entry 对象上（引用共享，statsCache 自动"长出"正文）。
const monthBodies = new Map();     // 'YYYY-MM' → 明文（已解密缓存）
const inflightMonths = new Map();  // 'YYYY-MM' → Promise<string>
let diaryDek = null;               // Uint8Array(32)，解锁后驻内存
let manifestData = null;           // 解密后的 manifest 对象

// 月份文件名：2026-09.txt（与 Jekyll 静态文件列举一致）
function monthFileOf(year, month) {
    return `${year}-${String(month).padStart(2, '0')}.txt`;
}

// 取某月正文（解密+解析+回填）。缓存命中直接返回，否则 fetch+解密一次。
// 失败时清理 inflight —— 下次再点该月会重新尝试（网络抖动可自愈）。
async function loadMonthBody(year, month) {
    const mk = `${year}-${String(month).padStart(2, '0')}`;
    if (monthBodies.has(mk)) return monthBodies.get(mk);
    if (inflightMonths.has(mk)) return inflightMonths.get(mk);
    const p = (async () => {
        try {
            const res = await fetch(`/assets/data/${monthFileOf(year, month)}`);
            if (!res.ok) throw new Error(`月份文件 ${monthFileOf(year, month)} 拉取失败 (${res.status})`);
            const ct = await res.text();
            const pt = await window.DiaryCrypto.decryptData(diaryDek, ct);
            monthBodies.set(mk, pt);
            return pt;
        } finally {
            inflightMonths.delete(mk);
        }
    })();
    inflightMonths.set(mk, p);
    return p;
}

// 解密月正文并把 text 回填到 treeData 里的伪 entry 上（不改 statsCache —— 字数等
// 聚合字段骨架期就已齐全）。回填后刷新当前打开的弹窗/月聚焦。
// ⚠️ 调用方不 await（不阻塞首帧）：所有失败在此消化，绝不向上抛 —— 否则
// 无 await 的调用点会变成 unhandled rejection，弹窗卡在加载态。
const hydrateFailed = new Set();   // 'YYYY-MM'，拉取/解密失败的月份（可重试：再次点开会重新 load）
async function hydrateMonth(year, month) {
    const mk = `${year}-${String(month).padStart(2, '0')}`;
    try {
        await loadMonthBody(year, month);
    } catch (err) {
        console.error('[diary_tree] 正文解密失败:', monthFileOf(year, month), err.message);
        hydrateFailed.add(mk);
        refreshAfterHydrate(year, month);
        return;
    }
    hydrateFailed.delete(mk);
    const md = treeData[year] && treeData[year][month];
    if (!md) return;
    const file = monthFileOf(year, month);
    for (const day of Object.keys(md).map(Number)) {
        const skeleton = md[day];       // 伪 entry 数组（引用稳定）
        const real = DiaryParse.parseDecryptedText(monthBodies.get(mk), file).filter(e => e.day === day);
        // 按序回填：骨架与真实条目按 (day, 顺序) 一一对应（manifest 统计口径 = parseDecryptedText）
        let ri = 0;
        for (const e of skeleton) {
            const r = real[ri];
            if (!r) break;
            e.text = r.text;
            e.suffix = r.suffix;
            ri++;
        }
    }
    refreshAfterHydrate(year, month);
}

// 惰性加载完成后刷新当前展示（弹窗或月聚焦），保持位置不跳。
function refreshAfterHydrate(year, month) {
    if (selectedNode && selectedNode.type === 'day' && selectedNode.year === year && selectedNode.month === month) {
        showPopup(selectedNode, parseFloat(popup.style.left) + 40, parseFloat(popup.style.top) + 40);
    } else if (focusRef && focusRef.year === year && focusRef.month === month) {
        showMonthFocus(year, month);
    }
}

// manifest 聚合 → 伪 entry 骨架。每天 N 篇 = N 个骨架（分段柱需要篇级分段），
// 每篇 w/p/c 从 manifest.days['YYYY-MM-DD'] 按序取。
function skeletonFromManifest(mf) {
    const out = [];
    for (const dk of Object.keys(mf.days).sort()) {
        const [y, m, d] = dk.split('-').map(Number);
        const list = mf.days[dk];
        for (const it of list) {
            out.push({
                year: y, month: m, day: d,
                text: '', wordCount: it.w, paraCount: it.p,
                category: it.c, source: `manifest:${dk}`
            });
        }
    }
    return out;
}

// 兜底合并（A+B 混合的 B 端）：window.files 里有、manifest 没有的月份，
// 当场解密合并进骨架。新文件没进 manifest 也不会丢。
async function mergeMissingMonths() {
    const known = new Set(Object.keys(manifestData.months || {}));
    const missing = window.files.filter(f => /^[0-9]{4}-[0-9]{2}\.txt$/.test(f) && !known.has(f.slice(0, -4)));
    for (const f of missing) {
        const mk = f.slice(0, -4);
        const [y, m] = mk.split('-').map(Number);
        try {
            await loadMonthBody(y, m);
            const entries = DiaryParse.parseDecryptedText(monthBodies.get(mk), f);
            for (const e of entries) {
                allEntries.push(e);
                if (!treeData[e.year]) treeData[e.year] = {};
                if (!treeData[e.year][e.month]) treeData[e.year][e.month] = {};
                if (!treeData[e.year][e.month][e.day]) treeData[e.year][e.month][e.day] = [];
                treeData[e.year][e.month][e.day].push(e);
            }
        } catch (e) {
            console.warn('[diary_tree] 兜底月份失败:', f, e.message);
        }
    }
    if (missing.length) {
        rebuildAll();
        console.log('[diary_tree] 兜底合并了', missing.length, '个 manifest 外月份:', missing.join(', '));
    }
}

function getMonthEntries(year, month) {
    const monthData = treeData[year] && treeData[year][month] ? treeData[year][month] : {};
    const entries = [];
    for (const day of Object.keys(monthData).map(Number).sort((a, b) => a - b)) {
        entries.push(...monthData[day]);
    }
    return entries;
}

function dominantCategory(entries) {
    const counts = entries.reduce((acc, entry) => {
        acc[entry.category] = (acc[entry.category] || 0) + 1;
        return acc;
    }, {});
    return Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || 'normal';
}

function daysInMonth(year, month) {
    // day 0 of next month = last day of this month (month is 1-based here).
    return new Date(year, month, 0).getDate();
}

function getMonthStats(year, month) {
    const monthData = treeData[year] && treeData[year][month] ? treeData[year][month] : {};
    const days = Object.keys(monthData).map(Number).sort((a, b) => a - b);
    const entries = getMonthEntries(year, month);
    const wordCount = entries.reduce((sum, entry) => sum + entry.wordCount, 0);
    const paraCount = entries.reduce((sum, entry) => sum + entry.paraCount, 0);
    const dayCount = days.length;
    return {
        days,
        dayCount,
        entryCount: entries.length,
        wordCount,
        paraCount,
        category: dominantCategory(entries),
        isFull: dayCount > 0 && dayCount === daysInMonth(year, month),
        // 月相覆盖率：有日志天数 / 当月天数，0~1。驱动月相章的盈亏。
        dayRatio: daysInMonth(year, month) > 0 ? dayCount / daysInMonth(year, month) : 0,
        entries
    };
}

function getDayStats(year, month, day) {
    const entries = treeData[year] && treeData[year][month] && treeData[year][month][day]
        ? treeData[year][month][day]
        : [];
    const wordCount = entries.reduce((sum, entry) => sum + entry.wordCount, 0);
    const paraCount = entries.reduce((sum, entry) => sum + entry.paraCount, 0);
    return {
        entries,
        entryCount: entries.length,
        wordCount,
        paraCount,
        category: dominantCategory(entries)
    };
}

function getYearStats(year) {
    const yearData = treeData[year] || {};
    let dayCount = 0;
    let entryCount = 0;
    let wordCount = 0;
    let paraCount = 0;
    for (const month of Object.keys(yearData).map(Number)) {
        const stats = getMonthStats(year, month);
        dayCount += stats.dayCount;
        entryCount += stats.entryCount;
        wordCount += stats.wordCount;
        paraCount += stats.paraCount;
    }
    return {
        monthCount: Object.keys(yearData).length,
        dayCount,
        entryCount,
        wordCount,
        paraCount
    };
}

function getAllStats() {
    return layout.years.reduce((acc, yl) => {
        const stats = getYearStats(yl.year);
        acc.yearCount += 1;
        acc.monthCount += stats.monthCount;
        acc.dayCount += stats.dayCount;
        acc.entryCount += stats.entryCount;
        acc.wordCount += stats.wordCount;
        return acc;
    }, { yearCount: 0, monthCount: 0, dayCount: 0, entryCount: 0, wordCount: 0 });
}

// ═══ Date parsing ═══
// 解析器三件套（REVIEW_REF_RE / extractDateFromText / classifyEntry /
// parseDecryptedText）已抽到 /assets/js/diary-parse.js（window.DiaryParse），
// 与 enc_reader / text_processor / tools/migrate_parse.js 共享同一份实现。

// ═══ Build tree ═══
function buildTree(entries) {
    const tree = {};
    for (const e of entries) {
        if (!tree[e.year]) tree[e.year] = {};
        if (!tree[e.year][e.month]) tree[e.year][e.month] = {};
        if (!tree[e.year][e.month][e.day]) tree[e.year][e.month][e.day] = [];
        tree[e.year][e.month][e.day].push(e);
    }
    return tree;
}

// ═══ Layout computation ═══
function computeLayout() {
    const years = Object.keys(treeData).map(Number).filter(y => y >= 2000).sort((a, b) => a - b);
    if (years.length === 0) { layout = { years: [], yearWidth: 0, monthHeight: 0, colGap: 0, totalWidth: 0, totalHeight: 0, fitScale: 1 }; return; }

    // Base layout at scale = 1, in CSS pixels. The drawing context is already
    // scaled by DPR (see resize), so all coordinates are CSS pixels. Visual zoom
    // is applied separately via ctx.scale(scale, scale) in draw().
    const w = canvas._w || window.innerWidth;
    const h = canvas._h || window.innerHeight;
    const colGap = 24;
    const yearWidth = Math.max((w - colGap * (years.length + 1)) / years.length, 120);
    const monthCount = 12;
    const gap = monthGap();
    // 12 张卡（高 0.90×monthHeight，居中于各自槽位）+ 11 个槽间距必须塞进可用高度：
    //   11×(monthHeight+gap) + 0.05×monthHeight + 0.90×monthHeight ≤ availH
    //   ⇒ monthHeight ≤ (availH − 11×gap) / 11.95
    const availH = h - TOP_OFFSET - BOTTOM_BAND;
    const monthHeight = Math.max((availH - gap * 11) / 11.95, 22);

    // Set scalar fields first so getMonthY() (which reads layout.monthHeight)
    // is correct when we build per-month geometry below.
    layout.yearWidth = yearWidth;
    layout.monthHeight = monthHeight;
    layout.colGap = colGap;
    layout.totalWidth = colGap + years.length * (yearWidth + colGap);
    layout.totalHeight = TOP_OFFSET + monthCount * (monthHeight + gap) + 16;
    // fitScale 随布局一起算：LOD 的 k 就是相对它定义的，改窗口宽度会自动跟着更新。
    layout.fitScale = Math.max(SCALE_MIN, Math.min(1, w / Math.max(1, layout.totalWidth)));

    // Pre-compute every month's card geometry and day-node grid so draw() and
    // hitTest() can read cached values instead of recomputing per frame.
    layout.years = years.map((year, yi) => {
        const x = colGap + yi * (yearWidth + colGap);
        const months = [];
        for (let m = 1; m <= 12; m++) {
            const days = treeData[year] && treeData[year][m] ? Object.keys(treeData[year][m]).map(Number).sort((a, b) => a - b) : [];
            const myOff = getMonthY(m);
            const cx = x + yearWidth / 2;
            const cy = myOff + monthHeight / 2;
            const padX = 7;
            const cardX = x + padX;
            const cardW = yearWidth - padX * 2;
            const cardH = Math.max(monthHeight * 0.90, 20);
            const cardY = cy - cardH / 2;
            const cardR = Math.min(cardH / 2, 10);
            const headerH = 16;
            // 柱区几何：左侧 10px 给主导分类竖标（cardX+4.5，宽 2.5），右侧只留 5px ——
            // 左缘有竖标和月序压阵，右缘什么都没有，收得更紧些。上下各留 19/5 px。
            // 月序不再独占一列 —— 它画在最上层（深色衬线字），高柱从下面穿过也压不住它。
            // 固定 31 个横向槽位（而不是按当月天数均分），这样不同月份的同一天
            // 在视觉上落在同一相对位置，跨月对比时不会漂移。
            const plotL = cardX + 10;
            const plotR = cardX + cardW - 5;
            const plotT = cardY + 19;
            const plotB = cardY + cardH - 5;
            months.push({
                month: m, days, cx, cy, cardX, cardW, cardY, cardH, cardR,
                headerH, plotL, plotR, plotT, plotB,
                plotW: Math.max(plotR - plotL, 1),
                plotH: Math.max(plotB - plotT, 1)
            });
        }
        return { year, months, x, width: yearWidth };
    });
}

// ═══ Stats cache ═══
// Build per-month / per-day / per-year / global stats once (after data load).
// draw() then reads from Maps instead of re-iterating all entries every frame.
function rebuildStats() {
    statsCache.month = new Map();
    statsCache.day = new Map();
    statsCache.year = new Map();
    for (const yl of layout.years) {
        for (const mo of yl.months) {
            statsCache.month.set(`${yl.year}-${mo.month}`, getMonthStats(yl.year, mo.month));
            for (const day of mo.days) {
                statsCache.day.set(`${yl.year}-${mo.month}-${day}`, getDayStats(yl.year, mo.month, day));
            }
        }
        statsCache.year.set(`${yl.year}`, getYearStats(yl.year));
    }
    statsCache.all = getAllStats();
    computeScaleAxis();
}

// Coalesce render requests into a single rAF tick. High-frequency input
// (mousemove / touchmove / wheel) no longer triggers N full redraws per frame.
function requestRender() {
    if (renderPending) return;
    renderPending = true;
    requestAnimationFrame(() => { renderPending = false; render(); });
}

// Full rebuild: layout + stats. Call on data change or resize.
function rebuildAll() {
    computeLayout();
    rebuildStats();
    renderLegend();
    render();
}

// ═══ Category color ═══
// 分类筛选的压暗**只写在这一处**：未选中的分类统一 × 0.16。
// 柱子、分段、目录点、构成条、图例点全部经过这里，所以加一个筛选器不需要改任何绘制点。
const CATEGORY_FILTER = new Set();
const FILTER_DIM = 0.16;

function categoryColor(cat, alpha = 1) {
    const dim = (CATEGORY_FILTER.size && !CATEGORY_FILTER.has(cat)) ? FILTER_DIM : 1;
    const colors = {
        leisure: `rgba(211,95,5,${alpha * dim})`,
        dream: `rgba(138,43,226,${alpha * dim})`,
        video: `rgba(0,86,179,${alpha * dim})`,
        review: `rgba(13,148,136,${alpha * dim})`,
        normal: `rgba(74,144,226,${alpha * dim})`
    };
    return colors[cat] || colors.normal;
}

function categoryLabel(cat) {
    const labels = {
        leisure: '闲情逸致',
        dream: '梦幻空花',
        video: '做视频想法',
        review: '未来回顾',
        normal: '日常'
    };
    return labels[cat] || labels.normal;
}

// ═══ 图例 = 分类筛选器 ═══
// 原来的图例只是在"解释你看不见的颜色"，纯装饰。把它变成筛选器是
// **零新增 UI 面积换一个真功能**。压暗逻辑只在 categoryColor() 一处，
// 所以加这个功能不用碰任何绘制点。
function renderLegend() {
    const el = document.getElementById('legend');
    if (!el) return;
    const counts = {};
    for (const st of statsCache.day.values()) {
        for (const e of st.entries) counts[e.category] = (counts[e.category] || 0) + 1;
    }
    el.classList.toggle('filtering', CATEGORY_FILTER.size > 0);
    const items = ['leisure', 'dream', 'video', 'review', 'normal']
        .filter(cat => counts[cat])
        .map(cat =>
            `<button class="lg${CATEGORY_FILTER.has(cat) ? ' active' : ''}" data-cat="${cat}" type="button"`
            + ` title="点${CATEGORY_FILTER.has(cat) ? '取消' : ''}筛选：${categoryLabel(cat)}">`
            + `<span class="dot" style="background:${categoryColor(cat, 0.95)}"></span>`
            + `<span class="lg-name">${categoryLabel(cat)}</span><b>${counts[cat]}</b></button>`
        ).join('');
    el.innerHTML = items
        + (CATEGORY_FILTER.size ? '<button class="lg lg-reset" data-cat="" type="button">显示全部</button>' : '');
}

document.addEventListener('click', (ev) => {
    const btn = ev.target.closest && ev.target.closest('#legend .lg');
    if (!btn) return;
    const c = btn.dataset.cat;
    if (c === '') CATEGORY_FILTER.clear();
    else if (CATEGORY_FILTER.has(c)) CATEGORY_FILTER.delete(c);
    else CATEGORY_FILTER.add(c);
    renderLegend();
    render();
});

function yearColor(yi, total, alpha = 1) {
    const hue = 200 + (yi / Math.max(total - 1, 1)) * 80;
    return `hsla(${hue}, 55%, 70%, ${alpha})`;
}

// ═══ Hit testing ═══
// mx/my are world (base) coordinates: (clientX - viewX) / scale.
function hitTest(mx, my) {
    for (const yl of layout.years) {
        for (const mo of yl.months) {
            const cy = mo.cy;
            const cx = mo.cx;
            const cardX = mo.cardX;
            const cardW = mo.cardW;
            const cardH = mo.cardH;
            const cardY = mo.cardY;

            // 柱区：命中某一根柱子 = 选中那一天。柱子的横坐标就是命中判据，
            // 与 drawMonthBars() 共用同一套 31 槽几何，所以点击位置与看到的柱子一致。
            // 门槛用 k：只有"柱子已经长成格子"（LOD.ROUND）之后才切到日粒度。
            if (zoomRatio() >= LOD.ROUND && mo.plotH > 4
                && mx >= mo.plotL && mx <= mo.plotR && my >= mo.plotT && my <= mo.plotB) {
                const dim = daysInMonth(yl.year, mo.month);
                const step = mo.plotW / 31;
                const day = Math.floor((mx - mo.plotL) / step) + 1;
                if (day >= 1 && day <= dim) {
                    const ds = statsCache.day.get(`${yl.year}-${mo.month}-${day}`);
                    if (ds && ds.entryCount > 0) {
                        return {
                            type: 'day', year: yl.year, month: mo.month, day,
                            cx: mo.plotL + (day - 0.5) * step,
                            cy: (mo.plotT + mo.plotB) / 2,
                            radius: step / 2
                        };
                    }
                }
            }

            // Month summary card / node.
            if (mx >= cardX && mx <= cardX + cardW && my >= cardY && my <= cardY + cardH) {
                return { type: 'month', year: yl.year, month: mo.month, days: mo.days, cx, cy, x: cardX, y: cardY, w: cardW, h: cardH };
            }
        }
        // Year node
        const yTop = 12;
        const yBottom = yTop + 28;
        if (my >= yTop && my <= yBottom && mx >= yl.x && mx <= yl.x + yl.width) {
            return { type: 'year', year: yl.year, cx: yl.x + yl.width / 2, cy: yTop + 14, x: yl.x, y: yTop, w: yl.width, h: 28 };
        }
    }
    return null;
}

// ═══ Drawing ═══
function drawCurvePath(x1, y1, x2, y2) {
    const cpx = (x1 + x2) / 2;
    ctx.bezierCurveTo(cpx, y1, cpx, y2, x2, y2);
}

// ═══ 柱区绘制 ═══
// 分段堆叠柱：一根柱子 = 一天。柱高 ∝ 当日合计字数（**全局统一标尺**，故可跨月比较），
// 柱内自下而上按「篇」分段，段色 = 该篇分类、段深 = 该篇字数。
//
// 超出标尺的日子截平：柱体缩短 1.6px + 上方浮一条比柱窄 42% 的短线。
// ⚠️ 不能用「柱顶深色横线」标记截平 —— 柱内分段本身就承载信息，深色顶线会被读成
// 「这一天又多写了一篇」。任何柱顶装饰都必须与「分段」语义显式区分。
function drawMonthBars(year, mo) {
    const dim = daysInMonth(year, mo.month);
    const plotH = mo.plotH, base = mo.plotB;
    // 固定 31 槽（不按当月天数均分），让不同月份的同一天落在同一相对位置。
    const slot = mo.plotW / 31;
    const barW = Math.max(1, slot * 0.62);
    const denom = Math.max(1, scaleAxis.denom);
    const zr = zoomRatio();
    const showNum = zr >= LOD.NUM && slot * scale >= 10;   // k 当闸门，下面还有"装得下"的护栏

    for (let d = 1; d <= dim; d++) {
        const bx = mo.plotL + (d - 1) * slot + (slot - barW) / 2;
        const ds = statsCache.day.get(`${year}-${mo.month}-${d}`);
        if (!ds || ds.entryCount === 0) {
            // 无记录：只留一格 1px 的基线短划，让"断更"看得见。
            ctx.fillStyle = 'rgba(126, 93, 73, 0.13)';
            ctx.fillRect(bx, base - 1, barW, 1);
            continue;
        }
        const clipped = ds.wordCount > denom;
        const raw = Math.min(plotH, ds.wordCount / denom * plotH);
        const H = Math.max(3, raw - (clipped ? 1.6 : 0));
        const n = ds.entries.length;
        const segH = H / n;
        // 段高在屏幕上够大才拉开间隔、长圆角（"格子感"）。两个条件都要过：
        // k 闸门负责"用户想看多细"，segH*scale 护栏负责"物理上画不画得下"。
        const gap = (zr >= LOD.ROUND && segH * scale >= 7) ? 0.55 : 0;
        // 圆角还要受柱宽约束：barW 只有 ~4 世界像素，1.5 的半径会让柱顶变成"铅笔尖"。
        const rr = gap > 0 ? Math.min(1.5, (segH - gap) * 0.3, barW * 0.2) : 0;

        for (let k = 0; k < n; k++) {
            const e = ds.entries[k];
            const yt = base - (k + 1) * segH;
            ctx.fillStyle = categoryColor(e.category, 0.58 + Math.min(e.wordCount / 2600, 1) * 0.34);
            ctx.beginPath();
            if (rr > 0) {
                roundRect(ctx, bx, yt + gap * 0.5, barW, Math.max(segH - gap, 0.6), rr);
                ctx.fill();
            } else {
                ctx.fillRect(bx, yt, barW, segH);
            }
        }

        if (clipped) {
            // 浮线贴近柱顶 2.8px：太远会像一根游离的短线，太近又会被当成柱子的顶边。
            ctx.fillStyle = 'rgba(70, 46, 34, 0.42)';
            ctx.fillRect(bx + barW * 0.29, base - H - 2.8, barW * 0.42, 1.3);
        }

        // 日序号：写在中间那一段里，字号跟着段高走（永远不会溢出段）；
        // 下限 6/scale 保证屏幕上不小于 6px，否则宁可不写。
        if (showNum && segH * scale >= 7) {
            const midSeg = Math.floor(n / 2);
            const cy = base - midSeg * segH - segH / 2;
            const fontPx = Math.max(6 / scale, Math.min(segH * 0.62, slot * 0.66));
            ctx.font = `600 ${fontPx}px "Segoe UI","Microsoft YaHei",sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = Math.max(0.8, 1.6 / scale);
            ctx.strokeStyle = 'rgba(0,0,0,0.28)';
            ctx.strokeText(String(d), bx + barW / 2, cy);
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.fillText(String(d), bx + barW / 2, cy);
        }
    }
}

// 全年 365 格概览条：一格一天，色 = 当天主导分类，无记录留极淡底色。
// 它回答"这一年整体怎么走的"，比逐月扫 12 张卡片快得多。
function drawYearStrip(yl, y) {
    const colW = yl.width / 366;
    const barW = Math.max(1.1, colW * 0.9);
    let idx = 0;
    for (let m = 1; m <= 12; m++) {
        const dim = daysInMonth(yl.year, m);
        for (let d = 1; d <= dim; d++) {
            const ds = statsCache.day.get(`${yl.year}-${m}-${d}`);
            ctx.fillStyle = (ds && ds.entryCount > 0)
                ? categoryColor(ds.category, 0.85)
                : 'rgba(126, 93, 73, 0.10)';
            ctx.fillRect(yl.x + idx * colW, y, barW, 2.5);
            idx++;
        }
    }
}

function draw() {
    const w = canvas._w || window.innerWidth;
    const h = canvas._h || window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    // Warm paper-like background so canvas is never transparent.
    const bg = ctx.createLinearGradient(0, 0, w, h);
    bg.addColorStop(0, '#fbf8f2');
    bg.addColorStop(0.5, '#f3efe8');
    bg.addColorStop(1, '#fbf3e8');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // 纸纹：全画布极淡的竖向纤维（重复细线，不是位图噪点）。
    // 画在屏幕坐标里 —— 它是"纸"，不该跟着缩放/平移走。alpha 0.011~0.015 是实测的
    // 可见但绝不抢戏区间；再高就会在密集卡片区变成条纹噪声。
    for (let gx = 0; gx < w; gx += 5) {
        const gh = 40 + ((gx * 37) % 260);
        const gy = (gx * 53) % Math.max(1, h - gh);
        ctx.fillStyle = `rgba(126,93,73,${(0.011 + (gx % 3) * 0.004).toFixed(3)})`;
        ctx.fillRect(gx, gy, 0.8, gh);
    }

    const years = layout.years;

    // No-data state
    if (years.length === 0) {
        ctx.fillStyle = 'rgba(88, 61, 41, 0.62)';
        ctx.font = `16px "Segoe UI","Microsoft YaHei",sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('解密后，这里会长出一棵日志时间树', w / 2, h / 2);
        zoomIndicator.textContent = '100% · 月概览';
        if (hudSummary) hudSummary.textContent = '解密后可以缩小看月份概览，放大看每日记录。';
        if (hudScale) hudScale.innerHTML = '';
        return;
    }

    // Visible world bounds for culling (base/world coordinates).
    const visW0 = -viewX / scale;
    const visH0 = -viewY / scale;
    const visW1 = visW0 + w / scale;
    const visH1 = visH0 + h / scale;

    ctx.save();
    // viewX/viewY is the screen-space pan offset; scale zooms uniformly around
    // the origin AFTER translation, so zoomAt()'s cursor-anchor math holds.
    ctx.translate(viewX, viewY);
    ctx.scale(scale, scale);

    // Draw soft year background columns.
    for (let yi = 0; yi < years.length; yi++) {
        const yl = years[yi];
        const columnPad = 8;
        const columnX = yl.x - columnPad;
        const columnY = 8;
        const columnW = yl.width + columnPad * 2;
        const columnH = layout.totalHeight + 26;
        const columnGradient = ctx.createLinearGradient(columnX, columnY, columnX, columnY + columnH);
        columnGradient.addColorStop(0, yearColor(yi, years.length, 0.16));
        columnGradient.addColorStop(1, yearColor(yi, years.length, 0.045));
        ctx.fillStyle = columnGradient;
        ctx.strokeStyle = yearColor(yi, years.length, 0.22);
        ctx.lineWidth = 1;
        ctx.beginPath();
        roundRect(ctx, columnX, columnY, columnW, columnH, 26);
        ctx.fill();
        ctx.stroke();
    }

    // 蛇形脊柱与月间连接曲线已删除：它们不编码任何数据（脊柱只是一条固定在 6 月高度的装饰弧）。
    // 当月累计包络线后来也被删除（2026-09-15 评审：阅读成本高于它提供的「前紧后松」读数）。

    // Draw month summary cards and day detail nodes.
    for (const yl of years) {
        if (yl.x + yl.width + 8 < visW0 || yl.x - 8 > visW1) continue;
        for (const mo of yl.months) {
            if (mo.cardY + mo.cardH < visH0 || mo.cardY > visH1) continue;
            const cx = mo.cx;
            const cy = mo.cy;
            const cardX = mo.cardX;
            const cardW = mo.cardW;
            const cardH = mo.cardH;
            const cardY = mo.cardY;
            const cardR = mo.cardR;
            const stats = statsCache.month.get(`${yl.year}-${mo.month}`);
            const hasEntries = stats.entryCount > 0;
            const tint = SEASON_TINT(mo.month);

            // 卡片：季节淡彩 + 底部发丝线。
            // 替代原来的「橙色渐变 + 活跃度编码」—— 那套填充只在 fillAlpha 0.72~0.90
            // 之间摆动，肉眼分不出深浅，等于没有编码。
            ctx.fillStyle = `rgba(${tint.join(',')},${hasEntries ? 0.115 : 0.035})`;
            ctx.beginPath();
            roundRect(ctx, cardX, cardY + 3, cardW, cardH - 6, Math.min(7, cardR));
            ctx.fill();
            ctx.fillStyle = 'rgba(126, 93, 73, 0.10)';
            ctx.fillRect(cardX + 10, cardY + cardH - 2.5, cardW - 20, 1);

            // 月相章：月相盈亏 = 有日志天数比例（dayRatio），满月（写满全月）加金橙暖晕。
            // 替代原「满月才出现的赤陶方章」——现在每个月都有章，盈亏本身承载信息。
            // 位置贴卡片右上角（内缩 3px）；统计文字一律让位 17px，见下方 statsRight。
            if (hasEntries) {
                drawMoonSeal(ctx,
                    cardX + cardW - 3 - 6,   // 章心 x：右缘内缩 3px，r=6（章径 12px）
                    cardY + 3 + 6,           // 章心 y：顶缘内缩 3px
                    6,
                    stats.dayRatio,
                    stats.isFull);           // 满月才有暖晕
            }

            // 主导分类竖标 —— 分类色在静止视图里的第一处落点。
            if (hasEntries) {
                ctx.fillStyle = categoryColor(stats.category, 0.88);
                ctx.beginPath();
                roundRect(ctx, cardX + 4.5, cardY + 9, 2.5, Math.max(cardH - 22, 4), 1.25);
                ctx.fill();
            }

            // 分段堆叠柱：逐日字数与分类。
            if (hasEntries && mo.plotH > 10) {
                drawMonthBars(yl.year, mo);
            }

            // 月序（衬线）+ 统计 —— 画在柱子**之后**，否则高柱会盖住文字。
            // 月序从原来的 9px 彩色胶囊换成衬线体，与年表头、正文题头同一套字；
            // 统计去掉字数（柱高已经在表达它），只留「N天 · M篇」。
            if (scale > 0.52) {
                ctx.font = `600 15px Georgia,"Times New Roman",serif`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = hasEntries ? 'rgba(66, 44, 32, 0.78)' : 'rgba(66, 44, 32, 0.20)';
                ctx.fillText(String(mo.month), cardX + 11, cardY + 15);

                if (hasEntries) {
                    // 统计文字右端停在月相章左侧（章左缘 -15，再留 2px 间隙）——
                    // 比旧值（-28）右移 11px，两位数月份（「10/11/12」）不再压到文字。
                    const statsRight = cardX + cardW - 17;
                    ctx.textAlign = 'right';
                    ctx.font = `10px "Segoe UI","Microsoft YaHei",sans-serif`;
                    ctx.fillStyle = 'rgba(91, 74, 64, 0.66)';
                    ctx.fillText(`${stats.dayCount}天 · ${stats.entryCount}篇`, statsRight, cardY + 15);
                }
            } else if (scale > 0.36) {
                // At low zoom, just a faint centered month number.
                ctx.fillStyle = hasEntries ? 'rgba(91, 59, 42, 0.96)' : 'rgba(91, 59, 42, 0.4)';
                ctx.font = `700 10px "Segoe UI","Microsoft YaHei",sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(String(mo.month), cx, cy);
            }

            // Highlight hovered/selected month
            if (hoveredNode && hoveredNode.type === 'month' && hoveredNode.year === yl.year && hoveredNode.month === mo.month) {
                ctx.strokeStyle = 'rgba(184,105,68,0.62)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                roundRect(ctx, cardX - 2, cardY - 2, cardW + 4, cardH + 4, cardR + 2);
                ctx.stroke();
            }
            if (selectedNode && selectedNode.type === 'month' && selectedNode.year === yl.year && selectedNode.month === mo.month) {
                ctx.fillStyle = 'rgba(211,95,5,0.10)';
                ctx.beginPath();
                roundRect(ctx, cardX - 5, cardY - 5, cardW + 10, cardH + 10, cardR + 5);
                ctx.fill();
                ctx.strokeStyle = 'rgba(211,95,5,0.9)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                roundRect(ctx, cardX - 3, cardY - 3, cardW + 6, cardH + 6, cardR + 3);
                ctx.stroke();
            }

            // 原来的「日节点圆点」已删除：日粒度现在由柱区表达（一根柱子 = 一天），
            // 放大后柱子长圆角、写日序号，不再是另一套叠在卡片上的圆点。
            // 日详情改为经「单月聚焦浮层」进入（见 _design/diary_tree_redesign.md 2.3）。
        }
    }

    // 年表头：衬线年份大字 + 月/天/篇统计 + 总字数（右对齐）+ 渐隐横线 + 全年 365 格概览条。
    // 整块压在 TOP_OFFSET 之上（顶栏之下），所以第一年不再被任何浮层盖住。
    for (let yi = 0; yi < years.length; yi++) {
        const yl = years[yi];
        if (yl.x + yl.width < visW0 || yl.x > visW1) continue;
        const ys = statsCache.year.get(`${yl.year}`);
        const bandTop = TOPBAR_H + 4;

        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(66, 44, 32, 0.92)';
        ctx.font = `600 27px Georgia,"Times New Roman",serif`;
        ctx.fillText(yl.year, yl.x, bandTop + 26);

        ctx.fillStyle = 'rgba(135, 125, 120, 0.95)';
        ctx.font = `11px "Segoe UI","Microsoft YaHei",sans-serif`;
        ctx.fillText(`${ys.monthCount}个月 · ${ys.dayCount}天 · ${ys.entryCount}篇`, yl.x, bandTop + 44);

        ctx.textAlign = 'right';
        // 年总字数不用分类色 —— 它不是分类数据，不该跟着筛选器一起被压暗。
        ctx.fillStyle = 'rgba(160, 82, 54, 0.60)';
        ctx.font = `600 14px Georgia,serif`;
        ctx.fillText(formatCompactNumber(ys.wordCount) + '字', yl.x + yl.width, bandTop + 26);

        const rule = ctx.createLinearGradient(yl.x, 0, yl.x + yl.width, 0);
        rule.addColorStop(0, 'rgba(126,93,73,0.32)');
        rule.addColorStop(1, 'rgba(126,93,73,0.02)');
        ctx.fillStyle = rule;
        ctx.fillRect(yl.x, bandTop + 51, yl.width, 1);

        drawYearStrip(yl, bandTop + 55);
    }

    ctx.restore();

    const allStats = statsCache.all;
    const mode = getViewMode();
    zoomIndicator.textContent = `${Math.round(scale * 100)}% · ${mode}`;
    if (hudSummary) {
        hudSummary.textContent = `${allStats.yearCount} 年 · ${allStats.monthCount} 个月 · ${allStats.dayCount} 天 · ${allStats.entryCount} 篇 · ${formatCompactNumber(allStats.wordCount)} 字`;
    }
    if (hudScale) {
        // 标尺与截平比例直接摆出来：截平率是**数据相关**的，用户拿自己的数据看到这个数
        // 才知道 DENOM_RATIO 要不要调（改一个常量即可）。
        const clipPct = (scaleAxis.clipDays / Math.max(1, scaleAxis.dayCount) * 100).toFixed(1);
        hudScale.innerHTML = `柱高 ∝ 当日字数 · 满格 ${Math.round(scaleAxis.denom)} 字 · 截平 ${clipPct}% ｜ <b>${Math.round(scale * 100)}% · ${mode}</b>`;
    }
}

// ═══ 月相章 ═══
// 用月相盈亏表示当月有日志的天数比例：新月(仅轨道环)→娥眉→半月→凸月→满月。
// 亮面 = 蜜色，统一朝右上 45°（阴影圆心恒在左下），覆盖率精确映射可见面积
// （双圆透镜面积二分反解，不是目测）。满月 = 金盘 + 中晕·金橙（径向 2.35r）。
// 设计定稿见 .workbuddy/tmp/seal_preview/moon_phases_v2.html（2026-09-15 用户选定）。
function moonSealSolveX(c) {
    // 覆盖率 c → 遮挡圆偏移 x（单位 r=1 的双圆心距，透镜面积 = π·(1-c)）
    if (c >= 1) return 2;
    if (c <= 0) return 0;
    let lo = 0, hi = 2;
    for (let i = 0; i < 48; i++) {
        const x = (lo + hi) / 2;
        const lens = 2 * Math.acos(x / 2) - (x / 2) * Math.sqrt(Math.max(0, 4 - x * x));
        (1 - lens / Math.PI < c) ? lo = x : hi = x;
    }
    return (lo + hi) / 2;
}

function drawMoonSeal(ctx, cx, cy, r, ratio, withGlow) {
    const DIR = Math.PI / 4;                       // 明暗线法向：朝右上
    const RING = 'rgba(176,131,64,0.85)';          // 轨道环（暖棕，任何相位都有锚）
    const LIT = '#e3b34e';                         // 亮面：蜜色（用户选定）
    const FULL = '#eaba56';                        // 满月盘：蜜色提亮
    const FULL_DIM = '#d19c3e';                    // 满月盘描边
    const G = Math.max(0.75, r * 0.17);

    // 轨道环
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 6.2832);
    ctx.strokeStyle = RING;
    ctx.lineWidth = G;
    ctx.stroke();
    if (ratio <= 0) return;

    if (ratio >= 1) {
        if (withGlow) {
            // 满月暖晕：中晕·金橙，半径 2.35r
            const gr = ctx.createRadialGradient(cx, cy, r * 0.55, cx, cy, r * 2.35);
            gr.addColorStop(0, 'rgba(255,196,110,0.5)');
            gr.addColorStop(1, 'rgba(255,196,110,0)');
            ctx.fillStyle = gr;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 2.35, 0, 6.2832);
            ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 6.2832);
        ctx.fillStyle = FULL;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 6.2832);
        ctx.strokeStyle = FULL_DIM;
        ctx.lineWidth = Math.max(0.6, r * 0.07);
        ctx.stroke();
        return;
    }

    // 阴影圆从左下 45° 咬入，两圆心距按透镜面积反解
    const d = moonSealSolveX(ratio) * r;
    const ox = cx - d * Math.cos(DIR);
    const oy = cy + d * Math.sin(DIR);

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 6.2832);
    ctx.clip();
    ctx.fillStyle = LIT;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(ox, oy, r, 0, 6.2832);
    ctx.fill();
    ctx.restore();

    // 细边让月牙/凸月边缘利落
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 6.2832);
    ctx.strokeStyle = RING;
    ctx.lineWidth = Math.max(0.5, r * 0.05);
    ctx.stroke();
}

// 覆盖率 → 盈亏名（浮层题头用；档位与预览页五档一致）
function moonPhaseName(ratio) {
    if (ratio >= 1) return '满月';
    if (ratio <= 0) return '新月';
    if (ratio < 0.5) return '娥眉月';
    if (ratio === 0.5) return '半月';
    return '凸月';
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
}

function render() {
    draw();
}

// ═══ Resize ═══
function resize() {
    canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
    canvas.height = window.innerHeight * (window.devicePixelRatio || 1);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
    canvas._w = window.innerWidth;
    canvas._h = window.innerHeight;
    canvas.getBoundingClientRect = function() {
        return { left: 0, top: 0, width: canvas._w, height: canvas._h, right: canvas._w, bottom: canvas._h };
    };
}

function resizeAndRender() {
    resize();
    rebuildAll();
    // 浮层开着时窗口变了：按同一年月重新定位（focusRef 不变，只是坐标要重算）。
    if (focusRef) showMonthFocus(focusRef.year, focusRef.month);
}

// ═══ Zoom ═══
// cx/cy are screen-space (clientX/Y). Because world coordinates are stable
// (layout is scale-independent and zoom is applied via ctx.scale), this anchor
// formula keeps the world point under the cursor pinned in place.
function zoomAt(cx, cy, factor) {
    const newScale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, scale * factor));
    const actualFactor = newScale / scale;
    viewX = cx - actualFactor * (cx - viewX);
    viewY = cy - actualFactor * (cy - viewY);
    scale = newScale;
    requestRender();
}

// Fit all year columns into the viewport so later years (e.g. 2023+) are
// visible by default instead of being pushed off-screen on narrow phones.
function fitAllYears() {
    scale = layout.fitScale || 1;
    viewX = 0;
    viewY = 0;
}

function resetView() {
    selectedNode = null;
    popup.classList.remove('visible');
    fitAllYears();
    render();
}

document.getElementById('zoomOut').addEventListener('click', () => {
    zoomAt(window.innerWidth / 2, window.innerHeight / 2, 0.82);
});

document.getElementById('zoomIn').addEventListener('click', () => {
    zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1.22);
});

document.getElementById('zoomReset').addEventListener('click', resetView);

// ═══ Popup ═══
// Render diary text as controlled HTML: keep enc_reader's highlight <span> classes
// (leisure/dream/video/review/date-highlight) and <p> wrappers so colored spans
// show as intended color rather than literal "<span class=...>" text. Anything
// else is escaped, so unknown tags can't inject markup.
const ALLOWED_HIGHLIGHT_CLASSES = new Set([
    'leisure-highlight', 'dream-highlight', 'video-highlight',
    'review-highlight', 'date-highlight'
]);
function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function renderDiaryLineHtml(line) {
    // Tokenize on <span ...>...</span> runs; escape everything else.
    let html = '';
    const re = /<span\s+class\s*=\s*"([^"]*)"\s*>([\s\S]*?)<\/span>/gi;
    let last = 0, m;
    while ((m = re.exec(line)) !== null) {
        html += escapeHtml(line.slice(last, m.index));
        const classes = m[1].split(/\s+/).filter(c => ALLOWED_HIGHLIGHT_CLASSES.has(c));
        html += classes.length
            ? `<span class="${classes.join(' ')}">${escapeHtml(m[2])}</span>`
            : escapeHtml(m[2]);
        last = m.index + m[0].length;
    }
    html += escapeHtml(line.slice(last));
    return html;
}

function renderDiaryHtml(text) {
    // Wrap each original line in a <p> (enc_reader-style) but preserve any
    // already-present highlight spans by re-emitting them safely.
    const lines = text.split(/\r?\n/);
    const out = [];
    for (const line of lines) {
        if (!line.trim()) { out.push('<p></p>'); continue; }
        const html = renderDiaryLineHtml(line);
        // Color "未来回顾" reference lines (date + 回顾) with the review highlight,
        // whether or not enc_reader marked them — covers the bare "2026.06.28回顾：" form.
        if (DiaryParse.REVIEW_REF_RE.test(line)) {
            out.push(`<p><span class="review-highlight">${html}</span></p>`);
        } else {
            out.push(`<p>${html}</p>`);
        }
    }
    return out.join('');
}

// 正文按「空行分段」重排：段内的硬换行直接拼起来（中文不需要空格），
// 每段一个 .dpara，由 CSS 给它段首缩进 2 字与段间距。
// 不再像旧版那样把整篇塞成一坨 pre-wrap 文本 —— 那是"文本墙"的根源。
function renderDiaryParagraphs(text) {
    return String(text || '').split(/\n{2,}/)
        .map(p => p.replace(/\r?\n/g, '').trim())
        .filter(Boolean)
        .map(p => `<p class="dpara">${renderDiaryLineHtml(p)}</p>`)
        .join('');
}
function renderDiaryPreviewHtml(parts) {
    // parts: array of {label, text, truncate?}
    return parts.map(p => {
        const head = p.label ? `<span class="date-highlight">${escapeHtml(p.label)}</span>` : '';
        const body = p.truncate
            ? renderDiaryHtml(p.text.slice(0, p.truncate)) + (p.text.length > p.truncate ? '…' : '')
            : renderDiaryHtml(p.text);
        return head + body;
    }).join('<span class="popup-sep">———</span>');
}

function showPopup(node, screenX, screenY) {
    selectedNode = node;

    if (node.type === 'day') {
        const dayStats = getDayStats(node.year, node.month, node.day);
        const entries = dayStats.entries;
        const dow = ['一','二','三','四','五','六','日'][(new Date(node.year, node.month - 1, node.day).getDay() + 6) % 7];
        popupTitle.textContent = `${node.year} 年 ${node.month} 月 ${node.day} 日 · 周${dow}`;

        // 分类用彩色圆点：筛选态下它们会跟着变暗，与全页一致。
        const counts = {};
        for (const e of entries) counts[e.category] = (counts[e.category] || 0) + 1;
        const dots = Object.keys(counts).map(c =>
            `<span class="pdot" style="background:${categoryColor(c, 0.85)}"></span>${categoryLabel(c)}`
            + (counts[c] > 1 ? '×' + counts[c] : '')).join('');
        popupMeta.innerHTML = `${entries.length} 篇 · ${dayStats.wordCount} 字 · ${dayStats.paraCount} 段`
            + (dots ? `<span class="pdots">${dots}</span>` : '');

        // 惰性正文：骨架期 text 为空 → 先显示加载占位，异步解密回来再回填重渲染。
        if (entries.length > 0 && !entries[0].text) {
            const mkFailed = hydrateFailed.has(`${node.year}-${String(node.month).padStart(2, '0')}`);
            popupPreview.innerHTML = mkFailed
                ? '<div class="dsec-loading dsec-error">正文解密失败（网络或数据问题），点其他日期重试</div>'
                : '<div class="dsec-loading">正在解密正文…</div>';
            if (!mkFailed) hydrateMonth(node.year, node.month);   // 不 await —— hydrate 完成时会自己刷新弹窗
        } else if (entries.length > 0) {
            // 单栏长文 + 篇级分节头（定案 2.4）：一天多篇时用分节头隔开，而不是拆成卡片 ——
            // 日记的阅读是线性的，卡片流会让人"扫"而不是"读"。
            popupPreview.innerHTML = entries.map((e, i) =>
                `<div class="dsec">`
                + `<div class="dsec-head" style="border-left-color:${categoryColor(e.category, 0.9)}">`
                + `<span class="dsec-no">第 ${i + 1} 篇</span>`
                + `<span class="dsec-cat" style="color:${categoryColor(e.category, 0.95)}">${categoryLabel(e.category)}</span>`
                + `<span class="dsec-meta">${e.wordCount} 字 · ${e.paraCount} 段</span></div>`
                + `<div class="dsec-body">${renderDiaryParagraphs(e.text)}</div></div>`
            ).join('');
        } else {
            popupPreview.innerHTML = '这一天没有可显示的日志。';
        }
    } else if (node.type === 'month') {
        const monthStats = getMonthStats(node.year, node.month);
        popupTitle.textContent = `${node.year}年${node.month}月`;
        popupMeta.textContent = `${monthStats.dayCount}天 · ${monthStats.entryCount}篇 · ${monthStats.wordCount}字 · ${monthStats.paraCount}段`;
        // Show first 5 entries as previews（惰性：正文未到先占位，解密回来刷新）
        const sorted = [...monthStats.entries].sort((a, b) => a.day - b.day || (a.category === 'normal' ? 1 : -1));
        const previewEntries = sorted.slice(0, 5);
        if (previewEntries.length > 0) {
            if (!previewEntries[0].text) {
                popupPreview.innerHTML = '<div class="dsec-loading">正在解密正文…</div>';
                hydrateMonth(node.year, node.month);
            } else {
                popupPreview.innerHTML = renderDiaryPreviewHtml(previewEntries.map(e => ({
                    label: `${node.year}-${String(node.month).padStart(2,'0')}-${String(e.day).padStart(2,'0')}  `,
                    text: e.text, truncate: 120
                })));
            }
        } else {
            popupPreview.innerHTML = '这个月还没有可显示的日志。';
        }
    } else if (node.type === 'year') {
        const yearData = treeData[node.year] || {};
        const yearStats = getYearStats(node.year);
        const allYearEntries = [];
        for (const m of Object.values(yearData)) {
            for (const d of Object.values(m)) {
                allYearEntries.push(...d);
            }
        }
        popupTitle.textContent = `${node.year}年`;
        popupMeta.textContent = `${yearStats.monthCount}个月 · ${yearStats.dayCount}天 · ${yearStats.entryCount}篇 · ${yearStats.wordCount}字`;
        // Show first 5 entries as previews
        const sorted = allYearEntries.sort((a, b) => a.month - b.month || a.day - b.day);
        const previewEntries = sorted.slice(0, 5);
        if (previewEntries.length > 0) {
            // 年度预览取自多个可能未解密的月份：先占位，再按需解第一个未解密月
            if (!previewEntries[0].text) {
                popupPreview.innerHTML = '<div class="dsec-loading">正在解密正文…</div>';
                hydrateMonth(previewEntries[0].year, previewEntries[0].month);
            } else {
                popupPreview.innerHTML = renderDiaryPreviewHtml(previewEntries.map(e => ({
                    label: `${node.year}-${String(e.month).padStart(2,'0')}-${String(e.day).padStart(2,'0')}  `,
                    text: e.text, truncate: 120
                })));
            }
        } else {
            popupPreview.innerHTML = '这一年还没有可显示的日志。';
        }
    }

    popup.classList.add('visible');
    const pw = popup.offsetWidth;
    const ph = popup.offsetHeight;
    let px = screenX - pw / 2;
    let py = screenY - ph - 20;
    if (px < 10) px = 10;
    if (px + pw > window.innerWidth - 10) px = window.innerWidth - pw - 10;
    if (py < 10) py = screenY + 20;
    if (py + ph > window.innerHeight - 10) py = window.innerHeight - ph - 10;
    popup.style.left = px + 'px';
    popup.style.top = py + 'px';

    render();
}

function hidePopup() {
    selectedNode = null;
    popup.classList.remove('visible');
    render();
}

document.getElementById('popup-close').onclick = (e) => {
    e.stopPropagation();
    hidePopup();
};

// ═══ 单月聚焦（原位浮层）═══
// 单击月份卡 → 卡片原地浮起、盖住邻居，布局一点不变。
// 交互层级固定两层：列头(年) → 月份卡 = 这里 → 点某天 = 日详情弹窗。
// 月级别的统计并入浮层头部，不再单独弹 —— 否则会出现两个平级弹窗互相打架。
let focusRef = null;

function hideMonthFocus() {
    focusRef = null;
    const el = document.getElementById('month-focus');
    document.getElementById('focus-backdrop').classList.remove('visible');
    if (el) el.classList.remove('visible');
}

// 取正文第一行当摘要：数据里每条日志的第一行往往是分类标签，要跳过它。
function firstDiaryLine(text, max) {
    const lines = String(text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const skip = ['闲情逸致', '梦幻空花', '做视频想法', '未来回顾', '日常'];
    const body = lines.filter(l => skip.indexOf(l) < 0);
    const line = (body[0] || lines[0] || '').replace(/\s+/g, ' ');
    return line.length > max ? line.slice(0, max) + '…' : line;
}

function showMonthFocus(year, month) {
    const stats = statsCache.month.get(`${year}-${month}`);
    if (!stats || stats.entryCount === 0) return;
    const yl = layout.years.find(y => y.year === year);
    const mo = yl && yl.months.find(m => m.month === month);
    if (!mo) return;
    focusRef = { year, month };

    // 定位：以卡片在屏幕上的左上角为锚放大成固定尺寸，再夹进视口。
    // 锚在卡片本身 ⇒ 视觉上就是"这张卡长出来了"，而不是凭空弹一个窗。
    const el = document.getElementById('month-focus');
    const bw = Math.min(700, window.innerWidth - 32);
    const bh = Math.min(470, window.innerHeight - 48);
    let px = mo.cardX * scale + viewX - 14;
    let py = mo.cardY * scale + viewY - 34;
    px = Math.min(Math.max(px, 16), Math.max(16, window.innerWidth - bw - 16));
    py = Math.min(Math.max(py, 44), Math.max(44, window.innerHeight - bh - 16));
    el.style.left = px + 'px';
    el.style.top = py + 'px';
    el.style.width = bw + 'px';
    el.style.maxHeight = bh + 'px';

    document.getElementById('mf-title').textContent = `${year} 年 ${month} 月`;
    document.getElementById('mf-stats').textContent =
        `${stats.dayCount}天 · ${stats.entryCount}篇 · ${formatCompactNumber(stats.wordCount)}字`;
    // 月相语言：按覆盖率给出盈亏名（与月卡月相章同一把 dayRatio 标尺）。
    el.classList.toggle('has-moon', stats.dayCount > 0);
    document.getElementById('mf-seal-name').textContent = moonPhaseName(stats.dayRatio);

    // 分类构成条 + 图例
    const counts = {};
    for (const e of stats.entries) counts[e.category] = (counts[e.category] || 0) + 1;
    const order = ['leisure', 'dream', 'video', 'review', 'normal'].filter(c => counts[c]);
    document.getElementById('mf-bar').innerHTML = order
        .map(c => `<i style="flex:${counts[c]};background:${categoryColor(c, 0.78)}"></i>`).join('');
    document.getElementById('mf-legend').innerHTML = order
        .map(c => `<span><span class="dot" style="background:${categoryColor(c, 0.85)}"></span>`
            + `${categoryLabel(c)} ${counts[c]}</span>`).join('');

    // 真月历 7×6：色深 ∝ 当日字数（同一把全局标尺），多篇的日子右上角一个白点。
    const dim = daysInMonth(year, month);
    const firstDow = (new Date(year, month - 1, 1).getDay() + 6) % 7;
    let cells = '';
    for (let d = 1; d <= dim; d++) {
        const ds = statsCache.day.get(`${year}-${month}-${d}`);
        let cell;
        if (ds && ds.entryCount > 0) {
            const inten = Math.min(ds.wordCount / Math.max(1, scaleAxis.denom), 1);
            cell = `<div class="mf-cell" data-day="${d}" style="background:${categoryColor(ds.category, 0.30 + inten * 0.62)}">`
                + `${d}${ds.entryCount > 1 ? '<span class="multi"></span>' : ''}</div>`;
        } else {
            cell = `<div class="mf-cell empty">${d}</div>`;
        }
        cells += `<td>${cell}</td>`;
        if ((firstDow + d) % 7 === 0) cells += '</tr><tr>';
    }
    document.getElementById('mf-cal').innerHTML =
        '<tr>' + ['一','二','三','四','五','六','日'].map(w => `<th>${w}</th>`).join('') + '</tr>'
        + '<tr>' + '<td></td>'.repeat(firstDow) + cells + '</tr>';

    // 当月目录：按日期升序，日期/星期 + 字数 + 首句摘要，可滚动。
    // 惰性正文：骨架期首句显示占位线，解密回来 showMonthFocus 被重调刷新。
    const firstRows = stats.days.map(d => {
        const ds = statsCache.day.get(`${year}-${month}-${d}`);
        const e = ds.entries[0];
        const dow = ['一','二','三','四','五','六','日'][(new Date(year, month - 1, d).getDay() + 6) % 7];
        const summary = e.text
            ? escapeHtml(firstDiaryLine(e.text, 34))
            : '<span class="mf-loading-line"></span>';
        return `<div class="mf-row" data-day="${d}">`
            + `<span class="dot" style="background:${categoryColor(e.category, 0.9)}"></span>`
            + `<span class="d">${month}/${d} 周${dow}</span>`
            + `<span class="w">${ds.entryCount > 1 ? ds.entryCount + '篇 · ' : ''}${ds.wordCount}字</span>`
            + `<span class="x">${summary}</span></div>`;
    }).join('');
    document.getElementById('mf-list-rows').innerHTML = firstRows || '这个月没有日志。';
    if (stats.days.length > 0 && !stats.entries[0].text) {
        if (hydrateFailed.has(`${year}-${String(month).padStart(2, '0')}`)) {
            // 失败态：目录行换成错误提示（点行会重触发 showPopup → 重试）
            document.querySelectorAll('#month-focus .mf-loading-line').forEach(el => {
                el.outerHTML = '<span style="color:rgba(176,74,50,0.9)">（正文加载失败，点击重试）</span>';
            });
        } else {
            hydrateMonth(year, month);   // 预取：目录/后续日详情共享本次解密
        }
    }

    document.getElementById('focus-backdrop').classList.add('visible');
    el.classList.add('visible');
}

function shiftMonthFocus(delta) {
    if (!focusRef) return;
    let y = focusRef.year, m = focusRef.month + delta;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    // 没有数据的月份不跳（跳过去只会看到一张空卡）。
    if (!treeData[y] || !treeData[y][m]) return;
    showMonthFocus(y, m);
}

document.getElementById('mf-close').onclick = (e) => { e.stopPropagation(); hideMonthFocus(); };
document.getElementById('focus-backdrop').onclick = () => hideMonthFocus();
document.getElementById('mf-prev').onclick = (e) => { e.stopPropagation(); shiftMonthFocus(-1); };
document.getElementById('mf-next').onclick = (e) => { e.stopPropagation(); shiftMonthFocus(1); };
document.getElementById('mf-cal').addEventListener('click', (e) => {
    const cell = e.target.closest && e.target.closest('.mf-cell');
    if (!cell || cell.classList.contains('empty') || !focusRef) return;
    const y = focusRef.year, m = focusRef.month, d = parseInt(cell.dataset.day, 10);
    hideMonthFocus();
    showPopup({ type: 'day', year: y, month: m, day: d }, e.clientX, e.clientY);
});
document.getElementById('mf-list-rows').addEventListener('click', (e) => {
    const row = e.target.closest && e.target.closest('.mf-row');
    if (!row || !focusRef) return;
    const y = focusRef.year, m = focusRef.month, d = parseInt(row.dataset.day, 10);
    hideMonthFocus();
    showPopup({ type: 'day', year: y, month: m, day: d }, e.clientX, e.clientY);
});
document.addEventListener('keydown', (e) => {
    const mf = document.getElementById('month-focus');
    const overlayOpen = mf.classList.contains('visible');
    if (e.key === 'Escape') {
        // Esc 逐层退出：先浮层，再日详情。
        if (overlayOpen) { hideMonthFocus(); return; }
        if (popup.classList.contains('visible')) hidePopup();
        return;
    }
    if (overlayOpen && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        // 浮层开着时 ←/→ 是「上一个月 / 下一个月」
        e.preventDefault();
        shiftMonthFocus(e.key === 'ArrowLeft' ? -1 : 1);
        return;
    }
    if (e.key.indexOf('Arrow') === 0 && !overlayOpen) {
        // 无浮层时方向键平移（按住可连续移动）
        e.preventDefault();
        const step = 60;
        if (e.key === 'ArrowLeft') viewX += step;
        if (e.key === 'ArrowRight') viewX -= step;
        if (e.key === 'ArrowUp') viewY += step;
        if (e.key === 'ArrowDown') viewY -= step;
        requestRender();
    }
});

// ═══ Mouse events ═══
canvas.addEventListener('mousedown', (e) => {
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragViewX = viewX;
    dragViewY = viewY;
});

canvas.addEventListener('mousemove', (e) => {
    // Convert screen → world (base) coordinates for hit testing.
    const mx = (e.clientX - viewX) / scale;
    const my = (e.clientY - viewY) / scale;

    if (dragging) {
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
            viewX = dragViewX + dx;
            viewY = dragViewY + dy;
            requestRender();
        }
    } else {
        hoveredNode = hitTest(mx, my);
        if (hoveredNode) {
