      var k = isWide(s.charAt(i)) ? 2 : 1;
      if (used + k > n) break;
      out += s.charAt(i); used += k;
    }
    return out;
  }
  function wrapStr(s, n) {
    if (dw(s) <= n) return [s];
    var parts = [];
    var ascii = !isWide(s.replace(/[^\u2e80-\uffff]/g, '') || '') && /^[\x00-\xff]*$/.test(s);
    while (s) {
      var line = cropStr(s, n);
      if (line.length < s.length && line.indexOf(' ') >= 0 && /^[\x00-\x7f]*$/.test(s))
        line = line.slice(0, line.lastIndexOf(' '));
      if (!line) break;
      parts.push(line);
      s = s.slice(line.length).replace(/^\s+/, '');
    }
    return parts;
  }
  function cueAt(tt) { // 与原作 player.py cue() 一致：bisect_right - 1 且必须 t < end
    for (var i = LYRICS.length - 1; i >= 0; i--)
      if (LYRICS[i].time <= tt) return tt < LYRICS[i].end ? LYRICS[i] : null;
    return null;
  }
  function drawSubsIntoGrid(c, tt) {
    var e = cueAt(tt);
    if (e) {
      var ens = wrapStr(e.en, c.w - 8).slice(0, 2);
      var zhs = wrapStr(e.zh, c.w - 8).slice(0, 2);
      for (var i = 0; i < ens.length; i++) c.centerW(c.h - 5 + i, ens[i], W);
      for (i = 0; i < zhs.length; i++) c.centerW(c.h - 3 + i, zhs[i], B);
    } else if (tt > 208) {
      c.center(c.h - 5, 'PROCESS ENDED. THE LOOP REMAINS.', W);
    } else {
      c.centerW(c.h - 5, '[ instrumental ]', D);
      c.centerW(c.h - 3, '[ INTERLUDE ]', D);
    }
  }
  // 全帧渲染（正常路径：chrome→场景→glitch→磷光→频谱→字幕），供 title 源帧
  function frameAt(tt) {
    var c = new CCanvas(GW, GH);
    drawChrome(c, tt, false, false); // paused=True 与 dump_frames 参考帧一致
    var sc = sceneAt(tt);
    c.clip = [4, 32];  // 与原作 render 一致：场景/glitch/磷光在 clip 内
    sc.f(c, tt, 4, 32, sc.emap ? sc.emap(tt) : tt - sc.a);
    // glitch/磷光是 world 曲的移植特效（时间窗按它的歌词表硬编码），按歌开关
    if (SONG.glitch) { applyGlitch(c, tt, 4, 32); phosphor(c, tt, 4, 32); }
    c.clip = null;
    drawSpectrum(c, tt);
    drawSubsIntoGrid(c, tt);
    return c;
  }

  /* ---------------- 字幕（DOM 层） ---------------- */
  var LYRICS = window.__LYRICS || [];
  function lyricAt(t) {
    var lo = 0, hi = LYRICS.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (LYRICS[mid].time <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (ans >= 0 && t < LYRICS[ans].end) return LYRICS[ans];
    return null;
  }
  var elEn = document.getElementById('amv-en'), elZh = document.getElementById('amv-zh');
  var lastLy = -2;
  function updateSubs(t) {
    var e = lyricAt(t);
    var idx = e ? LYRICS.indexOf(e) : -1;
    if (idx === lastLy) return;
    lastLy = idx;
    elEn.textContent = e ? e.en : '';
    elZh.textContent = e ? e.zh : '';
  }

  /* ---------------- 数据异步加载（弱网不阻塞播放） ---------------- */
  // spectrum.js 约 1.8MB，以同步脚本标签引入会在弱网/被重置的连接下卡住整页 JS
  // （表现为 PLAY 无响应、画布全黑）。改 fetch 流式下载 + 进度条；
  // 数据晚到只暂时缺字幕/频谱，加载完成后自动补上。
  // ⚠️ GitHub Pages（Fastly 东京边）本机实测仅 ~10KB/s（直连与代理一样慢），
  // 浏览器 gzip 也救不了；jsDelivr gh 镜像实测 ~134KB/s（13×）。主源走 CDN、
  // 同源兜底；单次连接 STALL_MS 无字节进展判定卡死，自动换下一个镜像重试。
  // ⚠️ @后锁本次构建的 commit SHA（site.github.build_revision，GitHub Pages 由
  // jekyll-github-metadata 注入）而非 @master——按 commit 取内容不可变、jsDelivr
  // 可永久缓存，彻底消除「@master 分支引用最多 ~12h 缓存延迟」的刷新不及时问题；
  // 本地构建无该变量时 default 回退 master。
  {% assign amv_rev = site.github.build_revision | default: "master" %}
  var LYRIC_URL = SONG.dir + '/lyrics.js';
  var SPEC_URL = SONG.dir + '/spectrum.js';
  var MIRRORS = ['https://cdn.jsdelivr.net/gh/crescentvelvet/crescentvelvet.github.io@{{ amv_rev }}', ''];
  var STALL_MS = window.__AMV_STALL_MS || 15000;   // E2E 注入小值压缩等待
  var elLoad = document.getElementById('amv-load'),
      elLoadTxt = document.getElementById('amv-load-txt'),
      elLoadFill = document.getElementById('amv-load-fill');
  function fetchText(url, onBytes, signal) {
    return fetch(url, { signal: signal }).then(function (resp) {
      if (!resp.ok) throw new Error(url.split('/').pop() + ' HTTP ' + resp.status);
      var total = +resp.headers.get('Content-Length') || 0;
      if (!resp.body || !resp.body.getReader) return resp.text();   // 老内核退化为一次性下载
      var rd = resp.body.getReader(), chunks = [], got = 0;
      return (function pump() {
        return rd.read().then(function (r) {
          if (r.done) {
            var all = new Uint8Array(got), o = 0;
            for (var i = 0; i < chunks.length; i++) { all.set(chunks[i], o); o += chunks[i].length; }
            return new TextDecoder('utf-8').decode(all);
          }
          chunks.push(r.value); got += r.value.length; onBytes(got, total);
          return pump();
        });
      })();
    });
  }
  // 依次尝试 MIRRORS；连接卡死（STALL_MS 无字节进展）或出错自动换下一个
  function fetchData(path, onBytes) {
    var mi = 0, lastErr = null;
    function attempt() {
      if (mi >= MIRRORS.length) return Promise.reject(lastErr || new Error('所有镜像均不可达'));
      var base = MIRRORS[mi++];
      var url = base ? base + path : path;
      var ac = window.AbortController ? new AbortController() : null;
      var lastAt = Date.now(), timer = null;
      if (ac) timer = setInterval(function () {   // 看门狗：只在「无字节进展」时咬
        if (!ac.signal.aborted && Date.now() - lastAt > STALL_MS) ac.abort();
      }, 2000);
      function onB(g, t) { lastAt = Date.now(); onBytes(g, t); }
      return fetchText(url, onB, ac ? ac.signal : undefined).then(function (code) {
        if (timer) clearInterval(timer);
        return code;
      }, function (e) {
        if (timer) clearInterval(timer);
        lastErr = (e && e.name === 'AbortError')
          ? new Error('连接卡住超时（' + Math.round(STALL_MS / 1000) + 's 无进展）') : e;
        return attempt();
      });
    }
    return attempt();
  }
  function runGlobal(code) {   // 数据文件是 window.__X = ... 赋值，按全局作用域执行
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
    s.remove();
  }
  function loadData() {
    elLoad.hidden = false;
    elLoadFill.style.width = '0%';
    elLoadTxt.textContent = '数据加载中…';
    var prog = {}, done = false, failed = false;   // url -> {got, total}
    function paint() {
      if (done || failed) return;   // 迟到的进度不能覆盖完成/失败态
      var got = 0, tot = 0, k;
      for (k in prog) { got += prog[k].got; tot += prog[k].total; }
      // 服务器 gzip 时 got（解压字节）可能超过 total（压缩长度），进度封顶 100%
      elLoadFill.style.width = (tot > 0 ? Math.min(1, got / tot) * 100 : 0).toFixed(1) + '%';
      elLoadTxt.textContent = '字幕/频谱数据加载中 ' + (got / 1048576).toFixed(1) + ' MB'
        + (tot > 0 ? ' / ' + (tot / 1048576).toFixed(1) + ' MB' : '…');
    }
    function one(path) {
      return fetchData(path, function (g, t) {
        if (done || failed) return;
        prog[path] = { got: g, total: t }; paint();
      });
    }
    var tasks=[one(LYRIC_URL),one(SPEC_URL)];
    if(SONG_KEY==='link_up')tasks.push(one("{{ '/assets/data/ascii_mv/link_up/queen_ansi.js' | relative_url }}"));
    if(SONG_KEY==='link_up')tasks.push(one("{{ '/assets/data/ascii_mv/link_up/roxy_ansi.js' | relative_url }}"));
    Promise.all(tasks).then(function (codes) {
      done = true;
      runGlobal(codes[0]);                 // window.__LYRICS
      LYRICS = window.__LYRICS || [];
      lastLy = -2;                         // 强制下一帧重取字幕
      runGlobal(codes[1]);                 // window.__SPECTRUM（drawSpectrum 每帧现取）
      if(codes[2])runGlobal(codes[2]);      // Link Up 的 ANSI 角色素材（女王）
      if(codes[3])runGlobal(codes[3]);      // 洛克茜·女仆装
      elLoad.hidden = true;
    }).catch(function (e) {
      failed = true;
      elLoadFill.style.width = '0%';
      elLoadTxt.textContent = '';
      elLoadTxt.appendChild(document.createTextNode('数据加载失败（不影响播放）：' + e.message + ' '));
      var a = document.createElement('a');
      a.textContent = '[重试]';
      a.addEventListener('click', function (ev) { ev.preventDefault(); loadData(); });
      elLoadTxt.appendChild(a);
    });
    paint();
  }

  /* ---------------- 渲染 ---------------- */
  var cvEl = document.getElementById('amv-cv');
  var g2d = cvEl.getContext('2d');
  var grid = new CCanvas(GW, GH);
  // Link Up 开幕按 MV 镜头推进；不再使用锻锤冲击式整屏震动。
  function updateOpeningShake(t) {
    if (cvEl.style.transform) cvEl.style.transform = '';
  }
  function render() {
    g2d.fillStyle = '#000';
    g2d.fillRect(0, 0, GW * CW * SC, GH * CH * SC);
    for (var y = 0; y < GH; y++)
      for (var x = 0; x < GW; x++) {
        var cell = grid.cells[y][x];
        if (cell[0] === ' ' || cell[0] === '') continue;
        var gi = ATLAS.idx[cell[0]];
        if (gi === undefined) gi = ATLAS.miss;
        g2d.drawImage(ATLAS.per[cell[1]], gi * CW * SC, 0, CW * SC, CH * SC,
          x * CW * SC, y * CH * SC, CW * SC, CH * SC);
      }
    if(grid.queen)luRenderQueen(g2d,grid.queen);
    if(grid.roxy)luRenderRoxy(g2d,grid.roxy);
  }

  /* ---------------- 音频时钟 ---------------- */
  var qs = new URLSearchParams(location.search);
  var SNAP = qs.get('t') !== null ? parseFloat(qs.get('t')) : null;
  var actx = null, buf = null, src = null, startAt = 0, playing = false;
  var offset = SNAP !== null && isFinite(SNAP) ? clamp(SNAP, 0, DUR - 0.05) : 0;
  // 时钟：有音频用 AudioContext.currentTime，无声播放用 performance.now()
  function clock() { return buf ? actx.currentTime : performance.now() / 1000; }
  function now() { return playing ? Math.min(offset + (clock() - startAt), DUR) : offset; }
  var playBtn = document.getElementById('amv-play');
  function startSrc() {
    src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(actx.destination);
    src.onended = function () { if (playing) { playing = false; offset = DUR; playBtn.textContent = 'PLAY'; } };
    src.start(0, Math.min(offset, DUR - 0.05));
    startAt = actx.currentTime;
  }
  function play() {
    if (playing) return;
    if (offset >= DUR - 0.05) offset = 0;
    if (buf) {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      actx.resume();
      startSrc();
    } else {
      startAt = performance.now() / 1000;   // 无声模式：纯视觉播放
    }
    playing = true;
    playBtn.textContent = 'PAUSE';
  }
  function pause() {
    if (!playing) return;
    offset = now();
    if (buf) {
      src.onended = null;
      try { src.stop(); } catch (e) { }
    }
    playing = false;
    playBtn.textContent = 'PLAY';
  }
  function seekTo(v) {
    var wasPlaying = playing;
    if (playing) pause();
    offset = clamp(v, 0, DUR - 0.05);
    if (wasPlaying) play();
  }
  document.getElementById('amv-file').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var rd = new FileReader();
    rd.onload = function () {
      actx.decodeAudioData(rd.result, function (b) {
        buf = b;
        playBtn.disabled = false;
        play();
      }, function () { document.getElementById('amv-note').textContent = '音频解码失败'; });
    };
    rd.readAsArrayBuffer(f);
  });
  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  document.getElementById('amv-prog').addEventListener('click', function (ev) {
    var rect = this.getBoundingClientRect();
    seekTo((ev.clientX - rect.left) / rect.width * DUR);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.code === 'Space') { ev.preventDefault(); playing ? pause() : play(); }
    else if (ev.key === 'ArrowLeft') seekTo(now() - 5);
    else if (ev.key === 'ArrowRight') seekTo(now() + 5);
    else if (ev.key === 'r' || ev.key === 'R') seekTo(0);
  });

  /* ---------------- 主循环 ---------------- */
  var elFill = document.getElementById('amv-fill'), elTime = document.getElementById('amv-time');
  function tick() {
    var t = now();
    if (playing && t >= DUR) {          // 无声模式播完：音频模式由 onended 收尾
      playing = false; offset = DUR; playBtn.textContent = 'PLAY';
    }
    grid.clear();
    if (SONG.glitch && t >= 15.8 && t < 29.709) {
      // title 接管：无 chrome/字幕；16–18.1s 吸入 t=15.799 的完整源帧
      // （接管窗按 world 曲歌词表硬编码，别曲勿入——tick 与 frameAt 同规则）
      var source = (t >= 16 && t < 18.1) ? frameAt(15.799) : null;
      sceneTitleTakeover(grid, t, source);
      if (lastLy !== -1) { elEn.textContent = ''; elZh.textContent = ''; lastLy = -1; }
    } else {
      drawChrome(grid, t, playing, SNAP !== null);
      var sc = sceneAt(t);
      grid.clip = [4, 32];
      sc.f(grid, t, 4, 32, sc.emap ? sc.emap(t) : t - sc.a);
      // glitch/磷光按歌开关（时间窗按 world 歌词表硬编码）
      if (SONG.glitch) { applyGlitch(grid, t, 4, 32); phosphor(grid, t, 4, 32); }
      grid.clip = null;
      drawSpectrum(grid, t);
      updateSubs(t);
    }
    updateOpeningShake(t);
    render();
    elFill.style.width = (t / DUR * 100).toFixed(2) + '%';
    elTime.textContent = fmtT(t) + ' / ' + SONG.durTxt;
    requestAnimationFrame(tick);
  }
  buildAtlas();
  loadData();   // 数据后台加载，不阻塞首帧与 PLAY
  // 调试探针（供 CDP 检查网格内容）
  window.__amv = { grid: grid, w: GW, h: GH, now: now, frameAt: frameAt,
                   hash16: hash16, titlePixels: titlePixels, mix: mix, clamp01: clamp01,
                   CCanvas: CCanvas, sceneTitleTakeover: sceneTitleTakeover,
                   song: SONG_KEY, dur: DUR,
                   loadState: function () {
                     return { song: SONG_KEY, lyrics: LYRICS.length, spectrum: !!window.__SPECTRUM,
                              loadHidden: elLoad.hidden, loadTxt: elLoadTxt.textContent };
                   } };
  tick();
})();
</script>
</body>
</html>
