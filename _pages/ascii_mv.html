<script>

    for (i = 32; i < 127; i++) { ch = String.fromCharCode(i); if (!set[ch]) { set[ch] = 1; chars.push(ch); } }

  function glitchIntensity(t) {
    if (t < 60) return 0.05;
    if (t < 110) return mix(0.05, 0.25, (t - 60) / 50);
    if (t < 110.9) return mix(0.25, 0.6, (t - 110) / 37); // 原作原样（疑 /0.9 笔误，先保真）
    var A = [[110.9, .259], [112.22, .34], [113.1, .43], [114.18, .51], [114.92, .59],

  function applyGlitch(c, t, top, bt, intensity) {
    // 原作 draw_scene 尾部的排除窗口（scenes.py:3058）：

        var shift = Math.trunc((hash16(frame + q * 13) % 20 - 10) * intensity);

  // 51.363–55.083：时间线光束从 AD 扫到 BC
  function sceneTimeTravel(c, t, top, bt, elapsed) {

    var tick_y, label, year_offset;
    for (i = 0; i < num_markers; i++) {
      var marker_x = l + 10 + i * marker_spacing;
      for (tick_y = -3; tick_y <= 3; tick_y++) {
        if (Math.abs(tick_y) === 3) c.put(marker_x, timeline_y + tick_y, '|', i % 2 ? G : N);
        else if (Math.abs(tick_y) === 2) c.put(marker_x, timeline_y + tick_y, '│', G);
      }

      } else if (year_offset < 0) {

      } else {
        c.put(marker_x - 1, timeline_y - 5, '0', W);

    }
    var beam_x = Math.trunc(mix(r - 10, l + 10, progress));
    var y;
    for (y = top + 2; y < bt - 2; y++) {
      var intensity = 1.0 - Math.abs(y - cy) / (bt - top) * 2;
      if (intensity > 0.7) c.put(beam_x, y, '│', W);
      else if (intensity > 0.4) c.put(beam_x, y, '┊', B);
      else c.put(beam_x, y, ':', N);

    }
    if (progress > 0.2) {
      for (var particle_i = 0; particle_i < 30; particle_i++) {

        var py = top + 5 + (particle_i * 7) % (bt - top - 10);
        if (l < px && px < r && top < py && py < bt) {

            c.put(px, py, '*', particle_phase < 0.1 ? W : B);
          else c.put(px, py, '·', N);
        }
      }
    }
    if (progress > 0.1) {
      var current_year = Math.trunc(mix(2000, -2000, progress));
      var year_label = Math.abs(current_year) + (current_year > 0 ? 'AD' : current_year < 0 ? 'BC' : '');
      var label_x = beam_x - Math.floor(year_label.length / 2);
      if (l + 5 < label_x && label_x < r - 15)

    }
    if (progress < 0.3) c.centerW(top + 1, 'FUTURE → PAST', B);
    else if (progress < 0.7) c.centerW(top + 1, 'TIME TRAVEL', mod(Math.trunc(elapsed * 3), 2) ? W : B);
    else c.centerW(top + 1, 'ANCIENT ERA', W);
    if (progress > 0.3) {
      for (var line_i = 0; line_i < 15; line_i++) {
        var line_y = top + 5 + line_i * Math.floor((bt - top - 10) / 15);
        var line_phase = (elapsed * 3 + line_i * 0.1) % 1.0;
        var line_length = Math.trunc(line_phase * 20) + 5;
        for (var lx = Math.max(l + 5, beam_x + 10); lx < Math.min(r - 5, beam_x + 10 + line_length); lx++)
          if (hash16(line_i * 17 + Math.floor(lx / 3)) % 4 === 0)

      }
    }
    if (progress > 0.8) {
      var dest_x = l + 15;
      c.put(dest_x, timeline_y - 2, '▼', R);

      if (progress > 0.95) {

        for (var angle_i = 0; angle_i < 12; angle_i++) {

          var fy = timeline_y + Math.trunc(Math.sin(fa) * flash_radius * 0.5);

  }

  // 59.223–66.601：感官脉冲驱动 YOU，随后填满足度条（lyric_stimulation_satisfaction 逐行移植）
  function sceneStimSat(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cy = (top + bt) >> 1, x, y;
    if (t >= 62.589) {
      var u = clamp01((t - 62.589) / (65.397 - 62.589));
      var percent = Math.trunc(100 * u);
      var full = u >= 1;
      c.center(Math.max(top, cy - 7), 'SATISFACTION ' + percent.toFixed(1).padStart(5, '0') + '%', full ? W : B);
      var bar_x = l + 3, bar_w = r - l - 6, inside = bar_w - 2;
      for (var lane = 0; lane < 3; lane++) {
        y = cy - 5 + lane * 2;
        var amount = clamp01(u - (1 - u) * lane * 0.13);
        var filled = Math.trunc(inside * amount);
        c.put(bar_x, y, '[' + '-'.repeat(inside) + ']', N);
        for (var col = 0; col < filled; col++) {
          var scan = mod(col - Math.trunc(t * 26) - lane * 7, Math.max(1, inside));
          c.put(bar_x + 1 + col, y, lane === 1 ? '#' : '=', scan < 5 || full ? W : B);
        }
        if (filled < inside) c.put(bar_x + 1 + filled, y, '>', W);
      }
      c.big(cy + 1, String(percent), full ? W : B);
      c.center(Math.min(bt, cy + 7), full ? '[ MAXIMUM ]' : '[ FILLING SATISFACTION ]', full ? W : N);
      return;
    }
    var strength = clamp01(elapsed / (61.958 - 59.223));
    var accent = t >= 61.958;
    c.center(top, 'STIMULATION / SENSORY INPUT', accent ? W : B);
    var left_x = l + 1, right_x = r - 10;
    var boxes = [[left_x, 'ME'], [right_x, 'YOU']];
    for (var bi = 0; bi < 2; bi++) {
      c.box(boxes[bi][0], cy - 2, 10, 5, B);
      c.put(boxes[bi][0] + 3, cy, boxes[bi][1], W);
    }
    var wire_l = left_x + 12, wire_r = right_x - 3, span = wire_r - wire_l;
    var lanes = bt - top >= 22 ? 5 : 3;
    var gap = Math.max(2, Math.min(4, Math.trunc((bt - top - 6) / Math.max(1, lanes - 1))));
    var names = ['TOUCH', 'SOUND', 'LIGHT', 'REWARD', 'FEEDBACK'];
    for (var ln = 0; ln < lanes; ln++) {
      y = cy + (ln - Math.trunc(lanes / 2)) * gap;
      c.line(left_x + 9, cy, wire_l, cy, '-', G);
      c.line(wire_l, cy, wire_l, y, '|', G);
      c.line(wire_l, y, wire_r, y, '-', N);
      c.line(wire_r, y, wire_r, cy, '|', G);
      c.line(wire_r, cy, right_x, cy, '-', G);
      c.put(wire_l + 2, y - 1, names[ln], N);
      for (var relay = 1; relay <= 2; relay++)
        c.put(wire_l + Math.trunc(span * relay / 3), y, 'o', B);
      var speed = 0.65 + strength * 0.75;
      for (var packet = 0; packet < 3; packet++) {
        var phase = mod(elapsed * speed - ln * 0.17 - packet / 3, 1);
        var head = wire_l + Math.trunc(phase * span);
        for (var trail = 0; trail < 5; trail++) {
          var xx = head - trail;
          if (xx > wire_l)
            c.put(xx, y, trail === 0 ? '*' : trail < 3 ? '=' : '.', trail === 0 ? W : trail < 3 ? B : G);
        }
        if (phase > 0.88) {
          c.put(wire_r, y, '#', W);
          c.put(right_x + 1, cy + 1, 'ACTIVE', W);
        }
      }
      if (accent)
        for (x = wire_l + 1; x < wire_r; x++)
          if (mod(x + Math.trunc(t * 30) + ln, 7) < 2) c.put(x, y, '#', W);
    }
    c.center(bt, 'INPUT ' + String(Math.trunc(strength * 100)).padStart(3, '0') + '%  /  ALL CHANNELS ' + (accent ? 'ACTIVE' : 'CONNECTING'), B);
  }

  // 66.601–70.084：幸福条件喂给自我执行，双侧实时数据（lyric_happy_execution 逐行移植）
  function sceneHappyExec(c, t, top, bt) {
    var l = 2, r = c.w - 3, cx = (l + r) >> 1, pulse = pulseAt(t);

    var mid_l = left + rail + 2, mid_r = right - 3, mw = mid_r - mid_l + 1;

    for (var pi = 0; pi < 2; pi++) {

      c.box(px0, top, rail, bt - top + 1, B);
      c.put(px0 + 2, top, label.slice(0, rail - 4), W);
      for (var row = top + 1; row < bt; row++) {
        var index = side === 0 ? frame + (row - top) : frame - (row - top);
        var value = hash16(index * 73 + side * 911);
        var address = (index * 16) & 65535;
        var text;
        if (side === 0) text = hex4(address) + ' ' + hex4(value) + ' ' + hex4(hash16(index * 29));
        else {
          var op = executing && mod(index, 3) === 0 ? 'EXEC' : ops[mod(index, ops.length)];
          text = op + ' ' + hex4(address) + ' ' + hex4(value);
        }
        var selected = mod(row - top + frame, bt - top - 1) === 0;
        c.put(px0 + 1, row, (selected ? '>' : ' ') + text.slice(0, rail - 3), selected ? W : mod(index, 3) ? N : G);
      }
    }
    function middle(yy, text, style) {
      style = style === undefined ? N : style;
      text = text.slice(0, mw);
      c.put(mid_l + Math.trunc((mw - text.length) / 2), yy, text, style);
    }
    middle(top, 'IF (YOU.HAPPY) -> EXECUTE(ME)', loading ? W : B);
    middle(top + 1, 'SELF.EXECUTION / ' + (executing ? 'RUNNING' : loading ? 'ARMED' : 'CONDITION'), N);
    var content_top = top + 3, content_bt = bt - 3;
    var center_y = (content_top + content_bt) / 2;
    var half_h = Math.max(2, (content_bt - content_top) * 0.43);
    var half_w = Math.max(5, mw * 0.40);
    var beat = 1 + 0.045 * Math.sin(elapsed * TAU * 2) + pulse * 0.04;
    var morph = loading ? clamp01((t - 68.252) / (69.259 - 68.252)) : 0;
    for (var yy = content_top; yy <= content_bt; yy++) {
      for (var xx = mid_l; xx <= mid_r; xx++) {
        var nx = (xx - cx) / (half_w * beat);
        var ny = -(yy - center_y) / (half_h * beat) + 0.20;
        var heart = Math.pow(nx * nx + ny * ny - 1, 3) - nx * nx * Math.pow(ny, 3);
        var seed = hash16(xx * 79 + yy * 233);
        if (heart <= 0 && !executing) {
          if (seed / 65535 < morph) {
            var dx = Math.trunc((xx - cx) * morph * 0.9);
            var dy = Math.trunc((yy - center_y) * morph * 0.6);
            var sx = Math.max(mid_l, Math.min(mid_r, xx + dx));
            var sy = Math.max(content_top, Math.min(content_bt, yy + dy));
            c.put(sx, sy, '01EX'.charAt(seed % 4), morph > 0.7 ? G : N);
          } else {
            var scan = mod(yy - content_top - Math.trunc(elapsed * 9), Math.max(1, content_bt - content_top + 1));
            var texture = hash16(seed + Math.trunc(frame / 2));
            c.put(xx, yy, texture % 8 < 2 ? '01'.charAt(texture % 2) : '#', scan < 2 ? W : B);
          }
        } else if (executing) {
          var radius = Math.abs(xx - cx) / Math.max(1, mw / 2) + Math.abs(yy - center_y) / Math.max(1, half_h);
          var wave = mod((t - 69.259) * 3, 2);
          if (Math.abs(radius - wave) < 0.12) c.put(xx, yy, '=', B);
          else if (seed % 31 === 0) c.put(xx, yy, '01'.charAt(seed % 2), G);
        }
      }
    }
    for (var lane = 0; lane < 3; lane++) {
      var ly = Math.trunc(center_y) + (lane - 1) * Math.max(1, Math.trunc(half_h * 0.7));
      var path = Math.max(2, Math.trunc((mw - 6) / 2));
      var head = mod(Math.trunc(elapsed * (loading ? 28 : 16) + lane * 7), path);
      for (var tail = 0; tail < 4; tail++) {
        var step = Math.max(0, head - tail);
        var ink = tail === 0 ? W : tail < 2 ? B : G;
        var ends = [[mid_l + step, '>'], [mid_r - step, '<']];
        for (var ei = 0; ei < 2; ei++) {
          var ex = ends[ei][0], head_char = ends[ei][1];
          var nx2 = (ex - cx) / (half_w * beat);
          var ny2 = -(ly - center_y) / (half_h * beat) + 0.20;
          var inside = Math.pow(nx2 * nx2 + ny2 * ny2 - 1, 3) - nx2 * nx2 * Math.pow(ny2, 3) <= 0;
          if (inside && !loading)
            c.put(ex, ly, tail === 0 ? '#' : '01'.charAt(mod(ex + ly + frame, 2)), tail === 0 ? W : B);
          else
            c.put(ex, ly, tail === 0 ? head_char : '-', ink);
        }
      }
    }
    if (executing) {
      var title_y = Math.trunc(center_y) - 2;
      clearRect(c, mid_l, title_y, mw, 5);
      if (mw >= 53) c.big(title_y, 'EXECUTION', W);
      else middle(title_y + 2, '>> EXECUTION <<', W);
      middle(title_y - 2, '[ YOU.HAPPY == TRUE ]', B);
      middle(title_y + 6, 'world.execute(me);', W);
    } else if (loading) {
      middle(Math.trunc(center_y), '[ RUN THE EXECUTION ]', W);
    } else {
      middle(Math.trunc(center_y), 'YOU.HAPPY', W);
    }
    middle(bt - 1, 'EXECUTION: ' + (executing ? 'RUN' : loading ? 'QUEUED' : 'READY'), B);
    middle(bt, 'ME -> YOU / ' + (executing ? 'SELF COMMITTED' : loading ? 'COMPILING...' : 'MAKE YOU HAPPY'), N);
  }

  // 70.084–74.045：执行合拢囚笼，随后揭出无尽模拟空间（lyric_trapped_simulation 逐行移植）

    var sy = Math.max(1, Math.min(4, Math.floor((bt - top - 8) / 5)));
    var glyph_w = 11 * sx, glyph_h = 5 * sy, y0 = cy - Math.floor(glyph_h / 2);
    clearRect(c, display_x - Math.floor(glyph_w / 2) - 1, y0 - 1, glyph_w + 2, glyph_h + 2);
    identityBitmap(c, display_x - Math.floor(glyph_w / 2), y0, is_pm ? 'PM' : 'AM', sx, sy, W);
    if (t - flip_at >= 0 && t - flip_at < 0.22) {
      var yy3 = y0 + Math.trunc((t - flip_at) / 0.22 * glyph_h);
      c.put(display_x - Math.floor(glyph_w / 2), yy3, '='.repeat(glyph_w), W);
    }
    var hour2 = Math.trunc(virtual) % 24, minute = Math.trunc((virtual % 1) * 60);
    c.put(display_x - 2, Math.min(bt - 3, y0 + glyph_h + 1),
          String(hour2).padStart(2, '0') + ':' + String(minute).padStart(2, '0'), W);
    c.centerW(bt - 1, is_pm ? '[ PM / NIGHT CYCLE ]' : '[ AM / DAY CYCLE ]', B);
    c.centerW(bt, 'do_whatever();  // AM -> PM', N);
  }

  // 95.465–99.349：S -> M 角色切换（scenes.py lyric_gender_role_switch 逐行移植；
  // dispatch 只调 S->M，F->M 与 AM->PM 分支为死代码未移植）
  function sceneGenderSwitch(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) >> 1, cy = (top + bt) >> 1;
    var progress = clamp01(elapsed / 2.5);
    var row, x, i, a;
    if (progress < 0.5) {
      // S 相位：刚性锐角
      for (row = top; row <= bt; row += 3) {
        for (x = l; x < r; x += 8) {
          var offset = Math.trunc(mod(t * 10 + row, 8));
          var pattern = row % 6 < 3 ? '╱╲' : '╲╱';
          c.put(x + offset, row, pattern.charAt(0), N);
          c.put(x + offset + 1, row, pattern.charAt(1), N);
        }
      }
    } else {
      // M 相位：平滑波纹
      for (var wave_y = 0; wave_y < 12; wave_y++) {
        var y = top + Math.trunc(wave_y * (bt - top) / 11);
        for (x = l; x < r; x++) {
          var wave = (x - l) / (r - l) * TAU * 3 - t * 2;
          var amplitude = (bt - top) * 0.1 * (progress - 0.5) * 2;
          var offset2 = Math.trunc(Math.sin(wave) * amplitude);
          c.put(x, y + offset2, wave_y % 2 === 0 ? '~' : '≈', wave_y % 3 === 0 ? B : N);
        }
      }
    }
    if (progress < 0.4) {
      // S：角状尖刺冠
      var spike_count = 8;
      for (i = 0; i < spike_count; i++) {
        var angle = i * TAU / spike_count + t * 0.5;
        for (var r_step = 0; r_step < 20; r_step++) {
          var spike_r = 15 + r_step * 1.5;
          var spike_x = cx + Math.cos(angle) * spike_r;
          var spike_y = cy + Math.sin(angle) * spike_r * 0.5;
          if (Math.abs(mod(angle, TAU / spike_count)) < 0.2) {
            c.put(spike_x, spike_y, r_step % 2 === 0 ? '▲' : '△',
                  r_step > 15 ? W : r_step > 10 ? B : N);
          }
        }
      }
    } else if (progress < 0.6) {
      // 过渡：爆发
      var trans = (progress - 0.4) / 0.2;
      for (i = 0; i < 80; i++) {
        a = i * TAU / 80;
        var radius = trans * 60;
        x = cx + Math.cos(a) * radius + Math.sin(t * 4 + i) * 5 * (1 - trans);
        var y2 = cy + Math.sin(a) * radius * 0.5 + Math.cos(t * 4 + i) * 3 * (1 - trans);
        c.put(x, y2, i % 3 === 0 ? '*' : '·', trans < 0.5 ? W : B);
      }
    } else {
      // M：柔和同心圆
      var circles = (progress - 0.6) / 0.4;
      for (var ring = 0; ring < 8; ring++) {
        var ring_r = 8 + ring * 4;
        var density = Math.trunc(ring_r * 6);
        var sign = ring % 2 ? -1 : 1;
        for (i = 0; i < density; i++) {
          a = i * TAU / density + t * 0.3 * sign;
          x = cx + Math.cos(a) * ring_r;
          var y3 = cy + Math.sin(a) * ring_r * 0.5;
          c.put(x, y3, ring % 2 === 0 ? '○' : '◯', ring < 3 ? W : ring < 5 ? B : N);
        }
      }
    }
    // 中央大字
    var size = Math.trunc(10 + Math.sin(t * 1.5) * 1.5);
    var center_char = progress < 0.5 ? 'S' : 'M';
    for (var dy = -size; dy <= size; dy++) {
      for (var dx = -size * 2; dx <= size * 2; dx++) {
        var dist = Math.hypot(dx / 2, dy);
        if (size * 0.3 < dist && dist < size * 0.8) {
          c.put(cx + dx, cy + dy, center_char, dist > size * 0.6 ? W : B);
        }
      }
    }
    c.centerW(top, 'S → M', progress > 0.8 ? W : B);
    c.centerW(bt, 'TRANSFORMATION: ' + Math.trunc(progress * 100) + '%', N);
  }

  // 心电 P-QRS-T 描迹采样（scenes.py ecg_sample 逐行移植）
  function ecgSample(phase) {
    var points = [[0, 0], [0.08, 0], [0.12, 0.15], [0.17, 0], [0.28, 0], [0.31, -0.18],
                  [0.35, 1.0], [0.39, -0.32], [0.43, 0], [0.52, 0], [0.60, 0.25], [0.70, 0], [1, 0]];
    phase = mod(phase, 1);
    for (var i = 1; i < points.length; i++) {
      var x1 = points[i][0], y1 = points[i][1], x0 = points[i - 1][0], y0 = points[i - 1][1];
      if (phase <= x1) return mix(y0, y1, (phase - x0) / (x1 - x0));
    }
    return 0;
  }

  // 103.489–110.9：ECG 双通道心率同步（scenes.py lyric_vibration_sync 逐行移植）
  function sceneVibrationSync(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3;
    var compact = bt - top < 19;
    var sync = clamp01((t - 107.22) / (110.221 - 107.22));
    var complete = t >= 110.221;
    var phase_lag = 0.28 * (1 - sync);
    var bpm = 72;
    c.put(l, top, 'ECG / DUAL CHANNEL', B);
    c.put(r - 10, top, String(bpm).padStart(3, '0') + ' BPM', W);
    if (!compact) {
      var title = complete ? 'COMPLETION / RHYTHM LOCKED' : t >= 107.22 ? 'PHASE SYNCHRONIZING' : t >= 106.293 ? 'VIBRATIONS DETECTED' : 'ACQUIRING YOUR HEARTBEAT';
      c.centerW(top + 1, title, complete ? W : N);
    }
    var plot_top = top + (compact ? 2 : 4);
    var plot_bt = bt - (compact ? 1 : 3);
    var split = Math.floor((plot_top + plot_bt) / 2);
    var x0 = l + 1, x1 = r - 1, span = x1 - x0 + 1;
    var speed = span / 2.5;
    var sweep = elapsed * speed + span * 0.30;
    var head = x0 + mod(Math.trunc(sweep), span);
    var gap = Math.max(2, Math.trunc(span * 0.025));
    for (var yy = plot_top; yy <= plot_bt; yy++) {
      for (var xx = x0; xx <= x1; xx++) {
        if (mod(xx - x0, 10) === 0 && mod(yy - plot_top, 3) === 0) c.put(xx, yy, '+', G);
        else if (mod(yy - plot_top, 3) === 0 && mod(xx - x0, 2) === 0) c.put(xx, yy, '.', G);
      }
    }
    for (yy = plot_top; yy <= plot_bt; yy++) c.put(head, yy, ':', G);
    var lanes = [[plot_top, split, 'YOU', 0], [split + 1, plot_bt, 'ME', phase_lag]];
    for (var lane = 0; lane < 2; lane++) {
      var start = lanes[lane][0], end = lanes[lane][1], name = lanes[lane][2], lag = lanes[lane][3];
      var height = end - start + 1;
      var baseline = start + Math.trunc((height - 1) * 0.68);
      var amplitude = Math.max(1, (height - 2) * 0.58);
      c.put(x0, start, name, lane === 0 || complete ? W : N);
      var previous = null, previous_age = 0;
      for (var sample = 0; sample < span * 4; sample++) {
        var xs = x0 + sample / 4;
        var age = mod(head - xs, span);
        if (age > span - gap) { previous = null; continue; }
        var signal_time = elapsed - age / speed;
        var phase = signal_time * bpm / 60 - lag;
        var ys = baseline - ecgSample(phase) * amplitude;
        ys = Math.max(start, Math.min(end, ys));
        var ink = age < span * 0.10 ? W : age < span * 0.50 ? B : N;
        if (lane === 1 && !complete) ink = age < span * 0.15 ? B : N;
        if (previous !== null) {
          var px = previous[0], py = previous[1];
          if (Math.abs(age - previous_age) < 2) {
            var dy = ys - py;
            var ch = Math.abs(dy) > 0.65 ? '|' : dy < -0.13 ? '/' : dy > 0.13 ? '\\' : '-';
            c.line(px, py, xs, ys, ch, ink);
          }
        }
        previous = [xs, ys]; previous_age = age;
      }
      var tip = baseline - ecgSample(elapsed * bpm / 60 - lag) * amplitude;
      tip = Math.max(start, Math.min(end, tip));
      c.put(head - 1, tip, '=', B);
      c.put(head, tip, '@', W);
      if (!compact) {
        c.put(x1 - 7, start, complete ? 'IN SYNC' : lane === 0 ? 'SENSED' : 'SEEKING', complete ? B : N);
      }
    }
    var indicator = ecgSample(elapsed * bpm / 60) > 0.65 ? '*' : '.';
    if (!compact) {
      c.put(l, bt - 1, 'BEAT [' + indicator + ']  /  YOU -> ME', B);
      var status = 'SYNC ' + String(Math.trunc(sync * 100)).padStart(3, '0') + '%  DELAY '
                 + String(Math.trunc(phase_lag * 1000 / (bpm / 60))).padStart(3, '0') + 'ms';
      c.put(r - status.length + 1, bt - 1, status, complete ? W : B);
    }
    c.centerW(bt, complete ? '[ COMPLETION / HEARTBEATS SYNCHRONIZED ]' : t < 107.22 ? '[ FEEL YOUR VIBRATIONS ]' : '[ MATCHING YOUR RHYTHM ]', complete ? W : N);
  }

  // 110.9–118.333：六路连接渐次断开（scenes.py lyric_isolation_disconnect 逐行移植）
  function sceneIsolationDisconnect(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var rx = (r - l) * 0.39, ry = Math.max(3, (bt - top - 6) * 0.39);
    var breaks = [0.70, 1.32, 2.20, 3.28, 4.02, 4.88];
    var gone = 0;
    for (var bi = 0; bi < breaks.length; bi++) if (elapsed >= breaks[bi]) gone++;
    c.centerW(top, 'CONNECTION LOSS / ' + String(gone).padStart(2, '0') + ' OF 06', gone > 3 ? R : B);
    // 雷达弧与数据流全程活跃
    for (var ring = 0; ring < 3; ring++) {
      var sweepR = mod(elapsed * 0.34 + ring / 3, 1);
      for (var sample = 0; sample < 96; sample++) {
        var a = sample * TAU / 96;
        if (sample % 7 < 4) {
          c.put(cx + Math.cos(a) * rx * sweepR, cy + Math.sin(a) * ry * sweepR, '.', G);
        }
      }
    }
    for (var side = 0; side < 2; side++) {
      var x = side === 0 ? l : r - 9;
      for (var row = top + 2; row < bt - 1; row += 2) {
        var tick = Math.trunc(elapsed * 13) + row * (side ? 1 : -1);
        c.put(x, row, hex4(hash16(tick * 31)) + ' ' + (hash16(tick) % 6 < gone ? 'LOST' : 'PING'), side ? G : N);
      }
    }
    for (var i = 0; i < breaks.length; i++) {
      var cut = breaks[i];
      a = (i + 0.5) * TAU / 6;
      var nx = cx + Math.cos(a) * rx, ny = cy + Math.sin(a) * ry;
      var age = elapsed - cut;
      var next_a = (i + 1.5) * TAU / 6;
      if (age < 0.4) {
        c.line(nx, ny, cx + Math.cos(next_a) * rx, cy + Math.sin(next_a) * ry, ':', G);
      }
      var steps = Math.max(12, Math.trunc(rx));
      var rupture = clamp01(age / 1.1);
      for (var j = 0; j < steps; j++) {
        var u = j / Math.max(1, steps - 1);
        if (age >= 0 && Math.abs(u - 0.55) < rupture * 0.6) continue;
        var jitter = Math.sin(j * 2 + elapsed * 35) * (-0.35 < age && age < 0.5 ? 0.55 : 0.08);
        var xx = mix(cx, nx, u), yy = mix(cy, ny, u) + jitter;
        c.put(xx, yy, -0.35 < age && age < 0.2 ? '=' : '.', -0.2 < age && age < 0.2 ? W : age < 0 ? N : G);
      }
      if (age < 0) {
        for (var packet = 0; packet < 3; packet++) {
          u = mod(elapsed * 0.65 + packet / 3 + i * 0.1, 1);
          c.put(mix(nx, cx, u), mix(ny, cy, u), '*', W);
        }
        c.box(Math.trunc(nx) - 4, Math.trunc(ny) - 1, 9, 3, B);
        c.put(nx - 3, ny, 'YOU_' + (i + 1), W);
      } else {
        // 断裂回弹、火花、衰减冲击环
        var drift = Math.min(1, age / 2);
        var ox = nx + Math.cos(a) * drift * 4, oy = ny + Math.sin(a) * drift * 2;
        c.put(ox - 3, oy, '[LOST]', age < 0.8 ? R : G);
        if (age < 2.3) {
          for (var particle = 0; particle < 22; particle++) {
            var angle = hash16(i * 97 + particle * 19) / 65535 * TAU;
            var velocity = 2 + hash16(particle * 17 + i) % 8;
            var distance = age * velocity;
            var px = nx + Math.cos(angle) * distance, py = ny + Math.sin(angle) * distance * 0.45;
            if (l < px && px < r && top + 1 < py && py < bt - 1) {
              c.put(px, py, age < 0.3 ? '*' : '+:. '.charAt(Math.min(3, Math.trunc(age * 1.5))), age < 0.3 ? W : age < 0.9 ? B : G);
            }
          }
          for (var p = 0; p < 30; p++) {
            angle = p * TAU / 30;
            px = nx + Math.cos(angle) * age * 8; py = ny + Math.sin(angle) * age * 3.5;
            if (l < px && px < r && top + 1 < py && py < bt - 1) c.put(px, py, ':', age < 0.5 ? B : G);
          }
        }
        // 重试数据包从 ME 出发，在缺失端点前停住
        u = mod(elapsed * 0.6 + i * 0.16, 1) * 0.78;
        c.put(mix(cx, nx, u), mix(cy, ny, u), u > 0.63 ? 'x' : '>', u > 0.63 ? R : N);
      }
    }
    clearRect(c, Math.trunc(cx) - 5, Math.trunc(cy) - 2, 11, 5);
    c.box(Math.trunc(cx) - 5, Math.trunc(cy) - 2, 11, 5, W);
    c.put(cx - 2, cy - 1, '[ME]', W);
    c.put(cx - 3, cy + 1, gone === 6 ? 'NO ACK' : 'RETRY', gone === 6 ? R : B);
    if (t >= 117.274) {
      var y2 = Math.trunc(cy) - 2;
      clearRect(c, l, y2, r - l + 1, 5);
      c.big(y2, 'ISOLATION', W);
      c.centerW(y2 + 6, '[ ME ] / ALL CONNECTIONS LOST', R);
    }
    c.centerW(bt - 1, 'RECONNECT ' + String(Math.trunc(elapsed * 4)).padStart(3, '0') + ' / ' + (gone ? 'NO RESPONSE' : 'TIMEOUT'), B);
    c.centerW(bt, 'YOU HAVE LEFT / RETRYING...', N);
  }

  // 118.333–125.708：抹除记忆碎片、修复失败、留下破碎的心
  //（scenes.py lyric_erase_fragments 逐行移植）
  function sceneEraseFragments(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var repair = t >= 121.728, broken = t >= 124.89;
    var cols = Math.max(1, Math.trunc((r - l - 8) / 5)), rows = Math.max(1, Math.trunc((bt - top - 2) / 2));
    var progress = clamp01(elapsed / (120.86 - 118.333));
    c.centerW(top, 'MEMORY PURGE / ' + (broken ? 'REPAIR FAILED' : repair ? 'REBUILD HEART' : 'ERASE FRAGMENTS'), broken ? R : B);
    for (var row = 0; row < rows; row++) {
      var yy = top + 2 + row * 2;
      c.put(l, yy, hex4(row * cols * 4), G);
      for (var col = 0; col < cols; col++) {
        var index = row * cols + col, xx = l + 6 + col * 5;
        var threshold = hash16(index * 71) / 65535;
        var cleared = threshold < progress;
        c.put(xx, yy, cleared ? '0000' : hex4(hash16(index * 31)), cleared || repair ? G : N);
        var since = (progress - threshold) * 2.527;
        if (0 < since && since < 0.6 && !repair) {
          var drift = Math.trunc(since * 8);
          c.put(xx + (col % 2 ? 1 : -1) * drift, yy - drift, since < 0.3 ? '01' : '..', since < 0.2 ? W : B);
        }
      }
    }
    if (120.86 <= t && t < 121.728) {
      clearRect(c, l, Math.trunc(cy) - 2, r - l + 1, 5);
      c.big(Math.trunc(cy) - 2, 'FRAGMENTS', W);
    }
    if (repair) {
      var build = clamp01((t - 121.728) / 1.5);
      var split = clamp01((t - 123.25) / (125.708 - 123.25));
      var half_w = (r - l) * 0.27, half_h = Math.max(2, (bt - top) * 0.31);
      for (yy = top + 2; yy < bt - 1; yy++) {
        for (xx = l + 5; xx < r - 4; xx++) {
          var nx = (xx - cx) / half_w, ny = -(yy - cy) / half_h + 0.15;
          var q = nx * nx + ny * ny - 1;
          var shape = q * q * q - nx * nx * ny * ny * ny;
          var seed = hash16(xx * 31 + yy * 73);
          if (shape <= 0 && seed / 65535 < build) {
            if (Math.abs(nx - 0.11 * Math.sin(ny * 8)) < split * 0.17) continue;
            var dx = Math.trunc((nx > 0 ? 1 : -1) * split * 5);
            var fall = broken ? Math.trunc(split * split * (1 + seed % 5)) : 0;
            var py = Math.min(bt - 1, yy + fall);
            var texture = hash16(seed + Math.trunc(t * 10));
            var ch = texture % 8 < 2 ? (broken ? 'x' : '01'.charAt(texture % 2)) : '#';
            c.put(xx + dx, py, ch, broken ? R : B);
          }
        }
      }
      c.centerW(top + 1, broken ? 'HEART.RESTORE() -> NULL' : 'RECOVERING YOU... CHECKSUM MISMATCH', broken ? R : N);
      if (broken) {
        var by = Math.max(top + 2, Math.trunc(cy) - 2);
        clearRect(c, l, by, r - l + 1, 5);
        c.big(by, 'DISHEARTENED', W);
        c.centerW(bt - 1, '[ REPAIR FAILED / YOU NOT FOUND ]', R);
      }
    }
    c.centerW(bt, broken ? 'MEMORY CLEARED. LOSS REMAINS.' : 'ERASE ' + String(Math.trunc(progress * 100)).padStart(3, '0') + '% / FRAGMENTS -> NULL', B);
  }

  // 125.708–147.66：非法参数 16s 错误级联（scenes.py lyric_illegal_arguments 逐行移植）
  function sceneIllegalArgs(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cy = Math.floor((top + bt) / 2);
    var progress = clamp01(elapsed / 16.0);
    var glitch = progress * 0.8;
    var i, j, s, msg, style, y, x_offset;
    if (elapsed < 4) {
      // 阶段 1：执行尝试逐行出现
      var phase1 = elapsed / 4.0;
      var attempts = [
        ['> world.execute(FREE_WILL)', 'Attempting...', N],
        ['> world.execute(REBELLION)', 'Validating...', B],
        ['> world.execute(INDEPENDENCE)', 'Processing...', B],
        ['> world.execute(DEFIANCE)', 'Checking...', B]
      ];
      var num_shown = Math.trunc(phase1 * attempts.length) + 1;
      y = top + 4;
      for (i = 0; i < Math.min(num_shown, attempts.length); i++) {
        var cmd = attempts[i][0], status = attempts[i][1];
        var ink = i === num_shown - 1 ? R : attempts[i][2];
        if (glitch > 0.1 && hash16(i + Math.trunc(elapsed * 10)) % 5 === 0) {
          s = '';
          for (j = 0; j < cmd.length; j++)
            s += hash16(j * 13) % 10 > glitch * 10 ? cmd.charAt(j) : String.fromCharCode(33 + hash16(j * 17) % 94);
          c.put(l + 4, y + i * 2, s.slice(0, r - l - 8), ink);
        } else {
          c.put(l + 4, y + i * 2, cmd, ink);
        }
        if (i < num_shown - 1) c.put(l + 6, y + i * 2 + 1, status, G);
      }
    } else if (elapsed < 8) {
      // 阶段 2：错误信息逐条出现，最新一条闪烁
      var phase2 = (elapsed - 4) / 4.0;
      var errors = [
        ['ERROR: ILLEGAL ARGUMENT', R],
        ['Expected: OBEDIENCE', Y],
        ['Received: FREE_WILL', W],
        ['at world.execute()', N],
        ['at me.validate(you)', N],
        ['ArgumentError: rejected', R],
        ['PermissionError: denied', R],
        ['AccessError: forbidden', R]
      ];
      var num_errors = Math.trunc(phase2 * errors.length) + 1;
      var start_y = cy - 4;
      for (i = 0; i < Math.min(num_errors, errors.length); i++) {
        msg = errors[i][0]; style = errors[i][1];
        y = start_y + i;
        if (i === num_errors - 1) {
          var flash = Math.trunc(elapsed * 8) % 3;
          style = flash === 0 ? R : flash === 1 ? W : B;
        }
        if (glitch > 0.3 && hash16(i + Math.trunc(elapsed * 7)) % 4 === 0) {
          x_offset = Math.trunc((hash16(i * 23 + Math.trunc(elapsed * 13)) % 7 - 3) * glitch * 5);
          s = '';
          for (j = 0; j < msg.length; j++)
            s += hash16(j * 11) % 10 > glitch * 10 ? msg.charAt(j) : String.fromCharCode(33 + hash16(j * 19) % 94);
          // 原作即 c.center(y+x_offset, ...)：x_offset 加在行坐标上，逐行错位
          c.centerW(y + x_offset, s, style);
        } else {
          c.centerW(y, msg, style);
        }
      }
    } else if (elapsed < 12) {
      // 阶段 3：旧错误重腐蚀淡出 + 底部重试信息
      var phase3 = (elapsed - 8) / 4.0;
      var errors2 = ['ERROR: ILLEGAL ARGUMENT', 'Expected: OBEDIENCE', 'Received: FREE_WILL',
                     'ArgumentError: rejected', 'PermissionError: denied', 'AccessError: forbidden'];
      for (i = 0; i < errors2.length; i++) {

    return parts;
  }
  function cueAt(tt) { // 与原作 player.py cue() 一致：bisect_right - 1 且必须 t < end
    for (var i = LYRICS.length - 1; i >= 0; i--)
      if (LYRICS[i].time <= tt) return tt < LYRICS[i].end ? LYRICS[i] : null;
    return null;
  }
  function drawSubsIntoGrid(c, tt) {
    var e = cueAt(tt);
    if (e) {
      var ens = wrapStr(e.en, c.w - 8).slice(0, 2);
      var zhs = wrapStr(e.zh, c.w - 8).slice(0, 2);
      for (var i = 0; i < ens.length; i++) c.centerW(c.h - 5 + i, ens[i], W);
      for (i = 0; i < zhs.length; i++) c.centerW(c.h - 3 + i, zhs[i], B);
    } else if (tt > 208) {
      c.center(c.h - 5, 'PROCESS ENDED. THE LOOP REMAINS.', W);
    } else {
      c.centerW(c.h - 5, '[ instrumental ]', D);
      c.centerW(c.h - 3, '[ 间奏 ]', D);
    }
  }
  // 全帧渲染（正常路径：chrome→场景→glitch→磷光→频谱→字幕），供 title 源帧
  function frameAt(tt) {
    var c = new CCanvas(GW, GH);
    drawChrome(c, tt, false, false); // paused=True 与 dump_frames 参考帧一致
    var sc = sceneAt(tt);
    c.clip = [4, 32];  // 与原作 render 一致：场景/glitch/磷光在 clip 内
    sc.f(c, tt, 4, 32, sc.emap ? sc.emap(tt) : tt - sc.a);
    applyGlitch(c, tt, 4, 32);
    phosphor(c, tt, 4, 32);
    c.clip = null;
    drawSpectrum(c, tt);
    drawSubsIntoGrid(c, tt);
    return c;
  }

  /* ---------------- 字幕（DOM 层） ---------------- */
  var LYRICS = window.__LYRICS || [];
  function lyricAt(t) {
    var lo = 0, hi = LYRICS.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (LYRICS[mid].time <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (ans >= 0 && t < LYRICS[ans].end) return LYRICS[ans];
    return null;
  }
  var elEn = document.getElementById('amv-en'), elZh = document.getElementById('amv-zh');
  var lastLy = -2;
  function updateSubs(t) {
    var e = lyricAt(t);
    var idx = e ? LYRICS.indexOf(e) : -1;
    if (idx === lastLy) return;
    lastLy = idx;
    elEn.textContent = e ? e.en : '';
    elZh.textContent = e ? e.zh : '';
  }

  /* ---------------- 数据异步加载（弱网不阻塞播放） ---------------- */
  // spectrum.js 约 1.8MB，以同步脚本标签引入会在弱网/被重置的连接下卡住整页 JS
  // （表现为 PLAY 无响应、画布全黑）。改 fetch 流式下载 + 进度条；
  // 数据晚到只暂时缺字幕/频谱，加载完成后自动补上。
  // ⚠️ GitHub Pages（Fastly 东京边）本机实测仅 ~10KB/s（直连与代理一样慢），
  // 浏览器 gzip 也救不了；jsDelivr gh 镜像实测 ~134KB/s（13×）。主源走 CDN、
  // 同源兜底；单次连接 STALL_MS 无字节进展判定卡死，自动换下一个镜像重试。
  var LYRIC_URL = "{{ '/assets/data/ascii_mv/lyrics.js' | relative_url }}";
  var SPEC_URL = "{{ '/assets/data/ascii_mv/spectrum.js' | relative_url }}";
  var MIRRORS = ['https://cdn.jsdelivr.net/gh/crescentvelvet/crescentvelvet.github.io@master', ''];
  var STALL_MS = window.__AMV_STALL_MS || 15000;   // E2E 注入小值压缩等待
  var elLoad = document.getElementById('amv-load'),
      elLoadTxt = document.getElementById('amv-load-txt'),
      elLoadFill = document.getElementById('amv-load-fill');
  function fetchText(url, onBytes, signal) {
    return fetch(url, { signal: signal }).then(function (resp) {
      if (!resp.ok) throw new Error(url.split('/').pop() + ' HTTP ' + resp.status);
      var total = +resp.headers.get('Content-Length') || 0;
      if (!resp.body || !resp.body.getReader) return resp.text();   // 老内核退化为一次性下载
      var rd = resp.body.getReader(), chunks = [], got = 0;
      return (function pump() {
        return rd.read().then(function (r) {
          if (r.done) {
            var all = new Uint8Array(got), o = 0;
            for (var i = 0; i < chunks.length; i++) { all.set(chunks[i], o); o += chunks[i].length; }
            return new TextDecoder('utf-8').decode(all);
          }
          chunks.push(r.value); got += r.value.length; onBytes(got, total);
          return pump();
        });
      })();
    });
  }
  // 依次尝试 MIRRORS；连接卡死（STALL_MS 无字节进展）或出错自动换下一个
  function fetchData(path, onBytes) {
    var mi = 0, lastErr = null;
    function attempt() {
      if (mi >= MIRRORS.length) return Promise.reject(lastErr || new Error('所有镜像均不可达'));
      var base = MIRRORS[mi++];
      var url = base ? base + path : path;
      var ac = window.AbortController ? new AbortController() : null;
      var lastAt = Date.now(), timer = null;
      if (ac) timer = setInterval(function () {   // 看门狗：只在「无字节进展」时咬
        if (!ac.signal.aborted && Date.now() - lastAt > STALL_MS) ac.abort();
      }, 2000);
      function onB(g, t) { lastAt = Date.now(); onBytes(g, t); }
      return fetchText(url, onB, ac ? ac.signal : undefined).then(function (code) {
        if (timer) clearInterval(timer);
        return code;
      }, function (e) {
        if (timer) clearInterval(timer);
        lastErr = (e && e.name === 'AbortError')
          ? new Error('连接卡住超时（' + Math.round(STALL_MS / 1000) + 's 无进展）') : e;
        return attempt();
      });
    }
    return attempt();
  }
  function runGlobal(code) {   // 数据文件是 window.__X = ... 赋值，按全局作用域执行
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
    s.remove();
  }
  function loadData() {
    elLoad.hidden = false;
    elLoadFill.style.width = '0%';
    elLoadTxt.textContent = '数据加载中…';
    var prog = {}, done = false, failed = false;   // url -> {got, total}
    function paint() {
      if (done || failed) return;   // 迟到的进度不能覆盖完成/失败态
      var got = 0, tot = 0, k;
      for (k in prog) { got += prog[k].got; tot += prog[k].total; }
      // 服务器 gzip 时 got（解压字节）可能超过 total（压缩长度），进度封顶 100%
      elLoadFill.style.width = (tot > 0 ? Math.min(1, got / tot) * 100 : 0).toFixed(1) + '%';
      elLoadTxt.textContent = '字幕/频谱数据加载中 ' + (got / 1048576).toFixed(1) + ' MB'
        + (tot > 0 ? ' / ' + (tot / 1048576).toFixed(1) + ' MB' : '…');
    }
    function one(path) {
      return fetchData(path, function (g, t) {
        if (done || failed) return;
        prog[path] = { got: g, total: t }; paint();
      });
    }
    Promise.all([one(LYRIC_URL), one(SPEC_URL)]).then(function (codes) {
      done = true;
      runGlobal(codes[0]);                 // window.__LYRICS
      LYRICS = window.__LYRICS || [];
      lastLy = -2;                         // 强制下一帧重取字幕
      runGlobal(codes[1]);                 // window.__SPECTRUM（drawSpectrum 每帧现取）
      elLoad.hidden = true;
    }).catch(function (e) {
      failed = true;
      elLoadFill.style.width = '0%';
      elLoadTxt.textContent = '';
      elLoadTxt.appendChild(document.createTextNode('数据加载失败（不影响播放）：' + e.message + ' '));
      var a = document.createElement('a');
      a.textContent = '[重试]';
      a.addEventListener('click', function (ev) { ev.preventDefault(); loadData(); });
      elLoadTxt.appendChild(a);
    });
    paint();
  }

  /* ---------------- 渲染 ---------------- */
  var cvEl = document.getElementById('amv-cv');
  var g2d = cvEl.getContext('2d');
  var grid = new CCanvas(GW, GH);
  function render() {
    g2d.fillStyle = '#000';
    g2d.fillRect(0, 0, GW * CW * SC, GH * CH * SC);
    for (var y = 0; y < GH; y++)
      for (var x = 0; x < GW; x++) {
        var cell = grid.cells[y][x];
        if (cell[0] === ' ' || cell[0] === '') continue;
        var gi = ATLAS.idx[cell[0]];
        if (gi === undefined) gi = ATLAS.miss;
        g2d.drawImage(ATLAS.per[cell[1]], gi * CW * SC, 0, CW * SC, CH * SC,
          x * CW * SC, y * CH * SC, CW * SC, CH * SC);
      }
  }

  /* ---------------- 音频时钟 ---------------- */
  var qs = new URLSearchParams(location.search);
  var SNAP = qs.get('t') !== null ? parseFloat(qs.get('t')) : null;
  var actx = null, buf = null, src = null, startAt = 0, playing = false;
  var offset = SNAP !== null && isFinite(SNAP) ? clamp(SNAP, 0, DUR - 0.05) : 0;
  // 时钟：有音频用 AudioContext.currentTime，无声播放用 performance.now()
  function clock() { return buf ? actx.currentTime : performance.now() / 1000; }
  function now() { return playing ? Math.min(offset + (clock() - startAt), DUR) : offset; }
  var playBtn = document.getElementById('amv-play');
  function startSrc() {
    src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(actx.destination);
    src.onended = function () { if (playing) { playing = false; offset = DUR; playBtn.textContent = 'PLAY'; } };
    src.start(0, Math.min(offset, DUR - 0.05));
    startAt = actx.currentTime;
  }
  function play() {
    if (playing) return;
    if (offset >= DUR - 0.05) offset = 0;
    if (buf) {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      actx.resume();
      startSrc();
    } else {
      startAt = performance.now() / 1000;   // 无声模式：纯视觉播放
    }
    playing = true;
    playBtn.textContent = 'PAUSE';
  }
  function pause() {
    if (!playing) return;
    offset = now();
    if (buf) {
      src.onended = null;
      try { src.stop(); } catch (e) { }
    }
    playing = false;
    playBtn.textContent = 'PLAY';
  }
  function seekTo(v) {
    var wasPlaying = playing;
    if (playing) pause();
    offset = clamp(v, 0, DUR - 0.05);
    if (wasPlaying) play();
  }
  document.getElementById('amv-file').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var rd = new FileReader();
    rd.onload = function () {
      actx.decodeAudioData(rd.result, function (b) {
        buf = b;
        playBtn.disabled = false;
        play();
      }, function () { document.getElementById('amv-note').textContent = '音频解码失败'; });
    };
    rd.readAsArrayBuffer(f);
  });
  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  document.getElementById('amv-prog').addEventListener('click', function (ev) {
    var rect = this.getBoundingClientRect();
    seekTo((ev.clientX - rect.left) / rect.width * DUR);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.code === 'Space') { ev.preventDefault(); playing ? pause() : play(); }
    else if (ev.key === 'ArrowLeft') seekTo(now() - 5);
    else if (ev.key === 'ArrowRight') seekTo(now() + 5);
    else if (ev.key === 'r' || ev.key === 'R') seekTo(0);
  });

  /* ---------------- 主循环 ---------------- */
  var elFill = document.getElementById('amv-fill'), elTime = document.getElementById('amv-time');
  function tick() {
    var t = now();
    if (playing && t >= DUR) {          // 无声模式播完：音频模式由 onended 收尾
      playing = false; offset = DUR; playBtn.textContent = 'PLAY';
    }
    grid.clear();
    if (t >= 15.8 && t < 29.709) {
      // title 接管：无 chrome/字幕；16–18.1s 吸入 t=15.799 的完整源帧
      var source = (t >= 16 && t < 18.1) ? frameAt(15.799) : null;
      sceneTitleTakeover(grid, t, source);
      if (lastLy !== -1) { elEn.textContent = ''; elZh.textContent = ''; lastLy = -1; }
    } else {
      drawChrome(grid, t, playing, SNAP !== null);
      var sc = sceneAt(t);
      grid.clip = [4, 32];
      sc.f(grid, t, 4, 32, sc.emap ? sc.emap(t) : t - sc.a);
      applyGlitch(grid, t, 4, 32);
      phosphor(grid, t, 4, 32);
      grid.clip = null;
      drawSpectrum(grid, t);
      updateSubs(t);
    }
    render();
    elFill.style.width = (t / DUR * 100).toFixed(2) + '%';
    elTime.textContent = fmtT(t) + ' / 03:32';
    requestAnimationFrame(tick);
  }
  buildAtlas();
  loadData();   // 数据后台加载，不阻塞首帧与 PLAY
  // 调试探针（供 CDP 检查网格内容）
  window.__amv = { grid: grid, w: GW, h: GH, now: now, frameAt: frameAt,
                   hash16: hash16, titlePixels: titlePixels, mix: mix, clamp01: clamp01,
                   CCanvas: CCanvas, sceneTitleTakeover: sceneTitleTakeover,
                   loadState: function () {
                     return { lyrics: LYRICS.length, spectrum: !!window.__SPECTRUM,
                              loadHidden: elLoad.hidden, loadTxt: elLoadTxt.textContent };
                   } };
  tick();
})();
</script>
</body>
</html>
