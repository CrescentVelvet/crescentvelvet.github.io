          // 两级平滑噪声：大块 9×6 决定塌陷范围，小块 4×3 在块边缘啃碎屑。
          // 光滑之后碎块边界有弧度，不再是直角马赛克。
          // 但采样不再"整块瞬间漏空"：给每块算一个消失时刻 t1，在 t1 之前 0.45 的窗口里
          // 把亮度线性压到 0 ⇒ 每格依次走 █→▓→▒→░→· 才消失。整块共享同一个 h，
          // 同块内同步降档，读起来是"这一块光在淡下去"，而不是"被抠掉一块"。
          var h=luBlockNoise(x,y,12,8,0)*0.72+luBlockNoise(x,y,5,3,977)*0.28;
          var sidx=clamp01((h-0.22)/0.56);          // 噪声挤在 0.5 附近，先拉平到 0..1
          var t1=0.55+sidx*(1.0+0.40*v)/1.40*0.45;  // 消失时刻∈[0.55,1]；亮块更耐 ⇒ 亮核最后散
          var pr=clamp01((dissolve-t1+0.55)/0.55);  // 0=满档，1=已散尽
          if(pr>0)v*=(1-pr);
        }
        if(v<=0.04)continue;
        var ch;
        if(v<0.22) {
          ch=v<0.11?'·':'░';
          // 最外一档才抽样，让边缘是碎点而不是一条硬边。溶解时不再逐格抽样——
          // 随机性已经由块噪声提供，再逐格抽一次会把这半档打成一屏散点（就是之前那版"雪花"）。
          if(dissolve<=0&&hash16(x*37+y*71)/65535>clamp01(v/0.22))continue;
        } else ch=v>0.82?'█':v>0.62?'▓':v>0.42?'▒':'░';
        c.put(x,y,ch,W);
      }
    }
    c.clip=save;
  }

  // 一扇石门：券洞（半圆拱）+ 券脸石圈 + 两侧门垛 + 门槛台阶，全部用成片色块堆出来。
  // 和本曲前面的厚涂场景同一套语言：没有轮廓线，靠"受光面亮一档、背光面暗两档"分出体积。
  // 券圈内缘压在门洞上，是全场最亮的一圈（光从门洞里透出来打在石头上）；外缘收进暗部。
  // 门洞内部留空，所以能看见里面那一扇——纵深由"三层同框 + 尺寸级差"表达。
  function luDreamPortal(c,cx,cy,p,t,index) {
    var s=0.22*Math.pow(13,p);                   // 0.22→2.86，三层级差 2.35 倍 ⇒ 匀速透视
    if(s>3.0)return;
    // 地平线随贴近而下沉（门槛从脚下扫出画外），近处那一扇才不会"啪"地消失。
    var floor=cy+13+8*p*p;
    var HW=15*s;                                 // 门洞内半宽（列）——别用 W，W 是白色调色板常量
    var springY=floor-11*s;                      // 起拱线：下面直腿、上面半圆拱
    cx+=Math.sin(t*1.7+index*2.1)*0.8*(1-p);     // 极慢视差漂移，不做高频抖动
    var near=p>0.62,fade=p>0.34;
    // 门扇：两片对开红门，关门时铺满整个券洞，靠近过程中从中缝向两侧裂开，全开时宽度归零。
    // 用全场唯一的红——石框是暖黄橙，红门板一眼就和框分开，"门正在开"这件事才看得见。
    // 开合跟 p 走而不是跟时间走：每一扇都是"远处关着 → 走近时打开 → 贴脸时已全开"。
    // 开门窗口刻意压在 p 的后半段：p<0.30 才算"关着"。因为三层错相 1/3，最近一层的 p
    // 恒 ≥2/3，所以它永远已经开走——画面里始终有一扇正在被穿过，门板可见的永远是"正要开
    // 的那一扇"。窗口再往前提，最近层就会一直半开着，红门板只剩两根竖条，反而看不见开门。
    var open=clamp01((p-0.30)/0.32),gap=open*HW;
    var gHW=Math.max(0.8,HW-gap),fBase=Math.round(floor),syBase=Math.round(springY);
    var fanA=clamp01((1-open)/0.34);              // 门扇剩余强度：开过 2/3 后开始褪、散
    // 券厚按视觉单位算（1 列 = 1、1 行 = 2），所以纵向看着和横向一样厚。
    var Tv=Math.max(2,Math.min(8,HW*0.52));
    var x0=Math.max(1,Math.floor(cx-HW-Tv-1)),x1=Math.min(c.w-2,Math.ceil(cx+HW+Tv+1));
    var y0=Math.max(4,Math.floor(springY-HW*0.5-Tv-1)),y1=Math.min(32,Math.floor(floor+2));
    for(var y=y0;y<=y1;y++) {
      var vy=(springY-y)*2;
      for(var x=x0;x<=x1;x++) {
        var vx=x-cx;
        // 到门洞内侧边缘的距离：直腿段按水平算，拱顶段按到拱心的距离算。
        var o=vy<=0?Math.abs(vx)-HW:Math.hypot(vx,vy)-HW;
        if(o<0) {
          // 券洞内部＝两扇对开的门。整扇一起裂到拱尖，才是双开拱门；缝里就是空的，
          // 能直接看见里面那一扇，不另画光——缝里压一道白线在大尺寸时会读成两根光柱。
          var ax=Math.abs(vx),pol,dc,ds;
          if(gap<0.55&&ax<0.55) { c.put(x,y,'█',K); continue; }   // 闭合时的一道暗合缝
          if(ax<gap)continue;                     // 门缝：留空，透出里面的下一扇
          pol=clamp01((ax-gap)/gHW);
          dc='▓'; ds=R;                           // 整片门板同一个红，只靠两条边分体积
          if(pol<0.18)      { dc='█'; ds=R; }     // 中缝一侧受光
          else if(pol>0.84) { dc='▒'; ds=R; }     // 靠门柱一侧进暗
          // 横向铁箍：每四行一道暗棕，把门板分成几段，读成"木板拼起来的门"而不是一块红布。
          if(HW>5&&y>=syBase&&((y-fBase)%4+4)%4<1) { dc='▓'; ds=G; }
          // 全开前门扇只剩窄条，一条竖红在画面里就是"光柱"。收尾阶段让它先褪成暗影、
          // 再逐步漏格散掉，门是"开走了"而不是"被劈成两根柱子留在原地"。
          if(fanA<0.90&&hash16(x*29+y*97)/65535>fanA*1.05)continue;
          if(fanA<0.60)ds=G;
          c.put(x,y,dc,ds);
          continue;
        }
        if(o>Tv)continue;                        // 圈外不画
        var u=o/Tv,ch,st;
        if(u<0.26)      { ch=near?'█':fade?'▓':'▒'; st=near?B:fade?N:K; }   // 内缘受光
        else if(u<0.76) { ch=near?'▓':fade?'▒':'░'; st=near?N:fade?G:K; }   // 石身
        else            { ch=near?'▒':fade?'░':'·'; st=near?G:fade?K:K; }   // 外缘进暗
        // 拱顶每 45° 一道石缝，把券圈切成八块大方石。缝用暗棕不用墨绿，免得起苔藓味。
        if(vy>0&&Tv>4) {
          var sg=(Math.atan2(vy,vx)+Math.PI)/(Math.PI/4);
          if(Math.abs(mod(sg+0.5,1)-0.5)<0.035) { ch='▓'; st=G; }
        }
        c.put(x,y,ch,st);
      }
    }
    // 起拱石：只在门腿外侧压一道一行的暗色外挑，标出"腿顶着券"的交接。
    // 试过两行亮色外挑 —— 在大尺寸时像从券上横伸出来的架子，反而破体积，所以压成一行暗调。
    if(HW>5) {
      var cy0=Math.round(springY)+1;
      for(var capX=Math.ceil(HW);capX<=Math.floor(HW+Tv*0.7);capX++) {
        c.put(cx-capX,cy0,'▓',G);
        c.put(cx+capX,cy0,'▓',G);
      }
    }
    // 拱心石：拱顶正中一块压顶的亮石，厚涂场景的点睛，也标出中轴。
    var ky=Math.round(springY-HW*0.5-Tv*0.45);
    if(HW>6&&ky>6&&ky<30) {
      for(var ky2=ky;ky2<=ky+1;ky2++)
        for(var kx=Math.floor(cx-2);kx<=Math.ceil(cx+2);kx++) c.put(kx,ky2,'█',near?B:G);
      c.put(cx,ky-1,'◆',near?W:N);
    }
    // 门槛：两级实心台阶，顶面吃光、立面进暗。
    for(var st2=1;st2<=2;st2++) {
      var sy2=Math.floor(floor+st2);
      if(sy2>32)continue;
      for(var sx2=Math.max(1,Math.floor(cx-HW-Tv*0.6));sx2<=Math.min(c.w-2,Math.ceil(cx+HW+Tv*0.6));sx2++)
        c.put(sx2,sy2,st2===1?'█':'▓',st2===1?(near?B:G):(near?G:K));
    }
    // 门洞里原来还压过一层"六格窗棂"。自从有了红门板，那两道横线是横穿门板画上去的，
    // 读成"门板前拦了一道铁栅"，已删——门是门，不该同时是窗。
  }

  function luDreamShake(e,amount) {
    var fade=amount*(0.78+0.22*Math.sin(e*2.1+0.4));
    return {
      x:Math.round((Math.sin(e*71)+0.42*Math.sin(e*113+1.7))*fade),
      y:Math.round((0.7*Math.sin(e*83+0.8)+0.3*Math.sin(e*137))*fade)
    };
  }

  // 两侧石壁：只做很淡的砌缝（横向灰缝 + 交错竖缝 + 零星麻点），给门一个"嵌在墙里"的落点。
  // 刻意不画任何光柱/放射线 —— 那是上一版"两侧杂乱"的来源。
  function luDreamWall(c,cx,top,bt,amount) {
    if(amount<=0.03)return;
    for(var y=top+1;y<bt;y++) {
      var row=y%4,foot=clamp01((bt-y)/4);
      for(var x=2;x<c.w-2;x++) {
        var dx=Math.abs(x-cx);
        if(dx<44)continue;
        if(clamp01((dx-44)/18)*foot*amount<=0.06)continue;
        var h=hash16(x*41+y*173),ch='';
        if(row===0) { if(h%2===0)ch='─'; }
        else if(mod(x-(row<2?0:3),7)<1) ch=':';
        else if(h%13===0) ch='.';
        if(ch)c.put(x,y,ch,ch==='.'?K:G);
      }
    }
  }

  // 三扇同款窗错相 1/3 周期：任何时刻都有远/中/近三层同框，尺寸成 3 倍级差 ⇒
  // 套娃式纵深；穿过一扇的同时最远处补上新的一扇，主体的"向前"由尺寸增长本身表达。
  // 两侧不再堆柱子/拱眉/红带；地面只留几条透视缝 + 一条向外滑动的横档做速度参照。
  function luDreamTunnel(c,cx,cy,e,t) {
    var PER=2.40,LAYER=3,list=[];
    for(var k=0;k<LAYER;k++) {
      var p=mod(e/PER+k/LAYER,1);
      list.push({p:p,s:0.22*Math.pow(13,p)});
    }
    for(k=-2;k<=2;k++)c.line(cx,30,cx+k*26,33,'·',G);
    var gu=mod(e*0.5,1);
    c.line(cx-(2+gu*40),31,cx+(2+gu*40),31,'·',gu>0.7?G:N);
    list.sort(function(a,b){return a.s-b.s;});   // 由远及近覆盖
    for(k=0;k<list.length;k++)luDreamPortal(c,cx,cy,list[k].p,t,k);
  }

  // 48.17–55.13：三扇同款门错相推进、一扇接一扇打开，主体匀速穿过；最后一扇门洞里的光
  // 长成满幅，交给下一镜从满幅白里淡出。两侧不再堆柱子/拱眉/红带，只留地面缝做参照。
  function lu_s3_dreamt(c,t,top,bt,elapsed) {
    var e=elapsed,cx=(c.w-1)/2,cy=17;
    var flood=clamp01((e-4.70)/1.40);
    var shake=luDreamShake(e,0.9*(1-flood*0.85));
    c.sx=shake.x;c.sy=shake.y;
    luDreamWall(c,cx,top,bt,clamp01((e-0.30)/1.1)*0.9);
    if(e>0.50)luDreamTunnel(c,cx,cy,e,t);
    // 从上一镜的锁链世界收拢：中缝张开，把画面交给门。
    if(e<0.55) {
      var entry=new CCanvas(c.w,c.h);entry.clip=[top+1,bt-1];lu_s2_chains(entry,t,top,bt,4);
      for(var yy=top+1;yy<bt;yy++)for(var xx=2;xx<c.w-2;xx++) {
        if(e>0&&Math.abs(xx-cx)<e/0.55*62)continue;
        var cell=entry.cells[yy][xx];c.put(xx,yy,cell[0],cell[1]);
      }
    }
    // 白光从门缝里涌出来：细线 → 竖缝 → 横向张开成圆 → 淹没全屏。光心压在门洞中缝上。
    c.sx=0;c.sy=0;
    if(flood>0) {
      // 三段：① grow 从一道细线长成竖缝（0.39s）；② 竖缝停住不涨；③ bloom 横向张开成圆并淹没全屏。
      // 一开始就给全高的竖缝会"啪"地出现，从细线长出来才像光在往外渗。
      var grow=clamp01(flood/0.28),bloom=clamp01((flood-0.26)/0.74);
      // 缝高 R=0.50 ⇒ 纵向半高约 15 行，上端压在拱券以内、下端落在门槛，才读成"从门里透出来"；
      // 再大就会戳穿拱券，像一根从天上垂下来的灯管。
      var Rw=mix(0.14,0.50,Math.pow(grow,0.60))+2.50*bloom*bloom;   // 0.14 → 0.50 → 3.00
      var nw=mix(0.11,1,Math.pow(bloom,1.6));                       // 0.11（光缝）→ 1（圆）
      luWhiteFlood(c,cx,20,Rw,mix(0.95,1.00,flood),top,bt,t,nw,0);
    }
    clearRect(c,0,top,c.w,1);c.put(3,top,e<2.30?'24 / THE STAINED GLASS DREAM':e<4.95?'25 / THROUGH TIME AND HALLS':'26 / THE WHITE DOOR',N);
    c.put(c.w-25,top,e<4.95?'HALLS / MOVING FORWARD':flood<0.9?'LIGHT / FILLING EVERY GAP':'LIGHT / NO DISTANCE LEFT',R);
    clearRect(c,0,bt,c.w,1);c.center(bt,e<4.95?'EVERY DOOR OPENS / KEEP WALKING':'WHITE LIGHT / NO DISTANCE LEFT',B);
  }

  // 金红火焰：外焰红、内焰金、焰心白；只做水平摆动，焰尾始终朝上。
  // spread 控制横向张度：0.8 是细长的炬火，1.2 是张开的火翼。形状随叙事变化，
  // 否则一朵火苗保持同一轮廓四秒，再厚的涂也读成一张贴图。
  function luMeetFlame(c,x,y,size,angle,t,side,spread) {
    var pulse=0.94+0.1*Math.sin(t*13+side*1.7),s=size*pulse;
    if(spread===undefined)spread=1;
    function face(points,st,ch) {
      luCoalFacet(c,points.map(function(p){
        var flick=Math.max(0,-p[1]-2)/14*Math.sin(t*15+side*2+p[1]*0.35)*1.4;
        return [x+(p[0]+flick)*s*spread,y+p[1]*s/2];
      }),st,ch);
    }
    face([[0,8],[-7,5],[-9,0],[-6,-6],[-2,-11],[0,-17],[2,-10],[7,-13],[9,-5],[7,2],[3,7]],R,'▓');
    face([[0,7],[-5,4],[-5,-1],[-2,-8],[0,-12],[2,-7],[6,-4],[5,2],[2,6]],B,'▓');
    face([[0,6],[-2,3],[-1,-4],[0,-9],[2,-3],[2,3]],W,'█');
    c.put(x+Math.sin(t*17+side)*s*0.5,y-8*s,'◆',B);
  }

  // 火种保持有弹性的轨道，不翻转焰身；靠近时反复抬升、错开、再吸向中心。
  function luMeetPose(e,side) {
    var u=clamp01(e/2.15),lift=u*u*(3-2*u);
    if(e<=2.15) {
      var bob=Math.sin(e*12+side)*0.9*lift;
      return {x:side*mix(11,25,lift)+Math.sin(e*9+side)*1.2*lift,y:mix(22,17,lift)+bob,size:mix(0.25,1.22,lift)*(0.94+0.08*Math.sin(e*14+side)),angle:0};
    }
    var orbit=clamp01((e-2.15)/2.4),ease=orbit*orbit*(3-2*orbit),r=25*(1-ease),a=ease*3.7;
    var bounce=Math.sin(orbit*TAU*2+side)*1.6*(1-ease);
    return {x:side*Math.cos(a)*r+side*bounce,y:17+side*Math.sin(a)*r*0.24+Math.sin(orbit*TAU*2+side)*0.7,size:mix(1.22,0.64,ease)*(0.95+0.08*Math.sin(e*15+side)),angle:0};
  }

  // 红玻璃由原地裂成有厚度的三角切面：先被冲击推开，再一边缩小一边烧尽。
  // 旧写法在 4.55–6.75 之间让碎片静止悬在外圈，12 块三角在画面边缘排成一圈暗红，
  // 读成"杂乱的血块"并抢中心火焰的戏——碎片必须一直在走，才像被炸开而不是摆件。
  function luMeetGlass(c,cx,cy,e) {
    var reveal=clamp01((e-2.0)/1.8);
    if(reveal<0.1)return;
    var push=Math.max(0,e-4.55),age=push*push*0.85;   // 冲击后位移加速
    // 燃尽窗口压到 4.55–6.20：碎片本该是"被冲击波打散的瞬间"，飞太久就变成画面两侧的杂物。
    var burn=clamp01((e-4.55)/1.65);                  // 燃尽进度
    if(burn>=1)return;
    for(var i=0;i<12;i++) {
      var seed=hash16(i*419+23),a=i/12*TAU-0.15;
      var r=(31+seed%8)*reveal+age*(7+seed%6);
      var x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r/2+age*1.8;
      // 碎片按不同速度缩掉：燃尽时先变成小片、再散成点，不是整块消失。
      var gone=clamp01((burn-(i%4)*0.13)/0.55);
      var sz=reveal*(0.6+reveal*0.4)*(1-gone);
      if(sz<0.12)continue;
      var rot=a+age*(i%2?0.55:-0.5),cs=Math.cos(rot),sn=Math.sin(rot);
      function point(u,v){return [x+(u*cs-v*sn)*sz,y+(u*sn+v*cs)*sz/2];}
      var hot=gone>0.62;                              // 快烧完时回光返照成金
      luCoalFacet(c,[point(-5,-7),point(6,-3),point(2,8)],hot?B:R,'▓');
      luCoalFacet(c,[point(-5,-7),point(-1,-2),point(2,8)],G,'▒');
      if(sz>0.35) {
        var p=point(-5,-7),q=point(6,-3);
        c.line(p[0],p[1],q[0],q[1],i%2?'/':'\\',hot?W:N);
      }
    }
  }

  // 55.13–64.40：穿出金门、双焰绕行 → 合焰冲击 → 红玻璃崩裂，火势升起。
  function lu_s3_meet(c,t,top,bt,elapsed) {
    var e=elapsed,cx=(c.w-1)/2,cy=17,impact=e-4.55,ignite=clamp01((e-6.75)/2.52);
    var exitShake=luDreamShake(e,0.7*Math.max(0,1-e/0.90));
    c.sx=exitShake.x;c.sy=exitShake.y;
    // 金门后的暗色镜面，横向反光随双焰位置变化，保持双主体的留白。
    for(var row=0;row<6;row++) {
      var y=26+row,w=16+row*7;
      c.line(cx-w,y,cx+w,y,row%2?'·':'─',G);
    }
    // 两侧的暗色火墙跟着 ignite 从地面长起来：前期整幅只有中心一团火和底下的熔金带，
    // 不需要两根竖到头顶的暗碑陪衬；等火势蔓延时它们才作为背景压住画幅两端。
    for(var side=-1;side<=1;side+=2) {
      var fh=clamp01((ignite-0.12)/0.72);
      if(fh<=0)continue;
      var bot=31,ftop=bot-14*fh;   // 不能叫 top：var 提升会遮蔽函数参数 top，标题会被画到 17 行
      luCoalFacet(c,[[cx+side*51,ftop+3],[cx+side*44,ftop+7],[cx+side*46,bot-2],[cx+side*58,bot]],G,'▒');
      c.line(cx+side*51,ftop+3,cx+side*46,bot-2,'│',fh>0.6?R:N);
    }
    luMeetGlass(c,cx,cy,e);
    // 二次点火：裂缝先向两侧推进，再沿裂缝燃起四团余烬——中轴留给主焰，不再叠一团；
    // 高度、间距、点燃时刻都按固定 seed 错开，否则五个等距等高的小火排成一排，像蜡烛。
    if(ignite>0) {
      for(var side=-1;side<=1;side+=2) {
        c.line(cx,29,cx+side*ignite*53,28,'─',R);
        c.line(cx+side*ignite*27,28,cx+side*ignite*44,31,'/',B);
      }
      for(var n=-2;n<=2;n++) {
        if(n===0)continue;
        var sd=hash16(n*311+1741)/65535;
        var grow=clamp01((ignite-Math.abs(n)*0.12-sd*0.08)/0.58);
        if(grow<=0)continue;
        luMeetFlame(c,cx+n*(21+sd*9),30.4-grow*(1.1+sd*1.1),grow*(0.45+sd*0.60),
                    n*0.10,t+n,n<0?-1:1,1.05+sd*0.25);
      }
    }
    if(e<4.55) {
      // 先绘两条过去轨迹，再绘当前火焰；环绕交叉时不出现脱离主体的尾迹。
      for(var side=-1;side<=1;side+=2) {
        for(var j=30;j>=1;j--) {
          var back=e-j*0.025;if(back<0)continue;
          var p=luMeetPose(back,side),width=(1-j/31)*1.5;
          if(e>1.0)c.line(cx+p.x,p.y-width,cx+p.x,p.y+width,'▒',j>22?G:R);
        }
      }
      // 按纵深排序，靠下的一焰覆盖靠上的一焰。
      var pair=[{side:-1,p:luMeetPose(e,-1)},{side:1,p:luMeetPose(e,1)}];
      pair.sort(function(a,b){return a.p.y-b.p.y;});
      for(var k=0;k<pair.length;k++) {
        var p=pair[k].p,side=pair[k].side;
        luMeetFlame(c,cx+p.x,p.y,p.size,p.angle,t,side);
        for(var row=0;row<3;row++) {
          var rx=cx+p.x+Math.sin(t*2+row)*1.1,ww=p.size*(4-row);
          c.line(rx-ww,27+row,rx+ww,27+row,row%2?'·':'─',row===0?N:G);
        }
      }
    } else {
      // 合焰先爆出一圈白热边，再舒展开为唯一的火焰纹章。size 不一次长到位：
      // 0.75s 内到 1.62，之后 3.2s 继续缓慢拔高、横向张开 —— 一朵火保持同一轮廓四秒，
      // 再厚的涂也会读成一张贴图。
      var bloom=clamp01(impact/0.75),swell=clamp01((impact-0.6)/3.2);
      var size=mix(0.64,1.62,bloom)*(1+0.16*swell)*(1+0.025*Math.sin(t*5));
      var spread=mix(0.86,1.18,bloom*0.7+swell*0.3)+0.03*Math.sin(t*3.1);
      luMeetFlame(c,cx,mix(17,19,bloom),size,
                  mix(1.776,0,bloom)+Math.sin(t*1.8)*0.035*bloom,t,0,spread);
      if(impact<0.48) {
        var radius=4+impact*79;
        luRing(c,cx,cy,radius,'·',impact<0.14?W:B,2);
        for(var i=0;i<20;i++) {
          var a=i/20*TAU,rr=impact*(27+hash16(i*73)%20);
          c.line(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr/2,cx+Math.cos(a)*(rr-2.5),cy+Math.sin(a)*(rr-2.5)/2,'─',impact<0.18?W:B);
        }
      }
      // 火焰底座：一团熔金贴在地缝上，宽度随升温铺开，边缘按 hash 打毛。
      // 这里原本还有两条"环抱弧"，半径收进画幅后只剩火焰腰侧两小块黄斑，
      // 既不像手也不像光带，反而把重心从中心拆开——直接删掉，让火自己站住。
      // 带子必须有 3 行厚、并且顶到火焰根部，否则读成一串散落的小方块。
      var bw=6+bloom*9+ignite*26;
      for(var bx=Math.ceil(cx-bw);bx<=Math.floor(cx+bw);bx++) {
        var bu=Math.abs(bx-cx)/bw,jag=hash16(bx*29+13)/65535;
        if(bu>0.86&&jag>hash16(bx*11+7)/65535*1.15)continue;
        // 带子贴地向上长、两端收薄：等高 3 行的长方形带子在 ±40 处突然截断，
        // 一眼就是"画了个矩形"。高度用低频正弦微起 1 行——逐列 hash 跳变会变成城墙垛口。
        var th=Math.round((1-bu*bu)*2.6+Math.sin(bx*0.55)*0.45);
        if(th<1)th=1;if(th>4)th=4;
        for(var dy=0;dy<th;dy++) {
          var ly=29-dy;
          // 每 5 列压一道暗纹，整片纯金会读成一根金条。
          var band=dy===1&&(bx%5===0)?'▓':'█';
          c.put(bx,ly,bu<0.44?band:bu<0.80?'▓':'▒',bu<0.44?B:R);
        }
      }
    }
    // 金尘与玻璃碎屑采用固定种子和弹道，黑色区域保持干净。
    if(e>4.55)for(var i=0;i<22;i++) {
      var seed=hash16(i*223+31),age=mod(impact*0.45+seed/65535,1),side=seed%2?1:-1;
      c.put(cx+side*(9+age*(18+seed%18)),25-age*17+age*age*5,age<0.35?'+':'.',age<0.35?N:G);
    }
    // 穿出去：满幅白光用"块状抽样"碎掉，不再整屏一起降亮。屏幕被切成 7×4 与 3×2
    // 两级方块，每块一个固定随机数，亮度高的块耐力更强，所以光从边缘成片碎裂、亮核最后散。
    // 整屏同步变淡看起来像一张白纸被均匀调暗；成块漏空才有"光在蒸发"的随机感。
    if(e<1.05) {
      var k=clamp01(e/1.05);
      c.sx=0;c.sy=0;
      luWhiteFlood(c,cx,20,3.00,1.00,top,bt,t,1,k);
    }
    c.sx=0;c.sy=0;
    clearRect(c,0,top,c.w,1);
    c.put(3,top,e<2.15?'27 / ONLY YOU AND ME':e<4.55?'28 / TWO FLAMES CONVERGE':e<6.75?'29 / ONE FIRE REMAINS':'30 / THROUGH BLOOD AND FIRE',N);
    c.put(c.w-23,top,e<4.55?'ORBIT / DRAWING CLOSER':e<6.75?'UNION / WHITE HEAT':'IGNITION / RISING',R);
    clearRect(c,0,bt,c.w,1);c.center(bt,e<4.55?'AT THE END / WE FIND EACH OTHER':e<6.75?'TWO SPARKS / ONE UNBROKEN FLAME':'LET THE GLASS BREAK / LET THE FIRE RISE',B);
  }

  // ===== 血与火预热 64.40–72.01 粒度细分：2 子场景 =====

  // 塔盾轮廓的宽度函数（u=0 顶、1 底尖）。盾本体与段尾的"金框整圈闪亮"共用一份，
  // 分开写两份很容易对不上，亮点就会飘到盾外面去。
  function luOathHalfW(u){
    if(u<0.20)return 8+12*Math.sin(u/0.20*Math.PI/2); // 椭圆顶：与竖直肩线相切，分段直线会在两肩立出两个金角
    if(u<0.52)return 20-1.2*((u-0.20)/0.32);          // 上身近乎垂直：塔盾的肩膀是直的，一路斜收就像漏斗
    return 18.8*Math.pow(1-(u-0.52)/0.48,0.74);       // 下 48% 才收成底尖
  }

  // 誓约盾：上宽下尖的塔盾。外圈金框、内圈暗线压出框的厚度、盾面靠中轴亮靠外缘暗。
  // 轮廓用宽度函数 halfW(u) 逐行扫描求得，而不是几段手写多边形——compress 压成锻件时
  // 整块仍然连续收窄，不会在中间裂成两个互不相连的色块。
  function luOathShield(c,cx,cy,close,compress,t) {
    // 进场不用"两半从两侧平移"，那会在中途读成两个互不相连的大色块；
    // 改成横向先撑开、纵向后立起，任何一帧都是连通的整块，像金箔被火从中心推开。
    // 高度不能等到 close>0.22 才开始长：那段时间宽度已经有十几格，整块被压成一条横线，
    // 画面读作"中间空了一片黑"。宽高同时起步，宽度先满、高度后满。
    var gw=Math.pow(clamp01(close/0.55),0.70),gh=Math.pow(clamp01(close/0.72),0.85);
    // 压缩终点留 0.42（原来 0.155）：压成 4 行薄片时整面盾会溶进台基那条暗带里，
    // 画面中央从 70.3 到 71.0 没有任何主体。留成 11 行高的厚锻件才接得住光柱。
    var sx=mix(1,0.70,compress)*mix(0.07,1,gw),sy=mix(1,0.42,compress)*mix(0.20,1,gh);
    var vTop=-12.6,vBot=13.6;
    var halfW=luOathHalfW;
    for(var v=vTop;v<=vBot;v+=1) {
      var u=(v-vTop)/(vBot-vTop),w=halfW(u);
      if(w<0.8)continue;
      var Y=cy+v*sy;
      for(var side=-1;side<=1;side+=2) {
        for(var d=0;d<=w;d+=1) {
          var nd=d/Math.max(1,w),ch,st;
          if(nd>0.90) { ch=v<-2?'█':'▓'; st=(v<0&&side<0)?B:N; }   // 外金框：左上来光更亮
          else if(nd>0.80) { ch='▓'; st=G; }                       // 框内暗线，压出厚度
          else {
            // 沿"左上→右下"的对角坐标分四块斜切面：横平竖直分档会读成三条竖条纹，
            // 斜向切才有金属被打磨过的块面感。
            // 分界随一次慢呼吸轻微摆动，整面盾的明暗就有起伏，不会像一块上了漆的木板
            // 分界再叠一层高频扰动：直线分档会在盾面拉出一条笔直的暗带，看着像贴了块补丁
            var diag=v+side*d*0.55+Math.sin(t*1.5)*2.2+Math.sin(v*1.7+side*d*0.9)*1.3;
            var tune=diag<-10?0:diag<-1?1:diag<8?2:3;
            // 红三档（█受光 / ▓过渡 / ▒背光）+ 最深一档换暗棕。全用红的话缩略图里三档同色，
            // 整面盾摊成一块平红布；整片换棕又会读成生锈的另一半。
            ch=tune>=3?'▓':tune===2?'▒':tune===1?'▓':'█';
            st=tune>=3?G:R;
            // 明暗交界上压一条橙色倒角：金属的转折最有说服力的就是这条高光棱
            if(tune>=2&&Math.abs(diag-8)<0.8) { ch='▓'; st=N; }
          }
          c.put(cx+side*d*sx,Y,ch,st);
        }
      }
    }
    // 金框流光：三颗亮光沿轮廓从上往下滑，金属要有反光才不像一块死漆
    if(compress<0.55)for(var fi=0;fi<3;fi++) {
      var fu=mod(t*0.42+fi/3,1),fw=Math.max(2,halfW(fu)-1.2);
      for(var fs=-1;fs<=1;fs+=2)c.put(cx+fs*fw*sx,cy+(vTop+fu*(vBot-vTop))*sy,'◆',W);
    }
    // 金框上的铆钉，沿轮廓等距排布，压缩时一起收进去
    for(var rv=-10;rv<=10;rv+=4) {
      var u2=(rv-vTop)/(vBot-vTop),w2=Math.max(1,halfW(u2)-1.6);
      for(var s=-1;s<=1;s+=2)c.put(cx+s*w2*sx,cy+rv*sy,'◆',B);
    }
    // 中轴金脊：只留两列，且白热只在一条上下滑动的短段里。
    // 原来三列从顶亮到底、常亮，在 26 行高的盾上读成一根拉链/竹节；
    // 金属的合缝是"暗金夹一线火"，不是一根荧光棒。
    if(compress<0.88) {
      var hv=vTop+mod(t*0.26,1)*(vBot-vTop);
      for(var v2=-12;v2<=11;v2+=1) {
        var Y2=cy+v2*sy;
        var near=Math.abs(v2-hv)<2.6?1-Math.abs(v2-hv)/2.6:0;
        c.put(cx-1,Y2,near>0.4?'▓':'▒',near>0.4?B:N);       // 左缘：平时暗橙，热段转金
        c.put(cx,Y2,near>0.5?'█':'▓',near>0.5?W:B);         // 缝心：只有热段是白热
      }
      // 甲片接缝：压一条暗槽 + 一颗沿线滑走的铆钉。
      // 原来整条 `─` 亮线横贯盾面，叠上竖的金脊就成了编织篮。
      for(var sd=-1;sd<=1;sd+=2)for(var rb=0;rb<2;rb++) {
        var ry=cy-6+rb*11,rw=Math.min(9,sx*11)-rb*2;
        if(rw<3)continue;
        // 接缝只留一颗会滑动的铆钉。之前那排暗棕点（`·`）在 6px 的格子上就是一道黑杠，
        // 读成盾面裂了——细节要有，但不能是"洞"。
        var rp=mod(t*0.9+rb*0.5,1);
        c.put(cx+sd*(2+rp*(rw-2)),ry,'◆',rp>0.55?W:B);
      }
    }
    if(compress>=0.88)c.line(cx-9,cy,cx+9,cy,'▄',W);
  }

  // 两岸各一片厚石壁：顶面受光、正面暗棕、内缘一道亮棱，壁龛里嵌一团小火。
  // 旧版是三根细柱加六团大火苗，缩略图里读成"两侧竖条 + 边缘糊掉的色块"，全部换成整块体积。
  function luOathHall(c,t,top,bt,age,focus) {
    var cx=(c.w-1)/2,base=31;
    for(var side=-1;side<=1;side+=2) {
      var xi=cx+side*30,xo=cx+side*53;
      // 顶面（俯视可见的窄亮带）→ 正面 → 内缘亮棱，三段给出房间的进深
      luCoalFacet(c,[[xi,13],[xi+side*4,9],[xo-side*3,9],[xo,13]],N,'▓');
      luCoalFacet(c,[[xi,base],[xi,13],[xo,13],[xo,base]],G,'▓');
      luCoalFacet(c,[[xi,base],[xi,13],[xi+side*2.4,13],[xi+side*2.4,base]],N,'█');
      c.line(xi+side*1,13,xo,13,'▄',B);
      // 砖缝：横缝断成一截截、竖缝只留两道并错位。规整的满格网格会把石壁读成牢房栅栏。
      for(var y=18;y<base;y+=5)for(var bx2=xi+side*3;(side>0?bx2<xo-2:bx2>xo+2);bx2+=side*7)
        c.line(bx2,y,bx2+side*4,y,'─',K);
      for(var g=0;g<2;g++) {
        var gx=xi+side*(11+g*9)+(g%2?side*3:0);
        c.line(gx,14,gx,base-1,'│',K);
      }
      // 壁龛：拱形暗口里嵌一团小火，火势只做点缀，不抢中轴
      var nx=xi+side*10,nh=clamp01(age/1.2);
      if(nh>0) {
        for(var dy=0;dy<11*nh;dy++) {
          var w=3.4-Math.abs(dy-3)*0.25;
          c.line(nx-side*w,28-dy,nx+side*w,28-dy,'░',K);
        }
        luMeetFlame(c,nx,28.6,0.62*(0.9+0.1*Math.sin(t*9+side)),0,t+side*2,side,0.78);
        c.put(nx,26,'◆',B);
      }
      // 岩缝里的岩浆：贴着台基表面往中轴渗，呼唤段 focus 推进时它先到，充当"火在回应"
      c.line(nx,30,cx+side*(9-focus*4),30,'·',N);
      c.put(cx+side*(9-focus*4),30,'◆',B);
    }
    for(var i=0;i<14;i++) {
      var seed=hash16(i*191+43),u=mod(t*0.35+seed/65535,1),side=seed%2?1:-1;
      var x=cx+side*(26+seed%26)*(1-focus*u*0.7),y=30-u*(13+seed%8);
      c.put(x,y,u<0.28?'+':'.',u<0.28?B:G);
    }
  }

  // 三段撞击的时刻与命中点：左侧中段、右侧上段、左侧下段，交替且高度错开，
  // 如果三次都打同一高度，盾面会像被同一个东西反复敲，读不出"抵挡四方"。
  var HITS=[1.45,2.15,2.85],HIT_SIDE=[1,-1,1],HIT_Y=[11,17.5,23.5];

  // 共享连续时间轴，68.09s 只切换标题而不重置盾徽、火势或波纹。
  // pressOv：外部给的压缩量。呼唤镜要按自己的节拍把盾压成锻件，
  // 不能沿用 focus 的默认曲线（那条曲线把压缩全堆在最后 1 秒）。
  function luOathSequence(c,t,top,bt,age,pressOv) {
    var cx=(c.w-1)/2;
    // 0.10–1.05s：盾在火里成型。之前的 0.28s 起手会让中间有半秒空白，火焰已退、盾还没长出来。
    var close=clamp01((age-0.10)/0.95),lock=close*close*(3-2*close);
    var call=Math.max(0,age-3.69),focus=clamp01((call-1.7)/2.22);
    var press=pressOv===undefined?focus*focus*(3-2*focus):pressOv;
    var yLo=top+1,yHi=bt-1;
    // 受击：整屏顿一下 + 盾体往后仰半格再弹回来。抖幅 2 格以内，再大就成了画面故障。
    var shake=0,recoil=0;
    for(var k0=0;k0<3;k0++) {
      var d0=age-HITS[k0]-0.20;
      if(d0>0) {
        shake=Math.max(shake,Math.exp(-d0*11)*1.7);
        if(age<3.69)recoil=Math.max(recoil,Math.exp(-d0*8)*1.8);
      }
    }
    c.sx=Math.round(Math.sin(age*88)*shake);c.sy=Math.round(Math.cos(age*67)*shake);
    // 承接上一镜：火焰从中央裂开、向两侧退出，把画面中间让给盾。
    // 原来是从下往上整幅擦除，火焰会残留在上方和盾顶叠在一起，读成"两层画面"。
    if(age<0.90) {
      var entry=new CCanvas(c.w,c.h);entry.clip=[top+1,bt-1];lu_s3_meet(entry,t,top,bt,9.27);
      // 裂缝半径跟着盾的当前宽度走：让火焰只让开盾已经占住的那一块，否则会先空出半屏黑。
      var shHalf=20*mix(0.07,1,Math.pow(clamp01(close/0.55),0.70));
      var seamR=shHalf>2?shHalf*1.2+4:0;
      seamR=Math.max(seamR,Math.max(0,(age-0.45)/0.45)*(cx+8));
      for(var yy=top+1;yy<bt;yy++)for(var xx=2;xx<c.w-2;xx++) {
        var dx=Math.abs(xx-cx);
        if(dx<seamR) {
          if(dx>seamR-3)c.put(xx,yy,dx>seamR-1.4?'+':'·',B);   // 退开的边缘冒一串火星
          continue;
        }
        var cell=entry.cells[yy][xx];c.put(xx,yy,cell[0],cell[1]);
      }
    }
    luOathHall(c,t,top,bt,age,focus);
    // 台基：低频起伏的熔金岩台，压住画面下沿，盾尖插在里面
    luCoalFacet(c,[[cx-54,30.6],[cx+54,30.6],[cx+47,32.4],[cx-47,32.4]],K,'▓');
    for(var bx=cx-54;bx<=cx+54;bx++) {
      var bh=30.4+Math.sin(bx*0.21+1.1)*0.5+Math.sin(bx*0.06)*0.4;
      c.put(bx,bh,'▄',Math.sin(bx*0.4)>0.3?B:N);
    }
    var shieldY=mix(18,26,press)+recoil;
    luOathShield(c,cx,shieldY,lock,press,t);
    // 合拢完成：接缝炸开一排向上的火星，标志"两半焊成一面"
    if(age>1.05&&age<1.42) {
      var w0=age-1.05;
      for(var i=0;i<26;i++) {
        var seed=hash16(i*311+77),vx=(seed%2?1:-1)*(1+seed%6)*0.8,vy=-(1+seed%7)*1.2;
        c.put(cx+vx*w0*2.4,shieldY+vy*w0*2.4+w0*w0*3.5,'+',w0<0.10?W:B);
      }
    }
    // 三段碎片撞击：交替从左右冲入，命中点落在盾面不同高度，弹开后甩出画面。
    for(var k=0;k<3;k++) {
      var a=age-HITS[k];
      if(a<0||a>2.2)continue;
      var sd=HIT_SIDE[k],hy=HIT_Y[k];
      // 碎片放大到 9 格、飞行拉长到 0.30s：原来 0.22s 冲 39 格，12fps 下每帧跳 15 格，
      // 只剩几个斜线点在闪，读不出"有东西砸过来"。
      for(var s=0;s<4;s++) {
        var aa=a-s*0.045;
        if(aa<0)continue;
        var cut=0.30,off=(s-1.5)*3.4,fx,fy;
        if(aa<cut) { var q=aa/cut; fx=cx+sd*(54-q*33); fy=hy+off-q*off*0.5; }
        else { var q2=aa-cut; fx=cx+sd*(21+q2*44+q2*q2*16); fy=hy+off-q2*(9+off); }
        if(fx<1||fx>c.w-2||fy<yLo||fy>yHi)continue;
        // 弹开之后边飞边缩，否则到段尾还有大块红三角挂在石墙上，像贴了块补丁
        var sc=aa<cut?1:Math.max(0,1-(aa-cut)*2.2);
        if(sc<0.14)continue;
        luCoalFacet(c,[[fx-sd*5*sc,fy-3*sc],[fx+sd*4*sc,fy+0.6*sc],[fx-sd*1*sc,fy+3.6*sc]],R,'▓');
        luCoalFacet(c,[[fx-sd*5*sc,fy-3*sc],[fx-sd*1*sc,fy+0.4*sc],[fx-sd*1*sc,fy+3.6*sc]],G,'▒');
        c.put(fx,fy,aa<cut?'█':'▄',aa<cut?W:B);
        if(aa<cut)for(var tg=1;tg<=3;tg++)c.put(fx+sd*tg*4,fy-tg*0.8,'·',tg>2?G:B);
      }
      // 命中：命中点炸开一圈白热十字，第 20 帧那一瞬决定这一下"砸没砸到"
      if(a>0.30&&a<0.46) {
        var qh=1-(a-0.30)/0.16;
        for(var hb=0;hb<10;hb++) {
          var ha=hb/10*TAU;
          for(var hr=1;hr<=1+3.4*qh;hr++)
            c.put(cx+sd*21+Math.cos(ha)*hr,hy+Math.sin(ha)*hr*0.5,hr<1.5?'*':'·',hr<1.6?W:B);
        }
      }
      // 命中瞬间外缘闪一道白环
      if(a>0.30&&a<0.78) {
        var a2=a-0.30;
        luRing(c,cx+sd*21,hy,4+a2*44,'·',a2<0.08?W:B,2);
      }
      // 裂纹：命中点向盾心裂开三道，0.62s 后熔金沿原路焊回去，最后只留一线金光
      var heat=clamp01((a-0.62)/0.55);
      var cr=clamp01((a-0.20)/0.12)*(1-heat);
      for(var k2=0;k2<3;k2++) {
        var ang=(k2-1)*0.42;
        for(var n=1;n<=11;n++) {
          var x=cx+sd*(21-n*Math.cos(ang)),y=hy+n*Math.sin(ang)*1.1;
          if(Math.abs(x-cx)>22||y<yLo||y>yHi)continue;
          if(n<=11*cr)c.put(x,y,sd>0?'╲':'╱',K);
          // 焊痕留 4 格就够：原来整条 11 格的暗棕点铺下来，在 6px 的格子上就是一道黑杠，
          // 读成"盾面裂了"而不是"焊回去了"。金色短痕才像愈合。
          else if(heat>0&&heat<1.5&&n<=4)c.put(x,y,'·',N);
        }
      }
    }
    // 段尾：整圈金框一起亮一次，作为"这面盾完好无损"的句号，也给下一镜的呼唤留一个亮的起点
    if(age>3.12&&age<3.62) {
      var fq=Math.sin(clamp01((age-3.12)/0.50)*Math.PI);
      // 这里盾已完全成型（close=1、compress=0），直接用未缩放的轮廓，不要引用盾内部的局部变量
      for(var rv2=-12;rv2<=13;rv2+=2) {
        var u4=(rv2+12.6)/26.2;
        var w4=luOathHalfW(u4);
        if(w4<1.5)continue;
        for(var s4=-1;s4<=1;s4+=2)c.put(cx+s4*w4,shieldY+rv2,fq>0.6?'◆':'+',fq>0.6?W:B);
      }
    }
    c.sx=0;c.sy=0;
  }

  // ===== 呼唤段的三件套：波纹 / 熔流 / 白热柱 =====
  // 呼唤的三拍。分散到 0.34/0.86/1.38，前 1.5 秒才有连续的动静；
  // 旧版三圈波在 1.7 秒里同一条式子算出来，前两圈早跑出画面，只剩最后一圈一闪。
  var CALLS=[0.34,0.86,1.38];

  // 呼唤波：从盾心外扩的椭圆。落在盾面上时压暗（板内的应力波），
  // 冲出轮廓之后转亮，读作"声音从金属里炸出来"。
  // 旧版用 c.line 连相邻采样点，每步 0.32 弧度 ⇒ 12fps 下退化成断裂的 `─│` 虚线。
  function luCallWave(c,cx,cy,r,life) {
    if(r<1)return;
    var steps=Math.max(60,Math.round(r*10));
    for(var i=0;i<steps;i++) {
      var a=i/steps*TAU,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*0.42;
      if(y<0||y>=c.h||x<1||x>c.w-2)continue;
      // 只在盾体之外画：波是"从金属里炸出来的"，落在盾面上的部分会变成一条横贯盾心的
      // 虚线（`·` 的笔画只有一两个像素，成排就是黑杠），比不画还糟。
      var inside=Math.abs(x-cx)<19.5&&Math.abs(y-cy)<13.2;
      if(inside)continue;
      var cardinal=Math.abs(Math.sin(a*2))<0.34;
      c.put(x,y,cardinal?'+':'·',life<0.30?W:life<0.62?B:N);
    }
  }

  // 受热重染：直接改已经画好的像素，暗红→橙→金。
  // 比重算一遍分档稳，也不用往 luOathShield 里塞一堆 heat 分支。
  function luHeatWash(c,x0,x1,y0,y1,k) {
    if(k<=0)return;
    x0=Math.max(0,x0);x1=Math.min(c.w-1,x1);
    // 上下也要夹：盾体下沿在 y≈42，越界会让 c.cells[y] 直接是 undefined
    y0=Math.max(0,y0);y1=Math.min(c.h-1,y1);
    for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++) {
      var cell=c.cells[y][x],st=cell[1];
      if(!cell[0]||cell[0]===' ')continue;
      if(st===4)cell[1]=k>0.72?B:k>0.30?N:4;        // 红：先转橙、再转金
      else if(st===5&&k>0.32)cell[1]=N;             // 暗棕阴影要早点转橙：0.70 才转的话
                                                    // 锻件会是"金 + 橄榄绿"的杂色，读成发霉
    }
  }

  // 熔流：两岸贴地的熔金河，从石壁根一路渗到中轴再立起来。
  // 旧版是 40 个点按 1.15 格步长铺的 ▒R 短虚线，缩略图里读成"中间横着几块砖"。
  function luCallStream(c,cx,side,head,t) {
    if(head<=0)return;
    // ⚠️ 采样数不能叫 N：N 是全局橙色色号（1），局部 var N 会把 c.put(...,N) 全部污染成 54。
    var NSEG=54,baseY=29.6;
    for(var n=0;n<=NSEG;n++) {
      var u=n/NSEG;
      if(u>head)break;
      var x=cx+side*(56-50*u);
      var rise=clamp01((u-0.78)/0.22);
      var y=baseY-rise*1.6;
      var ph=mod(u*2.4-t*2.2+(side>0?0:0.4),1);
      var hot=ph<0.17;
      // 两层差一档就有厚度：底行实心、上一行半亮；亮带经过时整条跳成白热
      // 底行用 █ 而不是 ▄：▄ 和台基那条线同形，整条熔流会溶进地面读不出来
      c.put(x,y,hot?'█':'█',hot?W:B);
      c.put(x,y-1,hot?'▓':'▓',hot?B:N);
      c.put(x,y-2,'·',hot?B:R);
      var sd=hash16(n*37+11);
      if(sd%6===0&&mod(t*1.5+sd/65535,1)<0.35)c.put(x,y-2-(sd%2),'·',B);
    }
    // 头部：一团白热熔球顶着走，后面拖两格金尾
    var hx=cx+side*(56-50*head),hy=baseY-clamp01((head-0.78)/0.22)*1.6;
    c.put(hx,hy,'█',W);
    c.put(hx-side,hy,'█',B);
    c.put(hx,hy-1,'▓',W);
    c.put(hx-side*2,hy,'▓',B);
    c.put(hx-side,hy-1,'▓',B);
    c.put(hx-side*3,hy,'▒',N);
  }

  // 白热柱：底宽顶窄，每一行的宽度各自抖动，顶上接三束高低不同的火舌。
  // 旧版是等宽直筒 + 两档描边 + 整行同相位正弦平移，缩略图读成"白色棋子/瓶子"。
  function luCallPillar(c,cx,baseY,grow,t) {
    var h=Math.max(1,21*grow),ty=baseY-h;
    // 柱身只画到离顶 6 行，上面交给三束火舌。整根柱子一口气画到顶、再往顶上叠几个小尖，
    // 结果永远是"烟囱口 + 装饰尖顶"——直轮廓本身就是建筑的语言，火没有直轮廓。
    // 每一列各有各的顶：柱顶因此是一条撕裂的边，而不是一条平整横线。
    // 之前用"整根画到顶 + 顶上叠三束火舌"，火舌的宽度大于间距，三束并成一条宽横杠，
    // 叠出来是婚礼蛋糕式的阶梯金字塔——比原来的烟囱更糟。
    for(var y=Math.floor(ty);y<=baseY;y++) {
      var u=clamp01((baseY-y)/h);
      // 整根缓慢偏摆 1 格：完全竖直的对称体量会读成建筑
      var lean=Math.round(cx+Math.sin(t*0.8+y*0.06)*1.1);
      var w=(12.4-6.4*Math.pow(u,1.35))*(0.92+0.08*Math.sin(t*9+y*1.7));
      var wob=Math.sin(t*7.4-y*0.52)*1.5+Math.sin(t*2.9+y*0.23)*0.9;
      var m=Math.max(1,w*0.66),k=Math.max(1,w*0.34*(0.86+0.16*Math.sin(t*12+y*0.85)));
      var kb=Math.round(k);
      for(var xo=-Math.round(m);xo<=Math.round(m);xo++) {
        // 高位列要随时间迁移：只按 xo 取哈希会让"最高的两根"永远钉在同一处，顶部就成了
        // 两根固定的尖角。混进 1.4s 一档的时间桶，长尖会沿着柱顶游走。
        var stop=ty+(hash16(((xo+40)*29+5+Math.floor(t*1.4)*37)&65535)%10)+Math.sin(t*1.9+xo*0.6)*1.5;
        if(y<stop)continue;
        // 白芯用整块 █：▓ 的网点在 1.6 倍放大后会连成黑点，芯里像被凿了几个洞
        if(Math.abs(xo)<=kb)c.put(lean+xo,y,u<0.86?'█':'▓',W);
        else c.put(lean+xo,y,'▓',B);
      }
      // 外焰逐格掷骰、左右相位不同：边缘永远是毛的，不会留下一圈描边
      for(var side=-1;side<=1;side+=2) {
        var edge=Math.round(w+wob*0.7*(side>0?1:-1));
        for(var d=Math.round(m)+1;d<=edge;d++) {
          var g8=hash16((y*97+side*31+d*13+7)&65535)&255;
          if(g8<52)continue;
          c.put(lean+side*d,y,g8<120?'.':g8<190?'·':'+',g8<150?R:N);
        }
      }
    }
    // 侧向只留一束、高度随拍子变：左右对称各挂一束会读成"烛台把手"
    var lick=2.6+1.4*Math.sin(t*1.7),ly=baseY-h*0.30;
    for(var lx=0;lx<lick;lx++) {
      c.put(cx-9-lx,ly-lx*0.6,lx<1.4?'▓':'·',lx<1.4?B:N);
      c.put(cx-9-lx,ly-lx*0.6-1,lx<1?'·':'.',R);
    }
    // ⚠️ 火星必须落在柱身之外：`·`/`+` 的笔画极细，撒在白芯上就是一个黑洞
    for(var i=0;i<20;i++) {
      var sd=hash16(i*173+37),uu=mod(t*0.5+sd/65535,1);
      var off=(sd%41)-20,y=baseY-uu*(h+3);
      if(Math.abs(off)<14)off+=(off<0?-1:1)*14;
      c.put(cx+off*(0.6+uu*0.7),y,uu<0.3?'+':'·',uu<0.22?W:uu<0.6?B:N);
    }
    // 柱脚：熔金在台基上摊开，正好接住从两岸流过来的熔流
    var pw=13+grow*13;
    for(var bx=-pw;bx<=pw;bx++) {
      var py=baseY+1+Math.abs(bx)/pw*1.1;
      c.put(cx+bx,py,'▄',Math.abs(bx)>pw*0.55?N:B);
    }
    for(var bi=0;bi<10;bi++) {
      var bs=hash16(bi*211+53),bu=mod(t*0.42+bs/65535,1);
      c.put(cx+((bs%31)-15)*1.6,baseY+2-bu*1.6,bu<0.5?'.':'·',B);
    }
  }

  // 68.09–72.01 的连续时间轴：呼唤（0–1.55）→ 熔流聚拢 + 压成锻件（1.40–2.90）→ 白热柱（2.55–3.92）。
  // 旧版这段时间轴由 focus 一条曲线驱动，压缩和立柱都挤在最后 1 秒，前面 1.7 秒几乎是静止的盾。
  function luCallSeq(c,t,top,bt,e) {
    var cx=(c.w-1)/2;
    // 压缩 1.50–2.55、立柱 2.05–3.20：两段重叠 0.5s。
    // 旧版压缩到 2.90 才到位、光柱 2.55 才起手，中间 70.3–71.0 盾已压成薄片、柱子还没长，
    // 画面中央空出整整 0.7 秒，读成"主体消失了"。
    var cp=clamp01((e-1.50)/1.05),press=cp*cp*(3-2*cp);
    luOathSequence(c,t,top,bt,3.69+e,press);
    var shy=mix(18,26,press),shw=mix(1,0.62,press);
    // 1) 三拍呼唤：每拍一圈波 + 一圈沿轮廓下跑的亮光（盾在应和）
    for(var i=0;i<CALLS.length;i++) {
      var a=e-CALLS[i];
      if(a<0||a>0.86)continue;
      var life=a/0.86;
      // 从盾沿起跑、向画外扩：起点 r=17 正好贴着盾的半宽，波一出现就在轮廓上，
      // 之后整段都在盾外，不会被盾面挡住。
      luCallWave(c,cx,shy,17+18*Math.pow(life,0.80),life);
      // 金框应和：一段亮光沿轮廓从上往下跑，跑完就暗回去
      var fy=-12.6+(a/0.62)*26.2;
      if(a<0.62)for(var dv=-3;dv<=3;dv++) {
        var v4=fy+dv;
        if(v4<-12.6||v4>13.6)continue;
        var w4=luOathHalfW((v4+12.6)/26.2)*shw,ff=1-Math.abs(dv)/3.4;
        if(w4<1.5)continue;
        for(var s4=-1;s4<=1;s4+=2)c.put(cx+s4*w4,shy+v4,ff>0.6?'◆':'+',ff>0.6?W:B);
      }
    }
    // 2) 熔流：左岸先动 0.1 拍，右岸追上来，最后在台基上合流
    var g=clamp01((e-1.40)/1.30);
    if(g>0) {
      luCallStream(c,cx,1,clamp01(g*1.12),t);
      luCallStream(c,cx,-1,clamp01((g-0.09)*1.12),t);
    }
    // 3) 受热重染：压到一半就开始泛白热，锻件是"被烤亮的"而不是"被涂亮的"
    var heat=clamp01((e-1.95)/1.05);
    if(heat>0)luHeatWash(c,Math.round(cx-25),Math.round(cx+25),Math.round(shy-15),Math.round(shy+16),heat);
    // 4) 白热柱：从锻件上长出，2.55 起手、3.85 到位
    var pg=clamp01((e-1.95)/1.15);
    if(pg>0)luCallPillar(c,cx,28.6,pg,t);
    c.sx=0;c.sy=0;
  }

  // 64.40–68.09：火种受金属护翼包覆，誓约盾合拢并抵住碎片冲击。
  function lu_s4_oath(c,t,top,bt,elapsed) {
    luOathSequence(c,t,top,bt,elapsed);
    var seg=elapsed<1.2?0:elapsed<2.3?1:2;
    clearRect(c,0,top,c.w,1);
    c.put(3,top,['31 / BOUND BY BLOOD AND FLAME','32 / SHIELD MEETS SHARD','32 / SHATTERPROOF'][seg],N);
    c.put(c.w-24,top,['OATH / CLOSING','OATH / TAKING THE HIT','OATH / UNBROKEN'][seg],R);
    clearRect(c,0,bt,c.w,1);
    c.center(bt,['ONE FLAME / ONE VOW','LET THEM COME / WE HOLD','BOUND IN FIRE / UNBROKEN'][seg],B);
  }

  // 68.09–72.01：盾心发出呼唤波纹 → 两岸熔流聚拢 → 誓约化锻件、白热柱升起。
  function lu_s4_call(c,t,top,bt,elapsed) {
    luCallSeq(c,t,top,bt,elapsed);
    var seg=elapsed<1.55?0:elapsed<2.70?1:2;
    clearRect(c,0,top,c.w,1);
    c.put(3,top,['33 / I CALL OUT YOUR NAME','33 / AND THE FIRE ANSWERS','34 / ONE HEART / ONE STRIKE'][seg],N);
    c.put(c.w-24,top,['ECHO / RESONATING','MOLTEN / COMING HOME','FORGE / RISING'][seg],R);
    clearRect(c,0,bt,c.w,1);
    c.center(bt,['YOUR NAME / THROUGH THE FLAMES','EVERY FLAME / REMEMBERS YOU','ALL FIRE / ONE HEART'][seg],B);
  }
  // ===== 副歌二 72.01–80.00「LINK UP」：按 MV 82.6–90.6 改成硬切快剪 =====
  // 旧稿自创了"三击把熔金锻成双环"，MV 里根本没有这件事；副歌的力量来自剪辑节奏，
  // 不是叠更多特效。参考帧顺序（MV t ≈ 歌曲 t + 10.6）：
  //   82.6 红霓虹腔里悬着一枚竖长符文框 → 83.8 白闪过曝 → 84.6 俯视的巨型圆鼓
  //   86.2 黄铜圆舱，舱内一个逆光剪影 → 87.4 紫雾漩涡 → 88.2 暗室
  //   89.2 走廊行走（竖向光带）→ 90.4 面部特写
  // 本页调色板没有蓝紫，走廊/暗室的冷色一律翻译成暗红，保持全片一个色系。

  // 逆光人形剪影的掩膜：不拿立绘降采样——立绘连大镰刀和披发一起算进去，缩到 22 列
  // 只剩一团毛边（实测 22×11 的掩膜读不出人形）。这里按人体比例生成一个干净的
  // 站立轮廓：头 + 肩 + 下摆微张的大衣，宽度占舱口的 1/3 左右。
  function luFigureSil(cols) {
    var rows = Math.max(6, Math.round(cols * 1.55)), g = [], gy, gx, s;
    for (gy = 0; gy < rows; gy++) {
      var u = gy / (rows - 1), hw;
      if (u < 0.15) {                                  // 头：圆
        var t = (u - 0.075) / 0.08;
        hw = t * t < 1 ? 0.135 * Math.sqrt(1 - t * t) : 0;
      } else if (u < 0.21) hw = 0.085;                 // 脖子
      else if (u < 0.30) hw = 0.085 + (u - 0.21) / 0.09 * 0.185;   // 肩
      else hw = 0.27 + (u - 0.30) / 0.70 * 0.21;       // 大衣下摆往外张
      s = '';
      for (gx = 0; gx < cols; gx++) {
        var d = Math.abs(gx - (cols - 1) / 2) / (cols - 1);
        // 下摆最后两行开个缝，两条腿才分得出来
        if (u > 0.90 && d < 0.055) { s += '.'; continue; }
        s += d <= hw ? '#' : '.';
      }
      g.push(s);
    }
    return { w: cols, h: rows, g: g };
  }
  // 把剪影挖成洞（逆光 = 舱内亮、人全黑），再沿外缘点一圈红光当轮廓光。
  function luDrawSil(c, sil, cx, baseY, edge) {
    if (!sil) return;
    var x0 = Math.round(cx - sil.w / 2), y0 = baseY - sil.h + 1, gx, gy, n;
    for (gy = 0; gy < sil.h; gy++) for (gx = 0; gx < sil.w; gx++)
      if (sil.g[gy].charAt(gx) === '#') c.put(x0 + gx, y0 + gy, ' ');
    for (gy = 0; gy < sil.h; gy++) for (gx = 0; gx < sil.w; gx++) {
      if (sil.g[gy].charAt(gx) === '#') continue;
      n = 0;
      if (gy > 0 && sil.g[gy - 1].charAt(gx) === '#') n++;
      if (gy < sil.h - 1 && sil.g[gy + 1].charAt(gx) === '#') n++;
      if (gx > 0 && sil.g[gy].charAt(gx - 1) === '#') n++;
      if (gx < sil.w - 1 && sil.g[gy].charAt(gx + 1) === '#') n++;
      if (n) c.put(x0 + gx, y0 + gy, n > 1 ? '▓' : '░', edge || R);
    }
  }

  // ① 红霓虹腔：左侧发光柱 + 中央悬浮的竖长符文框，缓慢推近。
  function luShot_neon(c, t, top, bt, u) {
    var x, y, i, j;
    var cx = 63, cy = 18;
    var push = 0.94 + luEase(u) * 0.18;
    var beat = mod(t * 1.85, 1), env = Math.exp(-beat * 5);
    for (y = top; y <= bt; y++) for (x = 2; x < c.w - 2; x++) {
      var dx = (x - cx) / 2.6, dy = y - cy, rr = Math.sqrt(dx * dx + dy * dy);
      var I = Math.exp(-rr / 18) * (0.80 + env * 0.30);
      if (I > 0.52) c.put(x, y, '░', R);
      else if (I > 0.22 && hash16(x * 11 + y * 7) % 100 < 58) c.put(x, y, '·', R);
    }
    // 左侧结构柱（MV 里画面左边那根烧红的立柱）：外框肋骨 + 内缝白热
    for (y = top; y <= bt; y++) {
      c.put(12, y, '│', R); c.put(13, y, '▓', R);
      c.put(14, y, '█', hash16(y * 37) % 100 < 12 ? W : R);
      c.put(15, y, '█', R); c.put(16, y, '▓', R); c.put(17, y, '│', R);
      if (y % 7 === 0) for (i = 11; i <= 18; i++) c.put(i, y, '─', R);
    }
    for (y = top; y <= bt; y += 3) c.put(104, y, '▓', R);
    // 符文框：竖长矩形，双层描边 + 外晕；框内挖空才读得出"悬着一块屏"
    var fx = Math.round(cx + Math.sin(t * 0.9) * 0.8);
    var fy = Math.round(cy + Math.sin(t * 1.1 + 0.6) * 0.7);
    var hw = Math.round(7 * push), hh = Math.round(hw * 0.72);
    for (j = -hh - 3; j <= hh + 3; j++) for (i = -hw - 3; i <= hw + 3; i++) {
      var ex = hw - Math.abs(i), ey = (hh - Math.abs(j)) * 2;
      var e2 = Math.min(ex, ey);
      if (e2 < 0) continue;
      if (e2 < 1.0) c.put(fx + i, fy + j, '█', R);
      else if (e2 < 2.0) c.put(fx + i, fy + j, '▒', R);
      else if (e2 < 3.0 && hash16((i + 9) * 31 + (j + 9) * 17) % 100 < 52) c.put(fx + i, fy + j, '░', R);
      else if (e2 < 4.2) c.put(fx + i, fy + j, ' ');
    }
  }

  // ② 白闪过曝（MV 83.8 的转场）：0.28 秒，把前后两镜连起来。
  function luShot_flash(c, top, bt, u) {
    var k = Math.sin(clamp01(u) * Math.PI), x, y, n;
    for (y = top; y <= bt; y++) for (x = 2; x < c.w - 2; x++) {
      n = hash16(x * 7 + y * 13 + 911) % 100;
      if (n < 18 + k * 82) c.put(x, y, n < 6 + k * 62 ? '█' : '▓', k > 0.72 ? W : (k > 0.40 ? B : N));
    }
  }

  // ③ 巨型圆鼓：铁壳 + 环带 + 圆形徽记，低机位仰视，暖光从左上来。
  function luShot_drum(c, t, top, bt, u) {
    var x, y, i;
    var cx = 58 - 3 * u, cy = 15.5 + u * 1.2, RAD = 40 + 5 * u;
    var spin = t * 0.06;
    for (y = top; y <= bt; y++) for (x = 2; x < c.w - 2; x++) {
      var dx = (x - cx) / 2.2, dy = y - cy, rr = Math.sqrt(dx * dx + dy * dy);
      var I = Math.exp(-rr / 30) * 0.62;
      if (I > 0.34) c.put(x, y, '░', N);
      else if (I > 0.17 && hash16(x * 17 + y * 23) % 100 < 42) c.put(x, y, '·', N);
    }
    // 支架：鼓下面是立柱，越往下越暗，出画即可
    for (y = cy + 9; y <= bt; y++) {
      var half = 4 + (y - cy - 9) * 0.35;
      for (i = 0; i < half; i++) {
        c.put(cx - half + i, y, i % 2 ? '▒' : '▓', R);
        c.put(cx + half - i, y, i % 2 ? '▒' : '▓', R);
      }
    }
    for (y = top; y <= bt; y++) for (x = 2; x < c.w - 2; x++) {
      var dx2 = x - cx, dy2 = (y - cy) * 2 / 0.62;      // 0.62 = 垂直压缩，做出俯角
      var r = Math.sqrt(dx2 * dx2 + dy2 * dy2);
      if (r > RAD) continue;
      var a = Math.atan2(dy2, dx2) + spin;
      var lit = 0.62 + 0.38 * Math.cos(a - 3.6);        // 左上来光
      // 环带：赤道一圈厚箍，箍上打铆钉
      var band = Math.abs(r - RAD * 0.80) < RAD * 0.055;
      var rim = r > RAD * 0.955 || (r > RAD * 0.90 && Math.cos(a * 26) > 0.35);
      if (rim) c.put(x, y, '▓', lit > 0.75 ? B : N);
      else if (band) {
        var rivet = Math.abs(mod(a * 9.5, 1) - 0.5) < 0.16;
        c.put(x, y, rivet ? '█' : '▒', rivet ? (lit > 0.7 ? W : B) : N);
      } else if (Math.abs(r - RAD * 0.46) < RAD * 0.075) c.put(x, y, '▒', lit > 0.8 ? W : B);
      else if (Math.abs(r - RAD * 0.30) < 1.2 && Math.abs(Math.sin(a * 4)) > 0.55) c.put(x, y, '░', N);
      else if (r < RAD * 0.30) c.put(x, y, hash16(x * 13 + y * 29) % 100 < 40 ? '▒' : '░', B);
      else if (hash16(x * 31 + y * 17) % 100 < 46) c.put(x, y, '░', lit > 0.8 ? N : R);
      else if (hash16(x * 7 + y * 41) % 100 < 22) c.put(x, y, '·', R);
    }
    // 徽记：鼓心一个圆环 + 十字刻线
    for (i = 0; i < 40; i++) {
      var ta = i / 40 * TAU;
      c.put(Math.round(cx + Math.cos(ta) * RAD * 0.17), Math.round(cy + Math.sin(ta) * RAD * 0.17 / 2),
            '·', B);
    }
  }

  // ④ 黄铜圆舱：齿轮外环 + 同心环箍 + 琥珀内壁，中央一个逆光的人。
  // 舱内要"亮而不糊"：只靠低密度 ░ 铺满会整屏读成噪点墙，所以内壁先按半径分三层环箍，
  // 再叠稀疏填充，最后沿舱口打一圈高光——口沿才是"这是个洞"的关键。
  function luShot_chamber(c, t, top, bt, u) {
    var x, y, i;
    var cx = 60, cy = 18, RAD = 37 + u * 4;
    for (y = top; y <= bt; y++) for (x = 2; x < c.w - 2; x++) {
      var dx = x - cx, dy = (y - cy) * 2;
      var r = Math.sqrt(dx * dx + dy * dy);
      if (r > RAD * 1.22) continue;
      var a = Math.atan2(dy, dx);
      if (r > RAD) {                                       // 外圈齿轮
        var tooth = Math.cos(a * 22) > 0.35;
        if (r > RAD + 4.0 && !tooth) continue;
        c.put(x, y, tooth && r > RAD + 1.8 ? '▓' : '▒', r > RAD + 1.8 ? B : N);
        continue;
      }
      if (r > RAD - 1.6) { c.put(x, y, '▓', B); continue; }          // 口沿高光
      if (r > RAD - 3.4) { c.put(x, y, '▒', N); continue; }          // 口沿内侧
      // 同心环箍：三条，越靠内越亮
      var ring = Math.abs(r - RAD * 0.80) < 1.3 || Math.abs(r - RAD * 0.55) < 1.1 ||
                 Math.abs(r - RAD * 0.30) < 0.9;
      // 辐条：每 22.5° 一根，只在外半区
      var spoke = r > RAD * 0.34 && Math.abs(Math.sin(a * 4)) < 0.06;
      if (ring) { c.put(x, y, '▒', r < RAD * 0.4 ? B : N); continue; }
      if (spoke) { c.put(x, y, '│', R); continue; }
      // 内壁：必须**填满**（用 ░ 的自身覆盖率做调子），留洞只会让整舱读成黑的；
      // 逆光剪影正是靠这层亮底才立得住。
      var I = 1.05 - r / (RAD * 1.15);
      if (I > 0.60) c.put(x, y, '░', B);
      else if (I > 0.26) c.put(x, y, '░', N);
      else c.put(x, y, '·', R);
    }
    luDrawSil(c, luFigureSil(10), cx, 31, R);
    // 舱内浮尘：缓缓下沉，别太密
    for (i = 0; i < 20; i++) {
      var hx = hash16(i * 71 + 13) % 100, hy = hash16(i * 37 + 91) % 100;
      c.put(cx - 24 + hx * 0.48, top + 2 + mod(hy * 0.24 + t * 0.55, 24), '·', B);
    }
  }

  // ⑤ 紫雾漩涡（冷色翻译成暗红）：旋臂向中心收，中心留黑眼。
  function luShot_vortex(c, t, top, bt, u) {
    var x, y;
    var cx = 60, cy = 18, RAD = 46;
    for (y = top; y <= bt; y++) for (x = 2; x < c.w - 2; x++) {
      var dx = x - cx, dy = (y - cy) * 2;
      var r = Math.sqrt(dx * dx + dy * dy);
      if (r > RAD) continue;
      var a = Math.atan2(dy, dx);
      var sw = Math.sin(a * 3 + r * 0.22 - t * 2.6);
      var I = (0.5 + 0.5 * sw) * Math.min(1, r / 10) * (1 - r / (RAD * 1.05));
      if (r < 7) continue;                               // 中心黑洞
      if (I > 0.58) c.put(x, y, '▓', R);
      else if (I > 0.30) c.put(x, y, '▒', R);
      else if (I > 0.12) c.put(x, y, '░', R);
      else if (hash16(x * 19 + y * 31) % 100 < 24) c.put(x, y, '·', R);
    }
    // 中心往外甩的一圈火星
    for (var i = 0; i < 30; i++) {
      var ha = hash16(i * 13) % 628 / 100, hr = 8 + mod(hash16(i * 57) % 100 * 0.35 + t * 6, 26);
      c.put(cx + Math.cos(ha) * hr, cy + Math.sin(ha) * hr / 2, '·', i % 3 ? R : B);
    }
  }

  // ⑥ 暗室 → 走廊：竖向光带做等距节奏，女王贴着地线走，末端切脸部特写。
  function luShot_corridor(c, t, top, bt, u) {
    var x, y, i;
    var floor = bt - 3;
    for (y = top; y <= bt; y++) for (x = 2; x < c.w - 2; x++)
      if (hash16(x * 13 + y * 41) % 100 < 12) c.put(x, y, '·', R);
    // 五根竖光带：越靠近画面右边越亮（光从走廊深处来）
    for (i = 0; i < 6; i++) {
      var bx = 10 + i * 20 + Math.sin(t * 0.5 + i) * 0.6;
      var h = 20 + i % 2 * 3, k = 0.30 + i * 0.10;
      for (y = floor - h; y <= floor; y++) {
        if (y < top) continue;

  // 用户提供的第三版 ANSI 角色（洛克茜·女仆装 + 大锤，110×110）。

  // 分五层：0 body / 1 左发束 / 2 顶发束 / 3 右飘发 / 4 weapon（右手大锤）。
  // parts 由 tools/ascii_mv/build_roxy_actor.py 按像素算出，**互斥**；

  var LU_ROXY_CACHE = {};

  // 和头骨一起留在 body 层不动——上一版把 y<27 的整个头顶当一束（18×27 实心块）
  // 绕同一点旋转，读起来是"后脑勺在晃"，不是"几根头发在飘"。

  var LU_ROXY_HAIR = [

    { part: 1, px: 46.5, py: 18.5, ang: 0.140, shear: 0.34, f1: 1.85, f2: 4.10, ph: 0.9 },
    // 头顶那根（尖端 60,9，根在发旋；根→尖 3.5px）
    { part: 2, px: 60.0, py: 12.5, ang: 0.160, shear: 0.40, f1: 2.10, f2: 4.60, ph: 2.0 },
    // 甩向右边那缕（尖端 70,17，根在离开发团处；根→尖 6.5px）
    { part: 3, px: 64.5, py: 13.5, ang: 0.100, shear: 0.20, f1: 1.55, f2: 3.30, ph: 3.1 }

  function luRoxyLayers(vis) {
    var data = window.__LU_ROXY_ANSI;
    if (!data) return null;
    var key = vis ? vis.toFixed(3) : '1';
    if (LU_ROXY_CACHE[key] && LU_ROXY_CACHE[key].data === data) return LU_ROXY_CACHE[key].layers;
    var unit = 8, layers = [], L, x, y;
    var parts = data.parts || null;
    for (L = 0; L < LU_ROXY_LAYERS; L++) {
      var cv = document.createElement('canvas');
      cv.width = data.width * unit; cv.height = data.height * unit;
      var ctx = cv.getContext('2d');
      for (y = 0; y < data.height; y++) for (x = 0; x < data.width; x++) {
        var index = data.alphabet.indexOf(data.rows[y].charAt(x));
        if (index <= 0) continue;
        var mine = !parts || parts[y].charAt(x) === String(L);
        // ⚠️ 动层各向外多吃 1 格（8 邻域）。旋转后层与 body 之间会张开 1 源像素的
        // 缝，透出背景色，读成"头发被撕开"。膨胀 1 格正好盖住这条缝，而静止时吃
        // 的像素还是它自己的颜色，与 body 完全重合，看不出来。
        if (!mine && L > 0) {

                  parts[qy].charAt(qx) === String(L)) mine = true;

    while (last > 0 && !/[^.\s]/.test(data.rows[last])) last--;

  // ── 两人并排时按**脸**配平，不按身高配平 ────────────────────────────────

  // actor = {x(格), y(格), width(格), t, reveal, anchor('head'|'foot')}

  // ===== 80.00–96.03：红瞳 → 血玫瑰 → 红教堂 → 字卡 → 镰刃 =====
  // 对应 MV 90.6–106.6（MV t ≈ 歌曲 t + 10.6，与 96.03→106.4 同源）。
  // 旧稿是本段最早的自创戏：一个 16 秒不动的人物站在土黄柱廊里，左侧一轮"淬火轮盘"
  // 读成一块金色门框，末段"血蔷薇"是十几条红线交叉成的格子。MV 里没有殿堂加轮盘，
  // 实际是五段硬切：红瞳极特写 → 黑暗里一朵玫瑰被点亮、推近到铺满 → 一片花瓣落下 →
  // 红教堂里长桌后的身影 → 巨型字卡 → 红色机械特写。
  // ⚠️ 暗部一律"什么都不画"（空格），不用深色字符：G/K/D 在黑底上会泛土黄绿，
  // 那正是 64–103 看起来脏的唯一原因。

  var LU_NAVE = {cx: 60, cy: 17, k: 5.9, eye: 3.8, wall: 13};

  // ⚠️ 字符是 1:2，纵向再折半就会得到一座压扁的教堂。

  function luArchRise(s, rise) {

  // 关键不是"红"，是**眼白要比虹膜淡**：上一版虹膜和眼白都填 █ R，整只眼是一团平红，
  // 只看得见两个红斑。眼白用 ░ W（点状奶油 → 浅灰），红瞳才跳得出来。
  function luEye(c, ex, ey, w, h, k) {

  // 现在按实拍重画：圆柱身（沿轴凸环 + 圆柱明暗）+ 椭圆端面（三道同心雕花）+ 中心孔 + 齿轮。
  function lu_s6_dome(c, t, top, bt, e) {
    var u = clamp01(e / 3.8), x, y, i, k;
    var cx = 80 - u * 5, cy = 17.2 + Math.cos(u * 2.0) * 0.9;
    var rx = 15 + u * 8, ry = 6.6 + u * 3.6;
    var xL = 2, tiltY = 2.4;
    var sd = Math.round(t * 9);
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++)          // 暖色虚化的底
      if (hash16(x * 11 + y * 7 + sd) % 100 < 5) c.put(x, y, '·', N);
    for (i = 0; i < 24; i++) {                                       // 背景 bokeh
      var hs = hash16(i * 197 + 23);
      var bxp = 5 + hs % 110, byp = top + 2 + ((hs >> 5) % (bt - top - 5)), br = 1 + (hs >> 9) % 3;
      for (x = bxp - br; x <= bxp + br; x++) for (y = byp - br; y <= byp + br; y++) {
        if (x < 1 || x > c.w - 2 || y < top + 1 || y > bt - 1) continue;
        var q2 = ((x - bxp) * (x - bxp) + (y - byp) * (y - byp) * 3) / (br * br + 0.5);
        if (q2 <= 1) c.put(x, y, q2 < 0.4 ? '▒' : '░', N);
      }
    }
    // 柱身：越靠端面越粗（近大远小），沿轴一串凸环，圆柱面靠 cos 明暗立起来
    for (x = xL; x <= cx; x++) {
      var f = (x - xL) / (cx - xL);
      var hw = ry * (0.60 + 0.40 * f), mid = cy + tiltY * (1 - f);
      for (y = Math.round(mid - hw); y <= Math.round(mid + hw); y++) {
        if (y < top + 1 || y > bt - 1) continue;
        var ny = (y - mid) / hw;
        // ⚠️ 突环周期不能太短：0.92 弧度 ⇒ 每 6.8 格一道，整根柱读成"斑马/百叶窗"。
        // 拉长到 0.40（约 15 格一道）。高光不能靠抬基线（0.80 就整根柱过曝成白板），
        // 改成**轴线上一道窄高光**：core 只在 |ny|<0.24 时有值。
        var core = Math.max(0, 1 - Math.abs(ny) * 7.0);
        var rng = 0.5 + 0.5 * Math.cos((x - xL) * 0.40);
        var I = Math.cos(ny * 1.42) * (0.60 + 0.20 * rng) + core * 0.20 * (0.72 + 0.28 * rng);
        if (I > 0.80) c.put(x, y, '█', W);
        else if (I > 0.56) c.put(x, y, '▓', B);
        else if (I > 0.34) c.put(x, y, '▒', N);
        else if (I > 0.16) c.put(x, y, '▓', G);
        else c.put(x, y, ' ', D);
      }
    }
    // 端面：椭圆 + 三道同心雕花 + 中心孔（孔随 u 张开，里面透出红色）
    var hole = 0.12 + clamp01((e - 2.4) / 1.4) * 0.46;
    for (y = Math.round(cy - ry); y <= Math.round(cy + ry); y++)
      for (x = Math.round(cx - rx); x <= Math.round(cx + rx); x++) {
        var dx = (x - cx) / rx, dy = (y - cy) / ry, d2 = dx * dx + dy * dy;
        if (d2 > 1) continue;
        var dd = Math.sqrt(d2);
        if (dd < hole) {
          c.put(x, y, ' ', D);
          if (hash16(x * 29 + y * 41 + sd) % 100 < 26) c.put(x, y, '·', R);
          continue;
        }
        var I2 = 0.94 - dd * 0.26;
        // 雕花环要细：0.055 的宽度在 rx≈17 上折算成近 2 格，三道环会连成一片白板
        if (Math.abs(dd - 0.88) < 0.030 || Math.abs(dd - 0.62) < 0.028 || Math.abs(dd - 0.36) < 0.032)
          I2 += 0.20;
        if (dd < hole + 0.055) { c.put(x, y, '▓', N); continue; }    // 孔口金属反光
        if (dd > 0.93) { c.put(x, y, '█', B); continue; }            // 圆盘外缘亮边（否则端面与柱身糊成一片）
        if (I2 > 1.04) c.put(x, y, '█', W);
        else if (I2 > 0.82) c.put(x, y, '▓', B);
        else if (I2 > 0.62) c.put(x, y, '▒', N);
        else if (I2 > 0.44) c.put(x, y, '▓', G);
        else c.put(x, y, '▒', G);
      }
    for (i = 0; i < 26; i++) {                                       // 端面外缘一圈齿
      var aa = i / 26 * TAU + t * 0.16;
      c.put(Math.round(cx + Math.cos(aa) * (rx + 1.5)), Math.round(cy + Math.sin(aa) * (ry + 1.0)),
            '●', i % 2 ? N : B);
    }
    for (k = 0; k < 2; k++) {                                        // 右下两只副齿轮
      var gx3 = 100 + k * 11 + u * 3, gy3 = 26 - k * 7, gr = 5.0 - k * 1.1;
      for (i = 0; i < 16; i++) {
        var a3 = i / 16 * TAU + t * (k ? -0.45 : 0.35);
        c.put(Math.round(gx3 + Math.cos(a3) * gr), Math.round(gy3 + Math.sin(a3) * gr * 0.55), '●', N);
      }
      for (i = 0; i < 5; i++) {
        var a4 = i / 5 * TAU - t * 0.3;
        c.put(Math.round(gx3 + Math.cos(a4) * gr * 0.5), Math.round(gy3 + Math.sin(a4) * gr * 0.3), '·', B);
      }
    }
    for (i = 0; i < 40; i++) {                                       // 金尘
      var hs2 = hash16(i * 131 + 17);
      c.put(4 + hs2 % 112, top + 2 + ((hs2 >> 5) % (bt - top - 4)),
            hs2 % 5 ? '.' : '+', hs2 % 3 ? B : W);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '38 / THE BRASS ENGINE', N);
    c.put(c.w - 22, top, 'GEARS / STILL WARM', B);
    c.center(bt, e < 2.6 ? 'NOT A CHURCH / A MACHINE' : 'AND IT IS STILL / TURNING', B);
  }

  // ③ 冷阶（MV 87.6–89.9）：冷调石阶，人影沿阶而下。
  // 全片唯一一段"不红"的镜头，靠它给后面的红做反差（调色板没有蓝，只能靠"低饱和的暗 + 一道奶油冷光"）。
  // ⚠️ 两版都是**侧视剖面**：踏面 17 格宽、竖板 2 行高，比例 17:4 —— 太扁，
  // 整段读成"一条上升的折线 / 心电图"，怎么加竖板都不像楼梯。
  // 定案：改**正面透视**。一串横带（近宽远窄、近疏远密）+ 两条向灭点收拢的栏杆，
  // 这是"站在楼梯口往下看"的唯一稳的读法。
  function lu_s6_stair(c, t, top, bt, e) {
    var u = clamp01(e / 2.3), x, y, i;
    // ⚠️ 关键数字：踏板宽 : 竖板高 = 8.4 格 : 2.6 行（视觉 8.4:5.2 ≈ 1.6:1）。
    // 前两版是 17 格 : 2.35 行 ≈ 3.6:1 —— 锯齿几乎看不出，整段读成"一条上升的斜线/心电图"。
    // 也试过"正面透视"：台阶对称收窄 + 居中 ⇒ 读成**阶梯金字塔**。侧视才是对的。
    var SX = 6, SY = bt - 4, DX = 8.4, DY = -2.6, NS = 9;
    for (y = top + 1; y < bt; y++) for (x = 1; x < c.w - 1; x++) {     // 背景冷雾
      var m = 1 - Math.abs(x - 62) / 50;
      if (m > 0 && hash16(x * 13 + y * 7) % 100 < m * 14) c.put(x, y, '·', K);
    }
    for (i = 0; i < NS; i++) {
      var x0 = Math.round(SX + i * DX - u * 4), y0 = Math.round(SY + i * DY + u * 6);
      var x1 = x0 + Math.round(DX);
      if (y0 < top + 2 || y0 > bt - 1) continue;
      // ⚠️ 每级必须是**一个有厚度的实心块**（顶面亮边 + 4 行厚的踏身）。
      // 之前只画"一行白横条 + 右端一列红竖条"，两者不连，整幅读成一排悬空的红白方块。
      for (x = x0; x < x1; x++) {
        if (x < 2 || x > c.w - 3) continue;
        c.put(x, y0, '▓', W);
        // ⚠️ 踏身必须用半实心 ▒：用 ░（点阵）在暗场里几乎看不见，
        // 每级就只剩顶面那条白线 ⇒ 又变回"一排悬空的白条"。
        for (y = y0 + 1; y <= y0 + 4; y++) {
          if (y >= bt) break;
          c.put(x, y, '▒', N);
        }
      }
      for (y = y0; y <= y0 + 4; y++) {                                // 竖板：本级左端那块立面
        if (y >= bt || y < top || x0 < 2 || x0 > c.w - 3) continue;
        c.put(x0, y, '▓', N);
      }
    }
    // 扶手：一条从台阶端点上方向右上升的斜线（跟台阶平行，只高 5 行）
    for (i = 0; i < 110; i++) {
      var hx = 4 + i, hy = Math.round(SY - 5 - (hx - SX) * (-DY) / DX + u * 6);
      if (hx > c.w - 3 || hy < top + 1 || hy > bt - 2) continue;
      c.put(hx, hy, '─', B);
    }
    for (i = 0; i < NS; i += 2) {                                     // 扶手立柱
      var px = Math.round(SX + i * DX + DX * 0.5 - u * 4);
      var py = Math.round(SY - 5 + i * DY + u * 6);
      for (y = py + 1; y <= py + 5; y++)
        if (y > top && y < bt - 1 && px > 1 && px < c.w - 2) c.put(px, y, '│', G);
    }
    // 人：站在第 3 级踏面上（暗红实心 + 头顶一点亮）
    // ⚠️ 之前是 10 行高 × 4 格宽（视觉 1:5）⇒ 读成"一根红柱子/一束花"。
    // 7 行高 × 8 格宽（视觉 1:2.3）才是人的比例。
    var fx = Math.round(SX + 2 * DX + DX * 0.5 - u * 4), fy = Math.round(SY + 2 * DY + u * 6);
    for (i = 0; i <= 6; i++) {
      var ry = fy - 6 + i, hw3;
      if (ry < top + 1 || ry >= bt) continue;
      if (i < 2) hw3 = 1.4;                                           // 头
      else if (i === 2) hw3 = 0.7;                                    // 颈
      else hw3 = 1.9 + (i - 3) * 0.78;                                // 裙摆往外张
      for (x = Math.round(fx - hw3); x <= Math.round(fx + hw3); x++)
        c.put(x, ry, Math.abs(x - fx) > hw3 - 0.9 ? '▓' : '▒',
              Math.abs(x - fx) > hw3 - 0.9 ? R : N);
    }
    c.put(fx, fy - 6, '▓', W);                                        // 头顶高光
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '39 / DOWN THE STEPS', B);
    c.put(c.w - 22, top, 'COLD / NO FIRE HERE', K);
    c.center(bt, 'SHE COMES DOWN / ALONE', K);
  }

  // ④ 脸（MV 89.9–92.3）：正面极特写，逆光——脸只在边缘亮，五官全靠两只眼。
  // ⚠️ 上一版三个毛病（看图才发现）：
  //   ① 正圆椭圆的下半部收成一个尖 ⇒ 整张脸读成"倒桃心"；下巴必须是**方的**（超椭圆）。
  //   ② 眼珠大到各占脸宽 1/3，两眼挤在一起 ⇒ 读完是"护目镜"；且眼距要略大于一只眼。
  //   ③ 头发内部随机撒暗红发丝时没排除脸面，脸两颊上落了一条条竖纹。
  function lu_s6_face(c, t, top, bt, e) {
    var u = clamp01(e / 2.4), x, y, i;
    var cx = 60, cy = 18.0 + u * 0.7, pw = 1 + u * 0.06;
    var FW = 17 * pw, FH = 12 * pw;
    var sd = Math.round(t * 10);
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {          // 背景红雾
      var bgd = 16 - Math.abs(y - 20) * 0.6;
      if (hash16(x * 7 + y * 13 + sd) % 100 < bgd) c.put(x, y, '·', R);
    }
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {          // 头发：整团压黑
      var hx2 = (x - cx) / (FW * 1.55), hy2 = (y - cy + 2) / (FH * 1.60);
      if (hx2 * hx2 + hy2 * hy2 <= 1) c.put(x, y, ' ', D);
    }
    // 发缘的红光：只在外缘一圈，且要连成一条边（散开的红点会读成"红头巾"）
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      var ex2 = (x - cx) / (FW * 1.55), ey2 = (y - cy + 2) / (FH * 1.60);
      var ed = Math.sqrt(ex2 * ex2 + ey2 * ey2);
      if (ed < 0.975 || ed > 1.055) continue;
      if (hash16(x * 31 + y * 17) % 100 < 74) c.put(x, y, ed > 1.02 ? '·' : '▓', R);
    }
    // 脸面：超椭圆（|dx|^2.4 + |dy|^2.4 ≤ 1）—— 指数 2 的正圆椭圆会把下半部收成尖下巴。
    // 明度分五档全用实心/半实心（█ ▓ ▒），不用 ░：大面积点阵在金底上读成"脏"。
    for (y = Math.round(cy - FH); y <= Math.round(cy + FH); y++)
      for (x = Math.round(cx - FW); x <= Math.round(cx + FW); x++) {
        var dx = (x - cx) / FW, dy = (y - cy) / FH;
        var dd = Math.pow(Math.abs(dx), 2.4) + Math.pow(Math.abs(dy), 2.4);
        if (dd > 1) continue;
        var lit = clamp01(0.94 - (dx * 0.44 + dy * 0.28) - dd * 0.30);   // 光从左上
        if (lit > 0.62) c.put(x, y, '█', B);
        else if (lit > 0.45) c.put(x, y, '▓', B);
        else if (lit > 0.30) c.put(x, y, '▒', B);
        else if (lit > 0.15) c.put(x, y, '▓', N);
        else c.put(x, y, '▒', G);
      }
    // 发丝只撒在"头发里且在脸外"（否则脸颊上会出现一道道竖纹）
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      var gx2 = (x - cx) / (FW * 1.55), gy2 = (y - cy + 2) / (FH * 1.60);
      if (gx2 * gx2 + gy2 * gy2 > 1) continue;
      var fx2 = (x - cx) / FW, fy2 = (y - cy) / FH;
      if (Math.pow(Math.abs(fx2), 2.4) + Math.pow(Math.abs(fy2), 2.4) <= 1) continue;
      if (hash16(x * 13 + y * 29 + sd) % 100 < 9) c.put(x, y, '▓', G);
    }
    // 中分刘海：中间露出最多额头（hem 最高），两侧落下来
    for (x = Math.round(cx - FW); x <= Math.round(cx + FW); x++) {
      var ux = Math.abs(x - cx) / FW;
      var hem = cy - FH * 0.56 - (1 - ux) * FH * 0.20 + Math.sin(x * 0.7) * 0.55;
      for (y = Math.round(cy - FH) - 3; y < hem; y++) { if (y >= top) c.put(x, y, ' ', D); }
    }
    for (i = -1; i <= 1; i += 2) {                                      // 两侧垂下的一缕
      // ⚠️ 必须落在**脸外**（≥1.02·FW）：贴在 0.94 就压进脸颊，读成一道道竖条纹
      for (y = Math.round(cy - FH * 0.80); y < Math.round(cy + FH * 0.92); y++) {
        var lx2 = cx + i * FW * (1.04 + Math.sin(y * 0.42) * 0.05);
        c.put(Math.round(lx2), y, '▓', G);
      }
    }
    function almond(ex, ey, hw, hh) {
      var xx, yy, s2;
      for (xx = -hw; xx <= hw; xx++) {
        s2 = Math.sqrt(Math.max(0, 1 - (xx / (hw + 0.55)) * (xx / (hw + 0.55))));
        for (yy = Math.round(ey - hh * 0.90 * s2); yy <= Math.round(ey + hh * s2); yy++)
          c.put(ex + xx, yy, '█', W);
      }
      for (xx = -1; xx <= 1; xx++) for (yy = -1; yy <= 1; yy++) {        // 红虹膜（3×3）
        c.put(ex + xx, ey + yy, '█', R);
      }
      c.put(ex, ey, ' ', D);                                            // 瞳孔
      c.put(ex - 1, ey - 1, '█', W);                                    // 高光
      for (xx = -hw - 1; xx <= hw + 1; xx++)                            // 上睑：挖黑一道
        c.put(ex + xx, Math.round(ey - hh * 0.92 - 0.4), ' ', D);
    }
    var ey2 = Math.round(cy - 1.6), gap = 7;
    // 眼窝：眼睛周围把肤色压暗一档。⚠️ 不给眼窝，两只白眼睛就是贴在一个平面上的
    // 贴纸（"护目镜/卡通娃娃"），有眼窝眼睛才陷进脸里。
    for (i = -1; i <= 1; i += 2) {
      var ex0 = cx + i * gap;
      for (y = ey2 - 5; y <= ey2 + 5; y++) for (x = ex0 - 7; x <= ex0 + 7; x++) {
        if (y < top || y >= bt) continue;
        var vv = c.cells[y] && c.cells[y][x];
        if (!vv || vv[1] !== B) continue;                 // 只压肤色，不动背景和头发
        if (((x - ex0) / 7.5) * ((x - ex0) / 7.5) + ((y - ey2) / 5.5) * ((y - ey2) / 5.5) > 1) continue;
        c.put(x, y, vv[0] === '█' ? '▓' : vv[0] === '▓' ? '▒' : vv[0], N);
      }
    }
    almond(cx - gap, ey2, 3, 1.9);
    almond(cx + gap, ey2, 3, 1.9);
    for (i = -1; i <= 1; i += 2) {                                      // 眉：短、略斜
      for (x = 0; x < 9; x++) {
        var bx = Math.round(cx + i * (gap - 4 + x));
        c.put(bx, ey2 - 3 - Math.round(x * 0.16), '▓', R);
      }
    }
    // 鼻：梁的右侧一条浅影 + 鼻头高光 + 底下两格鼻翼 ⇒ 读成"鼻"而不是一根黑棍
    var ny = Math.round(cy + 2.2);
    for (y = ny; y <= ny + 3; y++) c.put(cx + 1, y, '▒', N);
    c.put(cx, ny + 3, '█', B);
    c.put(cx - 1, ny + 4, '▓', G); c.put(cx + 1, ny + 4, '▓', G); c.put(cx + 2, ny + 4, '▓', G);
    // 嘴：一条暗红唇线 + 一道受光的下唇（纯黑一条读成"缝"，纯黑一道还会被当成胡须）
    var my = Math.round(cy + 7.2);
    for (x = cx - 4; x <= cx + 4; x++) c.put(x, my, '▓', R);
    for (x = cx - 3; x <= cx + 3; x++) c.put(x, my + 1, '▒', N);
    c.put(cx - 5, my, ' ', D); c.put(cx + 5, my, ' ', D);
    for (x = cx - 3; x <= cx + 3; x++) c.put(x, my + 3, '▒', N);        // 下颌阴影
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '40 / HER EYES', N);
    c.put(c.w - 20, top, 'RED / NOT ANGRY', R);
    c.center(bt, e < 1.4 ? 'SHE LOOKS AT YOU' : 'AND DOES NOT BLINK', B);
  }

  // ⑤ 玫瑰（MV 92.3–96.0）：暗红一朵 → 打亮 → 怼满屏 → 最后 0.4s 甩成横条。
  function lu_s6_rose(c, t, top, bt, e) {
    var SPAN = 3.73, y0 = top;
    if (e < 2.55) {
      var u = clamp01(e / 2.55);
      luRose(c, t, 74 - u * 13, 15.5 + u * 1.6, 0.50 + 1.30 * Math.pow(u, 1.2),
             0.25 + 0.75 * clamp01(e / 1.5), y0, bt);
    } else if (e < 3.33) {
      luRose(c, t, 60, 17, 1.80 + 0.75 * clamp01((e - 2.55) / 0.78), 1, y0, bt);
    } else {
      luRose(c, t, 60, 17, 2.55, 1, y0, bt);
      luSmear(c, y0, bt, clamp01((e - 3.33) / 0.40));            // MV 95.6 那道红色甩镜
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '41 / A ROSE IN THE DARK', N);
    c.put(c.w - 20, top, 'BLOOM / SLOW', R);
    c.center(bt, e < 3.33 ? 'ONE PETAL / ONE MEMORY' : 'AND THEN / IT LETS GO', B);
  }

  // ===== 96.03–106.40（MV 96.0–106.4）：镰刃 / 红厅 / 石台 / TIME / STEP IN / 剪影 / 爪 =====

  // ⑥ 镰刃（MV 96.0）：一枚红弧挂在纯黑里，只有刃口是白的。
  // ⑥ 镰刃（MV 96.0）：一枚红弧挂在纯黑里，刃口是白的。
  // ⚠️ 对称的弧会读成彩虹/桥：一端收成刀尖、另一端接一根短柄，它才是"镰"。
  function lu_s7_crescent(c, t, top, bt, e) {
    var u = clamp01(e / 0.82), x, y, i, h2, s2;
    for (i = 0; i < 26; i++) {
      var hs = hash16(i * 97 + 5);
      c.put(6 + hs % 108, top + 2 + (hs >> 4) % (bt - top - 4), '.', hs % 4 ? R : N);
    }
    // 弧心放到画面左外：只有中段与刀尖留在框里，"横过画面的刀刃"才不是"彩虹"
    var acx = 24 + u * 2, acy = 34;
    for (i = 0; i <= 300; i++) {
      s2 = i / 300;
      var a = Math.PI * 1.62 + s2 * Math.PI * 0.44;
      var rr = 52 - u * 2;
      var px = acx + Math.cos(a) * rr * 1.30, py = acy + Math.sin(a) * rr * 0.62 - s2 * s2 * 3.0;
      if (px < 2 || px > c.w - 3) continue;
      var th = Math.round(5.0 - 4.2 * s2);
      for (h2 = 0; h2 < Math.max(1, th); h2++) {
        var yy2 = Math.round(py + h2);
        if (yy2 < top + 1 || yy2 >= bt) continue;
        c.put(px, yy2, h2 === Math.max(1, th) - 1 ? '█' : '▓', h2 === Math.max(1, th) - 1 ? W : R);
      }
      if (i % 45 === 0) c.put(px, Math.round(py) - 1, '.', N);
    }
    for (y = top + 2; y < Math.min(bt, top + 14); y++) {             // 柄：从左下伸进画面
      c.put(3, y, '▓', R); c.put(4, y, ' ', D); c.put(5, y, ' ', D); c.put(6, y, '▒', R);
    }
    for (i = 0; i < 5; i++) c.put(2, top + 3 + i * 2, '●', N);
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '42 / THE EDGE', N);
    c.put(c.w - 18, top, 'RED / CURVE', R);
    c.center(bt, 'SHARP / AND WAITING', B);
  }

  // ⑦ 红厅（MV 96.8–101.2）：她把巨刃拄在地上，镜头一路推近。
  function lu_s7_hall(c, t, top, bt, e) {
    var push = clamp01(e / 4.35);
    luNave(c, t, top, bt, push);
    var k = LU_NAVE.k * (1 + 0.16 * push);
    var feet = LU_NAVE.cy + LU_NAVE.eye * k / 3.19;
    var w = 18 + push * 8;
    c.queen = {x: 60 - w / 2, y: luActorY(w, feet, window.__LU_QUEEN_ANSI), width: w, t: t, reveal: 1};
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '43 / HER OWN CATHEDRAL', N);
    c.put(c.w - 22, top, 'HALL / ALL HERS', R);
    c.center(bt, e < 2.2 ? 'SHE DOES NOT KNEEL / IN HER OWN HALL'
                         : 'THE BLADE STAYS / WHERE SHE LEFT IT', B);
  }

  // ⑧ 石台（MV 101.6–102.8）：一块空石台横在画面里，红雾从上面淌下来。
  // ⚠️ 三版都栽在"随机铺满"上：台面/台身拿 ▓▒░ 按百分比乱填 ⇒ 整幅是粉色雪花屏/红砖墙。
  // 定案：石台是**三块有边界的面**——顶面（受光，横向渐变）、前沿（一条白线）、
  // 正面（压暗 + 竖直石缝）。宁可平坦也不能噪；雾只在台面上方，用 '·'。
  function lu_s7_slab(c, t, top, bt, e) {
    var u = clamp01(e / 1.9), x, y, i;
    var ty = 20.5 + u * 1.1 + Math.sin(t * 0.8) * 0.25;     // 台面前沿（最下那条亮线）
    var ty0 = ty - 4.2;                                     // 台面后沿
    var sd = Math.round(t * 14);
    var fw = 34 + u * 3, bw = 28 + u * 2;                   // 前沿/后沿半宽（近大远小）
    // 雾：只在台面上方，密度随离台面的距离衰减
    for (y = top; y < Math.round(ty0); y++) for (x = 1; x < c.w - 1; x++) {
      var d = 26 - (ty0 - y) * 2.6;
      if (d > 0 && hash16(x * 7 + y * 13 + sd) % 100 < d) c.put(x, y, '·', R);
    }
    // 顶面：横向渐变（左亮右暗）+ 一条后沿亮边。**不随机**。
    for (y = Math.round(ty0); y < Math.round(ty); y++) {
      var f = (y - ty0) / Math.max(0.01, ty - ty0);
      var hw = bw + (fw - bw) * f;
      for (x = Math.round(60 - hw); x <= Math.round(60 + hw); x++) {
        if (x < 2 || x > c.w - 3) continue;
        var lx2 = (x - 60) / Math.max(1, hw);
        var lit = 0.86 - lx2 * 0.26 - f * 0.16;
        if (lit > 0.72) c.put(x, y, '▓', B);
        else if (lit > 0.56) c.put(x, y, '▒', N);
        else c.put(x, y, '▒', R);
      }
      c.put(Math.round(60 - hw), y, '│', N);                // 两端受光竖边
      c.put(Math.round(60 + hw), y, '│', N);
    }
    for (x = Math.round(60 - fw); x <= Math.round(60 + fw); x++)   // 前沿：最亮的一条
      if (x > 1 && x < c.w - 2) c.put(x, Math.round(ty), '█', W);
    // 正面：压暗 + 每 9 格一道竖直石缝（有缝才是石头，没缝就是一块纯色板）
    for (y = Math.round(ty) + 1; y < bt - 1; y++) {
      var f2 = (y - ty) / Math.max(1, bt - 1 - ty);
      for (x = Math.round(60 - fw); x <= Math.round(60 + fw); x++) {
        if (x < 2 || x > c.w - 3) continue;
        var lx3 = (x - 60) / Math.max(1, fw);
        var I3 = 0.70 - f2 * 0.34 - Math.abs(lx3) * 0.16;
        if (mod(x - Math.round(60 - fw), 9) === 0) I3 -= 0.30;          // 石缝
        if (I3 > 0.50) c.put(x, y, '▒', N);
        else if (I3 > 0.34) c.put(x, y, '▓', R);
        else if (I3 > 0.18) c.put(x, y, '░', G);
        else c.put(x, y, ' ', D);
      }
    }
    for (i = 0; i < 16; i++) {
      var hs = hash16(i * 211 + 3);
      c.put(8 + hs % 104, top + 3 + mod((hs >> 5) * 0.02 + e * 0.5, Math.max(1, ty0 - top - 4)),
            hs % 4 ? '.' : '+', hs % 3 ? N : B);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '44 / THE STONE TABLE', N);
    c.put(c.w - 20, top, 'EMPTY / STILL WARM', R);
    c.center(bt, 'NOTHING ON IT / NOT YET', B);
  }

  // ⑨ TIME 字卡（MV 103.2）：金属大字，顶面受光。只占 0.45s。
  function lu_s7_time(c, t, top, bt, e) {
    var a = clamp01(e / 0.16), k = 1 + 0.14 * (1 - a), x, y;
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++)
      if (hash16(x * 11 + y * 7 + Math.round(t * 18)) % 100 < 12) c.put(x, y, '·', R);
    luBigWord(c, 'TIME', 12, Math.round(3 * k), Math.round(3 * k), R, W);
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '45 / TIME', N);
    c.put(c.w - 18, top, 'CARVED / IN RED', R);
  }

  // ⑩ STEP IN（MV 104.0）：字下面是那块黑白棋盘地面。
  // ⚠️ 棋盘必须压暗（K/G），一亮起来就和红字抢，整张卡读成"花纹纸"。
  function lu_s7_stepin(c, t, top, bt, e) {
    var x, y;
    var y0 = Math.round(bt * 0.60), depth = Math.max(1, bt - y0);
    // 棋盘：远格小、近格大，亮格用实心奶油（棋盘靠"格"认，靠网点认不出来）
    for (y = y0; y < bt; y++) {
      var dep = (y - y0) / depth;
      var tile = 9 + dep * 15, off = (y - y0) * 1.1;
      for (x = 1; x < c.w - 1; x++) {
        var ix = Math.floor((x + off) / tile), iy = Math.floor(dep * 4);
        if ((ix + iy) % 2) {
          // 亮格不能给实心 W：一整片白会把红字埋掉，也读成"金沙"
          c.put(x, y, dep > 0.7 ? '▒' : '░', dep > 0.7 ? W : B);
        } else c.put(x, y, ' ', D);                           // 暗格：留黑
      }
    }
    luBigWord(c, 'STEP IN', 10, 2, 2, R, W);
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '46 / STEP IN', N);
    c.put(c.w - 18, top, 'NO WAY BACK', R);
  }

  // ⑪ THEY TRY（MV 104.4）：整幅压成暗红，字比 TIME 小一号、没有金属高光。
  function lu_s7_theytry(c, t, top, bt, e) {
    var x, y;
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      var I = 0.62 - Math.abs(y - 18) / 34 + 0.08 * Math.sin(x * 0.08 + t * 1.2);
      if (I > 0.50) c.put(x, y, '▒', R);
      else if (I > 0.34 && hash16(x * 13 + y * 5) % 100 < 44) c.put(x, y, '·', R);
    }
    luBigWord(c, 'THEY TRY', 14, 2, 2, R, N);
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '47 / THEY TRY', N);
    c.put(c.w - 18, top, 'AND THEY LOSE', R);
  }

  // ⑫ 白光 + 剪影（MV 105.2）：一道斜插画面的白光，她整个人被压成一块黑。
  // ⑫ 白光 + 剪影（MV 105.2）：一道竖白光从左缝里挤进来，她整个人被压成一块黑。
  // ⚠️ 剪影只有在「填满雾/光」的画面里才成立：上一版背景全黑，只看得见一圈红描边，
  // 读成"线框人"。这一版先铺满暗红雾，再把剪影挖成洞。
  function lu_s7_white(c, t, top, bt, e) {
    var u = clamp01(e / 0.9), x, y, i;
    var sd = Math.round(t * 12);
    // 光缝要足够宽、剪影要完全压在里面，否则只看得见"描边"（上一版就此翻车）
    for (y = top; y < bt; y++) for (x = 0; x < c.w; x++) {
      var dd = Math.abs(x - (52 + u * 4) + (y - top) * 0.16) / 30;
      if (dd < 0.62) c.put(x, y, '█', W);
      else if (dd < 1.02) c.put(x, y, '▓', dd < 0.82 ? W : N);
      else if (hash16(x * 7 + y * 11 + sd) % 100 < 14) c.put(x, y, '·', R);
    }
    // ⚠️ 上一版 hr=7.2（头直径 14 格）+ 耳侧两道"长发" + 肩宽每行 +2.6 ⇒
    // 头两个角 + 大三角 = 一棵塔形的树。人形的关键是"头要小、肩要窄、身要直"。
    var hx3 = 50, hy3 = 12.6, hw4 = 4.6, hh4 = 3.5;
    function sil(x2, y2) {
      var ax = Math.abs(x2 - hx3), ry2 = y2 - hy3;
      if ((ax / hw4) * (ax / hw4) + (ry2 / hh4) * (ry2 / hh4) <= 1) return true;          // 头
      if (ax < 1.7 && ry2 > hh4 * 0.6 && ry2 < hh4 + 1.6) return true;                    // 颈
      if (ry2 > 0 && ry2 < hh4 + 8 && Math.abs(ax - (hw4 * 0.90 + ry2 * 0.05)) < 1.4) return true;  // 长发
      if (ry2 >= hh4 + 1.2 && ry2 < hh4 + 15) {                                          // 肩→腰→裙
        var t2 = (ry2 - hh4 - 1.2) / 14;
        var hwS = 4.2 * (1 - t2 * 0.20) + (t2 > 0.60 ? (t2 - 0.60) * 11 : 0);
        return ax <= hwS;
      }
      return false;
    }
    for (y = top; y < bt; y++) for (x = 24; x < 96; x++) if (sil(x, y)) c.put(x, y, ' ', D);
    for (y = top; y < bt; y++) for (x = 24; x < 96; x++) {          // 逆光边缘
      if (sil(x, y)) continue;
      if (!(sil(x - 1, y) || sil(x + 1, y) || sil(x, y - 1) || sil(x, y + 1))) continue;
      c.put(x, y, x < hx3 ? '█' : '▒', x < hx3 ? W : R);
    }
    for (i = 0; i < 14; i++) {
      var hs = hash16(i * 97 + 5);
      c.put(2 + hs % 40, top + 2 + mod((hs >> 4) * 0.02 + e * 0.8, bt - top - 5), '.', hs % 3 ? W : N);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '48 / WHITE OUT', W);
    c.put(c.w - 18, top, 'SHE / STILL THERE', R);
    c.center(bt, 'THE LIGHT DOES NOT / MOVE HER', B);
  }

  // ⑬ 机械爪（MV 105.6–106.4）：黑色爪压在发光的红色齿轮环前面。
  function lu_s7_claw(c, t, top, bt, e) {
    var u = clamp01(e / 0.80);
    luHeat(c, t, top, bt, 1.02);
    luGearRing(c, 66 + u * 5, 17, 22 + u * 3, t * 0.5, N, B);
    luClaw(c, 44 - u * 4, 15 + u * 1.0, 1.05 + u * 0.20, 0.10, 0.46, 1);
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '49 / MACHINE HEART', N);
    c.put(c.w - 20, top, 'CLAW / CLOSED', R);
    c.center(bt, 'THE MACHINE / HAS A HEART', B);
  }

  // ===== 106.40–114.00 十一镜蒙太奇（MV 106.4–114.0 逐帧核对）=====
  //   106.4 机械爪+红齿轮环特写 → 107.6–109.2 剧烈甩镜模糊 → 109.6 红厅全景小剪影
  //   → 110.0 白闪+正面轮盘 → 110.4 "ONE MIND" 字卡 → 110.8 角色站姿 → 111.2 爪特写
  //   → 112.4 竖铁栅 → 113.2 红走廊 → 113.6 齿轮环特写 → 114.0 纯红闪
  // ⚠️ 这段原挂在 96.03–103.51，是「MV t = 歌曲 t + 10.6」的误算，2026-11-05 整体后移 10.6s。
  // 11 个硬切共用一条 7.52s 时间轴，跨 110.00/112.00 都不重置，所以合并成一个场景。

  // 方向字形：给一条斜线挑字符，横段用 '-'、竖段用 '│'、斜段用 '╱╲'。
  // （后面 124s 之后的日轮/星芒还在用，别跟着旧 s7 一起删。）
  function luDirChar(dx, dy) {
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (ay < ax * 0.42) return '-';
    if (ax < ay * 0.42) return '│';
    return (dx * dy > 0) ? '╲' : '╱';
  }

  function luHeat(c, t, top, bt, gain) {
    var x, y, dx, dy, I;
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      // ⚠️ 这里改过三版，教训是同一件事：**红色的面积就是画面的"亮部面积"**。
      //   ① 原式 1.02-0.52dy²-0.12dx² ⇒ 全幅 '▓'，读成"一块红幕布"，黑爪成了贴上去的黑贴纸；
      //   ② 加 ░ 档 + 气流条 ⇒ 变成"粉色云斑"（░ 在 2 倍缩放下就是云）。
      // 定案：热源是**点光**，用 exp 径向衰减——中心一小片亮，其余迅速落到黑，
      // 背景大部分是黑的，黑爪才有"从暗里伸出来"的感觉，也才像 MV 的暗场。
      dx = (x - 60) / 60; dy = (y - 17.5) / 13.5;
      var rr = Math.sqrt(dx * dx + dy * dy);
      var cur = 0.10 * Math.sin(x * 0.19 + t * 1.7) + 0.07 * Math.sin(x * 0.07 - t * 0.9);
      I = (gain || 1) * (0.94 * Math.exp(-rr * rr * 3.2) + 0.10)
        + cur * Math.max(0, 1 - rr * 0.6)
        + ((hash16(x * 13 + y * 19) % 100) / 100 - 0.5) * 0.05;
      if (I > 0.80) c.put(x, y, '█', R);
      else if (I > 0.52) c.put(x, y, '▓', R);
      else if (I > 0.28) c.put(x, y, '▒', R);
      else if (I > 0.13 && hash16(x * 7 + y * 31) % 100 < 58) c.put(x, y, '░', R);
      else if (hash16(x * 7 + y * 31) % 100 < 20) c.put(x, y, '·', R);
    }
  }

  // 红色齿轮环：环体 + 内辐条 + 外圈齿。本段贯穿的视觉母题。
  function luGearRing(c, cx, cy, rad, spin, body, tooth) {
    var i, a, rr;
    for (i = 0; i < 200; i++) {
      a = i / 200 * TAU;
      for (rr = rad * 0.80; rr <= rad; rr += 0.45)
        c.put(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr / 2, rr > rad * 0.92 ? '█' : '▓', body || N);
    }
    for (i = 0; i < 28; i++) {
      a = i / 28 * TAU + spin;
      for (rr = rad; rr < rad * 1.11; rr += 0.6)
        c.put(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr / 2, '█', tooth || B);
    }
    if (rad > 6) for (i = 0; i < 8; i++) {
      a = i / 8 * TAU + spin;
      c.line(cx, cy, cx + Math.cos(a) * rad * 0.80, cy + Math.sin(a) * rad * 0.80 / 2, '▒', body || N);
    }
  }

  // 一条锥形刀身：整条擦黑（调色板没有近黑色，黑只能从烧红的底上擦出来），
  // 上缘补一道奶油反光当刃口。
  function luClawBlade(c, x0, y0, x1, y1, w0, w1, rim) {
    var n = Math.max(2, Math.round(Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0) * 4) * 1.5));
    var i, u, px, py, w, h;
    for (i = 0; i <= n; i++) {
      u = i / n; px = x0 + (x1 - x0) * u; py = y0 + (y1 - y0) * u;
      w = w0 + (w1 - w0) * u;
      for (h = -w; h <= w; h += 0.5) c.put(px, py + h, ' ', D);
      // 刃口反光用橙不用奶白：1 格就是 9px，奶白会把刃口糊成一根霓虹灯管。
      if (rim) {
        c.put(px, py - w, '█', N);
        if (u > 0.5) c.put(px, py + w, '▒', R);
      } else c.put(px, py + w, '▒', R);
    }
  }

  // 机械爪：两片锥形刀身成对张开 + 铰接圆盘 + 铆钉。MV 106.4/106.8/111.2 的主体。
  function luClaw(c, cx, cy, sc, ang, spread, rim) {
    var len = 34 * sc, a2, i, rr, a;
    luClawBlade(c, cx, cy,
      cx + Math.cos(ang - spread) * len, cy + Math.sin(ang - spread) * len * 0.36,
      4.6 * sc, 0.9 * sc, rim);
    luClawBlade(c, cx, cy,
      cx + Math.cos(ang + spread) * len * 0.86, cy + Math.sin(ang + spread) * len * 0.46,
      3.8 * sc, 0.9 * sc, rim);
    rr = 5.2 * sc;
    for (a = 0; a < TAU; a += 0.05) {
      c.put(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr / 2, ' ', D);
      c.put(cx + Math.cos(a) * rr * 0.62, cy + Math.sin(a) * rr * 0.62 / 2, ' ', D);
      c.put(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr / 2 + 0.55, '▓', R);
    }
    for (i = 0; i < 5; i++) {
      a2 = i / 5 * TAU + ang;
      c.put(cx + Math.cos(a2) * rr * 0.8, cy + Math.sin(a2) * rr * 0.8 / 2, '●', R);
    }
  }

  // 正面轮盘（白闪里那个辐条轮）
  function luWheel(c, cx, cy, rad, spin, st) {
    var i, a;
    for (i = 0; i < 190; i++) {
      a = i / 190 * TAU;
      c.put(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad / 2, '█', st);
      c.put(cx + Math.cos(a) * rad * 0.70, cy + Math.sin(a) * rad * 0.70 / 2, '▓', st);
    }
    for (i = 0; i < 12; i++) {
      a = i / 12 * TAU + spin;
      c.line(cx, cy, cx + Math.cos(a) * rad * 0.70, cy + Math.sin(a) * rad * 0.70 / 2, '▓', st);
    }
    c.put(cx, cy, '●', st);
  }

  // 字卡：TITLE_FONT 放大画（c.big 只有 1 倍，5 行高的字压不住满屏）
  function luBigWord(c, text, y0, sx, sy, st, topSt) {
    var total = text.length * 6 * sx - sx, left = Math.round((c.w - total) / 2);
    for (var i = 0; i < text.length; i++) {
      var g = TITLE_FONT[text.charAt(i)] || TITLE_FONT[' '];
      for (var gy = 0; gy < g.length; gy++) for (var gx = 0; gx < g[gy].length; gx++) {
        if (g[gy].charAt(gx) !== '1') continue;
        for (var yy = 0; yy < sy; yy++) for (var xx = 0; xx < sx; xx++)
          c.put(left + (i * 6 + gx) * sx + xx, y0 + gy * sy + yy, '█',
                gy === 0 && topSt ? topSt : st);
      }
    }
  }

  // 甩镜：一团暗影横扫过画面，拖影用横向断线。MV 107.6–109.2 全是这种帧。
  function luWhip(c, t, top, bt, u) {
    luHeat(c, t, top, bt, 1.02);
    // 1.9s 只扫一遍太拖：按 2.4 个来回切，速度才像甩镜（MV 这条有 4 个不同机位的模糊帧）
    var ph = (u * 2.4) % 1;
    var mx = (Math.floor(u * 2.4) % 2 ? 190 - ph * 224 : -34 + ph * 190),
        my = 15 + Math.sin(u * 6.2) * 5.5, x, y, d, i, x0;
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      d = Math.abs(x - mx) / (30 + 8 * Math.sin(u * 9)) + Math.abs(y - my) / 8.5;
      if (d < 0.86) c.put(x, y, ' ', D);
      else if (d < 1.25 && hash16(x * 17 + y * 7) % 100 < 40) c.put(x, y, '·', R);
    }
    for (i = 0; i < 22; i++) {
      var yy = my + (hash16(i * 71 + 3) / 65535 - 0.5) * 16;
      x0 = mx - 8 - (hash16(i * 13 + 91) / 65535) * 26;
      for (x = x0; x < x0 + 10; x++)
        if (hash16(i * 31 + Math.round(x)) % 100 < 55) c.put(x, yy, '─', R);
    }
  }

  // 红厅全景：左侧大齿轮 / 右侧立柱横梁 / 中间一个持镰的小小身影（MV 109.6）。
  function luLinkHall(c, t, top, bt, k) {
    luHeat(c, t, top, bt, 0.84);
    var y, x, gy = 25, w;
    for (x = 1; x < c.w - 1; x++) {
      c.put(x, gy, '─', hash16(x * 91 + 5) % 100 < 70 ? R : N);
      for (y = gy + 1; y < bt; y++)
        if (hash16(x * 7 + y * 23) % 100 < 26 - (y - gy) * 3) c.put(x, y, '·', R);
    }
    luGearRing(c, 21, 14, 12.5, t * 0.22, N, B);
    for (y = top; y < gy; y++) {
      for (x = 97; x < 107; x++) c.put(x, y, ' ', D);
      c.put(96, y, '▓', R);
    }
    for (y = top; y < 11; y++) for (x = 52; x < 112; x++)
      if (hash16(x * 3 + y * 11) % 100 < 52) c.put(x, y, '═', R);
    w = 15 * (k || 1);
    c.queen = { x: 60 - w / 2, y: luActorY(w, gy - 0.6, window.__LU_QUEEN_ANSI), width: w, t: t, reveal: 1 };
  }

  // 白闪 + 正面轮盘（MV 110.0）。整屏白只许 0.4s，久一点就是过曝。
  // 白闪（MV 109.8）：整屏过曝，中心只留一团还没褪掉的红。
  // ⚠️ 这里踩了两版：
  //   ① 「纯白 + 轮辐 + 四角 ▒ N」⇒ 白纸上印了枚红甜甜圈，四角还蹭了灰；
  //   ② 「纯白 + ▓/▒/░ 渐层」⇒ **整片发黑**：░▒▓ 是半透明字符，白底上会透出黑底，
  //      于是橙 ▓ 变成棕色方块、橙 ░ 变成黑点，光斑直接读成一块发霉的褐斑。
  // 定案：白底上只能用**实心不透明**的字符造型 —— 白闪里除了红芯什么都没有，
  // 所以红芯/橙圈/星芒全部用 █，靠颜色分层，不靠字符密度分层。
  function luLinkFlash(c, t, top, bt, u) {
    var x, y, i, r, d, dd, gx, gy, a, sd = Math.round(t * 12);
    var k = 1 - u * 0.26;                                  // 闪光在衰减，红芯跟着收
    if (u > 0.62) {                                        // 尾段：白已经吃掉全部，纯白一帧
      for (y = top; y < bt; y++) for (x = 0; x < c.w; x++) c.put(x, y, '█', W);
      return;
    }
    for (y = top; y < bt; y++) for (x = 0; x < c.w; x++) c.put(x, y, '█', W);
    for (i = 0; i < 8; i++) {                              // 过曝星芒：8 道实心短芒
      a = i / 8 * TAU + t * 0.5;
      for (r = Math.round(11 * k); r < 34; r++) {
        gx = Math.round(60 + Math.cos(a) * r); gy = Math.round(17 + Math.sin(a) * r / 2);
        if (gx < 1 || gx > c.w - 2 || gy < top + 1 || gy > bt - 1) continue;
        if (r > 20 && hash16(gx * 7 + gy * 11 + i * 31) % 100 < 42) continue;
        c.put(gx, gy, '█', N);
      }
    }
    for (y = top; y < bt; y++) for (x = 0; x < c.w; x++) {
      d = Math.sqrt((x - 60) * (x - 60) + ((y - 17) * 2) * ((y - 17) * 2));
      dd = d / (11 * k);
      if (dd < 0.52) c.put(x, y, '█', hash16(x * 7 + y * 13 + sd) % 100 < 74 ? R : N);
      else if (dd < 0.78) c.put(x, y, '█', N);
      else if (dd < 1.00) { if (hash16(x * 11 + y * 7 + sd) % 100 < 46) c.put(x, y, '█', N); }
    }
  }

  function luOneMind(c, t, top, bt) {
    var x, y, flick = mod(t * 2.7, 1) < 0.09;
    for (y = top; y < bt; y++) for (x = 0; x < c.w; x++) c.put(x, y, ' ', D);
    // 顶面受光用橙不用 G：G 是暗芥末，在黑卡上读成"字顶沾了一圈泥"。
    luBigWord(c, 'ONE MIND', 13, 2, 2, flick ? W : R, flick ? W : N);
    luBigWord(c, 'AND ONE FORGOTTEN', 25, 1, 1, B);
    // 一条自上而下的扫掠高光：字卡本来要"定住"，但整 10 帧一模一样会被当成渲染卡死
    var sy2 = top + mod(t * 2.6, 1) * (bt - top), sx2;
    for (sy2 = Math.max(top, Math.floor(sy2) - 1); sy2 < Math.min(bt, Math.floor(top + mod(t * 2.6, 1) * (bt - top)) + 2); sy2++)
      for (sx2 = 1; sx2 < c.w - 1; sx2++)
        if (c.cells[sy2] && c.cells[sy2][sx2][1] === R && c.cells[sy2][sx2][0] === '█')
          c.put(sx2, sy2, '█', W);
    var sd2 = Math.round(t * 20);      // 金星要逐帧换位，扫掠高光走过空档时画面才不会连拍重复
    for (y = top; y < bt; y++) for (x = 0; x < c.w; x++)
      if (hash16(x * 9 + y * 5 + sd2) % 100 < 9) c.put(x, y, '·', R);
  }

  // 角色站姿（MV 110.8）：她站在烧红的机械结构前，两只爪在身侧张开。
  function luLinkPose(c, t, top, bt, k) {
    luHeat(c, t, top, bt, 1.0);
    luClaw(c, 122, 24, 1.05, Math.PI + 0.30, 0.42, 0);
    luClaw(c, -4, 6, 1.0, -0.34, 0.42, 1);
    var w = 25 * (k || 1);
    c.queen = { x: 61 - w / 2, y: luActorY(w, 27, window.__LU_QUEEN_ANSI), width: w, t: t, reveal: 1 };
  }

  // 竖铁栅（MV 112.4）：几根粗黑柱 + 两道横梁，红光从缝里透出来。
  function luBars(c, t, top, bt) {
    luHeat(c, t, top, bt, 0.78);
    var xs = [8, 32, 56, 80, 104], i, y, x, beam;
    for (i = 0; i < xs.length; i++) {
      for (y = top; y < bt; y++) {
        for (x = xs[i]; x < xs[i] + 4; x++) c.put(x, y, ' ', D);
        c.put(xs[i] + 4, y, '▒', R);
        c.put(xs[i] - 1, y, '▓', R);
      }
      for (y = top + 3; y < bt; y += 5) c.put(xs[i] + 1, y, '●', R);
    }
    for (beam = 0; beam < 2; beam++) {
      var by = 9 + beam * 15;
      for (y = by; y < by + 2; y++) for (x = 4; x < c.w - 4; x++)
        if (hash16(x * 7 + y * 5) % 100 < 74) c.put(x, y, ' ', D);
