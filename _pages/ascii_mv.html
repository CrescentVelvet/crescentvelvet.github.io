<!--
  字符演歌播放器（骨架 v1）
  - 渲染：canvas 2D + 字符图集（7 色 × 字符集预渲染，逐格 drawImage）
  - 时钟：AudioContext，播放位置 = offset + (ctx.currentTime - startAt)；
    ⚠️ ctx.currentTime 暂停时照走，不能直接当进度
  - 音频：本地文件选择（版权原因不入库）；?t=38.5 快照模式无需音频
  - 字幕：DOM 叠加层（CJK 宽度交给浏览器），不参与字符网格
  - 数据：assets/data/ascii_mv/{lyrics,spectrum}.js（window.__LYRICS / __SPECTRUM）
  - 场景：table 驱动，已移植 t=38.5 正弦切线 / t=150.5 EXECUTION 两个验证场景，
    其余走 fallback；章节表为近似值，后续对照原作逐段核对
  - 待办：apply_glitch、title_takeover、其余 30+ 场景按时间轴顺序补齐
-->

(function () {

  CCanvas.prototype.centerW = function (y, s, st) {

  CCanvas.prototype.line = function (x1, y1, x2, y2, ch, st) {

  function buildAtlas() {

    for (i = 0; i < EXTRA.length; i++) { ch = EXTRA.charAt(i); if (!set[ch]) { set[ch] = 1; chars.push(ch); } }
    var idx = {}, per = [];
    chars.forEach(function (c, n) { idx[c] = n; });

  function glitchIntensity(t) {
    if (t < 60) return 0.05;
    if (t < 110) return mix(0.05, 0.25, (t - 60) / 50);
    if (t < 110.9) return mix(0.25, 0.6, (t - 110) / 37); // 原作原样（疑 /0.9 笔误，先保真）
    var A = [[110.9, .259], [112.22, .34], [113.1, .43], [114.18, .51], [114.92, .59],

  function applyGlitch(c, t, top, bt, intensity) {
    if (intensity === undefined) intensity = glitchIntensity(t);
    if (intensity < 0.01) return;
    var frame = Math.trunc(t * 24), n = c.w;
    // 行位移
    if (hash16(frame) % 100 < intensity * 30) {
      for (var q = 0; q < Math.trunc(intensity * 5); q++) {
        var row = top + hash16(frame + q * 7) % (bt - top + 1);
        var shift = Math.trunc((hash16(frame + q * 13) % 20 - 10) * intensity);
        if (shift !== 0) {
          var cells = c.cells[row];
          var sh = mod(shift, n);
          c.cells[row] = cells.slice(n - sh).concat(cells.slice(0, n - sh));
        }

    }
    // 色彩腐蚀
    if (hash16(frame + 100) % 100 < intensity * 40) {
      for (q = 0; q < Math.trunc(intensity * 15); q++) {
        var x = hash16(frame + q * 19) % (c.w - 4) + 2;
        var y = top + hash16(frame + q * 23) % (bt - top + 1);

    if (intensity > 0.3) {
      for (var i = 0; i < Math.trunc(intensity * 3); i++) {
        row = top + mod(Math.trunc(t * 17) + i * 31, bt - top + 1);
        for (x = 2; x < c.w - 2; x++) {
          if (hash16(x + frame) % 100 < intensity * 60) {
            if (c.cells[row][x][0] === ' ') c.cells[row][x][0] = '=';
            c.cells[row][x][1] = W;
          }
        }
      }
    }
    // 块腐蚀（后期）
    if (intensity > 0.6) {
      for (q = 0; q < Math.trunc((intensity - 0.6) * 20); q++) {
        x = hash16(frame + q * 31) % (c.w - 10) + 2;
        y = top + hash16(frame + q * 37) % (bt - top - 3);
        var bw = Math.trunc(3 + hash16(q * 41) % 8);
        var bh = Math.trunc(2 + hash16(q * 43) % 4);
        if (hash16(frame + q) % 100 < (intensity - 0.6) * 100) {
          var chars = '█▓▒░#@%$';
          for (var dy = 0; dy < bh; dy++)
            for (var dx = 0; dx < bw; dx++) {

      for (var band = 0; band < 1 + Math.trunc(intensity * 5); band++) {
        row = top + hash16(tk * 7 + band * 41) % (bt - top + 1);
        var start = 2 + hash16(tk + band * 131) % Math.max(1, c.w - 18);
        var length = 3 + Math.trunc(intensity * 14);
        for (var ddx = 0; ddx < length; ddx++) {

        }
      }
      if (intensity > 0.4) {
        row = top + hash16(tk * 17) % (bt - top);
        var srcRow = c.cells[row].slice();
        var gsh = 2 + Math.trunc(intensity * 5);
        for (x = 2; x < c.w - gsh - 2; x++) {

  function phosphor(c, t, top, bt) {
    var intensity = glitchIntensity(t);
    if (hash16(Math.trunc(t * 10)) % 100 < intensity * 50) {
      var row = top + mod(Math.trunc(t * 9), Math.max(1, bt - top + 1));
      if (row < c.h) {
        for (var x = 2; x < c.w - 2; x++) {
          var cell = c.cells[row][x];
          if (cell[0] !== ' ' && cell[0] !== '' && (cell[1] === D || cell[1] === N || cell[1] === G))
            cell[1] = cell[1] === G ? N : B;

  var TITLE_INK = null;
  function titlePixels(w, h) {
    if (TITLE_INK) return TITLE_INK;

    var total = lineH * 2 + 3;
    var top = Math.max(3, Math.floor((h - total) / 2) - 1);
    var ink = [];

    for (var li = 0; li < 2; li++) {

          parts.push((TITLE_FONT[text.charAt(ci)] || TITLE_FONT[' '])[row]);
        bitmap.push(parts.join('0'));

            c.put(x, yBot, phase > 0.7 ? '=' : '-', phase > 0.8 ? W : B);
          }
        var xLeft = Math.trunc(phase * w / 2), xRight = w - 1 - xLeft;
        for (y = 0; y < h; y++)
          if (hash16(y + i * 7) % 3 === 0) {

            c.put(xRight, y, '|', phase > 0.8 ? W : B);

        }

    var phase = elapsed * 3.1;
    var trails = [1, 0], i, sample;
    for (var ti = 0; ti < 2; ti++) {
      var trail = trails[ti], previous = null;
      for (sample = 0; sample < left_span * 3 + 1; sample++) {
        var xx = l + 1 + sample / 3;
        var yy = cy - Math.cos((xx - l - 1) / left_span * TAU * 2 - phase + trail * 0.13) * amplitude;
        if (previous) c.line(previous[0], previous[1], xx, yy, trail ? ':' : '.', trail ? G : N);
        previous = [xx, yy];
      }
    }
    var dc_progress = clamp01((t - 45.85) / 1.10);
    var edge = Math.trunc(mix(r, cx + 1, dc_progress));
    var low = Math.trunc(cy + amplitude), high = Math.trunc(cy - amplitude);
    if (edge > cx + 1) c.line(cx + 1, low, edge, low, ':', N);
    if (edge < r) {
      c.line(edge, high, r, high, ':', B);
      if (dc_progress < 1) {
        c.line(edge, low, edge, high, '|', G);
        c.put(edge, high, '+', W);
      }
    }
    c.line(cx, top, cx, bt - 1, '|', B);
    c.put(cx, top, '+', W);
    c.put(cx, bt - 1, '+', B);
    var glyphs = {
      A: ['01110', '11011', '11111', '11011', '11011'],
      C: ['01111', '11000', '11000', '11000', '01111'],
      D: ['11110', '11011', '11011', '11011', '11110']
    };
    var sx = Math.max(1, Math.min(3, Math.floor(c.w / 60)));
    var sy = Math.max(1, Math.min(3, Math.floor((bt - top) / 12)));
    var label_w = 11 * sx, label_h = 5 * sy;
    var label_y = cy - Math.floor(label_h / 2);
    function acdcLabel(x, text, ink) {
      wipeK(c, x - 1, label_y - 1, label_w + 2, label_h + 2);
      for (var index = 0; index < text.length; index++) {
        var rows = glyphs[text.charAt(index)];
        for (var dy = 0; dy < rows.length; dy++)
          for (var dx = 0; dx < rows[dy].length; dx++)
            if (rows[dy].charAt(dx) === '1')
              for (var yl = 0; yl < sy; yl++)
                c.put(x + (index * 6 + dx) * sx, label_y + dy * sy + yl, '#'.repeat(sx), ink);
      }
    }
    acdcLabel(l + 2, 'AC', t < 46.45 ? W : B);
    acdcLabel(Math.floor((cx + r) / 2) - Math.floor(label_w / 2), 'DC', t >= 45.85 ? W : N);
    c.centerW(bt, 'to AC, to DC', B);
  }

  // 47.672–51.363：致盲眩晕（满眼 + 螺旋 + 巨眼）
  function sceneDizzy(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) >> 1, cy = (top + bt) >> 1;
    var progress = clamp01(elapsed / 3.5);
    var i, ring, x, y;
    if (elapsed < 1) {
      var phase1 = elapsed / 1.0;
      var num_eyes = Math.trunc(phase1 * 30) + 5;
      for (i = 0; i < num_eyes; i++) {
        var angle = i * TAU / 30 + hash16(i * 13) * 0.01;
        var eradius = hash16(i * 17) % Math.floor(Math.min(r - l, bt - top) / 3) + 10;
        var ex = cx + Math.cos(angle) * eradius;
        var ey = cy + Math.sin(angle) * eradius * 0.5;
        var blink_phase = (elapsed * 3 + i * 0.3) % 1.0;
        if (blink_phase < 0.7) {
          c.put(ex - 1, ey, '(', N);
          c.put(ex, ey, '○', i === num_eyes - 1 ? W : B);
          c.put(ex + 1, ey, ')', N);
        } else if (blink_phase < 0.85) {
          c.put(ex - 1, ey, '(', G);
          c.put(ex, ey, '-', B);
          c.put(ex + 1, ey, ')', G);
        }
      }
      c.centerW(top + 2, 'VISION', phase1 > 0.7 ? W : B);
    } else if (elapsed < 2) {
      var phase2 = (elapsed - 1) / 1.0;
      for (ring = 0; ring < 20; ring++) {
        var ring_radius = ring * 4 + phase2 * 20;
        var points_in_ring = Math.max(8, ring * 2);
        for (i = 0; i < points_in_ring; i++) {
          var a2 = i * TAU / points_in_ring + elapsed * 2 - ring * 0.3;
          x = cx + Math.cos(a2) * ring_radius;
          y = cy + Math.sin(a2) * ring_radius * 0.5;
          if (l < x && x < r && top < y && y < bt) {
            if (i % 3 === 0) c.put(x, y, '◉', ring < 5 ? W : ring < 12 ? B : N);
            else c.put(x, y, '·', N);
          }
        }
      }
      var num_center = Math.trunc(phase2 * 8) + 1;
      for (i = 0; i < num_center; i++) {
        var eye_x = cx + Math.trunc(Math.sin(elapsed * 4 + i) * 25);
        var eye_y = cy + Math.trunc(Math.cos(elapsed * 3 + i * 0.7) * 10);
        var iris = Math.trunc(Math.sin(elapsed * 5 + i) * 2);
        c.put(eye_x - 2, eye_y, '(', B);
        c.put(eye_x - 1 + iris, eye_y, '●', i % 3 === 0 ? R : W);
        c.put(eye_x + 2, eye_y, ')', B);
      }
      c.centerW(cy - Math.trunc((bt - top) * 0.3), 'DIZZY', mod(Math.trunc(elapsed * 6), 2) ? W : B);
    } else {
      var phase3 = (elapsed - 2) / 1.5;
      var wave_intensity = phase3 * 8;
      var row, col;
      for (row = top + 2; row < bt - 2; row += 2)
        for (col = l + 3; col < r - 3; col += 8) {
          var wave_x = Math.trunc(Math.sin(row * 0.2 + elapsed * 3) * wave_intensity);
          var wave_y = Math.trunc(Math.cos(col * 0.15 + elapsed * 2.5) * wave_intensity * 0.5);
          x = col + wave_x; y = row + wave_y;
          if (l + 2 < x && x < r - 2 && top + 1 < y && y < bt - 1) {
            var dx = x - cx, dy = (y - cy) * 2;
            var dist = Math.hypot(dx, dy);
            var pupil_dir = Math.trunc(Math.sin(dist * 0.1 + elapsed * 4));
            if (dist < 20) {
              if (hash16(row + col) % 4 === 0) {
                c.put(x - 2, y, '(', W);
                c.put(x - 1 + pupil_dir, y, '●', R);
                c.put(x + 2, y, ')', W);
              }
            } else if (dist < 50) {
              if (hash16(row * 7 + col * 11) % 3 === 0) {
                c.put(x - 1, y, '(', B);
                c.put(x + pupil_dir, y, '○', mod(Math.trunc(elapsed * 8), 3) === 0 ? W : B);
                c.put(x + 1, y, ')', B);
              }
            } else {
              if (hash16(row * 13 + col * 17) % 5 === 0)
                c.put(x, y, hash16(row + col + Math.trunc(elapsed * 10)) % 2 ? '◉' : '○', dist > 80 ? N : G);
            }
          }
        }
      if (phase3 > 0.3) {
        var blink = (elapsed * 2) % 1.0;
        if (blink < 0.6) {
          var eye_size = Math.trunc(8 + Math.sin(elapsed * 5) * 2);
          for (i = 0; i < eye_size; i++) {
            c.put(cx - eye_size + i, cy - 2, i % 2 ? '-' : '_', W);
            c.put(cx + i, cy - 2, i % 2 ? '-' : '_', W);
            c.put(cx - eye_size + i, cy + 2, i % 2 ? '_' : '-', W);
            c.put(cx + i, cy + 2, i % 2 ? '_' : '-', W);
          }
          c.put(cx - 1, cy, '(', B);
          c.put(cx, cy, '●', mod(Math.trunc(elapsed * 4), 2) ? R : W);
          c.put(cx + 1, cy, ')', B);
        } else {
          for (i = 0; i < 16; i++) c.put(cx - 8 + i, cy, i % 2 ? '=' : '-', B);
        }
      }
      if (phase3 > 0.5) {
        var messages = ['VISION', 'BLINDED', 'DIZZY', 'EYES', 'SEEING', 'BLIND'];
        for (i = 0; i < messages.length; i++) {
          var msg_x = cx + Math.trunc(Math.sin(elapsed * 3 + i) * 40);
          var msg_y = cy + Math.trunc(Math.cos(elapsed * 2.5 + i * 0.8) * 15);
          if (top + 2 < msg_y && msg_y < bt - 2) {
            var msg = messages[i], distorted = '';
            for (var j = 0; j < msg.length; j++)
              distorted += hash16(j * 19 + Math.trunc(elapsed * 10)) % 4 > 0
                ? msg.charAt(j) : String.fromCharCode(33 + hash16(j * 23 + i) % 94);
            c.centerW(msg_y, distorted.slice(0, 10),
                      i === mod(Math.trunc(elapsed * 3), messages.length) ? W : i % 2 ? B : N);
          }
        }
      }
      if (phase3 > 0.9 && mod(Math.trunc(elapsed * 12), 3) === 0)
        c.centerW(cy, 'BLIND', W);
    }
  }

  // 51.363–55.083：时间线光束从 AD 扫到 BC
  function sceneTimeTravel(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) >> 1, cy = (top + bt) >> 1;
    var progress = clamp01(elapsed / 3.7);
    var timeline_y = cy;
    var x, i;
    for (x = l + 5; x < r - 5; x++) c.put(x, timeline_y, '─', x % 2 ? B : N);
    var num_markers = 10;
    var marker_spacing = Math.floor((r - l - 20) / num_markers);
    var tick_y, label, year_offset;
    for (i = 0; i < num_markers; i++) {
      var marker_x = l + 10 + i * marker_spacing;
      for (tick_y = -3; tick_y <= 3; tick_y++) {
        if (Math.abs(tick_y) === 3) c.put(marker_x, timeline_y + tick_y, '|', i % 2 ? G : N);
        else if (Math.abs(tick_y) === 2) c.put(marker_x, timeline_y + tick_y, '│', G);
      }
      year_offset = (i - num_markers / 2) * 500;
      if (year_offset > 0) {
        label = Math.abs(year_offset) + 'AD';
        c.centerW(timeline_y - 5, label, marker_x < r - 20 ? Y : W);
        c.put(marker_x - Math.floor(label.length / 2), timeline_y - 5, label, B);
      } else if (year_offset < 0) {
        label = Math.abs(year_offset) + 'BC';
        c.centerW(timeline_y - 5, label, marker_x > l + 20 ? Y : W);
        c.put(marker_x - Math.floor(label.length / 2), timeline_y - 5, label, B);
      } else {
        c.put(marker_x - 1, timeline_y - 5, '0', W);
      }
    }
    var beam_x = Math.trunc(mix(r - 10, l + 10, progress));
    var y;
    for (y = top + 2; y < bt - 2; y++) {
      var intensity = 1.0 - Math.abs(y - cy) / (bt - top) * 2;
      if (intensity > 0.7) c.put(beam_x, y, '│', W);
      else if (intensity > 0.4) c.put(beam_x, y, '┊', B);
      else c.put(beam_x, y, ':', N);
      var glow_offsets = [-2, -1, 1, 2];
      for (var gi = 0; gi < 4; gi++) {
        var gx = beam_x + glow_offsets[gi];
        if (l < gx && gx < r && top < y && y < bt) {
          if (Math.abs(glow_offsets[gi]) === 1) c.put(gx, y, '░', intensity > 0.5 ? B : N);
          else c.put(gx, y, '·', N);
        }
      }
    }
    if (progress > 0.2) {
      for (var particle_i = 0; particle_i < 30; particle_i++) {
        var particle_phase = (elapsed * 2 + particle_i * 0.3) % 1.0;
        var px = beam_x + Math.trunc((particle_phase - 0.5) * 60);
        var py = top + 5 + (particle_i * 7) % (bt - top - 10);
        if (l < px && px < r && top < py && py < bt) {
          if (particle_phase < 0.2 || particle_phase > 0.8)
            c.put(px, py, '*', particle_phase < 0.1 ? W : B);
          else c.put(px, py, '·', N);
        }
      }
    }
    if (progress > 0.1) {
      var current_year = Math.trunc(mix(2000, -2000, progress));
      var year_label = Math.abs(current_year) + (current_year > 0 ? 'AD' : current_year < 0 ? 'BC' : '');
      var label_x = beam_x - Math.floor(year_label.length / 2);
      if (l + 5 < label_x && label_x < r - 15)
        c.put(label_x, top + 3, year_label, mod(Math.trunc(elapsed * 4), 2) ? W : Y);
    }
    if (progress < 0.3) c.centerW(top + 1, 'FUTURE → PAST', B);
    else if (progress < 0.7) c.centerW(top + 1, 'TIME TRAVEL', mod(Math.trunc(elapsed * 3), 2) ? W : B);
    else c.centerW(top + 1, 'ANCIENT ERA', W);
    if (progress > 0.3) {
      for (var line_i = 0; line_i < 15; line_i++) {
        var line_y = top + 5 + line_i * Math.floor((bt - top - 10) / 15);
        var line_phase = (elapsed * 3 + line_i * 0.1) % 1.0;
        var line_length = Math.trunc(line_phase * 20) + 5;
        for (var lx = Math.max(l + 5, beam_x + 10); lx < Math.min(r - 5, beam_x + 10 + line_length); lx++)
          if (hash16(line_i * 17 + Math.floor(lx / 3)) % 4 === 0)
            c.put(lx, line_y, line_phase > 0.7 ? '=' : '-', line_phase > 0.5 ? B : N);
      }
    }
    if (progress > 0.8) {
      var dest_x = l + 15;
      c.put(dest_x, timeline_y - 2, '▼', R);
      c.put(dest_x - 2, timeline_y - 3, 'BC', R);
      if (progress > 0.95) {
        var flash_radius = Math.trunc((progress - 0.95) * 60);
        for (var angle_i = 0; angle_i < 12; angle_i++) {
          var fa = angle_i * TAU / 12;
          var fx = dest_x + Math.trunc(Math.cos(fa) * flash_radius);
          var fy = timeline_y + Math.trunc(Math.sin(fa) * flash_radius * 0.5);
          if (l < fx && fx < r && top < fy && fy < bt)
            c.put(fx, fy, '*', flash_radius < 10 ? W : B);
        }
      }
    }
  }

  // 55.083–59.223：ME/YOU 双圆靠近合一
  function sceneUniteDeeply(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) >> 1, cy = (top + bt) >> 1;
    var progress = clamp01(elapsed / 1.8);
    var sep = mix(40, 0, progress);
    var sides = [[-1, 'ME'], [1, 'YOU']];
    for (var si = 0; si < 2; si++) {
      var side = sides[si][0], label = sides[si][1];
      var center_x = cx + side * sep;
      for (var i = 0; i < 60; i++) {
        var angle = i * TAU / 60 + t * side * 0.2;
        c.put(center_x + Math.cos(angle) * 15, cy + Math.sin(angle) * 15 * 0.5,
              progress > 0.7 && sep < 5 ? '@' : progress > 0.4 ? '*' : '.',
              progress > 0.8 ? W : progress > 0.5 ? B : N);
      }
      if (sep > 10) c.put(center_x, cy - 2, label, B);
    }
    if (progress > 0.7) c.centerW(cy, 'UNIFIED', W);
  }

  // 路由与原作 draw_scene 一致；emap = 原作对 elapsed 的特殊处理
  // （power_line 提前 0.1s 开始；1.74–2.92 冻结在末态；lay_pieces/data_parameters 跨歌词段连续计时）
  var SCENES = [
    { a: 0, b: 1.74, f: scenePowerLine, emap: function (t) { return t - 0.1; } },

    { a: 44.452, b: 47.672, f: sceneAcDc },
    { a: 47.672, b: 51.363, f: sceneDizzy },
    { a: 51.363, b: 55.083, f: sceneTimeTravel },
    { a: 55.083, b: 59.223, f: sceneUniteDeeply },

  ];
  function sceneAt(t) {
    for (var i = 0; i < SCENES.length; i++)
      if (t >= SCENES[i].a && t < SCENES[i].b) return SCENES[i];
    return { f: sceneFallback, a: t };

  /* ---------------- 版面 chrome ---------------- */
  // 与原作 player.py CHAPTERS 一致（5 章）
  var CHAPTERS = [
    [0, '01 / CREATION'], [29.709, '02 / DEVOTION'], [110.9, '03 / ISOLATION'],
    [125.708, '04 / EXECUTION'], [177.246, '05 / LOVE']
  ];
  function chapterAt(t) {
    var s = '';
    for (var i = 0; i < CHAPTERS.length; i++) if (t >= CHAPTERS[i][0]) s = CHAPTERS[i][1];
    return s;
  }
  // 与原作 clock 一致：int() 截断（toFixed 会四舍五入，15.799 应是 :15.7 而非 :15.8）
  function fmtT(t) {
    var m = Math.floor(Math.trunc(t) / 60), s = Math.trunc(t) % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s + '.' + (Math.trunc(t * 10) % 10);
  }
  // 与原作 render() 的版面逐行一致（divider 从 x=2 起、状态行、章节 NORMAL、提示行）
  function drawChrome(c, t, playing, snap) {
    c.put(2, 0, 'WORLD.EXECUTE(ME);', B);

    var right = fmtT(t) + ' / 03:32  ' + state;
    c.put(c.w - right.length - 2, 0, right, D);

    for (var i = 0; i < c.w - 4; i++) div += '-';
    c.put(2, 1, div, D);

  // 与原作一致：80 列居中、._:=| 五档、pyRound(amp*4)、DIM
  function drawSpectrum(c, t) {
    var sp = window.__SPECTRUM;
    if (!sp) return;
    var fi = Math.min(sp.frames.length - 1, Math.max(0, Math.trunc(t * sp.fps)));
    var fr = sp.frames[fi], cols = Math.min(80, c.w - 8), start = Math.floor((c.w - cols) / 2);
    var sy = c.h - 6;
    for (var i = 0; i < cols; i++) {
      var amp = fr[Math.trunc(i * sp.bands / cols)];
      c.put(start + i, sy, '._:=|'.charAt(Math.min(4, pyRound(amp * 4))), D);
    }
  }

  /* ---------------- 网格字幕（title 源帧用，与原作 wrap/crop 一致） ---------------- */
  function cropStr(s, n) {
    var out = '', used = 0;
    for (var i = 0; i < s.length; i++) {
      var k = isWide(s.charAt(i)) ? 2 : 1;
      if (used + k > n) break;
      out += s.charAt(i); used += k;
    }
    return out;
  }
  function wrapStr(s, n) {
    if (dw(s) <= n) return [s];
    var parts = [];
    var ascii = !isWide(s.replace(/[^\u2e80-\uffff]/g, '') || '') && /^[\x00-\xff]*$/.test(s);
    while (s) {
      var line = cropStr(s, n);
      if (line.length < s.length && line.indexOf(' ') >= 0 && /^[\x00-\x7f]*$/.test(s))
        line = line.slice(0, line.lastIndexOf(' '));
      if (!line) break;
      parts.push(line);
      s = s.slice(line.length).replace(/^\s+/, '');
    }
    return parts;
  }
  function cueAt(tt) { // bisect_right(times, tt) - 1：不看 end，最后一个 time<=tt
    for (var i = LYRICS.length - 1; i >= 0; i--) if (LYRICS[i].time <= tt) return LYRICS[i];
    return null;
  }
  function drawSubsIntoGrid(c, tt) {
    var e = cueAt(tt);
    if (e) {
      var ens = wrapStr(e.en, c.w - 8).slice(0, 2);
      var zhs = wrapStr(e.zh, c.w - 8).slice(0, 2);
      for (var i = 0; i < ens.length; i++) c.centerW(c.h - 5 + i, ens[i], W);
      for (i = 0; i < zhs.length; i++) c.centerW(c.h - 3 + i, zhs[i], B);
    } else if (tt > 208) {
      c.center(c.h - 5, 'PROCESS ENDED. THE LOOP REMAINS.', W);
    } else {
      c.center(c.h - 5, '[ instrumental ]', D);
      c.center(c.h - 3, '[ 间奏 ]', D);
    }
  }
  // 全帧渲染（正常路径：chrome→场景→glitch→磷光→频谱→字幕），供 title 源帧
  function frameAt(tt) {
    var c = new CCanvas(GW, GH);
    drawChrome(c, tt, false, false); // paused=True 与 dump_frames 参考帧一致
    var sc = sceneAt(tt);
    c.clip = [4, 32];  // 与原作 render 一致：场景/glitch/磷光在 clip 内
    sc.f(c, tt, 4, 32, sc.emap ? sc.emap(tt) : tt - sc.a);
    applyGlitch(c, tt, 4, 32);
    phosphor(c, tt, 4, 32);
    c.clip = null;
    drawSpectrum(c, tt);
    drawSubsIntoGrid(c, tt);
    return c;
  }

  /* ---------------- 字幕（DOM 层） ---------------- */
  var LYRICS = window.__LYRICS || [];
  function lyricAt(t) {
    var lo = 0, hi = LYRICS.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (LYRICS[mid].time <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (ans >= 0 && t < LYRICS[ans].end) return LYRICS[ans];
    return null;
  }
  var elEn = document.getElementById('amv-en'), elZh = document.getElementById('amv-zh');
  var lastLy = -2;
  function updateSubs(t) {
    var e = lyricAt(t);
    var idx = e ? LYRICS.indexOf(e) : -1;
    if (idx === lastLy) return;
    lastLy = idx;
    elEn.textContent = e ? e.en : '';
    elZh.textContent = e ? e.zh : '';
  }

  /* ---------------- 渲染 ---------------- */
  var cvEl = document.getElementById('amv-cv');
  var g2d = cvEl.getContext('2d');
  var grid = new CCanvas(GW, GH);
  function render() {
    g2d.fillStyle = '#000';
    g2d.fillRect(0, 0, GW * CW * SC, GH * CH * SC);
    for (var y = 0; y < GH; y++)
      for (var x = 0; x < GW; x++) {
        var cell = grid.cells[y][x];
        if (cell[0] === ' ' || cell[0] === '') continue;
        var gi = ATLAS.idx[cell[0]];
        if (gi === undefined) gi = ATLAS.miss;
        g2d.drawImage(ATLAS.per[cell[1]], gi * CW * SC, 0, CW * SC, CH * SC,
          x * CW * SC, y * CH * SC, CW * SC, CH * SC);
      }
  }

  /* ---------------- 音频时钟 ---------------- */
  var qs = new URLSearchParams(location.search);
  var SNAP = qs.get('t') !== null ? parseFloat(qs.get('t')) : null;
  var actx = null, buf = null, src = null, startAt = 0, playing = false;
  var offset = SNAP !== null && isFinite(SNAP) ? clamp(SNAP, 0, DUR - 0.05) : 0;
  function now() { return playing ? Math.min(offset + (actx.currentTime - startAt), DUR) : offset; }
  var playBtn = document.getElementById('amv-play');
  function startSrc() {
    src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(actx.destination);
    src.onended = function () { if (playing) { playing = false; offset = DUR; playBtn.textContent = 'PLAY'; } };
    src.start(0, Math.min(offset, DUR - 0.05));
    startAt = actx.currentTime;
  }
  function play() {
    if (!buf || playing) return;
    if (offset >= DUR - 0.05) offset = 0;
    actx.resume();
    startSrc();
    playing = true;
    playBtn.textContent = 'PAUSE';
  }
  function pause() {
    if (!playing) return;
    offset = now();
    src.onended = null;
    try { src.stop(); } catch (e) { }
    playing = false;
    playBtn.textContent = 'PLAY';
  }
  function seekTo(v) {
    var wasPlaying = playing;
    if (playing) pause();
    offset = clamp(v, 0, DUR - 0.05);
    if (wasPlaying) play();
  }
  document.getElementById('amv-file').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var rd = new FileReader();
    rd.onload = function () {
      actx.decodeAudioData(rd.result, function (b) {
        buf = b;
        playBtn.disabled = false;
        play();
      }, function () { document.getElementById('amv-note').textContent = '音频解码失败'; });
    };
    rd.readAsArrayBuffer(f);
  });
  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  document.getElementById('amv-prog').addEventListener('click', function (ev) {
    var rect = this.getBoundingClientRect();
    seekTo((ev.clientX - rect.left) / rect.width * DUR);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.code === 'Space') { ev.preventDefault(); playing ? pause() : play(); }
    else if (ev.key === 'ArrowLeft') seekTo(now() - 5);
    else if (ev.key === 'ArrowRight') seekTo(now() + 5);
    else if (ev.key === 'r' || ev.key === 'R') seekTo(0);
  });

  /* ---------------- 主循环 ---------------- */
  var elFill = document.getElementById('amv-fill'), elTime = document.getElementById('amv-time');
  function tick() {
    var t = now();
    grid.clear();
    if (t >= 15.8 && t < 29.709) {
      // title 接管：无 chrome/字幕；16–18.1s 吸入 t=15.799 的完整源帧
      var source = (t >= 16 && t < 18.1) ? frameAt(15.799) : null;
      sceneTitleTakeover(grid, t, source);
      if (lastLy !== -1) { elEn.textContent = ''; elZh.textContent = ''; lastLy = -1; }
    } else {
      drawChrome(grid, t, playing, SNAP !== null);
      var sc = sceneAt(t);
      grid.clip = [4, 32];
      sc.f(grid, t, 4, 32, sc.emap ? sc.emap(t) : t - sc.a);
      applyGlitch(grid, t, 4, 32);
      phosphor(grid, t, 4, 32);
      grid.clip = null;
      drawSpectrum(grid, t);
      updateSubs(t);
    }
    render();
    elFill.style.width = (t / DUR * 100).toFixed(2) + '%';
    elTime.textContent = fmtT(t) + ' / 03:32';
    requestAnimationFrame(tick);
  }
  buildAtlas();
  // 调试探针（供 CDP 检查网格内容）
  window.__amv = { grid: grid, w: GW, h: GH, now: now, frameAt: frameAt,
                   hash16: hash16, titlePixels: titlePixels, mix: mix, clamp01: clamp01,
                   CCanvas: CCanvas, sceneTitleTakeover: sceneTitleTakeover };
  tick();
})();
</script>
