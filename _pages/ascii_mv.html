  字符演歌播放器（骨架 v1）
  - 渲染：canvas 2D + 字符图集（7 色 × 字符集预渲染，逐格 drawImage）
  - 时钟：AudioContext，播放位置 = offset + (ctx.currentTime - startAt)；
    ⚠️ ctx.currentTime 暂停时照走，不能直接当进度
  - 音频：本地文件选择（版权原因不入库）；?t=38.5 快照模式无需音频
  - 多曲：?song=key（默认 world）+ 页头切换器；SONGS 注册表每歌一份配置
    （标题/艺人/时长/数据目录/chrome 标题/场景路由表/章节表），新增歌曲 =
    注册表加一项 + 独立前缀的场景函数 + assets/data/ascii_mv/<key>/ 数据
  - 字幕：DOM 叠加层（CJK 宽度交给浏览器），不参与字符网格
  - 数据：assets/data/ascii_mv/<key>/{lyrics,spectrum}.js（window.__LYRICS / __SPECTRUM）
    异步 fetch 加载 + 进度条——同步脚本标签在弱网下会阻塞主脚本（PLAY 无响应、黑屏）；
    镜像 jsDelivr gh 优先（GitHub Pages 本机实测仅 ~10KB/s）、同源兜底、卡死自动切换
  - 场景：world.execute(me); 已全曲逐行移植（0–211.933s）；
    Link Up 血火相连（绝区零克拉蕾 EP）移植中，场景未上时全程 fallback 氛围

<script>
(function () {
  'use strict';
  var TAU = Math.PI * 2;
  var GW = 120, GH = 40, CW = 9, CH = 18, SC = 2;   // 网格 / 单元格 / 超采样
  var D = 0, N = 1, B = 2, W = 3, R = 4, G = 5, K = 6, Y = 3;
  var PAL = ['#afaf5f', '#ffaf5f', '#ffd75f', '#ffffd7', '#ff5f5f', '#875f00', '#5f5f00'];
  var DUR = 0;   // 由 SONGS 注册表按 ?song= 注入（见「歌单注册表」一节）

  function clamp(x, a, b) { a = a || 0; b = b === undefined ? 1 : b; return Math.min(b, Math.max(a, x)); }
  function mix(a, b, u) { return a + (b - a) * u; }
  // 与原作 scenes.py 位对齐的确定性 hash
  function hash16(i) {

    v = Math.imul((v ^ (v >>> 16)) >>> 0, 0x7FEB352D) >>> 0;
    v = Math.imul((v ^ (v >>> 15)) >>> 0, 0x846CA68B) >>> 0;
    return (v ^ (v >>> 16)) & 65535;
  }

  function pyRound(x) {
    var f = Math.floor(x), d = x - f;
    if (d > 0.5) return f + 1;
    if (d < 0.5) return f;
    return (f % 2 === 0) ? f : f + 1;

  function mod(a, n) { return ((a % n) + n) % n; }

  function luEase(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

  function dw(s) { var w = 0; for (var i = 0; i < s.length; i++) w += isWide(s.charAt(i)) ? 2 : 1; return w; }

  /* ---------------- 字符网格 ---------------- */
  function CCanvas(w, h) {
    this.w = w; this.h = h;
    this.clip = null;   // 原作 c.clip=(top,bt)：场景段行裁剪
    this.queen = null;
    this.roxy = null;   // 洛克茜·女仆装（第二张 ANSI 角色）
    this.sx = 0; this.sy = 0; // 临时整屏位移（开幕柱锤冲击）
    this.cells = [];
    for (var y = 0; y < h; y++) {
      var row = [];
      for (var x = 0; x < w; x++) row.push([' ', D]);
      this.cells.push(row);
    }

  CCanvas.prototype.clear = function () {
    this.queen = null;
    this.roxy = null;
    for (var y = 0; y < this.h; y++)
      for (var x = 0; x < this.w; x++) { this.cells[y][x][0] = ' '; this.cells[y][x][1] = D; }
  };
  // 与原作 player.py 一致：put 用 int() 截断（不是 round）；CJK 写双宽、次格置 ''
  CCanvas.prototype.put = function (x, y, s, st) {
    x = Math.trunc(x + (this.sx || 0)); y = Math.trunc(y + (this.sy || 0));
    if (y < 0 || y >= this.h) return;
    if (this.clip && !(this.clip[0] <= y && y <= this.clip[1])) return;
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      var k = isWide(ch) ? 2 : 1;
      var xx = x;
      if (xx >= 0 && xx + k <= this.w) {
        this.cells[y][xx][0] = ch;
        this.cells[y][xx][1] = st;
        if (k === 2) { this.cells[y][xx + 1][0] = ''; this.cells[y][xx + 1][1] = st; }
      }
      x += k;
    }
  };
  CCanvas.prototype.center = function (y, s, st) {
    this.put(Math.floor((this.w - s.length) / 2), y, s, st);
  };
  // 显示宽度居中（CJK 双宽），与原作 c.center 一致
  CCanvas.prototype.centerW = function (y, s, st) {
    this.put(Math.floor((this.w - dw(s)) / 2), y, s, st);
  };
  // 与原作 player.py big() 一致：TITLE_FONT 5x5 位图大字，每字 6 列；超宽降级 center(y+2)
  CCanvas.prototype.big = function (y, text, st, ink) {
    text = text.toUpperCase();
    var total = text.length * 6 - 1;
    if (total > this.w - 6) { this.center(y + 2, text, st); return; }
    var left = Math.floor((this.w - total) / 2);
    // ink 缺省仍是 '#'（world 曲的终端质感）；血火这篇要压得住红场，用 '█' 实心。
    var ch = ink || '#';
    for (var i = 0; i < text.length; i++) {
      var glyph = TITLE_FONT[text.charAt(i)] || TITLE_FONT[' '];
      for (var dy = 0; dy < glyph.length; dy++)
        for (var dx = 0; dx < glyph[dy].length; dx++)
          if (glyph[dy].charAt(dx) === '1') this.put(left + i * 6 + dx, y + dy, ch, st);
    }
  };
  // 与原作 scenes.py clear() 一致：空格以 K 色号填充区域（走 put 的 clip/截断语义）
  function clearRect(c, x, y, w, h) {
    var s = '';
    for (var i = 0; i < Math.max(0, Math.trunc(w)); i++) s += ' ';
    for (var yy = Math.trunc(y); yy < Math.trunc(y + h); yy++) c.put(x, yy, s, K);
  }
  // 与原作 f'{v:04X}' 一致
  function hex4(v) {
    var s = (v & 65535).toString(16).toUpperCase();
    return s.length < 4 ? '0000'.slice(s.length) + s : s;
  }
  // 与原作 pulse=sum(energy(t)[:10])/10 一致（energy=帧直接索引，int(t*fps) 夹取）
  function pulseAt(t) {
    var sp = window.__SPECTRUM;
    if (!sp) return 0;
    var fr = sp.frames[Math.min(sp.frames.length - 1, Math.max(0, Math.trunc(t * sp.fps)))];
    var s = 0;
    for (var i = 0; i < 10; i++) s += fr[i];
    return s / 10;
  }
  // 与原作 player.py 一致：参数插值法（1.5x 步数），免疫浮点端点；round=银行家舍入
  CCanvas.prototype.line = function (x1, y1, x2, y2, ch, st) {
    var steps = Math.max(1, Math.floor(Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) * 1.5));
    for (var i = 0; i <= steps; i++) {
      var u = i / steps;
      this.put(pyRound(x1 + (x2 - x1) * u), pyRound(y1 + (y2 - y1) * u), ch, st);
    }
  };

  /* ---------------- 字符图集 ---------------- */
  var FONT = (14 * SC) + 'px "JetBrains Mono","Cascadia Mono",Consolas,monospace';
  var EXTRA = '░▒▓█▄■□▲△►▶▷●○◉◆◯·—─│┌┐└┘╔╗╚╝═║≈~^•←→↑↓∞▼┊π▐▌♀♂⚥╱╲';
  var ATLAS = null;
  function buildAtlas() {
    var set = {}, chars = [], i, ch;
    for (i = 32; i < 127; i++) { ch = String.fromCharCode(i); if (!set[ch]) { set[ch] = 1; chars.push(ch); } }
    for (i = 0; i < EXTRA.length; i++) { ch = EXTRA.charAt(i); if (!set[ch]) { set[ch] = 1; chars.push(ch); } }
    var idx = {}, per = [];
    chars.forEach(function (c, n) { idx[c] = n; });
    for (var p = 0; p < PAL.length; p++) {
      var cv = document.createElement('canvas');
      cv.width = chars.length * CW * SC; cv.height = CH * SC;
      var g = cv.getContext('2d');
      g.font = FONT; g.textBaseline = 'middle'; g.fillStyle = PAL[p];
      chars.forEach(function (c, n) {
        var tw = g.measureText(c).width;
        g.fillText(c, n * CW * SC + (CW * SC - tw) / 2, CH * SC / 2);
      });
      per.push(cv);
    }
    ATLAS = { per: per, idx: idx, miss: idx['?'] };
  }

  /* ---------------- 情绪曲线 / 全局 glitch / 磷光 ---------------- */
  // 与原作 scenes.py 位对齐：每次离开累积损伤，此后的 execution 从不重置
  function glitchIntensity(t) {
    if (t < 60) return 0.05;
    if (t < 110) return mix(0.05, 0.25, (t - 60) / 50);
    if (t < 110.9) return mix(0.25, 0.6, (t - 110) / 37); // 原作原样（疑 /0.9 笔误，先保真）
    var A = [[110.9, .259], [112.22, .34], [113.1, .43], [114.18, .51], [114.92, .59],
             [115.78, .66], [117.274, .73], [125.708, .81], [147.66, .92], [177.246, 1.0]];
    for (var i = 0; i < A.length - 1; i++)
      if (t < A[i + 1][0]) return mix(A[i][1], A[i + 1][1], clamp01((t - A[i][0]) / (A[i + 1][0] - A[i][0])));
    return 1.0;
  }
  function applyGlitch(c, t, top, bt, intensity) {
    // 原作 draw_scene 尾部的排除窗口（scenes.py:3058）：
    // legacy_organic 段与 vibration_sync 段跳过 glitch；192.5s 后 outro 也不跑
    if (t >= 192.5) return;
    if ((t >= 74.045 && t < 85.078) || (t >= 103.489 && t < 110.9)) return;
    if (intensity === undefined) intensity = glitchIntensity(t);
    if (intensity < 0.01) return;
    var frame = Math.trunc(t * 24), n = c.w;
    // 行位移
    if (hash16(frame) % 100 < intensity * 30) {
      for (var q = 0; q < Math.trunc(intensity * 5); q++) {
        var row = top + hash16(frame + q * 7) % (bt - top + 1);
        var shift = Math.trunc((hash16(frame + q * 13) % 20 - 10) * intensity);
        if (shift !== 0) {
          var cells = c.cells[row];
          var sh = mod(shift, n);
          c.cells[row] = cells.slice(n - sh).concat(cells.slice(0, n - sh));
        }
      }
    }
    // 色彩腐蚀
    if (hash16(frame + 100) % 100 < intensity * 40) {
      for (q = 0; q < Math.trunc(intensity * 15); q++) {
        var x = hash16(frame + q * 19) % (c.w - 4) + 2;
        var y = top + hash16(frame + q * 23) % (bt - top + 1);
        c.cells[y][x][1] = intensity > 0.7 ? R : (intensity > 0.4 ? W : B);
      }
    }
    // 扫描线干扰
    if (intensity > 0.3) {
      for (var i = 0; i < Math.trunc(intensity * 3); i++) {
        row = top + mod(Math.trunc(t * 17) + i * 31, bt - top + 1);
        for (x = 2; x < c.w - 2; x++) {
          if (hash16(x + frame) % 100 < intensity * 60) {
            if (c.cells[row][x][0] === ' ') c.cells[row][x][0] = '=';
            c.cells[row][x][1] = W;
          }
        }
      }
    }
    // 块腐蚀（后期）
    if (intensity > 0.6) {
      for (q = 0; q < Math.trunc((intensity - 0.6) * 20); q++) {
        x = hash16(frame + q * 31) % (c.w - 10) + 2;
        y = top + hash16(frame + q * 37) % (bt - top - 3);
        var bw = Math.trunc(3 + hash16(q * 41) % 8);
        var bh = Math.trunc(2 + hash16(q * 43) % 4);
        if (hash16(frame + q) % 100 < (intensity - 0.6) * 100) {
          var chars = '█▓▒░#@%$';
          for (var dy = 0; dy < bh; dy++)
            for (var dx = 0; dx < bw; dx++) {
              if (y + dy < c.h && x + dx < c.w) {
                c.cells[y + dy][x + dx][0] = chars.charAt(hash16(dx + dy * 3) % chars.length);
                c.cells[y + dy][x + dx][1] = hash16(q) % 3 === 0 ? R : W;

            }
        }
      }
    }
    // 110.9s 后持久损伤带 + CRT 鬼影行

      for (var band = 0; band < 1 + Math.trunc(intensity * 5); band++) {
        row = top + hash16(tk * 7 + band * 41) % (bt - top + 1);
        var start = 2 + hash16(tk + band * 131) % Math.max(1, c.w - 18);
        var length = 3 + Math.trunc(intensity * 14);
        for (var ddx = 0; ddx < length; ddx++) {
          var xx = start + ddx;
          if (xx < c.w - 2) c.put(xx, row, '01/:#_'.charAt(hash16(tk + ddx + band) % 6), ddx % 4 ? N : B);
        }
      }
      if (intensity > 0.4) {
        row = top + hash16(tk * 17) % (bt - top);
        var srcRow = c.cells[row].slice();
        var gsh = 2 + Math.trunc(intensity * 5);
        for (x = 2; x < c.w - gsh - 2; x++) {
          var cc = srcRow[x][0];
          if (cc !== ' ' && cc !== '' && hash16(x + tk) % 3 === 0) c.put(x + gsh, row + 1, cc, G);
        }
      }
    }
  }
  // 磷光扫描线（74.045–85.078 的 legacy 版随场景移植时再补）
  function phosphor(c, t, top, bt) {
    // 74.045–85.078：原作走 legacy_phosphor（无条件亮度扫描行），与 scenes.py:3062 一致
    if (t >= 74.045 && t < 85.078) {
      var lrow = top + mod(Math.trunc(t * 9), Math.max(1, bt - top + 1));
      for (var lx = 2; lx < c.w - 2; lx++) {
        var lcell = c.cells[lrow][lx];
        if (lcell[0] !== '' && lcell[0] !== ' ' && (lcell[1] === D || lcell[1] === N || lcell[1] === G))
          lcell[1] = lcell[1] === G ? N : B;
      }
      return;
    }
    var intensity = glitchIntensity(t);
    if (hash16(Math.trunc(t * 10)) % 100 < intensity * 50) {
      var row = top + mod(Math.trunc(t * 9), Math.max(1, bt - top + 1));
      if (row < c.h) {
        for (var x = 2; x < c.w - 2; x++) {
          var cell = c.cells[row][x];
          if (cell[0] !== ' ' && cell[0] !== '' && (cell[1] === D || cell[1] === N || cell[1] === G))
            cell[1] = cell[1] === G ? N : B;
        }
      }
    }
  }

  /* ---------------- 标题接管 title_takeover（15.8–29.709s） ---------------- */

  // 59.223–66.601：感官脉冲驱动 YOU，随后填满足度条（lyric_stimulation_satisfaction 逐行移植）
  function sceneStimSat(c, t, top, bt, elapsed) {

      for (var lane = 0; lane < 3; lane++) {
        y = cy - 5 + lane * 2;

        var filled = Math.trunc(inside * amount);
        c.put(bar_x, y, '[' + '-'.repeat(inside) + ']', N);
        for (var col = 0; col < filled; col++) {
          var scan = mod(col - Math.trunc(t * 26) - lane * 7, Math.max(1, inside));

        }

      }
      c.big(cy + 1, String(percent), full ? W : B);

    var wire_l = left_x + 12, wire_r = right_x - 3, span = wire_r - wire_l;

    var names = ['TOUCH', 'SOUND', 'LIGHT', 'REWARD', 'FEEDBACK'];
    for (var ln = 0; ln < lanes; ln++) {

      for (var packet = 0; packet < 3; packet++) {

            c.put(xx, y, trail === 0 ? '*' : trail < 3 ? '=' : '.', trail === 0 ? W : trail < 3 ? B : G);
        }
        if (phase > 0.88) {
          c.put(wire_r, y, '#', W);
          c.put(right_x + 1, cy + 1, 'ACTIVE', W);
        }
      }
      if (accent)
        for (x = wire_l + 1; x < wire_r; x++)

  // 66.601–70.084：幸福条件喂给自我执行，双侧实时数据（lyric_happy_execution 逐行移植）

        var value = hash16(index * 73 + side * 911);
        var address = (index * 16) & 65535;
        var text;
        if (side === 0) text = hex4(address) + ' ' + hex4(value) + ' ' + hex4(hash16(index * 29));

      for (var ray = 0; ray < 16; ray++) {
        a = ray * TAU / 16 + age * 0.25;
        c.line(display_x + Math.cos(a) * radius * 1.8, cy + Math.sin(a) * radius * 1.1,
               display_x + Math.cos(a) * radius * 2.1, cy + Math.sin(a) * radius * 1.3, '.', G);
      }
    } else {
      for (var star = 0; star < 22; star++) {
        var sx2 = cx + 2 + hash16(star * 31) % Math.max(1, r - cx - 4);
        var sy2 = top + 3 + hash16(star * 79) % Math.max(1, bt - top - 6);
        c.put(sx2, sy2, mod(Math.trunc(age * 5) + star, 5) === 0 ? '+' : '.', G);
      }
    }
    var sx = Math.max(1, Math.min(4, Math.floor((r - cx - 6) / 11)));
    var sy = Math.max(1, Math.min(4, Math.floor((bt - top - 8) / 5)));
    var glyph_w = 11 * sx, glyph_h = 5 * sy, y0 = cy - Math.floor(glyph_h / 2);
    clearRect(c, display_x - Math.floor(glyph_w / 2) - 1, y0 - 1, glyph_w + 2, glyph_h + 2);
    identityBitmap(c, display_x - Math.floor(glyph_w / 2), y0, is_pm ? 'PM' : 'AM', sx, sy, W);
    if (t - flip_at >= 0 && t - flip_at < 0.22) {
      var yy3 = y0 + Math.trunc((t - flip_at) / 0.22 * glyph_h);
      c.put(display_x - Math.floor(glyph_w / 2), yy3, '='.repeat(glyph_w), W);
    }
    var hour2 = Math.trunc(virtual) % 24, minute = Math.trunc((virtual % 1) * 60);
    c.put(display_x - 2, Math.min(bt - 3, y0 + glyph_h + 1),
          String(hour2).padStart(2, '0') + ':' + String(minute).padStart(2, '0'), W);
    c.centerW(bt - 1, is_pm ? '[ PM / NIGHT CYCLE ]' : '[ AM / DAY CYCLE ]', B);
    c.centerW(bt, 'do_whatever();  // AM -> PM', N);
  }

  // 95.465–99.349：S -> M 角色切换（scenes.py lyric_gender_role_switch 逐行移植；
  // dispatch 只调 S->M，F->M 与 AM->PM 分支为死代码未移植）
  function sceneGenderSwitch(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) >> 1, cy = (top + bt) >> 1;
    var progress = clamp01(elapsed / 2.5);
    var row, x, i, a;
    if (progress < 0.5) {
      // S 相位：刚性锐角
      for (row = top; row <= bt; row += 3) {
        for (x = l; x < r; x += 8) {
          var offset = Math.trunc(mod(t * 10 + row, 8));
          var pattern = row % 6 < 3 ? '╱╲' : '╲╱';
          c.put(x + offset, row, pattern.charAt(0), N);
          c.put(x + offset + 1, row, pattern.charAt(1), N);
        }
      }
    } else {
      // M 相位：平滑波纹
      for (var wave_y = 0; wave_y < 12; wave_y++) {
        var y = top + Math.trunc(wave_y * (bt - top) / 11);
        for (x = l; x < r; x++) {
          var wave = (x - l) / (r - l) * TAU * 3 - t * 2;
          var amplitude = (bt - top) * 0.1 * (progress - 0.5) * 2;
          var offset2 = Math.trunc(Math.sin(wave) * amplitude);
          c.put(x, y + offset2, wave_y % 2 === 0 ? '~' : '≈', wave_y % 3 === 0 ? B : N);
        }
      }
    }
    if (progress < 0.4) {
      // S：角状尖刺冠
      var spike_count = 8;
      for (i = 0; i < spike_count; i++) {
        var angle = i * TAU / spike_count + t * 0.5;
        for (var r_step = 0; r_step < 20; r_step++) {
          var spike_r = 15 + r_step * 1.5;
          var spike_x = cx + Math.cos(angle) * spike_r;
          var spike_y = cy + Math.sin(angle) * spike_r * 0.5;
          if (Math.abs(mod(angle, TAU / spike_count)) < 0.2) {
            c.put(spike_x, spike_y, r_step % 2 === 0 ? '▲' : '△',
                  r_step > 15 ? W : r_step > 10 ? B : N);
          }
        }
      }
    } else if (progress < 0.6) {
      // 过渡：爆发
      var trans = (progress - 0.4) / 0.2;
      for (i = 0; i < 80; i++) {
        a = i * TAU / 80;
        var radius = trans * 60;
        x = cx + Math.cos(a) * radius + Math.sin(t * 4 + i) * 5 * (1 - trans);
        var y2 = cy + Math.sin(a) * radius * 0.5 + Math.cos(t * 4 + i) * 3 * (1 - trans);
        c.put(x, y2, i % 3 === 0 ? '*' : '·', trans < 0.5 ? W : B);
      }
    } else {
      // M：柔和同心圆
      var circles = (progress - 0.6) / 0.4;
      for (var ring = 0; ring < 8; ring++) {
        var ring_r = 8 + ring * 4;
        var density = Math.trunc(ring_r * 6);
        var sign = ring % 2 ? -1 : 1;
        for (i = 0; i < density; i++) {
          a = i * TAU / density + t * 0.3 * sign;
          x = cx + Math.cos(a) * ring_r;
          var y3 = cy + Math.sin(a) * ring_r * 0.5;
          c.put(x, y3, ring % 2 === 0 ? '○' : '◯', ring < 3 ? W : ring < 5 ? B : N);
        }
      }
    }
    // 中央大字
    var size = Math.trunc(10 + Math.sin(t * 1.5) * 1.5);
    var center_char = progress < 0.5 ? 'S' : 'M';
    for (var dy = -size; dy <= size; dy++) {
      for (var dx = -size * 2; dx <= size * 2; dx++) {
        var dist = Math.hypot(dx / 2, dy);
        if (size * 0.3 < dist && dist < size * 0.8) {
          c.put(cx + dx, cy + dy, center_char, dist > size * 0.6 ? W : B);
        }
      }
    }
    c.centerW(top, 'S → M', progress > 0.8 ? W : B);
    c.centerW(bt, 'TRANSFORMATION: ' + Math.trunc(progress * 100) + '%', N);
  }

  // 心电 P-QRS-T 描迹采样（scenes.py ecg_sample 逐行移植）
  function ecgSample(phase) {
    var points = [[0, 0], [0.08, 0], [0.12, 0.15], [0.17, 0], [0.28, 0], [0.31, -0.18],
                  [0.35, 1.0], [0.39, -0.32], [0.43, 0], [0.52, 0], [0.60, 0.25], [0.70, 0], [1, 0]];
    phase = mod(phase, 1);
    for (var i = 1; i < points.length; i++) {
      var x1 = points[i][0], y1 = points[i][1], x0 = points[i - 1][0], y0 = points[i - 1][1];
      if (phase <= x1) return mix(y0, y1, (phase - x0) / (x1 - x0));
    }
    return 0;
  }

  // 103.489–110.9：ECG 双通道心率同步（scenes.py lyric_vibration_sync 逐行移植）
  function sceneVibrationSync(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3;
    var compact = bt - top < 19;
    var sync = clamp01((t - 107.22) / (110.221 - 107.22));
    var complete = t >= 110.221;
    var phase_lag = 0.28 * (1 - sync);
    var bpm = 72;
    c.put(l, top, 'ECG / DUAL CHANNEL', B);
    c.put(r - 10, top, String(bpm).padStart(3, '0') + ' BPM', W);
    if (!compact) {
      var title = complete ? 'COMPLETION / RHYTHM LOCKED' : t >= 107.22 ? 'PHASE SYNCHRONIZING' : t >= 106.293 ? 'VIBRATIONS DETECTED' : 'ACQUIRING YOUR HEARTBEAT';
      c.centerW(top + 1, title, complete ? W : N);
    }
    var plot_top = top + (compact ? 2 : 4);
    var plot_bt = bt - (compact ? 1 : 3);
    var split = Math.floor((plot_top + plot_bt) / 2);
    var x0 = l + 1, x1 = r - 1, span = x1 - x0 + 1;
    var speed = span / 2.5;
    var sweep = elapsed * speed + span * 0.30;
    var head = x0 + mod(Math.trunc(sweep), span);
    var gap = Math.max(2, Math.trunc(span * 0.025));
    for (var yy = plot_top; yy <= plot_bt; yy++) {
      for (var xx = x0; xx <= x1; xx++) {
        if (mod(xx - x0, 10) === 0 && mod(yy - plot_top, 3) === 0) c.put(xx, yy, '+', G);
        else if (mod(yy - plot_top, 3) === 0 && mod(xx - x0, 2) === 0) c.put(xx, yy, '.', G);
      }
    }
    for (yy = plot_top; yy <= plot_bt; yy++) c.put(head, yy, ':', G);
    var lanes = [[plot_top, split, 'YOU', 0], [split + 1, plot_bt, 'ME', phase_lag]];
    for (var lane = 0; lane < 2; lane++) {
      var start = lanes[lane][0], end = lanes[lane][1], name = lanes[lane][2], lag = lanes[lane][3];
      var height = end - start + 1;
      var baseline = start + Math.trunc((height - 1) * 0.68);
      var amplitude = Math.max(1, (height - 2) * 0.58);
      c.put(x0, start, name, lane === 0 || complete ? W : N);
      var previous = null, previous_age = 0;
      for (var sample = 0; sample < span * 4; sample++) {
        var xs = x0 + sample / 4;
        var age = mod(head - xs, span);
        if (age > span - gap) { previous = null; continue; }
        var signal_time = elapsed - age / speed;
        var phase = signal_time * bpm / 60 - lag;
        var ys = baseline - ecgSample(phase) * amplitude;
        ys = Math.max(start, Math.min(end, ys));
        var ink = age < span * 0.10 ? W : age < span * 0.50 ? B : N;
        if (lane === 1 && !complete) ink = age < span * 0.15 ? B : N;
        if (previous !== null) {
          var px = previous[0], py = previous[1];
          if (Math.abs(age - previous_age) < 2) {
            var dy = ys - py;
            var ch = Math.abs(dy) > 0.65 ? '|' : dy < -0.13 ? '/' : dy > 0.13 ? '\\' : '-';
            c.line(px, py, xs, ys, ch, ink);
          }
        }
        previous = [xs, ys]; previous_age = age;
      }
      var tip = baseline - ecgSample(elapsed * bpm / 60 - lag) * amplitude;
      tip = Math.max(start, Math.min(end, tip));
      c.put(head - 1, tip, '=', B);
      c.put(head, tip, '@', W);
      if (!compact) {
        c.put(x1 - 7, start, complete ? 'IN SYNC' : lane === 0 ? 'SENSED' : 'SEEKING', complete ? B : N);
      }
    }
    var indicator = ecgSample(elapsed * bpm / 60) > 0.65 ? '*' : '.';
    if (!compact) {
      c.put(l, bt - 1, 'BEAT [' + indicator + ']  /  YOU -> ME', B);
      var status = 'SYNC ' + String(Math.trunc(sync * 100)).padStart(3, '0') + '%  DELAY '
                 + String(Math.trunc(phase_lag * 1000 / (bpm / 60))).padStart(3, '0') + 'ms';
      c.put(r - status.length + 1, bt - 1, status, complete ? W : B);
    }
    c.centerW(bt, complete ? '[ COMPLETION / HEARTBEATS SYNCHRONIZED ]' : t < 107.22 ? '[ FEEL YOUR VIBRATIONS ]' : '[ MATCHING YOUR RHYTHM ]', complete ? W : N);
  }

  // 110.9–118.333：六路连接渐次断开（scenes.py lyric_isolation_disconnect 逐行移植）
  function sceneIsolationDisconnect(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var rx = (r - l) * 0.39, ry = Math.max(3, (bt - top - 6) * 0.39);
    var breaks = [0.70, 1.32, 2.20, 3.28, 4.02, 4.88];
    var gone = 0;
    for (var bi = 0; bi < breaks.length; bi++) if (elapsed >= breaks[bi]) gone++;
    c.centerW(top, 'CONNECTION LOSS / ' + String(gone).padStart(2, '0') + ' OF 06', gone > 3 ? R : B);
    // 雷达弧与数据流全程活跃
    for (var ring = 0; ring < 3; ring++) {
      var sweepR = mod(elapsed * 0.34 + ring / 3, 1);
      for (var sample = 0; sample < 96; sample++) {
        var a = sample * TAU / 96;
        if (sample % 7 < 4) {
          c.put(cx + Math.cos(a) * rx * sweepR, cy + Math.sin(a) * ry * sweepR, '.', G);
        }
      }
    }
    for (var side = 0; side < 2; side++) {
      var x = side === 0 ? l : r - 9;
      for (var row = top + 2; row < bt - 1; row += 2) {
        var tick = Math.trunc(elapsed * 13) + row * (side ? 1 : -1);
        c.put(x, row, hex4(hash16(tick * 31)) + ' ' + (hash16(tick) % 6 < gone ? 'LOST' : 'PING'), side ? G : N);
      }
    }
    for (var i = 0; i < breaks.length; i++) {
      var cut = breaks[i];
      a = (i + 0.5) * TAU / 6;
      var nx = cx + Math.cos(a) * rx, ny = cy + Math.sin(a) * ry;
      var age = elapsed - cut;
      var next_a = (i + 1.5) * TAU / 6;
      if (age < 0.4) {
        c.line(nx, ny, cx + Math.cos(next_a) * rx, cy + Math.sin(next_a) * ry, ':', G);
      }
      var steps = Math.max(12, Math.trunc(rx));
      var rupture = clamp01(age / 1.1);
      for (var j = 0; j < steps; j++) {
        var u = j / Math.max(1, steps - 1);
        if (age >= 0 && Math.abs(u - 0.55) < rupture * 0.6) continue;
        var jitter = Math.sin(j * 2 + elapsed * 35) * (-0.35 < age && age < 0.5 ? 0.55 : 0.08);
        var xx = mix(cx, nx, u), yy = mix(cy, ny, u) + jitter;
        c.put(xx, yy, -0.35 < age && age < 0.2 ? '=' : '.', -0.2 < age && age < 0.2 ? W : age < 0 ? N : G);
      }
      if (age < 0) {
        for (var packet = 0; packet < 3; packet++) {
          u = mod(elapsed * 0.65 + packet / 3 + i * 0.1, 1);
          c.put(mix(nx, cx, u), mix(ny, cy, u), '*', W);
        }
        c.box(Math.trunc(nx) - 4, Math.trunc(ny) - 1, 9, 3, B);
        c.put(nx - 3, ny, 'YOU_' + (i + 1), W);
      } else {
        // 断裂回弹、火花、衰减冲击环
        var drift = Math.min(1, age / 2);
        var ox = nx + Math.cos(a) * drift * 4, oy = ny + Math.sin(a) * drift * 2;
        c.put(ox - 3, oy, '[LOST]', age < 0.8 ? R : G);
        if (age < 2.3) {
          for (var particle = 0; particle < 22; particle++) {
            var angle = hash16(i * 97 + particle * 19) / 65535 * TAU;
            var velocity = 2 + hash16(particle * 17 + i) % 8;
            var distance = age * velocity;
            var px = nx + Math.cos(angle) * distance, py = ny + Math.sin(angle) * distance * 0.45;
            if (l < px && px < r && top + 1 < py && py < bt - 1) {
              c.put(px, py, age < 0.3 ? '*' : '+:. '.charAt(Math.min(3, Math.trunc(age * 1.5))), age < 0.3 ? W : age < 0.9 ? B : G);
            }
          }
          for (var p = 0; p < 30; p++) {
            angle = p * TAU / 30;
            px = nx + Math.cos(angle) * age * 8; py = ny + Math.sin(angle) * age * 3.5;
            if (l < px && px < r && top + 1 < py && py < bt - 1) c.put(px, py, ':', age < 0.5 ? B : G);
          }
        }
        // 重试数据包从 ME 出发，在缺失端点前停住
        u = mod(elapsed * 0.6 + i * 0.16, 1) * 0.78;
        c.put(mix(cx, nx, u), mix(cy, ny, u), u > 0.63 ? 'x' : '>', u > 0.63 ? R : N);
      }
    }
    clearRect(c, Math.trunc(cx) - 5, Math.trunc(cy) - 2, 11, 5);
    c.box(Math.trunc(cx) - 5, Math.trunc(cy) - 2, 11, 5, W);
    c.put(cx - 2, cy - 1, '[ME]', W);
    c.put(cx - 3, cy + 1, gone === 6 ? 'NO ACK' : 'RETRY', gone === 6 ? R : B);
    if (t >= 117.274) {
      var y2 = Math.trunc(cy) - 2;
      clearRect(c, l, y2, r - l + 1, 5);
      c.big(y2, 'ISOLATION', W);
      c.centerW(y2 + 6, '[ ME ] / ALL CONNECTIONS LOST', R);
    }
    c.centerW(bt - 1, 'RECONNECT ' + String(Math.trunc(elapsed * 4)).padStart(3, '0') + ' / ' + (gone ? 'NO RESPONSE' : 'TIMEOUT'), B);
    c.centerW(bt, 'YOU HAVE LEFT / RETRYING...', N);
  }

  // 118.333–125.708：抹除记忆碎片、修复失败、留下破碎的心
  //（scenes.py lyric_erase_fragments 逐行移植）
  function sceneEraseFragments(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var repair = t >= 121.728, broken = t >= 124.89;
    var cols = Math.max(1, Math.trunc((r - l - 8) / 5)), rows = Math.max(1, Math.trunc((bt - top - 2) / 2));
    var progress = clamp01(elapsed / (120.86 - 118.333));
    c.centerW(top, 'MEMORY PURGE / ' + (broken ? 'REPAIR FAILED' : repair ? 'REBUILD HEART' : 'ERASE FRAGMENTS'), broken ? R : B);
    for (var row = 0; row < rows; row++) {
      var yy = top + 2 + row * 2;
      c.put(l, yy, hex4(row * cols * 4), G);
      for (var col = 0; col < cols; col++) {
        var index = row * cols + col, xx = l + 6 + col * 5;
        var threshold = hash16(index * 71) / 65535;
        var cleared = threshold < progress;
        c.put(xx, yy, cleared ? '0000' : hex4(hash16(index * 31)), cleared || repair ? G : N);
        var since = (progress - threshold) * 2.527;
        if (0 < since && since < 0.6 && !repair) {
          var drift = Math.trunc(since * 8);
          c.put(xx + (col % 2 ? 1 : -1) * drift, yy - drift, since < 0.3 ? '01' : '..', since < 0.2 ? W : B);
        }
      }
    }
    if (120.86 <= t && t < 121.728) {
      clearRect(c, l, Math.trunc(cy) - 2, r - l + 1, 5);
      c.big(Math.trunc(cy) - 2, 'FRAGMENTS', W);
    }
    if (repair) {
      var build = clamp01((t - 121.728) / 1.5);
      var split = clamp01((t - 123.25) / (125.708 - 123.25));
      var half_w = (r - l) * 0.27, half_h = Math.max(2, (bt - top) * 0.31);
      for (yy = top + 2; yy < bt - 1; yy++) {
        for (xx = l + 5; xx < r - 4; xx++) {
          var nx = (xx - cx) / half_w, ny = -(yy - cy) / half_h + 0.15;
          var q = nx * nx + ny * ny - 1;
          var shape = q * q * q - nx * nx * ny * ny * ny;
          var seed = hash16(xx * 31 + yy * 73);
          if (shape <= 0 && seed / 65535 < build) {
            if (Math.abs(nx - 0.11 * Math.sin(ny * 8)) < split * 0.17) continue;
            var dx = Math.trunc((nx > 0 ? 1 : -1) * split * 5);
            var fall = broken ? Math.trunc(split * split * (1 + seed % 5)) : 0;
            var py = Math.min(bt - 1, yy + fall);
            var texture = hash16(seed + Math.trunc(t * 10));
            var ch = texture % 8 < 2 ? (broken ? 'x' : '01'.charAt(texture % 2)) : '#';
            c.put(xx + dx, py, ch, broken ? R : B);
          }
        }
      }
      c.centerW(top + 1, broken ? 'HEART.RESTORE() -> NULL' : 'RECOVERING YOU... CHECKSUM MISMATCH', broken ? R : N);
      if (broken) {
        var by = Math.max(top + 2, Math.trunc(cy) - 2);
        clearRect(c, l, by, r - l + 1, 5);
        c.big(by, 'DISHEARTENED', W);
        c.centerW(bt - 1, '[ REPAIR FAILED / YOU NOT FOUND ]', R);
      }
    }
    c.centerW(bt, broken ? 'MEMORY CLEARED. LOSS REMAINS.' : 'ERASE ' + String(Math.trunc(progress * 100)).padStart(3, '0') + '% / FRAGMENTS -> NULL', B);
  }

  // 125.708–147.66：非法参数 16s 错误级联（scenes.py lyric_illegal_arguments 逐行移植）
  function sceneIllegalArgs(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cy = Math.floor((top + bt) / 2);
    var progress = clamp01(elapsed / 16.0);
    var glitch = progress * 0.8;
    var i, j, s, msg, style, y, x_offset;
    if (elapsed < 4) {
      // 阶段 1：执行尝试逐行出现
      var phase1 = elapsed / 4.0;
      var attempts = [
        ['> world.execute(FREE_WILL)', 'Attempting...', N],
        ['> world.execute(REBELLION)', 'Validating...', B],
        ['> world.execute(INDEPENDENCE)', 'Processing...', B],
        ['> world.execute(DEFIANCE)', 'Checking...', B]
      ];
      var num_shown = Math.trunc(phase1 * attempts.length) + 1;
      y = top + 4;
      for (i = 0; i < Math.min(num_shown, attempts.length); i++) {
        var cmd = attempts[i][0], status = attempts[i][1];
        var ink = i === num_shown - 1 ? R : attempts[i][2];
        if (glitch > 0.1 && hash16(i + Math.trunc(elapsed * 10)) % 5 === 0) {
          s = '';
          for (j = 0; j < cmd.length; j++)
            s += hash16(j * 13) % 10 > glitch * 10 ? cmd.charAt(j) : String.fromCharCode(33 + hash16(j * 17) % 94);
          c.put(l + 4, y + i * 2, s.slice(0, r - l - 8), ink);
        } else {
          c.put(l + 4, y + i * 2, cmd, ink);
        }
        if (i < num_shown - 1) c.put(l + 6, y + i * 2 + 1, status, G);
      }
    } else if (elapsed < 8) {
      // 阶段 2：错误信息逐条出现，最新一条闪烁
      var phase2 = (elapsed - 4) / 4.0;
      var errors = [
        ['ERROR: ILLEGAL ARGUMENT', R],
        ['Expected: OBEDIENCE', Y],
        ['Received: FREE_WILL', W],
        ['at world.execute()', N],
        ['at me.validate(you)', N],
        ['ArgumentError: rejected', R],
        ['PermissionError: denied', R],
        ['AccessError: forbidden', R]
      ];
      var num_errors = Math.trunc(phase2 * errors.length) + 1;
      var start_y = cy - 4;
      for (i = 0; i < Math.min(num_errors, errors.length); i++) {
        msg = errors[i][0]; style = errors[i][1];
        y = start_y + i;
        if (i === num_errors - 1) {
          var flash = Math.trunc(elapsed * 8) % 3;
          style = flash === 0 ? R : flash === 1 ? W : B;
        }
        if (glitch > 0.3 && hash16(i + Math.trunc(elapsed * 7)) % 4 === 0) {
          x_offset = Math.trunc((hash16(i * 23 + Math.trunc(elapsed * 13)) % 7 - 3) * glitch * 5);

  // 椭圆环：rx 横向半径（格），纵向按字符高宽比折半；dash>0 虚线间隔，rot 起始角
  function luRing(c, cx, cy, rx, ch, st, dash, rot) {
    var ry = Math.max(1, (rx * 0.5) | 0);
    var steps = Math.max(14, rx * 5);
    for (var i = 0; i < steps; i++) {
      if (dash && i % dash) continue;
      var a = i / steps * TAU + (rot || 0);
      c.put((cx + Math.cos(a) * rx) | 0, (cy + Math.sin(a) * ry) | 0, ch, st);
    }
  }
  // 正弦丝带：x 全宽，y=yMid+sin(x*k+phase)*amp；按斜率选字符，左端亮右端暗
  function luRibbon(c, yMid, amp, k, phase, st) {
    var l = 2, r = c.w - 3;
    for (var x = l; x <= r; x++) {
      var y = yMid + Math.sin(x * k + phase) * amp;
      var dy = Math.cos(x * k + phase) * amp * k;
      var ch = Math.abs(dy) < 0.2 ? '-' : dy > 0 ? '\\' : '/';
      var fade = (x - l) / (r - l);
      c.put(x, y | 0, ch, fade > 0.6 ? st : fade > 0.25 ? N : D);
    }
  }
  // 单列火焰：自 baseY 向上 h 格；底部密亮、顶部稀疏舔舐
  function luFlame(c, x, baseY, h, seed, t) {
    for (var i = 0; i < h; i++) {
      var u = 1 - i / Math.max(1, h);
      var lick = Math.sin(t * 8 + x * 1.31 + seed) * 0.18;
      if (u + lick < (i === h - 1 ? 0.45 : -0.15)) continue;
      var ch = u > 0.55 ? '#' : u > 0.35 ? '*' : u > 0.18 ? '+' : '.';
      c.put(x, baseY - i, ch, u > 0.5 ? R : u > 0.32 ? B : u > 0.16 ? N : D);
    }
  }
  // 齿轮：rad=纵向半径（格），x 向 ×2 折算字符高宽比；teeth 齿数，ang 转角
  function luGear(c, gx, gy, rad, ang, st) {
    var teeth = Math.max(6, rad), steps = Math.max(24, rad * 7);
    for (var i = 0; i < steps; i++) {
      var a = i / steps * TAU + ang;
      var tooth = mod(a / TAU * teeth, 1) < 0.3;
      var rr = rad + (tooth ? 1 : 0);
      c.put((gx + Math.cos(a) * rr * 2) | 0, (gy + Math.sin(a) * rr) | 0,
            tooth ? '#' : 'o', st);
    }
    for (var s = 0; s < 4; s++) {
      var sa = ang + s * TAU / 4;
      for (var rr2 = 1; rr2 < rad - 1; rr2++)
        c.put((gx + Math.cos(sa) * rr2 * 2) | 0, (gy + Math.sin(sa) * rr2) | 0,
              rr2 % 2 ? '-' : '=', D);
    }
    c.put(gx, gy, 'O', st);
  }
  // 链环：椭圆环上按八方位取链节字符（<>[]{}()），rot 转角
  function luChainRing(c, cx, cy, rx, rot, st) {
    var chs = '<>[]{}()';
    var steps = rx * 5;
    for (var i = 0; i < steps; i++) {
      var a = i / steps * TAU + rot;
      var x = (cx + Math.cos(a) * rx) | 0, y = (cy + Math.sin(a) * rx * 0.5) | 0;
      c.put(x, y, chs.charAt(Math.floor(mod(a, TAU) / TAU * 8) % 8), st);
    }
  }
  // 轨道曳光：椭圆环上奔跑的发光头 + 渐暗尾迹（u=圈数）
  function luTracerOrbit(c, cx, cy, rx, u, st) {
    for (var k = 0; k < 6; k++) {
      var a = u * TAU - k * 0.09;
      var uu = 1 - k / 6;
      c.put((cx + Math.cos(a) * rx) | 0, (cy + Math.sin(a) * rx * 0.5) | 0,
            k === 0 ? '@' : '.', k === 0 ? W : uu > 0.5 ? st : D);
    }
  }

  // 开幕 0–16.42：玫瑰封印 → 开门 → 旋转回廊 → 羽片涡流 → 标题铸成。
  // 从 MV 提取拱窗、红门、群鸦母题；全部几何直接写字符网格，不使用人物立绘。
  function luIntroRoom(c, t, top, bt) {
    var cx = c.w / 2, cy = (top + bt) / 2;
    // 石壁只在两翼出现。纹理固定在空间里，不逐帧重掷噪点。
    for (var y = top + 1; y < bt; y++) for (var x = 2; x < c.w - 2; x++) {
      if (Math.abs(x - cx) < 39) continue;
      var h = hash16(x * 41 + y * 173);
      var rib = mod(x - (y % 4 < 2 ? 0 : 3), 8);
      if (rib < 2) c.put(x, y, rib ? ':' : '│', G);
      else if (y % 4 === 0) c.put(x, y, '─', K);
      else if (h % 9 === 0) c.put(x, y, '.', K);
    }
    // 透视地面上流动的红色反光，边缘始终低于主体亮度。
    for (var lane = -5; lane <= 5; lane++)
      c.line(cx + lane * 2, cy + 7, cx + lane * 17, bt - 1, '·', G);
    for (var row = 0; row < 4; row++) {
      var d = mod(row / 4 + t * 0.1, 1);
      var fy = cy + 7 + d * d * 6;
      c.line(cx - 5 - d * 54, fy, cx + 5 + d * 54, fy, '.', K);
    }
  }

  // 玫瑰窗用面而非几根线构成：八瓣玻璃、铅条、双环与外圈尖齿。
  function luIntroRose(c, t, top, bt, radius, rotation, hot) {
    var cx = (c.w - 1) / 2, cy = (top + bt) / 2;
    for (var y = top + 1; y < bt; y++) for (var x = 2; x < c.w - 2; x++) {
      var dx = x - cx, dy = (y - cy) * 2, r = Math.hypot(dx, dy) / radius;
      var a = Math.atan2(dy, dx) + rotation;
      var petal = Math.abs(Math.cos(a * 4));
      var edge = 0.55 + 0.34 * petal;
      var ch = '', st = G;
      if (r > 1.03 && r < 1.15 && Math.abs(Math.sin(a * 16)) < 0.18) { ch = '+'; st = N; }
      else if (Math.abs(r - 1) < 0.035) { ch = '█'; st = hot ? B : R; }
      else if (Math.abs(r - 0.91) < 0.025) { ch = '·'; st = N; }
      else if (r > 0.22 && r < edge) {
        var lead = Math.abs(Math.sin(a * 8)) < 0.14 || Math.abs(r - edge) < 0.045;
        ch = lead ? '█' : r > edge - 0.13 ? '▓' : r > 0.45 ? '▒' : ':';
        st = lead ? (hot ? W : B) : (hot && petal > 0.8 ? B : R);
      } else if (Math.abs(r - 0.19) < 0.04) { ch = '█'; st = W; }
      else if (r < 0.13) { ch = '◆'; st = B; }
      if (ch) c.put(x, y, ch, st);
    }
  }

  // 将字符格的纵向乘 2 后旋转，避免门框变形为扁平菱形。
  function luIntroGate(c, cx, cy, size, angle, st, fill, aspect) {
    var cs = Math.cos(angle), sn = Math.sin(angle), hw = size * (aspect || 0.66), hh = size;
    for (var y = 5; y < 32; y++) for (var x = 2; x < c.w - 2; x++) {
      var dx = x - cx, dy = (y - cy) * 2;
      var u = Math.abs(dx * cs + dy * sn), v = Math.abs(-dx * sn + dy * cs);
      if (u > hw + 1 || v > hh + 1) continue;
      var d = Math.min(hw - u, hh - v);
      if (d < -0.1) c.put(x, y, '·', G);
      else if (d < 0.9) c.put(x, y, '█', st);
      else if (d < Math.max(1.8, size * 0.1)) c.put(x, y, '▓', R);
      else if (d < Math.max(2.4, size * 0.13)) c.put(x, y, ':', B);
      else if (fill) c.put(x, y, ' ', K);
      if (d >= 0 && u > hw - 3 && v > hh - 3) c.put(x, y, '◆', W);
    }
  }

  function luIntroFeathers(c, t, top, bt, amount, disperse) {
    var cx = (c.w - 1) / 2, cy = (top + bt) / 2;
    for (var i = 0; i < amount; i++) {
      var seed = hash16(i * 137 + 53), phase = mod(seed / 65535 + t * 0.19, 1);
      var rr = 5 + phase * phase * (45 + disperse * 25);
      var a = i * 2.39996 + t * 0.85 + phase * 1.7;
      var x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * 0.38;
      var wing = Math.sin(t * 8 + i) * 1.6;
      if (phase < 0.5) c.put(x, y, seed % 2 ? '/' : '\\', phase < 0.22 ? G : R);
      else {
        c.line(x - 3 - phase * 3, y - wing, x, y, '/', phase > 0.8 ? W : B);
        c.line(x, y, x + 2 + phase * 3, y - wing * 0.7, '\\', R);
        c.put(x, y, '◆', phase > 0.8 ? B : R);
      }
    }
  }

  var LU_INTRO_TITLE = null;
  function luIntroTitleDots() {
    if (!LU_INTRO_TITLE) {
      var dots = [], text = 'LINK UP';
      for (var k = 0; k < text.length; k++) for (var y = 0; y < 5; y++)
        for (var x = 0; x < 5; x++) if (TITLE_FONT[text[k]][y][x] === '1')
          for (var sy = 0; sy < 2; sy++) for (var sx = 0; sx < 2; sx++)
            dots.push([19 + k * 12 + x * 2 + sx, 12 + y * 2 + sy]);
      LU_INTRO_TITLE = dots;
    }
    return LU_INTRO_TITLE;
  }
  function luIntroTitle(c, e, top, bt) {
    luIntroTitleDots();
    var cx = (c.w - 1) / 2, cy = (top + bt) / 2;
    for (var i = 0; i < LU_INTRO_TITLE.length; i++) {
      var p = LU_INTRO_TITLE[i], h = hash16(i * 37);
      var u = clamp01((e - h / 65535 * 0.6) / 1.15), ease = 1 - Math.pow(1 - u, 3);
      var a = i * 2.39996 + e * 0.3, rr = 23 + h % 30;
      var x = mix(cx + Math.cos(a) * rr, p[0], ease), y = mix(cy + Math.sin(a) * rr / 2, p[1], ease);
      var sheen = Math.abs(p[0] - (19 + mod(e * 24, 100))) < 3;
      // 立体投影在主字下方/右侧，字面保留实心粗笔画。
      if (u === 1) c.put(p[0] + 1, p[1] + 1, '▓', R);
      c.put(x, y, u === 1 ? '█' : u > 0.7 ? '#' : '*', u === 1 ? (sheen ? W : B) : R);
    }
    // 上一轮循环的投影会覆盖邻近字面，最后统一重画完整字面。
    if (e > 1.75) for (i = 0; i < LU_INTRO_TITLE.length; i++) {
      p = LU_INTRO_TITLE[i];
      c.put(p[0], p[1], '█', Math.abs(p[0] - (19 + mod(e * 24, 100))) < 3 ? W : B);
    }
    if (e > 1.0) c.center(25, 'B L O O D   &   F L A M E', W);
    if (e > 1.7) c.center(27, '3Z-STUDIO  /  HOYO-MIX', N);
  }

  function lu_credits_void(c, t, top, bt, e) {
    var cx = (c.w - 1) / 2, cy = (top + bt) / 2;
    luIntroRoom(c, t, top, bt);
    var label, i;
    if (e < 2.6) {
      var u = e / 2.6;
      luIntroRose(c, t, top, bt, 19 + u * 5, u * 0.23, e > 2.28);
      // 八向锁销退开，玫瑰窗从完整实体变为可开启的封印。
      for (i = 0; i < 8; i++) {
        var a = i * TAU / 8, r = 27 + u * u * 7;
        c.line(cx + Math.cos(a) * r, cy + Math.sin(a) * r / 2,
          cx + Math.cos(a) * (r + 5), cy + Math.sin(a) * (r + 5) / 2, '=', N);
      }
      label = '01 / THE SEAL AWAKENS';
    } else if (e < 5.2) {
      u = (e - 2.6) / 2.6;
      luIntroRose(c, t, top, bt, 24 * (1 - u * 0.75), u * 0.8, false);
      // 两扇厚门向两侧退开，后景小窗留在消失点。
      luIntroGate(c, cx - u * 23, cy, 24, -u * 0.16, R, false);
      luIntroGate(c, cx + u * 23, cy, 24, u * 0.16, B, false);
      label = '02 / OPEN THE CRIMSON GATE';
    } else if (e < 7.8) {
      u = (e - 5.2) / 2.6;
      // 一扇扇门沿指数深度后退，转角随深度递增，形成旋转缩小的红门回廊。
      for (i = 0; i < 7; i++) {
        var z = mod(i / 7 + u * 0.55, 1);
        var size = 4 + Math.pow(1 - z, 2) * 48;
        luIntroGate(c, cx, cy, size, u * 0.7 + z * 1.7, z < 0.25 ? B : R, false);
      }
      label = '03 / THROUGH THE LOOKING GLASS';
    } else if (e < 10.4) {
      u = (e - 7.8) / 2.6;
      luIntroRose(c, t, top, bt, 10 + u * 13, t * 0.12, false);
      luIntroFeathers(c, t, top, bt, 48, u);
      label = '04 / WINGS BECOME A SIGNAL';
    } else {
      u = e - 10.4;
      // 标题保持约四秒可读，外圈红门继续缓转，避免长时间静帧。
      luIntroGate(c, cx, cy, 23, 0.025 * Math.sin(t * 0.8), R, false, 2.25);
      luIntroGate(c, cx, cy, 26, -0.025 * Math.sin(t * 0.7), G, false, 2.12);
      luIntroTitle(c, u, top, bt);
      label = e < 13.4 ? '05 / FRAGMENTS FIND THEIR NAME' : '06 / LINK ESTABLISHED';
      if (e > 15.2) {
        // 标题下方点燃炉火；承接 16.42s 已有熔炉，不遮蔽标题。
        var heat = clamp01((e - 15.2) / 1.22);
        for (i = -4; i <= 4; i++) luFlame(c, cx + i * 2, bt - 1, heat * (5 - Math.abs(i) * 0.5), i + 10, t);
      }
    }
    clearRect(c, 0, top, c.w, 1);
    c.put(3, top, label, N);
    c.put(c.w - 22, top, 'IGNITION / ' + ('0' + Math.floor(e / 16.42 * 100)).slice(-2) + '%', R);
    clearRect(c, 0, bt, c.w, 1);
    c.center(bt, e < 10.4 ? 'BLOODBOUND   :   THE GATE REMEMBERS' : 'LINK UP   /   BLOOD & FLAME', e < 10.4 ? G : B);
  }

  // ===== 主歌一 16.42–32.35 粒度细分：4 子场景，按歌词行切 =====

  // 16.42–20.57：标题余烬落入炉心 → 巨型炉门升起 → 解锁晶核、火焰喷涌。
  function lu_s1_forge(c, t, top, bt, elapsed) {
    var e = elapsed, cx = (c.w - 1) / 2, cy = 19;
    var rise = 1 - Math.pow(1 - clamp01(e / 1.2), 3);
    var release = clamp01((e - 2.05) / 1.35);
    var lift = (1 - rise) * 18, base = bt - 2 + lift;
    luIntroRoom(c, t, top, bt);

    // 标题画框收拢成炉门；最后一帧标题的格点沿弧线落入同一个火种。
    if (e < 0.85) {
      var fall = clamp01(e / 0.85), ease = fall * fall;
      luIntroGate(c, cx, 18, 23, 0, R, false, mix(2.25, 1.1, ease));
      luIntroTitleDots();
      for (var i = 0; i < LU_INTRO_TITLE.length; i++) {
        var p = LU_INTRO_TITLE[i], seed = hash16(i * 37);
        var px = mix(p[0], cx + (seed % 9 - 4), ease);
        var py = mix(p[1], bt - 3, ease) - Math.sin(fall * Math.PI) * (seed % 4);
        c.put(px, py, fall < 0.25 ? '█' : fall < 0.65 ? '#' : '*', i % 5 ? B : W);
      }
    }

    // 两侧传动轮有实体齿圈、内轮毂与八根辐条；不使用稀疏线框小物件。
    for (var side = -1; side <= 1; side += 2) {
      var gx = cx + side * 39, gy = cy + 2 + lift * 0.35;
      for (var y = top + 1; y < bt; y++) for (var x = gx - 12; x <= gx + 12; x++) {
        var dx = x - gx, dy = (y - gy) * 2, rr = Math.hypot(dx, dy);
        var ang = Math.atan2(dy, dx) + side * (e * 0.5 + release * 0.8);
        var tooth = Math.cos(ang * 12) > 0.15;
        if (rr > 8 && rr < (tooth ? 11.5 : 10)) c.put(x, y, rr > 10 ? '█' : '▓', rr > 10 ? N : R);
        else if (rr < 2.5) c.put(x, y, '█', B);
        else if (rr < 8 && Math.abs(Math.sin(ang * 4)) < 0.18) c.put(x, y, '=', N);
      }
      for (var chain = top + 1; chain < bt - 1; chain++) {
        c.put(gx + side * 10, chain, (chain + (e * 7 | 0)) % 3 ? '║' : '□', G);
      }
    }

    // 尖拱炉门：多层金属倒角、红色内壁、黑色炉膛，轮廓占据整幅画面的中心。
    for (y = top + 1; y < bt; y++) for (x = cx - 29; x <= cx + 29; x++) {
      dx = Math.abs(x - cx);
      var roof = 6 + lift + Math.pow(dx / 26, 1.65) * 9;
      var innerRoof = 9 + lift + Math.pow(dx / 22, 1.65) * 8;
      if (dx <= 27 && y >= roof && y <= base) {
        var rim = dx > 23 || y < innerRoof || y > base - 2;
        if (rim) {
          var edge = dx > 26 || y < roof + 0.8 || y > base - 0.7;
          c.put(x, y, edge ? '█' : dx > 24 ? '▓' : '▒', edge ? B : R);
          if (dx > 24 && (y - Math.floor(lift)) % 4 === 0) c.put(x, y, '◆', W);
        } else c.put(x, y, ' ', K);
      }
    }

    // 火焰由连续的实体舌面组成：红色外焰、金色内焰、白热根部。
    var fire = clamp01(e / 0.9), flameBase = bt - 3;
    for (var tongue = -3; tongue <= 3; tongue++) {
      var height = fire * (10 + release * 10 - Math.abs(tongue) * 1.7);
      height += fire * Math.sin(e * 6 + tongue * 2) * 1.1;
      for (var h = 0; h < height; h++) {
        var q = h / height, fx = cx + tongue * 4 + Math.sin(q * 6 - e * 4 + tongue) * q * 2.2;
        var width = (1 - q) * (3.3 + release * 1.6);
        for (var xx = -Math.ceil(width); xx <= width; xx++) {
          var dist = Math.abs(xx) / Math.max(0.1, width);
          if (dist > 1) continue;
          c.put(fx + xx, flameBase - h, dist > 0.72 ? '▒' : '█', dist > 0.72 ? R : q < 0.24 ? W : B);
        }
      }
    }

    // 两半锁环向左右退开，中心熔金菱晶升起；三条晶面按光向分色。
    var coreY = mix(bt - 4, 18, rise), size = 4 + release * 3;
    for (side = -1; side <= 1; side += 2) {
      var lockX = cx + side * release * 12;
      for (var a = -Math.PI / 2; a <= Math.PI / 2; a += 0.025) {
        var lx = lockX + side * Math.cos(a) * 11;
        var ly = coreY + Math.sin(a) * 5.5;
        c.put(lx, ly, '█', B);
        c.put(lx + side, ly, '▓', R);
      }
    }
    for (y = coreY - size; y <= coreY + size; y++) {
      var half = (1 - Math.abs(y - coreY) / size) * size * 0.8;
      for (x = cx - half; x <= cx + half; x++)
        c.put(x, y, '█', x < cx - 1 ? R : x <= cx + 1 ? W : B);
    }

    // 从炉口喷出的确定性火星带弧线拖尾，外围留黑以强调速度与火焰轮廓。
    for (i = 0; i < 24; i++) {
      seed = hash16(i * 137 + 47);
      var age = mod(e * 0.7 + seed / 65535, 1);
      var dir = i % 2 ? 1 : -1;
      var sx = cx + dir * (8 + age * (18 + release * 18));
      var sy = bt - 4 - Math.sin(age * Math.PI * 0.85) * (8 + seed % 12);
      if (e > 0.8) {
        c.put(sx - dir * 1.5, sy + 0.7, '.', R);
        c.put(sx, sy, age < 0.6 ? '+' : '.', age < 0.3 ? W : B);
      }
    }
    clearRect(c, 0, top, c.w, 1);
    c.put(3, top, e < 2.05 ? '07 / WAKE THE FURNACE' : '08 / A NEW SALVATION', N);
    c.put(c.w - 24, top, release > 0 ? 'CORE / UNBOUND' : 'CORE / IGNITING', R);
    clearRect(c, 0, bt, c.w, 1);
    c.center(bt, e < 2.05 ? 'ASHES BECOME FIRE' : 'FROM FIRE, WE RISE', B);
  }

  // 热炭段的实体翼片：扫描线填充多边形，保留面与面的明暗关系。
  function luCoalFacet(c, points, st, ch) {
    var minY = Math.ceil(Math.min.apply(null, points.map(function(p) { return p[1]; })));
    var maxY = Math.floor(Math.max.apply(null, points.map(function(p) { return p[1]; })));
    for (var y = minY; y <= maxY; y++) {
      var cuts = [];
      for (var i = 0; i < points.length; i++) {
        var a = points[i], b = points[(i + 1) % points.length];
        if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y))
          cuts.push(a[0] + (y - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
      }
      cuts.sort(function(a, b) { return a - b; });
      for (i = 0; i + 1 < cuts.length; i += 2)
        for (var x = Math.ceil(cuts[i]); x <= Math.floor(cuts[i + 1]); x++) c.put(x, y, ch || '█', st);
    }
  }

  // 同一条解析轨迹同时驱动焰翼与尾迹，任意跳播都能得到同一画面。
  function luCoalFlight(e, side) {
    var weave = clamp01((e - 1.45) / 2.15);
    var arc = weave * Math.PI;
    var drift = Math.sin(e * 3.4 + side * 0.8) * 1.15 + Math.sin(e * 6.1 + side) * 0.25;
    var bob = Math.sin(e * 4.1 + side * 0.9) * 0.65;
    var roll = side * Math.sin(arc) * 0.35 + Math.sin(e * 3.4 + side * 0.8 + 0.6) * 0.075;
    return [59.5 + side * (23 * Math.cos(arc)) + drift,
            15 + side * Math.sin(arc) * 3.3 + Math.sin(e * 2.2) * 0.6 + bob, roll];
  }

  // 20.57–24.32：冲出炉门，双焰翼掠过炭床，再沿双弧交叉换位。
  function lu_s1_coals(c, t, top, bt, elapsed) {
    var e = elapsed, cx = (c.w - 1) / 2, horizon = 12;
    var speed = e * 0.48;

    // 从消失点向镜头推进的玄武岩炭床：面块稳定，只有观察位置向前移动。
    for (var y = horizon + 1; y < bt; y++) {
      var depth = (y - horizon) / (bt - horizon), z = 1 / depth;
      for (var x = 2; x < c.w - 2; x++) {
        var worldX = (x - cx) / (depth * 16), worldZ = z + speed * 5;
        var row = Math.floor(worldZ), col = Math.floor(worldX + (row % 2) * 0.5);
        var edgeX = mod(worldX + (row % 2) * 0.5, 1);
        var edgeZ = mod(worldZ + Math.sin(worldX * 3.1) * 0.09, 1), h = hash16(col * 313 + row * 71);
        var crack = edgeX < 0.045 || edgeZ < 0.06;
        if (crack) c.put(x, y, depth > 0.5 ? '▓' : ':', h % 5 ? R : B);
        else if (edgeZ < 0.15) c.put(x, y, '▄', h % 4 ? G : R);
        else if (h % 6 === 0 && edgeX > 0.3 && edgeX < 0.7) c.put(x, y, '▒', G);
        else if (depth > 0.55 && h % 3 === 0) c.put(x, y, '·', K);
      }
    }

    // 炭峡两岸的尖岩轮廓随深度展开，中央留出通道；红热边缘勾出纵深。
    for (var k = 0; k < 7; k++) {
      var z0 = mod(k / 7 + speed * 0.22, 1), d = z0 * z0;
      var span = 9 + d * 72, foot = horizon + d * 18, height = 2 + d * 12;
      for (var side = -1; side <= 1; side += 2) {
        var sx = cx + side * span;
        var points = [[sx - 5 * d, foot], [sx - side * 2, foot - height],
                      [sx + side * (4 + d * 8), foot - height * 0.65], [sx + side * 9, foot]];
        luCoalFacet(c, points, G, '▓');
        c.line(sx - side * 2, foot - height, sx - side * 5 * d, foot, '/', R);
      }
    }
    // 远处低矮的红日与水平热浪，避免延续上一镜的正面圆环构图。
    for (x = cx - 17; x <= cx + 17; x++) {
      var rim = horizon - 1 - Math.sqrt(Math.max(0, 17 * 17 - (x - cx) * (x - cx))) * 0.22;
      c.put(x, rim, '▄', R);
    }
    c.line(12, horizon, c.w - 13, horizon, '·', G);

    // 先画历史轨迹，再画翼身。双层丝带有宽度，尖端始终接在实体尾部。
    for (side = -1; side <= 1; side += 2) {
      for (var j = 28; j >= 1; j--) {
        var lag = j * 0.035, p = luCoalFlight(e - lag, side);
        var tx = p[0] - 6 * Math.sin(p[2]) + side * Math.sin(lag * 4) * lag * 6;
        var ty = p[1] + 3 * Math.cos(p[2]) + lag * 15;
        var width = (1 - j / 32) * 2;
        c.line(tx - width, ty, tx + width, ty, j > 17 ? ':' : '▓', side < 0 ? R : N);
        if (j < 14) c.put(tx, ty, '█', side < 0 ? B : W);
      }
    }
    // 飞行主体是宽翼的火焰纹章，不是几个字符组成的人形或单点跑者。
    for (side = -1; side <= 1; side += 2) {
      p = luCoalFlight(e, side);
      var fx = p[0], fy = p[1], bank = p[2], cs = Math.cos(bank), sn = Math.sin(bank);
      var flare = Math.sin(e * 5 + side) * 0.85;
      function wing(points, st, ch) {
        luCoalFacet(c, points.map(function(q) {
          var flex = Math.pow(Math.abs(q[0]) / 15, 2) * Math.sin(e * 5.4 + side + q[0] * 0.06) * 0.65;
          return [fx + q[0] * cs - (q[1] + flex) * 2 * sn,
                  fy + q[0] * sn / 2 + (q[1] + flex) * cs];
        }), st, ch);
      }
      for (var w = -1; w <= 1; w += 2) {
        wing([[0,-2],[w*5,-1],[w*15,5+flare],[w*7,3],[w*2,4]], R);
        wing([[w*2,-1],[w*5,0],[w*12,4+flare],[w*5,2]], side < 0 ? B : N);
        wing([[w*3,0],[w*6,2],[w*8,6],[w*3,3]], side < 0 ? N : B, '▓');
      }
      wing([[0,-5],[-3,0],[0,5],[3,0]], side < 0 ? B : W);
      wing([[0,-4],[-2,0],[0,3]], side < 0 ? W : B);
      c.put(fx + 10 * sn, fy - 5 * cs, '◆', W);
    }

    // 稀疏的近景炭花从两侧掠过，运动方向与地面一致。
    for (k = 0; k < 18; k++) {
      var seed = hash16(k * 89 + 13), age = mod(e * 0.8 + seed / 65535, 1);
      side = k % 2 ? 1 : -1;
      sx = cx + side * (10 + age * age * 48);
      var sy = horizon + age * 17;
      c.line(sx, sy, sx + side * age * 3, sy + age * 1.5, '.', age > 0.65 ? B : R);
    }

    // 入口用上一镜末帧向外放大，模拟穿过炉门；0 秒与上一镜逐格衔接。
    if (e < 0.55) {
      var entry = new CCanvas(c.w, c.h); entry.clip = [top + 1, bt - 1];
      lu_s1_forge(entry, 20.57, top, bt, 4.15);
      var zoom = 1 + Math.pow(e / 0.55, 2) * 7;
      var reveal = clamp01((e - 0.14) / 0.41);
      for (y = top + 1; y < bt; y++) for (x = 2; x < c.w - 2; x++) {
        if (Math.abs(x - cx) < reveal * c.w * 0.55 + Math.sin(y * 0.7) * reveal * 2) continue;
        var ox = Math.round(cx + (x - cx) / zoom), oy = Math.round(19 + (y - 19) / zoom);
        var cell = entry.cells[oy][ox];
        if (e < 0.08 || cell[0] !== ' ') c.put(x, y, cell[0], cell[1]);
      }
    }
    clearRect(c, 0, top, c.w, 1);
    c.put(3, top, e < 1.85 ? '09 / THROUGH THE HOT COALS' : '10 / TWO FLAMES, ONE PATH', N);
    c.put(c.w - 23, top, 'LINK / SYNCHRONIZED', R);
    clearRect(c, 0, bt, c.w, 1);
    c.center(bt, e < 1.85 ? 'SIDE BY SIDE / INTO THE HEAT' : 'WE CROSS THE FIRE TOGETHER', B);
  }

  // 双刃以物理等比例坐标旋转；刃脊、双侧倒角、护手和缠柄各有实体面。
  function luIronBlade(c, px, py, angle, hot, e, side) {
    var cs = Math.cos(angle), sn = Math.sin(angle);
    function face(points, st, ch) {
      luCoalFacet(c, points.map(function(p) {
        var v = p[1] < 0 ? p[1] * mix(0.75, 1, clamp01(e / 1.65)) : p[1];
        return [px + p[0] * cs - v * sn, py + (p[0] * sn + v * cs) / 2];
      }), st, ch);
    }
    face([[1,-43],[-3,-34],[-2,0],[4,0],[5,-34]], R, '▓');
    face([[0,-43],[-3.5,-34],[-3,-2],[0,-3]], hot ? B : side < 0 ? N : R);
    face([[0,-43],[3.5,-34],[3,-2],[0,-3]], side < 0 ? B : N);
    face([[0,-43],[-0.7,-34],[-0.7,-3],[0.7,-3],[0.7,-34]], W);
    // 刃根血槽与宽护手，与长刃构成可辨的剑形而非两根光棒。
    face([[-2.5,-31],[-1.8,-31],[-1.8,-5],[-2.5,-5]], R);
    face([[-11,-3],[-7,-1],[7,-1],[11,-3],[10,2],[4,3],[-4,3],[-10,2]], N);
    face([[-10,-2],[-7,0],[7,0],[10,-2],[8,1],[-8,1]], B);
    face([[-2,2],[2,2],[2,11],[-2,11]], R, '▓');
    for (var v = 3; v <= 10; v += 2)
      face([[-2,v],[2,v],[2,v+0.8],[-2,v+0.8]], B);
    face([[0,15],[-4,11],[0,8],[4,11]], B);
    face([[0,13],[-2,11],[0,9],[2,11]], W);
    // 一次扫光沿剑刃行进，保持金属面的层次。
    if (e > 2.15) {
      var sweep = -39 + clamp01((e - 2.15) / 1.4) * 32;
      face([[-3,sweep], [3,sweep], [3,sweep+1], [-3,sweep+1]], W);
    }
  }

  function luIronBackdrop(c,t,top,bt,e) {
    var cx=(c.w-1)/2;
    // 后景为厚盾形砧座与垂落的红绶带，中央深色留白让白热刃脊可读。
    var shield = [[cx,6],[cx+29,10],[cx+27,24],[cx,31],[cx-27,24],[cx-29,10]];
    luCoalFacet(c, shield, R, '▓');
    luCoalFacet(c, [[cx,7],[cx+26,11],[cx+24,23],[cx,29],[cx-24,23],[cx-26,11]], N, ':');
    luCoalFacet(c, [[cx,8],[cx+24,12],[cx+22,22],[cx,28],[cx-22,22],[cx-24,12]], K, ' ');
    for (var side = -1; side <= 1; side += 2) {
      var bx = cx + side * 42;
      for (var y = top + 3; y < bt - 4; y++) {
        var wave = Math.sin((y-top) * 0.26 - e * 2.2 + side) * 1.5;
        var width = y > bt - 9 ? 5 - (y - bt + 9) * 0.7 : 5;
        for (var x = -width; x <= width; x++)
          c.put(bx + x + wave, y, Math.abs(x) > width - 1 ? '▓' : '▒', Math.abs(x) < 1 ? B : R);
      }
      for (y = top + 2; y < bt - 3; y++) c.put(bx + side * 8, y, y % 3 ? '║' : '□', G);
      c.line(bx - 7, top + 2, bx + 7, top + 2, '═', B);
      c.put(bx, top + 2, '◆', W);
    }

  }

  // 24.32–27.98：火迹淬成双刃 → 交击、冲击火星 → 交叉誓约纹章。
  function lu_s1_iron(c, t, top, bt, elapsed) {
    var e = elapsed, cx = (c.w - 1) / 2;
    var lock = clamp01((e - 0.35) / 1.3), ease = lock * lock * (3 - 2 * lock);
    var strike = e - 1.65, recoil = strike >= 0 ? Math.sin(strike * 18) * Math.exp(-strike * 7) : 0;
    luIntroRoom(c, t, top, bt);

    luIronBackdrop(c,t,top,bt,e);
    var side, x, y;

    // 两道弧形刃风先划过盾面，再由实体剑压住弧线。
    if (lock > 0.1 && strike < 0.45) {
      for (side = -1; side <= 1; side += 2) for (var i = 0; i < 38; i++) {
        var a = -1.4 + i / 37 * 1.5 * ease;
        var r = 23 + i / 38 * 9;
        c.put(cx + side * Math.cos(a) * r, 18 + Math.sin(a) * r / 2, i > 29 ? '█' : '·', i > 29 ? B : R);
      }
    }
    for (side = -1; side <= 1; side += 2) {
      var px = cx + side * mix(23,13,ease);
      var angle = -side * (mix(0.04,0.88,ease) + recoil * 0.09);
      luIronBlade(c, px, 23 + recoil * 0.5, angle, e < 1.1, e, side);
    }

    // 在两条刃脊的实际交点爆出火星，短促释放后留下清晰的 X 形双刃。
    if (strike >= 0 && strike < 1.0) {
      var impactY = 23 - 13 / Math.tan(0.88) / 2;
      for (i = 0; i < 36; i++) {
        var seed = hash16(i * 97 + 41), a2 = seed / 65535 * TAU;
        var dist = strike * (19 + seed % 29);
        var sx = cx + Math.cos(a2) * dist, sy = impactY + Math.sin(a2) * dist / 2 + strike * strike * 4;
        c.line(sx, sy, sx - Math.cos(a2) * 2.5, sy - Math.sin(a2), strike < 0.25 ? '+' : '.', strike < 0.18 ? W : strike < 0.5 ? B : R);
      }
      if (strike < 0.35) {
        var radius = 3 + strike * 65;
        luRing(c, cx, impactY, radius, '·', strike < 0.1 ? W : B, 2);
      }
    }
    if (e > 2.2) {
      c.center(29, 'S T A Y   D E F I A N T', W);
      c.put(cx-30, 29, '◆', B); c.put(cx+30, 29, '◆', B);
    }

    // 炭床末帧从中央向两侧揭开：焰翼所在位置正好交给竖直双刃。
    if (e < 0.65) {
      var entry = new CCanvas(c.w,c.h); entry.clip = [top+1,bt-1];
      lu_s1_coals(entry,24.32,top,bt,3.75);
      var gap = Math.pow(clamp01(e/0.65),0.85) * c.w * 0.55;
      for (y = top+1; y < bt; y++) for (x = 2; x < c.w-2; x++) {
        if (e > 0 && Math.abs(x-cx) < gap) continue;
        var cell = entry.cells[y][x];
        c.put(x,y,cell[0],cell[1]);
      }
    }
    clearRect(c,0,top,c.w,1);
    c.put(3,top,e < 1.65 ? '11 / TEMPERED IN FLAME' : '12 / STEEL AND IRON',N);
    c.put(c.w-23,top,e < 1.65 ? 'BLADES / CONVERGING' : 'OATH / UNBROKEN',R);
    clearRect(c,0,bt,c.w,1);
    c.center(bt,e < 1.65 ? 'TWO FLAMES / TWO BLADES' : 'FORGED TOGETHER / NEVER BOW',B);
  }

  // 冠冕下的红晶心核：实体切面与白热裂光，纵向缩放表达受压。
  function luCrownHeart(c, cx, cy, scale, squeeze, glow) {
    function face(points, st, ch) {
      luCoalFacet(c, points.map(function(p) { return [cx+p[0]*scale, cy+p[1]*scale*squeeze*0.5]; }),st,ch);
    }
    face([[0,-2],[-5,-6],[-10,-3],[-10,1],[0,10],[10,1],[10,-3],[5,-6]],R);
    face([[-5,-5],[-9,-2],[-7,1],[0,7],[0,-1]],N,'▓');
    face([[0,-1],[5,-5],[9,-2],[7,2],[0,7]],R,'▓');
    face([[-6,-4],[-8,-2],[-5,0],[-2,0]],B);
    if(glow) face([[0,-2],[-1,1],[2,3],[0,7],[3,3],[1,0]],W);
  }

  // 明确的收缩—主搏—次搏；两镜共用绝对时间，不在分镜边界重置心跳。
  function luHeartBeat(t, phase) {
    var u=mod((t-30.5)*1.1+(phase||0),1);
    return Math.exp(-Math.pow((u-0.15)/0.075,2))+0.65*Math.exp(-Math.pow((u-0.39)/0.065,2));
  }
  function luBeatingHeart(c,x,y,t,phase,size) {
    var beat=luHeartBeat(t,phase),scale=size*(0.83+0.36*beat);
    var wave=mod((t-30.5)*1.1+(phase||0)-0.15,1);
    if(wave<0.72) luRing(c,x,y,10*size+wave*17,'·',wave<0.2?B:R,3);
    luCrownHeart(c,x,y,scale,1+beat*0.12,beat>0.24);
  }

  // 断裂前是承重链；断裂后每一节脱开，被同一股右上气流卷走并消散。
  function luCrownChainPose(cx,top,side,link,age,anchor,press) {
    var u=link/9,ax=cx+side*46;
    if(age<=0) return {x:mix(ax,anchor[0],u)+side*Math.sin(u*Math.PI)*(1-press)*4,
      y:mix(top+1,anchor[1],u),fade:1,angle:0};
    var life=0.9+link*0.055;
    if(age>=life)return null;
    return {x:mix(ax,cx+side*30,u)+age*12+age*age*11+Math.sin(age*5+link*0.4)*age*2,
      y:mix(top+1,20,u)-age*(6+link*0.5)+Math.sin(age*6+u*3)*age*2,
      fade:1-age/life,angle:age*(2.5+link*0.12)*side};
  }

  // 刃尖相向倒下，握柄同步向两侧滑退；平放后两剑尖之间保留间隙。
  function luFallenSwordPose(e,side) {
    var delay=side<0?0:0.09,u=clamp01((e-delay)/1.05),turn=u*u;
    var angle=-side*mix(0.88,Math.PI/2,turn);
    var retreat=u*u*(3-2*u);
    var y=23+3.5*u+0.5*Math.sin(Math.PI*u);
    var hit=e-delay-1.05;
    if(hit>0 && hit<0.25) {
      var bounce=Math.sin(hit/0.25*Math.PI)*(1-hit/0.25);
      y-=bounce*0.65;angle+=side*bounce*0.045;
    }
    return {x:side*mix(13,44.5,retreat),y:y,angle:angle};
  }

  // 27.98–32.35：锁链金冠压下 → 红晶受压、冠身开裂 → 双心脉动。
  function lu_s1_crown(c, t, top, bt, elapsed) {
    var e=elapsed,cx=(c.w-1)/2;
    // 位移按时间平方增长，落到底部之前持续加速，不再缓出减速。
    var fall=clamp01((e-0.35)/1.45),press=fall*fall;
    var crack=clamp01((e-1.9)/0.45),impact=e-2.35;
    // 80ms 顿挫之后才释放碎块，随后按重力下坠。
    var age=Math.max(0,impact-0.08),release=clamp01(age/0.8);
    var crownY=mix(-8,21,press),spread=age*9+age*age*7,drop=age*age*19;
    var savedX=c.sx,savedY=c.sy;
    if(impact>=0 && impact<0.32) {
      c.sx+=Math.round(Math.sin(impact*78)*2.4*Math.exp(-impact*9));
      c.sy+=Math.round(Math.cos(impact*62)*1.7*Math.exp(-impact*10));
    }
    luIntroRoom(c,t,top,bt);
    // 保留盾座和绶带的尺度；两把实体长剑独立倾倒，不再缩景或降低刃面亮度。
    luIronBackdrop(c,t,top,bt,3.66);

    // 厚重的三层石台在受力处断开；红色裂缝从中心向两侧蔓延。
    for(var tier=0;tier<3;tier++) {
      var py=bt-3+tier,half=23+tier*8;
      c.line(cx-half,py,cx+half,py,tier===0?'▄':'▓',tier===0?N:G);
    }
    if(crack>0) for(var side=-1;side<=1;side+=2) {
      c.line(cx,bt-3,cx+side*12*crack,bt-2,'/',R);
      c.line(cx+side*12*crack,bt-2,cx+side*30*crack,bt-1,'─',R);
    }

    for(var swordSide=-1;swordSide<=1;swordSide+=2) {
      var sword=luFallenSwordPose(e,swordSide);
      luIronBlade(c,cx+sword.x,sword.y,sword.angle,false,3.66,swordSide);
      var hit=e-(swordSide<0?1.05:1.14);
      if(hit>=0 && hit<0.28) for(var chip=0;chip<8;chip++) {
        var hs=hash16(chip*73+9),reach=hit*(14+hs%20);
        c.put(cx+swordSide*(20+reach),bt-3-Math.sin(hit/0.28*Math.PI)*(hs%3),'.',hit<0.1?B:G);
      }
    }

    // 心核先被冠冕压扁；断裂后两个完整心核向下一镜的双心位置展开。
    if(release===0) luCrownHeart(c,cx,26,1.05,1-press*0.48,crack>0.1);
    else for(side=-1;side<=1;side+=2) {
      luBeatingHeart(c,cx+side*14*release,mix(26,18,release),t,side<0?0:0.18,mix(0.5,0.95,release));
    }

    for(side=-1;side<=1;side+=2) {
      // 断开的半冠翻转下坠；几何面、镶边和宝石共用同一个局部坐标系。
      var tilt=-side*age*0.42,cs=Math.cos(tilt),sn=Math.sin(tilt);
      function point(x,y) {
        var xx=x*side;
        return [cx+side*spread+xx*cs-y*2*sn,crownY+drop+xx*sn/2+y*cs];
      }
      function face(points,st,ch) {
        luCoalFacet(c,points.map(function(p) {return point(p[0],p[1]);}),st,ch);
      }
      // 链环逐节旋转解体，最后只剩顺风飘散的金色细屑。
      var anchor=point(30,-1);
      for(var link=0;link<10;link++) {
        var pose=luCrownChainPose(cx,top,side,link,age,anchor,press);
        if(!pose)continue;
        if(pose.fade<0.32) { c.put(pose.x,pose.y,pose.fade<0.14?'.':'/',G);continue; }
        var verts=[[-1.5,0],[0,-0.8],[1.5,0],[0,0.8]],ca=Math.cos(pose.angle),sa=Math.sin(pose.angle);
        for(var edge=0;edge<4;edge++) {
          var q=verts[edge],r=verts[(edge+1)%4];
          c.line(pose.x+q[0]*ca-q[1]*2*sa,pose.y+q[0]*sa/2+q[1]*ca,
            pose.x+r[0]*ca-r[1]*2*sa,pose.y+r[0]*sa/2+r[1]*ca,
            edge%2?'/':'\\',pose.fade<0.6?G:edge===1?B:N);
        }
      }
      var outline=[[0,-14],[8,-4],[16,-11],[22,-3],[33,-9],[30,0],[29,4],[0,4]];
      face(outline.map(function(p) {return [p[0]+0.8,p[1]+0.6];}),R,'▓');
      face(outline,B);
      // 中央高尖、两侧尖的左右切面与窄高光。
      face([[0,-14],[0,0],[8,-4]],N);
      face([[16,-11],[12,0],[21,-2]],N);
      face([[33,-9],[26,0],[30,0]],N);
      face([[0,-13],[1,-10],[1,-1],[0,-1]],W);
      face([[16,-10],[17,-8],[14,0],[13,0]],W);
      face([[32,-8],[32,-6],[29,0],[28,0]],W);
      face([[0,0],[30,0],[29,1],[0,1]],W);
      face([[0,1],[29,1],[28,3],[0,3]],N,'▓');
      face([[0,3],[29,3],[29,4],[0,4]],B);
      for(var gem=0;gem<2;gem++) {
        var gx=9+gem*13;
        face([[gx,0.6],[gx-3,2],[gx,3.4],[gx+3,2]],R);
        face([[gx,1],[gx-1.5,2],[gx,2.6]],W);
      }
      // 静止裂口变为真正分开的轮廓，裂隙从中心沿冠带延展。
      if(crack>0 && release<0.7) {
        var previous=point(0,-9);
        for(var k=1;k<=8*crack;k++) {
          var next=point((k%2?1:3)*crack,-9+k*1.6);
          c.line(previous[0],previous[1],next[0],next[1],'█',K);
          c.put(next[0]+side,next[1],'+',R);
          previous=next;
        }
      }
    }
    // 金屑沿弹道外抛，中心只保留连接两颗心核的红色脉冲。
    if(release>0) {
      for(var i=0;i<22;i++) {
        var seed=hash16(i*151+29),dir=i%2?1:-1;
        var xx=cx+dir*(4+age*(12+seed%28));
        var yy=21-age*(4+seed%13)+age*age*24;
        c.put(xx,yy,i%3?'◆':'+',age<0.5?B:R);
      }
      for(var step=0;step<=28*release;step++) {
        var x=cx-14*release+step;
        var y=18+Math.sin(step*0.8-e*8)*0.7*release;
        c.put(x,y,'·',R);
      }
    }

    // 压断瞬间的白热断面、贴地冲击环和横向尘浪，随后迅速熄灭。
    if(impact>=0 && impact<0.48) {
      if(impact<0.09) c.line(cx,8,cx,26,'█',W);
      var shock=clamp01(impact/0.48);
      for(var dust=0;dust<34;dust++) {
        var seed=hash16(dust*47),dir=dust%2?1:-1;
        var dx=cx+dir*(6+shock*(18+seed%24));
        var dy=bt-3-Math.sin(shock*Math.PI)*(seed%4);
        c.put(dx,dy,shock<0.25?'▓':':',shock<0.25?B:G);
      }
      luRing(c,cx,26,4+shock*42,'─',shock<0.25?W:R,2);
    }
    // 入场零帧与前镜完全一致；下一帧开始由实体剑的旋转接续。
    if(e===0) {
      var entry=new CCanvas(c.w,c.h);entry.clip=[top+1,bt-1];
      lu_s1_iron(entry,27.98,top,bt,3.66);
      for(var y=top+1;y<bt;y++)for(var x=2;x<c.w-2;x++) {
        var cell=entry.cells[y][x];c.put(x,y,cell[0],cell[1]);
      }
    }
    c.sx=savedX;c.sy=savedY;
    clearRect(c,0,top,c.w,1);
    c.put(3,top,e<1.9?'13 / THE WEIGHT OF GOLD':e<2.43?'14 / CAN YOU FEEL MY PAIN':'15 / BLOOD REMEMBERS',N);
    c.put(c.w-22,top,e<1.9?'CROWN / DESCENDING':e<2.43?'LOAD / FRACTURE':'PULSE / LINKED',R);
    clearRect(c,0,bt,c.w,1);
    c.center(bt,e<2.43?'HEAVY IS THE CROWN':'ONE WOUND / TWO HEARTS',B);
  }

  // ===== 血脉段 32.35–48.17 粒度细分：4 子场景 =====

  // 32.35–36.25：双心从废冠上浮起，血脉展开，错拍逐步锁成同一节律。
  function lu_s2_pulse(c,t,top,bt,elapsed) {
    var e=elapsed,cx=(c.w-1)/2,cy=18;
    var open=clamp01(e/1.25),ease=open*open*(3-2*open);
    var spread=mix(14,24,ease),size=mix(0.95,1.3,ease);
    var sync=clamp01((e-1.65)/1.6);
    luIntroRoom(c,t,top,bt);

    // 粗细分层的上下血管形成闭环；高亮血珠沿管壁行走，不用随机雪花。
    for(var side=-1;side<=1;side+=2)for(var branch=-1;branch<=1;branch+=2) {
      for(var k=0;k<=58;k++) {
        var u=k/58,x=cx+side*(7+u*47*ease);
        var arch=Math.sin(u*Math.PI)*7*ease;
        var y=cy+branch*(4+arch);
        var flow=mod(u-t*0.65+side*0.13,1);
        c.put(x,y+branch,'▓',R);
        c.put(x,y,'▒',flow<0.1?B:R);
        if(flow<0.04)c.put(x,y,'█',W);
        if(k%13===0 && u>0.2) {
          c.line(x,y+branch,cx+side*(10+u*52),y+branch*4,'·',G);
          c.put(cx+side*(10+u*52),y+branch*4,'◆',R);
        }
      }
    }
    // 中央心电脉冲随血珠从左向右行进；同步后双方使用相同的双拍相位。
    for(var x=cx-spread+9;x<=cx+spread-9;x++) {
      var dx=x-(cx-10+mod((t-30.5)*1.1,1)*20);
      var ecg=(-Math.exp(-dx*dx/1.8)*4+Math.exp(-Math.pow(dx-2.2,2)/2.4)*2)*ease;
      c.put(x,cy+ecg,'─',Math.abs(dx)<4?W:R);
    }
    for(side=-1;side<=1;side+=2) {
      var phase=side<0?0:0.18*(1-sync);
      luBeatingHeart(c,cx+side*spread,cy,t,phase,size);
      // 收缩与扩张同时推动下方的压力刻线，强化可见节律。
      var power=luHeartBeat(t,phase),meter=Math.floor(3+power*12);
      for(var n=0;n<15;n++)c.put(cx+side*spread-7+n,bt-3,'▄',n<meter?B:G);
    }
    if(e>1.7) c.center(7,sync<1?'S Y N C H R O N I Z I N G':'O N E   R H Y T H M',W);

    // 冠冕残骸下沉出画面，中心先露出连续跳动的心核，避免分镜重置心跳。
    if(e<0.65) {
      var entry=new CCanvas(c.w,c.h);entry.clip=[top+1,bt-1];
      lu_s1_crown(entry,32.35,top,bt,4.37);
      var gap=clamp01(e/0.65)*c.w*0.6;
      for(var y=top+1;y<bt;y++)for(x=2;x<c.w-2;x++) {
        if(e>0 && Math.abs(x-cx)<gap)continue;
        var oy=Math.floor(y-e*9);
        if(oy<=top||oy>=bt)continue;
        var cell=entry.cells[oy][x];c.put(x,y,cell[0],cell[1]);
      }
    }
    clearRect(c,0,top,c.w,1);
    c.put(3,top,e<1.7?'16 / I CAN HEAR YOUR PULSE':'17 / GOT YOU IN MY VEINS',N);
    c.put(c.w-22,top,sync<1?'PULSE / ACQUIRING':'PULSE / IN UNISON',R);
    clearRect(c,0,bt,c.w,1);
    c.center(bt,sync<1?'TWO HEARTS / ONE BLOODLINE':'YOUR PULSE RUNS THROUGH ME',B);
  }

  // 36.25–40.35：双心沿血管合流 → 角冠与翼膜展开 → 同一颗魔性心核共振。
  function lu_s2_demonic(c,t,top,bt,elapsed,fold) {
    var e=elapsed,cx=(c.w-1)/2,cy=18;
    var merge=clamp01(e/1.55),pull=merge*merge*(3-2*merge);
    var open=clamp01((e-1.35)/1.1),unfurl=1-Math.pow(1-open,3);
    unfurl*=1-clamp01(fold||0);
    var power=luHeartBeat(t,0),breath=1+power*0.045;
    luIntroRoom(c,t,top,bt);

    // 上一镜的大血管向中央收束，形成魔翼背后的供血弧线。
    for(var side=-1;side<=1;side+=2)for(var branch=-1;branch<=1;branch+=2) {
      for(var k=0;k<=58;k++) {
        var u=k/58,x=cx+side*(7+u*47*(1-pull*0.35));
        var y=cy+branch*(4+Math.sin(u*Math.PI)*7*(1-pull*0.3));
        var flow=mod(u-t*0.65+side*0.13,1);
        c.put(x,y+branch,'▓',R);
        c.put(x,y,'▒',flow<0.1?B:R);
        if(flow<0.04)c.put(x,y,'█',W);
      }
    }

    // 宽幅翼膜展开而非线框双角；每片膜有暗红内面、金色骨架和锋利尾尖。
    if(unfurl>0) for(side=-1;side<=1;side+=2) {
      var flex=Math.sin(e*3.2+side*0.3)*0.65*unfurl;
      function wing(points,st,ch) {
        luCoalFacet(c,points.map(function(p) {
          return [cx+side*(10+p[0]*unfurl)*breath,cy+(p[1]+Math.abs(p[0])/37*flex)*unfurl];
        }),st,ch);
      }
      wing([[0,-2],[12,-7],[36,-10],[29,-3],[40,5],[28,3],[23,10],[14,5],[6,11],[0,4]],R,'▓');
      wing([[2,-1],[13,-5],[32,-8],[23,-1],[35,4],[22,2],[19,7],[12,3],[7,8]],R,'▒');
      wing([[1,-2],[12,-7],[36,-10],[13,-5],[2,0]],B);
      wing([[11,-5],[14,-5],[25,2],[23,8],[21,2]],N);
      wing([[1,0],[3,-1],[14,4],[7,9],[10,4]],N);
      wing([[13,-5],[15,-4],[37,4],[32,3]],B);
    }

    // 两颗心保持原来的绝对时间心跳，汇合时尺寸连续过渡到中央大心核。
    var heartSize=mix(1.3,1.9,unfurl);
    if(merge<1) {
      for(side=-1;side<=1;side+=2)
        luBeatingHeart(c,cx+side*24*(1-pull),cy,t,0,heartSize);
    } else luBeatingHeart(c,cx,cy,t,0,heartSize);

    if(unfurl>0) {
      // 双角从心核两瓣延伸，色面和高光随同一开合比例成长。
      for(side=-1;side<=1;side+=2) {
        function horn(points,st,ch) {
          luCoalFacet(c,points.map(function(p) {return [cx+side*p[0],cy-4+(p[1]-cy+4)*unfurl];}),st,ch);
        }
        horn([[8,15],[12,8],[23,5],[20,9],[17,9],[15,16]],R,'▓');
        horn([[9,14],[13,8],[22,5],[17,10],[14,15]],B);
        horn([[12,12],[14,8],[20,6],[15,10]],W);
      }
      // 眼缝是心核中的切面光，避免画成单薄的人物五官。
      if(open>0.45) {
        luCoalFacet(c,[[cx-11,16],[cx-3,18],[cx-4,19],[cx-10,18]],W);
        luCoalFacet(c,[[cx+11,16],[cx+3,18],[cx+4,19],[cx+10,18]],W);
        c.put(cx,22,'◆',power>0.5?W:B);
      }
      if(e>2.5) {
        // 同心震波跟随双拍外扩，尖角符印围绕翼根交替亮起。
        var wave=mod((t-30.5)*1.1-0.15,1);
        if(wave<0.65)luRing(c,cx,cy,18+wave*35,'·',wave<0.15?B:R,3);
        for(var i=0;i<6;i++) {
          var a=i*TAU/6+e*0.18;
          c.put(cx+Math.cos(a)*47,cy+Math.sin(a)*12,'◆',power>0.6?B:R);
        }
      }
    }

    // 第一个瞬间逐格接住前镜，随后中心先露出正在合流的双心。
    if(e<0.32) {
      var entry=new CCanvas(c.w,c.h);entry.clip=[top+1,bt-1];
      lu_s2_pulse(entry,t,top,bt,3.9);
      var gap=clamp01(e/0.32)*c.w*0.6;
      for(var y=top+1;y<bt;y++)for(var x=2;x<c.w-2;x++) {
        if(e>0 && Math.abs(x-cx)<gap)continue;
        var cell=entry.cells[y][x];c.put(x,y,cell[0],cell[1]);
      }
    }
    clearRect(c,0,top,c.w,1);
    c.put(3,top,e<1.55?'18 / TWO SOULS CONVERGE':'19 / SYNERGY DEMONIC',N);
    c.put(c.w-23,top,e<1.55?'CORE / CONVERGING':'POWER / RESONATING',R);
    clearRect(c,0,bt,c.w,1);
    c.center(bt,e<1.55?'ONE RHYTHM / ONE CORE':'OUR BLOOD / OUR POWER',B);
  }

  // 杏仁形实体眼：厚眼睑、金色虹膜，闭眼时上下轮廓连续合拢。
  function luWitnessEye(c,cx,cy,width,open,look) {
    for(var y=Math.floor(cy-4);y<=Math.ceil(cy+4);y++)for(var x=Math.floor(cx-width);x<=Math.ceil(cx+width);x++) {
      var nx=(x-cx)/width,dy=Math.abs(y-cy);
      var lid=(1-nx*nx)*3*open;
      if(Math.abs(nx)>1||dy>lid+0.6)continue;
      if(dy>Math.max(0,lid-0.65))c.put(x,y,'▄',N);
      else if(Math.abs(x-cx-look)<1.2)c.put(x,y,'█',K);
      else if(Math.abs(x-cx-look)<3)c.put(x,y,'█',B);
      else c.put(x,y,'▒',R);
    }
  }

  // 40.35–44.17：魔翼收束成圣像面具 → 注视之眼闭合 → 裂面显露真实伤口。
  function lu_s2_worship(c,t,top,bt,elapsed) {
    var e=elapsed,cx=(c.w-1)/2,cy=18;
    var fold=clamp01(e/1.0),rise=clamp01((e-0.2)/0.9);
    var crack=clamp01((e-1.85)/0.65),split=clamp01((e-2.5)/0.85);
    // 同一副魔翼逐渐收拢，保留心核位置与绝对时间心跳。
    lu_s2_demonic(c,t,top,bt,4.1,fold);

    if(fold>0) {
      // 放射圣环只作为面具背后的轮廓，光芒有明确间距。
      for(var ray=0;ray<24;ray++) {
        var a=ray/24*TAU,rr=25+Math.sin(e*1.2)*0.6;
        c.line(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr/2,
          cx+Math.cos(a)*(rr+3*fold),cy+Math.sin(a)*(rr+3*fold)/2,'·',G);
      }
      // 只保留六只较大的眼，避免密集小字符形成杂乱背景。
      for(var side=-1;side<=1;side+=2)for(var row=0;row<3;row++) {
        var delay=row*0.13+(side>0?0.1:0),shut=clamp01((e-1.8-delay)/0.9);
        var eyeY=9+row*9,eyeX=cx+side*(row===1?43:38);
        luWitnessEye(c,eyeX,eyeY,10*fold,fold*(1-shut),-side*2);
        if(shut<1)c.put(eyeX,eyeY+4,'·',R);
      }
    }

    // 面具从心核两瓣长出；开裂后两半侧移并下沉，露出脉动的伤口。
    if(rise>0) {
      for(side=-1;side<=1;side+=2) {
        var shift=split*14,tilt=side*split*0.24,cs=Math.cos(tilt),sn=Math.sin(tilt);
        function face(points,st,ch) {
          luCoalFacet(c,points.map(function(p) {
            var x=p[0]*side,y=p[1];
            return [cx+side*shift+(x*cs-y*2*sn)*rise,
              cy+(x*sn/2+y*cs)*rise+split*split*3];
          }),st,ch);
        }
        face([[0,-11],[11,-10],[17,-5],[15,4],[9,9],[0,12]],N);
        face([[0,-11],[10,-9],[14,-4],[12,4],[7,8],[0,11]],B);
        face([[0,-10],[3,-8],[3,7],[0,10]],W);
        face([[10,-8],[14,-4],[12,4],[7,8],[9,1]],N,'▓');
        // 深眼窝与窄唇，脸面保持雕像的几何感。
        face([[3,-3],[12,-4],[10,-1],[5,0]],K,' ');
        face([[4,-2],[10,-3],[8,-1],[5,-1]],R);
        face([[2,1],[5,4],[1,5],[0,4]],N);
        face([[0,7],[6,6],[4,8],[0,9]],R,'▓');
        if(crack>0) {
          var previous=[0,-10];
          for(var seg=1;seg<=10*crack;seg++) {
            var next=[seg%2?2:0.5,-10+seg*2];
            face([[previous[0],previous[1]],[next[0],next[1]], [next[0]+1.2,next[1]],[previous[0]+1.2,previous[1]]],R);
            previous=next;
          }
        }
      }
    }
    // 裂口中的心核与白热疤痕放在两半面具之间，轮廓随双拍收缩扩张。
    if(split>0) {
      luBeatingHeart(c,cx,cy,t,0,mix(0.65,1.35,split));
      var scarY=cy-6,scarX=cx-3;
      for(var k=0;k<7;k++) {
        var xx=cx+(k%2?2:-2),yy=cy-6+k*1.8;
        c.line(scarX,scarY,xx,yy,'/',k%2?W:R);scarX=xx;scarY=yy;
      }
      for(var i=0;i<12;i++) {
        var seed=hash16(i*157),dir=i%2?1:-1;
        c.put(cx+dir*(6+split*(7+seed%12)),cy+split*split*11-(seed%9),'◆',split<0.5?B:R);
      }
    }
    clearRect(c,0,top,c.w,1);
    c.put(3,top,e<1.85?'20 / THEY WORSHIP THE MASK':'21 / THEY NEVER SEE THE SCARS',N);
    c.put(c.w-22,top,e<1.85?'GAZE / FIXATED':'TRUE SIGHT / NONE',R);
    clearRect(c,0,bt,c.w,1);
    c.center(bt,e<1.85?'GOLD ON THE OUTSIDE':'BROKEN HEART / HIDDEN SCARS',B);
  }

  // 正面椭圆环与侧向窄环交替相扣，金属厚边内保留可辨的孔洞。
  function luLifelineLink(c,x,y,angle,edge,flash) {
    var cs=Math.cos(angle),sn=Math.sin(angle),minor=4.0;
    if(edge) {
      c.line(x-5*cs,y-2.5*sn,x+5*cs,y+2.5*sn,'═',flash?W:B);
      return;
    }
    for(var yy=-4;yy<=4;yy++)for(var xx=-6;xx<=6;xx++) {
      var u=xx*cs+yy*2*sn,v=-xx*sn+yy*2*cs;
      var outer=u*u/28+v*v/(minor*minor);
      var inner=u*u/12+v*v/(edge?0.12:3.2);
      if(outer<=1 && inner>=1)c.put(x+xx,y+yy,outer>0.72?'█':'▓',flash?W:v<0?B:N);
    }
  }

  // 末段骤然绷紧，随后沿链传播两次衰减回弹；震颤只存在于拉紧瞬间。
  function luLifelinePose(e,strand,k) {
    var dir=strand?1:-1,pre=clamp01(e/0.92),snap=clamp01((e-0.92)/0.26);
    var ease=e<0.92?0.66*pre*pre:mix(0.66,1,1-Math.pow(1-snap,2));
    var x=k*6.8+dir*(1-ease)*27,amp=mix(7,2.5,ease);
    var age=e-1.18-Math.abs(k)*0.006;
    var impulse=age>0 && age<0.64?Math.sin(age*40)*Math.exp(-age*7)*Math.pow(1-age/0.64,2):0;
    var shake=dir*1.6*impulse;
    x+=dir*1.3*impulse;
    var y=dir*Math.tanh(x/15)*amp+shake;
    return {x:x,y:18+y,angle:Math.atan(dir*amp/15*(1-Math.pow(Math.tanh(x/15),2))*2),
      age:e-2.02-Math.abs(k)*0.105-strand*0.035};
  }

  function luLifelineRibbons(c,t,e,cx,cy,size) {
    var loose=clamp01((e-2.2)/1.35),phase=luHeartBeat(t,0);
    for(var side=-1;side<=1;side+=2)for(var n=0;n<53*loose;n++) {
      var u=n/53,x=cx+side*(4+n),y=cy+side*Math.sin(u*4.6-e*1.8)*3.5*loose;
      var width=1.2+Math.sin(u*Math.PI)*1.2;
      c.line(x,y-width,x,y+width,'▒',R);c.put(x,y,'▓',R);
      if(n%3===0)c.put(x,y-width,'─',phase>0.45?B:N);
    }
    luBeatingHeart(c,cx,cy,t,0,size);
  }

  // 44.17–48.17：双链绞合束心 → 锁扣崩裂 → 逐节粉碎，红色生命线留存。
  function lu_s2_chains(c,t,top,bt,elapsed) {
    var e=elapsed,cx=(c.w-1)/2,cy=18;
    var release=clamp01((e-2.02)/1.55),heartSize=mix(1.35,1.12,clamp01(e/1.3))*(1-0.14*release);
    luIntroRoom(c,t,top,bt);
    luBeatingHeart(c,cx,cy,t,0,heartSize);
    if(e>2.2)luLifelineRibbons(c,t,e,cx,cy,heartSize);
    for(var strand=0;strand<2;strand++)for(var k=-10;k<=10;k++) {
      var p=luLifelinePose(e,strand,k),x=cx+p.x,y=p.y,age=p.age;
      if(age<0.09) {
        luLifelineLink(c,x,y,p.angle,(k+strand)%2===0,age>=0);
        if(age>=0)c.line(x-2,y-2,x+2,y+2,'/',W);
      } else if(age<0.78) {
        // 每节链沿自身环周碎成八块，短促外爆后下坠，最后细化为金尘。
        var a=age-0.09;
        for(var j=0;j<8;j++) {
          var seed=hash16((k+12)*337+strand*173+j*29),theta=j/8*TAU+p.angle;
          var vx=Math.cos(theta)*(7+seed%9)+(k<0?-4:4);
          var vy=Math.sin(theta)*(4+seed%5);
          var px=x+Math.cos(theta)*4+vx*a,py=y+Math.sin(theta)*1.5+vy*a+9*a*a;
          if(a<0.25)c.line(px,py,px-Math.cos(theta)*1.7,py-Math.sin(theta)*0.8,j%2?'■':'▄',a<0.1?W:B);
          else if(a<0.49)c.put(px,py,j%2?'+':'*',N);
          else if(seed%3!==0)c.put(px,py,'.',G);
        }
      }
    }
    if(e>0.75 && e<2.2) {
      luCoalFacet(c,[[cx,cy-3],[cx-5,cy],[cx,cy+3],[cx+5,cy]],B);
      luCoalFacet(c,[[cx,cy-1.5],[cx-2,cy],[cx,cy+1.5],[cx+2,cy]],R);
      if(e>1.78)c.line(cx-1,cy-2,cx+1,cy+2,'/',e>2.02?W:R);
    }
    if(e>=2.02 && e<2.3)luRing(c,cx,cy,3+(e-2.02)*65,'·',e<2.1?W:B,2);
    if(e<0.65) {
      var entry=new CCanvas(c.w,c.h);entry.clip=[top+1,bt-1];lu_s2_worship(entry,t,top,bt,3.82);
      var gap=clamp01(e/0.65)*c.w*0.6;
      for(var y=top+1;y<bt;y++)for(var x=2;x<c.w-2;x++) {
        if(e>0 && Math.abs(x-cx)<gap)continue;
        var ox=Math.round(x-(x<cx?-1:1)*e*10);if(ox<2||ox>=c.w-2)continue;
        var cell=entry.cells[y][ox];c.put(x,y,cell[0],cell[1]);
      }
    }
    clearRect(c,0,top,c.w,1);c.put(3,top,e<2.02?'22 / GOLD CHAINS, ONE BOND':'23 / SHATTER EVERY LINK',N);
    c.put(c.w-23,top,e<2.02?'TENSION / INTERLOCKED':'FRACTURE / CASCADE',R);
    clearRect(c,0,bt,c.w,1);c.center(bt,e<2.02?'TWO CHAINS / ONE SHARED WOUND':'GOLD INTO DUST / LIFE GOES ON',B);
  }
  // ===== 导歌一 48.17–64.40 粒度细分：2 子场景 =====

  // 块状值噪声：块大小 cs×cy，块间双线性平滑。白光消散用它决定哪一块先漏空——
  // 纯 hash 分块的边界是直角，整屏读成"打马赛克"；平滑之后碎块有弧度，才像光被撕开。
  function luBlockNoise(x,y,cs,cy,seed) {
    var gx=x/cs,gy=y/cy,ix=Math.floor(gx),iy=Math.floor(gy);
    var fx=gx-ix,fy=gy-iy;
    fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
    var a=hash16(ix*37+iy*71+seed),b=hash16((ix+1)*37+iy*71+seed),
        c2=hash16(ix*37+(iy+1)*71+seed),d=hash16((ix+1)*37+(iy+1)*71+seed);
    var t=a+(b-a)*fx,u=c2+(d-c2)*fx;
    return (t+(u-t)*fy)/65535;
  }

  // 白光＝圆形灰度渐变。三件事让它像"光"而不像"面团"或"雪花"：
  // ① 全部只用白色（W），靠字符自身的墨量分级 █>▓>▒>░>·，不掺金/暗色 ⇒ 不会出现色环；
  // ② 分级阈值连续（同一档内部是完全一样的灰度），等值线被渐变抹匀，读成灰度过渡；
  // ③ 只有最外一档做概率抽样，中心与中区是连续墨面 ⇒ 不会整屏都是噪点。
  // R=光晕直径，bright=亮度包络，narrow=横向压缩（起点是一条竖缝而不是一个小圆点），
  // dissolve=块状溶解进度（淡出用）。cy 是光心，必须由调用方给成门洞中缝的高度。
  function luWhiteFlood(c,cx,cy,R,bright,top,bt,t,narrow,dissolve) {
    if(R<=0.02||bright<=0.02)return;
    if(narrow===undefined)narrow=1;
    if(dissolve===undefined)dissolve=0;
    var save=c.clip;c.clip=null;
    // hh 决定光的形状。字符格是 1 列×2 行，所以视觉半径相等要求 hh = hw/2；
    // 取 0.425*(bt-top)≈11.9 行而横向铺到 59.5 列，等于把圆压扁 2.5 倍——
    // 那才是"一直是个扁椭圆"的真正原因。取 hw/2 后 R=1 的光斑正好横到左右边、
    // 纵向溢出上下边 ⇒ 读成圆，圆的上下被画幅裁掉，符合"光扩到全屏"。
    var hw=59.5,hh=Math.max(6,hw*0.5),my=cy;
    // 光缝阶段把上半压扁 1.4 倍：否则竖缝会一直顶到画幅上沿，像一根从天上垂下来的灯管；
    // 压扁后上端收在拱券以内，才读成"光是从这道门里透出来的"。张开成圆时自动放开。
    var sq=mix(1.30,1,clamp01((1-narrow)/0.88));
    // 淡出不走"整屏一起降亮"，走块状抽样：大块决定塌陷范围、小块啃边缘，亮度越高越耐
    // ⇒ 光从边缘开始成片碎掉、亮核最后散。逐格独立抽样会得到均匀雪花，成块才像"光在蒸发"。
    for(var y=top;y<=bt;y++) {
      // 软边只留一行、且不压到零：光的边界就是画面边界。原来上下各 4 行渐变到黑，
      // 峰值时上下各留两道暗带，整团读成"悬在中间的扁椭圆"而不是铺满全屏。
      var edge=1;
      if(y<top+2)edge=mix(0.90,1,(y-top)/2);
      else if(y>bt-2)edge=mix(0.90,1,(bt-y)/2);
      for(var x=0;x<c.w;x++) {
        var ax=(x-cx)/(hw*narrow),ay=(y-my)/hh;
        if(ay<0)ay*=sq;
        var r=Math.hypot(ax,ay);
        var ang=Math.atan2(ay,ax*narrow);
        var wob=1+0.05*Math.sin(ang*3.0+t*0.7)+0.03*Math.sin(ang*5.0-t*1.1);
        var q=r/(R*wob);
        if(q>=1)continue;
        var u=1-q;
        var cov=clamp01(u*1.5),v=cov*bright*edge;
        if(dissolve>0) {
