      for (x = 4; x < c.w - 4; x++) { c.put(x, by + 2, '▒', R); c.put(x, by - 1, '▓', R); }
    }
  }

  // 红走廊（MV 113.2–113.4）：两列竖柱向灭点收拢，尽头一团亮光。
  function luAisle(c, t, top, bt, push) {
    var k = 1 + push * 0.30, ZS = [3.6, 2.4, 1.55, 1.0, 0.62], b, side, y, x, zz, off, wc, ty2, by2;
    luHeat(c, t, top, bt, 0.7);
    for (b = 0; b < ZS.length; b++) {
      zz = ZS[b]; off = 52 * k / zz; wc = Math.max(1.2, 5 / zz);
      ty2 = top + 2 + 14 / zz; by2 = 28 - 3 + 6 / zz;
      for (side = -1; side <= 1; side += 2) {
        var px = 60 + side * off;
        if (px < -6 || px > c.w + 6) continue;
        for (y = Math.max(top, ty2); y <= Math.min(bt - 1, by2); y++) {
          for (x = px - wc; x <= px + wc; x++) c.put(x, y, ' ', D);
          c.put(px + side * wc, y, '▓', R);
        }
      }
    }
    // 尽头的光
    for (y = top; y < bt; y++) for (x = 48; x < 72; x++) {
      var dd = Math.sqrt((x - 60) * (x - 60) + ((y - 20) * 2) * ((y - 20) * 2));
      if (dd < 5) c.put(x, y, '█', W);
      else if (dd < 9) { if (hash16(x * 3 + y * 7) % 100 < 62) c.put(x, y, '▓', N); }
      else if (dd < 15 && hash16(x * 5 + y * 11) % 100 < 34) c.put(x, y, '▒', N);
    }
  }

  // 纯红闪（MV 114.0）+ 右下角白色飞溅
  function luRedFlash(c, t, top, bt) {
    // 飞溅要随帧往上跑，否则 4 帧一模一样（红闪本来就只剩"动"这一个信息）
    var x, y, i, hx, hy, rise = Math.round(t * 42);
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++)
      c.put(x, y, hash16(x * 3 + y * 9 + rise) % 100 < 22 ? '▓' : '█', R);
    for (i = 0; i < 44; i++) {
      hx = hash16(i * 37 + 5); hy = hash16(i * 71 + 13);
      c.put(68 + (hx + rise) % 48, 23 + (hy + Math.round(t * 17)) % 8, i % 3 ? '·' : '█', W);
    }
  }

  // 11 个硬切：起止都相对 96.03，跨 100.00 不重置
  var LU_L7 = [
    [0.00, 0.97, 'claw', '50 / MACHINE HEART', 'CLAW / CLOSED', 'THE MACHINE / HAS A HEART'],
    [0.97, 2.87, 'whip', '50 / MACHINE HEART', 'WHIP / PAN', 'THE ROOM / SPINS PAST'],
    [2.87, 3.37, 'hall', '50 / MACHINE HEART', 'HALL / VAST', 'ONE HALL / ONE THRONE'],
    [3.37, 3.77, 'flash', '51 / ONE MIND', 'FLASH / WHITE', 'WHITE / THEN NOTHING'],
    [3.77, 4.22, 'word', '51 / ONE MIND', 'WORD / CARVED', 'ONE MIND / ONE HEART'],
    [4.22, 5.07, 'pose', '51 / ONE MIND', 'HER / STAND', 'SHE DOES NOT / KNEEL'],
    [5.07, 5.77, 'claw2', '51 / ONE MIND', 'TEETH / AGAIN', 'THE MACHINE / HAS A HEART'],
    [5.77, 6.57, 'bars', '51 / ONE MIND', 'BARS / BEHIND', 'BARS DO NOT / HOLD HER'],
    [6.57, 6.92, 'aisle', '51 / ONE MIND', 'AISLE / RED', 'THE AISLE / IS RED'],
    [6.92, 7.27, 'gear', '51 / ONE MIND', 'WHEEL / TURNING', 'THE WHEEL / KEEPS TURNING'],
    [7.27, 7.52, 'red', '51 / ONE MIND', 'BLOOD / FLASH', 'RED / AND NOTHING ELSE']
  ];

  function lu_s7_montage(c, t, top, bt, e) {
    var s = LU_L7[LU_L7.length - 1], i, u, k;
    for (i = 0; i < LU_L7.length; i++) if (e < LU_L7[i][1]) { s = LU_L7[i]; break; }
    u = clamp01((e - s[0]) / (s[1] - s[0]));
    k = 1 + 0.12 * u;
    switch (s[2]) {
      case 'claw':
        luHeat(c, t, top, bt, 1.0);
        luGearRing(c, 74, 17, 20 + u * 3, t * 0.5, N, B);
        luClaw(c, 44 - u * 5, 15 + u * 1.2, 1.0 + u * 0.28, 0.10, 0.46, 1);
        break;
      case 'whip': luWhip(c, t, top, bt, u); break;
      case 'hall': luLinkHall(c, t, top, bt, 1); break;
      case 'flash': luLinkFlash(c, t, top, bt, u); break;
      case 'word': luOneMind(c, t, top, bt); break;
      case 'pose': luLinkPose(c, t, top, bt, k); break;
      case 'claw2':
        luHeat(c, t, top, bt, 1.05);
        luClaw(c, 62, 20, 1.5, Math.PI * 0.86, 0.34, 1);
        luClaw(c, 30, 10, 0.9, 0.30, 0.40, 0);
        break;
      case 'bars': luBars(c, t, top, bt); break;
      case 'aisle': luAisle(c, t, top, bt, u); break;
      case 'gear':
        luHeat(c, t, top, bt, 0.9);
        luGearRing(c, 60, 17, 19 + u * 4, t * 2.2, N, B);
        break;
      case 'red': luRedFlash(c, t, top, bt); break;
    }
    clearRect(c, 0, top, c.w, 1);
    c.put(3, top, s[3], N);
    c.put(c.w - 19, top, s[4], R);
    clearRect(c, 0, bt, c.w, 1);
    c.center(bt, s[5], B);
  }

  // ===== 114.00–124.00（MV 114.0–124.0）：红旋涡 / 黑场 / 锁链 / 吊环 / 塔 / 红路 / 山巅 =====
  // ⚠️ 时间轴勘误（2026-11-05）：MV 烧录字幕三处对照（88.4 "Link link…"、96.4 "Link"、
  // 103.4 "It's time to step in"）＋ 188s 处是绝区零 logo，都指向 **MV t ＝ 歌曲 t**，偏移 0。
  // 之前这两段按「MV t ≈ 歌曲 t + 11s」写，内容全错（写成了岩块碑体与人物推近），据此重做。
  // ⚠️ 这一段整体亮度极低：MV 在这里故意把画面压到"看不清"，靠黑与雾制造压迫感。
  // 所以宁可画得空，也不要往里面堆细节。

  // ① 红旋涡（MV 114.2）：玫瑰/齿轮母题的螺旋特写，缓慢外扩。
  // ⚠️ 螺旋的关键是**角度里再叠 r·k**；只做 cos(a·n) 得到的是同心环（就是靶盘/雷达）。
  function lu_s8_spiral(c, t, top, bt, e) {
    var u = clamp01(e / 0.95), x, y;
    var cx = 60 + Math.sin(u * 2) * 2, cy = 17.5, spin = t * 1.5;
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      var dx = x - cx, dy = (y - cy) * 2;
      var r = Math.sqrt(dx * dx + dy * dy);
      if (r > 47) { if (hash16(x * 7 + y * 13) % 100 < 7) c.put(x, y, '·', R); continue; }
      var a = Math.atan2(dy, dx) + spin + r * 0.072;
      var I = Math.pow(Math.abs(Math.cos(a * 2.5)), 2.4) * (1.06 - r / 50);
      if (I > 0.70) c.put(x, y, '█', N);
      else if (I > 0.40) c.put(x, y, '▓', R);
      else if (I > 0.15) c.put(x, y, '▒', R);
      else if (hash16(x * 11 + y * 17) % 100 < 11) c.put(x, y, '·', R);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '45 / THE SPIRAL', N);
    c.put(c.w - 20, top, 'DOWN / AND IN', R);
    c.center(bt, 'MAYBE IT IS / A BLESSING', B);
  }

  // ② 黑场（MV 114.8–117.2，约 2.4s）：全片唯一一次真正的黑。
  // 它的作用是"喘气" —— MV 在这里几乎什么都不给，只留画面底部一点余烬在明灭。
  // ⚠️ 别怕空：塞满细节反而毁掉这个停顿。字幕必须有，否则观众以为卡住了。
  function lu_s8_blackout(c, t, top, bt, e) {
    var x, y, i, pulse = 0.5 + 0.5 * Math.sin(e * 2.4), sd = Math.round(t * 12);
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      if (y > bt - 8) {
        var d = (y - (bt - 8)) / 7;
        if (hash16(x * 13 + y * 7 + sd) % 100 < d * d * 40 * (0.45 + pulse * 0.55))
          c.put(x, y, d > 0.62 ? '▒' : '░', R);
      } else if (hash16(x * 5 + y * 11) % 100 < 3) c.put(x, y, '·', R);
    }
    for (i = 0; i < 11; i++) {
      var hs = hash16(i * 173 + 7);
      c.put(6 + hs % 108, bt - mod((hs >> 4) * 0.03 + e * 0.55, bt - top - 3), hs % 3 ? '.' : '+', hs % 4 ? R : N);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '45 / NOTHING YET', K);
    c.put(c.w - 22, top, 'STILL / BREATHING', K);
    c.center(bt, e < 1.1 ? 'EVEN THOUGH / I BEEN CURSED' : 'THE FIRE IS / STILL IN THERE', R);
  }

  // ③ 锁链地景（MV 117.4）：低机位，暗红地面上一条锁链伸向深处，背后几根黑柱。
  function lu_s8_chain(c, t, top, bt, e) {
    var u = clamp01(e / 0.97), x, y, i;
    var gy = Math.round(23 + u * 1.1), sd = Math.round(t * 10);
    for (y = top; y < gy; y++) for (x = 1; x < c.w - 1; x++) {          // 低处更浓的红雾
      var d = 22 - (gy - y) * 1.9;
      if (d > 0 && hash16(x * 7 + y * 13 + sd) % 100 < d) c.put(x, y, '·', R);
    }
    for (i = 0; i < 5; i++) {                                          // 远处几根黑柱
      var px = 10 + i * 25;
      for (y = top + 2; y < gy; y++) {
        for (x = px; x < px + 3; x++) c.put(x, y, '░', K);
        c.put(px + 3, y, '▒', R);
      }
    }
    for (x = 2; x < c.w - 2; x++) {                                    // 地面：要有厚度才托得住链
      c.put(x, gy, '▓', N);
      for (y = gy + 1; y <= gy + 3; y++) c.put(x, y, '▒', N);
      if (hash16(x * 7 + 3 + sd) % 100 < 30) c.put(x, gy + 4, '░', R);
    }
    // 锁链：一串链节，从左下伸向右上。
    // ⚠️ '○'/'◯' 是空心圆，在 7px 的字格里几乎看不见（上一版整条链消失了）；
    // 必须用实心的 ●/◉，并且左右各带一段横划，才读成"链"而不是一串点。
    // 每节 = 5 格宽 × 2 行实的链环，节间留 1 格、明暗交替 ⇒ 才读成"链"。
    // ⚠️ 3 格宽 / 1 行高的"链节"在 864px 下只有 20×18px，缩略图里就是几个点。
    for (i = 0; i < 12; i++) {
      var cx2 = Math.round(6 + i * 7.4), cy2 = Math.round(bt - 4 - i * 0.70);
      if (cy2 <= gy + 1) break;
      var cA = i % 2 ? W : N, cB = i % 2 ? N : R;
      for (x = cx2; x < cx2 + 5; x++) {
        if (x < 2 || x > c.w - 3) continue;
        c.put(x, cy2, '█', cA);
        c.put(x, cy2 + 1, '▒', cB);
      }
      for (y = cy2 + 2; y <= cy2 + 2; y++) { c.put(cx2 + 5, y, '▓', cB); c.put(cx2 + 6, y, '▓', cB); }
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '46 / WHAT HOLDS ME', N);
    c.put(c.w - 21, top, 'CHAIN / ON STONE', R);
    c.center(bt, 'IT WAS NEVER / A CROWN', B);
  }

  // ④ 红厅吊环（MV 118.2–119.4）：一个巨大的铁环吊在画面中央，她站在环下，
  // 左侧一条巨大的黑影，环上两条吊索一直通到画外。
  function lu_s8_ring(c, t, top, bt, e) {
    var u = clamp01(e / 1.28), x, y, i;
    luHeat(c, t, top, bt, 0.94);
    var rc = 14 + u * 3, cy2 = 12.5 - u * 1.0;
    for (y = top + 1; y < Math.round(cy2 - rc / 2); y++) {              // 吊索
      if (y < top || y >= bt) continue;
      c.put(56, y, '│', N); c.put(64, y, '│', N);
    }
    for (i = 0; i < 240; i++) {                                        // 铁环（空心）
      var a = i / 240 * TAU;
      for (var rr = rc - 1.0; rr <= rc + 1.0; rr += 0.55)
        c.put(Math.round(60 + Math.cos(a) * rr), Math.round(cy2 + Math.sin(a) * rr / 2), '█', N);
    }
    for (y = top + 2; y < bt - 1; y++) {                               // 左侧巨大的黑影
      var w = 15 - (y - top) * 0.22;
      if (w < 3) break;
      for (x = 5; x < 5 + w; x++) c.put(x, y, ' ', D);
      c.put(Math.round(5 + w), y, '▓', R);
    }
    var wid = 13 + u * 3;
    c.queen = { x: 60 - wid / 2, y: luActorY(wid, bt - 5, window.__LU_QUEEN_ANSI), width: wid, t: t, reveal: 1 };
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '47 / UNDER THE RING', N);
    c.put(c.w - 20, top, 'HANG / AND WAIT', R);
    c.center(bt, 'ONE RING / ONE THRONE', B);
  }

  // ⑤ 雾中塔楼（MV 119.8–121.0）：一座黑塔立在红雾里，顶上有城垛，两侧各一座小塔。
  // ⚠️ 塔是**挖黑的**（' ' D 擦掉雾），不是"画一个黑方块"——调色板里没有黑，
  // 只能把已经画上的雾擦掉，这正好是逆光剪影的做法。
  function lu_s8_tower(c, t, top, bt, e) {
    var u = clamp01(e / 1.6), x, y, i;
    var gy = 26, sd = Math.round(t * 8);
    // ⚠️ 塔靠"把雾擦掉"做剪影，背景就必须够亮：上一版雾只用 '·' 稀点（阈值×58），
    // 擦完塔与黑天糊成一片，只剩两条边缘的红线。
    // ⚠️ 而且调色板里**没有真正的黑**：' ' D 落地成 #afaf5f（暗黄），擦出来是褐块不是黑块。
    // 要最暗的剪影只能用 ' ' K（#5f5f00）。
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      var I = 0.30 + 0.70 * Math.pow(clamp01(y / gy), 1.3) + 0.10 * Math.sin(t * 0.8 + x * 0.03);
      if (hash16(x * 7 + y * 13 + sd) % 100 < I * 46)
        c.put(x, y, y > gy - 6 ? '▒' : (hash16(x * 3 + y) % 3 ? '░' : '▒'), R);
    }
    var cw = 9 + u * 3;                                                // 主塔半宽
    for (y = 9; y < gy; y++) {                                         // 主塔身
      var hw = cw * (1 - (gy - y) * 0.006);
      for (x = Math.round(60 - hw); x <= Math.round(60 + hw); x++) c.put(x, y, '░', K);
      c.put(Math.round(60 - hw), y, '█', N); c.put(Math.round(60 + hw), y, '█', N);
    }
    for (i = 0; i < 5; i++) {                                          // 城垛
      var mx = Math.round(60 - cw) + i * Math.round(cw * 2 / 4.4);
      for (y = 7; y < 9; y++) for (x = mx; x < mx + 4; x++) c.put(x, y, '▓', K);
    }
    for (y = 3; y < 8; y++) {                                          // 尖顶
      for (x = Math.round(60 - (y - 2) * 2.2); x <= Math.round(60 + (y - 2) * 2.2); x++) c.put(x, y, '▒', K);
    }
    for (i = -1; i <= 1; i += 2) {                                     // 两侧小塔
      var tx = Math.round(60 + i * (cw + 7));
      for (y = 13; y < gy; y++) for (x = tx - 3; x <= tx + 3; x++) c.put(x, y, '░', K);
      for (y = 10; y < 13; y++) for (x = tx - 2; x <= tx + 2; x++) c.put(x, y, '▓', K);
    }
    for (x = 2; x < c.w - 2; x++) {                                    // 山脚一线亮
      if (hash16(x * 11 + 5) % 100 < 60) c.put(x, gy, '▒', N);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '48 / HER CASTLE', N);
    c.put(c.w - 20, top, 'BUILT / IN SMOKE', R);
    c.center(bt, 'NO ONE LIVES HERE / BUT HER', B);
  }

  // ⑥ 蜿蜒红路（MV 121.4–122.6）：一条 S 形的路向远处收，两侧是黑岩。
  function lu_s8_road(c, t, top, bt, e) {
    var u = clamp01(e / 1.6), x, y, i;
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {          // 底：暗红雾
      if (hash16(x * 7 + y * 13 + Math.round(t * 9)) % 100 < 6) c.put(x, y, '·', R);
    }
    for (y = top + 1; y < bt; y++) {
      var f = (y - top) / (bt - top);                                  // 0 远 → 1 近
      var mid = 60 + Math.sin(f * 3.1 + t * 0.25) * (8 + f * 20);      // S 形中线
      var hw = 1.5 + f * f * 26;                                       // 近处宽、远处收成一点
      for (x = Math.round(mid - hw); x <= Math.round(mid + hw); x++) {
        if (x < 2 || x > c.w - 3) continue;
        var q = Math.abs(x - mid) / Math.max(0.6, hw);
        if (q < 0.30) c.put(x, y, '▓', N);                             // 路心（被雾光打亮）
        else if (q < 0.72) c.put(x, y, '▒', R);
        else c.put(x, y, ' ', D);                                      // 两侧黑岩
      }
      c.put(Math.round(mid - hw) - 1, y, '▓', N);                      // 路边石
      c.put(Math.round(mid + hw) + 1, y, '▓', N);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '49 / THE ROAD UP', N);
    c.put(c.w - 19, top, 'NO WAY / BACK', R);
    c.center(bt, 'IT ONLY GOES / ONE WAY', B);
  }

  // ⑦ 山巅（MV 123.8–124.6）：两座黑峰夹一道竖直强光，红雾压在山脚。
  // ⚠️ 峰线必须是**锯齿**（hash 抖动）：直线斜边读成"两个黑三角"，锯齿才读成山脊。
  function lu_s8_summit(c, t, top, bt, e) {
    var u = clamp01(e / 4.2), x, y, i;                 // 122.6–126.8 是同一个镜头，缓慢推进到底
    var glowX = 60, half = 27 - u * 3.5;                                 // 中间光缝半宽
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {         // 光缝
      var d = Math.abs(x - glowX) / half;
      var I = Math.pow(Math.max(0, 1 - d), 1.5) * (0.55 + 0.45 * (1 - (y - top) / (bt - top)) * 0.6);
      if (I > 0.62) c.put(x, y, '█', W);
      else if (I > 0.40) c.put(x, y, '▓', B);
      else if (I > 0.22) c.put(x, y, '▒', N);
      else if (I > 0.10) c.put(x, y, '·', R);
      else if (hash16(x * 7 + y * 13) % 100 < 7) c.put(x, y, '·', R);
    }
    // ⚠️ 峰是"挖黑"出来的：每行算出山脊线的 x，把那一侧整段擦成黑。
    // 上一版的 for 起点写死成 2 / c.w-2、边界落到画外时整行不挖 ⇒ 山脚一片红，
    // 中间的光柱读成"一座金色尖塔"。这里改成显式边界 + 夹到画面内。
    for (i = 0; i < 2; i++) {
      var sgn = i ? 1 : -1;
      for (y = top; y < bt; y++) {
        var f = (y - top) / (bt - top);                                // 0 顶 → 1 底
        // 抖动种子只能用 y（用 x 时 x 还没被 for 赋值，取到的是上一轮的残留）
        var ex = (38 + f * 8) * (1 - u * 0.05)
          + (hash16(y * 13 + i * 57) % 100) / 100 * 3.4 + Math.sin(y * 1.15 + i * 2.1) * 1.6;
        var xE = Math.round(glowX + sgn * ex);
        if (sgn < 0) {
          for (x = 1; x < xE; x++) c.put(x, y, hash16(x * 3 + y * 7) % 100 < 58 ? '░' : ' ', K);
          if (xE >= 1 && xE <= c.w - 2) c.put(xE, y, '█', N);
        } else {
          for (x = xE + 1; x < c.w - 1; x++) c.put(x, y, hash16(x * 3 + y * 7) % 100 < 58 ? '░' : ' ', K);
          if (xE >= 1 && xE <= c.w - 2) c.put(xE, y, '█', N);
        }
      }
    }
    for (x = 2; x < c.w - 2; x++) {                                    // 山脚红雾压边
      if (hash16(x * 11 + Math.round(t * 6)) % 100 < 52) c.put(x, bt - 1, '░', R);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '49 / THE TOP', W);
    c.put(c.w - 18, top, 'LIGHT / ABOVE', B);
    c.center(bt, 'AND I AM STILL / STANDING', W);
  }

  // ===== 124.00–143.12 定案（2026-11-05，按 MV 逐帧重做） =====
  // 旧版这四镜（炉口 → 辐条门 → 红核 → 环状机械）建在 luRadialRing 上，
  // 是把 MV 这一段误读成"下降进入一台环形机械"的产物。逐帧核对后实际是：
  //   124.0–126.8  山巅夹光（上一镜的延续，只是峰更亮）
  //   126.8–135.2  暗红岩窟里的四个极近特写（刃 → 手 → 斜岩层 → 竖褶 → 峡谷暗影）
  //   135.2–138.2  巨石板俯拍，中央刻四角星
  //   138.2–141.6  金色星盘 + 举白鸟的她 + 一群小人
  //   141.6–143.1  红厅中央发光球 + 血管状枝杈
  // luRadialRing 保留（后续镜头可能复用它画日轮），但本段已不再调用。
  // 外缘双环 + 辐条 + 辐条端节结。hot 决定它是石头还是烧红的铁。
  function luRadialRing(c, cx, cy, rx, spokes, spin, hot) {
    var i, k, rr, a, x, y, ry = rx * 0.52;
    for (i = 0; i < 460; i++) {
      a = i / 460 * TAU;
      // 石门的轮缘掺三分之一亮块：全用最暗档时，"石头"在暗场里读不出来
      c.put(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, '█',
            hot ? N : (i % 3 === 0 ? B : D));
      if (i % 2 === 0)
        c.put(cx + Math.cos(a) * rx * 0.87, cy + Math.sin(a) * rx * 0.87 * 0.52, '▓', hot ? G : K);
    }
    for (k = 0; k < spokes; k++) {
      a = k / spokes * TAU + spin;
      var dx = Math.cos(a), dy = Math.sin(a) * 0.52;
      for (rr = rx * 0.18; rr < rx * 0.87; rr += 0.45) {
        x = cx + dx * rr; y = cy + dy * rr;
        c.put(x, y, luDirChar(dx, dy), rr < rx * 0.28 ? (hot ? N : K) : (hot ? G : K));
      }
      c.put(cx + dx * rx * 0.94, cy + dy * rx * 0.94, '◆', hot ? B : D);
    }
  }

  // ===== 124.00–143.12 定案（2026-11-05，按 MV 逐帧重做） =====
  // MV 实际内容（逐帧读，字幕校验）：
  //   124.0–126.8  山巅夹光（继续上一镜，峰更亮）
  //   126.8–128.4  暗红里一根斜置的长刃（局部特写，杆身近黑、边缘一条亮线）
  //   128.4–129.6  暗红里一只向上张开的手（五指细长）
  //   129.6–135.2  红色岩窟内部，三段连续推进（斜岩层 → 竖褶 → 峡谷与暗影）
  //   135.2–138.2  巨石板俯拍，中央刻四角星
  //   138.2–141.6  金色星盘 + 举白鸟的她 + 一群小人
  //   141.6–143.1  红厅中央发光球 + 血管状枝杈
  // ⚠️ 旧版这四镜全建在 luRadialRing（环形机械）上——与 MV 毫无关系，已整体废弃。

  // 低频值噪声。⚠️ 岩壁**只能用低频**：hash 逐格撒点会读成沙子，
  // 中频正弦条带会读成条纹布。两三个八度的插值噪声才像"岩体的起伏"。
  function luNoise2(x, y, sd) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash16(xi * 37 + yi * 91 + sd * 13) / 65535;
    var b = hash16((xi + 1) * 37 + yi * 91 + sd * 13) / 65535;
    var c2 = hash16(xi * 37 + (yi + 1) * 91 + sd * 13) / 65535;
    var d2 = hash16((xi + 1) * 37 + (yi + 1) * 91 + sd * 13) / 65535;
    return (a * (1 - u) + b * u) * (1 - v) + (c2 * (1 - u) + d2 * u) * v;
  }

  // 红色岩窟底：三档低频噪声叠成大块明暗，再沿"岩层"方向压出几条裂缝。
  // mode 0 = 斜岩层（层理明显）　1 = 竖褶洞壁　2 = 峡谷（中央一道红光 + 两侧压暗）
  function luRockField(c, t, top, bt, mode, sd) {
    var x, y, n1, n2, I, crack, cx = 60;
    var drift = t * 0.10;
    for (y = top + 1; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      // ⚠️ 第一版把 x 的权重给到 0.012（几乎只随 y 变化）⇒ 等值线全是水平直线，
      // 整幅读成"红色瓦楞纸 / 条纹布"。岩面必须**两个方向的权重相当**，才有块状起伏。
      if (mode === 0) {
        n1 = luNoise2(x * 0.052 + drift, (y - top) * 0.058, sd);
        n2 = luNoise2(x * 0.017 - drift, (y - top) * 0.024 + 7, sd + 5);
      } else if (mode === 1) {
        // 竖褶：x 的周期比 y 密一倍，才会读成"纵深的壁面"而不是横纹
        n1 = luNoise2(x * 0.098 + drift * 0.6, (y - top) * 0.036, sd);
        n2 = luNoise2(x * 0.034, (y - top) * 0.015 + 3, sd + 9);
      } else {
        n1 = luNoise2(x * 0.046 + drift, (y - top) * 0.050, sd);
        n2 = luNoise2(x * 0.015, (y - top) * 0.022 + 5, sd + 3);
      }
      I = 0.24 + n1 * 0.54 + n2 * 0.30;
      // 逐格抖动打碎阈值等值线（不打碎的话三档边界是光滑曲线，缩略图里就是条纹）
      I += (hash16(x * 13 + y * 29 + sd * 7) % 100 - 50) / 100 * 0.11;
      if (mode === 2) {                                  // 峡谷：中央亮、两侧压黑
        var dp = Math.abs(x - cx) / 46;
        I *= clamp01(1.22 - dp * dp);
        if (dp > 0.62) { c.put(x, y, hash16(x * 7 + y * 13 + sd) % 100 < 40 ? '░' : ' ', K); continue; }
      }
      // 裂缝：用**噪声的等值线**（弯的）而不是 y 的正弦（直的）。
      // 直缝 = 瓦楞纸；弯缝才是岩层的断裂。
      crack = Math.abs(luNoise2(x * 0.085 + 3, (y - top) * 0.150 + 11, sd + 17) - 0.5);
      if (crack < 0.030) I -= 0.24;
      // 只用三档实心/半实心，不用 ░ 铺面（░ 在 2 倍缩放下就是一层灰纱，读成"脏"）
      if (I > 0.72) c.put(x, y, '▓', R);
      else if (I > 0.56) c.put(x, y, '▒', R);
      else if (I > 0.38) c.put(x, y, hash16(x * 11 + y * 7 + sd) % 100 < 46 ? '░' : ' ', K);
      else if (hash16(x * 5 + y * 3 + sd) % 100 < 18) c.put(x, y, '·', G);
    }
  }

  // ① 长刃局部（MV 126.8–128.4）：一根斜穿画面的重刃，杆身近黑、只有一条亮棱。
  // ⚠️ 别画成"一把完整的大剑"：MV 里是**极近的特写**，只有杆和刃背，
  // 剑尖、护手全在画外。观众认出"这是她的刀"靠的是杆上的箍和刃背那条冷光。
  function lu_s9_blade(c, t, top, bt, e) {
    var u = clamp01(e / 1.6), x, y, i, q;
    luHeat(c, t, top, bt, 0.50);
    var ax = 2 + u * 3, ay = top + 2.4 + Math.sin(t * 1.7) * 0.4;
    var bx = 119, by = bt - 4.0 + Math.cos(t * 1.3) * 0.5;
    var dx = bx - ax, dy = by - ay, len = Math.sqrt(dx * dx + dy * dy);
    var nx = -dy / len, ny = dx / len;
    var TH = 3.4;
    // ⚠️ 第一版杆身用 ' ' K（空格）⇒ 暗场里杆身整个消失，只剩刃背一条断续亮线，
    // 整幅读成"一条拉链/一道缝"。杆身必须用可见的暗字符（▒ K），
    // 亮棱再单独沿轴走一遍，保证逐格连续（混在法向循环里会因为步进而跳格）。
    for (i = 0; i <= len; i += 0.30) {
      var px = ax + dx * (i / len), py = ay + dy * (i / len);
      for (q = -TH; q <= TH; q += 0.30) {
        var gx = px + nx * q, gy = py + ny * q * 0.5;
        if (gx < 1 || gx > c.w - 2 || gy < top + 1 || gy > bt - 1) continue;
        if (q < -TH + 1.3) c.put(gx, gy, '▓', N);            // 刃背的坡面
        else if (q < 0.2) c.put(gx, gy, '▒', G);             // 杆面亮侧
        else c.put(gx, gy, '▒', K);                          // 杆面暗侧
      }
    }
    for (i = 0; i <= len; i += 0.22) {                       // 刃背那条冷白亮棱
      var cx2 = ax + dx * (i / len) + nx * (-TH + 0.35);
      var cy2 = ay + dy * (i / len) + ny * (-TH + 0.35) * 0.5;
      if (cx2 < 1 || cx2 > c.w - 2 || cy2 < top + 1 || cy2 > bt - 1) continue;
      c.put(cx2, cy2, '█', W);
    }
    for (i = 24; i < len - 8; i += 18) {                     // 箍
      var qx = ax + dx * (i / len), qy = ay + dy * (i / len);
      for (q = -TH - 1.2; q <= TH + 1.2; q += 0.30) {
        var hx = qx + nx * q, hy = qy + ny * q * 0.5;
        if (hx < 1 || hx > c.w - 2 || hy < top + 1 || hy > bt - 1) continue;
        c.put(hx, hy, '▓', B);
      }
    }
    for (i = 0; i < 26; i++) {                               // 刃背附近的金屑
      var hs = hash16(i * 173 + Math.round(t * 9));
      var tt = (hs % 100) / 100;
      c.put(ax + dx * tt + nx * (-TH - 1.5 - (hs >> 5) % 4),
            ay + dy * tt + ny * (-TH - 1.5) * 0.5, '.', hs % 3 ? N : W);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '53 / THE BLADE', N);
    c.put(c.w - 19, top, 'EDGE / ONLY', W);
    c.center(bt, 'FORGED IN THE / SAME FIRE', B);
  }

  // ② 手（MV 128.4–129.6）：暗红里一只向上张开的手，五指细长。
  // MV 里只有手、腕、半截袖子，其余全烧在红光里 —— 所以背景只给一团暗红光。
  function lu_s9_hand(c, t, top, bt, e) {
    var u = clamp01(e / 1.2), x, y, i, r, q, k, px, pv;
    luHeat(c, t, top, bt, 0.62);
    // ⚠️ 这里失败了两版，教训是同一件事：
    //   ① 指宽 1 格、内部 ' ' K ⇒ 整只手在暗场里消失，只剩一根"深色香肠"；
    //   ② 指宽 2 格、内部 '▒ K'（**半透明**暗色）⇒ 在红色背景上等于隐形，
    //      只有 0.3 格宽的 '▓ R' 指缘被量化吃掉，读成"一团红毛"。
    // 定案：手必须画成**实心剪影**（█ K），再沿外轮廓补一圈红边（▓ R）——
    // 剪影靠"不透明度"从红光里跳出来，不靠明度差（暗色在暗场里没有明度差）。
    var cx = 60, cy = 24.6 - u * 1.0;                     // 掌根
    var PW = 8.8, PH = 5.2;                              // 掌要够宽，否则五指出掌就散开成"鸡爪"
    var hm = {};                                          // 手形掩码：'x,y' -> 1
    function addH(gx, gy) {
      var ix = Math.round(gx), iy = Math.round(gy);
      if (ix < 1 || ix > c.w - 2 || iy < top + 1 || iy > bt - 1) return;
      hm[ix + ',' + iy] = 1;
    }
    for (y = -PH; y <= PH; y += 0.4) for (x = -PW; x <= PW; x += 0.4) {
      if ((x / PW) * (x / PW) + (y / PH) * (y / PH) > 1) continue;
      addH(cx + x, cy + y);
    }
    // ⚠️ 角度约定：ang = 0 表示**朝上**（不是朝右）。上一版按"0 = 朝右"写的
    // （fx += cos·r，fy += sin·r），五根手指全被甩到手掌右边、且几乎水平，
    // 于是整只手塌成一坨。
    // 方向向量 = (sin ang, −cos ang)；横向 = (cos ang, sin ang)。
    var roots = [
      [-6.4, -2.4, -0.62, 8.0],      // 小指
      [-3.2, -4.6, -0.28, 10.4],     // 无名指
      [ 0.6, -5.1,  0.02, 11.2],     // 中指
      [ 4.2, -4.4,  0.30, 9.6],      // 食指
      [-6.8,  2.6, -1.02, 6.6]       // 拇指（从掌侧横出，最短）
    ];
    for (i = 0; i < 5; i++) {
      var rx0 = roots[i][0], ry0 = roots[i][1], ang = roots[i][2], L = roots[i][3];
      var ux = Math.sin(ang), uy = -Math.cos(ang);             // 手指朝向
      var vx = Math.cos(ang), vy = Math.sin(ang) * 0.5;        // 横向（y 折半：字符 1:2）
      for (r = 0; r <= L; r += 0.20) {
        var bend = r > L * 0.55 ? (r - L * 0.55) * 0.07 : 0;   // 第二关节回勾
        var fx = cx + rx0 + ux * r - uy * bend;
        var fy = cy + ry0 + uy * r * 0.62 + ux * bend;
        var wide = r > L * 0.84 ? 0.40 : 1.10;                 // 指尖收窄
        for (q = -wide; q <= wide; q += 0.20) addH(fx + vx * q, fy + vy * q);
      }
    }
    for (y = Math.round(cy) + Math.round(PH) - 1; y < bt; y += 0.4) {   // 腕
      var ww = 4.4 + (y - cy - PH) * 0.13;
      for (x = -ww; x <= ww; x += 0.4) addH(cx + x, y);
    }
    // ⚠️ 手在这镜里是**被红光照亮的暗色实体**，所以它必须留在红色系里：
    //   K（#5f5f00）⇒ 橄榄绿苔藓；G（#875f00）⇒ 土黄鸡爪，都会把整幅的红色调打散。
    // 定案：内部实心 R（与背景同色系、但密度是实的），边缘一圈 N（橙）——
    // 靠"实心 vs 半透明"而不是"色相"从背景里分出来。
    for (k in hm) {
      pv = k.split(',');
      c.put(+pv[0], +pv[1], '█', R);
    }
    for (k in hm) {                                       // 外轮廓一圈暖橙边
      pv = k.split(','); px = +pv[0];
      var py2 = +pv[1];
      if (!hm[(px + 1) + ',' + py2] || !hm[(px - 1) + ',' + py2] ||
          !hm[px + ',' + (py2 + 1)] || !hm[px + ',' + (py2 - 1)])
        c.put(px, py2, '█', N);
    }
    for (i = 0; i < 5; i++)                              // 掌心的反光
      c.put(Math.round(cx - 2 + i), Math.round(cy - 1), '█', B);   // ⚠️ 必须实心：▓ 叠在 █ 上会混成暗绿
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '54 / HER HAND', N);
    c.put(c.w - 21, top, 'OPEN / NOT ASKING', R);
    c.center(bt, 'SHE COULD / CLOSE IT', B);
  }

  // ③④⑤ 岩窟三镜：同一套底，只换 mode / 明暗 / 一条主脊。
  function lu_s9_rockA(c, t, top, bt, e) {
    var u = clamp01(e / 1.8), x, y;
    luRockField(c, t, top, bt, 0, 7);
    // 主岩脊：一条斜向的亮边（MV 里这道亮边就是"岩层的断面"）
    for (y = top + 1; y < bt; y++) {
      var rx = 30 + (y - top) * 1.5 + Math.sin(y * 0.42) * 3 - u * 6;
      if (rx < 2 || rx > c.w - 3) continue;
      c.put(rx, y, '█', N);
      c.put(rx + 1, y, '▓', R);
      c.put(rx - 1, y, '▒', R);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '55 / DEEPER', N);
    c.put(c.w - 18, top, 'DOWN / AND IN', R);
    c.center(bt, 'THE ROCK / IS WARM', B);
  }

  function lu_s9_rockB(c, t, top, bt, e) {
    var x, y;
    luRockField(c, t, top, bt, 1, 23);
    // 洞壁的两道暗折：不给竖线，给两条更暗的竖向带（竖线会读成柱子/栅栏）
    for (y = top + 1; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      var d1 = Math.abs(x - (40 + Math.sin(y * 0.17) * 6));
      var d2 = Math.abs(x - (84 + Math.cos(y * 0.14) * 7));
      if (d1 < 2.2 || d2 < 2.2) c.put(x, y, ' ', K);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '56 / NO WAY OUT', N);
    c.put(c.w - 16, top, 'ONLY / DOWN', R);
    c.center(bt, 'THE CAVE / BREATHES', B);
  }

  function lu_s9_rockC(c, t, top, bt, e) {
    var u = clamp01(e / 2.0), x, y, i;
    luRockField(c, t, top, bt, 2, 41);
    // 光：峡谷尽头的一团红（越推越亮）
    for (y = top + 1; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      var dd = Math.sqrt((x - 60) * (x - 60) + ((y - 20) * 2) * ((y - 20) * 2)) / (16 - u * 3);
      if (dd < 1 && hash16(x * 7 + y * 13) % 100 < (1 - dd) * 96)
        c.put(x, y, dd < 0.42 ? '▓' : (dd < 0.72 ? '▒' : '░'), dd < 0.42 ? N : R);
    }
    // 中央暗影：一个站起来的人（挖成 ' ' K），两侧各带一道红边把它从光里剥出来
    var hx = 60, hy = 13.6, hw = 4.2, hh = 3.4;
    function inSil(x2, y2) {
      var ax = Math.abs(x2 - hx), ry = y2 - hy;
      if ((ax / hw) * (ax / hw) + (ry / hh) * (ry / hh) <= 1) return true;
      if (ax < 1.5 && ry > hh * 0.5 && ry < hh + 1.4) return true;
      if (ry > hh + 0.6 && ry < 15.5) {                       // 身高 15.5 行
        var t2 = (ry - hh - 0.6) / 12;
        return ax <= 3.6 * (1 - t2 * 0.16) + (t2 > 0.58 ? (t2 - 0.58) * 10 : 0);
      }
      return false;
    }
    for (y = top; y < bt; y++) for (x = 2; x < c.w - 2; x++) {
      if (!inSil(x, y)) continue;
      c.put(x, y, ' ', K);
      c.put(x - 1, y, '▒', R); c.put(x + 1, y, '▒', R);
    }
    for (i = 0; i < 18; i++) {
      var hs = hash16(i * 211 + Math.round(t * 7));
      c.put(10 + hs % 100, top + 2 + (hs >> 5) % Math.max(1, bt - top - 4), '.', i % 3 ? N : W);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '57 / SOMEONE THERE', N);
    c.put(c.w - 17, top, 'IN / THE RED', R);
    c.center(bt, 'WALKING / TOWARD IT', B);
  }

  // ===== 135.20–143.12 定案（2026-11-05） =====
  // MV 这里是一段"梦里的仪式"：俯拍刻星纹的巨石板 → 金色星盘与举白鸟的她 →
  // 红厅中央一颗发光的球。旧版整段是一个立绘（洛克茜女仆装）站在暗场里，与 MV 无关。
  // ⚠️ 三个镜头是全片仅有的**浅色场景**（灰白的天光），必须和前后 40 秒的暗红拉开，
  // 否则整支 MV 后半段会糊成一片红。

  // ① 巨石板俯拍（MV 135.2–138.2）：一块斜置的石板，中央刻四角星。
  // 石板用四点平行四边形定义（左上/右上/右下/左下），逐行插值左右边界填充。
  function lu_s10_slab(c, t, top, bt, e) {
    var u = clamp01(e / 3.0), x, y, i, f, xl, xr;
    var sd = Math.round(t * 10);
    var Ax = 10 - u * 2, Ay = top + 3.5, Bx = 100 + u * 3, By = top + 0.5;
    var Dx = 22 - u * 2, Dy = bt - 1.5, Cx = 112 + u * 3, Cy = bt - 4.5;
    // 背景：红雾（俯拍时四周是烧红的空气）
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      var dd = Math.sqrt((x - 60) * (x - 60) / 3600 + ((y - 19) * 2) * ((y - 19) * 2) / 900);
      if (hash16(x * 7 + y * 13 + sd) % 100 < 46 - dd * 26) c.put(x, y, dd < 0.5 ? '░' : '·', R);
    }
    for (y = Math.round(Ay); y <= Dy; y++) {
      f = (y - Ay) / (Dy - Ay);
      xl = Ax + (Dx - Ax) * f;
      xr = Bx + (Cx - Bx) * f;
      for (x = Math.round(xl); x <= Math.round(xr); x++) {
        if (x < 1 || x > c.w - 2) continue;
        var uu = (x - xl) / Math.max(1, xr - xl), vv = f;
        // 石面：左上受光（B 黄白），右下压暗（G 暗金）。⚠️ 用三档实心，不用 ░。
        var lit = 0.96 - uu * 0.30 - vv * 0.36;
        // 板块缝：三条，把石板分成六块（缝是暗的，宽度 1 格）
        var seam = Math.abs(uu - 0.36) < 0.012 || Math.abs(vv - 0.42) < 0.030 ||
                   Math.abs((uu - vv) - 0.16) < 0.014;
        if (seam) lit -= 0.42;
        if (lit > 0.70) c.put(x, y, '█', B);
        else if (lit > 0.50) c.put(x, y, '▓', B);
        else if (lit > 0.34) c.put(x, y, '▒', G);
        else c.put(x, y, '░', K);
      }
      // 板沿：一条亮边把石板从雾里切出来
      if (y > Ay + 0.5 && y < Dy - 0.5) {
        c.put(Math.round(xl), y, '█', W); c.put(Math.round(xr), y, '█', W);
      }
    }
    // 中央四角星：四个细长菱形分别指向四条对角线，边缘是刻出来的暗槽。
    var stx = 60, sty = 19.5, SL = 24, SW = 4.4;
    for (y = top + 1; y < bt - 1; y++) for (x = 2; x < c.w - 2; x++) {
      var dx2 = x - stx, dy2 = (y - sty) * 2;
      var inS = false, edge = false;
      for (i = 0; i < 4; i++) {
        var a = Math.PI / 4 + i * Math.PI / 2;
        var ca = Math.cos(a), sa = Math.sin(a);
        var along = dx2 * ca + dy2 * sa, perp = -dx2 * sa + dy2 * ca;
        var wmax = SW * (1 - along / SL);
        if (along > 0 && along < SL) {
          if (Math.abs(perp) < wmax) inS = true;
          else if (Math.abs(perp) < wmax + 1.15) edge = true;
        }
      }
      if (inS) c.put(x, y, '█', W);                     // 星面：打磨得比石板亮
      else if (edge) c.put(x, y, '▓', K);               // 刻槽
    }
    for (i = 0; i < 6; i++) {                          // 星心：一圈齿
      var aa = i / 6 * TAU + t * 0.2;
      c.put(Math.round(stx + Math.cos(aa) * 3.2), Math.round(sty + Math.sin(aa) * 1.6), '●', N);
    }
    for (i = 0; i < 20; i++) {                         // 火星
      var hs = hash16(i * 191 + Math.round(t * 6));
      c.put(6 + hs % 106, top + 2 + (hs >> 5) % (bt - top - 4), '.', i % 3 ? N : W);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '58 / THE SLAB', N);
    c.put(c.w - 20, top, 'CUT / IN STONE', W);
    c.center(bt, 'SOMETHING WAS / PROMISED HERE', B);
  }

  // ② 金色星盘（MV 138.2–141.6）：巨大的日轮浮雕，她举着白鸟，台下是一群小人。
  function lu_s10_dreamt(c, t, top, bt, e) {
    var u = clamp01(e / 3.4), x, y, i, a, rr, dx, dy, d;
    var cx = 62, cy = 18.0 + u * 0.6, R0 = 21 + u * 2.2;
    var sd = Math.round(t * 8);
    // 背景：灰白的天（这一幕是"梦"，必须亮）。用 ░/▒ + B 铺出雾一样的白。
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      // ⚠️ 背景第一版用 '░' B：░ 只有 ~25% 覆盖率，落在黑底上混出来的就是**橄榄绿**，
      // 整幅"灰白的天"变成一片脏绿。要读成灰白必须**提高密度**（▒ 起步）+ 纯白（W），
      // 不能用黄（B）——任何低密度的黄在暗底上都会往绿偏。
      var v = clamp01(1.20 - Math.abs(x - 60) / 76 - Math.abs(y - 18) / 27 + Math.sin(x * 0.05 + y * 0.09) * 0.12);
      // ⚠️ 随机密度铺白 ⇒ 黑白棋盘（缩略图里就是马赛克）。雾必须是**满铺**：
      // 每格都写上，靠"░ / ▒ / █ 三档覆盖率的层次"表现浓淡，而不是靠"多大概率出现"。
      if (v > 0.70) c.put(x, y, '▒', W);
      else if (v > 0.40) c.put(x, y, '░', W);
      // 更远的地方留黑（灰色雾不能铺满整幅，否则没有"天"的远近）
    }
    // 盘下的暗色花瓣：从盘缘向外伸的尖瓣（K 实心，靠"实心 vs 雾"分离）
    for (i = 0; i < 9; i++) {
      var pa = Math.PI * 0.12 + i * (Math.PI * 0.86 / 8);
      for (rr = R0 * 0.92; rr < R0 * 1.42; rr += 0.3) {
        var wdt = (1 - (rr - R0 * 0.92) / (R0 * 0.5)) * 4.2;
        for (var q = -wdt; q <= wdt; q += 0.3) {
          var px2 = cx + Math.cos(pa) * rr - Math.sin(pa) * q;
          var py2 = cy + Math.sin(pa) * rr * 0.5 + Math.cos(pa) * q * 0.5;
          if (px2 < 1 || px2 > c.w - 2 || py2 < top + 1 || py2 > bt - 1) continue;
          c.put(px2, py2, '▓', K);
        }
      }
    }
    // 盘：三层同心（外缘暗金 → 盘面金 → 内圈亮），加 12 道放射星纹
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      dx = x - cx; dy = (y - cy) * 2;
      d = Math.sqrt(dx * dx + dy * dy);
      if (d > R0) continue;
      var ang = Math.atan2(dy, dx);
      var spike = Math.pow(Math.abs(Math.cos(ang * 6 + t * 0.05)), 6);
      if (d > R0 * 0.90) c.put(x, y, '█', G);
      else if (d > R0 * 0.74) c.put(x, y, '▓', N);
      else {
        // 盘面：放射星纹（12 道），越靠外越细，中心一团白热
        var I2 = 0.86 - (d / R0) * 0.30 + spike * 0.34;
        if (I2 > 0.98) c.put(x, y, '█', W);
        else if (I2 > 0.82) c.put(x, y, '█', B);
        else if (I2 > 0.66) c.put(x, y, '▓', B);
        else c.put(x, y, '▓', N);
      }
    }
    // 盘心：一颗白热的核 + 一圈齿
    for (y = -3; y <= 3; y++) for (x = -3; x <= 3; x++)
      if (x * x + (y * 1.8) * (y * 1.8) <= 8) c.put(cx + x, Math.round(cy + y), '█', W);
    // 她（左侧）：红袍小剪影 + 举起的白鸟。⚠️ 这里**不能用立绘**：
    // 立绘宽 15–25 格，会把中央的金盘整个压住，而这一幕的主体是盘。
    // ⚠️ 她失败了三版：粉色三角 / 火柴人 / 悬空的点。三个原因：
    //   ① 袍的梯形写反（i=0 是底部却给了最窄宽）；
    //   ② 袍用亮红（R）铺满 ⇒ 对比过强，整块读成"粉色三角"，抢掉金盘；
    //   ③ 头只有 3×2 格、臂压在裙里看不见。
    // 定案：袍用**暗红 ▓/█ K 底 + 橙边**，头 5 格宽并给一圈金发，
    // 举臂单独画在裙外（从肩上方走），白鸟放到臂的末端、离身体 5 格以上。
    var qx = 19, qy = bt - 1.4;
    for (i = 0; i <= 9; i++) {                         // 袍：底宽 7 → 顶宽 3
      var hw = 2.6 + (9 - i) * 0.48;
      // ⚠️ 袍底不能用 K：K（#5f5f00）在**浅灰背景**上是一根橄榄绿的柱子。
      // MV 里她是红袍，直接用 R 实心 + N 描边，红在灰白的天光里对比最强。
      for (x = Math.round(qx - hw); x <= Math.round(qx + hw); x++) {
        var isEdge = Math.abs(x - qx) > hw - 1.3;
        c.put(x, Math.round(qy - i), isEdge ? '█' : '▓', isEdge ? N : R);
      }
    }
    for (x = -3; x <= 3; x++) c.put(qx + x, Math.round(qy - 10), '█', R);      // 肩
    c.put(qx, Math.round(qy - 11), '█', N);                                    // 颈
    for (y = -2; y <= 1; y++) for (x = -2; x <= 2; x++) {                      // 头 + 金发
      var hd = Math.abs(x) * 0.9 + Math.abs(y) * 0.75;
      if (hd < 1.5) c.put(qx + x, Math.round(qy - 13 + y), '█', W);
      else if (hd < 2.6) c.put(qx + x, Math.round(qy - 13 + y), '▓', B);
    }
    for (i = 0; i <= 5; i++) c.put(qx - 3 - i * 0.3, Math.round(qy - 12 + i * 0.9), '▓', N);  // 垂发
    // 举起的臂：从右肩上方斜出，画在裙之外（不能被裙盖住）
    for (i = 0; i <= 7; i++)
      c.put(Math.round(qx + 2 + i * 0.85), Math.round(qy - 11 - i * 0.62), '█', N);
    // 白鸟：3×3（身 2×2 + 两片展开的翅）。⚠️ 2×2 的白块在灰白背景上会消失，
    // 所以鸟身后面要垫一格橙（把白从灰里推出来）。
    var bgx = Math.round(qx + 9), bgy = Math.round(qy - 16);
    for (y = -1; y <= 1; y++) for (x = -1; x <= 2; x++) c.put(bgx + x, bgy + y, '█', N);
    for (y = 0; y <= 1; y++) for (x = 0; x <= 1; x++) c.put(bgx + x, bgy + y, '█', W);
    c.put(bgx - 1, bgy - 1, '█', W); c.put(bgx + 2, bgy - 1, '█', W);
    // 台下的小人（右下）：一排黑剪影，只有头和肩
    // ⚠️ 2 格宽的小人在缩略图里就是"四个方点"，读不出是人群。
    // 每个小人 3 格宽 × 4 行：头（1 格）→ 肩（3 格）→ 身（2 格）→ 腿（2 格）。
    for (i = 0; i < 10; i++) {
      var mx = 86 + (i % 5) * 6 + Math.round(Math.sin(i * 1.9) * 1.5);
      var my = bt - 1 - Math.floor(i / 5) * 5 - (hash16(i * 37) % 2);
      // ⚠️ 这条路上试过三种"黑"，全部失败，记下来免得再试：
      //   K（#5f5f00）⇒ 橄榄绿；空格 ⇒ put 会把格子颜色设成 st，渲染时仍填底色，还是 K；
      //   D（#afaf5f）⇒ 比灰雾还亮。
      // 结论：这套调色板**没有黑**。浅灰底上画剪影只能用 G（#875f00 暗棕），
      // 靠"棕 vs 灰"的色相差 + 3 格宽的形状读成人群。
      c.put(mx + 1, my - 3, '█', G);                   // 头
      c.put(mx, my - 2, '█', G); c.put(mx + 1, my - 2, '█', G); c.put(mx + 2, my - 2, '█', G);
      c.put(mx, my - 1, '█', G); c.put(mx + 1, my - 1, '█', G); c.put(mx + 2, my - 1, '█', G);
      c.put(mx + 1, my, '█', G); c.put(mx + 2, my, '█', G);
    }
    // 飘落的白鸟（每帧几片）
    for (i = 0; i < 7; i++) {
      var hs2 = hash16(i * 211 + Math.round(t * 3));
      var bx = 6 + (hs2 % 108), by = top + 2 + mod((hs2 >> 5) * 0.01 + e * 0.28, bt - top - 4);
      c.put(bx, by, i % 2 ? '~' : '^', W);   // ⚠️ '⌐'(U+2310) 不在 EXTRA，会被画成缺字方块
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '59 / THE DREAM', K);
    c.put(c.w - 20, top, 'GOLD / AND BIRDS', N);
    c.center(bt, 'YOU ARE THERE / IN MY DREAMS', W);
  }

  // ③ 红厅中央的光球（MV 141.6–143.1）：一颗白热的球，四周是血管状的暗红枝杈。
  function lu_s10_core(c, t, top, bt, e) {
    var u = clamp01(e / 1.5), x, y, i, r, a;
    var cx = 60, cy = 18.5, R0 = 4.2 + u * 1.2;
    luHeat(c, t, top, bt, 0.62);
    // 枝杈：12 条从球心向外的主干，每条带一次分叉；越外越细、越暗
    for (i = 0; i < 12; i++) {
      a = i / 12 * TAU + Math.sin(t * 0.5 + i) * 0.06;
      var len = 34 + (hash16(i * 71) % 18);
      for (r = R0; r < len; r += 0.34) {
        var wide = Math.max(0.4, 2.6 - (r / len) * 2.0);
        var bx = cx + Math.cos(a) * r + Math.sin(r * 0.22 + i) * 1.4;
        var by = cy + Math.sin(a) * r * 0.5 + Math.cos(r * 0.19 + i) * 0.7;
        for (var q = -wide; q <= wide; q += 0.34) {
          var gx = bx + Math.cos(a + 1.5708) * q, gy = by + Math.sin(a + 1.5708) * q * 0.5;
          if (gx < 1 || gx > c.w - 2 || gy < top + 1 || gy > bt - 1) continue;
          c.put(gx, gy, r < len * 0.55 ? '▓' : '▒', r < len * 0.4 ? N : R);   // ⚠️ 枝杈不能给 K：橄榄绿在红厅里像挂在墙上的水草
        }
        // 分叉：主干的 60% 处再伸一根
        if (Math.abs(r - len * 0.60) < 0.2) {
          for (var r2 = 0; r2 < len * 0.36; r2 += 0.34) {
            var a2 = a + (i % 2 ? 0.55 : -0.55);
            var fx = bx + Math.cos(a2) * r2, fy = by + Math.sin(a2) * r2 * 0.5;
            if (fx < 1 || fx > c.w - 2 || fy < top + 1 || fy > bt - 1) continue;
            c.put(fx, fy, '▒', R);
          }
        }
      }
    }
    // 球：三层（外橙 → 金黄 → 白热核），加一圈跳动的高光
    for (y = top; y < bt; y++) for (x = 1; x < c.w - 1; x++) {
      var dx = x - cx, dy = (y - cy) * 2;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > R0 * 1.55) continue;
      var fl = 0.5 + 0.5 * Math.sin(t * 7 + Math.atan2(dy, dx) * 3);
      if (d < R0 * 0.55) c.put(x, y, '█', W);
      else if (d < R0 * 1.0) c.put(x, y, '█', fl > 0.5 ? B : W);
      else if (d < R0 * 1.28) c.put(x, y, '▓', N);
      else c.put(x, y, '▒', R);
    }
    // 两侧的黑柱（门框残迹），把视线夹在中间
    for (i = 0; i < 2; i++) {
      var px0 = i ? 106 : 10;
      for (y = top + 1; y < bt; y++) for (x = px0; x < px0 + 4; x++)
        c.put(x, y, hash16(x * 7 + y * 11) % 100 < 62 ? '░' : ' ', R);
      for (y = top + 1; y < bt; y++) c.put(i ? px0 : px0 + 3, y, '▓', N);
    }
    for (i = 0; i < 26; i++) {
      var hs = hash16(i * 173 + Math.round(t * 8));
      c.put(14 + hs % 92, top + 2 + (hs >> 5) % (bt - top - 4), '.', i % 3 ? N : W);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '60 / THE CORE', N);
    c.put(c.w - 17, top, 'STILL / BURNING', W);
    c.center(bt, 'IT NEVER / WENT OUT', B);
  }

  // 143.12–152.18 "It's just you & me in the end"：
  // 参考 MV 153.7–162.8 是三拍特写：红黑流体内部 → 一柄斜插的刀刃 → 被红环围住的核。
  // 旧稿用 luRibbon 铺了六条丝带，到格子上全变成等距短横线，整屏读成静电噪点（已废弃）。
  // ⚠️ 调色板里**没有暗红**：这里的"暗红"靠**密度**做——稀疏的 R 点视觉上就是暗红，
  // 只有密集叠加才跳成亮红。全文只有三样东西：一块团块、一把刀、一颗核。
  function lu_s10_meet(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i;
    var cx = 60, cy = (top + bt) / 2 + 1;
    var beat = mod(t * 1.35, 1), env = Math.exp(-beat * 4.2);
    var toBlade = clamp01((e - 3.55) / 0.45);
    var toCore = clamp01((e - 6.15) / 0.55);
    var fadeA = 1 - toBlade;

    // 底噪：极稀疏的暗红浮尘。⚠️ 不要用横线铺底噪，横线在缩略图里就是扫描线
    for (i = 0; i < 90; i++) {
      var hs = hash16(i * 157 + 23);
      if (hash16(i * 13 + (e * 3 | 0) * 7) % 100 < 52)
        c.put(3 + (hs % 114), top + 3 + ((hs >> 5) % (bt - top - 6)),
              '·', i % 4 ? R : G);
    }
    // 全屏组织底纹：没有它，黑底占七成，三样东西全浮在空中（第一版像三个图标）。
    // 密度必须低（约 20%）且**只用最暗档**，否则会和前景的血管连成一片沙。
    for (y = top + 2; y <= bt - 2; y++) {
      for (x = 3; x < c.w - 3; x++) {
        // ⚠️ 底纹不能只用 K（#5f5f00 暗橄榄）：整屏会读成黄绿色噪点，不是血色。
        // 主体给 R，K 只做更暗的一层，两层叠出"组织"的厚度。
        var hb = hash16(x * 43 + y * 91 + (e * 2 | 0) * 5) % 100;
        if (hb < 16) c.put(x, y, '·', R);
        else if (hb < 24) c.put(x, y, '.', K);
        else if (hb < 29) c.put(x, y, '░', K);
      }
    }

    // ── 一、血肉组织：六条粗血管从画面边缘蜿蜒汇入中心的核
    // ⚠️ 均匀铺满的暗红点 = 一层沙（前两版），必须给出**结构**。
    // ⚠️ 粗线只能用块字符**相邻列并排**：一格方向字符只有一根细线，
    //    并排 `▓` 中心 + 两侧 `▒` 才读得成一根粗管。
    if (fadeA > 0.01) {
      for (var v = 0; v < 6; v++) {
        var aEnd = v / 6 * TAU + 0.42 + Math.sin(e * 0.22 + v) * 0.09;
        var p0x = cx + Math.cos(aEnd) * 64, p0y = cy + Math.sin(aEnd) * 19;
        var steps = 150;
        for (var st = 0; st < steps; st++) {
          var uu = st / (steps - 1);                    // 0 = 画面边缘，1 = 中心
          if (uu > fadeA) break;                        // 转刀时血管从边缘缩回
          var wob = Math.sin(uu * 6.5 + v * 2.1 + e * 0.7) * (1 - uu * 0.55) * 6;
          var vx = p0x + (cx - p0x) * uu - Math.sin(aEnd) * wob;
          var vy = p0y + (cy - p0y) * uu + Math.cos(aEnd) * wob * 0.5;
          // ⚠️ **宽度不能沿半径渐变**：1 格宽时整段是橙、3 格宽时是"红-橙-红"，
          // 沿线交替就成了串珠（试过两版）。宽度固定 3 格，粗细的变化交给
          // 靠中心处的额外加宽，中间那列始终实心，线才连得住。
          for (var w = -2; w <= 2; w++) {
            var wd = Math.abs(w) < 0.55 ? 9 : (uu > 0.62 ? 1.2 : 0.9);
            if (Math.abs(w) > wd) continue;
            var mid = Math.abs(w) < 0.55;
            if (!mid && hash16(((st * 7) | 0) + v * 31) % 100 < 26) continue;
            c.put(vx + w, vy, mid ? '▓' : '▒',
                  mid ? (uu > 0.55 ? B : N) : R);
          }
        }
      }
      // 组织：血管之间极稀的暗红点。密度必须低，铺满就是沙
      for (i = 0; i < 150; i++) {
        var hs3 = hash16(i * 211 + 17);
        if (hash16(i * 29 + (e * 3 | 0) * 11) % 100 < 42 * fadeA)
          c.put(4 + (hs3 % 112), top + 3 + ((hs3 >> 6) % (bt - top - 6)), '·', i % 3 ? R : G);
      }
      // 核：环 + 瞳孔。⚠️ 半径 3 行以下的实心圆会离散成方块（踩过），所以是壳不是块
      var rc0 = 4.6 + env * 1.8;
      for (y = cy - rc0; y <= cy + rc0; y++)
        for (x = cx - rc0 * 2; x <= cx + rc0 * 2; x++) {
          var ux0 = (x - cx) / (rc0 * 2), uy0 = (y - cy) / rc0;
          var uu0 = Math.sqrt(ux0 * ux0 + uy0 * uy0);
          if (uu0 > 1) continue;
          if (uu0 < 0.26) c.put(x, y, '█', env > 0.45 ? W : B);
          else if (uu0 < 0.55) c.put(x, y, '▓', N);
          else if (uu0 < 0.82) c.put(x, y, '▒', R);
          else if (hash16(x * 17 + y * 29) % 100 < 55) c.put(x, y, '░', R);
        }
    }

    // ── 二、斜插的刀：横贯全屏的实心带。
    // ⚠️ 方向字符（╱）一格只有一根细线，加厚必然退化成排线（106s 那条教训，七版之后才认）。
    if (toBlade > 0.01 && toCore < 0.98) {
      var kb = toBlade * (1 - toCore * 0.55);
      // ⚠️ 斜线不能用"逐 x 扫描、每列算一个 y"来画：宽度 1 时相邻两列的 y 会
      // 整格跳开，缩略图里就是一条断续的链（试了三版）。改成**到直线的距离场**，
      // 每个格子独立判断，斜线自然被完全覆盖，不存在断口。
      var x0 = 13, x1 = c.w - 12;
      // 轻微漂移：完全静止的一条亮带在 2.5 秒里读成"道具"，跟着节奏上下浮一点才像刀
      var drift = Math.sin(e * 1.15) * 2.2;
      var y0 = top + 3 + drift, y1 = bt - 4 + drift;
      var dxs = x1 - x0, dys = y1 - y0, ln = Math.sqrt(dxs * dxs + dys * dys);
      var nx = -dys / ln, ny = dxs / ln;               // 法线
      for (x = x0; x <= x1; x++) {
        var tt0 = (x - x0) / dxs;
        var yc0 = y0 + tt0 * dys;
        if (hash16(x * 37 + (e * 9 | 0)) % 100 < 30 * kb)   // 火星：先画，且落在刃外
          c.put(x, yc0 + (hash16(x * 11) % 2 ? -2.0 : 2.0), '·', N);
      }
      for (y = top + 2; y <= bt - 2; y++) {
        for (x = x0; x <= x1; x++) {
          var dist = (x - x0) * nx + (y - y0) * ny;
          var tAx = ((x - x0) * dxs + (y - y0) * dys) / (ln * ln);   // 沿轴位置 0..1
          if (tAx < 0 || tAx > 1) continue;
          var tip = Math.min(1, Math.min(tAx, 1 - tAx) * 9);        // 两端 11% 收尖
          var hh = 1.05 * tip;
          var ad = Math.abs(dist);
          if (ad > hh) continue;
          c.put(x, y, '█', ad < hh * 0.42 ? (tip > 0.75 ? W : B) : B);
        }
      }
    }

    // ── 三、被红环围住的核：外两道细环 + 球体 + 两道支架
    // ⚠️ 球不能按"同心圆分档"填：半径 3~6 行时那几档直接离散成同心方框，
    // 读出来是一块带花纹的黄方块（第一版）。改成算**球面法线 + 左上点光源**，
    // 体积来自高光位置而不是亮度；底部暗到留黑，球才从黑里鼓出来。
    if (toCore > 0.01) {
      var kc = toCore;
      var rc = (5.0 + env * 1.6) * kc;
      for (i = 0; i < 2; i++) {                                // 环：一正一反转
        var rr3 = (11 + i * 5) * kc;
        var spin3 = i ? -e * 0.5 : e * 0.35;
        for (var q2 = 0; q2 < 160; q2++) {
          var a3 = q2 / 160 * TAU + spin3;
          if (i === 1 && q2 % 3 === 0) continue;               // 外环断续，才像转动的机械环
          c.put(cx + Math.cos(a3) * rr3, cy + Math.sin(a3) * rr3 * 0.5, '·', i ? G : R);
        }
      }
      // ⚠️ 光源不能正对观众：LZ=0.73 时整个前半球都被照亮，球心 shade 就有 0.73，
      // 无论怎么调色阶都是一颗"金蛋"。把光压到左上侧、LZ 降到 0.45，
      // 只留左侧一条亮，右下半才有暗部——球才立起来。
      var LX = -0.62, LY = -0.64, LZ = 0.45;
      for (y = cy - rc; y <= cy + rc; y++) {
        for (x = cx - rc * 2; x <= cx + rc * 2; x++) {
          var ux = (x - cx) / (rc * 2), uy = (y - cy) / rc;
          var u2 = Math.sqrt(ux * ux + uy * uy);
          if (u2 > 1) continue;
          var nz = Math.sqrt(Math.max(0, 1 - u2 * u2));
          var shade = ux * LX + uy * LY + nz * LZ;
          // ⚠️ 高档位不能用 B（#ffd75f 是黄）：B 的 `▓` 连成片就是一块金砖，
          // 整颗球读成一个金色的蛋（踩过）。B 只留给高光那一小块，其余走 N/R。
          // ⚠️ 最暗那档也要**填满**：留空的话球的下半会整块消失，
          // 形状就不再由半径决定，读成一个"上半个方块"（踩过）。
          if (u2 > 0.94) c.put(x, y, '▒', shade > 0.3 ? N : R);   // 轮廓：连续一圈
          else if (shade > 0.94) c.put(x, y, '█', env > 0.55 ? W : B);
          else if (shade > 0.88) c.put(x, y, '▓', B);
          else if (shade > 0.80) c.put(x, y, '▓', N);
          else if (shade > 0.46) c.put(x, y, '▒', R);
          else c.put(x, y, '░', R);
        }
      }
      // 不给支架：横杆穿过球心高度时，整颗球会被读成"穿在棍子上"（参考帧里
      // 那个球也是悬在红环中央、没有支撑）。空间关系交给两道环交代。
    }

    clearRect(c, 0, top, c.w, 1);
    c.put(3, top, '53 / JUST YOU AND ME', N);
    c.put(c.w - 19, top, toCore > 0.5 ? 'IN THE END' : (toBlade > 0.5 ? 'EDGE ONLY' : 'BLOOD HEAT'), R);
  }

  // ===== 血与火·纹章 152.18–159.93 粒度细分：2 子场景 =====

  // 152.18–156.09 "Bound by blood and flames we are shatterproof"：
  // 参考 MV 162.8–166.7 ＝ 女王半身特写，背后是一圈燃烧的红色涡流。
  // 旧稿是"火焰墙 + 一个 3D 立方体 + SIGIL.SYS 日志"，立方体完全读不出含义。
  // 这里给到 78 格宽（裁到裙摆上沿，脸约占 8 行，终于有细节），
  // 背后不是立方体而是一圈**燃烧的符文环**——"血与火"的印记。
  function lu_s11_sigil(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i;
    var cx = 60, cy = (top + bt) / 2 + 2;
    var push = 1 + luEase(clamp01(e / 3.9)) * 0.10;
    var beat = mod(t * 1.5, 1), env = Math.exp(-beat * 4.0);

    // 底：暗红涡流（与下一幕的螺旋同源，只是这里压到很暗，做背景）
    for (y = top + 1; y < bt; y++) {
      for (x = 2; x < c.w - 2; x++) {
        var dx = (x - cx) / 2.4, dy = y - cy;
        var rr = Math.sqrt(dx * dx + dy * dy);
        var th = Math.atan2(dy, dx);
        var ph = th * 3 + rr * 0.30 - t * 1.1;
        var I = Math.pow(0.5 + 0.5 * Math.sin(ph), 3.0) * Math.exp(-rr / 15);
        if (I > 0.24) c.put(x, y, '░', R);
        else if (I > 0.08) c.put(x, y, '·', R);
      }
    }
    // 符文环：两道同心环 + 30 根辐条，整圈缓慢反转，beat 时整体胀一下
    var R1 = (30 + push * 2) * (1 + env * 0.03);
    for (i = 0; i < 300; i++) {
      var a1 = i / 300 * TAU - e * 0.16;
      c.put(cx + Math.cos(a1) * R1, cy + Math.sin(a1) * R1 * 0.5, '—', i % 6 ? R : N);
    }
    for (i = 0; i < 220; i++) {
      var a2 = i / 220 * TAU + e * 0.22;
      c.put(cx + Math.cos(a2) * R1 * 0.72, cy + Math.sin(a2) * R1 * 0.72 * 0.5, '·', i % 4 ? N : B);
    }
    for (i = 0; i < 30; i++) {
      var a3 = i / 30 * TAU + e * 0.07;
      for (var r3 = R1 * 0.78; r3 < R1 * 0.98; r3 += 1.1)
        c.put(cx + Math.cos(a3) * r3, cy + Math.sin(a3) * r3 * 0.5,
              luDirChar(Math.cos(a3), Math.sin(a3) * 0.5), r3 > R1 * 0.93 ? B : N);
    }
    // 人物：78 格宽，从右侧三分线往里站，左侧留出光环与火
    c.queen = { x: 78 - 39, y: 4.2, width: 78 * push, t: t, reveal: clamp01(e / 0.85) };
    // 底部火线
    for (x = 2; x < c.w - 2; x++) {
      var hu = Math.abs(x - 60) / 58;
      if (hash16(x * 37 + (e * 6 | 0)) % 100 < 80 * (1 - hu * 0.45))
        c.put(x, bt - 1, hash16(x * 13) % 3 ? '░' : '▒', hash16(x * 7) % 4 ? R : N);
    }
    clearRect(c, 0, top, c.w, 1);
  }

  // 156.09–159.93 "I call out your name and you know the truth"：
  // 参考 MV 166.7–170.5 ＝ 整屏的红色螺旋（万花筒式的涡流）。
  // 螺旋用**极坐标场**算，不是"画一条螺线"：逐点算 (r,θ) 再取 sin 相位，
  // 每个格子独立判定，不存在跳格，而且天然铺满整屏。
  function lu_s11_call(c, t, top, bt, elapsed) {
    var e = elapsed, x, y;
    var cx = 60, cy = (top + bt) / 2 + 1;
    var spin = e * 1.35;
    var beat = mod(t * 1.5, 1), env = Math.exp(-beat * 4.0);
    // ⚠️ 臂数决定亮脊的**横向宽度**：3 臂时一个相位周期在 r=20 处跨 40 格，
    // 亮脊就有 10 格宽，读成一条金蛇。5 臂 + 径向相位加快才收成细密的涡纹。
    var arms = 5 + (e > 2.1 ? 1 : 0);
    for (y = top + 1; y < bt; y++) {
      for (x = 2; x < c.w - 2; x++) {
        var dx = (x - cx) / 2.3, dy = y - cy;
        var rr = Math.sqrt(dx * dx + dy * dy);
        var th = Math.atan2(dy, dx);
        var ph = th * arms + rr * 0.62 - spin;
        // ⚠️ 指数决定亮脊厚度：3.2 时亮带 5~6 格宽，读成"一条金色的蛇"；
        // 抬到 5.6 才收成 2 格左右的脊线，剩下全是红。
        var I = Math.pow(0.5 + 0.5 * Math.sin(ph), 5.6) * Math.exp(-rr / 23);
        I *= 1 + env * 0.35;
        if (rr < 2.0) { c.put(x, y, '█', env > 0.35 ? W : B); continue; }
        // ⚠️ 高档位占比一大，整屏就从"红螺旋"变成"黄棕螺旋"（第一版）。
        // 红档负责面积、橙黄只做最高那条亮脊，颜色才对得上参考帧。
        // ⚠️ 症结不在面积而在**视觉亮度**：N（#ffaf5f）的中密度块比 R（#ff5f5f）
        // 亮得多，所以哪怕红色面积更大，整屏看上去还是黄的。
        // 正解是主体只用 R 一档到底、靠字符密度分亮暗，N/B 只留过曝那一条脊。
        // ⚠️ 过曝脊必须用实心块：`▓` 的 75% 图案叠在黑底上会混成暗黄褐，
        // 一放大就是一条"橄榄绿"的带（vision 都读成绿色）。
        if (I > 0.62) c.put(x, y, '█', B);
        else if (I > 0.40) c.put(x, y, '█', R);
        else if (I > 0.22) c.put(x, y, '▓', R);
        else if (I > 0.10) c.put(x, y, '▒', R);
        else if (I > 0.04) c.put(x, y, '░', R);
        else if (hash16(x * 19 + y * 53) % 100 < 30) c.put(x, y, '·', R);
      }
    }
    // 中心核：搏动的白点，外一圈短芒
    // 核要小：半径 3 行以上 + 12 根芒，在缩略图里是一个白色八角星，比螺旋还抢眼
    var rc2 = 1.7 + env * 0.8;
    for (y = cy - rc2; y <= cy + rc2; y++)
      for (x = cx - rc2 * 2; x <= cx + rc2 * 2; x++) {
        var ux2 = (x - cx) / (rc2 * 2), uy2 = (y - cy) / rc2;
        if (ux2 * ux2 + uy2 * uy2 > 1) continue;
        c.put(x, y, '█', env > 0.4 ? W : B);
      }
    for (var sp2 = 0; sp2 < 8; sp2++) {
      var a4 = sp2 / 8 * TAU + e * 0.9;
      for (var r4 = rc2 * 2.2; r4 < rc2 * 2.2 + 2.6; r4 += 1)
        c.put(cx + Math.cos(a4) * r4, cy + Math.sin(a4) * r4 * 0.5, '+', B);
    }
    clearRect(c, 0, top, c.w, 1);
  }

  // 159.93–164.00 "We link link link link up now"：副歌第一遍。
  // 参考 MV 170.5–174.6 ＝ 两个角色并排站在红色背景前。
  // 旧稿是 3D 交叉双剑 + 两个用 @*o# 拼的 5 格小人（缩略图里是两串符号），已废弃。
  // 现在直接上两张真立绘：左女王、右洛克茜，各 32 格宽——这是 27 行能装下的
  // 全身上限（32×18×140/84/36 ≈ 26.7 行），再宽就要裁腿。
  function lu_s12_duo(c, t, top, bt, elapsed) {
    var e = elapsed, x, y;
    var cx = 60, cy = (top + bt) / 2;
    var beat = mod(t * 1.85, 1), env = Math.exp(-beat * 4.2);
    // 背景：红色径向光 + 28 档放射楔形。压暗，人物才是主体
    for (y = top + 1; y < bt; y++) {
      for (x = 2; x < c.w - 2; x++) {
        var dx = (x - cx) / 2.2, dy = y - cy;
        var rr = Math.sqrt(dx * dx + dy * dy);
        var th = Math.atan2(dy, dx);
        var wedge = mod(Math.floor(((th + Math.PI) / TAU) * 28 + e * 0.55), 2);
        var I = (wedge ? 0.26 : 0.80) * Math.exp(-rr / 27) * (1 + env * 0.30);
        if (I > 0.46) c.put(x, y, '▓', R);
        else if (I > 0.22) c.put(x, y, '▒', R);
        else if (I > 0.08) c.put(x, y, '░', R);
        else if (hash16(x * 17 + y * 41) % 100 < 20) c.put(x, y, '·', R);
      }
    }
    // 地面一条亮线，两人站在上面
    for (x = 6; x < c.w - 6; x++)
      if (hash16(x * 29 + (e * 4 | 0)) % 100 < 64) c.put(x, bt - 1, '─', x % 3 ? R : N);
    var push = 1 + luEase(clamp01(e / 4.1)) * 0.12;
    // 按**脸**配平（瞳距 8.86 / 8.63 ≈ ×1.027），所以她与女王同宽略宽一点点；
    // 身高差由她的内容高度（94px vs 104px）自然给出，不再人为放大。
    var wQ = 32 * push, wR = luRoxyW(32) * push;
    var baseY = bt - 1.3;
    c.queen = { x: 38 - wQ / 2, y: luActorY(wQ, baseY, window.__LU_QUEEN_ANSI),
                width: wQ, t: t, reveal: clamp01(e / 0.7) };
    c.roxy = { x: 84 - wR / 2, y: luActorY(wR, baseY, window.__LU_ROXY_ANSI),
               width: wR, t: t, vis: 1, reveal: clamp01(e / 0.7) };
    clearRect(c, 0, top, c.w, 1);
  }

  // 164.00–167.96 "Link link link link up now"（第二遍）：
  // 参考 MV 174.6–178.6 是一串人物特写快切。副歌的力度靠**剪辑**给，
  // 不靠叠更多特效：0.99 秒一刀，女王 / 洛克茜交替，切点留三帧白闪。
  function lu_s12_shatter(c, t, top, bt, elapsed) {
    var e = elapsed;
    var shot = Math.min(3, Math.floor(e / 0.99));
    var se = mod(e, 0.99);
    var who = shot % 2;                              // 0 = 女王，1 = 洛克茜
    var beat = mod(t * 1.9, 1), env = Math.exp(-beat * 4.2);
    var x, y;
    // 底：暗红放射，跟着切点换方向（每刀换个机位的感觉）
    var dirS = shot % 2 ? -1 : 1;
    for (y = top + 1; y < bt; y++) {
      for (x = 2; x < c.w - 2; x++) {
        var dx = (x - 60) / 2.2, dy = y - (top + bt) / 2;
        var rr = Math.sqrt(dx * dx + dy * dy);
        var th = Math.atan2(dy, dx * dirS);
        // ⚠️ 24 道楔形在"全亮/全灭"之间交替 ⇒ 高频黑白条纹，缩略图里就是电视雪花。
        // 降到 10 道，且交替只做**两档亮度**（0.72 / 0.40），才是"放射光"不是噪点。
        var wedge = mod(Math.floor(((th + Math.PI) / TAU) * 10 + shot * 3), 2);
        var I = (wedge ? 0.40 : 0.72) * Math.exp(-rr / 24) * (1 + env * 0.3);
        if (I > 0.42) c.put(x, y, '▓', R);
        else if (I > 0.18) c.put(x, y, '▒', R);
        else if (I > 0.06) c.put(x, y, '░', R);
      }
    }
    // 特写：两人用**同一个推镜倍率**，靠 luRoxyW 把脸对齐（旧版给她 100 格宽，
    // 脸比女王大 47%，快切来回就成了"忽大忽小"）。她的头身比更大，同宽下脸就是一样
    // 大而身体更满，特写里反而更有压迫感。
    var w = 70 * (1 + se * 0.10);
    var ax = shot % 2 ? 68 : 52;
    if (who === 0) {
      c.queen = { x: ax - w / 2, y: 3.6, width: w, t: t, reveal: 1 };
    } else {
      var w2 = luRoxyW(70) * (1 + se * 0.10);
      c.roxy = { x: ax - w2 / 2, y: 3.6, width: w2, t: t, vis: 1, reveal: 1 };
    }
    // 切点白闪（约 3 帧）。
    // ⚠️ 旧版是 `hash16(...) < 70*k` 的**随机**铺白：70% 概率画 █ W、30% 不画，
    // 结果满屏是"白方块 + 黑缝"，缩略图里就是电视雪花马赛克。
    // 白闪必须是**整片**过曝，退场靠"从边缘往内缩"（半径随 k 收），不是靠概率。
    if (se < 0.075) {
      var k = 1 - se / 0.075;
      for (y = top + 1; y < bt; y++) for (x = 2; x < c.w - 2; x++) {
        var dd2 = Math.sqrt((x - 60) * (x - 60) + ((y - 19) * 2) * ((y - 19) * 2)) / 74;
        if (dd2 < k * 1.15) c.put(x, y, '█', dd2 < k * 0.55 ? W : B);
      }
    }
    clearRect(c, 0, top, c.w, 1);
  }

  // 167.96–172.15 "I was left for dead but you salvaged me"：
  // 参考 MV 178.6–182.75 ＝ 白紫漩涡 → 红黑碎片 → 红色放射 → **俯视的棋盘地板**。
  // 旧稿是"曳光对射 + 两个 5 格小人 + SIEGE.SYS 日志"，全是占位水平。
  // 现在改成一点透视的棋盘地面：等距格子投影后近疏远密，横线按 (k/N)^2 取，
  // 中央一束光柱从上方照下来，人站在光里——"被从死地里捞起来"。
  function lu_s13_cross(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i, k;
    var cx = 60, vpy = top + 5;
    var rise = luEase(clamp01(e / 2.6));
    var beat = mod(t * 1.7, 1), env = Math.exp(-beat * 4.2);
    // 暗底。⚠️ 别用 K(#5f5f00)——那是暗橄榄，在黑底上铺一层会泛出土黄绿
    for (y = top + 1; y < bt; y++)
      for (x = 2; x < c.w - 2; x++)
        if (hash16(x * 31 + y * 53) % 100 < 10) c.put(x, y, '·', R);
    // 地面：整个台座都撤掉。人物 41 格宽时脚踝本来就在画面外，
    // 任何"脚下的台座"都会贴在裁切线上，堆成一堵砖墙（试过三版）。
    // 光柱落地的位置只留一道极淡的地面辉光，其余交给人物自己。
    for (k = 0; k < 2; k++) {
      var ly2 = bt - 0.8 - k * 1.4;
      var hw2 = 40 - k * 12;
      for (x = cx - hw2; x <= cx + hw2; x++) {
        var uu2 = Math.abs(x - cx) / hw2;
        if (hash16(x * 23 + k * 71 + (e * 4 | 0)) % 100 < 52 * (1 - uu2))
          c.put(x, ly2, k ? '░' : '─', R);
      }
    }

    // 光柱：从上方一束射下来，**越往下越淡**（光散开了），不是越往下越亮。
    // ⚠️ 反过来的话底部会积成一块梯形实心块，缩略图里就是一堵砖墙（踩过）。
    // 而且只用 `░` / `·` 两档，密度低，才读成"光"而不是"墙"。
    // ⚠️ 半宽必须**比人宽**：人物 42 格宽居中，光柱 halfBot=19 时整束都被立绘盖住，
    // 一帧都看不见（立绘是离屏 canvas 画在字符层之上的，不是字符）。
    // 现在 halfBot=34，人物两侧各露 13 格；再给两侧一条密度更高的边界线，
    // "柱"的形状才立得住——只有内部散点的话读成一片红光。
    var halfTop = 8, halfBot = 34;
    for (y = top + 1; y < bt; y++) {
      var uu = (y - top) / (bt - top);
      var hw = halfTop + (halfBot - halfTop) * uu * uu;
      for (x = -hw; x <= hw; x += 0.5) {
        var ex = Math.abs(x) / hw;
        // ⚠️ 衰减系数别调太狠：0.80-uu*0.45 那条在底部只剩 0.35，而底部正是唯一
        // 露在人物两侧的部分 ⇒ 整束光在画面上等于不存在。改成 0.86-uu*0.30。
        // 横向也别用 (1-ex²*0.9)——边缘掉到 0，光柱只剩中间一股，读成"红光雾"。
        var I = (1 - ex * ex * 0.55) * (0.86 - uu * 0.30) * (1 + env * 0.18);
        if (uu > 0.85) I *= 1 - (uu - 0.85) / 0.15 * 0.62;   // 落地处化开，别切一条直边
        if (I > 0.50) c.put(cx + x, y, '░', R);
        else if (I > 0.20 && hash16(((x * 2) | 0) * 7 + y * 3) % 100 < 68) c.put(cx + x, y, '·', R);
      }
      if (hash16((y | 0) * 71 + (e * 5 | 0)) % 100 < 76) {
        c.put(cx - hw, y, '░', R); c.put(cx - hw - 0.5, y, '·', R);
        c.put(cx + hw, y, '░', R); c.put(cx + hw + 0.5, y, '·', R);
      }
    }
    // 光里的浮尘
    for (i = 0; i < 40; i++) {
      var hs = hash16(i * 173 + 7);
      var lv = mod(e * (0.25 + (hs >> 5) % 40 / 40 * 0.5) + hs / 65535, 1);
      var dx2 = ((hs % 100) / 100 - 0.5) * 2 * (halfTop + (halfBot - halfTop) * (1 - lv) * 0.5);
      dx2 = clamp(dx2, -34, 34);
      c.put(cx + dx2, bt - 1 - lv * (bt - top - 3), i % 5 === 0 ? '+' : '·',
            i % 5 === 0 ? N : R);
    }
    // 人：站在光柱中心，从暗到亮浮现
    var w = 38 + rise * 4;
    c.queen = { x: cx - w / 2, y: 6.2 - rise * 1.2, width: w, t: t,
                reveal: clamp01(e / 1.1) };
  }

  // 172.15–176.25 "Quench this molten lead 'cause it's overheating"：
  // 参考 MV 182.4–186.9：先一瞬红晶片特写，随即切到**红色岩洞里的王座全景**
  // （中央血红巨月 → 月前王座 → 王座前的双人 → 左右锯齿岩壁 → 底部岩浆岩台）。
  // ⚠️ 旧稿做成"熔金拱门"是方向错：MV 里根本没有拱门，而且门板门框用 G/K
  // （#875f00 / #5f5f00）铺大面积，整座门泛黄绿。这次不再用这两个色做实体块。
  // ⚠️ 这里的"巨月"是平面同心纹理，不是 luSphere：3D 球在 1:2 字符比下后半面
  // 会被压成一团，读不出"月亮"，而且 72 颗散点的位置会随投影乱跳。
  function lu_s13_throne(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i, k, side;
    var cx = 60, baseY = bt - 5;                       // 地平面，前景岩台在它下面
    var beat = mod(t * 1.75, 1), env = Math.exp(-beat * 4.2);
    var push = 1 + luEase(clamp01(e / 4.1)) * 0.11;   // 全程极缓推入

    // 巨月：rx 用格、ry 用行（字符高宽 1:2，半径必须差 2 倍才是圆）
    // ⚠️ 月心必须压到 y≈10：12.4 那版月心正好落在女王头顶和齿轮上，被挡掉正中一块，
    // 剩下一个空环，怎么调密度都读不出月亮。
    var mCX = cx, mCY = 10.2 - (push - 1) * 3.2, mRX = 15.5 * push, mRY = 7.6 * push;

    // 1) 洞窟底光：只在月周围三层扩散，远处留黑（整屏铺噪点会读成雪花）
    // ⚠️ 光晕是月亮"在发光"的唯一凭据：三层都摊得太稀（原来最内也只有 30% 的 ░），
    // 月亮就只是一枚贴在黑底上的红圆片。这里按半径分成 45% / 26% / 11% 三档。
    var halo = 0.62 + env * 0.38;
    for (y = top; y < bt; y++) {
      for (x = 1; x < c.w - 1; x++) {
        var gx = (x - mCX) / (mRX * 2.25), gy = (y - mCY) / (mRY * 2.4);
        var gd = Math.sqrt(gx * gx + gy * gy);
        if (gd >= 1) continue;
        var gq = 1 - gd;
        if (gq < 0.14) {
          if (hash16(x * 131 + y * 67 + (e * 3 | 0)) % 100 < 30 * halo) c.put(x, y, '·', R);
        } else if (gq < 0.32) {
          if (hash16(x * 131 + y * 67) % 100 < 52 * halo) c.put(x, y, '░', R);
        } else if (hash16(x * 131 + y * 67) % 100 < 78 * halo) c.put(x, y, '░', R);
      }
    }

    // 2) 巨月本体
    // ⚠️ 别按 hash 逐格分档（`dens` 那种写法）：随机取档会把月面打成红色噪点云，
    // 中心被陨击坑一挖就只剩个空心环。
    // ⚠️ 也别在档内部拿 hash 掺邻档（`mh<76?'█':'▓'`）：录制宽度只有 864px，
    // 一格 `▓` 缩到 7×14 后点阵混叠成灰斑，和相邻的实心 `█` 一拼就是"红黑棋盘"，
    // 整个月亮读成马赛克团。**同一档内必须是同一种字符**，明暗只靠档位切换；
    // 不呆板的感觉交给低频正弦（成片起伏），而不是逐格随机。
    for (y = top; y <= bt; y++) {
      for (x = mCX - mRX * 1.14; x <= mCX + mRX * 1.14; x++) {
        var ux = (x - mCX) / mRX, uy = (y - mCY) / mRY;
        var d = Math.sqrt(ux * ux + uy * uy);
        if (d > 1.14) continue;
        var mh = hash16((x | 0) * 73 + (y | 0) * 41) % 100;
        if (d > 1) {                                   // 边缘一圈毛边，不要硬圆
          if (mh < 26 * halo) c.put(x, y, '·', R);
          continue;
        }
        // 低频起伏：两路正弦叠加，周期 15~25 格，缩到 864 宽仍然看得成"斑驳"
        var lf = Math.sin((x - mCX) * 0.41 + (y - mCY) * 0.33) * 0.055
               + Math.sin((x - mCX) * 0.17 - (y - mCY) * 0.29 + 1.7) * 0.045;
        var dj = d + lf;
        // 陨击坑：左上 + 右下各一个，只降一档（降到 ▒ 会在月面上抠出两个黑方块，
        // 864 宽下读成"月亮破了洞"）。坑也别压到正中，正中必须留亮心。
        var cr1x = (x - (mCX - 6.2)) / 6.0, cr1y = (y - (mCY - 2.2)) / 2.6;
        var cr2x = (x - (mCX + 7.0)) / 3.6, cr2y = (y - (mCY + 3.4)) / 1.7;
        var pit = (cr1x * cr1x + cr1y * cr1y < 1) || (cr2x * cr2x + cr2y * cr2y < 1);
        if (dj > 0.95) { if (mh < 52) c.put(x, y, '░', R); }
        else if (dj > 0.84) c.put(x, y, '▒', R);
        else if (dj > 0.62) c.put(x, y, '▓', R);
        else if (pit) c.put(x, y, '▓', R);                   // 坑底：只降一档
        else c.put(x, y, '█', R);                            // 亮心
      }
    }

    // 3) 两侧锯齿岩壁：从地平面向上收窄的尖柱，朝洞心一侧被月光照亮
    // ⚠️ 横向别侵进月亮：旧稿 px 从 cx±16 起，最内一根正好压在月面上，
    // 月亮被啃掉大半读不出来。这里最内一根 px=cx±33，月亮外沿 cx±19.5 稳留 13 格空。
    for (side = -1; side <= 1; side += 2) {
      for (k = 0; k < 7; k++) {
        var hs0 = hash16(k * 317 + (side > 0 ? 917 : 73));
        var tk = k / 6;                                  // 0=靠画面边 1=靠洞心
        var px = cx + side * (61 - tk * 28 + ((hs0 % 100) / 100 - 0.5) * 4) * push;
        var hh = (6 + tk * 13 + (hs0 >> 4) % 5) * push;
        if (hh > baseY - top - 1) hh = baseY - top - 1;
        var hw0 = 1.8 + ((hs0 >> 9) % 30) / 10 * 1.5;
        if (px - hw0 < 1 || px + hw0 > c.w - 2) continue;
        for (y = baseY; y > baseY - hh; y--) {
          var u = (baseY - y) / hh;
          var hwv = hw0 * Math.pow(1 - u, 0.75);
          if (hwv < 0.3) hwv = 0.3;
          for (x = px - hwv; x <= px + hwv; x++) {
            var xi = Math.round(x), yi = Math.round(y);
            var inward = -(xi - px) * side;            // >0 = 朝洞心（受光面）
            // 纹理按 2 行一段取样：逐行 hash 会给柱子刷出棋盘格，读成碎砖
            var rh = hash16(xi * 53 + Math.floor(yi / 2) * 191) % 100;
            if (inward > hwv * 0.4) {
              // 受光面只到 ▓：月亮才是画面里唯一的 █，岩壁一旦也用实心 █，
              // 两侧和月面一样亮，主体就散了（截图里读成"红砖墙夹着一团红"）。
              if (rh < 56) c.put(xi, yi, rh < 30 ? '▓' : '▒', R);
            } else if (inward > -hwv * 0.35) {
              if (rh < 62) c.put(xi, yi, rh < 26 ? '▒' : '░', R);
            } else if (rh < 48) {
              c.put(xi, yi, '░', R);
            }
          }
        }
      }
    }

    // 4) 月下光柱 + 两人脚下的石台
    // ⚠️ 原本这里做的是"用空格从月面抠出王座剪影"，抠出来确实干净（纯黑），
    // 但王座顶部 qhw≈3~14 格正好落在月心上，月亮被掏成一个空心环，调密度救不回来。
    // 字符画只有 29 行可用，人 16 行 + 月 15 行已经占满，塞不下第三层主体——
    // 所以不做王座，改画 MV 里同样成立的两件事：月心往下打的光柱（给画面一条纵轴），
    // 和人物脚下抬起来的一级石台。
    for (y = mCY + mRY * 0.7; y < baseY; y++) {
      var su = (y - (mCY + mRY * 0.7)) / Math.max(1, baseY - (mCY + mRY * 0.7));
      var shw = (5 + su * 13) * push;                  // 越往下越张
      for (x = cx - shw; x <= cx + shw; x++) {
        var eL = Math.abs(x - cx) / shw;
        var sg = hash16((x | 0) * 89 + (y | 0) * 37 + (e * 4 | 0)) % 100;
        var lim = (1 - eL * eL) * (0.62 - su * 0.34) * 100;
        if (lim > 26 && sg < lim * 0.30) c.put(x, y, '·', R);
        else if (sg < lim) c.put(x, y, '░', R);
      }
    }
    // 石台：人物脚下抬起来的一级，只在中段，两端用 · 化开
    for (x = cx - 20; x <= cx + 20; x++) {
      var pq = hash16((x | 0) * 131 + (e * 9 | 0)) % 100;
      var pn = 1 - Math.abs(x - cx) / 21;
      if (pq < 30 + pn * 46) c.put(x, baseY + 0.4, pn > 0.55 && pq < 62 ? '─' : '·', N);
    }



    // 5) 前景岩台：地平线以下越往下越实的块状暗红
    for (y = baseY + 1; y < bt; y++) {
      var depth = (y - baseY) / (bt - baseY);
      for (x = 1; x < c.w - 1; x++) {
        var bxx = Math.floor(x / 3);
        var hv = hash16(bxx * 137 + y * 71) % 100;
        var lim = 32 + depth * 20;
        if (hv < lim) c.put(x, y, hv < lim * 0.32 ? '▒' : '░', R);
      }
    }
    for (x = 1; x < c.w - 1; x++) {                     // 地平线：中间最烫、两端渐熄
      var hz = hash16(x * 29 + (e * 7 | 0)) % 100;
      var near = 1 - Math.abs(x - cx) / 60;
      if (hz < 16 + near * 36) c.put(x, baseY + 1, near > 0.42 ? '─' : '·', N);
    }

    // 6) 火星：从岩台升向月亮
    for (i = 0; i < 26; i++) {
      var sh = hash16(i * 191 + 11);
      var rise = mod(e * (0.26 + (sh >> 5) % 40 / 40 * 0.6) + sh / 65535, 1);
      c.put(cx + ((sh % 100) / 100 - 0.5) * 96,
            baseY - rise * (baseY - top - 2), i % 6 === 0 ? '+' : '·',
            i % 6 === 0 ? B : N);
    }

    // 7) 两个人：真立绘，脚踩地平面。
    // 按脸配平（×1.027）：同宽下她的脸与女王等大，身高自然矮 9%
    var wQ = 19, wR = luRoxyW(19);
    c.queen = { x: cx - 22, y: luActorY(wQ, baseY, window.__LU_QUEEN_ANSI),
                width: wQ, t: t, reveal: clamp01((e - 0.25) / 1.1) };
    c.roxy = { x: cx + 2, y: luActorY(wR, baseY, window.__LU_ROXY_ANSI),
               width: wR, t: t, anchor: 'foot', vis: 1,
               reveal: clamp01((e - 0.55) / 1.1) };
  }

  // 176.25–179.96 "Link link link link up now"：镜头钻进巨月，月面开裂、熔金从裂缝里挤出来。
  // 参考 MV 在这一段已经切到厂牌台标（186.9 秒起全是 LALALA 标），没有画面可移植，
  // 所以按歌词自己收束：s13 是"远远看着红洞里的月和人"，这里推成月面特写，
  // 裂缝就是 "link" 的具象——两块东西被烧在一起，中间那道缝是最烫的地方。
  // ⚠️ 逐格 hash 分档在 864 宽下会碎成马赛克（见 s13 的注释），这里月面明暗只由
  // 低频正弦 + 半径决定，同一档内所有格子用同一个字符。
  function lu_s14_hell(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i;
    var cx = 60, cy = 17.5, RX = 34;
    var beat = mod(t * 1.75, 1), env = Math.exp(-beat * 4.5);
    // ⚠️ open 从 0.18 起，不是从 0：open=0 时 ci 恒为 0，整盘只有 coreR≈1.2 的
    // 中心核，画面上就是一枚孤零零的黄格子，像是贴图没加载完。给个初始张开量后，
    // 第一帧就有细裂纹，之后才是"张开"而不是"凭空出现"。
    var open = 0.18 + 0.82 * luEase(clamp01((e - 0.05) / 2.5));
    var spin = e * 0.12;

    // 月面：以格为单位的半径（纵向 ×2 修正字符高宽比），周界 34 格
    for (y = top - 1; y < bt + 1; y++) {
      for (x = 1; x < c.w - 1; x++) {
        var nx = x - cx, ny = (y - cy) * 2;
        var rr = Math.sqrt(nx * nx + ny * ny);
        var mh0 = hash16((x | 0) * 131 + (y | 0) * 67) % 100;
        if (rr > RX * 1.55) continue;
        if (rr > RX) {                                   // 盘外的红色光晕，别让边界像剪纸
          var gq = (rr - RX) / (RX * 0.55);
          if (mh0 < 40 * (1 - gq)) c.put(x, y, gq > 0.6 ? '·' : '░', R);
          continue;
        }
        var u = rr / RX, ang = Math.atan2(ny, nx);
        // 低频起伏：两路正弦，成片而不是逐格
        var lf = Math.sin(nx * 0.19 + ny * 0.15) * 0.11
               + Math.sin(nx * 0.08 - ny * 0.11 + 2.1) * 0.085;
        // 裂缝：7 条放射状。判定用**弧长**（角差 × 半径）而不是纯角度，
        // 纯角度会让裂缝越往外越宽，读成一片扇形。
        var crackI = 0;
        for (i = 0; i < 7; i++) {
          var base = i / 7 * TAU + spin + 0.25;
          var da = Math.abs(((ang - base) % TAU + TAU * 1.5) % TAU - Math.PI);
          var arc = da * Math.max(7, rr);
          var hw = (0.55 + open * 1.15) * (1 - u * 0.52);
          if (arc < hw) {
            // 亮度按 (1-u)^1.5 衰减：线性衰减会让黄色爬到半个半径外，
            // 平方（2.2）又掉太快、外面几档全糊成同一种 ░，裂纹断在 0.6R 处。
            var ci = Math.pow(1 - u, 1.5) * open;
            if (ci > crackI) crackI = ci;
          }
        }
        if (crackI > 0.03) {
          // ⚠️ 裂纹必须一路延伸到盘边：只在中段上色的话外圈和月面同密度，分不开。
          // 五档刚好覆盖 W(0.10R) / B(0.21R) / N(0.41R) / ▓R(0.60R) / ▒R(0.90R)。
          if (crackI > 0.86) c.put(x, y, '█', W);
          else if (crackI > 0.70) c.put(x, y, '█', B);
          else if (crackI > 0.45) c.put(x, y, '▓', N);
          else if (crackI > 0.18) c.put(x, y, '▓', R);
          else c.put(x, y, '▒', R);
          continue;
        }
        // ⚠️ 盘面亮度：原来 1-u*0.52 一档下来，外圈整片是 ░（25%），红盘暗得像脏球。
        var b = 1.30 - u * 0.62 + lf;
        if (u > 0.94) { if (mh0 < 46) c.put(x, y, '░', R); }
        else if (b > 1.02) c.put(x, y, '▓', R);
        else c.put(x, y, '▒', R);
      }
    }

    // 中心熔核：随拍点搏动的白热斑（叠在裂缝交汇点上）
    var coreR = (3.0 + env * 2.2) * (0.4 + open * 0.6);
    for (y = cy - coreR * 0.85; y <= cy + coreR * 0.85; y++) {
      for (x = cx - coreR * 1.7; x <= cx + coreR * 1.7; x++) {
        var dxn = (x - cx) / (coreR * 1.7), dyn = (y - cy) / (coreR * 0.85);
        var dn = Math.sqrt(dxn * dxn + dyn * dyn);
        if (dn > 1) continue;
        if (dn < 0.34) c.put(x, y, '█', W);
        else if (dn < 0.62) c.put(x, y, '█', B);
        else if (dn < 0.86) c.put(x, y, '▓', N);
        else c.put(x, y, '▒', N);
      }
    }

    // 飞散的碎块：沿径向外抛，越远越小越暗
    for (i = 0; i < 22; i++) {
      var fh = hash16(i * 271 + 7);
      var fa = i / 22 * TAU + (fh % 100) / 100 * 0.4;
      var fph = mod(e * (0.34 + (fh >> 5) % 30 / 30 * 0.42) + fh / 65535, 1);
      var fr = RX * (0.72 + fph * 0.95);
      var fx = cx + Math.cos(fa) * fr, fy = cy + Math.sin(fa) * fr / 2;
      if (fy < top || fy > bt || fx < 1 || fx > c.w - 2) continue;
      var fs = fph > 0.75 ? 1 : 2;
      if (fph < 0.42) {
        c.put(fx, fy, fs > 1 ? '▓' : '▒', R);
        c.put(fx + 0.6, fy, '░', R);
      }
    }
  }

  // 179.96–184.11 "Link link link link up now"（第二遍）：世界烧完了，只剩两个人。
  // 镜头走到这里已经是第三层递进：s13 远远看红洞全景 → s14 钻进月面看它开裂 →
  // 这里直接抽掉一切背景，黑场 + 一条还在地平线上烧着的缝 + 并肩的两个人。
  // 不做"后拉成远景"是刻意的：远景在 s13 已经用过了，再拉一遍是重复而不是推进。
  function lu_s14_pull(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i;
    var cx = 60, baseY = bt - 3;
    var beat = mod(t * 1.75, 1), env = Math.exp(-beat * 4.5);
    // 收尾压暗：用高频稀疏的**空格**擦除来压，而不是靠"少画"——
    // 少画不会让已经画上去的岩壁变暗，只有擦掉才行。
    var fade = clamp01((e - 3.05) / 1.05);

    // 1) 只剩地平线上一道还在烧的缝：中间最亮，两端熄掉
    // ⚠️ 别用 `─` 铺（连续横线字符会在 864 宽下连成一条扫描线），
    // 主体用 `·`（点），`─` 只点缀不到 12%，这样读成"还在冒火星的缝"而不是"一条横杠"。
    for (x = 1; x < c.w - 1; x++) {
      var pn = 1 - Math.abs(x - cx) / 58;
      if (pn <= 0) continue;
      var hq = hash16(x * 29 + (e * 8 | 0)) % 100;
      var lim = Math.pow(pn, 1.2) * (104 + env * 34);
      if (hq < lim * 0.12) c.put(x, baseY, '─', N);
      else if (hq < lim) c.put(x, baseY, '·', N);
      if (hq < lim * 0.30) c.put(x, baseY + 0.5, '·', R);
    }
    // 2) 地平线下：薄薄一层被烤红的地面。⚠️ 空格缩小取样（早先按 2 格块取）会把
    // 地面切成 2 格宽的竖条，在 864 宽下读成"城市废墟剪影"，完全不是要的东西。
    for (y = baseY + 1; y < bt; y++) {
      var dv = (y - baseY) / (bt - baseY);
      for (x = 1; x < c.w - 1; x++) {
        var hg = hash16(x * 137 + (y | 0) * 71) % 100;
        var pl = (1 - dv * 0.42) * (1 - Math.abs(x - cx) / 78);
        if (hg < 46 * pl) c.put(x, y, hg < 12 * pl ? '▒' : '░', R);
      }
    }
    // 3) 两个人：比 s13 略大一点（镜头更近），脚踩地平线。同样按脸配平。
    var wQ = 20, wR = luRoxyW(20);
    c.queen = { x: cx - 26, y: luActorY(wQ, baseY, window.__LU_QUEEN_ANSI),
                width: wQ, t: t, reveal: 1 };
    c.roxy = { x: cx + 2, y: luActorY(wR, baseY, window.__LU_ROXY_ANSI),
               width: wR, t: t, anchor: 'foot', vis: 1, reveal: 1 };
    // 4) 稀疏火星：只留十几颗，慢慢往上飘（背景已经没有别的东西，多了会吵）
    for (i = 0; i < 16; i++) {
      var sh = hash16(i * 191 + 11);
      var rise = mod(e * (0.18 + (sh >> 5) % 40 / 40 * 0.34) + sh / 65535, 1);
      c.put(cx + ((sh % 100) / 100 - 0.5) * 84,
            baseY - rise * (baseY - top - 3), i % 5 === 0 ? '+' : '·',
            i % 5 === 0 ? B : N);
    }
    // 5) 压暗：4 格一块的低频擦除，逐格随机会把画面擦成电视雪花
    if (fade > 0) {
      for (y = top; y < bt; y++)
        for (x = 1; x < c.w - 1; x++) {
          if (hash16(Math.floor(x / 4) * 97 + Math.floor(y / 4) * 131) % 100 < fade * 108)
            // ⚠️ 这里原来漏了颜色参数（`c.put(x, y, ' ')`）：整格颜色变成 undefined，
            // 183–184 秒每帧近 2000 格非法。补 R（压暗成暗红），别补 K（红底上会发绿）。
            c.put(x, y, ' ', R);
        }
    }
  }
  // 184.11–188.5 尾奏：只剩还在熄的余烬。
  // ⚠️ 旧稿画了"链环 + LINK UP 打字 + 火山锥 + 地平线"，一整套占位符号；
  // 而且配色走 D/G（#afaf5f / #875f00）——又是黄绿系，在黑场里泛灰绿。
  // 收尾只要一件事：让画面自己烧完。所以只有余烬 + 一条越来越短的熔岩缝。
  function lu_outro(c, t, top, bt, elapsed) {
    var e = elapsed, i, x, y;
    var cx = 60, baseY = bt - 3;
    var fade = clamp01(1 - e / 4.15);        // 4.15s 归零 → 末 0.25s 纯黑收尾
    if (fade <= 0.02) return;

    // 1) 地平线余晖：只剩中间一小段，随 fade 收短
    for (x = 1; x < c.w - 1; x++) {
      var pn = 1 - Math.abs(x - cx) / (36 * (0.35 + fade * 0.65));
      if (pn <= 0) continue;
      var hq = hash16(x * 29 + (e * 6 | 0)) % 100;
      if (hq < 76 * pn * fade) c.put(x, baseY, '·', fade > 0.5 ? N : R);
    }
    // 2) 地面上残余的温度
    for (y = baseY + 1; y < bt; y++)
      for (x = 1; x < c.w - 1; x++) {
        var hg = hash16(x * 137 + y * 71) % 100;
        if (hg < 34 * fade * (1 - Math.abs(x - cx) / 70)) c.put(x, y, '░', R);
      }
    // 2.5) 远景剪影群（MV 183–186）：一排站在地平线上的小黑影。
    // ⚠️ 第一版按"每行一个宽度"画，结果是**上宽下窄**（头 3 格、脚 1 格）的柱子，
    // 缩略图里读成"一排黄色方块"。人形必须逐部位写：头 1 格 → 肩 3 格 → 身 2 格 → 腿 2 格。
    for (i = 0; i < 7; i++) {
      var sx = 22 + i * 13 + Math.round(Math.sin(i * 2.3) * 3);
      var sh2 = hash16(i * 97 + 13);
      var hgt = 5 + (sh2 % 2);                       // 5–6 行高
      var ink = fade > 0.35 ? G : R;
      c.put(sx, baseY - hgt, '█', ink);                                  // 头
      c.put(sx - 1, baseY - hgt + 1, '█', ink); c.put(sx + 1, baseY - hgt + 1, '█', ink);
      c.put(sx, baseY - hgt + 1, '█', ink);                              // 肩
      for (y = 2; y < hgt - 1; y++) c.put(sx, baseY - hgt + y, '█', ink); // 身
      c.put(sx - 0.8, baseY - 1, '█', ink); c.put(sx + 0.8, baseY - 1, '█', ink);  // 腿
      if (fade > 0.45) c.put(sx, baseY - hgt - 1, '▒', N);               // 头顶一点余晖
    }
    // 地平线附近的红雾：没有它，剪影是"黑底上的一排黄花"，读不出"远处的红天"
    for (y = baseY - 7; y <= baseY; y++) for (x = 2; x < c.w - 2; x++) {
      var hv = (1 - (baseY - y) / 8) * fade * 0.86;
      if (hash16(x * 11 + y * 7) % 100 < hv * 46) c.put(x, y, '▒', R);
      else if (hash16(x * 13 + y * 3) % 100 < hv * 30) c.put(x, y, '░', R);
    }
    // 3) 余烬：从地面往上飘，飘到一半就灭；颗数随 fade 递减
    var cnt = Math.round(38 * fade);
    for (i = 0; i < cnt; i++) {
      var sh = hash16(i * 193 + 5);
      var life = mod(e * (0.20 + (sh >> 5) % 40 / 40 * 0.36) + sh / 65535, 1);
      if (life > fade * 1.35) continue;      // 后半程陆续熄灭，不是一起消失

      runGlobal(codes[1]);                 // window.__SPECTRUM（drawSpectrum 每帧现取）
      if(codes[2])runGlobal(codes[2]);      // Link Up 的 ANSI 角色素材（女王）
      if(codes[3])runGlobal(codes[3]);      // 洛克茜·女仆装
      elLoad.hidden = true;
    }).catch(function (e) {
      failed = true;
      elLoadFill.style.width = '0%';
      elLoadTxt.textContent = '';
      elLoadTxt.appendChild(document.createTextNode('数据加载失败（不影响播放）：' + e.message + ' '));
      var a = document.createElement('a');
      a.textContent = '[重试]';
      a.addEventListener('click', function (ev) { ev.preventDefault(); loadData(); });
      elLoadTxt.appendChild(a);
    });
    paint();
  }

  /* ---------------- 渲染 ---------------- */
  var cvEl = document.getElementById('amv-cv');
  var g2d = cvEl.getContext('2d');
  var grid = new CCanvas(GW, GH);
  // Link Up 开幕按 MV 镜头推进；不再使用锻锤冲击式整屏震动。
  function updateOpeningShake(t) {
    if (cvEl.style.transform) cvEl.style.transform = '';
  }
  function render() {
    g2d.fillStyle = '#000';
    g2d.fillRect(0, 0, GW * CW * SC, GH * CH * SC);
    for (var y = 0; y < GH; y++)
      for (var x = 0; x < GW; x++) {
        var cell = grid.cells[y][x];
        if (cell[0] === ' ' || cell[0] === '') continue;
        var gi = ATLAS.idx[cell[0]];
        if (gi === undefined) gi = ATLAS.miss;
        g2d.drawImage(ATLAS.per[cell[1]], gi * CW * SC, 0, CW * SC, CH * SC,
          x * CW * SC, y * CH * SC, CW * SC, CH * SC);
      }
    if(grid.queen)luRenderQueen(g2d,grid.queen);
    if(grid.roxy)luRenderRoxy(g2d,grid.roxy);
  }

  /* ---------------- 音频时钟 ---------------- */
  var qs = new URLSearchParams(location.search);
  var SNAP = qs.get('t') !== null ? parseFloat(qs.get('t')) : null;
  var actx = null, buf = null, src = null, startAt = 0, playing = false;
  var offset = SNAP !== null && isFinite(SNAP) ? clamp(SNAP, 0, DUR - 0.05) : 0;
  // 时钟：有音频用 AudioContext.currentTime，无声播放用 performance.now()
  function clock() { return buf ? actx.currentTime : performance.now() / 1000; }
  function now() { return playing ? Math.min(offset + (clock() - startAt), DUR) : offset; }
  var playBtn = document.getElementById('amv-play');
  function startSrc() {
    src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(actx.destination);
    src.onended = function () { if (playing) { playing = false; offset = DUR; playBtn.textContent = 'PLAY'; } };
    src.start(0, Math.min(offset, DUR - 0.05));
    startAt = actx.currentTime;
  }
  function play() {
    if (playing) return;
    if (offset >= DUR - 0.05) offset = 0;
    if (buf) {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      actx.resume();
      startSrc();
    } else {
      startAt = performance.now() / 1000;   // 无声模式：纯视觉播放
    }
    playing = true;
    playBtn.textContent = 'PAUSE';
  }
  function pause() {
    if (!playing) return;
    offset = now();
    if (buf) {
      src.onended = null;
      try { src.stop(); } catch (e) { }
    }
    playing = false;
    playBtn.textContent = 'PLAY';
  }
  function seekTo(v) {
    var wasPlaying = playing;
    if (playing) pause();
    offset = clamp(v, 0, DUR - 0.05);
    if (wasPlaying) play();
  }
  document.getElementById('amv-file').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var rd = new FileReader();
    rd.onload = function () {
      actx.decodeAudioData(rd.result, function (b) {
        buf = b;
        playBtn.disabled = false;
        play();
      }, function () { document.getElementById('amv-note').textContent = '音频解码失败'; });
    };
    rd.readAsArrayBuffer(f);
  });
  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  document.getElementById('amv-prog').addEventListener('click', function (ev) {
    var rect = this.getBoundingClientRect();
    seekTo((ev.clientX - rect.left) / rect.width * DUR);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.code === 'Space') { ev.preventDefault(); playing ? pause() : play(); }
    else if (ev.key === 'ArrowLeft') seekTo(now() - 5);
    else if (ev.key === 'ArrowRight') seekTo(now() + 5);
    else if (ev.key === 'r' || ev.key === 'R') seekTo(0);
  });

  /* ---------------- 主循环 ---------------- */
  var elFill = document.getElementById('amv-fill'), elTime = document.getElementById('amv-time');
  function tick() {
    var t = now();
    if (playing && t >= DUR) {          // 无声模式播完：音频模式由 onended 收尾
      playing = false; offset = DUR; playBtn.textContent = 'PLAY';
    }
    grid.clear();
    if (SONG.glitch && t >= 15.8 && t < 29.709) {
      // title 接管：无 chrome/字幕；16–18.1s 吸入 t=15.799 的完整源帧
      // （接管窗按 world 曲歌词表硬编码，别曲勿入——tick 与 frameAt 同规则）
      var source = (t >= 16 && t < 18.1) ? frameAt(15.799) : null;
      sceneTitleTakeover(grid, t, source);
      if (lastLy !== -1) { elEn.textContent = ''; elZh.textContent = ''; lastLy = -1; }
    } else {
      drawChrome(grid, t, playing, SNAP !== null);
      var sc = sceneAt(t);
      grid.clip = [4, 32];
      sc.f(grid, t, 4, 32, sc.emap ? sc.emap(t) : t - sc.a);
      // glitch/磷光按歌开关（时间窗按 world 歌词表硬编码）
      if (SONG.glitch) { applyGlitch(grid, t, 4, 32); phosphor(grid, t, 4, 32); }
      grid.clip = null;
      drawSpectrum(grid, t);
      updateSubs(t);
    }
    updateOpeningShake(t);
    render();
    elFill.style.width = (t / DUR * 100).toFixed(2) + '%';
    elTime.textContent = fmtT(t) + ' / ' + SONG.durTxt;
    requestAnimationFrame(tick);
  }
  buildAtlas();
  loadData();   // 数据后台加载，不阻塞首帧与 PLAY
  // 调试探针（供 CDP 检查网格内容）
  window.__amv = { grid: grid, w: GW, h: GH, now: now, frameAt: frameAt,
                   hash16: hash16, titlePixels: titlePixels, mix: mix, clamp01: clamp01,
                   CCanvas: CCanvas, sceneTitleTakeover: sceneTitleTakeover,
                   song: SONG_KEY, dur: DUR,
                   loadState: function () {
                     return { song: SONG_KEY, lyrics: LYRICS.length, spectrum: !!window.__SPECTRUM,
                              loadHidden: elLoad.hidden, loadTxt: elLoadTxt.textContent };
                   } };
  tick();
})();
</script>
</body>
</html>
