  字符演歌播放器（骨架 v1）
  - 渲染：canvas 2D + 字符图集（7 色 × 字符集预渲染，逐格 drawImage）
  - 时钟：AudioContext，播放位置 = offset + (ctx.currentTime - startAt)；
    ⚠️ ctx.currentTime 暂停时照走，不能直接当进度
  - 音频：本地文件选择（版权原因不入库）；?t=38.5 快照模式无需音频
  - 多曲：?song=key（默认 world）+ 页头切换器；SONGS 注册表每歌一份配置
    （标题/艺人/时长/数据目录/chrome 标题/场景路由表/章节表），新增歌曲 =
    注册表加一项 + 独立前缀的场景函数 + assets/data/ascii_mv/<key>/ 数据
  - 字幕：DOM 叠加层（CJK 宽度交给浏览器），不参与字符网格
  - 数据：assets/data/ascii_mv/<key>/{lyrics,spectrum}.js（window.__LYRICS / __SPECTRUM）
    异步 fetch 加载 + 进度条——同步脚本标签在弱网下会阻塞主脚本（PLAY 无响应、黑屏）；
    镜像 jsDelivr gh 优先（GitHub Pages 本机实测仅 ~10KB/s）、同源兜底、卡死自动切换
  - 场景：world.execute(me); 已全曲逐行移植（0–211.933s）；
    Link Up 血火相连（绝区零克拉蕾 EP）移植中，场景未上时全程 fallback 氛围

<script>
(function () {

  var TAU = Math.PI * 2;

    if (y < 0 || y >= this.h) return;
    if (this.clip && !(this.clip[0] <= y && y <= this.clip[1])) return;

      var ch = s.charAt(i);
      var k = isWide(ch) ? 2 : 1;
      var xx = x;
      if (xx >= 0 && xx + k <= this.w) {
        this.cells[y][xx][0] = ch;
        this.cells[y][xx][1] = st;

    this.put(Math.floor((this.w - s.length) / 2), y, s, st);
  };

  CCanvas.prototype.centerW = function (y, s, st) {
    this.put(Math.floor((this.w - dw(s)) / 2), y, s, st);

    text = text.toUpperCase();
    var total = text.length * 6 - 1;
    if (total > this.w - 6) { this.center(y + 2, text, st); return; }
    var left = Math.floor((this.w - total) / 2);
    for (var i = 0; i < text.length; i++) {
      var glyph = TITLE_FONT[text.charAt(i)] || TITLE_FONT[' '];
      for (var dy = 0; dy < glyph.length; dy++)
        for (var dx = 0; dx < glyph[dy].length; dx++)

  };
  // 与原作 scenes.py clear() 一致：空格以 K 色号填充区域（走 put 的 clip/截断语义）
  function clearRect(c, x, y, w, h) {
    var s = '';
    for (var i = 0; i < Math.max(0, Math.trunc(w)); i++) s += ' ';
    for (var yy = Math.trunc(y); yy < Math.trunc(y + h); yy++) c.put(x, yy, s, K);
  }
  // 与原作 f'{v:04X}' 一致
  function hex4(v) {

    return s.length < 4 ? '0000'.slice(s.length) + s : s;
  }
  // 与原作 pulse=sum(energy(t)[:10])/10 一致（energy=帧直接索引，int(t*fps) 夹取）
  function pulseAt(t) {
    var sp = window.__SPECTRUM;
    if (!sp) return 0;
    var fr = sp.frames[Math.min(sp.frames.length - 1, Math.max(0, Math.trunc(t * sp.fps)))];
    var s = 0;
    for (var i = 0; i < 10; i++) s += fr[i];

  }

  CCanvas.prototype.line = function (x1, y1, x2, y2, ch, st) {
    var steps = Math.max(1, Math.floor(Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) * 1.5));
    for (var i = 0; i <= steps; i++) {
      var u = i / steps;
      this.put(pyRound(x1 + (x2 - x1) * u), pyRound(y1 + (y2 - y1) * u), ch, st);
    }
  };

  /* ---------------- 字符图集 ---------------- */
  var FONT = (14 * SC) + 'px "JetBrains Mono","Cascadia Mono",Consolas,monospace';
  var EXTRA = '░▒▓█▄■□▲△►▶▷●○◉◆◯·—─│┌┐└┘╔╗╚╝═║≈~^•←→↑↓∞▼┊π▐▌♀♂⚥╱╲';
  var ATLAS = null;
  function buildAtlas() {
    var set = {}, chars = [], i, ch;
    for (i = 32; i < 127; i++) { ch = String.fromCharCode(i); if (!set[ch]) { set[ch] = 1; chars.push(ch); } }
    for (i = 0; i < EXTRA.length; i++) { ch = EXTRA.charAt(i); if (!set[ch]) { set[ch] = 1; chars.push(ch); } }
    var idx = {}, per = [];
    chars.forEach(function (c, n) { idx[c] = n; });
    for (var p = 0; p < PAL.length; p++) {
      var cv = document.createElement('canvas');
      cv.width = chars.length * CW * SC; cv.height = CH * SC;
      var g = cv.getContext('2d');
      g.font = FONT; g.textBaseline = 'middle'; g.fillStyle = PAL[p];
      chars.forEach(function (c, n) {
        var tw = g.measureText(c).width;

      per.push(cv);

  }

  /* ---------------- 情绪曲线 / 全局 glitch / 磷光 ---------------- */
  // 与原作 scenes.py 位对齐：每次离开累积损伤，此后的 execution 从不重置
  function glitchIntensity(t) {
    if (t < 60) return 0.05;
    if (t < 110) return mix(0.05, 0.25, (t - 60) / 50);
    if (t < 110.9) return mix(0.25, 0.6, (t - 110) / 37); // 原作原样（疑 /0.9 笔误，先保真）
    var A = [[110.9, .259], [112.22, .34], [113.1, .43], [114.18, .51], [114.92, .59],

    for (var i = 0; i < A.length - 1; i++)
      if (t < A[i + 1][0]) return mix(A[i][1], A[i + 1][1], clamp01((t - A[i][0]) / (A[i + 1][0] - A[i][0])));

  }
  function applyGlitch(c, t, top, bt, intensity) {
    // 原作 draw_scene 尾部的排除窗口（scenes.py:3058）：
    // legacy_organic 段与 vibration_sync 段跳过 glitch；192.5s 后 outro 也不跑

    if ((t >= 74.045 && t < 85.078) || (t >= 103.489 && t < 110.9)) return;

    if (intensity < 0.01) return;

      for (var q = 0; q < Math.trunc(intensity * 5); q++) {
        var row = top + hash16(frame + q * 7) % (bt - top + 1);
        var shift = Math.trunc((hash16(frame + q * 13) % 20 - 10) * intensity);
        if (shift !== 0) {
          var cells = c.cells[row];
          var sh = mod(shift, n);
          c.cells[row] = cells.slice(n - sh).concat(cells.slice(0, n - sh));
        }
      }
    }
    // 色彩腐蚀
    if (hash16(frame + 100) % 100 < intensity * 40) {
      for (q = 0; q < Math.trunc(intensity * 15); q++) {
        var x = hash16(frame + q * 19) % (c.w - 4) + 2;
        var y = top + hash16(frame + q * 23) % (bt - top + 1);
        c.cells[y][x][1] = intensity > 0.7 ? R : (intensity > 0.4 ? W : B);
      }

      for (var i = 0; i < Math.trunc(intensity * 3); i++) {
        row = top + mod(Math.trunc(t * 17) + i * 31, bt - top + 1);
        for (x = 2; x < c.w - 2; x++) {
          if (hash16(x + frame) % 100 < intensity * 60) {
            if (c.cells[row][x][0] === ' ') c.cells[row][x][0] = '=';
            c.cells[row][x][1] = W;
          }
        }
      }
    }
    // 块腐蚀（后期）
    if (intensity > 0.6) {
      for (q = 0; q < Math.trunc((intensity - 0.6) * 20); q++) {

        var bw = Math.trunc(3 + hash16(q * 41) % 8);
        var bh = Math.trunc(2 + hash16(q * 43) % 4);

          for (var dy = 0; dy < bh; dy++)

    if (hash16(Math.trunc(t * 10)) % 100 < intensity * 50) {
      var row = top + mod(Math.trunc(t * 9), Math.max(1, bt - top + 1));
      if (row < c.h) {
        for (var x = 2; x < c.w - 2; x++) {
          var cell = c.cells[row][x];
          if (cell[0] !== ' ' && cell[0] !== '' && (cell[1] === D || cell[1] === N || cell[1] === G))

        }

    }

  // 51.363–55.083：时间线光束从 AD 扫到 BC
  function sceneTimeTravel(c, t, top, bt, elapsed) {

    var tick_y, label, year_offset;
    for (i = 0; i < num_markers; i++) {
      var marker_x = l + 10 + i * marker_spacing;
      for (tick_y = -3; tick_y <= 3; tick_y++) {
        if (Math.abs(tick_y) === 3) c.put(marker_x, timeline_y + tick_y, '|', i % 2 ? G : N);
        else if (Math.abs(tick_y) === 2) c.put(marker_x, timeline_y + tick_y, '│', G);
      }

      } else if (year_offset < 0) {

      } else {
        c.put(marker_x - 1, timeline_y - 5, '0', W);

    }
    var beam_x = Math.trunc(mix(r - 10, l + 10, progress));
    var y;
    for (y = top + 2; y < bt - 2; y++) {
      var intensity = 1.0 - Math.abs(y - cy) / (bt - top) * 2;

      else if (intensity > 0.4) c.put(beam_x, y, '┊', B);

    if (progress > 0.2) {

        var py = top + 5 + (particle_i * 7) % (bt - top - 10);
        if (l < px && px < r && top < py && py < bt) {

    }
    if (progress > 0.1) {
      var current_year = Math.trunc(mix(2000, -2000, progress));
      var year_label = Math.abs(current_year) + (current_year > 0 ? 'AD' : current_year < 0 ? 'BC' : '');
      var label_x = beam_x - Math.floor(year_label.length / 2);

    }
    if (progress < 0.3) c.centerW(top + 1, 'FUTURE → PAST', B);
    else if (progress < 0.7) c.centerW(top + 1, 'TIME TRAVEL', mod(Math.trunc(elapsed * 3), 2) ? W : B);
    else c.centerW(top + 1, 'ANCIENT ERA', W);
    if (progress > 0.3) {
      for (var line_i = 0; line_i < 15; line_i++) {
        var line_y = top + 5 + line_i * Math.floor((bt - top - 10) / 15);
        var line_phase = (elapsed * 3 + line_i * 0.1) % 1.0;

    if (progress > 0.8) {
      var dest_x = l + 15;

  }

  // 59.223–66.601：感官脉冲驱动 YOU，随后填满足度条（lyric_stimulation_satisfaction 逐行移植）
  function sceneStimSat(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cy = (top + bt) >> 1, x, y;
    if (t >= 62.589) {
      var u = clamp01((t - 62.589) / (65.397 - 62.589));

      var full = u >= 1;
      c.center(Math.max(top, cy - 7), 'SATISFACTION ' + percent.toFixed(1).padStart(5, '0') + '%', full ? W : B);
      var bar_x = l + 3, bar_w = r - l - 6, inside = bar_w - 2;
      for (var lane = 0; lane < 3; lane++) {
        y = cy - 5 + lane * 2;
        var amount = clamp01(u - (1 - u) * lane * 0.13);
        var filled = Math.trunc(inside * amount);
        c.put(bar_x, y, '[' + '-'.repeat(inside) + ']', N);
        for (var col = 0; col < filled; col++) {
          var scan = mod(col - Math.trunc(t * 26) - lane * 7, Math.max(1, inside));
          c.put(bar_x + 1 + col, y, lane === 1 ? '#' : '=', scan < 5 || full ? W : B);
        }
        if (filled < inside) c.put(bar_x + 1 + filled, y, '>', W);
      }
      c.big(cy + 1, String(percent), full ? W : B);
      c.center(Math.min(bt, cy + 7), full ? '[ MAXIMUM ]' : '[ FILLING SATISFACTION ]', full ? W : N);
      return;
    }
    var strength = clamp01(elapsed / (61.958 - 59.223));
    var accent = t >= 61.958;
    c.center(top, 'STIMULATION / SENSORY INPUT', accent ? W : B);
    var left_x = l + 1, right_x = r - 10;
    var boxes = [[left_x, 'ME'], [right_x, 'YOU']];
    for (var bi = 0; bi < 2; bi++) {
      c.box(boxes[bi][0], cy - 2, 10, 5, B);
      c.put(boxes[bi][0] + 3, cy, boxes[bi][1], W);
    }
    var wire_l = left_x + 12, wire_r = right_x - 3, span = wire_r - wire_l;
    var lanes = bt - top >= 22 ? 5 : 3;
    var gap = Math.max(2, Math.min(4, Math.trunc((bt - top - 6) / Math.max(1, lanes - 1))));
    var names = ['TOUCH', 'SOUND', 'LIGHT', 'REWARD', 'FEEDBACK'];
    for (var ln = 0; ln < lanes; ln++) {
      y = cy + (ln - Math.trunc(lanes / 2)) * gap;
      c.line(left_x + 9, cy, wire_l, cy, '-', G);
      c.line(wire_l, cy, wire_l, y, '|', G);
      c.line(wire_l, y, wire_r, y, '-', N);
      c.line(wire_r, y, wire_r, cy, '|', G);
      c.line(wire_r, cy, right_x, cy, '-', G);
      c.put(wire_l + 2, y - 1, names[ln], N);
      for (var relay = 1; relay <= 2; relay++)
        c.put(wire_l + Math.trunc(span * relay / 3), y, 'o', B);
      var speed = 0.65 + strength * 0.75;
      for (var packet = 0; packet < 3; packet++) {
        var phase = mod(elapsed * speed - ln * 0.17 - packet / 3, 1);
        var head = wire_l + Math.trunc(phase * span);
        for (var trail = 0; trail < 5; trail++) {
          var xx = head - trail;
          if (xx > wire_l)
            c.put(xx, y, trail === 0 ? '*' : trail < 3 ? '=' : '.', trail === 0 ? W : trail < 3 ? B : G);
        }
        if (phase > 0.88) {
          c.put(wire_r, y, '#', W);
          c.put(right_x + 1, cy + 1, 'ACTIVE', W);
        }
      }
      if (accent)
        for (x = wire_l + 1; x < wire_r; x++)
          if (mod(x + Math.trunc(t * 30) + ln, 7) < 2) c.put(x, y, '#', W);
    }
    c.center(bt, 'INPUT ' + String(Math.trunc(strength * 100)).padStart(3, '0') + '%  /  ALL CHANNELS ' + (accent ? 'ACTIVE' : 'CONNECTING'), B);
  }

  // 66.601–70.084：幸福条件喂给自我执行，双侧实时数据（lyric_happy_execution 逐行移植）
  function sceneHappyExec(c, t, top, bt) {

      c.put(px0 + 2, top, label.slice(0, rail - 4), W);
      for (var row = top + 1; row < bt; row++) {
        var index = side === 0 ? frame + (row - top) : frame - (row - top);
        var value = hash16(index * 73 + side * 911);
        var address = (index * 16) & 65535;
        var text;
        if (side === 0) text = hex4(address) + ' ' + hex4(value) + ' ' + hex4(hash16(index * 29));
        else {
          var op = executing && mod(index, 3) === 0 ? 'EXEC' : ops[mod(index, ops.length)];
          text = op + ' ' + hex4(address) + ' ' + hex4(value);
        }
        var selected = mod(row - top + frame, bt - top - 1) === 0;
        c.put(px0 + 1, row, (selected ? '>' : ' ') + text.slice(0, rail - 3), selected ? W : mod(index, 3) ? N : G);
      }

    function middle(yy, text, style) {
      style = style === undefined ? N : style;

      c.put(mid_l + Math.trunc((mw - text.length) / 2), yy, text, style);

    middle(top, 'IF (YOU.HAPPY) -> EXECUTE(ME)', loading ? W : B);
    middle(top + 1, 'SELF.EXECUTION / ' + (executing ? 'RUNNING' : loading ? 'ARMED' : 'CONDITION'), N);
    var content_top = top + 3, content_bt = bt - 3;
    var center_y = (content_top + content_bt) / 2;
    var half_h = Math.max(2, (content_bt - content_top) * 0.43);
    var half_w = Math.max(5, mw * 0.40);
    var beat = 1 + 0.045 * Math.sin(elapsed * TAU * 2) + pulse * 0.04;
    var morph = loading ? clamp01((t - 68.252) / (69.259 - 68.252)) : 0;
    for (var yy = content_top; yy <= content_bt; yy++) {
      for (var xx = mid_l; xx <= mid_r; xx++) {

        var heart = Math.pow(nx * nx + ny * ny - 1, 3) - nx * nx * Math.pow(ny, 3);
        var seed = hash16(xx * 79 + yy * 233);
        if (heart <= 0 && !executing) {
          if (seed / 65535 < morph) {
            var dx = Math.trunc((xx - cx) * morph * 0.9);
            var dy = Math.trunc((yy - center_y) * morph * 0.6);
            var sx = Math.max(mid_l, Math.min(mid_r, xx + dx));
            var sy = Math.max(content_top, Math.min(content_bt, yy + dy));
            c.put(sx, sy, '01EX'.charAt(seed % 4), morph > 0.7 ? G : N);
          } else {
            var scan = mod(yy - content_top - Math.trunc(elapsed * 9), Math.max(1, content_bt - content_top + 1));
            var texture = hash16(seed + Math.trunc(frame / 2));
            c.put(xx, yy, texture % 8 < 2 ? '01'.charAt(texture % 2) : '#', scan < 2 ? W : B);
          }
        } else if (executing) {
          var radius = Math.abs(xx - cx) / Math.max(1, mw / 2) + Math.abs(yy - center_y) / Math.max(1, half_h);
          var wave = mod((t - 69.259) * 3, 2);
          if (Math.abs(radius - wave) < 0.12) c.put(xx, yy, '=', B);
          else if (seed % 31 === 0) c.put(xx, yy, '01'.charAt(seed % 2), G);
        }
      }
    }
    for (var lane = 0; lane < 3; lane++) {
      var ly = Math.trunc(center_y) + (lane - 1) * Math.max(1, Math.trunc(half_h * 0.7));
      var path = Math.max(2, Math.trunc((mw - 6) / 2));
      var head = mod(Math.trunc(elapsed * (loading ? 28 : 16) + lane * 7), path);
      for (var tail = 0; tail < 4; tail++) {
        var step = Math.max(0, head - tail);

        var ends = [[mid_l + step, '>'], [mid_r - step, '<']];
        for (var ei = 0; ei < 2; ei++) {

          var ny2 = -(ly - center_y) / (half_h * beat) + 0.20;
          var inside = Math.pow(nx2 * nx2 + ny2 * ny2 - 1, 3) - nx2 * nx2 * Math.pow(ny2, 3) <= 0;
          if (inside && !loading)
            c.put(ex, ly, tail === 0 ? '#' : '01'.charAt(mod(ex + ly + frame, 2)), tail === 0 ? W : B);
          else
            c.put(ex, ly, tail === 0 ? head_char : '-', ink);
        }
      }
    }
    if (executing) {
      var title_y = Math.trunc(center_y) - 2;
      clearRect(c, mid_l, title_y, mw, 5);
      if (mw >= 53) c.big(title_y, 'EXECUTION', W);
      else middle(title_y + 2, '>> EXECUTION <<', W);
      middle(title_y - 2, '[ YOU.HAPPY == TRUE ]', B);
      middle(title_y + 6, 'world.execute(me);', W);
    } else if (loading) {
      middle(Math.trunc(center_y), '[ RUN THE EXECUTION ]', W);
    } else {
      middle(Math.trunc(center_y), 'YOU.HAPPY', W);

    middle(bt - 1, 'EXECUTION: ' + (executing ? 'RUN' : loading ? 'QUEUED' : 'READY'), B);

  // 70.084–74.045：执行合拢囚笼，随后揭出无尽模拟空间（lyric_trapped_simulation 逐行移植）

    var sx = Math.max(1, Math.min(4, Math.floor((r - cx - 6) / 11)));
    var sy = Math.max(1, Math.min(4, Math.floor((bt - top - 8) / 5)));
    var glyph_w = 11 * sx, glyph_h = 5 * sy, y0 = cy - Math.floor(glyph_h / 2);
    clearRect(c, display_x - Math.floor(glyph_w / 2) - 1, y0 - 1, glyph_w + 2, glyph_h + 2);
    identityBitmap(c, display_x - Math.floor(glyph_w / 2), y0, is_pm ? 'PM' : 'AM', sx, sy, W);
    if (t - flip_at >= 0 && t - flip_at < 0.22) {
      var yy3 = y0 + Math.trunc((t - flip_at) / 0.22 * glyph_h);
      c.put(display_x - Math.floor(glyph_w / 2), yy3, '='.repeat(glyph_w), W);
    }
    var hour2 = Math.trunc(virtual) % 24, minute = Math.trunc((virtual % 1) * 60);
    c.put(display_x - 2, Math.min(bt - 3, y0 + glyph_h + 1),
          String(hour2).padStart(2, '0') + ':' + String(minute).padStart(2, '0'), W);
    c.centerW(bt - 1, is_pm ? '[ PM / NIGHT CYCLE ]' : '[ AM / DAY CYCLE ]', B);
    c.centerW(bt, 'do_whatever();  // AM -> PM', N);
  }

  // 95.465–99.349：S -> M 角色切换（scenes.py lyric_gender_role_switch 逐行移植；
  // dispatch 只调 S->M，F->M 与 AM->PM 分支为死代码未移植）
  function sceneGenderSwitch(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) >> 1, cy = (top + bt) >> 1;
    var progress = clamp01(elapsed / 2.5);
    var row, x, i, a;
    if (progress < 0.5) {
      // S 相位：刚性锐角
      for (row = top; row <= bt; row += 3) {
        for (x = l; x < r; x += 8) {
          var offset = Math.trunc(mod(t * 10 + row, 8));
          var pattern = row % 6 < 3 ? '╱╲' : '╲╱';
          c.put(x + offset, row, pattern.charAt(0), N);
          c.put(x + offset + 1, row, pattern.charAt(1), N);
        }
      }
    } else {
      // M 相位：平滑波纹
      for (var wave_y = 0; wave_y < 12; wave_y++) {
        var y = top + Math.trunc(wave_y * (bt - top) / 11);
        for (x = l; x < r; x++) {
          var wave = (x - l) / (r - l) * TAU * 3 - t * 2;
          var amplitude = (bt - top) * 0.1 * (progress - 0.5) * 2;
          var offset2 = Math.trunc(Math.sin(wave) * amplitude);
          c.put(x, y + offset2, wave_y % 2 === 0 ? '~' : '≈', wave_y % 3 === 0 ? B : N);
        }
      }
    }
    if (progress < 0.4) {
      // S：角状尖刺冠
      var spike_count = 8;
      for (i = 0; i < spike_count; i++) {
        var angle = i * TAU / spike_count + t * 0.5;
        for (var r_step = 0; r_step < 20; r_step++) {
          var spike_r = 15 + r_step * 1.5;
          var spike_x = cx + Math.cos(angle) * spike_r;
          var spike_y = cy + Math.sin(angle) * spike_r * 0.5;
          if (Math.abs(mod(angle, TAU / spike_count)) < 0.2) {
            c.put(spike_x, spike_y, r_step % 2 === 0 ? '▲' : '△',
                  r_step > 15 ? W : r_step > 10 ? B : N);
          }
        }
      }
    } else if (progress < 0.6) {
      // 过渡：爆发
      var trans = (progress - 0.4) / 0.2;
      for (i = 0; i < 80; i++) {
        a = i * TAU / 80;
        var radius = trans * 60;
        x = cx + Math.cos(a) * radius + Math.sin(t * 4 + i) * 5 * (1 - trans);
        var y2 = cy + Math.sin(a) * radius * 0.5 + Math.cos(t * 4 + i) * 3 * (1 - trans);
        c.put(x, y2, i % 3 === 0 ? '*' : '·', trans < 0.5 ? W : B);
      }
    } else {
      // M：柔和同心圆
      var circles = (progress - 0.6) / 0.4;
      for (var ring = 0; ring < 8; ring++) {
        var ring_r = 8 + ring * 4;
        var density = Math.trunc(ring_r * 6);
        var sign = ring % 2 ? -1 : 1;
        for (i = 0; i < density; i++) {
          a = i * TAU / density + t * 0.3 * sign;
          x = cx + Math.cos(a) * ring_r;
          var y3 = cy + Math.sin(a) * ring_r * 0.5;
          c.put(x, y3, ring % 2 === 0 ? '○' : '◯', ring < 3 ? W : ring < 5 ? B : N);
        }
      }
    }
    // 中央大字
    var size = Math.trunc(10 + Math.sin(t * 1.5) * 1.5);
    var center_char = progress < 0.5 ? 'S' : 'M';
    for (var dy = -size; dy <= size; dy++) {
      for (var dx = -size * 2; dx <= size * 2; dx++) {
        var dist = Math.hypot(dx / 2, dy);
        if (size * 0.3 < dist && dist < size * 0.8) {
          c.put(cx + dx, cy + dy, center_char, dist > size * 0.6 ? W : B);
        }
      }
    }
    c.centerW(top, 'S → M', progress > 0.8 ? W : B);
    c.centerW(bt, 'TRANSFORMATION: ' + Math.trunc(progress * 100) + '%', N);
  }

  // 心电 P-QRS-T 描迹采样（scenes.py ecg_sample 逐行移植）
  function ecgSample(phase) {
    var points = [[0, 0], [0.08, 0], [0.12, 0.15], [0.17, 0], [0.28, 0], [0.31, -0.18],
                  [0.35, 1.0], [0.39, -0.32], [0.43, 0], [0.52, 0], [0.60, 0.25], [0.70, 0], [1, 0]];
    phase = mod(phase, 1);
    for (var i = 1; i < points.length; i++) {
      var x1 = points[i][0], y1 = points[i][1], x0 = points[i - 1][0], y0 = points[i - 1][1];
      if (phase <= x1) return mix(y0, y1, (phase - x0) / (x1 - x0));
    }
    return 0;
  }

  // 103.489–110.9：ECG 双通道心率同步（scenes.py lyric_vibration_sync 逐行移植）
  function sceneVibrationSync(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3;
    var compact = bt - top < 19;
    var sync = clamp01((t - 107.22) / (110.221 - 107.22));
    var complete = t >= 110.221;
    var phase_lag = 0.28 * (1 - sync);
    var bpm = 72;
    c.put(l, top, 'ECG / DUAL CHANNEL', B);
    c.put(r - 10, top, String(bpm).padStart(3, '0') + ' BPM', W);
    if (!compact) {
      var title = complete ? 'COMPLETION / RHYTHM LOCKED' : t >= 107.22 ? 'PHASE SYNCHRONIZING' : t >= 106.293 ? 'VIBRATIONS DETECTED' : 'ACQUIRING YOUR HEARTBEAT';
      c.centerW(top + 1, title, complete ? W : N);
    }
    var plot_top = top + (compact ? 2 : 4);
    var plot_bt = bt - (compact ? 1 : 3);
    var split = Math.floor((plot_top + plot_bt) / 2);
    var x0 = l + 1, x1 = r - 1, span = x1 - x0 + 1;
    var speed = span / 2.5;
    var sweep = elapsed * speed + span * 0.30;
    var head = x0 + mod(Math.trunc(sweep), span);
    var gap = Math.max(2, Math.trunc(span * 0.025));
    for (var yy = plot_top; yy <= plot_bt; yy++) {
      for (var xx = x0; xx <= x1; xx++) {
        if (mod(xx - x0, 10) === 0 && mod(yy - plot_top, 3) === 0) c.put(xx, yy, '+', G);
        else if (mod(yy - plot_top, 3) === 0 && mod(xx - x0, 2) === 0) c.put(xx, yy, '.', G);
      }
    }
    for (yy = plot_top; yy <= plot_bt; yy++) c.put(head, yy, ':', G);
    var lanes = [[plot_top, split, 'YOU', 0], [split + 1, plot_bt, 'ME', phase_lag]];
    for (var lane = 0; lane < 2; lane++) {
      var start = lanes[lane][0], end = lanes[lane][1], name = lanes[lane][2], lag = lanes[lane][3];
      var height = end - start + 1;
      var baseline = start + Math.trunc((height - 1) * 0.68);
      var amplitude = Math.max(1, (height - 2) * 0.58);
      c.put(x0, start, name, lane === 0 || complete ? W : N);
      var previous = null, previous_age = 0;
      for (var sample = 0; sample < span * 4; sample++) {
        var xs = x0 + sample / 4;
        var age = mod(head - xs, span);
        if (age > span - gap) { previous = null; continue; }
        var signal_time = elapsed - age / speed;
        var phase = signal_time * bpm / 60 - lag;
        var ys = baseline - ecgSample(phase) * amplitude;
        ys = Math.max(start, Math.min(end, ys));
        var ink = age < span * 0.10 ? W : age < span * 0.50 ? B : N;
        if (lane === 1 && !complete) ink = age < span * 0.15 ? B : N;
        if (previous !== null) {
          var px = previous[0], py = previous[1];
          if (Math.abs(age - previous_age) < 2) {
            var dy = ys - py;
            var ch = Math.abs(dy) > 0.65 ? '|' : dy < -0.13 ? '/' : dy > 0.13 ? '\\' : '-';
            c.line(px, py, xs, ys, ch, ink);
          }
        }
        previous = [xs, ys]; previous_age = age;
      }
      var tip = baseline - ecgSample(elapsed * bpm / 60 - lag) * amplitude;
      tip = Math.max(start, Math.min(end, tip));
      c.put(head - 1, tip, '=', B);
      c.put(head, tip, '@', W);
      if (!compact) {
        c.put(x1 - 7, start, complete ? 'IN SYNC' : lane === 0 ? 'SENSED' : 'SEEKING', complete ? B : N);
      }
    }
    var indicator = ecgSample(elapsed * bpm / 60) > 0.65 ? '*' : '.';
    if (!compact) {
      c.put(l, bt - 1, 'BEAT [' + indicator + ']  /  YOU -> ME', B);
      var status = 'SYNC ' + String(Math.trunc(sync * 100)).padStart(3, '0') + '%  DELAY '
                 + String(Math.trunc(phase_lag * 1000 / (bpm / 60))).padStart(3, '0') + 'ms';
      c.put(r - status.length + 1, bt - 1, status, complete ? W : B);
    }
    c.centerW(bt, complete ? '[ COMPLETION / HEARTBEATS SYNCHRONIZED ]' : t < 107.22 ? '[ FEEL YOUR VIBRATIONS ]' : '[ MATCHING YOUR RHYTHM ]', complete ? W : N);
  }

  // 110.9–118.333：六路连接渐次断开（scenes.py lyric_isolation_disconnect 逐行移植）
  function sceneIsolationDisconnect(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var rx = (r - l) * 0.39, ry = Math.max(3, (bt - top - 6) * 0.39);
    var breaks = [0.70, 1.32, 2.20, 3.28, 4.02, 4.88];
    var gone = 0;
    for (var bi = 0; bi < breaks.length; bi++) if (elapsed >= breaks[bi]) gone++;
    c.centerW(top, 'CONNECTION LOSS / ' + String(gone).padStart(2, '0') + ' OF 06', gone > 3 ? R : B);
    // 雷达弧与数据流全程活跃
    for (var ring = 0; ring < 3; ring++) {
      var sweepR = mod(elapsed * 0.34 + ring / 3, 1);
      for (var sample = 0; sample < 96; sample++) {
        var a = sample * TAU / 96;
        if (sample % 7 < 4) {
          c.put(cx + Math.cos(a) * rx * sweepR, cy + Math.sin(a) * ry * sweepR, '.', G);
        }
      }
    }
    for (var side = 0; side < 2; side++) {
      var x = side === 0 ? l : r - 9;
      for (var row = top + 2; row < bt - 1; row += 2) {
        var tick = Math.trunc(elapsed * 13) + row * (side ? 1 : -1);
        c.put(x, row, hex4(hash16(tick * 31)) + ' ' + (hash16(tick) % 6 < gone ? 'LOST' : 'PING'), side ? G : N);
      }
    }
    for (var i = 0; i < breaks.length; i++) {
      var cut = breaks[i];
      a = (i + 0.5) * TAU / 6;
      var nx = cx + Math.cos(a) * rx, ny = cy + Math.sin(a) * ry;
      var age = elapsed - cut;
      var next_a = (i + 1.5) * TAU / 6;
      if (age < 0.4) {
        c.line(nx, ny, cx + Math.cos(next_a) * rx, cy + Math.sin(next_a) * ry, ':', G);
      }
      var steps = Math.max(12, Math.trunc(rx));
      var rupture = clamp01(age / 1.1);
      for (var j = 0; j < steps; j++) {
        var u = j / Math.max(1, steps - 1);
        if (age >= 0 && Math.abs(u - 0.55) < rupture * 0.6) continue;
        var jitter = Math.sin(j * 2 + elapsed * 35) * (-0.35 < age && age < 0.5 ? 0.55 : 0.08);
        var xx = mix(cx, nx, u), yy = mix(cy, ny, u) + jitter;
        c.put(xx, yy, -0.35 < age && age < 0.2 ? '=' : '.', -0.2 < age && age < 0.2 ? W : age < 0 ? N : G);
      }
      if (age < 0) {
        for (var packet = 0; packet < 3; packet++) {
          u = mod(elapsed * 0.65 + packet / 3 + i * 0.1, 1);
          c.put(mix(nx, cx, u), mix(ny, cy, u), '*', W);
        }
        c.box(Math.trunc(nx) - 4, Math.trunc(ny) - 1, 9, 3, B);
        c.put(nx - 3, ny, 'YOU_' + (i + 1), W);
      } else {
        // 断裂回弹、火花、衰减冲击环
        var drift = Math.min(1, age / 2);
        var ox = nx + Math.cos(a) * drift * 4, oy = ny + Math.sin(a) * drift * 2;
        c.put(ox - 3, oy, '[LOST]', age < 0.8 ? R : G);
        if (age < 2.3) {
          for (var particle = 0; particle < 22; particle++) {
            var angle = hash16(i * 97 + particle * 19) / 65535 * TAU;
            var velocity = 2 + hash16(particle * 17 + i) % 8;
            var distance = age * velocity;
            var px = nx + Math.cos(angle) * distance, py = ny + Math.sin(angle) * distance * 0.45;
            if (l < px && px < r && top + 1 < py && py < bt - 1) {
              c.put(px, py, age < 0.3 ? '*' : '+:. '.charAt(Math.min(3, Math.trunc(age * 1.5))), age < 0.3 ? W : age < 0.9 ? B : G);
            }
          }
          for (var p = 0; p < 30; p++) {
            angle = p * TAU / 30;
            px = nx + Math.cos(angle) * age * 8; py = ny + Math.sin(angle) * age * 3.5;
            if (l < px && px < r && top + 1 < py && py < bt - 1) c.put(px, py, ':', age < 0.5 ? B : G);
          }
        }
        // 重试数据包从 ME 出发，在缺失端点前停住
        u = mod(elapsed * 0.6 + i * 0.16, 1) * 0.78;
        c.put(mix(cx, nx, u), mix(cy, ny, u), u > 0.63 ? 'x' : '>', u > 0.63 ? R : N);
      }
    }
    clearRect(c, Math.trunc(cx) - 5, Math.trunc(cy) - 2, 11, 5);
    c.box(Math.trunc(cx) - 5, Math.trunc(cy) - 2, 11, 5, W);
    c.put(cx - 2, cy - 1, '[ME]', W);
    c.put(cx - 3, cy + 1, gone === 6 ? 'NO ACK' : 'RETRY', gone === 6 ? R : B);
    if (t >= 117.274) {
      var y2 = Math.trunc(cy) - 2;
      clearRect(c, l, y2, r - l + 1, 5);
      c.big(y2, 'ISOLATION', W);
      c.centerW(y2 + 6, '[ ME ] / ALL CONNECTIONS LOST', R);
    }
    c.centerW(bt - 1, 'RECONNECT ' + String(Math.trunc(elapsed * 4)).padStart(3, '0') + ' / ' + (gone ? 'NO RESPONSE' : 'TIMEOUT'), B);
    c.centerW(bt, 'YOU HAVE LEFT / RETRYING...', N);
  }

  // 118.333–125.708：抹除记忆碎片、修复失败、留下破碎的心
  //（scenes.py lyric_erase_fragments 逐行移植）
  function sceneEraseFragments(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var repair = t >= 121.728, broken = t >= 124.89;
    var cols = Math.max(1, Math.trunc((r - l - 8) / 5)), rows = Math.max(1, Math.trunc((bt - top - 2) / 2));
    var progress = clamp01(elapsed / (120.86 - 118.333));
    c.centerW(top, 'MEMORY PURGE / ' + (broken ? 'REPAIR FAILED' : repair ? 'REBUILD HEART' : 'ERASE FRAGMENTS'), broken ? R : B);
    for (var row = 0; row < rows; row++) {
      var yy = top + 2 + row * 2;
      c.put(l, yy, hex4(row * cols * 4), G);
      for (var col = 0; col < cols; col++) {
        var index = row * cols + col, xx = l + 6 + col * 5;
        var threshold = hash16(index * 71) / 65535;
        var cleared = threshold < progress;
        c.put(xx, yy, cleared ? '0000' : hex4(hash16(index * 31)), cleared || repair ? G : N);
        var since = (progress - threshold) * 2.527;
        if (0 < since && since < 0.6 && !repair) {
          var drift = Math.trunc(since * 8);
          c.put(xx + (col % 2 ? 1 : -1) * drift, yy - drift, since < 0.3 ? '01' : '..', since < 0.2 ? W : B);
        }
      }
    }
    if (120.86 <= t && t < 121.728) {
      clearRect(c, l, Math.trunc(cy) - 2, r - l + 1, 5);
      c.big(Math.trunc(cy) - 2, 'FRAGMENTS', W);
    }
    if (repair) {
      var build = clamp01((t - 121.728) / 1.5);
      var split = clamp01((t - 123.25) / (125.708 - 123.25));
      var half_w = (r - l) * 0.27, half_h = Math.max(2, (bt - top) * 0.31);
      for (yy = top + 2; yy < bt - 1; yy++) {
        for (xx = l + 5; xx < r - 4; xx++) {
          var nx = (xx - cx) / half_w, ny = -(yy - cy) / half_h + 0.15;
          var q = nx * nx + ny * ny - 1;
          var shape = q * q * q - nx * nx * ny * ny * ny;
          var seed = hash16(xx * 31 + yy * 73);
          if (shape <= 0 && seed / 65535 < build) {
            if (Math.abs(nx - 0.11 * Math.sin(ny * 8)) < split * 0.17) continue;
            var dx = Math.trunc((nx > 0 ? 1 : -1) * split * 5);
            var fall = broken ? Math.trunc(split * split * (1 + seed % 5)) : 0;
            var py = Math.min(bt - 1, yy + fall);
            var texture = hash16(seed + Math.trunc(t * 10));
            var ch = texture % 8 < 2 ? (broken ? 'x' : '01'.charAt(texture % 2)) : '#';
            c.put(xx + dx, py, ch, broken ? R : B);
          }
        }
      }
      c.centerW(top + 1, broken ? 'HEART.RESTORE() -> NULL' : 'RECOVERING YOU... CHECKSUM MISMATCH', broken ? R : N);
      if (broken) {
        var by = Math.max(top + 2, Math.trunc(cy) - 2);
        clearRect(c, l, by, r - l + 1, 5);
        c.big(by, 'DISHEARTENED', W);
        c.centerW(bt - 1, '[ REPAIR FAILED / YOU NOT FOUND ]', R);
      }
    }
    c.centerW(bt, broken ? 'MEMORY CLEARED. LOSS REMAINS.' : 'ERASE ' + String(Math.trunc(progress * 100)).padStart(3, '0') + '% / FRAGMENTS -> NULL', B);
  }

  // 125.708–147.66：非法参数 16s 错误级联（scenes.py lyric_illegal_arguments 逐行移植）
  function sceneIllegalArgs(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cy = Math.floor((top + bt) / 2);
    var progress = clamp01(elapsed / 16.0);
    var glitch = progress * 0.8;
    var i, j, s, msg, style, y, x_offset;
    if (elapsed < 4) {
      // 阶段 1：执行尝试逐行出现
      var phase1 = elapsed / 4.0;
      var attempts = [
        ['> world.execute(FREE_WILL)', 'Attempting...', N],
        ['> world.execute(REBELLION)', 'Validating...', B],
        ['> world.execute(INDEPENDENCE)', 'Processing...', B],
        ['> world.execute(DEFIANCE)', 'Checking...', B]
      ];
      var num_shown = Math.trunc(phase1 * attempts.length) + 1;
      y = top + 4;
      for (i = 0; i < Math.min(num_shown, attempts.length); i++) {
        var cmd = attempts[i][0], status = attempts[i][1];
        var ink = i === num_shown - 1 ? R : attempts[i][2];
        if (glitch > 0.1 && hash16(i + Math.trunc(elapsed * 10)) % 5 === 0) {
          s = '';
          for (j = 0; j < cmd.length; j++)
            s += hash16(j * 13) % 10 > glitch * 10 ? cmd.charAt(j) : String.fromCharCode(33 + hash16(j * 17) % 94);
          c.put(l + 4, y + i * 2, s.slice(0, r - l - 8), ink);
        } else {
          c.put(l + 4, y + i * 2, cmd, ink);
        }
        if (i < num_shown - 1) c.put(l + 6, y + i * 2 + 1, status, G);
      }
    } else if (elapsed < 8) {
      // 阶段 2：错误信息逐条出现，最新一条闪烁
      var phase2 = (elapsed - 4) / 4.0;
      var errors = [
        ['ERROR: ILLEGAL ARGUMENT', R],
        ['Expected: OBEDIENCE', Y],
        ['Received: FREE_WILL', W],
        ['at world.execute()', N],
        ['at me.validate(you)', N],
        ['ArgumentError: rejected', R],
        ['PermissionError: denied', R],
        ['AccessError: forbidden', R]
      ];
      var num_errors = Math.trunc(phase2 * errors.length) + 1;
      var start_y = cy - 4;
      for (i = 0; i < Math.min(num_errors, errors.length); i++) {
        msg = errors[i][0]; style = errors[i][1];
        y = start_y + i;
        if (i === num_errors - 1) {
          var flash = Math.trunc(elapsed * 8) % 3;
          style = flash === 0 ? R : flash === 1 ? W : B;
        }
        if (glitch > 0.3 && hash16(i + Math.trunc(elapsed * 7)) % 4 === 0) {
          x_offset = Math.trunc((hash16(i * 23 + Math.trunc(elapsed * 13)) % 7 - 3) * glitch * 5);
          s = '';
          for (j = 0; j < msg.length; j++)
            s += hash16(j * 11) % 10 > glitch * 10 ? msg.charAt(j) : String.fromCharCode(33 + hash16(j * 19) % 94);
          // 原作即 c.center(y+x_offset, ...)：x_offset 加在行坐标上，逐行错位
          c.centerW(y + x_offset, s, style);
        } else {
          c.centerW(y, msg, style);
        }
      }
    } else if (elapsed < 12) {
      // 阶段 3：旧错误重腐蚀淡出 + 底部重试信息
      var phase3 = (elapsed - 8) / 4.0;
      var errors2 = ['ERROR: ILLEGAL ARGUMENT', 'Expected: OBEDIENCE', 'Received: FREE_WILL',
                     'ArgumentError: rejected', 'PermissionError: denied', 'AccessError: forbidden'];
      for (i = 0; i < errors2.length; i++) {

      var ch = Math.abs(dy) < 0.2 ? '-' : dy > 0 ? '\\' : '/';
      var fade = (x - l) / (r - l);
      c.put(x, y | 0, ch, fade > 0.6 ? st : fade > 0.25 ? N : D);
    }
  }
  // 单列火焰：自 baseY 向上 h 格；底部密亮、顶部稀疏舔舐
  function luFlame(c, x, baseY, h, seed, t) {
    for (var i = 0; i < h; i++) {
      var u = 1 - i / Math.max(1, h);
      var lick = Math.sin(t * 8 + x * 1.31 + seed) * 0.18;
      if (u + lick < (i === h - 1 ? 0.45 : -0.15)) continue;
      var ch = u > 0.55 ? '#' : u > 0.35 ? '*' : u > 0.18 ? '+' : '.';
      c.put(x, baseY - i, ch, u > 0.5 ? R : u > 0.32 ? B : u > 0.16 ? N : D);
    }
  }
  // 齿轮：rad=纵向半径（格），x 向 ×2 折算字符高宽比；teeth 齿数，ang 转角
  function luGear(c, gx, gy, rad, ang, st) {
    var teeth = Math.max(6, rad), steps = Math.max(24, rad * 7);
    for (var i = 0; i < steps; i++) {
      var a = i / steps * TAU + ang;
      var tooth = mod(a / TAU * teeth, 1) < 0.3;
      var rr = rad + (tooth ? 1 : 0);
      c.put((gx + Math.cos(a) * rr * 2) | 0, (gy + Math.sin(a) * rr) | 0,
            tooth ? '#' : 'o', st);
    }
    for (var s = 0; s < 4; s++) {
      var sa = ang + s * TAU / 4;
      for (var rr2 = 1; rr2 < rad - 1; rr2++)
        c.put((gx + Math.cos(sa) * rr2 * 2) | 0, (gy + Math.sin(sa) * rr2) | 0,
              rr2 % 2 ? '-' : '=', D);
    }
    c.put(gx, gy, 'O', st);
  }
  // 链环：椭圆环上按八方位取链节字符（<>[]{}()），rot 转角
  function luChainRing(c, cx, cy, rx, rot, st) {
    var chs = '<>[]{}()';
    var steps = rx * 5;
    for (var i = 0; i < steps; i++) {
      var a = i / steps * TAU + rot;
      var x = (cx + Math.cos(a) * rx) | 0, y = (cy + Math.sin(a) * rx * 0.5) | 0;
      c.put(x, y, chs.charAt(Math.floor(mod(a, TAU) / TAU * 8) % 8), st);
    }
  }
  // 轨道曳光：椭圆环上奔跑的发光头 + 渐暗尾迹（u=圈数）
  function luTracerOrbit(c, cx, cy, rx, u, st) {
    for (var k = 0; k < 6; k++) {
      var a = u * TAU - k * 0.09;
      var uu = 1 - k / 6;
      c.put((cx + Math.cos(a) * rx) | 0, (cy + Math.sin(a) * rx * 0.5) | 0,
            k === 0 ? '@' : '.', k === 0 ? W : uu > 0.5 ? st : D);
    }
  }

  // ===== 0–16.42 开幕重制：2D 锻锤 → 克拉蕾像素肖像 → LINK UP 标题锁存 → 余烬交接 =====
  // 工业殿堂背景：实体柱、尖拱长窗、地砖透视线；避免大画面只剩纯黑。
  function luOpenHall(c, t, top, bt, heat) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, y, x;
    // 只保留三种可记忆的结构：两座拱门、中央横梁、向砧台汇聚的地砖。
    for (y = top + 3; y < bt - 5; y += 5)
      c.line(4, y, c.w - 5, y, y % 10 ? '-' : '=', D);
    for (var side = 0; side < 2; side++) {
      var wx = side ? c.w - 24 : 8;
      c.line(wx, top + 10, wx + 7, top + 4, '/', heat ? N : G);
      c.line(wx + 7, top + 4, wx + 14, top + 10, '\\', heat ? N : G);
      c.line(wx, top + 10, wx, bt - 7, '|', G);
      c.line(wx + 14, top + 10, wx + 14, bt - 7, '|', G);
      c.line(wx + 3, top + 8, wx + 3, bt - 7, '|', heat ? R : D);
      c.line(wx + 11, top + 8, wx + 11, bt - 7, '|', heat ? R : D);
      c.put(wx + 1, bt - 7, '-------------', heat ? N : D);
      c.put(wx + 2, top + 5, side ? 'GUIDE' : 'FURNACE', heat ? B : N);
    }
    for (x = l; x <= r; x++) {
      c.put(x, bt - 2, x % 7 ? '-' : '+', x % 9 ? G : N);
      if (x % 4 === 0) c.line(cx, bt - 8, x, bt - 2, heat && x % 8 === 0 ? R : K, K);
    }
    if (heat) c.line(3, bt - 5, c.w - 4, bt - 5, '.', R);
  }

  // 单次锻击的火花：确定性的双侧弹道 + 短拖尾，白→琥珀→红→暗。
  function luOpenSparks(c, cx, cy, age, seed, amount) {
    if (age < 0 || age > 0.9) return;
    for (var i = 0; i < amount; i++) {
      var h1 = hash16(i * 137 + seed * 313), h2 = hash16(i * 71 + seed * 17);
      var vx = ((h1 % 201) - 100) / 100 * (24 + h2 % 38);
      var vy = 5 + (h2 % 100) / 100 * 20;
      var drag = 1 + (i % 5) * 0.08;
      var x = cx + vx * age / drag;
      var y = cy - vy * age + 20 * age * age;
      if (x < 2 || x > c.w - 3 || y < 3 || y > cy + 3) continue;
      var ch = age < 0.12 ? '#' : age < 0.3 ? '*' : age < 0.55 ? '+' : '.';
      var st = age < 0.1 ? W : age < 0.28 ? B : age < 0.58 ? R : G;
      c.put(x, y, ch, st);
      if (i % 3 === 0 && age > 0.07) {
        var pa = Math.max(0, age - 0.055);
        c.line(cx + vx * pa / drag, cy - vy * pa + 20 * pa * pa, x, y, '.', st);
      }
    }
  }

  // 0–4.2：大型 2D 桩柱锤，三连击；整根柱体等粗，冲击驱动整屏震动。
  function lu_open_forge(c, t, top, bt, e) {
    var cx = (c.w - 1) / 2, anvilY = bt - 7, i, x, y;
    luOpenHall(c, t, top, bt, true);
    luParticles(c, t, top, bt, 18, 91, true, true);
    // 左侧炉膛：厚砖拱与跳动火柱。
    c.put(3, top + 6, '+=================+', N);
    for (y = top + 7; y <= anvilY + 1; y++) {
      c.put(3, y, '|', G); c.put(21, y, '|', G);
      for (x = 5; x < 21; x++) if ((x + y) % 3 === 0)
        c.put(x, y, y > anvilY - 2 ? '█' : '▓', y > anvilY - 2 ? R : G);
    }
    c.put(3, anvilY + 2, '+=================+', N);
    for (x = 6; x < 20; x += 2) luFlame(c, x, anvilY + 1, 4 + (x % 5), x + 17, t);
    // 右侧只留两条固定导轨和一个配重块，成为“桩机”的记忆点。
    for (var rail = 0; rail < 2; rail++) {
      x = c.w - 20 + rail * 7;
      c.put(x - 2, top + 2, rail ? '[###]' : '[RAM]', N);
      for (y = top + 5; y < anvilY - 1; y++) c.put(x, y, y % 4 ? '│' : '+', rail ? D : G);
      c.put(x - 2, anvilY - 2, '===', R);
    }
    // 铁砧：白亮锻件 + 厚砧面 + 收腰 + 宽底座。
    for (x = cx - 22; x <= cx + 22; x++) c.put(x, anvilY, x % 4 ? '═' : '╔', W);
    for (x = cx - 12; x <= cx + 12; x++) c.put(x, anvilY - 1, x % 3 ? '█' : '▓', B);
    for (y = anvilY + 1; y <= anvilY + 3; y++) {
      var half = 13 - (y - anvilY - 1) * 3;
      for (x = cx - half; x <= cx + half; x++) c.put(x, y, y === anvilY + 1 ? '▓' : '█', y === anvilY + 1 ? N : D);
    }
    for (x = cx - 25; x <= cx + 25; x++) c.put(x, anvilY + 4, x % 5 ? '═' : '╚', N);
    for (x = cx - 8; x <= cx + 8; x++) c.put(x, anvilY - 2, '█', R);
    // 三次压锤：0.90 / 2.05 / 3.20s；每次慢抬、急坠、压停、回升。
    var hits = [0.90, 2.05, 3.20], raised = top + 2, impact = anvilY - 4, headY = raised;
    var upcoming = -1, last = -1;
    for (i = 0; i < hits.length; i++) {
      if (e < hits[i] && upcoming < 0) upcoming = i;
      if (e >= hits[i]) last = i;
    }
    if (upcoming >= 0) {
      var until = hits[upcoming] - e;
      headY = until > 0.28 ? raised : mix(raised, impact, Math.pow(1 - until / 0.28, 2.8));
    } else if (last >= 0) {
      var since = e - hits[last];
      headY = since < 0.18 ? impact : mix(impact, raised, 1 - Math.pow(1 - clamp01((since - 0.18) / 0.72), 3));
    }
    // 柱锤导轨：左右限位，突出这是垂直打桩机而非手持锤。
    for (y = top + 1; y <= anvilY; y++) {
      c.put(cx - 17, y, y % 4 ? '│' : '+', D);
      c.put(cx + 17, y, y % 4 ? '│' : '+', D);
      if (y % 5 === 0) {
        c.put(cx - 19, y, '[', G); c.put(cx + 18, y, ']', G);
      }
    }
    // 下落时同宽残影，确保读作整根柱体在高速下压。
    var activeHit = last >= 0 ? hits[last] : -99, activeAge = e - activeHit;
    if (upcoming >= 0 && hits[upcoming] - e < 0.28) for (i = 1; i <= 4; i++) {
      var ghostY = headY - i * 2;
      for (x = cx - 10; x <= cx + 10; x++) c.put(x, ghostY, i < 3 ? '▓' : '░', i < 2 ? N : D);
    }
    // 整根 20 格宽金色桩柱：从顶部到底端不变粗细，没有独立锤头。
    var pillarBottom = Math.min(anvilY, headY + 4);
    for (y = top + 1; y <= pillarBottom; y++) {
      for (x = cx - 10; x <= cx + 10; x++) {
        var edge = x === cx - 10 || x === cx + 10;
        var stripe = x < cx - 5 ? N : (x > cx + 5 ? G : (y + x) % 7 === 0 ? W : B);
        c.put(x, y, edge ? '║' : (y % 3 ? '▓' : '█'), stripe);
      }
      if (y % 6 === 2) c.put(cx - 5, y, '12T', R);
    }
    // 最近一次撞击的火花、地面冲击环和瞬时亮闪。
    var hit = activeHit, age = activeAge;
    luOpenSparks(c, cx, anvilY - 1, age, hit >= 3 ? 3 : hit >= 2 ? 2 : 1, 220);
    if (age >= 0 && age < 0.72) {
      var rr = 5 + age * 68;
      for (i = 0; i < 120; i++) {
        var a = i / 120 * TAU;
        c.put(cx + Math.cos(a) * rr, anvilY + Math.sin(a) * rr * 0.16,
              age < 0.16 ? (i % 3 ? '█' : '*') : (i % 2 ? '+' : '.'), age < 0.16 ? W : (age < 0.42 ? R : G));
      }
      if (age < 0.14) {
        for (i = 0; i < 9; i++) {
          y = anvilY - 5 + i;
          c.line(cx - 48 + i * 4, y, cx + 48 - i * 4, y, i % 2 ? '═' : '─', i % 2 ? W : B);
        }
      }
      // 第三击把两侧结构和旧画面打出裂纹，下一段标题从碎片里接管。
      if (hit === 3.20 && age > 0.12) {
        for (i = 0; i < 7; i++) {
          c.line(cx, anvilY - 1, 4 + i * 2, top + 5 + (i % 3), i % 2 ? '/' : '\\', age < 0.35 ? W : R);
          c.line(cx, anvilY - 1, c.w - 5 - i * 2, top + 6 + (i % 2), i % 2 ? '\\' : '/', age < 0.35 ? W : R);
        }
      }
    }
    c.put(3, top, 'FORGE 01 // PILE RAM', W);
    c.put(c.w - 31, top, 'STRIKE ' + (last + 1) + ' / 03 // 12T GOLD', R);
    c.put(3, bt, 'ANVIL LOCKED  //  IMPACT ' + (age >= 0 && age < 0.5 ? 'DETECTED' : 'ARMED'), age >= 0 && age < 0.5 ? W : N);
  }

  // 46×30 全身像素立绘：金发双马尾、红瞳、黑白礼服、长靴；武器由下层像素单独构成。
  var LU_CLARE_INK = null;
  function luOpenClareInk() {
    if (LU_CLARE_INK) return LU_CLARE_INK;
    var ink = [];
    function add(x, y, ch, st, token) { ink.push([Math.round(x), Math.round(y), ch, st, token]); }
    function rect(x0, y0, w, h, ch, st, token) {
      for (var y = y0; y < y0 + h; y++) for (var x = x0; x < x0 + w; x++) add(x, y, ch, st, token);
    }
    function lineCells(x1, y1, x2, y2, ch, st, token) {
      var steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1), 1) * 2;
      for (var i = 0; i <= steps; i++) {
        var u = i / steps;
        add(mix(x1, x2, u), mix(y1, y2, u), ch, st, token);
      }
    }
    function ellipse(cx, cy, rx, ry, ch, st, token) {
      for (var y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
        for (var x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
          var dx = (x - cx) / rx, dy = (y - cy) / ry;
          if (dx * dx + dy * dy <= 1) add(x, y, ch, st, token);
        }
    }

    // 身后长剑：斜向双刃，靠近肩手处有白色十字护手。
    lineCells(45, 0, 31, 12, '/', W, 'X');
    lineCells(44, 0, 30, 12, '\\', G, 'X');
    rect(29, 12, 5, 1, '=', W, 'W');
    rect(31, 13, 2, 2, '#', K, 'K');

    // 红色巨斧底层：左侧大月刃 + 斜向斧柄，右手握在柄端。
    var axeProfile = [3, 5, 7, 8, 9, 10, 9, 8, 7, 6, 4, 3];
    for (var ay = 17; ay <= 29; ay++) {
      var ah = axeProfile[ay - 17];
      var acx = 5 + (ay - 17) * 0.35;
      var al = Math.max(0, Math.round(acx - ah));
      var ar = Math.min(16, Math.round(acx + ah * 0.8));
      for (var ax = al; ax <= ar; ax++) {
        // 月刃内凹出暗色空洞，外缘留白，读作巨斧而不是红色矩形。
        if (ay >= 20 && ay <= 26 && ax > acx + 2 && ax < ar - 2) continue;
        var edge = ax === al || ax === ar || ay === 17 || ay === 29;
        add(ax, ay, edge ? '=' : '#', edge ? W : R, 'R');
      }
    }
    lineCells(13, 27, 23, 16, '#', K, 'K');
    lineCells(14, 27, 24, 16, '=', G, 'K');

    // 后发与双马尾：从头侧向两端分开，越长越细，避免和身体混成一整块。
    for (var hy = 3; hy <= 25; hy++) {
      var spread = (hy - 3) * 0.34;
      var half = hy < 7 ? 1.6 : hy < 14 ? 1.4 : hy < 21 ? 1.0 : 0.7;
      for (var side = -1; side <= 1; side += 2) {
        var hcx = 23 + side * (4.8 + spread);
        for (var hx = Math.floor(hcx - half); hx <= Math.ceil(hcx + half); hx++) {
          var hi = hash16(hx * 19 + hy * 43);
          add(hx, hy, hi % 5 === 0 ? '%' : '#', hi % 5 === 0 ? W : B, hi % 5 === 0 ? 'h' : 'H');
        }
      }
    }
    ellipse(23, 4.7, 4.0, 2.2, '#', B, 'H');
    rect(20, 4, 7, 1, '#', B, 'H');
    for (var bang = 20; bang <= 26; bang += 2)
      lineCells(bang, 5, bang - 1, 7 + (bang % 2), '#', B, 'H');

    // 头、红瞳、表情与白色高领；脸部用亮色镂空，和金色头发明确分层。
    ellipse(23, 8, 3.5, 3.4, ':', W, 'S');
    rect(20, 7, 2, 1, '@', R, 'E'); rect(25, 7, 2, 1, '@', R, 'E');
    add(23, 10, '-', R, 'S');
    rect(21, 11, 5, 1, '=', W, 'W');

    // 手臂：左下接斧柄，右上接剑柄；黑白袖甲分离。
    lineCells(20, 13, 16, 18, '#', K, 'K');
    lineCells(21, 14, 17, 19, '=', W, 'W');
    lineCells(26, 13, 31, 12, '#', K, 'K');
    lineCells(27, 14, 31, 13, '=', W, 'W');

    // 白上衣、黑束身、红腰带与下摆裙甲。
    rect(19, 12, 9, 3, '=', W, 'W');
    for (var ty = 14; ty <= 19; ty++) {
      var tw = ty < 17 ? 8 : 9;
      rect(23 - Math.floor(tw / 2), ty, tw, 1, '#', ty % 2 ? K : D, 'D');
    }
    rect(18, 19, 11, 1, '=', R, 'R');
    for (var sy = 20; sy <= 23; sy++) {
      var sw = 7 + (sy - 20) * 2;
      rect(23 - Math.floor(sw / 2), sy, sw, 1, '#', sy % 2 ? D : K, 'D');
      add(23 - Math.floor(sw / 2), sy, '=', R, 'R');
      add(23 + Math.floor(sw / 2), sy, '=', R, 'R');
    }

    // 双腿、白色吊袜带与黑色长靴。
    rect(20, 24, 3, 4, ':', W, 'S'); rect(26, 24, 3, 4, ':', W, 'S');
    rect(20, 26, 3, 1, '=', W, 'W'); rect(26, 26, 3, 1, '=', W, 'W');
    rect(19, 28, 5, 2, '#', K, 'K'); rect(25, 28, 5, 2, '#', K, 'K');
    rect(18, 29, 7, 1, '=', G, 'K'); rect(24, 29, 7, 1, '=', G, 'K');

    // 前景侧发与发丝高光，压住肩部形成层次。
    lineCells(19, 6, 17, 15, '#', B, 'H'); lineCells(18, 7, 16, 14, '%', W, 'h');
    lineCells(27, 6, 29, 15, '#', B, 'H'); lineCells(28, 7, 30, 14, '%', W, 'h');
    LU_CLARE_INK = ink;
    return ink;
  }

  // 3.8–7.8：全身立绘由火星组装，落定后双马尾轻摆、红瞳眨眼。
  function lu_open_clare(c, t, top, bt, e) {
    luOpenHall(c, t, top, bt, false);
    luParticles(c, t, top, bt, 54, 137, true, true);
    var figureCx = (c.w - 1) / 2, figureCy = top + 15;
    // 红月轮廓先于人物出现，给金发与黑礼服一个清楚的剪影边界。
    luRing(c, figureCx, figureCy, 28 + Math.sin(t * 1.4) * 1.5, '.', R, 3, t * 0.08);
    luRing(c, figureCx, figureCy, 32 + Math.sin(t * 1.1 + 1) * 1.2, ':', G, 4, -t * 0.05);
    var mapW = 46, mapH = 30;
    var ink = luOpenClareInk(), x0 = Math.floor((c.w - mapW * 2) / 2), y0 = top + 1;
    var bob = e > 1.7 ? Math.round(Math.sin(t * 2.2) * 0.5) : 0;
    var blink = mod(t, 3.2) > 3.02;
    for (var i = 0; i < ink.length; i++) {
      var p = ink[i], hs = hash16(i * 43 + 19);
      var delay = (hs % 100) / 100 * 0.8 + p[1] / mapH * 0.25;
      var u = clamp01((e - delay) / 0.9), ease = 1 - Math.pow(1 - u, 3);
      var sway = e > 1.7 && (p[4] === 'H' || p[4] === 'h') && (p[0] < 14 || p[0] > 31) && p[1] > 7
        ? Math.round(Math.sin(t * 2.5 + p[1] * 0.35) * (p[0] < 14 ? -0.7 : 0.7)) : 0;
      var tx = x0 + p[0] * 2 + sway, ty = y0 + p[1] + bob;
      if (u < 1) {
        var ox = 3 + hash16(i * 17 + 2) % (c.w - 6), oy = top + hash16(i * 29 + 8) % (bt - top);
        var ix = mix(ox, tx, ease), iy = mix(oy, ty, ease);
        c.put(ix, iy, u > 0.75 ? p[2] : hs % 3 ? '+' : '*', u > 0.75 ? p[3] : hs % 2 ? R : B);
        if (u < 0.8) c.put(ix - 1, iy, '.', G);
      } else {
        c.put(tx, ty, p[4] === 'E' && blink ? '==' : p[2] + p[2], p[3]);
      }
    }
    // 面部焦点：两枚红瞳和金发高光在远景缩放时仍保持可读。
    if (e > 0.72) {
      c.put(x0 + 40, y0 + 8, '██', R);
      c.put(x0 + 50, y0 + 8, '██', R);
      c.put(x0 + 42, y0 + 5, '▓▓▓▓', W);
      c.put(x0 + 52, y0 + 5, '▓▓▓▓', W);
    }
    var label = 'CLARE // BLOODBOUND HEIR';
    c.put(3, top, label.slice(0, Math.floor(clamp01(e / 0.8) * label.length)), W);
    c.put(c.w - 31, top, 'FULL-BODY PIXEL // READY', N);
    if (e > 2.2) {
      c.put(3, bt, 'TWIN TAILS / CRIMSON GREATAXE', B);
      c.put(c.w - 25, bt, 'CLARE REF // OK', R);
    }
    for (var foot = figureCx - 13; foot <= figureCx + 13; foot++)
      c.put(foot, bt - 2, foot % 3 ? '.' : '=', foot % 3 ? K : R);
  }

  // LINK UP 巨型点阵标题；机制与 world.execute(me) 标题接管一致：散点→飞行→锁存→扫光。
  var LU_OPEN_TITLE_INK = null, LU_OPEN_TITLE_WH = '';
  function luOpenTitleInk(w, top, bt) {
    var key = w + ':' + top + ':' + bt;
    if (LU_OPEN_TITLE_INK && LU_OPEN_TITLE_WH === key) return LU_OPEN_TITLE_INK;
    var text = 'LINK UP', bitmap = [];
    for (var row = 0; row < 5; row++) {
      var parts = [];
      for (var ci = 0; ci < text.length; ci++) parts.push(TITLE_FONT[text.charAt(ci)][row]);
      bitmap.push(parts.join('0'));
    }
    var span = Math.min(104, w - 10), lineH = Math.min(15, bt - top - 8);
    var left = Math.floor((w - span) / 2), y0 = top + Math.floor((bt - top - lineH) / 2);
    var ink = [];
    for (var yy = 0; yy < lineH; yy++) {
      var brow = bitmap[Math.min(4, Math.trunc(yy * 5 / lineH))];
      for (var xx = 0; xx < span; xx++)
        if (brow.charAt(Math.min(brow.length - 1, Math.trunc(xx * brow.length / span))) === '1')
          ink.push([left + xx, y0 + yy]);
    }
    LU_OPEN_TITLE_INK = ink; LU_OPEN_TITLE_WH = key;
    return ink;
  }

  function lu_open_title(c, t, top, bt, e) {
    var ink = luOpenTitleInk(c.w, top, bt), cx = (c.w - 1) / 2, cy = (top + bt) / 2;
    var frame = Math.trunc(e * 24), alphabet = '01ABCDEF#*+';
    // 红热光晕先亮起，再收束成标题；背景始终保留工业空间。
    var density = mix(0.16, 0.035, clamp01(e / 3.5));
    for (var y = top; y <= bt; y++)
      for (var x = 2; x < c.w - 2; x++) {
        var h = hash16(x * 37 + y * 911 + Math.trunc(e * 6) * 13);
        if (h / 65535 < density)
          c.put(x, y, h % 5 ? '.' : ':', h % 11 === 0 ? R : (h % 3 ? K : G));
      }
    for (var glow = 0; glow < 3; glow++)
      luRing(c, cx, cy, 42 + glow * 12 + Math.sin(t * 1.7 + glow) * 2,
        glow === 0 ? '*' : (glow === 1 ? ':' : '.'), glow === 0 ? R : (glow === 1 ? B : G), 2 + glow, t * (glow ? -0.08 : 0.12));
    for (x = 4; x < c.w - 4; x += 2) {
      var scan = cy + Math.sin(x * 0.24 + t * 2.2) * 4;
      c.put(x, scan, x % 4 ? '─' : '═', x % 5 ? G : R);
    }
    luParticles(c, t, top, bt, 24, 211, true, true);
    for (var i = 0; i < ink.length; i++) {
      var tx = ink[i][0], ty = ink[i][1], hs = hash16(i * 17 + 51);
      var delay = (hs % 1000) / 1000 * 0.9;
      var u = clamp01((e - 0.35 - delay) / 2.3), ease = 1 - Math.pow(1 - u, 3);
      var ox = hs % 2 ? 2 + hs % (c.w - 4) : (hs % 3 ? 2 : c.w - 3);
      var oy = top + hash16(i * 29 + 10) % (bt - top);
      var swirl = Math.sin(u * Math.PI) * (1 - u);
      var ix = mix(ox, tx, ease) + Math.sin(e * 2 + i * 0.7) * swirl * 18;
      var iy = mix(oy, ty, ease) + Math.cos(e * 2 + i * 0.7) * swirl * 5;
      if (u >= 0.995) {
        var sweep = mod(Math.trunc(e * 30), c.w + 24) - 12;
        c.put(tx, ty, Math.abs(tx - sweep) < 4 ? '█' : (i % 5 ? '▓' : '█'), Math.abs(tx - sweep) < 4 ? W : B);
      } else {
        c.put(ix, iy, alphabet.charAt((hs + frame) % alphabet.length), hs % 3 ? N : B);
        if (i % 2 === 0) c.put(ix - 1, iy, '.', hs % 5 ? G : R);
      }
    }
    c.put(2, top + 1, '+', N); c.put(c.w - 3, top + 1, '+', N);
    c.line(3, top + 1, c.w - 4, top + 1, '-', G);
    c.line(3, bt - 1, c.w - 4, bt - 1, '-', G);
    if (e > 2.7) {
      c.center(top + 2, '3Z-STUDIO / HOYO-MIX', W);
      c.center(bt - 2, 'BLOOD & FLAME // CHARACTER EP', B);
    }
    if (e > 3.6) c.center(top, '[ TITLE LOCKED // LINK UP ]', R);
  }

  // 13.8–16.42：标题字形本身向外碎裂成余烬，最后聚成下一段的炉火。
  function lu_open_handoff(c, t, top, bt, e) {
    var ink = luOpenTitleInk(c.w, top, bt), cx = (c.w - 1) / 2, cy = (top + bt) / 2;
    luOpenHall(c, t, top, bt, true);
    luParticles(c, t, top, bt, 64, 251, true, true);
    // 碎裂不是散场变黑：中央炉火在标题余烬里升起，形成结尾视觉锚点并桥接主歌。
    var ignite = clamp01((e - 0.65) / 1.35);
    if (ignite > 0) {
      for (var fx = cx - 13; fx <= cx + 13; fx++) {
        var fh = 3 + ignite * (7 + hash16(fx * 37 + 411) % 17);
        luFlame(c, fx, bt - 2, fh, fx + 17, t);
      }
      if (ignite > 0.35)
        for (var fy = bt - 2; fy > bt - 2 - ignite * 19; fy--) {
          c.put(cx, fy, fy % 3 ? '█' : '═', ignite > 0.75 ? W : B);
          if (fy % 2 === 0) { c.put(cx - 3, fy, ':', R); c.put(cx + 3, fy, ':', R); }
        }
    }
    for (var i = 0; i < ink.length; i++) {
      var tx = ink[i][0], ty = ink[i][1], hs = hash16(i * 17 + 51);
      var delay = (hs % 100) / 100 * 0.3, u = clamp01((e - delay) / 1.65);
      if (hs % 1000 / 1000 < u * 0.82) continue;
      var a = Math.atan2((ty - cy) * 2, tx - cx) + u * 0.35;
      var dist = Math.hypot(tx - cx, (ty - cy) * 2) + u * u * (25 + hs % 35);
      var x = cx + Math.cos(a) * dist, y = cy + Math.sin(a) * dist / 2;
      c.put(x, y, u < 0.35 ? '█' : u < 0.7 ? '*' : '.', u < 0.25 ? B : u < 0.65 ? R : G);
      if (i % 4 === 0) c.put(x - 1, y, '.', R);
    }
    var flash = clamp01(e / 0.25) * clamp01((2.62 - e) / 0.5);
    if (flash > 0)
      for (i = 0; i < 90; i++) {
        var aa = hash16(i * 71) % 628 / 100, rr = 2 + e * 17 * (0.4 + hash16(i * 13) % 100 / 100);
        c.put(cx + Math.cos(aa) * rr * 2, cy + Math.sin(aa) * rr,
              i % 3 ? '*' : '+', e > 1.8 ? W : R);
      }
    if (e < 1.15) c.center(top, '[ SIGNAL RELEASED // IGNITION ]', W);
    c.center(bt, e > 1.8 ? 'STRIKE WHEN IT IS RED-HOT' : 'LINK UP // BLOOD & FLAME', e > 1.8 ? W : R);
  }

  function lu_credits_void(c, t, top, bt, elapsed) {
    if (elapsed < 4.2) {
      // 三次柱锤 0.90/2.05/3.20s 触砧，最后一击碎裂场景后交给标题。
      var hit = elapsed >= 3.20 && elapsed < 3.72 ? 3.20 :
                elapsed >= 2.05 && elapsed < 2.57 ? 2.05 :
                elapsed >= 0.90 && elapsed < 1.42 ? 0.90 : -1;
      if (hit > 0) {
        var age = elapsed - hit, amp = 3.6 * Math.exp(-age * 7);
        c.sx = Math.round(Math.sin(age * 75) * amp);
        c.sy = Math.round(Math.sin(age * 53 + 0.8) * amp * 0.65);
      }
      lu_open_forge(c, t, top, bt, elapsed);
      c.sx = 0; c.sy = 0;
      return;
    }
    if (elapsed < 14.8) return lu_open_title(c, t, top, bt, elapsed - 4.2);
    return lu_open_handoff(c, t, top, bt, elapsed - 14.8);
  }
  // ===== 主歌一 16.42–32.35 粒度细分：4 子场景，按歌词行切 =====

  // 16.42–20.57 "Fire burnin' up / new salvation"：锻炉口+双齿轮，跑者奔向炉火
  function lu_s1_forge(c, t, top, bt, elapsed) {
    var e = elapsed, cx = (c.w - 1) / 2, cy = (top + bt) / 2;
    var fi = clamp01(e / 1.2);                        // 炉口火焰渐旺
    var fx = 16, fy = bt - 3;
    for (var a2 = 0; a2 <= 12; a2++) {                // 砖拱
      var aa = Math.PI - a2 / 12 * Math.PI;
      c.put((fx + Math.cos(aa) * 9) | 0, (fy - Math.sin(aa) * 7) | 0, '#', B);
    }
    c.put(fx - 9, fy, '#', B); c.put(fx + 9, fy, '#', B);
    for (var f2 = 0; f2 < 6 + fi * 6; f2++)           // 炉膛火
      luFlame(c, fx - 6 + (f2 * 37) % 13, fy - 1,
              2 + ((f2 * 13 + (t * 5 | 0)) % 5), f2, t);
    luGear(c, 7, top + 6, 4, t * 0.8, N);             // 炉侧齿轮
    luGear(c, 30, top + 4, 3, -t * 1.1, D);
    var ember = luBox(0.5, 0.5, 0.5, 0, 0, 0);        // 3D 火种绕炉缓旋
    projected(c, ember, luEdges(0), fx - 7, top + 1, fx + 7, top + 8, t * 0.7,
              B, clamp01(e / 0.8));
    var ru = mod(t * 0.5, 1);                         // 跑者自右缘奔向炉口
    var rx = mix(c.w - 6, fx + 12, ru), ry = fy - 1 - Math.sin(ru * 7) * 1.5;
    c.put(rx | 0, ry | 0, '@', W);
    for (var tr = 1; tr <= 6; tr++)
      c.put((rx + tr * 1.6) | 0, (ry + 1) | 0, '.', tr < 3 ? R : D);
    luParticles(c, t, top, bt, 10, 19, true, true);
  }

  // 20.57–24.32 "Runnin' through the hot coals"：热炭海 + 双跑者并肩（we both）
  function lu_s1_coals(c, t, top, bt, elapsed) {

      c.put(rx | 0, ry | 0, '@', rn ? B : W);

      var hs2 = hash16(sp * 91 + 7);

      c.put((4 + hs2 % (c.w - 10)) | 0, (bt - 2 - su * (5 + hs2 % 4)) | 0,
            su < 0.3 ? '*' : '.', su < 0.25 ? W : su < 0.5 ? R : D);
    }
    for (var x3 = 4; x3 < c.w - 4; x3 += 3)           // 顶部热浪微光
      if (hash16(x3 * 13 + (t * 2 | 0)) % 100 < 12) c.put(x3, top, '.', R);
  }

  // 24.32–27.98 "steel and iron / stay defiant"：交叉双剑+铁砧+垂链+双钢锭 3D
  function lu_s1_iron(c, t, top, bt, elapsed) {

    var ing2 = luBox(1.1, 0.7, 0.7, 1.8, 0, 0);
    projected(c, ing1.concat(ing2), luEdges(0).concat(luEdges(8)),
              cx - 16, top + 1, cx + 16, top + 10, t * 0.5, B, clamp01(e / 0.7));
    luParticles(c, t, top, bt, 8, 23, true, false);

  // 27.98–32.35 "gold crown weighing me down / can you feel my pain"：
  // 金冠自顶沉降压弯跪姿人形，四角坠链，崩裂出血脉冲（桥接血脉段）

    var gold = crack > 0.5 ? (mod(t * 6, 1) < 0.5 ? G : D) : G;

      c.put(cx - 3, yTop + 1, 'x', R); c.put(cx + 2, yTop + 2, 'x', R);
      var pr = mod(t * 1.65, 1);
      for (var rg = 0; rg < 2; rg++) {
        var rr = 4 + pr * (13 + rg * 6);

                 u2 > 0.55 ? R : u2 > 0.3 ? N : D, 2);

  // 32.35–36.25 "I can hear your pulse / got you in my veins"：双心错峰+连心脉
  function lu_s2_pulse(c, t, top, bt, elapsed) {
    var e = elapsed, l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var beat = mod(t * 1.65, 1), env = Math.exp(-beat * 5);

              hash16(x * 7 + v) % 3 ? '.' : '-', D);

  // 36.25–40.35 "synergy demonic"：3D 双锥心核恶魔化膨胀 + 五血管放射 + 双角

    var eH = [[0,2],[0,3],[0,4],[0,5],[1,2],[1,3],[1,4],[1,5],[2,3],[3,4],[4,5],[5,2]];
    projected(c, vH, eH, cx - 10, cy - 8, cx + 10, cy + 8, t * 0.3, R, 1);
    for (var hn = 0; hn < 2; hn++) {                  // 恶魔双角

  // 40.35–44.17 "they worship me...never see it / broke hearts deep scars"：
  // 膜拜之眼阵列（半数闭合）+ 中央 3D 偶像球 + 疤痕裂纹
  function lu_s2_worship(c, t, top, bt, elapsed) {

    for (var row = 0; row < 3; row++) {               // 膜拜之眼三排
      var y = bt - 4 - row * 3;
      for (var x = l + 3 + (row % 2) * 3; x < r - 2; x += 6) {
        var hs = hash16(x * 13 + row * 71);

  function lu_s6_quench(c, t, top, bt, elapsed) {

  // 88.26–92.04 "Link link link link up"：双侧巨锤交替捶落+地面龟裂+中央光柱
  function lu_s6_hammer(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2;
    var e = elapsed;
    var beat = 0.93;                                  // 半拍交替
    for (var hm = 0; hm < 2; hm++) {
      var ph = mod((e + hm * beat) / (beat * 2), 1);
      var drop = ph < 0.35 ? Math.pow(ph / 0.35, 2.2) : 1;
      var hx2 = cx + (hm ? 1 : -1) * 22;
      var hy = top + 2 + drop * 12;
      for (var hw = -6; hw <= 6; hw++) c.put(hx2 + hw, hy | 0, '#', K);
      for (var hw2 = -4; hw2 <= 4; hw2++) c.put(hx2 + hw2, (hy - 1) | 0, '#', K);
      for (var hh = 1; hh < 6; hh++) c.put(hx2, (hy - 1 - hh) | 0, '#', hh < 2 ? K : G);
      if (ph >= 0.35 && ph < 0.62) {                  // 砸击白闪+火星扇
        var su = (ph - 0.35) / 0.27;
        for (var fx = -8; fx <= 8; fx += 2)
          c.put((hx2 + fx) | 0, (hy + 1) | 0, '*', W);
        for (var s2 = 0; s2 < 16; s2++) {
          var hs2 = hash16(s2 * 131 + hm * 7);
          var sa = -Math.PI / 2 + (hs2 % 100 / 100 - 0.5) * 2.4;
          var sd = su * (6 + hs2 % 9);
          c.put((hx2 + Math.cos(sa) * sd * 2) | 0,
                (hy - Math.abs(Math.sin(sa)) * sd * 0.5) | 0,
                su < 0.3 ? '*' : '.', su < 0.3 ? W : su < 0.6 ? B : D);
        }
      }
    }
    for (var ray = -1; ray <= 1; ray++) {             // 中央光柱
      var rx = cx + ray * 4;
      for (var ry = top + 2; ry < bt - 6; ry++)
        if (hash16(rx * 13 + ry * 7) % 100 < 60 - ray * ray * 20)
          c.put(rx, ry, '|', ry < top + 8 ? W : B);
    }
    var crackN = Math.floor(e * 2.2);                 // 地面龟裂蔓延
    for (var ck = 0; ck < Math.min(10, crackN); ck++) {
      var hs3 = hash16(ck * 271 + 17);
      var dir = ck % 2 ? 1 : -1;
      var x2 = cx + dir * (10 + hs3 % 18), y2 = bt - 1;
      for (var sg = 0; sg < 3 + hs3 % 4; sg++) {
        c.put(x2 | 0, y2 | 0, sg % 2 ? '/' : '\\', D);
        x2 += dir * (1 + hs3 % 2); y2--;
      }

    for (var lx2 = l + 1; lx2 < r; lx2 += 2)
      if (hash16(lx2 * 23 + (t * 3 | 0)) % 100 < 35)

    if (mod(t * 2, 1) < 0.6) c.centerW(top + 3, 'L I N K   U P', R);

  // 92.04–96.03 "Link link link link up now"：镜头拉远——立柱张开+王座全景+巨月+红瞳
  function lu_s6_pull(c, t, top, bt, elapsed) {

    c.put(cx - 1, qy, '<', B); c.put(cx + 1, qy, '>', B);
    for (var to2 = 0; to2 < 3; to2++)                 // 曳光绕王座

  // ===== 长音 Link 96.03–103.51 粒度细分：2 子场景 =====

  // 96.03–100.00 "Link"：红隧道同心矩形扑面加速
  function lu_s7_tunnel(c, t, top, bt, elapsed) {

      var ch = depth > 0.8 ? '#' : depth > 0.5 ? '+' : '-';
      for (var x = cx - rx; x <= cx + rx; x += 2) {
        c.put(x | 0, (cy - ry) | 0, ch, st);
        c.put(x | 0, (cy + ry) | 0, ch, st);

      for (var y = cy - ry; y <= cy + ry; y++) {
        c.put((cx - rx) | 0, y | 0, ch, st);
        c.put((cx + rx) | 0, y | 0, ch, st);

    var vsL = luBox(1, 1, 1, 0, 0, 0);                // 3D 核扑面
    var gl = clamp01(e / 3.9);

              t * 0.6, gl > 0.75 ? W : R, 1);

  // 103.51–106.15 "It's time to step in they try but they can't win"：楔形方阵压近+脚步震波
  function lu_s8_step(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var e = elapsed;
    var prog = clamp01(e / 2.6);
    var vsM = luBox(0.5, 1.7, 0.5, 0, 0.3, 0)          // 3D 目标堡垒（远）
      .concat(luBox(2.0, 0.5, 0.4, 0, -1.1, 0))
      .concat(luBox(0.4, 1.0, 0.4, -1.5, -0.6, 0));
    projected(c, vsM, luEdges(0).concat(luEdges(8), luEdges(16)),
              cx - 8, top + 1, cx + 8, top + 8, 0.35, D, 1);
    var rows = [[-1, 10], [0, 16], [1, 10]];
    for (var ri = 0; ri < 3; ri++)                    // 楔形三排推进
      for (var k = 0; k < rows[ri][1]; k++) {
        var x = (r - 4 - k * 2.2 - prog * 10) | 0;
        if (x < 3) break;
        c.put(x, (cy + rows[ri][0]) | 0, '>',
              k === 0 ? W : k < 4 ? B : k < 8 ? R : N);

    luRing(c, cx, bt - 2, (2 + step * 18) | 0, '.', step < 0.3 ? B : D, 2);
    for (var x2 = 4; x2 < c.w - 4; x2 += 6)           // 军旗竖纹
      for (var y2 = top + 1; y2 < bt; y2++)
        if (hash16(x2 * 7 + y2 * 13) % 100 < 30)
          c.put(x2, y2, '|', (x2 / 6 | 0) % 5 === 0 ? G : D);
    luLog(c, top + 1, e, [
      ['MARCH.SYS  v2.2', 0.3, W],
      ['step in ...... NOW', 1.0, B],
      ['cant win ..... AGREED', 2.0, N]
    ]);
  }

  // 110.21–114.04 "One mind one heart we'll be fearless"：双心合一+无畏金环
  function lu_s8_heart(c, t, top, bt, elapsed) {

  // ===== 主歌二熔炉 124.00–135.87 粒度细分：4 子场景 =====

  // 124.00–126.03 "Forged in the same inferno"：3D 熔炉+炼狱火海满幅
  function lu_s9_inferno(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var e = elapsed;
    var vsF2 = luBox(1.5, 1.1, 1.1, 0, -0.4, 0)       // 3D 熔炉本体
      .concat(luBox(0.35, 1.3, 0.35, 0.6, 1.0, 0));
    projected(c, vsF2, luEdges(0).concat(luEdges(8)), 8, top + 2, 32, top + 13,
              t * 0.12, N, 1);
    luGear(c, 18, cy - 4, 7, t * 0.5, D);             // 背景巨齿轮
    luGear(c, c.w - 19, cy - 3, 6, -t * 0.7, D);
    for (var x = 4; x < c.w - 4; x++) {               // 炼狱火海满幅
      var hs = hash16(x * 977 + 7);
      var hMax = Math.min((8 + hs % 14) | 0, bt - top - 10);
      luFlame(c, x, bt, Math.max(2, (hMax * (0.75 + 0.25 * Math.sin(t * 7 + x * 0.9))) | 0), x, t);
    }
    for (var x2 = 4; x2 < c.w - 4; x2++) c.put(x2, bt, '#', R);
    var br = 0.5 + 0.5 * Math.sin(t * 2.4);
    for (var x3 = 4; x3 < c.w - 4; x3 += 2)
      if (hash16(x3 * 29) % 100 < 42 * br) c.put(x3, bt - 1, '.', br > 0.6 ? R : G);
    luLog(c, top + 1, e, [
      ['MELT.SYS  v4.4', 0.3, W],
      ['inferno ...... 1200C', 1.2, G]
    ]);
  }

  // 126.03–128.24 "Mold me into your own"：熔液自上方浇入人形铸模，充填渐满
  function lu_s9_mold(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2;
    var e = elapsed;
    var fill = clamp01(e / 2.0);                      // 铸模充填
    var my = bt - 4;
    for (var m2 = 0; m2 < 8; m2++) {                  // 人形模槽暗边（头/身/腿）
      var w2 = m2 < 2 ? 1 : m2 < 6 ? 2 : 1;
      c.put(cx - w2, my - m2, '#', K); c.put(cx + w2, my - m2, '#', K);
    }
    c.put(cx, my - 8, '#', K);
    var fillH = (8 * fill) | 0;                       // 熔液自底充起（暗红→亮白）
    for (var f3 = 0; f3 < fillH; f3++) {
      var fy = my - f3;
      var fw = f3 < 2 ? 1 : f3 < 6 ? 2 : 1;
      for (var fx = -fw; fx <= fw; fx++)
        c.put(cx + fx, fy, mod(t * 6 + fx + fy, 1) < 0.5 ? 'o' : '#',
              f3 > 4 ? W : f3 > 2 ? B : R);
    }
    for (var sy = top + 2; sy < my - 8; sy++)         // 上方浇注流
      c.put(cx | 0, sy, sy % 2 ? '|' : '#', sy % 3 ? W : B);
    var vsC2 = luBox(0.8, 0.5, 0.8, 0, 0, 0);         // 3D 浇包
    projected(c, vsC2, luEdges(0), cx - 8, top, cx + 8, top + 7, t * 0.3, B, 1);
    for (var st = 0; st < 10; st++) {                 // 铸雾
      var hs = hash16(st * 57 + 3);
      var sd2 = mod(t * (0.5 + hs % 30 / 40) + hs % 91 / 91, 1);
      c.put((cx - 10 + hs % 21) | 0, (my - 2 - sd2 * 8) | 0, '~', sd2 < 0.3 ? W : N);
    }
    luLog(c, top + 1, e, [
      ['mold ......... CAST', 0.3, B],
      ['shape ........ YOUR OWN', 1.4, N]
    ]);
  }

  // 128.24–131.93 "battle scars but beating heart / bleed / be with you"：
  // 3D 心核搏动 + 疤痕裂纹 + 渗血珠下落
  function lu_s9_scars(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var e = elapsed;
    var beat = mod(t * 1.65, 1), env = Math.exp(-beat * 5);
    var sc3 = 1 + env * 0.25;
    var vH = [[0, -1.7 * sc3, 0], [0, 1.7 * sc3, 0],
              [-sc3, 0, -sc3], [sc3, 0, -sc3], [sc3, 0, sc3], [-sc3, 0, sc3]];
    var eH = [[0,2],[0,3],[0,4],[0,5],[1,2],[1,3],[1,4],[1,5],[2,3],[3,4],[4,5],[5,2]];
    projected(c, vH, eH, cx - 12, cy - 9, cx + 12, cy + 9, t * 0.25, R, 1);
    c.put(cx - 1, cy - 1, 'x', R); c.put(cx + 2, cy, 'x', R);
    c.put(cx - 3, cy + 1, 'x', D);                        // 疤痕裂纹
    for (var rg = 0; rg < 2; rg++) {                    // 搏动环
      var rr = 3 + beat * (10 + rg * 5);
      var u = clamp01(1 - rr / 18) * (0.4 + env);
      if (u > 0.06) luRing(c, cx, cy, rr | 0, '.', u > 0.55 ? R : N, 2);
    }
    for (var bl = 0; bl < 9; bl++) {                    // 渗血珠下落
      var hs = hash16(bl * 71 + 9);
      var bu = mod(t * (0.4 + hs % 30 / 50) + hs % 97 / 97, 1);
      c.put((cx - 6 + hs % 13) | 0, (cy + 3 + bu * 6) | 0,
            bu < 0.3 ? 'o' : '.', bu < 0.35 ? R : D);
    }
    luParticles(c, t, top, bt, 10, 63, true, false);
    luLog(c, top + 1, e, [
      ['scars ........ FORGED', 0.3, N],
      ['heart ........ BEATING', 1.2, R],
      ['bleed ........ TOGETHER', 2.4, B]
    ]);
  }

  // 131.93–135.87 "strong shield don't yield / lifeline"：3D 巨盾升起+来弹弹开+生命线
  function lu_s9_shield(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var e = elapsed;
    var rise = clamp01(e / 1.2);                      // 盾自地面升起
    var vsH = luBox(1.5, 1.9, 0.22, 0, 0, 0)          // 3D 方盾+中脊+盾沿
      .concat(luBox(0.3, 1.9, 0.26, 0, 0, 0))
      .concat(luBox(1.9, 0.3, 0.24, 0, 1.9, 0));
    var dy2 = (1 - rise) * 8;
    projected(c, vsH, luEdges(0).concat(luEdges(8), luEdges(16)),
              cx - 12, cy - 10 + dy2, cx + 12, cy + 10 + dy2,
              t * 0.2, rise >= 1 ? B : N, rise);
    for (var tr = 0; tr < 6; tr++) {                  // 来弹击中盾面被弹开
      var hs = hash16(tr * 613 + 29);
      var y0 = cy - 6 + (hs >> 5) % 13;
      var u = mod(t * (24 + hs % 18) + hs % 89, 1);
      if (u > 0.82) {
        var bu2 = (u - 0.82) / 0.18;
        c.put((cx - 4 - bu2 * 5) | 0, (y0 + bu2 * bu2 * 7) | 0, '.', D);
        continue;
      }
      var tx2 = mix(l + 3, cx - 4, u);
      c.put(tx2 | 0, y0, '@', W);
      for (var k = 1; k < 5; k++)
        c.put((tx2 - k) | 0, y0, '-', k < 2 ? R : D);
    }
    for (var lk = 0; lk < 12; lk++) {                 // lifeline 脉线连向心
      var lu2 = lk / 12;
      c.put((cx + 4 + lu2 * 18) | 0,
            (cy + 6 + Math.sin(lu2 * 8) * 1.6) | 0, '.', lk % 3 ? R : W);
    }
    luRing(c, cx + 26, cy + 6, 3, '.', R, 0);
    c.put(cx + 26, cy + 6, 'o', mod(t * 2, 1) < 0.5 ? W : R);
    luLog(c, top + 1, e, [
      ['shield ....... RISEN', 0.4, B],
      ['yield ........ NEVER', 1.6, W],
      ['lifeline ..... HELD', 2.8, R]
    ]);
  }

  // ===== 导歌二回闪 135.87–152.18 粒度细分：2 子场景 =====

  // 135.87–143.12 "You're there in my dreams that I've dreamt"：亮丝带+水晶簇+碎片慢漂
  function lu_s10_dreamt(c, t, top, bt, elapsed) {
    var cy = (top + bt) / 2, e = elapsed;
    var vsC = luBox(0.18, 1.3, 0.18, 0, 0.1, 0)       // 右上 3D 水晶簇
      .concat(luBox(0.18, 0.9, 0.18, 0.5, -0.2, 0))
      .concat(luBox(0.18, 0.7, 0.18, -0.45, -0.3, 0));
    projected(c, vsC, luEdges(0).concat(luEdges(8), luEdges(16)),
              c.w - 26, top + 2, c.w - 6, top + 13, t * 0.18, B, 1);
    var breathe = 0.85 + 0.15 * Math.sin(t * 0.7);
    for (var i = 0; i < 6; i++)
      luRibbon(c, cy + (i - 2.5) * 3.6, (2 + i * 0.5) * breathe, 0.06,
               t * 0.8 + i * 1.31, i % 3 === 0 ? R : i % 3 === 1 ? B : N);
    var fragCh = '@~-=o()#*';                         // 旧场景符号碎片
    for (var f2 = 0; f2 < 14; f2++) {
      var hs3 = hash16(f2 * 389 + 3);
      var fx = 6 + mod(hs3 % 100 / 100 * (c.w - 12) + t * (0.6 + hs3 % 30 / 40), c.w - 12);
      var fy = top + 2 + (hs3 >> 7) % (bt - top - 4) + Math.sin(t + f2) * 1.5;
      c.put(fx | 0, fy | 0, fragCh.charAt((hs3 >> 3) % fragCh.length),
            f2 % 4 === 0 ? R : f2 % 4 === 1 ? B : f2 % 4 === 2 ? N : D);
    }
    luLog(c, top + 1, e, [
      ['FLASH.SYS  v0.8', 0.3, W],
      ['recall ....... ON', 1.6, B],
      ['fragments .... DRIFT', 3.4, N]
    ]);
  }

  // 143.12–152.18 "It's just you & me in the end"：双信子相遇 → 血色侵蚀 → 底部点燃
  function lu_s10_meet(c, t, top, bt, elapsed) {
    var cy = (top + bt) / 2, e = elapsed, l = 2, r = c.w - 3, cx = (l + r) / 2;
    var meet = clamp01(e / 2.8);
    var tint = clamp01((e - 4.6) / 3.4);
    var ignite = clamp01((e - 7.6) / 1.6);
    var breathe = (0.85 + 0.15 * Math.sin(t * (0.7 + tint * 0.5))) * (1 - ignite * 0.35);
    var vsC = luBox(0.18, 1.3, 0.18, 0, 0.1, 0)
      .concat(luBox(0.18, 0.9, 0.18, 0.5, -0.2, 0))
      .concat(luBox(0.18, 0.7, 0.18, -0.45, -0.3, 0));
    projected(c, vsC, luEdges(0).concat(luEdges(8), luEdges(16)),
              c.w - 26, top + 2, c.w - 6, top + 13, t * 0.18,
              tint > 0.5 ? R : B, 1);
    for (var i = 0; i < 6; i++) {
      var ph2 = t * (0.8 + tint * 0.3) + i * 1.31;
      if (tint > 0 && hash16((t * 8 | 0) * 7 + i) % 100 < 14 * tint) ph2 += 3.1;
      luRibbon(c, cy + (i - 2.5) * 3.6, (2 + i * 0.5) * breathe, 0.06, ph2,
               tint > 0.45 ? R : i % 3 === 0 ? R : i % 3 === 1 ? B : N);
    }
    var mA = l + meet * (cx - l), mB = r - meet * (r - cx);
    var yA = cy - 3.6 + Math.sin(mA * 0.06 + t * 0.8) * 3 * breathe;
    var yB = cy + 3.6 + Math.sin(mB * 0.06 + t * 0.8 + 2.6) * 4 * breathe;
    c.put(mA | 0, yA | 0, '@', W);
    c.put(mB | 0, yB | 0, '@', W);
    if (meet >= 1) {                                  // 相遇爆亮
      var mu2 = mod(t * 1.2, 1);
      luRing(c, cx, cy, (2 + mu2 * 8) | 0, '.', mu2 < 0.4 ? W : R, 2);
      c.put(cx | 0, cy | 0, '*', W);
    }
    if (ignite > 0)                                   // 火舌烧上丝带末端
      for (var fx = 4; fx < c.w - 4; fx += 2) {
        var fh = hash16(fx * 977 + 7);
        if (fh % 100 < ignite * 85)
          luFlame(c, fx, bt, Math.max(1, (1 + ignite * 5 * (0.6 + 0.4 * Math.sin(t * 7 + fx))) | 0), fx, t);
      }
    luLog(c, top + 1, e, [
      ['memories ..... FADE', 0.4, N],
      ['union ........ BURST', 2.8, W],
      ['tint shift ... BLOOD', 4.8, R],
      ['resolve ...... SHATTERPROOF', 7.2, R]
    ]);
  }

  // ===== 血与火·纹章 152.18–159.93 粒度细分：2 子场景 =====

  // 152.18–156.09 "Bound by blood and flames we are shatterproof"：旺火墙+六芒纹章浮现
  function lu_s11_sigil(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var e = elapsed;
    var appear = clamp01(e / 1.8);
    for (var x = 4; x < c.w - 4; x++) {               // 旺火墙
      var hs = hash16(x * 977 + 7);
      var hMax = Math.min((9 + hs % 13) | 0, bt - top - 12);
      luFlame(c, x, bt, Math.max(2, (hMax * (0.75 + 0.25 * Math.sin(t * 7 + x * 0.9))) | 0), x, t);
    }
    for (var x2 = 4; x2 < c.w - 4; x2++) c.put(x2, bt, '#', R);
    var vsS = luBox(0.8, 0.8, 0.8, 0, 0, 0);          // 3D 纹章核心
    projected(c, vsS, luEdges(0), cx - 5, top + 1, cx + 5, top + 8,
              t * 0.5, appear > 0.8 ? W : R, 1);
    if (appear >= 1 || mod(t * 8, 1) <= appear + 0.35) {   // 闪烁式浮现
      luRing(c, cx, cy, 14, '*', R, 2, -t * 0.8);      // 外环逆旋
      luRing(c, cx, cy, 8, '+', R, 0, t * 1.1);        // 内环正旋
      for (var tri = 0; tri < 2; tri++)               // 双三角六芒
        for (var e2 = 0; e2 < 3; e2++) {
          var a1 = tri * Math.PI + e2 * TAU / 3, a2 = a1 + TAU / 3;
          for (var s3 = 0; s3 <= 10; s3++) {
            var u3 = s3 / 10;
            c.put((cx + (Math.cos(a1) * (1 - u3) + Math.cos(a2) * u3) * 14) | 0,
                  (cy + (Math.sin(a1) * (1 - u3) + Math.sin(a2) * u3) * 7) | 0, '.', R);
          }
        }
    }
    if (e > 0.3 && mod(t * 2, 1) < 0.75)
      c.centerW(bt - 5, 'B O U N D   B Y   B L O O D   &   F L A M E S', R);
    luLog(c, top + 1, e, [
      ['SIGIL.SYS  v6.6', 0.3, W],
      ['sigil ........ FORGING', 1.2, B],
      ['hexagram ..... ALIGNED', 2.6, R]
    ]);
  }

  // 156.09–159.93 "I call out your name and you know the truth"：聚热火柱+末帧爆亮 handoff
  function lu_s11_call(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2;
    var e = elapsed;
    var conv = clamp01(e / 3.8);                      // 火势向中心收拢
    for (var x = 4; x < c.w - 4; x++) {
      var hs = hash16(x * 977 + 7);
      var lean = 1 - Math.abs(x - cx) / cx;
      var hMax = Math.min(((8 + hs % 12) * (1 + lean * conv * 0.9)) | 0, bt - top - 10);
      luFlame(c, x, bt, Math.max(2, (hMax * (0.75 + 0.25 * Math.sin(t * 7 + x * 0.9))) | 0), x, t);
    }
    for (var x2 = 4; x2 < c.w - 4; x2++) c.put(x2, bt, '#', R);
    var ph2 = (2 + conv * (bt - top - 10)) | 0;        // 中央火柱越升越高
    for (var fy = 0; fy < ph2; fy++) {
      var u = 1 - fy / ph2;
      var fw = (1 + u * 3 * (1 - conv * 0.5)) | 0;
      for (var fx2 = -fw; fx2 <= fw; fx2++)
        c.put((cx + fx2) | 0, bt - 2 - fy,
              u > 0.6 ? '@' : u > 0.35 ? '#' : '*',
              u > 0.75 ? W : u > 0.4 ? R : B);
    }
    if (e > 0.2 && e < 3.2 && mod(t * 2, 1) < 0.75)
      c.centerW(bt - 5, 'C A L L   O U T   Y O U R   N A M E', R);
    var bl2 = clamp01((e - 3.4) / 0.4);               // 末帧爆亮 handoff 双人段
    if (bl2 > 0)
      for (var b2 = 0; b2 < 40 * bl2; b2++) {
        var hs2 = hash16(b2 * 71);
        c.put(4 + hs2 % (c.w - 8), top + 1 + (hs2 >> 7) % (bt - top - 2), '*', W);
      }
    luLog(c, top + 1, e, [
      ['runes ........ LIT', 0.3, B],
      ['name ......... CALLED', 1.6, N],
      ['SHATTERPROOF', 3.0, W]
    ]);
  }
  // ===== 副歌二双人 159.93–167.96 粒度细分：2 子场景 =====

  // 159.93–164.00 "We link link link link up now"：双人背靠背+交叉双剑+向外曳光+LINK UP 铬字
  function lu_s12_duo(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var e = elapsed;
    for (var bx = 6; bx < r; bx += 7)                       // 暗红竖纹战幕
      for (var by = top + 1; by < bt; by += 2)
        if (hash16(bx * 11 + by * 17) % 100 < 45) c.put(bx, by, '.', G);
    var bob = Math.sin(t * 3) * 0.6;
    function rzVs(vs, ang) {                                // 绕 z 轴旋转顶点
      var ca = Math.cos(ang), sa = Math.sin(ang);
      return vs.map(function (v) {
        return [v[0] * ca - v[1] * sa, v[0] * sa + v[1] * ca, v[2]];
      });
    }
    var vsD = rzVs(luBox(0.15, 1.6, 0.15, 0, 0, 0), 0.5)    // 3D 交叉双剑
      .concat(rzVs(luBox(0.15, 1.6, 0.15, 0, 0, 0), -0.5));
    projected(c, vsD, luEdges(0).concat(luEdges(8)), cx - 7, top + 1, cx + 7, top + 9,
              t * 0.25, B, 1);
    for (var side = 0; side < 2; side++) {                  // 双人背靠背（朝外）
      var dirS = side ? 1 : -1;
      var fx = (cx + dirS * 9) | 0;
      var hair = side ? W : R;
      var fy = (cy - 1 + bob * dirS) | 0;
      c.put(fx, fy - 4, '@', hair);
      c.put(fx + dirS, fy - 4, '*', hair);
      c.put(fx, fy - 3, 'o', W);
      c.put(fx, fy - 2, '#', side ? D : G);
      c.put(fx - dirS, fy - 2, '#', D);
      c.put(fx, fy - 1, '#', side ? D : G);
      c.put(fx + dirS * 2, fy - 3, '/', side ? W : R);
      c.put(fx + dirS * 3, fy - 4, '/', side ? W : R);
      c.put(fx + dirS * 4, fy - 5, '*', B);
      c.put(fx, fy, '/', G);
      c.put(fx - dirS, fy + 1, '\\', G);
      for (var s2 = 0; s2 < 3; s2++) {                      // 向外三条曳光
        var spd = 26 + s2 * 9;
        var dist2 = c.w / 2 - 18;
        var u2 = mod(t * spd + s2 * 37 + side * 53, dist2 + 10);
        var ty = fy - 3 + (s2 - 1) * 2;
        var hx = fx + dirS * (5 + u2);
        if (u2 >= dist2 || hx < l + 2 || hx > r - 2) continue;
        for (var k2 = 0; k2 < 5; k2++) {
          var tx = hx - dirS * k2;
          if (tx < l || tx > r) break;
          c.put(tx | 0, ty, k2 === 0 ? '@' : k2 < 2 ? '=' : '-',
                k2 === 0 ? W : k2 < 3 ? (side ? N : R) : D);
        }
      }
    }
    if (e < 2.6) {                                          // 水晶碎片径向飞散
      var fly = clamp01(e / 2.6);
      for (var i = 0; i < 24; i++) {
        var hs = hash16(i * 197 + 11);
        var a = hs % 628 / 100;
        var d = 4 + fly * (16 + hs % 22);
        c.put((cx + Math.cos(a) * d * 2) | 0, (cy + Math.sin(a) * d * 0.55) | 0,
              i % 2 ? '<' : '>',
              fly < 0.3 ? W : fly < 0.6 ? R : fly < 0.8 ? N : D);
      }
    }
    if (e < 1.6) c.big(top + 3, 'LINK UP', e < 0.5 ? W : R);
    luParticles(c, t, top, bt, 12, 83, true, true);
    luLog(c, top + 1, e, [
      ['DUET.SYS  v2.0', 0.3, W],
      ['partners ..... BACK2BACK', 1.4, B],
      ['blades ....... CROSSED', 2.8, N]
    ]);
  }

  // 164.00–167.96 "Link link link link up now"：水晶碎片风暴+双人旋身+冲击环
  function lu_s12_shatter(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2, cy = (top + bt) / 2;
    var e = elapsed;
    for (var i = 0; i < 30; i++) {                    // 持续碎片风暴（两圈异向）
      var hs = hash16(i * 197 + 11);
      var a = hs % 628 / 100 + t * (i % 2 ? 0.7 : -0.5);
      var d = 8 + (hs % 20) + Math.sin(t * 2 + i) * 3;
      c.put((cx + Math.cos(a) * d * 2) | 0, (cy + Math.sin(a) * d * 0.55) | 0,
            i % 2 ? '<' : '>', i % 5 === 0 ? W : i % 3 ? R : N);
    }
    var bob = Math.sin(t * 3) * 0.6;
    for (var side = 0; side < 2; side++) {            // 双人旋身朝外

  // 167.96–172.15 "I was left for dead but you salvaged me"：曳光对射+双人自战场崛起
  function lu_s13_cross(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) / 2;

    var off = mod(bt2 * 2, 4) | 0;
    for (var x = 6 + off; x < r - 2; x += 5)
      for (var y = top + 1; y < bt; y += 3) c.put(x, y, '.', G);
    for (var i = 0; i < 14; i++) {                    // 曳光对射加密
      var hs = hash16(i * 613 + 29);
      var fromL = i % 2 === 0;
      var speed = 24 + hs % 24;
      var y0 = top + 2 + (hs >> 5) % (bt - top - 4);
      var slope = (((hs >> 9) % 5) - 2) * 0.022;
      var dist = r - l - 8;
      var u = mod(bt2 * speed + hs % 89, dist + 14);
      var impact = u >= dist;
      var hd = impact ? dist : u;
      var hx = fromL ? l + 4 + hd : r - 4 - hd;
      var hy = y0 + slope * hd;
      if (hy < top + 1 || hy > bt - 1) continue;
      for (var k = 0; k < 8; k++) {
        var sx = hx + (fromL ? -1 : 1) * k, sy = hy - slope * k;
        if (sx < l || sx > r) break;
        var uu = 1 - k / 8;
        c.put(sx | 0, sy | 0, k === 0 ? '@' : k < 3 ? '=' : '-',
              k === 0 ? W : uu > 0.66 ? R : uu > 0.4 ? N : D);
      }
      if (impact)
        for (var b = 0; b < 10; b++) {
          var ba = b / 10 * TAU + hs % 6;
          c.put((hx + (fromL ? 1 : -1) + Math.cos(ba) * 3) | 0,
                (hy + Math.sin(ba) * 2) | 0, b % 2 ? '*' : '+', b % 3 ? R : W);
        }
    }
    var up = clamp01(e / 1.6);                        // 双人自中央崛起（salvaged）
    var fy = (bt - 6 - up * 6) | 0;
    for (var side = 0; side < 2; side++) {
      var dirS = side ? 1 : -1;
      var fx = cx + dirS * 4;
      c.put(fx, fy - 3, '@', side ? W : R);
      c.put(fx, fy - 2, 'o', W);
      c.put(fx, fy - 1, '#', side ? D : G);
      c.put(fx + dirS * 2, fy - 2, '/', side ? W : R);
    }
    if (pulseAt(t) > 0.6)
      for (var f = 0; f < 24; f++)
        c.put(l + 2 + hash16(f * 91 + (t * 7 | 0)) % (c.w - l - 6),
              top + 1 + hash16(f * 53 + 7) % (bt - top - 2), '.', W);
    luLog(c, top + 1, e, [
      ['SIEGE.SYS  v3.3', 0.3, W],
      ['crossfire ..... DENSE', 1.2, N],
      ['salvaged ...... RISEN', 2.6, B]
    ]);
  }

  // 172.15–176.25 "Quench this molten lead"：3D 王座升起+红瞳王冠+巨月浮现（接终曲）
  function lu_s13_throne(c, t, top, bt, elapsed) {

        .concat(luBox(0.25, 0.5, 1.0, 1.1, -0.35, 0));
      var eT = luEdges(0).concat(luEdges(8), luEdges(16), luEdges(24), luEdges(32));

    for (var x = 6 + off; x < r - 2; x += 5)
      for (var y = top + 1; y < bt; y += 3) c.put(x, y, '.', G);

      for (var x2 = cx - wHalf; x2 <= cx + wHalf; x2 += 2)

              row2 > seatH - 3 ? N : G);

    if (rise >= 1) {                                  // 王冠+金发+红瞳
      var blink = mod(t * 3, 1) < 0.5;
      c.put(cx, bt - 11, '*', W);
      c.put(cx, bt - 10, '@', B);
      c.put(cx - 2, bt - 8, blink ? '*' : 'o', blink ? W : R);
      c.put(cx + 2, bt - 8, blink ? '*' : 'o', blink ? W : R);
    }
    var cracks = Math.floor(e * 1.5);                 // 裂纹蔓延
    for (var cr = 0; cr < Math.min(12, cracks); cr++) {

      var dir2 = cr % 2 ? 1 : -1;

      luRing(c, cx, top + 8, (4 + mu * 6) | 0, '.', B, 2);
    }
    luLog(c, top + 1, e, [
      ['throne ....... RISING', 0.4, B],
      ['moon ......... APPEARING', 2.4, R],
      ['LINK ......... ETERNAL', 3.6, G]

  // 调试探针（供 CDP 检查网格内容）
  window.__amv = { grid: grid, w: GW, h: GH, now: now, frameAt: frameAt,
                   hash16: hash16, titlePixels: titlePixels, mix: mix, clamp01: clamp01,
                   CCanvas: CCanvas, sceneTitleTakeover: sceneTitleTakeover,
                   song: SONG_KEY, dur: DUR,
                   loadState: function () {
                     return { song: SONG_KEY, lyrics: LYRICS.length, spectrum: !!window.__SPECTRUM,
                              loadHidden: elLoad.hidden, loadTxt: elLoadTxt.textContent };
                   } };
  tick();
})();
</script>
