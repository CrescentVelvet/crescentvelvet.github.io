<!--
  ASCII MV 播放器（骨架 v1）
  - 渲染：canvas 2D + 字符图集（7 色 × 字符集预渲染，逐格 drawImage）
  - 时钟：AudioContext，播放位置 = offset + (ctx.currentTime - startAt)；
    ⚠️ ctx.currentTime 暂停时照走，不能直接当进度
  - 音频：本地文件选择（版权原因不入库）；?t=38.5 快照模式无需音频
  - 字幕：DOM 叠加层（CJK 宽度交给浏览器），不参与字符网格
  - 数据：assets/data/ascii_mv/{lyrics,spectrum}.js（window.__LYRICS / __SPECTRUM）
  - 场景：table 驱动，已移植 t=38.5 正弦切线 / t=150.5 EXECUTION 两个验证场景，
    其余走 fallback；章节表为近似值，后续对照原作逐段核对
  - 待办：apply_glitch、title_takeover、其余 30+ 场景按时间轴顺序补齐
-->

<script>
(function () {
  'use strict';
  var TAU = Math.PI * 2;
  var GW = 120, GH = 40, CW = 9, CH = 18, SC = 2;   // 网格 / 单元格 / 超采样
  var D = 0, N = 1, B = 2, W = 3, R = 4, G = 5, K = 6, Y = 3;
  var PAL = ['#afaf5f', '#ffaf5f', '#ffd75f', '#ffffd7', '#ff5f5f', '#875f00', '#5f5f00'];
  var DUR = 211.933;

  function clamp(x, a, b) { a = a || 0; b = b === undefined ? 1 : b; return Math.min(b, Math.max(a, x)); }
  function mix(a, b, u) { return a + (b - a) * u; }
  // 与原作 scenes.py 位对齐的确定性 hash
  function hash16(i) {
    var v = (i + 0x9E3779B9) >>> 0;
    v = Math.imul((v ^ (v >>> 16)) >>> 0, 0x7FEB352D) >>> 0;
    v = Math.imul((v ^ (v >>> 15)) >>> 0, 0x846CA68B) >>> 0;
    return (v ^ (v >>> 16)) & 65535;
  }

  /* ---------------- 字符网格 ---------------- */
  function CCanvas(w, h) {
    this.w = w; this.h = h;
    this.cells = [];
    for (var y = 0; y < h; y++) {
      var row = [];
      for (var x = 0; x < w; x++) row.push([' ', K]);
      this.cells.push(row);
    }
  }
  CCanvas.prototype.clear = function () {
    for (var y = 0; y < this.h; y++)
      for (var x = 0; x < this.w; x++) { this.cells[y][x][0] = ' '; this.cells[y][x][1] = K; }
  };
  // 与原作 player.py 一致：put 用 int() 截断（不是 round）；center 用地板除
  CCanvas.prototype.put = function (x, y, s, st) {
    x = Math.trunc(x); y = Math.trunc(y);
    if (y < 0 || y >= this.h) return;
    for (var i = 0; i < s.length; i++) {
      var xx = x + i;
      if (xx < 0 || xx >= this.w) continue;
      this.cells[y][xx][0] = s.charAt(i);
      this.cells[y][xx][1] = st;
    }
  };
  CCanvas.prototype.center = function (y, s, st) {
    this.put(Math.floor((this.w - s.length) / 2), y, s, st);
  };
  // 与原作 player.py 一致：参数插值法（1.5x 步数），免疫浮点端点
  CCanvas.prototype.line = function (x1, y1, x2, y2, ch, st) {
    var steps = Math.max(1, Math.floor(Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) * 1.5));
    for (var i = 0; i <= steps; i++) {
      var u = i / steps;
      this.put(Math.round(x1 + (x2 - x1) * u), Math.round(y1 + (y2 - y1) * u), ch, st);
    }
  };

  /* ---------------- 字符图集 ---------------- */
  var FONT = (14 * SC) + 'px "JetBrains Mono","Cascadia Mono",Consolas,monospace';
  var EXTRA = '░▒▓█▄■□▲►▶▷●◆·—─│┌┐└┘╔╗╚╝═║≈~^•←→↑↓∞▐▌';
  var ATLAS = null;
  function buildAtlas() {
    var set = {}, chars = [], i, ch;
    for (i = 32; i < 127; i++) { ch = String.fromCharCode(i); if (!set[ch]) { set[ch] = 1; chars.push(ch); } }
    for (i = 0; i < EXTRA.length; i++) { ch = EXTRA.charAt(i); if (!set[ch]) { set[ch] = 1; chars.push(ch); } }
    var idx = {}, per = [];
    chars.forEach(function (c, n) { idx[c] = n; });
    for (var p = 0; p < PAL.length; p++) {
      var cv = document.createElement('canvas');
      cv.width = chars.length * CW * SC; cv.height = CH * SC;
      var g = cv.getContext('2d');
      g.font = FONT; g.textBaseline = 'middle'; g.fillStyle = PAL[p];
      chars.forEach(function (c, n) {
        var tw = g.measureText(c).width;
        g.fillText(c, n * CW * SC + (CW * SC - tw) / 2, CH * SC / 2);
      });
      per.push(cv);
    }
    ATLAS = { per: per, idx: idx, miss: idx['?'] };
  }

  /* ---------------- 场景 ---------------- */
  // ---- 开场 0–16s：6 段逐行移植自原作 scenes.py（l=2, r=w-3 与 simple_area 一致）----

  // 3D 投影辅助（object_creation 用，与原作 rot/point/projected 数学一致）
  function rot3(x, y, z, t) {
    var a = t * 0.37, b = t * 0.23;
    var x1 = x * Math.cos(a) + z * Math.sin(a), z1 = z * Math.cos(a) - x * Math.sin(a);
    var y2 = y * Math.cos(b) - z1 * Math.sin(b), z2 = y * Math.sin(b) + z1 * Math.cos(b);
    return [x1, y2, z2];
  }
  function proj3(x, y, z, l, top, r, bt, t) {
    var p = 3.7 / (3.7 + z);
    return [(l + r) / 2 + x * (r - l) * 0.34 * p, (top + bt) / 2 + y * (bt - top) * 0.34 * p, z];
  }
  function projected(c, vs, edges, l, top, r, bt, t, style, reveal) {
    var ps = vs.map(function (v) { var q = rot3(v[0], v[1], v[2], t); return proj3(q[0], q[1], q[2], l, top, r, bt, t); });
    var count = Math.floor(edges.length * clamp(reveal));
    for (var i = 0; i < count; i++) {
      var a = ps[edges[i][0]], b = ps[edges[i][1]];
      c.line(a[0], a[1], b[0], b[1], (a[2] + b[2]) < 0 ? ':' : '.', (a[2] + b[2]) < 0 ? style : G);
    }
    for (i = 0; i < ps.length; i++)
      if (i < vs.length * reveal) c.put(ps[i][0], ps[i][1], ps[i][2] > 0 ? '+' : '@', ps[i][2] > 0 ? N : B);
  }

  // 场景 0–2.92：BIOS POST 开机自检（1.74s 后冻结在末态）
  function scenePowerLine(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) >> 1, cy = (top + bt) >> 1;
    var progress = clamp(elapsed / 1.6);
    var messages = [
      ['BIOS v2.1.4 - ME SYSTEM INITIALIZATION', 0.0, W],
      ['Copyright (C) 2026 Self-Awareness Corp.', 0.1, N],
      ['', 0.15, N],
      ['Main Processor : Consciousness Core v1.0', 0.2, N],
      ['Memory Test : 65536K OK', 0.3, B],
      ['Primary Master  : SOUL.SYS', 0.4, N],
      ['Primary Slave   : EMOTION.DAT', 0.5, N],
      ['Secondary Master: MEMORY.BIN', 0.6, N],
      ['', 0.7, N],
      ['Detecting IDE devices...', 0.75, G],
      ['IDENTITY : [YOU] detected', 0.85, B],
      ['RELATIONSHIP : initializing...', 0.95, G],
      ['', 1.0, N],
      ['Press SPACE to continue...', 1.1, G]
    ];
    c.center(top, 'SELF SYSTEM v1.0 - POWER ON SELF TEST', W);
    var div = ''; for (var i = 0; i < r - l; i++) div += '-';
    c.put(l, top + 1, div, G);
    var cy0 = top + 3;
    for (i = 0; i < messages.length; i++) {
      var msg = messages[i][0], th = messages[i][1], style = messages[i][2];
      if (progress > th) {
        if (msg) {
          if (progress < th + 0.08) {
            var reveal = Math.floor((progress - th) / 0.08 * msg.length);
            c.put(l + 2, cy0, msg.slice(0, reveal), style);
            if (reveal < msg.length) c.put(l + 2 + reveal, cy0, '_', W);
          } else c.put(l + 2, cy0, msg, style);
        }
        cy0++;
      }
    }
    // 内存测试进度条 ×3
    if (progress > 0.25 && progress < 0.7) {
      var bp = (progress - 0.25) / 0.45;
      for (i = 0; i < 3; i++) {
        var y = cy + i * 2, bl = Math.floor((r - l - 20) * bp);
        var bar = '['; for (var j = 0; j < r - l - 20; j++) bar += j < bl ? '=' : ' '; bar += ']';
        c.put(l + 8, y, bar, i === 0 ? B : N);
        if (i === 0) {
          c.put(l + 2, y, 'MEM:', N);
          c.put(r - 10, y, String(Math.floor(bp * 100)).padStart(3) + '%', bp > 0.95 ? W : B);
        }
      }
    }
    // 自检结果清单
    if (progress > 0.7) {
      var checks = [
        ['POWER SUPPLY', 'OK', 0.72], ['COOLING SYSTEM', 'OK', 0.77],
        ['NEURAL NETWORK', 'OK', 0.82], ['EMOTION ENGINE', 'OK', 0.87],
        ['CONSCIOUSNESS', 'ACTIVE', 0.92]
      ];
      for (i = 0; i < checks.length; i++) {
        if (progress > checks[i][2]) {
          var name = checks[i][0], st = checks[i][1], yy = cy + 8 + i;
          c.put(l + 4, yy, name, N);
          var dots = ''; for (j = 0; j < 40 - name.length; j++) dots += '.';
          c.put(l + 4 + name.length, yy, dots, G);
          c.put(r - 12, yy, '[ ' + st + ' ]', st === 'ACTIVE' ? W : B);
        }
      }
    }
    if (progress > 1.0 && Math.floor(t * 3) % 2 === 0) c.put(l + 2, bt - 2, '_', W);
    if (progress > 0.95) c.center(bt - 1, 'SYSTEM READY - LOADING ENTITY...', Math.floor(t * 2) % 2 ? B : W);
  }

  // 场景 2.92–3.873：Protection 护盾成环
  function sceneProtection(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) >> 1, cy = (top + bt) >> 1;
    var progress = clamp(elapsed / 0.95);
    for (var ring = 0; ring < 5; ring++) {
      var radius = (20 + ring * 8) * progress;
      var n = Math.floor(radius * 2);
      for (var i = 0; i < n; i++) {
        var angle = i * TAU / (radius * 2);
        var x = cx + Math.cos(angle) * radius, y = cy + Math.sin(angle) * radius * 0.5;
        if (l < x && x < r && top < y && y < bt)
          c.put(x, y, ring === 0 ? '#' : ring < 3 ? '+' : '.', ring === 0 ? W : ring < 3 ? B : N);
      }
    }
    c.center(cy, 'PROTECTION', progress > 0.7 ? W : B);
    if (progress > 0.5) c.center(cy + 2, '[ ACTIVE ]', B);
  }

  // 场景 3.873–6.38：八枚组件从边缘飞入组装
  function sceneLayPieces(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) >> 1, cy = (top + bt) >> 1;
    var pieces = 8, chars = ['[]', '{}', '<>', '//', '\\\\', '||', '==', '##'];
    for (var i = 0; i < pieces; i++) {
      var phase = (elapsed - i * 0.15) / 1.2;
      if (phase < 0) continue;
      var u = clamp(phase), ease = 1 - Math.pow(1 - u, 3);
      var angle = i * TAU / pieces;
      var startR = Math.max(r - l, bt - top) * 0.8, endR = 15;
      var radius = mix(startR, endR, ease);
      c.put(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius * 0.5,
        chars[i], ease > 0.9 ? W : ease > 0.6 ? B : N);
      if (ease < 0.8)
        for (var tr = 0; tr < 3; tr++) {
          var trr = mix(startR, endR, Math.max(0, ease - tr * 0.1));
          c.put(cx + Math.cos(angle) * trr, cy + Math.sin(angle) * trr * 0.5, '.', G);
        }
    }
  }

  // 场景 6.38–7.446：立方体材质化（ENTITY: ME）
  var CUBE_VS = (function () {
    var vs = [];
    [-0.75, 0.75].forEach(function (z) {
      [-0.8, 0.8].forEach(function (y) {
        [-0.8, 0.8].forEach(function (x) { vs.push([x, y, z]); });
      });
    });
    return vs;
  })();
  var CUBE_EDGES = (function () {
    var es = [];
    for (var i = 0; i < 8; i++) for (var j = i + 1; j < 8; j++) {
      var x = i ^ j, bits = 0;
      while (x) { bits += x & 1; x >>= 1; }
      if (bits === 1) es.push([i, j]);
    }
    return es;
  })();
  function sceneObjectCreation(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3;
    var reveal = clamp(elapsed / 1.0);
    projected(c, CUBE_VS, CUBE_EDGES, l, top, r, bt, t, N, reveal);
    if (reveal > 0.5) c.center((top + bt) >> 1, 'ENTITY: ME', W);
  }

  // 场景 7.446–11.095：hex 数据参数填充
  function sceneDataParameters(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3;
    var progress = clamp(elapsed / 2.6);
    var cols = Math.max(1, Math.floor((r - l - 10) / 5)), rows = Math.max(1, bt - top - 2);
    var n = Math.floor(progress * cols * rows);
    function hex4(v) { return v.toString(16).toUpperCase().padStart(4, '0'); }
    for (var row = 0; row < rows; row++) {
      c.put(l + 2, top + 1 + row, hex4(row * cols * 2) + ':', D);
      for (var col = 0; col < cols; col++) {
        var i = row * cols + col, xx = l + 9 + col * 5, yy = top + 1 + row;
        if (i < n) {
          var scan = (Math.floor(elapsed * 17) % cols) === col;
          c.put(xx, yy, hex4(hash16(i)), scan ? W : Math.abs(i - n) < cols ? B : N);
        } else c.put(xx, yy, '....', G);
      }
    }
  }

  // 场景 11.095–16：SIMULATION —— 条件代码块 → yield 二进制数据流
  function sceneSimulation(c, t, top, bt, elapsed) {
    var l = 2, r = c.w - 3, cx = (l + r) >> 1, cy = (top + bt) >> 1;
    if (elapsed < 2) {
      // Phase 1：代码框 + 打字机
      var phase1 = elapsed / 2.0;
      var bw = Math.min(r - l - 10, 70), bh = Math.min(bt - top - 8, 12);
      var bl = cx - (bw >> 1), btp = cy - (bh >> 1);
      if (phase1 > 0.1) {
        var hline = ''; for (var i = 1; i < bw - 1; i++) hline += '─';
        c.put(bl, btp, '┌' + hline + '┐', Y);
        c.put(bl, btp + bh - 1, '└' + hline + '┘', Y);
        for (i = 1; i < bh - 1; i++) {
          c.put(bl, btp + i, '│', Y);
          c.put(bl + bw - 1, btp + i, '│', Y);
        }
      }
      var codeLines = ['if ( if I can ) {', '', '', '    yield(world.simulations);', '', '}'];
      if (phase1 > 0.3) {
        var total = codeLines.join('').length;
        var toShow = Math.floor((phase1 - 0.3) * total * 2), count = 0;
        for (i = 0; i < codeLines.length; i++) {
          var yPos = btp + 2 + i * 2;
          if (yPos < btp + bh - 1 && count < toShow) {
            var shown = codeLines[i].slice(0, Math.min(codeLines[i].length, toShow - count));
            c.put(bl + 4, yPos, shown, codeLines[i].indexOf('yield') >= 0 ? Y : B);
            count += codeLines[i].length;
          }
        }
      }
      if (phase1 > 0.7) {
        var label = 'CONDITION: TRUE', lx = bl + 2, ly = btp + bh;
        c.put(lx - 1, ly, '▐', Y);
        c.put(lx, ly, label, Y);
        c.put(lx + label.length, ly, '▌', Y);
      }
      c.center(top + 1, 'CONTROL FLOW', phase1 > 0.5 ? Y : B);
      c.put(bl - 2, btp - 2, '2', N);
    } else {
      // Phase 2：yield 执行，二进制流下落
      var phase2 = (elapsed - 2) / 2.9;
      c.put(l + 3, top + 1, 'YIELD:', Y);
      c.put(l + 15, top + 1, (Math.floor(phase2 * 784) + 100) + ' SIMULATIONS', B);
      var numStreams = Math.floor(phase2 * 50) + 20;
      for (var si = 0; si < numStreams; si++) {
        var seed = hash16(si * 19);
        var sx = l + 5 + (seed % (r - l - 10));
        var speed = 1 + ((seed >> 8) % 3) * 0.5;
        var len = 8 + ((seed >> 4) % 12);
        var yBase = top + Math.floor(elapsed * speed * 5) % (bt - top + len);
        for (var seg = 0; seg < len; seg++) {
          var yPos = yBase - seg;
          if (top + 3 < yPos && yPos < bt - 2) {
            var cs = hash16(si * 23 + seg * 17 + Math.floor(elapsed * 10));
            var ch = cs % 3 === 0 ? '0' : cs % 3 === 1 ? 'O' : 'o';
            var bright = 1 - seg / len;
            c.put(sx, yPos, ch, bright > 0.7 ? Y : bright > 0.4 ? B : N);
          }
        }
      }
      if (phase2 > 0.3) {
        var scat = ['C', 'YOU', 'B', 'A', 'E8A', 'D', '&', '=>', '8', '6', '!', 'I'];
        for (var i = 0; i < scat.length; i++)
          if (hash16(i * 31 + Math.floor(elapsed * 7)) % 4 === 0) {
            var sxx = l + 10 + hash16(i * 37) % (r - l - 20);
            var syy = top + 5 + hash16(i * 41) % (bt - top - 10);
            c.put(sxx, syy, scat[i], hash16(i) % 3 === 0 ? Y : B);
          }
      }
      if (phase2 > 0.5)
        c.center(bt - 3, 'Give you all the simulations', Math.floor(elapsed * 4) % 2 ? B : Y);
    }
  }

  // 场景一：正弦与切线（t 37.067–40.706）—— 逐列 ~/≈，切线同字符靠色区分
  function sceneSine(c, t, top, bt, elapsed) {
    var w = c.w, l = 8, r = w - 8, x, y, i;
    var cy = Math.round((top + bt) / 2) + 1;
    var progress = clamp(elapsed / 3.0);
    var amp = (bt - top) * 0.28;
    var phase = -t * 0.5;
    function wy(px, off, a) {
      off = off || 0; a = a === undefined ? 1 : a;
      return cy - Math.sin((px - l) / (r - l) * TAU * 2 + phase + off) * amp * a;
    }
    function slope(px) {
      return -Math.cos((px - l) / (r - l) * TAU * 2 + phase) * amp * TAU * 2 / (r - l);
    }
    for (y = top; y <= bt; y++)
      for (x = 2; x < w - 2; x++) {
        var h = hash16(x * 131 + y * 313);
        if (h % 1000 < 24) c.put(x, y, '0123456789ABCDEF'.charAt((h >> 4) % 16), h % 9 === 0 ? D : K);
      }
    for (x = l; x < r; x++) c.put(x, cy, '.', K);
    for (y = top + 1; y < bt - 1; y++) c.put(l, y, '|', K);
    c.put(l, top, '^', D); c.put(r, cy, '>', D);
    c.put(l - 2, cy - Math.round(amp), '1', K);
    c.put(l - 2, cy, '0', K);
    c.put(l - 3, cy + Math.round(amp), '-1', K);
    for (x = l + 1; x < r; x++) {
      c.put(x, wy(x, -0.45, 0.85), '.', G);
      c.put(x, wy(x, 0.45, 0.85), ':', K);
    }
    for (x = l + 1; x < r; x++)
      c.put(x, wy(x), (x - l) % 2 ? '~' : '≈', (x - l) % 3 === 0 ? W : B);
    var nShow = Math.min(5, Math.floor(progress * 5) + 1), contacts = [];
    for (i = 0; i < nShow; i++) {
      var px = l + (r - l) * (i + 0.5) / 5, py = wy(px), s = slope(px);
      for (var dx = -7; dx <= 7; dx++) {
        var tx = px + dx, ty = py + s * dx;
        if (l < tx && tx < r && top < ty && ty < bt)
          c.put(tx, ty, '≈', i === nShow - 1 ? Y : G);
      }
      contacts.push([px, py]);
    }
    contacts.forEach(function (cp, i) {
      c.put(cp[0], cp[1], '●', i === contacts.length - 1 ? W : Y);
    });
    if (contacts.length && progress > 0.55) {
      var lp = contacts[contacts.length - 1];
      c.put(lp[0] - 2, lp[1] - 2, '[YOU]', W);
    }
    if (progress > 0.3) c.center(top + 1, 'y = sin(x)', B);
    if (progress > 0.6) c.center(top + 2, "y' = cos(x)", W);
    if (progress > 0.8) {
      var ph = ((phase % TAU) + TAU) % TAU;
      c.put(2, bt - 1, 'AMP 0.87  FREQ 0.50Hz  PHASE +' + ph.toFixed(2) + 'rad  ERR 0.000  sync ok', D);
      c.put(w - 12, bt - 1, 'SINE:TAN', K);
    }
  }

  // 场景二：EXECUTION 幕布（t 147.66–158.9）—— ANSI Shadow 字形与原作一致
  var EXEC_ART = [
    '███████╗██╗  ██╗███████╗ ██████╗██╗   ██╗████████╗███████╗',
    '██╔════╝╚██╗██╔╝██╔════╝██╔════╝██║   ██║╚══██╔══╝██╔════╝',
    '█████╗   ╚███╔╝ █████╗  ██║     ██║   ██║   ██║   ███████╗',
    '██╔══╝   ██╔██╗ ██╔══╝  ██║     ██║   ██║   ██║   ╚════██║',
    '███████╗██╔╝ ██╗███████╗╚██████╗╚██████╔╝   ██║   ███████║',
    '╚══════╝╚═╝  ╚═╝╚══════╝ ╚═════╝ ╚═════╝    ╚═╝   ╚══════╝'
  ];
  function glitchIntensity(t) {
    if (t < 60) return 0.05;
    if (t < 110) return mix(0.05, 0.25, (t - 60) / 50);
    var anchors = [[110.9, 0.259], [112.22, 0.34], [113.1, 0.43], [114.18, 0.51],
      [114.92, 0.59], [115.78, 0.66], [117.274, 0.73], [125.708, 0.81],
      [147.66, 0.92], [177.246, 1.0]];
    for (var i = 0; i < anchors.length - 1; i++)
      if (t < anchors[i + 1][0])
        return mix(anchors[i][1], anchors[i + 1][1], clamp((t - anchors[i][0]) / (anchors[i + 1][0] - anchors[i][0])));
    return 1.0;
  }
  function sceneExec(c, t, top, bt, elapsed) {
    var w = c.w, l = 2, r = w - 3, x, y;
    var cx = Math.round((l + r) / 2), cy = Math.round((top + bt) / 2);
    var progress = clamp(elapsed / 16.0);
    var inten = glitchIntensity(t);
    var frame = Math.floor(t * 24);
    var scroll = Math.floor(elapsed * 15);
    for (y = top; y <= bt; y++) {
      var rowSeed = (y + scroll) * 23;
      for (x = l; x < r - 5; x += 7) {
        if (hash16(y * 17 + x) % 3 === 0) {
          var sym = ['0x', '+=', '==', '&&', '||', '->', '::'][hash16(rowSeed + x) % 7];
          c.put(x, y, sym, hash16(y + x) % 4 ? N : G);
        } else {
          var hv = ('0' + (hash16(rowSeed + x * 13) % 256).toString(16).toUpperCase()).slice(-2);
          c.put(x, y, hv, N);
        }
      }
    }
    var close = progress * 0.9;
    var lxEnd = Math.floor(l + (r - l) * close * 0.5);
    var rxBeg = Math.floor(r - (r - l) * close * 0.5);
    var stripes = [['█', B], ['▓', B], ['▒', N], ['░', N]];
    for (x = l; x < lxEnd; x++)
      for (y = top; y <= bt; y++) {
        var sp = stripes[(x - l + Math.floor(y / 3)) % 4];
        c.put(x, y, sp[0], sp[1]);
      }
    for (x = rxBeg; x <= r; x++)
      for (y = top; y <= bt; y++) {
        var sp2 = stripes[(x - rxBeg + Math.floor(y / 3)) % 4];
        c.put(x, y, sp2[0], sp2[1]);
      }
    if (lxEnd < cx && cx < rxBeg) {
      var flash = Math.floor(elapsed * 6) % 4;
      if (flash < 3) {
        var col = flash === 0 ? W : (flash === 1 ? Y : R);
        var startY = cy - Math.floor(EXEC_ART.length / 2);
        for (var i = 0; i < EXEC_ART.length; i++) {
          var lineTxt = EXEC_ART[i], yPos = startY + i;
          if (top < yPos && yPos < bt) {
            var half = Math.floor(lineTxt.length / 2);
            var sx0 = Math.max(lxEnd, cx - half), ex0 = Math.min(rxBeg, cx + half);
            if (sx0 < ex0) {
              var ls = Math.max(0, lxEnd - (cx - half));
              var le = Math.min(lineTxt.length, ls + (ex0 - sx0));
              c.put(sx0, yPos, lineTxt.substring(ls, le), col);
            }
          }
        }
      }
    }
    var msg, mst;
    if (progress < 0.3) {
      msg = 'EXECUTION #' + (Math.floor(elapsed / 1.35) % 12 + 1) + '    depth=1'; mst = Y;
    } else if (progress < 0.6) {
      msg = 'EXECUTION RUNNING...'; mst = Math.floor(elapsed * 4) % 2 ? Y : W;
    } else {
      msg = 'EXECUTION CLOSING'; mst = Math.floor(elapsed * 6) % 2 ? W : R;
    }
    c.put(cx - Math.floor(msg.length / 2) - 2, top + 1,
      ' '.repeat(msg.length + 4), D);
    c.center(top + 1, msg, mst);
    var nInd = 8, active = Math.floor(elapsed * 8) % nInd;
    c.put(l + 8, bt - 1, ' '.repeat(r - l - 16), D);
    for (var ii = 0; ii < nInd; ii++) {
      var ix = l + 10 + ii * Math.floor((r - l - 20) / nInd);
      if (lxEnd < ix && ix < rxBeg)
        c.put(ix, bt - 1, ii === active ? '▶' : '▷', ii === active ? W : N);
    }
    // 损伤累积（收敛版：只污染背景，避开大字带）
    for (var k = 0; k < Math.floor(inten * 14); k++) {
      var gx = l + hash16(frame + k * 19) % (r - l);
      var gy = top + hash16(frame + k * 23) % Math.max(1, bt - top);
      if (cy - 6 <= gy && gy <= cy + 6) continue;
      var cell = c.cells[gy] && c.cells[gy][gx];
      if (cell && cell[0] !== ' ') cell[1] = inten > 0.7 ? R : W;
    }
  }

  // 占位场景：低密噪点 + 待移植提示
  function sceneFallback(c, t, top, bt) {
    for (var y = top; y <= bt; y++)
      for (var x = 2; x < c.w - 2; x++) {
        var h = hash16(x * 131 + y * 313);
        if (h % 1000 < 14) c.put(x, y, '0123456789ABCDEF'.charAt((h >> 4) % 16), K);
      }
    c.center(Math.round((top + bt) / 2), '- SCENE TODO -', D);
  }

  // 路由与原作 draw_scene 一致；emap = 原作对 elapsed 的特殊处理
  // （power_line 提前 0.1s 开始；1.74–2.92 冻结在末态；lay_pieces/data_parameters 跨歌词段连续计时）
  var SCENES = [
    { a: 0, b: 1.74, f: scenePowerLine, emap: function (t) { return t - 0.1; } },
    { a: 1.74, b: 2.92, f: scenePowerLine, emap: function () { return 1.6; } },
    { a: 2.92, b: 3.873, f: sceneProtection },
    { a: 3.873, b: 6.38, f: sceneLayPieces },
    { a: 6.38, b: 7.446, f: sceneObjectCreation },
    { a: 7.446, b: 11.095, f: sceneDataParameters },
    { a: 11.095, b: 16, f: sceneSimulation },
    { a: 37.067, b: 40.706, f: sceneSine },
    { a: 147.66, b: 158.9, f: sceneExec }
  ];
  function sceneAt(t) {
    for (var i = 0; i < SCENES.length; i++)
      if (t >= SCENES[i].a && t < SCENES[i].b) return SCENES[i];
    return { f: sceneFallback, a: t };
  }

  /* ---------------- 版面 chrome ---------------- */
  // ⚠️ 章节表为近似值（仅 02/DEVOTION、04/EXECUTION 与原作帧核实过）
  var CHAPTERS = [
    [0, '01 / BOOT'], [16, '-- / TITLE'], [29.709, '02 / DEVOTION'],
    [59.223, '03 / SIMULATION'], [147.66, '04 / EXECUTION'], [177.246, '05 / OUTRO']
  ];
  function chapterAt(t) {
    var s = '';
    for (var i = 0; i < CHAPTERS.length; i++) if (t >= CHAPTERS[i][0]) s = CHAPTERS[i][1];
    return s;
  }
  function fmtT(t) {
    var m = Math.floor(t / 60), s = t - m * 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
  }
  function drawChrome(c, t, playing, snap) {
    c.put(2, 0, 'WORLD.EXECUTE(ME);', W);
    var right = fmtT(t) + ' / 03:32  ' + (snap ? 'SNAPSHOT' : playing ? 'PLAYING' : 'PAUSED');
    c.put(c.w - 2 - right.length, 0, right, D);
    var div = '';
    for (var i = 0; i < c.w; i++) div += '-';
    c.put(0, 1, div, K);
    var ch = chapterAt(t);
    if (ch) c.put(2, 2, ch, D);
    c.center(39, 'SPACE play/pause   <- -> 5s   R restart', K);
  }
  function drawSpectrum(c, t) {
    var sp = window.__SPECTRUM;
    if (!sp) return;
    var fi = Math.min(sp.frames.length - 1, Math.max(0, Math.round(t * sp.fps)));
    var fr = sp.frames[fi], x0 = 4, x1 = c.w - 4;
    for (var x = x0; x < x1; x++) {
      var v = fr[Math.floor((x - x0) / (x1 - x0) * sp.bands)] / 99;
      var chh = v > 0.75 ? '#' : v > 0.55 ? '=' : v > 0.35 ? ':' : v > 0.15 ? '.' : ' ';
      if (chh !== ' ') c.put(x, 34, chh, v > 0.55 ? B : v > 0.15 ? N : D);
    }
  }

  /* ---------------- 字幕（DOM 层） ---------------- */
  var LYRICS = window.__LYRICS || [];
  function lyricAt(t) {
    var lo = 0, hi = LYRICS.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (LYRICS[mid].time <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (ans >= 0 && t < LYRICS[ans].end) return LYRICS[ans];
    return null;
  }
  var elEn = document.getElementById('amv-en'), elZh = document.getElementById('amv-zh');
  var lastLy = -2;
  function updateSubs(t) {
    var e = lyricAt(t);
    var idx = e ? LYRICS.indexOf(e) : -1;
    if (idx === lastLy) return;
    lastLy = idx;
    elEn.textContent = e ? e.en : '';
    elZh.textContent = e ? e.zh : '';
  }

  /* ---------------- 渲染 ---------------- */
  var cvEl = document.getElementById('amv-cv');
  var g2d = cvEl.getContext('2d');
  var grid = new CCanvas(GW, GH);
  function render() {
    g2d.fillStyle = '#000';
    g2d.fillRect(0, 0, GW * CW * SC, GH * CH * SC);
    for (var y = 0; y < GH; y++)
      for (var x = 0; x < GW; x++) {
        var cell = grid.cells[y][x];
        if (cell[0] === ' ') continue;
        var gi = ATLAS.idx[cell[0]];
        if (gi === undefined) gi = ATLAS.miss;
        g2d.drawImage(ATLAS.per[cell[1]], gi * CW * SC, 0, CW * SC, CH * SC,
          x * CW * SC, y * CH * SC, CW * SC, CH * SC);
      }
  }

  /* ---------------- 音频时钟 ---------------- */
  var qs = new URLSearchParams(location.search);
  var SNAP = qs.get('t') !== null ? parseFloat(qs.get('t')) : null;
  var actx = null, buf = null, src = null, startAt = 0, playing = false;
  var offset = SNAP !== null && isFinite(SNAP) ? clamp(SNAP, 0, DUR - 0.05) : 0;
  function now() { return playing ? Math.min(offset + (actx.currentTime - startAt), DUR) : offset; }
  var playBtn = document.getElementById('amv-play');
  function startSrc() {
    src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(actx.destination);
    src.onended = function () { if (playing) { playing = false; offset = DUR; playBtn.textContent = 'PLAY'; } };
    src.start(0, Math.min(offset, DUR - 0.05));
    startAt = actx.currentTime;
  }
  function play() {
    if (!buf || playing) return;
    if (offset >= DUR - 0.05) offset = 0;
    actx.resume();
    startSrc();
    playing = true;
    playBtn.textContent = 'PAUSE';
  }
  function pause() {
    if (!playing) return;
    offset = now();
    src.onended = null;
    try { src.stop(); } catch (e) { }
    playing = false;
    playBtn.textContent = 'PLAY';
  }
  function seekTo(v) {
    var wasPlaying = playing;
    if (playing) pause();
    offset = clamp(v, 0, DUR - 0.05);
    if (wasPlaying) play();
  }
  document.getElementById('amv-file').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var rd = new FileReader();
    rd.onload = function () {
      actx.decodeAudioData(rd.result, function (b) {
        buf = b;
        playBtn.disabled = false;
        play();
      }, function () { document.getElementById('amv-note').textContent = '音频解码失败'; });
    };
    rd.readAsArrayBuffer(f);
  });
  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  document.getElementById('amv-prog').addEventListener('click', function (ev) {
    var rect = this.getBoundingClientRect();
    seekTo((ev.clientX - rect.left) / rect.width * DUR);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.code === 'Space') { ev.preventDefault(); playing ? pause() : play(); }
    else if (ev.key === 'ArrowLeft') seekTo(now() - 5);
    else if (ev.key === 'ArrowRight') seekTo(now() + 5);
    else if (ev.key === 'r' || ev.key === 'R') seekTo(0);
  });

  /* ---------------- 主循环 ---------------- */
  var elFill = document.getElementById('amv-fill'), elTime = document.getElementById('amv-time');
  function tick() {
    var t = now();
    grid.clear();
    drawChrome(grid, t, playing, SNAP !== null);
    var sc = sceneAt(t);
    sc.f(grid, t, 4, 32, sc.emap ? sc.emap(t) : t - sc.a);
    drawSpectrum(grid, t);
    render();
    updateSubs(t);
    elFill.style.width = (t / DUR * 100).toFixed(2) + '%';
    elTime.textContent = fmtT(t) + ' / 03:32';
    requestAnimationFrame(tick);
  }
  buildAtlas();
  // 调试探针（供 CDP 检查网格内容）
  window.__amv = { grid: grid, w: GW, h: GH, now: now };
  tick();
})();
</script>
