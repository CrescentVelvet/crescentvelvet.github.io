  // 源视频 84–87s 的旋转纹章轮盘，轮辐、齿圈与三重环均有实体厚度。
  function luRoyalWheel(c,t,cx,cy,r,heat) {
    for(var y=Math.max(5,Math.floor(cy-r/2));y<Math.min(32,cy+r/2+1);y++)for(var x=Math.floor(cx-r);x<=cx+r;x++) {
      var dx=x-cx,dy=(y-cy)*2,rad=Math.hypot(dx,dy),a=Math.atan2(dy,dx)+t*0.65;
      var tooth=Math.cos(a*14)>0.1;
      if(rad>r||(rad>r-2&&!tooth))continue;
      if(rad>r-4)c.put(x,y,'▓',N);
      else if(rad>r-6)c.put(x,y,'█',heat>0.5?B:N);
      else if(rad<4)c.put(x,y,'█',B);
      else if(Math.abs(Math.sin(a*3))<0.14)c.put(x,y,'▓',N);
      else if(Math.abs(rad-r*0.53)<1)c.put(x,y,'·',G);
      else if(rad<r-7)c.put(x,y,' ',K);
    }
    for(var j=0;j<6;j++) {
      var a=j/6*TAU-t*0.65;
      c.put(cx+Math.cos(a)*r*0.72,cy+Math.sin(a)*r*0.36,'◆',B);
    }
  }

  // 血蔷薇采用层叠折面花瓣；末段花瓣沿弧线离开，不用随机雪花替代轮廓。
  function luRoyalRose(c,t,cx,cy,open,scatter) {
    for(var petal=8;petal>=0;petal--) {
      var a=petal*2.4+t*0.04,r=(4+petal*0.9)*open+scatter*petal*2;
      var x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r/2-scatter*petal*0.35;
      var w=(5+petal*0.35)*open;
      luCoalFacet(c,[[x-w,y],[x-w*0.3,y-2.2*open],[x+w,y-0.6*open],[x+w*0.5,y+2*open],[x-w*0.4,y+1.5*open]],R,'▓');
      c.line(x-w,y,x-w*0.3,y-2.2*open,'╱',N);
      c.line(x-w*0.3,y-2.2*open,x+w,y-0.6*open,'▄',R);
    }
    if(scatter<0.5) {
      c.line(cx,cy+3,cx-2,30,'│',G);
      luCoalFacet(c,[[cx-1,cy+8],[cx-10,cy+5],[cx-7,cy+9],[cx-2,cy+10]],G,'▓');
      luCoalFacet(c,[[cx-2,cy+12],[cx+7,cy+8],[cx+5,cy+12]],N,'░');
    }
  }

  // 同一解析时间轴保证 84.09 / 88.26 / 92.04s 不会重置人物姿态。
  function luRoyalSequence(c,t,top,bt,age) {
    function ease(v){v=clamp01(v);return v*v*(3-2*v);}
    var wheelIn=ease((age-4.09)/0.65),wheelOut=ease((age-7.5)/0.76);
    // 88.26s 起 0.5s 推入近景（≈12 帧），随后保持到本章结束；92.04s 血蔷薇换镜头
    // 时直接切回全景。早期版本是 1.45s 推近 + 1.3s 缩回，近景停 2s 又被拉回去，
    // 24fps 下像"变焦呼吸"；实拍/MV 里景别变化是切镜，不是来回拉。
    var close=age>=12.04?0:ease((age-8.26)/0.5);
    luRoyalHall(c,t,close,clamp01((age-12.04)/2));
    // 80–82.4s：红门向两侧滑开 —— 只留两道光墙（门缝透出的血色光），不画横梁。
    // 早期版本用 █ 实心柱 + ▄ 横梁拼成一个闭合矩形，人物显影前那半秒画面里
    // 就是一个静止的空心方框，24fps 下会被直接读成 UI 选择框。
    // 门中心对齐人物中线 65（actor.x=38 是左边缘，宽 53），两侧留 6 格余量。
    if(age<2.45) {
      var open=ease(clamp01(age/1.15)),rush=Math.max(0,age-1.15);
      var zoom=open*4+rush*rush*40;
      // 光墙随 80.65s 的双环淡入一起"点亮"：░→▒→▓，避免整条光带突然拍在画面边缘。
      var appear=clamp01((age-0.35)/0.5),lit=appear<0.34?'░':appear<0.7?'▒':'▓';
      for(var gate=2;gate>=0;gate--) {
        var gw=31+zoom+gate*4,gl=Math.round(65-gw),gr=Math.round(65+gw),gy;
        if(gate!==0) {   // 更远的门缝只留一条暗金细线，交代替深
          for(gy=3;gy<34;gy++){c.put(gl,gy,'│',G);c.put(gr,gy,'│',G);}
          continue;
        }
        // 擦过镜头时 红→橙→暗金 递减，代替整道光墙突然消失。
        var fade=clamp01((zoom-16)/18),core=fade>0.75?G:fade>0.4?N:R,mid=fade>0.4?G:N;
        for(gy=3;gy<34;gy++) {
          c.put(gl,gy,lit,core);c.put(gr,gy,lit,core);      // 光核
          c.put(gl-1,gy,'▒',mid);c.put(gr+1,gy,'▒',mid);    // 内晕
          c.put(gl-2,gy,'░',G);c.put(gr+2,gy,'░',G);        // 外晕
        }
        // 门钉：沿光墙每 6 行一枚，只在光还亮时出现
        if(fade<0.45)for(var ky=10;ky<32;ky+=6){c.put(gl,ky,'◆',N);c.put(gr,ky,'◆',N);}
      }
    }
    // 台阶和瘦长王座外缘，不在人物背后铺纹理。
    for(var tier=0;tier<3;tier++)c.line(72-16-tier*6,29+tier,72+16+tier*6,29+tier,tier===0?'▄':'─',G);
    c.line(51,27,51,10,'│',G);c.line(94,27,94,10,'│',G);
    c.line(51,10,72,5,'╱',G);c.line(72,5,94,10,'╲',G);
    if(wheelIn>0&&wheelOut<1) {
      luRoyalWheel(c,t,27,17,22*wheelIn,1-wheelOut);
      // 轮盘下沿的淬池，蒸汽只在左侧，保留脸、金发和握镰手。
      c.line(7,29,47,29,'▄',N);
      var cool=ease((age-6.25)/1.9);
      for(var i=0;i<28;i++) {
        var seed=hash16(i*317+5),u=mod(t*0.7+seed/65535,1);
        var x=27+(seed%29-14)*(0.4+u*0.6),y=28-u*9*(1-cool*0.75);
        if(u>0.15)c.put(x,y,u<0.45?'░':'·',u<0.25?W:G);
      }
    }
    // 人物显影紧跟光墙出现（0.55s 起，0.95s 完成）——晚于门缝就会出现"空框等人"。
    if(age>0.55) {
      var reveal=ease((age-0.55)/0.95);
      // 全景保留刀尖到双靴；近景放大脸与双马尾，脚离开构图是有意的推镜。
      // 峰值 68 格：再大就会把冠冕和靴子同时切掉。纵向补偿只抬 0.5 行 ——
      // 抬多了先切头冠（身份特征），宁可让裙摆下缘被近景裁掉。
      var width=53+close*15;
      c.queen={x:38-close*17,y:5-close*0.5,width:width,t:t,reveal:reveal};
    }
    if(age>12.04) {
      var bloom=ease((age-12.04)/0.9),scatter=ease((age-14.7)/1.33);
      luRoyalRose(c,t,25,17,bloom,scatter);
    }
    // 近景左侧的几条红色斜切光带呼应 MV 红眼特写；头部周围保持空。
    if(close>0.1)for(var n=0;n<3;n++) {
      var x=9+n*9+Math.sin(t*0.5+n)*2;
      c.line(x,6,x-5,27,'╲',n===1?R:G);
    }
    // 80s 接受上镜完整双环，从外向内揭出殿堂，不闪空屏。
    if(age<0.65) {
      var old=new CCanvas(c.w,c.h);old.clip=[top+1,bt-1];lu_s5_ring(old,t,top,bt,3.88);
      for(var y=top+1;y<bt;y++)for(var x=0;x<c.w;x++) {
        if(age>0&&Math.abs(x-60)>58*(1-age/0.65))continue;
        var cell=old.cells[y][x];c.put(x,y,cell[0],cell[1]);
      }
    }
    clearRect(c,0,top,c.w,1);clearRect(c,0,bt,c.w,1);
    c.put(3,top,age<4.09?'37 / A THRONE RECLAIMED':age<8.26?'38 / TEMPERED BY FIRE':age<12.04?'39 / THE CRIMSON REAPER':'40 / A ROSE THAT WILL NOT WITHER',N);
    c.center(bt,age<4.09?'FROM THE DARK / SHE RETURNS':age<8.26?'COOL THE STEEL / KEEP THE FLAME':age<12.04?'ONE HEART / AN UNBROKEN VOW':'BLOOD IN BLOOM / THE THRONE IS HERS',B);
  }
  function lu_s6_rise(c,t,top,bt,elapsed){luRoyalSequence(c,t,top,bt,elapsed);}
  function lu_s6_quench(c,t,top,bt,elapsed){luRoyalSequence(c,t,top,bt,4.09+elapsed);}
  function lu_s6_hammer(c,t,top,bt,elapsed){luRoyalSequence(c,t,top,bt,8.26+elapsed);}
  function lu_s6_pull(c,t,top,bt,elapsed){luRoyalSequence(c,t,top,bt,12.04+elapsed);}

  // ===== 长音 Link 96.03–103.51：赤日点亮 → 虹膜收束白爆 → LINK UP 定格 =====
  // 官方 MV 106.4–114.1s 的对应段是三镜：巨大赤日光轮前的小小人形剪影、
  // 轮辐状虹膜白闪、白字标题。旧版这里是 9 层同心矩形线框 + 3D 立方体，
  // 缩略图里读成"扫描线测试图"，整段推倒重做。
  // 三个子件共用一条解析时间轴，跨 100.00 的子场景边界不会重置姿态。

  var LU_LINK_CX = 60, LU_LINK_CY = 17.5;

  // 方向字形：给一条斜线挑字符，横段用 '-'、竖段用 '│'、斜段用 '╱╲'。
  // 赤日的光线全部用 '-' 画过，结果整颗太阳变成一张编织席——方向错了，
  // 线条就只剩纹理，读不出"射出去"的意思。
  function luDirChar(dx, dy) {
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (ay < ax * 0.42) return '-';
    if (ax < ay * 0.42) return '│';
    return (dx * dy > 0) ? '╲' : '╱';
  }

  // 赤日：实心球体 + 日冕光线。
  // 走过两条弯路：①盘内按轮辐分档填 ▒ ⇒ 砖墙马赛克；②只画放射线 ⇒ 空心的烟花。
  // 120×40 的格子铺不出柔和渐变，只能"认怂"画实心球：径向分色块（白核→金→橙→红），
  // 边缘用 ▓ 收口，外面再放一圈方向正确的光线当日冕。字形对比靠分色，不靠网点。
  function luLinkSun(c, cx, cy, rad, spin, sweep, heat) {
    if (rad < 1) return;
    var i, a, r0, u, len, st, ch;
    var rays = 52;
    // 球体
    for (var y = Math.floor(cy - rad / 2); y <= Math.ceil(cy + rad / 2); y++)
      for (var x = Math.floor(cx - rad); x <= Math.ceil(cx + rad); x++) {
        if (rad < 2) break;
        var dx = x - cx, dy = (y - cy) * 2, rr = Math.sqrt(dx * dx + dy * dy), u = rr / rad;
        if (u > 1) continue;
        // 球体也按角度点亮，与日冕同一条 sweep（从正上方顺时针）
        if (mod(Math.atan2(dy, dx) - spin, TAU) / TAU > sweep) continue;
        var ch2 = '█', st2 = R;
        if (u < 0.10) { ch2 = '█'; st2 = heat > 0.4 ? W : B; }
        else if (u < 0.30) { ch2 = '█'; st2 = B; }
        else if (u < 0.62) { ch2 = '█'; st2 = N; }
        else if (u < 0.88) { ch2 = '█'; st2 = R; }
        // 球缘不做 ▒ 环（那圈网点会连成一环马赛克），改成按 hash 掉格 + 少量 ▓
        else if (hash16(y * 313 + x * 127) % 100 >= 22) {
          ch2 = hash16(y * 7 + x * 3) % 3 ? '█' : '▓';
        } else continue;
        c.put(x, y, ch2, st2);
      }
    // 日冕：从球缘射出的光线，长短按 hash 各自不同；方向字符不能省，
    // 全用 '-' 会把整颗太阳画成一张编织席。
    for (i = 0; i < rays; i++) {
      if (i / rays > sweep) continue;
      a = i / rays * TAU + spin;
      var ca = Math.cos(a), sa = Math.sin(a);
      ch = luDirChar(ca, sa * 0.5);
      var hs = hash16(i * 233 + 17);
      len = rad * (1.04 + 0.30 * (hs % 100) / 100);
      for (r0 = rad * 0.97; r0 <= len; r0 += 0.8) {
        u = (r0 - rad * 0.97) / Math.max(1, len - rad * 0.97);
        st = u < 0.28 ? R : u < 0.62 ? N : u < 0.85 ? R : G;
        c.put(cx + ca * r0, cy + sa * r0 / 2, ch, st);
      }
      if (len > rad * 1.3) c.put(cx + ca * len, cy + sa * len / 2, '+', R);
    }
    // 四束超长光芒：日轮边界的"毛感"全靠这几根漏出来的光
    for (i = 0; i < 4; i++) {
      a = i / 4 * TAU + spin * 0.4 + 0.6;
      if (i / 4 > sweep) continue;
      var ca2 = Math.cos(a), sa2 = Math.sin(a);
      ch = luDirChar(ca2, sa2 * 0.5);
      for (r0 = rad; r0 < rad * 1.55; r0 += 1.2)
        c.put(cx + ca2 * r0, cy + sa2 * r0 / 2, ch, r0 > rad * 1.3 ? G : R);
    }
    // 两道虚线光环：球缘之外再圈一层，日轮才不是一颗"实心球"而已
    if (sweep > 0.55) {
      var r1 = rad * 1.14, r2 = rad * 1.34;
      for (i = 0; i < 140; i++) {
        a = i / 140 * TAU + spin * 0.25;
        if (!(i % 2)) c.put(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 / 2, '·', i % 6 ? G : N);
        if (!(i % 3)) c.put(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2 / 2, '.', G);
      }
    }
  }

  // 赤日前的人形：试过三版（实心 K 色 / 挖空 + 描边 / 收窄下摆），
  // 12 行高的黑衣剪影在 1:2 字符格上只剩"一根带边的柱子"，读成墓碑或钥匙孔——
  // 这个尺寸下画不出可辨认的头肩比，索性不画：这一镜的主角是光本身。
  // 人物留给前后两段（殿堂立绘、切镜后的全景）。


  // 白爆：首版按 hash 铺满整屏再蒸发，24fps 下是一张"坐标纸"（字符格之间本来就有
  // 缝，整屏铺满时那些缝连成网格）。改成虹膜：从核心向外涨满，再从中心退开、
  // 白环往外跑——中心最先露出标题，边缘最后消失。
  function luLinkBlast(c, top, bt, cx, cy, rIn, rOut) {
    var full = rOut > 0.001;
    for (var y = top; y < bt; y++) for (var x = 0; x < c.w; x++) {
      var d = Math.sqrt((x - cx) * (x - cx) + ((y - cy) * 2) * ((y - cy) * 2)) / 70;
      // 边界按 hash 抖一点，虹膜边才不是一条几何圆弧
      var j = (hash16(y * 197 + x * 61) / 65535 - 0.5) * 0.035;
      // 涨满段 rIn:0→1；退散段 rOut:0→1 = 白环外沿，白先从中心让开、标题先露出来
      var on = full ? (d + j >= rOut) : (d + j <= rIn);
      if (!on) continue;
      var edge = full ? (d - rOut) : (rIn - d);
      if (edge < 0.05) c.put(x, y, '░', N);
      else if (edge < 0.12) c.put(x, y, '▓', B);
      else c.put(x, y, '█', W);
    }
  }

  function luLinkSequence(c, t, top, bt, age) {
    function ease(v) { v = clamp01(v); return v * v * (3 - 2 * v); }
    var cx = LU_LINK_CX, cy = LU_LINK_CY;
    if (age < 3.90) {
      // 余烬先画：luParticles 里最暗的一档是 D（#afaf5f），落在实心日面上
      // 就是一颗颗黑斑，像球体被打穿。日轮后画把它盖住，只见外围的火星。
      luParticles(c, t, top, bt, 30, 97, true, true);
      // sweep 从 0.22 起：从 0 开始的话开头 3 帧几乎是全黑，切进来的第一眼是空屏
      var ign = clamp01(0.22 + age / 1.15);            // 球体与光线按角度依次点亮
      var iris = ease((age - 2.55) / 1.05);           // 2.55s 起虹膜收束
      var rad = mix(mix(11, 27, ease(clamp01((age - 0.05) / 1.9))), 4, iris);
      luLinkSun(c, cx, cy, rad, t * (0.3 + iris * 6.5) + age * 0.35, clamp01(ign * 1.15), 1 - iris * 0.35);
      // 地平线：一条极暗的红线压在 31 行，画面才有底，不然日轮是浮在黑水里的
      for (var gx = 0; gx < c.w; gx++)
        if (hash16(gx * 97 + 13) % 100 < 62) c.put(gx, 31, '─', gx % 9 ? G : R);
      // 收束时的离心速度线：给"虹膜在闭合"一个方向感
      if (iris > 0.12) for (var s = 0; s < 42; s++) {
        var hs = hash16(s * 89 + 7), a2 = hs / 65535 * TAU;
        var d0 = rad + 2 + iris * 13, d1 = d0 + 3 + iris * 11;
        for (var dd = d0; dd < d1; dd += 1.1)
          c.put(cx + Math.cos(a2) * dd, cy + Math.sin(a2) * dd / 2,
                dd - d0 < 1.6 ? '·' : '.', dd - d0 < 1.6 ? W : N);
      }
    }
    // 标题：4.3s 起就位，靠白环往画外退的那一下"浮"出来
    if (age > 4.30) {
      var pulse = 0.5 + 0.5 * Math.sin(age * 3.1), flash = mod(age * 0.7, 1) < 0.06;
      // 双环：内环缓慢张开（4.3–7.48s 从 24 撑到 40），外环只在最后 1s 出现，
      // 撑开的过程给"定格"一个时间感——否则三秒半的标题就是一张静止的图。
      var grow = ease((age - 4.3) / 3.1), ring = 24 + grow * 16;
      luRing(c, cx, cy - 1, ring, '·', pulse > 0.5 ? R : G, 3, t * 0.2);
      if (grow > 0.55) luRing(c, cx, cy - 1, ring + 6, '.', G, 4, -t * 0.15);
      // 交叉双刃：两道贯穿画面的血色斜线，交点落在标题后面
      var sp = ease((age - 4.9) / 1.2);
      if (sp > 0) {
        c.line(cx - 46 * sp, cy + 12, cx + 46 * sp, cy - 12, '╱', mod(age, 1.4) < 0.18 ? R : G);
        c.line(cx - 46 * sp, cy - 12, cx + 46 * sp, cy + 12, '╲', mod(age + 0.7, 1.4) < 0.18 ? R : G);
      }
      c.big(Math.round(cy) - 4, 'LINK UP', flash ? R : pulse > 0.5 ? W : B, '█');
      // 副标按字符打出，与逐字歌词同步推进，别让下半屏是一行静止小字
      var sub = 'B L O O D   &   F L A M E';
      var nc = Math.min(sub.length, Math.floor(clamp01((age - 4.75) / 1.1) * sub.length));
      if (nc > 0) c.center(Math.round(cy) + 4, sub.slice(0, nc), pulse > 0.5 ? N : G);
      luParticles(c, t, top, bt, 14, 41, false, true);
    }
    // 3.62s 起从核心涨满（0.24s 推到顶，只留 ~5 帧纯白）；4.02s 起白环往外退
    if (age > 3.62 && age < 4.02) luLinkBlast(c, top, bt, cx, cy, ease((age - 3.62) / 0.24), 0);
    else if (age >= 4.02) luLinkBlast(c, top, bt, cx, cy, 0, ease((age - 4.02) / 0.60));
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, age < 3.60 ? '41 / LIGHT THE SIGNAL' : '42 / LINK UP', N);
    c.put(c.w - 19, top, age < 3.60 ? 'HALO / IGNITION' : 'LINK / LOCKED', R);
    c.center(bt, age < 3.60 ? 'ONE FLAME / ONE SIGNAL' : 'BLOOD & FLAME / BOUND', B);
  }
  function lu_s7_tunnel(c, t, top, bt, elapsed) { luLinkSequence(c, t, top, bt, elapsed); }
  function lu_s7_link(c, t, top, bt, elapsed) { luLinkSequence(c, t, top, bt, 3.97 + elapsed); }

  // ===== 主歌二 step in 103.51–124.00 粒度细分：5 子场景 =====

  // 一点透视的赤色大殿：两列巨柱向灭点收拢，地面与天花各有一条收敛线和分节缝，
  // 尽头一道门缝透出红光。透视是 ASCII 里最稳的"大场面"画法——
  // 直线收敛天然读作纵深，而斜插的装饰线只会糊成一片纹理。
  // push 0→1 是镜头前推：所有横向尺寸同比放大，柱子从画面边缘挤出去。
  function luCrimsonHall(c, t, top, bt, push) {
    var vx = 60, vy = 15.5, k, f, xo, y0, y1, w, x, y, side, i;
    // 四角收敛线：天花与地面各两条，是纵深的第一层暗示
    for (side = -1; side <= 1; side += 2) {
      c.line(vx + side * 62, bt + 2, vx, vy, '·', G);
      c.line(vx + side * 62, top - 3, vx, vy, '·', G);
    }
    // 7 对柱子，由远及近（近的画在最后，压住远的）
    for (k = 6; k >= 1; k--) {
      f = (1 / (1 + k * 0.42)) * (1.28 + push * 0.55);
      xo = 5 + 55 * f;
      y0 = vy - 16 * f - 1;
      y1 = vy + 13 * f + 1.4;
      if (xo > 62) continue;                           // 已经挤出画面
      w = Math.max(1, Math.round(1 + 4.2 * f));
      for (side = -1; side <= 1; side += 2) {
        var px = Math.round(vx + side * xo);
        // 柱身：暗金实心（G）+ 亮边（N）。纯黑柱在纯黑背景上等于没画
        for (y = Math.round(y0); y <= Math.round(y1); y++)
          for (x = px; x < px + w * side; x += side)
            c.put(x, y, f > 0.55 ? '▓' : '░', f > 0.72 ? N : G);
        c.line(px, y0, px, y1, '│', N);
        c.line(px + w * side, y0, px + w * side, y1, '│', G);
        // 柱头与柱础：一层压扁的横块，柱子才有"站在地上"的重量
        // ⚠️ 字符必须取自 EXTRA，'▀' 不在图集里会整排渲染成 '?'
        c.line(px - side, Math.round(y0), px + w * side + side, Math.round(y0), '▄', N);
        c.line(px - side, Math.round(y1), px + w * side + side, Math.round(y1), '▄', N);
        // 拱廊横梁：左右柱头之间的横线，是"这是建筑"最省的一笔。
        // 每一层都画等宽的亮梁会变成百叶窗/梯子，所以只给最近的三层亮色，其余压暗。
        if (side < 0 && f > 0.34) {
          var lx = px, rx = Math.round(vx + xo) + w;
          for (var bx = lx; bx <= rx; bx++)
            c.put(bx, Math.round(y0), f > 0.62 ? '═' : '─', f > 0.62 ? N : G);
        }
        // 地面分节缝：每个深度一条，越近越亮
        for (x = Math.round(vx - xo); x <= Math.round(vx + xo); x++)
          if (x < px - side || x > px + w * side + side)
            c.put(x, Math.round(y1), '─', f > 0.6 ? G : D);
        // 柱间的挂链：从柱头往灭点方向垂一段，越远越短
        if (f < 0.8) for (var ch = 0; ch < 6; ch++) {
          var cu = ch / 6;
          c.put(px + side * (2 + cu * 8), y0 + 2 + Math.sin(cu * Math.PI) * 3.4 * f,
                ch % 2 ? 'o' : '·', ch % 2 ? G : N);
        }
      }
    }
    // 尽头的门缝：整幅画面唯一的高光，观众的视线落点
    var doorH = 7 + push * 2;
    for (y = Math.round(vy - doorH); y <= Math.round(vy + doorH); y++)
      for (x = -2; x <= 2; x++)
        c.put(vx + x, y, Math.abs(x) < 1 ? '█' : '▓', Math.abs(x) < 1 ? W : B);
    // 地面：近处大片暗场，靠稀疏磨石反光撑住，否则画面下半是一块纯黑
    for (y = 24; y < bt; y++)
      for (x = 0; x < c.w; x++) {
        var du = (y - 24) / Math.max(1, bt - 24);
        if (hash16(y * 733 + x * 197) % 100 < 12 + du * 16)
          c.put(x, y, du > 0.6 ? '.' : '·', Math.abs(x - 60) < 26 + du * 20 ? G : D);
      }
    // 门缝在磨石地面上的反光：一条竖直的碎光带，画面下半才不空
    for (y = Math.round(vy) + 2; y < bt; y++) {
      var fl = clamp01(1 - (y - vy) / (bt - vy));
      for (x = -3; x <= 3; x++)
        if (hash16(y * 401 + x * 89) % 100 < 26 + fl * 30)
          c.put(vx + x, y, fl > 0.55 ? '·' : '.', fl > 0.7 ? B : fl > 0.35 ? N : G);
    }
    for (i = 0; i < 26; i++) {                          // 门缝外溢的光
      var hs = hash16(i * 311 + 7), a = hs / 65535 * TAU;
      var d0 = 3 + (hs % 40) / 10, d1 = d0 + 5 + (hs % 30) / 6;
      for (var dd = d0; dd < d1; dd += 1.1)
        c.put(vx + Math.cos(a) * dd, vy + Math.sin(a) * dd / 2, '·', dd < d1 - 2 ? N : G);
    }
  }

  // 103.51–106.15 "It's time to step in they try but they can't win"：
  // 大殿纵深 + 缓慢前推 + 地面余烬。旧版是楔形箭头方阵，缩略图里读成"一堆尖括号"。
  function lu_s8_step(c, t, top, bt, elapsed) {
    var e = elapsed;
    function ease(v) { v = clamp01(v); return v * v * (3 - 2 * v); }
    var push = ease(e / 2.7);
    luParticles(c, t, top, bt, 26, 53, true, true);
    luCrimsonHall(c, t, top, bt, push);
    // 脚下震波：每 0.44s 一拍，贴着地面往外扩，跟"step in"的节拍同步
    var beat = mod(e / 0.44, 1);
    luRing(c, 60, bt - 1, 4 + beat * 26, beat < 0.35 ? '·' : '.', beat < 0.25 ? B : G, 2);
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '43 / STEP IN', N);
    c.put(c.w - 22, top, 'HALL / ONE WAY THROUGH', R);
    c.center(bt, e < 1.3 ? 'THEY TRY / THEY CANNOT WIN' : 'ONE WAY IN / NO WAY BACK', B);
  }

  // 106.15–110.21 "stay sharp like a weapon / they're not gonna stop us"：
  // 大殿被一记光刃横着切开。
  // 这一镜在"怎么画出刀刃"上耗了七版，结论是**方向字符画不出刀**：
  //   '╱' 一格只有一根细线，垂直平移一格只多一根平行细线 ⇒ 想加厚变排线（草/梳子），
  //   不加厚就断续（'—' 在 15° 斜线上会跳行成虚线）；挖空成黑刀是黑压黑看不见；
  //   六层等长残影在缩略图里是一排斜杠；扇形填点密度一到 78% 就成噪点。
  // 于是放弃"斜向的刀"，改画**横贯全屏的实心光带**：实心块没有字形问题，
  // 靠两端收尖 + 轻微倾斜 + 拍点上下扫，读成"一道斩击掠过画面"。
  function lu_s8_weapon(c, t, top, bt, elapsed) {
    var e = elapsed, x, dy;
    luParticles(c, t, top, bt, 20, 71, true, true);
    luCrimsonHall(c, t, top, bt, 1 + e * 0.09);
    var l = 3, r = c.w - 4;
    var u = mod(e / 0.95, 1);                         // 0.95s 从上压到底
    var g;
    for (g = 3; g >= 0; g--) {
      var ug = u - g * 0.030;                         // 三条极薄的回声跟着扫，才有"动"
      if (ug < 0) continue;
      var yc0 = top + 2 + (bt - top - 4) * ug;
      // 每次掠过的倾斜方向交替：一直同向的等速平移会被读成扫描线/进度条
      var tilt = (Math.floor(e / 0.95) % 2 ? -1 : 1) * 0.085;
      var lead = g === 0;
      for (x = l; x <= r; x++) {
        var tt = (x - l) / (r - l);
        var env = clamp01(Math.min(tt, 1 - tt) / 0.07);   // 只在最末 7% 收尖，中段等厚
        var yc = yc0 + (x - 60) * tilt;
        var hh = (lead ? 0.55 : 0.2) * env;
        for (dy = -3; dy <= 3; dy++) {
          var yy2 = yc + dy;
          if (yy2 < top + 1 || yy2 > bt - 1) continue;
          if (Math.abs(dy) <= hh) {
            if (lead) c.put(x, yy2, '█', env > 0.62 ? W : B);
            else if (hash16(x * 53 + g * 31) % 100 < 62) c.put(x, yy2, '▓', g === 1 ? N : G);
          } else if (lead && Math.abs(dy) <= hh + 1.05) {
            c.put(x, yy2, '▓', env > 0.5 ? B : N);    // 一格辉光，给白块收边
          }
        }
      }
      if (lead) {                                     // 两个刀尖各甩一簇火星
        var tipY = yc0 + ((x > 60 ? r : l) - 60) * tilt;
        for (var sp = 0; sp < 9; sp++) {
          var hs3 = hash16(sp * 313 + (e * 6 | 0) * 5);
          c.put(l + (hs3 % 6) - 2, tipY + (hs3 >> 4) % 5 - 2, sp % 3 ? '.' : '+', sp % 3 ? N : W);
          c.put(r - (hs3 % 6) + 2, tipY + (hs3 >> 7) % 5 - 2, sp % 3 ? '.' : '+', sp % 3 ? N : W);
        }
      }
    }
    // 每次拍点：地面震起一圈火星，斩击才有重音
    var beat = mod(e / 0.55, 1);
    if (beat < 0.5) luRing(c, 60, bt - 1, 6 + beat * 44, '·', beat < 0.2 ? B : G, 3);
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '44 / STAY SHARP', N);
    c.put(c.w - 22, top, 'EDGE / NEVER DULL', R);
    c.center(bt, e < 2 ? 'SHARP AS A WEAPON / NO ONE STOPS US' : 'NOTHING STOPS US / NOT ONE THING', B);
  }

  // 110.21–114.04 "One mind one heart we'll be fearless"：
  // 参考 MV 121–124s ＝ 隔着雾看山巅的城堡，天光从城堡背后打过来。
  // 调色板里没有近黑色，所以"剪影"只能靠**留黑**：先把城堡与山体 mask 掉，
  // 再把天光（径向光芒＋贴边辉光）铺在外面，城堡自然成为一个洞。
  // 辉光按"到剪影的距离"分档（chamfer 距离变换）：贴边最亮，往外逐档衰减。
  // ⚠️ 不分档的话光芒会糊满整片天空、城堡浮不起来（试过，读成一团噪点云）。
  var _luCastleMask = null, _luCastleDst = null;

  // 城堡在"城堡坐标"里的形状（u 0–120 横，v 0–40 竖，v 越大越靠下）
  // 山脊线（不含进剪影：地面只做暗纹，否则城堡和山会被同一圈亮边描成一个方盒）
  function luHillTop(u) { return 25 - 1.2 * Math.exp(-Math.pow((u - 60) / 26, 2)); }

  function luCastleShape(u, v) {
    var hill = luHillTop(u);
    if (v >= hill) return 0;                                   // 地面不算剪影
    if (u >= 30 && u <= 90 && v >= 21 && v < hill) {            // 城墙：落在山脊上的横带
      return 1;
    }
    if (u >= 50 && u <= 70 && v >= 14 && v < 21) {              // 中央主楼
      if (v < 15) return ((u | 0) % 3) < 2 ? 1 : 0;             // 垛口：二实一空
      return 1;
    }
    if (u >= 56 && u <= 64 && v >= 6 && v < 14) return 1;       // 主尖塔
    if (v === 5 && u >= 57 && u <= 63) return 1;
    if (v === 4 && u >= 58 && u <= 62) return 1;
    if (u >= 36 && u <= 45 && v >= 17 && v < 21) return 1;       // 左塔
    if (u >= 75 && u <= 84 && v >= 17 && v < 21) return 1;       // 右塔
    if (v === 16 && u >= 37 && u <= 44) return 1;
    if (v === 16 && u >= 76 && u <= 83) return 1;
    if (v === 15 && u >= 39 && u <= 42) return 1;
    if (v === 15 && u >= 78 && u <= 81) return 1;
    return 0;
  }

  function lu_s8_heart(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i, p;
    // ⚠️ 不能叫 N：N 是调色板常量（橙），局部 var N 会遮蔽它，
    // 于是 c.put(..., N) 传进去的是格子总数 ⇒ 取色越界直接抛异常（踩过）。
    var W2 = c.w, H2 = bt - top + 1, nPix = W2 * H2;
    if (!_luCastleMask || _luCastleMask.length < nPix) {
      _luCastleMask = new Uint8Array(nPix);
      _luCastleDst = new Uint16Array(nPix);
    }
    var mk = _luCastleMask, dst = _luCastleDst;
    var s = 1 + 0.26 * luEase(clamp01(e / 3.4));               // 缓推镜头
    var sInv = 1 / s;
    for (y = 0; y < H2; y++) {
      var v0 = 24 + (y + top - 24) * sInv;
      var vi = Math.floor(v0 + 0.5);
      for (x = 0; x < W2; x++) {
        mk[y * W2 + x] = luCastleShape(Math.floor(60 + (x - 60) * sInv + 0.5), vi);
      }
    }
    // 距离变换（两遍 chamfer，4 邻域）：dst=0 表示剪影本身
    var INF = 9999, best;
    for (i = 0; i < nPix; i++) dst[i] = mk[i] ? 0 : INF;
    for (y = 0; y < H2; y++) for (x = 0; x < W2; x++) {
      p = y * W2 + x;
      if (!dst[p]) continue;
      best = dst[p];
      if (x > 0 && dst[p - 1] + 1 < best) best = dst[p - 1] + 1;
      if (y > 0) {
        if (dst[p - W2] + 1 < best) best = dst[p - W2] + 1;
        if (x > 0 && dst[p - W2 - 1] + 1 < best) best = dst[p - W2 - 1] + 1;
        if (x < W2 - 1 && dst[p - W2 + 1] + 1 < best) best = dst[p - W2 + 1] + 1;
      }
      dst[p] = best;
    }
    for (y = H2 - 1; y >= 0; y--) for (x = W2 - 1; x >= 0; x--) {
      p = y * W2 + x;
      if (!dst[p]) continue;
      best = dst[p];
      if (x < W2 - 1 && dst[p + 1] + 1 < best) best = dst[p + 1] + 1;
      if (y < H2 - 1) {
        if (dst[p + W2] + 1 < best) best = dst[p + W2] + 1;
        if (x < W2 - 1 && dst[p + W2 + 1] + 1 < best) best = dst[p + W2 + 1] + 1;
        if (x > 0 && dst[p + W2 - 1] + 1 < best) best = dst[p + W2 - 1] + 1;
      }
      dst[p] = best;
    }
    // 天光：径向光芒（细楔）× 距离衰减，分档落色
    var spin = e * 0.10;
    for (y = 0; y < H2; y++) {
      var yy = y + top;
      var vv2 = 24 + (yy - 24) * sInv;
      for (x = 0; x < W2; x++) {
        p = y * W2 + x;
        var hv = luHillTop(60 + (x - 60) * sInv);
        if (vv2 >= hv && !mk[p]) {                     // 山体：只给暗纹，不描边
          if (vv2 - hv < 1.1) c.put(x, yy, '.', G);
          else if (hash16(x * 23 + yy * 31) % 100 < 15) c.put(x, yy, '.', K);
          continue;
        }
        if (mk[p]) {
          // 剪影内部垫一层极暗石纹：纯黑会和夜空糊成一片，宽塔身会被读成空心玻璃管
          // 上部楼体填得比城墙实：塔身 8 格宽、中段全黑的话会被读成两根竖天线
          var hs2 = hash16(x * 29 + yy * 47) % 100;
          var upper = vv2 < 16;
          var dense = upper ? 62 : 34;
          if (hs2 < dense) c.put(x, yy, upper ? '▒' : '░', K);
          else if (hs2 < dense + 12) c.put(x, yy, '·', G);
          continue;
        }
        var dd = dst[p];
        // ⚠️ 光芒不能用 cos(角度)^n 连续取值：格子分辨率上它必然混叠成一排排斜向
        // 条纹（看着像窗帘）。改成按角**分档**的实心楔形，边界虽然锯齿但就是光束。
        var ang = Math.atan2((yy - 24) * 0.5, x - 60);
        var wedge = Math.floor(((ang + Math.PI) / TAU) * 36 + spin * 1.6);
        var I = (mod(wedge, 2) === 0 ? 1.0 : 0.13) * Math.exp(-dd / 22);
        if (dd <= 1) {
          // 贴边一格用半格字符朝向剪影，边缘才不会糊成一条粗白带
          var mR = x < W2 - 1 && mk[p + 1], mL = x > 0 && mk[p - 1];
          var mD = y < H2 - 1 && mk[p + W2], mU = y > 0 && mk[p - W2];
          c.put(x, yy, mR ? '▐' : mL ? '▌' : mD ? '▄' : mU ? '▓' : '▓', B);
        } else if (dd <= 2) c.put(x, yy, '▓', N);
        else if (I > 0.50) c.put(x, yy, '▒', N);
        else if (I > 0.24) c.put(x, yy, '░', R);
        else if (I > 0.10) c.put(x, yy, '.', I > 0.16 ? N : G);
        else if (hash16(x * 71 + yy * 13) % 100 < 9) c.put(x, yy, '·', G);
      }
    }
    // 亮窗：剪影里唯一的"活气"，随机闪烁
    var wins = [[60, 9], [58, 18], [62, 18], [54, 16], [66, 16], [40, 19], [80, 19], [52, 17], [68, 17]];
    for (i = 0; i < wins.length; i++) {
      var wx = Math.round(60 + (wins[i][0] - 60) * s);
      var wy = Math.round(24 + (wins[i][1] - 24) * s);
      var fl = hash16(i * 37 + (e * 3 | 0)) % 100;
      if (fl < 72) c.put(wx, wy, '□', fl < 26 ? W : N);
    }
    // 雾带：横着缓慢漂移，压在剪影下缘
    for (i = 0; i < 4; i++) {
      var my = bt - 3 - i * 2;
      var off = mod(e * (2.2 + i * 0.7), 1) * 22;
      for (x = 2; x < c.w - 2; x++) {
        var mm = Math.sin((x + off) * 0.09 + i * 1.7) * 0.5 + 0.5;
        if (mm > 0.55 && hash16(x * 17 + i * 31 + (e * 2 | 0) * 7) % 100 < 58)
          c.put(x, my, i < 2 ? '░' : '·', i < 2 ? G : D);
      }
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '45 / ONE MIND', N);
    c.put(c.w - 24, top, 'ONE HEART / NO FEAR', R);
    c.center(bt, e < 2.1 ? 'ONE MIND ONE HEART / WE WILL BE FEARLESS'
                         : 'THE GATE IS THERE / IT ALWAYS WAS', B);
  }

  // 114.04–118.12 "Maybe it's a blessing even though I been cursed"：
  // 参考 MV 124.6–128.7s ＝ 黑场里几组被火光照亮的岩块／碑体特写，镜头之间硬切。
  // 不做"光环 vs 锁链"那种图解——那是把歌词画成说明图，不是画面。
  // 改成三组硬切：每 1.36s 换一次机位，岩块用多边形填充（luCoalFacet）＋三层套色
  // （暗红▓ → 橙▒ → 亮芯█），光色在金/红之间交替，对应"blessing 与 cursed"双重说法。
  function lu_s8_curse(c, t, top, bt, elapsed) {
    var e = elapsed;
    var shot = Math.floor(e / 1.36);                 // 0..2，第四节本就只剩三切
    var se = mod(e, 1.36);
    if (shot > 2) shot = 2;
    var warm = shot % 2 === 0;                       // 金 ↔ 红 交替
    var cOut = warm ? N : R, cMid = warm ? B : N, cHot = warm ? W : B;
    var sd = shot * 977 + 31;
    // 三层套色：外暗、内亮、芯最亮，并朝左上偏移 ⇒ 自带"从左上打光"的体积
    // ⚠️ sc 必须真的乘进半径：三层用同一半径时，最亮那层会盖住整块石头变白板（踩过）
    function rockPts(cx, cy, rad, sc, ay, dx, dy, seed) {
      var pts = [], i, a, rr;
      var n = 6;                                     // 六个顶点才有棱角，八个就圆成鹅卵石
      for (i = 0; i < n; i++) {
        a = i / n * TAU;
        rr = rad * sc * (0.55 + (hash16(seed * 17 + i * 29) % 100) / 100 * 0.66);
        pts.push([cx + Math.cos(a) * rr + dx, cy + Math.sin(a) * rr * ay / 2 + dy]);
      }
      return pts;
    }
    function inPoly(pts, x, y) {
      var hit = false, i, j;
      for (i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        var yi = pts[i][1], yj = pts[j][1];
        if ((yi > y) !== (yj > y) &&
            x < (pts[j][0] - pts[i][0]) * (y - yi) / (yj - yi) + pts[i][0]) hit = !hit;
      }
      return hit;
    }
    var LAYOUT = [
      [[80, 23, 30, 1.7], [24, 12, 10, 1.2]],
      [[36, 19, 18, 1.4], [88, 26, 23, 1.5]],
      [[60, 21, 8, 3.0], [22, 14, 11, 1.1], [100, 16, 12, 1.2], [44, 29, 10, 1.0]]
    ];
    var lay = LAYOUT[shot], k;
    for (k = 0; k < lay.length; k++) {
      var cx0 = lay[k][0], cy0 = lay[k][1], rad0 = lay[k][2], ay0 = lay[k][3];
      var outer = rockPts(cx0, cy0, rad0, 1.00, ay0, 0, 0, sd + k);
      luCoalFacet(c, outer, cOut, '▓');
      luCoalFacet(c, rockPts(cx0, cy0, rad0, 0.72, ay0, -1.4, -0.7, sd + k), cMid, '▒');
      luCoalFacet(c, rockPts(cx0, cy0, rad0, 0.22, ay0, -4.0, -2.0, sd + k), cHot, '█');
      // 受光边：黑底上不给轮廓，整块只是一个带纹理的色团，读不成"石头"
      var y0 = Math.floor(cy0 - rad0 * ay0 * 0.75), y1 = Math.ceil(cy0 + rad0 * ay0 * 0.75);
      var x0 = Math.floor(cx0 - rad0 * 1.3), x1 = Math.ceil(cx0 + rad0 * 1.3);
      for (var ry = Math.max(top + 1, y0); ry <= Math.min(bt - 1, y1); ry++) {
        for (var rx = Math.max(2, x0); rx <= Math.min(c.w - 3, x1); rx++) {
          if (!inPoly(outer, rx, ry)) continue;
          if (!inPoly(outer, rx, ry - 1)) c.put(rx, ry, '▄', cHot);
          else if (!inPoly(outer, rx - 1, ry)) c.put(rx, ry, '▐', cMid);
          else if (!inPoly(outer, rx + 1, ry)) c.put(rx, ry, '▌', cMid);
        }
      }
    }
    // 岩缝里落下的灰烬 + 升起的火星（每切一次重置，硬切感才干净）
    for (var em = 0; em < 34; em++) {
      var hs = hash16(em * 211 + shot * 53);
      var ex = 4 + hs % 112;
      var rise = mod(se * (0.5 + (hs >> 5) % 40 / 40 * 0.9) + hs / 65535, 1);
      var ey = bt - 2 - rise * (bt - top - 4);
      c.put(ex + Math.sin(se * 2 + hs) * 1.5, ey,
            em % 5 === 0 ? '+' : em % 3 ? '.' : '·', em % 5 === 0 ? cHot : em % 3 ? cMid : cOut);
    }
    for (var du = 0; du < 40; du++) {                 // 浮尘
      var hs2 = hash16(du * 91 + shot * 17);
      c.put(3 + hs2 % 114, top + 2 + (hs2 >> 4) % (bt - top - 4), '·', G);
    }
    // 每次硬切的第一拍留一帧几乎全黑：剪辑感靠"断"而不是靠渐隐
    if (se < 0.05) clearRect(c, 0, top + 1, c.w, bt - top - 1);
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '46 / BLESSING OR CURSE', N);
    c.put(c.w - 21, top, warm ? 'LIT / GOLD' : 'LIT / RED', warm ? B : R);
    c.center(bt, se < 0.7
      ? (warm ? 'A BLESSING / EVEN SO' : 'A CURSE / EVEN SO')
      : (warm ? 'WHAT BURNS ME / KEEPS ME' : 'WHAT BREAKS ME / MADE ME'), warm ? B : R);
  }

  // 118.12–124.00 "my life is yours / I can hear your pulse got you in my veins"：
  // 参考 MV 128.7–134.6s ＝ 红色雾气里的身影特写，镜头缓慢推近，火星在身前飘。
  // 这一镜交给人物本身：背景压到近黑，只留脚下余烬与上升火星，
  // 女王立绘从 40 格推到 70 格（脚被裁掉是有意的中近景），beat 一闪即红。
  function lu_s8_sword(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i;
    var push = luEase(clamp01(e / 5.2));
    var beat = mod(t * 1.35, 1), env = Math.exp(-beat * 4.5);
    // 脚下余烬：沿底边一条不规则火线，中间亮两侧暗
    for (x = 2; x < c.w - 2; x++) {
      var uu = Math.abs(x - 60) / 58;
      var hs0 = hash16(x * 37 + (e * 3 | 0));
      if (hs0 % 100 < 74 * (1 - uu * 0.72))
        c.put(x, bt - 1 - (hash16(x * 11) % 2), hs0 % 3 ? '░' : '▒', hs0 % 5 ? R : N);
    }
    // 上升火星
    for (i = 0; i < 52; i++) {
      var hs = hash16(i * 173 + 9);
      var rise = mod(e * (0.30 + (hs >> 5) % 40 / 40 * 0.75) + hs / 65535, 1);
      var px = 5 + hs % 110 + Math.sin(e * 1.6 + hs) * 2;
      var py = bt - 2 - rise * (bt - top - 4);
      c.put(px, py, i % 6 === 0 ? '+' : (i % 3 ? '.' : '·'),
            i % 6 === 0 ? B : (i % 3 ? N : R));
    }
    // 两条横向雾带，缓慢反向漂移
    for (i = 0; i < 2; i++) {
      var my = bt - 4 - i * 5;
      var off = mod(e * (1.6 + i * 0.9), 1) * 26 * (i ? -1 : 1);
      for (x = 4; x < c.w - 4; x++) {
        var mm = Math.sin((x + off) * 0.075 + i * 2.1) * 0.5 + 0.5;
        if (mm > 0.62 && hash16(x * 19 + i * 41 + (e * 2 | 0) * 9) % 100 < 52)
          c.put(x, my, '░', i ? G : R);
      }
    }
    // 人物：40 → 70 格缓推
    var w = 44 + push * 26;
    c.queen = { x: 60 - w / 2, y: 4.6, width: w, t: t, reveal: clamp01(e / 0.9) };
    // beat 的红色呼吸打在人物之前（在字符层，所以在她身后）
    if (env > 0.25) {
      for (y = top + 2; y < bt - 1; y++) for (x = 2; x < c.w - 2; x++) {
        var dx = (x - 60) * 0.5, dy = (y - 19);
        var dd = Math.sqrt(dx * dx + dy * dy);
        if (dd > 13 + env * 9) continue;
        if (hash16(x * 13 + y * 7 + (e * 8 | 0)) % 100 < 26 * env)
          c.put(x, y, '·', R);
      }
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '47 / MY LIFE IS YOURS', N);
    c.put(c.w - 20, top, 'PULSE / IN VEINS', R);
    // 不画底行字幕：人物推到 70 格时裙摆正好压在 bt 行，字幕会糊在她腿上（且下面已有歌词层）
  }

  // 124.00–135.87 这一段（MV 134.6–146.5s）在参考里是一条连续的下降镜头：
  // 炉口 → 巨型辐条门 → 推进门心烧成红核 → 拉远才看清是一台环状机械。
  // 四幕共用同一套"放射构造"，只是半径与热度不同，观众才读得出是同一个东西。

  // 外缘双环 + 辐条 + 辐条端节结。hot 决定它是石头还是烧红的铁。
  function luRadialRing(c, cx, cy, rx, spokes, spin, hot) {
    var i, k, rr, a, x, y, ry = rx * 0.52;
    for (i = 0; i < 460; i++) {
      a = i / 460 * TAU;
      // 石门的轮缘掺三分之一亮块：全用最暗档时，"石头"在暗场里读不出来
      c.put(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, '█',
            hot ? N : (i % 3 === 0 ? B : D));
      if (i % 2 === 0)
        c.put(cx + Math.cos(a) * rx * 0.87, cy + Math.sin(a) * rx * 0.87 * 0.52, '▓', hot ? G : K);
    }
    for (k = 0; k < spokes; k++) {
      a = k / spokes * TAU + spin;
      var dx = Math.cos(a), dy = Math.sin(a) * 0.52;
      for (rr = rx * 0.18; rr < rx * 0.87; rr += 0.45) {
        x = cx + dx * rr; y = cy + dy * rr;
        c.put(x, y, luDirChar(dx, dy), rr < rx * 0.28 ? (hot ? N : K) : (hot ? G : K));
      }
      c.put(cx + dx * rx * 0.94, cy + dy * rx * 0.94, '◆', hot ? B : D);
    }
  }

  // 124.00–126.03 "Forged in the same inferno"：石砌炉壁里的炉口，白热熔体在门内翻滚。
  function lu_s9_inferno(c, t, top, bt, elapsed) {
    var e = elapsed, x, y;
    var dx0 = 44, dx1 = 76, dy0 = top + 4, dy1 = bt - 3;
    // 炉壁：横向错缝的石砌，全部压到最暗
    for (y = top + 1; y < bt - 1; y++) {
      var mo = (y & 1) ? 0 : 3;
      for (x = 2; x < c.w - 3; x++) {
        if ((x + mo) % 7 === 0) c.put(x, y, '│', K);
        else if ((x + mo) % 7 === 4 && y % 4 === 0) c.put(x, y, '─', K);
        else if (hash16(x * 31 + y * 17) % 100 < 24) c.put(x, y, '░', K);
      }
    }
    // 炉口：下亮上暗的熔体，亮斑上下翻滚
    for (y = dy0; y <= dy1; y++) {
      var u = (y - dy0) / (dy1 - dy0);
      for (x = dx0; x <= dx1; x++) {
        var fl = 0.72 + 0.28 * Math.sin(t * 8.5 + x * 0.62 + y * 1.5);
        var I = (0.52 + u * 0.60) * fl;      // 熔体是池子：底部最亮，往上才渐冷
        if (I > 0.80) c.put(x, y, '█', W);
        else if (I > 0.58) c.put(x, y, '▓', B);
        else if (I > 0.34) c.put(x, y, '▒', N);
        else c.put(x, y, '░', R);
      }
    }
    // 门框与铆钉
    for (y = dy0 - 1; y <= dy1 + 1; y++) {
      c.put(dx0 - 1, y, '█', D); c.put(dx1 + 1, y, '█', D);
    }
    for (x = dx0 - 1; x <= dx1 + 1; x++) {
      c.put(x, dy0 - 1, '█', D); c.put(x, dy1 + 1, '█', D);
    }
    for (y = dy0; y <= dy1; y += 3) { c.put(dx0 - 1, y, '◆', N); c.put(dx1 + 1, y, '◆', N); }
    // 溅出的火星与上方的烟
    for (var sp = 0; sp < 24; sp++) {
      var hs = hash16(sp * 173 + (e * 5 | 0) * 3);
      var u2 = mod(e * (0.5 + (hs >> 5) % 30 / 30) + hs / 65535, 1);
      c.put(dx0 + 2 + hs % 28 + (hs % 5 - 2) * u2, dy1 - u2 * (bt - top) * 0.6,
            sp % 4 ? '.' : '+', sp % 4 ? N : W);
    }
    for (var sm = 0; sm < 16; sm++) {
      var hs2 = hash16(sm * 97 + 5);
      var sy = dy0 - 1 - mod(e * 0.5 + hs2 / 65535, 1) * 4;
      c.put(dx0 - 2 + hs2 % 36, sy, '·', G);
    }
    // 收尾：上下各推一块黑幕进来，炉口被"关上"
    if (e > 1.78) {
      var k = clamp01((e - 1.78) / 0.25);
      var cut = Math.round((bt - top - 2) * k * 0.5);
      clearRect(c, 0, top, c.w, cut);
      clearRect(c, 0, bt - cut, c.w, cut + 1);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '48 / THE SAME INFERNO', N);
    c.put(c.w - 20, top, '1200 C / OPEN', R);
    c.center(bt, e < 1.1 ? 'FORGED IN THE SAME FIRE' : 'THE SAME INFERNO / MADE US', B);
  }

  // 126.03–128.24 "Mold me into your own"：巨型辐条门，门前一排人形给出尺度
  function lu_s9_mold(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i;
    var cy = (top + bt) / 2 + 1;
    var push = 1 + luEase(clamp01(e / 2.21)) * 0.16;
    var rx = 36 * push;
    luRadialRing(c, 60, cy, rx, 16, t * 0.05, false);
    // 门板：两道同心弧之间的石砌
    for (i = 0; i < 2; i++) {
      var rr = rx * (0.62 + i * 0.13);
      for (var a2 = 0; a2 < TAU; a2 += 0.006) {
        if (hash16((a2 * 100) | 0) % 100 < 40)
          c.put(60 + Math.cos(a2) * rr, cy + Math.sin(a2) * rr * 0.52, '░', K);
      }
    }
    // 中央凸台：还没烧起来，只是一块暗的圆
    for (y = cy - rx * 0.2; y <= cy + rx * 0.2; y++)
      for (x = 60 - rx * 0.4; x <= 60 + rx * 0.4; x++) {
        var dx2 = (x - 60) / (rx * 0.4), dy2 = (y - cy) / (rx * 0.21);
        if (dx2 * dx2 + dy2 * dy2 > 1) continue;
        c.put(x, y, hash16(x * 13 + y * 7) % 100 < 55 ? '▒' : '·', K);
      }
    // 门槛与地面
    for (x = 4; x < c.w - 4; x++) c.put(x, bt - 2, '▄', K);
    // 门前的人：三格宽的剪影就够读，一排人比一个人更像"人群"
    for (i = 0; i < 7; i++) {
      var hx = 12 + i * 16 + (hash16(i * 71) % 5) - 2;
      var hh = 4 + hash16(i * 37) % 2;
      for (y = bt - 3; y > bt - 3 - hh; y--) {
        var w2 = y > bt - 3 - hh + 1 ? 1 : 2;
        for (x = hx - w2; x <= hx + w2; x++) c.put(x, y, '█', K);
      }
      c.put(hx, bt - 3 - hh, '░', K);
    }
    luParticles(c, t, top, bt, 12, 41, true, false);
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '49 / MOLD ME', N);
    c.put(c.w - 22, top, 'THE GATE / SEALED', R);
    c.center(bt, e < 1.1 ? 'MOLD ME INTO YOUR OWN SHAPE' : 'NO SHAPE OF MY OWN LEFT', B);
  }

  // 128.24–131.93 "battle scars but beating heart"：镜头已经进到门心，熔核随拍搏动
  function lu_s9_scars(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i;
    var cy = (top + bt) / 2 + 1;
    var beat = mod(t * 1.55, 1), env = Math.exp(-beat * 4.5);
    var rx = 62 + env * 5;
    luRadialRing(c, 60, cy, rx, 16, t * 0.03, true);
    // 核心：白热圆核，外边一圈橙壳，搏动时互相胀缩
    var rCore = 7.5 + env * 3.2;
    for (y = cy - rCore; y <= cy + rCore; y++)
      for (x = 60 - rCore * 2; x <= 60 + rCore * 2; x++) {
        var u = Math.sqrt(Math.pow((x - 60) / (rCore * 2), 2) + Math.pow((y - cy) / rCore, 2));
        if (u > 1) continue;
        if (u < 0.34) c.put(x, y, '█', W);
        else if (u < 0.62) c.put(x, y, '▓', B);
        else c.put(x, y, '▒', env > 0.4 ? N : R);
      }
    // 裂纹：从核向外放射的短折线，beat 时更亮
    for (i = 0; i < 14; i++) {
      var a = i / 14 * TAU + 0.2;
      var len = 10 + (hash16(i * 53) % 12);
      for (var rr = rCore + 2; rr < rCore + len; rr += 1) {
        var wob = Math.sin(rr * 0.6 + i) * 0.6;
        var px = 60 + Math.cos(a) * rr + wob, py = cy + Math.sin(a) * rr * 0.52 + wob;
        if (hash16((rr * 7) | 0 + i) % 100 < 70)
          c.put(px, py, rr < rCore + 5 ? '─' : '·', rr < rCore + 5 ? (env > 0.3 ? B : N) : G);
      }
    }
    for (var sp = 0; sp < 30; sp++) {
      var hs = hash16(sp * 211 + (e * 4 | 0) * 7);
      var u2 = mod(e * (0.4 + (hs >> 5) % 30 / 30 * 0.7) + hs / 65535, 1);
      var ang = hs % 628 / 100;
      c.put(60 + Math.cos(ang) * (12 + u2 * 44), cy + Math.sin(ang) * (12 + u2 * 44) * 0.52,
            sp % 4 ? '.' : '+', sp % 4 ? N : W);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '50 / SCARS AND A HEART', N);
    c.put(c.w - 20, top, 'STILL BEATING', R);
    c.center(bt, e < 1.7 ? 'BATTLE SCARS / BUT A BEATING HEART' : 'BLEED / AND BE WITH YOU', B);
  }

  // 131.93–135.87 "strong shield don't yield"：拉远，看清这是一台环状机座，外圈带尖刺
  function lu_s9_shield(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i;
    var cy = (top + bt) / 2 + 1;
    var pull = luEase(clamp01(e / 3.6));
    var rx = 20 + pull * 15;                         // 拉远：机座越看越大
    luRadialRing(c, 60, cy, rx, 24, t * 0.04, true);
    // 外圈尖刺：一圈向外的短刃，逆着转
    for (i = 0; i < 24; i++) {
      var a = i / 24 * TAU - t * 0.04;
      for (var rr = rx * 1.02; rr < rx * 1.16; rr += 0.4)
        c.put(60 + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.52,
              luDirChar(Math.cos(a), Math.sin(a) * 0.52), rr > rx * 1.1 ? B : N);
    }
    // 红核（与前一幕同源，只是小了）
    var rCore = 3.4 + Math.exp(-mod(t * 1.55, 1) * 4.5) * 1.6;
    for (y = cy - rCore; y <= cy + rCore; y++)
      for (x = 60 - rCore * 2; x <= 60 + rCore * 2; x++) {
        var u = Math.sqrt(Math.pow((x - 60) / (rCore * 2), 2) + Math.pow((y - cy) / rCore, 2));
        if (u > 1) continue;
        c.put(x, y, u < 0.45 ? '█' : '▓', u < 0.45 ? W : B);
      }
    // 机座的支撑臂：从环底伸向画面两侧，把它压在场景里
    for (i = 0; i < 2; i++) {
      var sg = i ? 1 : -1;
      for (var k2 = 0; k2 < 40; k2++) {
        var px = 60 + sg * (rx * 0.5 + k2 * 0.9), py = cy + rx * 0.30 + k2 * 0.16;
        if (px < 2 || px > c.w - 3) break;
        c.put(px, py, '─', K);
        c.put(px, py + 1, '·', G);
      }
    }
    for (var sp = 0; sp < 26; sp++) {
      var hs = hash16(sp * 157 + (e * 4 | 0) * 5);
      var u2 = mod(e * (0.4 + (hs >> 5) % 30 / 30 * 0.6) + hs / 65535, 1);
      c.put(4 + hs % 112, bt - 2 - u2 * (bt - top - 5), sp % 4 ? '.' : '+', sp % 4 ? N : W);
    }
    clearRect(c, 0, top, c.w, 1); clearRect(c, 0, bt, c.w, 1);
    c.put(3, top, '51 / STRONG SHIELD', N);
    c.put(c.w - 18, top, 'NEVER YIELD', R);
    c.center(bt, e < 2 ? 'A SHIELD THAT WILL NOT YIELD' : 'HOLD THE LINE / HOLD IT', B);
  }

  // ===== 导歌二回闪 135.87–152.18 粒度细分：2 子场景 =====

  // 135.87–143.12 "You're there in my dreams that I've dreamt"：
  // 二回闪第一幕。参考 MV 149–156s ＝ 暗场里出现的另一个身影，镜头几乎不动，
  // 只有光在飘——"梦里见到的那个人"本来就该是静的。
  // 这里放用户给的第二张 ANSI 角色（洛克茜·女仆装）：与女王持镰的剪影作对照，
  // 读成同一个人被梦照出来的另一面。
  // 尺寸账：贴图 84×140，可用 27 行 ⇒ 全身最多约 32 格宽（6.9px/格）。
  // 再大就必须裁腿；本镜要"完整的人"，所以取全身，靠魔法阵托住脚下。
  function lu_s10_dreamt(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i;
    var cx = 60, gy = bt - 1.2;
    // 7.25 秒只靠人物"静立"会闷：后 3 秒把雾从暗金推成暗红（"梦里见到的人"开始不对劲），
    // 光尘也上冲得快一点。立绘本身不推镜——vis 一变就要重建贴图缓存，逐帧重建会掉帧。
    var mood = clamp01((e - 4.2) / 2.4);
    for (i = 0; i < 3; i++) {
      var my = top + 5 + i * 8;
      var off = mod(e * (1.0 + i * 0.65), 1) * 70 * (i % 2 ? -1 : 1);
      for (x = 3; x < c.w - 3; x++) {
        var mm = Math.sin((x + off) * 0.055 + i * 2.3) * 0.5 + 0.5;
        if (mm > 0.58 - mood * 0.12 && hash16(x * 17 + i * 43 + (e * 3 | 0) * 5) % 100 < 32)
          c.put(x, my + Math.sin(x * 0.09 + i * 1.7) * 1.4, '·',
                (i % 2 === 0 && mood > 0.35) ? R : (i === 1 ? K : G));
      }
    }
    // 后段：人物背后的暗红光晕，越到后面越实（画在字符层，立绘会压在上面）
    if (mood > 0) {
      for (i = 0; i < 46; i++) {
        var hs3 = hash16(i * 271 + 13);
        var a5 = (hs3 % 628) / 100, r5 = 12 + ((hs3 >> 5) % 40) / 40 * 16;
        if (hash16(i * 7 + (e * 4 | 0)) % 100 < 70 * mood)
          c.put(cx + Math.cos(a5) * r5, 19 + Math.sin(a5) * r5 * 0.55, '·', R);
      }
    }
    // 上升的光尘（少量、极淡：这镜里唯一的高光应该是人，不是背景）
    for (i = 0; i < 30; i++) {
      var hs = hash16(i * 197 + 11);
      var rise = mod(e * (0.18 + (hs >> 5) % 40 / 40 * 0.42) + hs / 65535, 1);
      c.put(60 + ((hs % 116) - 58) * (0.55 + rise * 0.7), gy - 2 - rise * (gy - top - 3),
            i % 9 === 0 ? '+' : '·', i % 9 === 0 ? N : G);
    }
    // 地面一律不画：立绘裁在膝盖以下、下缘还在渐隐，任何"脚下的圈"都会变成
    // 一堆悬空的散点（前两版都是这么废的）。地面感交给渐隐本身。
    // 唯一的地面暗示：光尘越靠下越密，暗示有地面在那里把光反射上来。
    for (i = 0; i < 26; i++) {
      var hs2 = hash16(i * 313 + 29);
      var lv = (hs2 % 100) / 100;
      c.put(cx + ((hs2 >> 7) % 96 - 48) * (0.4 + lv * 0.8),
            gy - 0.5 - lv * lv * (gy - top - 2), '·', i % 4 ? K : G);
    }
    // 不给"地面反光"：立绘裁到膝盖以下，脚下没有实体，一片散点只会读成噪点。
    // 地面感交给脚下那圈光圈和渐隐本身。
    // 人物：宽到一定程度就必须裁腿，否则头会顶出画面 —— 那时把头顶钉在 top 上
    var RW = window.__ROXY_W || 36;
    var rh = 140 * (RW * 18 / 84) / 36;               // 换算成字符行数
    var avail = gy - top - 0.8;
    var vis = Math.min(1, avail / rh);                // 贴图能看到多少
    var yHead = vis < 0.999 ? top + 1.3 : gy - rh + 0.5;
    c.roxy = { x: cx - RW / 2, y: yHead, width: RW, t: t, anchor: 'foot',
               vis: vis, reveal: clamp01(e / 1.3) };
    clearRect(c, 0, top, c.w, 1);
    c.put(3, top, '52 / IN MY DREAMS', N);
    c.put(c.w - 20, top, 'SHE IS THERE', R);
  }

  // 143.12–152.18 "It's just you & me in the end"：
  // 参考 MV 153.7–162.8 是三拍特写：红黑流体内部 → 一柄斜插的刀刃 → 被红环围住的核。
  // 旧稿用 luRibbon 铺了六条丝带，到格子上全变成等距短横线，整屏读成静电噪点（已废弃）。
  // ⚠️ 调色板里**没有暗红**：这里的"暗红"靠**密度**做——稀疏的 R 点视觉上就是暗红，
  // 只有密集叠加才跳成亮红。全文只有三样东西：一块团块、一把刀、一颗核。
  function lu_s10_meet(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i;
    var cx = 60, cy = (top + bt) / 2 + 1;
    var beat = mod(t * 1.35, 1), env = Math.exp(-beat * 4.2);
    var toBlade = clamp01((e - 3.55) / 0.45);
    var toCore = clamp01((e - 6.15) / 0.55);
    var fadeA = 1 - toBlade;

    // 底噪：极稀疏的暗红浮尘。⚠️ 不要用横线铺底噪，横线在缩略图里就是扫描线
    for (i = 0; i < 90; i++) {
      var hs = hash16(i * 157 + 23);
      if (hash16(i * 13 + (e * 3 | 0) * 7) % 100 < 52)
        c.put(3 + (hs % 114), top + 3 + ((hs >> 5) % (bt - top - 6)),
              '·', i % 4 ? R : G);
    }
    // 全屏组织底纹：没有它，黑底占七成，三样东西全浮在空中（第一版像三个图标）。
    // 密度必须低（约 20%）且**只用最暗档**，否则会和前景的血管连成一片沙。
    for (y = top + 2; y <= bt - 2; y++) {
      for (x = 3; x < c.w - 3; x++) {
        // ⚠️ 底纹不能只用 K（#5f5f00 暗橄榄）：整屏会读成黄绿色噪点，不是血色。
        // 主体给 R，K 只做更暗的一层，两层叠出"组织"的厚度。
        var hb = hash16(x * 43 + y * 91 + (e * 2 | 0) * 5) % 100;
        if (hb < 16) c.put(x, y, '·', R);
        else if (hb < 24) c.put(x, y, '.', K);
        else if (hb < 29) c.put(x, y, '░', K);
      }
    }

    // ── 一、血肉组织：六条粗血管从画面边缘蜿蜒汇入中心的核
    // ⚠️ 均匀铺满的暗红点 = 一层沙（前两版），必须给出**结构**。
    // ⚠️ 粗线只能用块字符**相邻列并排**：一格方向字符只有一根细线，
    //    并排 `▓` 中心 + 两侧 `▒` 才读得成一根粗管。
    if (fadeA > 0.01) {
      for (var v = 0; v < 6; v++) {
        var aEnd = v / 6 * TAU + 0.42 + Math.sin(e * 0.22 + v) * 0.09;
        var p0x = cx + Math.cos(aEnd) * 64, p0y = cy + Math.sin(aEnd) * 19;
        var steps = 150;
        for (var st = 0; st < steps; st++) {
          var uu = st / (steps - 1);                    // 0 = 画面边缘，1 = 中心
          if (uu > fadeA) break;                        // 转刀时血管从边缘缩回
          var wob = Math.sin(uu * 6.5 + v * 2.1 + e * 0.7) * (1 - uu * 0.55) * 6;
          var vx = p0x + (cx - p0x) * uu - Math.sin(aEnd) * wob;
          var vy = p0y + (cy - p0y) * uu + Math.cos(aEnd) * wob * 0.5;
          // ⚠️ **宽度不能沿半径渐变**：1 格宽时整段是橙、3 格宽时是"红-橙-红"，
          // 沿线交替就成了串珠（试过两版）。宽度固定 3 格，粗细的变化交给
          // 靠中心处的额外加宽，中间那列始终实心，线才连得住。
          for (var w = -2; w <= 2; w++) {
            var wd = Math.abs(w) < 0.55 ? 9 : (uu > 0.62 ? 1.2 : 0.9);
            if (Math.abs(w) > wd) continue;
            var mid = Math.abs(w) < 0.55;
            if (!mid && hash16(((st * 7) | 0) + v * 31) % 100 < 26) continue;
            c.put(vx + w, vy, mid ? '▓' : '▒',
                  mid ? (uu > 0.55 ? B : N) : R);
          }
        }
      }
      // 组织：血管之间极稀的暗红点。密度必须低，铺满就是沙
      for (i = 0; i < 150; i++) {
        var hs3 = hash16(i * 211 + 17);
        if (hash16(i * 29 + (e * 3 | 0) * 11) % 100 < 42 * fadeA)
          c.put(4 + (hs3 % 112), top + 3 + ((hs3 >> 6) % (bt - top - 6)), '·', i % 3 ? R : G);
      }
      // 核：环 + 瞳孔。⚠️ 半径 3 行以下的实心圆会离散成方块（踩过），所以是壳不是块
      var rc0 = 4.6 + env * 1.8;
      for (y = cy - rc0; y <= cy + rc0; y++)
        for (x = cx - rc0 * 2; x <= cx + rc0 * 2; x++) {
          var ux0 = (x - cx) / (rc0 * 2), uy0 = (y - cy) / rc0;
          var uu0 = Math.sqrt(ux0 * ux0 + uy0 * uy0);
          if (uu0 > 1) continue;
          if (uu0 < 0.26) c.put(x, y, '█', env > 0.45 ? W : B);
          else if (uu0 < 0.55) c.put(x, y, '▓', N);
          else if (uu0 < 0.82) c.put(x, y, '▒', R);
          else if (hash16(x * 17 + y * 29) % 100 < 55) c.put(x, y, '░', R);
        }
    }

    // ── 二、斜插的刀：横贯全屏的实心带。
    // ⚠️ 方向字符（╱）一格只有一根细线，加厚必然退化成排线（106s 那条教训，七版之后才认）。
    if (toBlade > 0.01 && toCore < 0.98) {
      var kb = toBlade * (1 - toCore * 0.55);
      // ⚠️ 斜线不能用"逐 x 扫描、每列算一个 y"来画：宽度 1 时相邻两列的 y 会
      // 整格跳开，缩略图里就是一条断续的链（试了三版）。改成**到直线的距离场**，
      // 每个格子独立判断，斜线自然被完全覆盖，不存在断口。
      var x0 = 13, x1 = c.w - 12;
      // 轻微漂移：完全静止的一条亮带在 2.5 秒里读成"道具"，跟着节奏上下浮一点才像刀
      var drift = Math.sin(e * 1.15) * 2.2;
      var y0 = top + 3 + drift, y1 = bt - 4 + drift;
      var dxs = x1 - x0, dys = y1 - y0, ln = Math.sqrt(dxs * dxs + dys * dys);
      var nx = -dys / ln, ny = dxs / ln;               // 法线
      for (x = x0; x <= x1; x++) {
        var tt0 = (x - x0) / dxs;
        var yc0 = y0 + tt0 * dys;
        if (hash16(x * 37 + (e * 9 | 0)) % 100 < 30 * kb)   // 火星：先画，且落在刃外
          c.put(x, yc0 + (hash16(x * 11) % 2 ? -2.0 : 2.0), '·', N);
      }
      for (y = top + 2; y <= bt - 2; y++) {
        for (x = x0; x <= x1; x++) {
          var dist = (x - x0) * nx + (y - y0) * ny;
          var tAx = ((x - x0) * dxs + (y - y0) * dys) / (ln * ln);   // 沿轴位置 0..1
          if (tAx < 0 || tAx > 1) continue;
          var tip = Math.min(1, Math.min(tAx, 1 - tAx) * 9);        // 两端 11% 收尖
          var hh = 1.05 * tip;
          var ad = Math.abs(dist);
          if (ad > hh) continue;
          c.put(x, y, '█', ad < hh * 0.42 ? (tip > 0.75 ? W : B) : B);
        }
      }
    }

    // ── 三、被红环围住的核：外两道细环 + 球体 + 两道支架
    // ⚠️ 球不能按"同心圆分档"填：半径 3~6 行时那几档直接离散成同心方框，
    // 读出来是一块带花纹的黄方块（第一版）。改成算**球面法线 + 左上点光源**，
    // 体积来自高光位置而不是亮度；底部暗到留黑，球才从黑里鼓出来。
    if (toCore > 0.01) {
      var kc = toCore;
      var rc = (5.0 + env * 1.6) * kc;
      for (i = 0; i < 2; i++) {                                // 环：一正一反转
        var rr3 = (11 + i * 5) * kc;
        var spin3 = i ? -e * 0.5 : e * 0.35;
        for (var q2 = 0; q2 < 160; q2++) {
          var a3 = q2 / 160 * TAU + spin3;
          if (i === 1 && q2 % 3 === 0) continue;               // 外环断续，才像转动的机械环
          c.put(cx + Math.cos(a3) * rr3, cy + Math.sin(a3) * rr3 * 0.5, '·', i ? G : R);
        }
      }
      // ⚠️ 光源不能正对观众：LZ=0.73 时整个前半球都被照亮，球心 shade 就有 0.73，
      // 无论怎么调色阶都是一颗"金蛋"。把光压到左上侧、LZ 降到 0.45，
      // 只留左侧一条亮，右下半才有暗部——球才立起来。
      var LX = -0.62, LY = -0.64, LZ = 0.45;
      for (y = cy - rc; y <= cy + rc; y++) {
        for (x = cx - rc * 2; x <= cx + rc * 2; x++) {
          var ux = (x - cx) / (rc * 2), uy = (y - cy) / rc;
          var u2 = Math.sqrt(ux * ux + uy * uy);
          if (u2 > 1) continue;
          var nz = Math.sqrt(Math.max(0, 1 - u2 * u2));
          var shade = ux * LX + uy * LY + nz * LZ;
          // ⚠️ 高档位不能用 B（#ffd75f 是黄）：B 的 `▓` 连成片就是一块金砖，
          // 整颗球读成一个金色的蛋（踩过）。B 只留给高光那一小块，其余走 N/R。
          // ⚠️ 最暗那档也要**填满**：留空的话球的下半会整块消失，
          // 形状就不再由半径决定，读成一个"上半个方块"（踩过）。
          if (u2 > 0.94) c.put(x, y, '▒', shade > 0.3 ? N : R);   // 轮廓：连续一圈
          else if (shade > 0.94) c.put(x, y, '█', env > 0.55 ? W : B);
          else if (shade > 0.88) c.put(x, y, '▓', B);
          else if (shade > 0.80) c.put(x, y, '▓', N);
          else if (shade > 0.46) c.put(x, y, '▒', R);
          else c.put(x, y, '░', R);
        }
      }
      // 不给支架：横杆穿过球心高度时，整颗球会被读成"穿在棍子上"（参考帧里
      // 那个球也是悬在红环中央、没有支撑）。空间关系交给两道环交代。
    }

    clearRect(c, 0, top, c.w, 1);
    c.put(3, top, '53 / JUST YOU AND ME', N);
    c.put(c.w - 19, top, toCore > 0.5 ? 'IN THE END' : (toBlade > 0.5 ? 'EDGE ONLY' : 'BLOOD HEAT'), R);
  }

  // ===== 血与火·纹章 152.18–159.93 粒度细分：2 子场景 =====

  // 152.18–156.09 "Bound by blood and flames we are shatterproof"：
  // 参考 MV 162.8–166.7 ＝ 女王半身特写，背后是一圈燃烧的红色涡流。
  // 旧稿是"火焰墙 + 一个 3D 立方体 + SIGIL.SYS 日志"，立方体完全读不出含义。
  // 这里给到 78 格宽（裁到裙摆上沿，脸约占 8 行，终于有细节），
  // 背后不是立方体而是一圈**燃烧的符文环**——"血与火"的印记。
  function lu_s11_sigil(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i;
    var cx = 60, cy = (top + bt) / 2 + 2;
    var push = 1 + luEase(clamp01(e / 3.9)) * 0.10;
    var beat = mod(t * 1.5, 1), env = Math.exp(-beat * 4.0);

    // 底：暗红涡流（与下一幕的螺旋同源，只是这里压到很暗，做背景）
    for (y = top + 1; y < bt; y++) {
      for (x = 2; x < c.w - 2; x++) {
        var dx = (x - cx) / 2.4, dy = y - cy;
        var rr = Math.sqrt(dx * dx + dy * dy);
        var th = Math.atan2(dy, dx);
        var ph = th * 3 + rr * 0.30 - t * 1.1;
        var I = Math.pow(0.5 + 0.5 * Math.sin(ph), 3.0) * Math.exp(-rr / 15);
        if (I > 0.24) c.put(x, y, '░', R);
        else if (I > 0.08) c.put(x, y, '·', R);
      }
    }
    // 符文环：两道同心环 + 30 根辐条，整圈缓慢反转，beat 时整体胀一下
    var R1 = (30 + push * 2) * (1 + env * 0.03);
    for (i = 0; i < 300; i++) {
      var a1 = i / 300 * TAU - e * 0.16;
      c.put(cx + Math.cos(a1) * R1, cy + Math.sin(a1) * R1 * 0.5, '—', i % 6 ? R : N);
    }
    for (i = 0; i < 220; i++) {
      var a2 = i / 220 * TAU + e * 0.22;
      c.put(cx + Math.cos(a2) * R1 * 0.72, cy + Math.sin(a2) * R1 * 0.72 * 0.5, '·', i % 4 ? N : B);
    }
    for (i = 0; i < 30; i++) {
      var a3 = i / 30 * TAU + e * 0.07;
      for (var r3 = R1 * 0.78; r3 < R1 * 0.98; r3 += 1.1)
        c.put(cx + Math.cos(a3) * r3, cy + Math.sin(a3) * r3 * 0.5,
              luDirChar(Math.cos(a3), Math.sin(a3) * 0.5), r3 > R1 * 0.93 ? B : N);
    }
    // 人物：78 格宽，从右侧三分线往里站，左侧留出光环与火
    c.queen = { x: 78 - 39, y: 4.2, width: 78 * push, t: t, reveal: clamp01(e / 0.85) };
    // 底部火线
    for (x = 2; x < c.w - 2; x++) {
      var hu = Math.abs(x - 60) / 58;
      if (hash16(x * 37 + (e * 6 | 0)) % 100 < 80 * (1 - hu * 0.45))
        c.put(x, bt - 1, hash16(x * 13) % 3 ? '░' : '▒', hash16(x * 7) % 4 ? R : N);
    }
    clearRect(c, 0, top, c.w, 1);
  }

  // 156.09–159.93 "I call out your name and you know the truth"：
  // 参考 MV 166.7–170.5 ＝ 整屏的红色螺旋（万花筒式的涡流）。
  // 螺旋用**极坐标场**算，不是"画一条螺线"：逐点算 (r,θ) 再取 sin 相位，
  // 每个格子独立判定，不存在跳格，而且天然铺满整屏。
  function lu_s11_call(c, t, top, bt, elapsed) {
    var e = elapsed, x, y;
    var cx = 60, cy = (top + bt) / 2 + 1;
    var spin = e * 1.35;
    var beat = mod(t * 1.5, 1), env = Math.exp(-beat * 4.0);
    // ⚠️ 臂数决定亮脊的**横向宽度**：3 臂时一个相位周期在 r=20 处跨 40 格，
    // 亮脊就有 10 格宽，读成一条金蛇。5 臂 + 径向相位加快才收成细密的涡纹。
    var arms = 5 + (e > 2.1 ? 1 : 0);
    for (y = top + 1; y < bt; y++) {
      for (x = 2; x < c.w - 2; x++) {
        var dx = (x - cx) / 2.3, dy = y - cy;
        var rr = Math.sqrt(dx * dx + dy * dy);
        var th = Math.atan2(dy, dx);
        var ph = th * arms + rr * 0.62 - spin;
        // ⚠️ 指数决定亮脊厚度：3.2 时亮带 5~6 格宽，读成"一条金色的蛇"；
        // 抬到 5.6 才收成 2 格左右的脊线，剩下全是红。
        var I = Math.pow(0.5 + 0.5 * Math.sin(ph), 5.6) * Math.exp(-rr / 23);
        I *= 1 + env * 0.35;
        if (rr < 2.0) { c.put(x, y, '█', env > 0.35 ? W : B); continue; }
        // ⚠️ 高档位占比一大，整屏就从"红螺旋"变成"黄棕螺旋"（第一版）。
        // 红档负责面积、橙黄只做最高那条亮脊，颜色才对得上参考帧。
        // ⚠️ 症结不在面积而在**视觉亮度**：N（#ffaf5f）的中密度块比 R（#ff5f5f）
        // 亮得多，所以哪怕红色面积更大，整屏看上去还是黄的。
        // 正解是主体只用 R 一档到底、靠字符密度分亮暗，N/B 只留过曝那一条脊。
        // ⚠️ 过曝脊必须用实心块：`▓` 的 75% 图案叠在黑底上会混成暗黄褐，
        // 一放大就是一条"橄榄绿"的带（vision 都读成绿色）。
        if (I > 0.62) c.put(x, y, '█', B);
        else if (I > 0.40) c.put(x, y, '█', R);
        else if (I > 0.22) c.put(x, y, '▓', R);
        else if (I > 0.10) c.put(x, y, '▒', R);
        else if (I > 0.04) c.put(x, y, '░', R);
        else if (hash16(x * 19 + y * 53) % 100 < 30) c.put(x, y, '·', R);
      }
    }
    // 中心核：搏动的白点，外一圈短芒
    // 核要小：半径 3 行以上 + 12 根芒，在缩略图里是一个白色八角星，比螺旋还抢眼
    var rc2 = 1.7 + env * 0.8;
    for (y = cy - rc2; y <= cy + rc2; y++)
      for (x = cx - rc2 * 2; x <= cx + rc2 * 2; x++) {
        var ux2 = (x - cx) / (rc2 * 2), uy2 = (y - cy) / rc2;
        if (ux2 * ux2 + uy2 * uy2 > 1) continue;
        c.put(x, y, '█', env > 0.4 ? W : B);
      }
    for (var sp2 = 0; sp2 < 8; sp2++) {
      var a4 = sp2 / 8 * TAU + e * 0.9;
      for (var r4 = rc2 * 2.2; r4 < rc2 * 2.2 + 2.6; r4 += 1)
        c.put(cx + Math.cos(a4) * r4, cy + Math.sin(a4) * r4 * 0.5, '+', B);
    }
    clearRect(c, 0, top, c.w, 1);
  }

  // 159.93–164.00 "We link link link link up now"：副歌第一遍。
  // 参考 MV 170.5–174.6 ＝ 两个角色并排站在红色背景前。
  // 旧稿是 3D 交叉双剑 + 两个用 @*o# 拼的 5 格小人（缩略图里是两串符号），已废弃。
  // 现在直接上两张真立绘：左女王、右洛克茜，各 32 格宽——这是 27 行能装下的
  // 全身上限（32×18×140/84/36 ≈ 26.7 行），再宽就要裁腿。
  function lu_s12_duo(c, t, top, bt, elapsed) {
    var e = elapsed, x, y;
    var cx = 60, cy = (top + bt) / 2;
    var beat = mod(t * 1.85, 1), env = Math.exp(-beat * 4.2);
    // 背景：红色径向光 + 28 档放射楔形。压暗，人物才是主体
    for (y = top + 1; y < bt; y++) {
      for (x = 2; x < c.w - 2; x++) {
        var dx = (x - cx) / 2.2, dy = y - cy;
        var rr = Math.sqrt(dx * dx + dy * dy);
        var th = Math.atan2(dy, dx);
        var wedge = mod(Math.floor(((th + Math.PI) / TAU) * 28 + e * 0.55), 2);
        var I = (wedge ? 0.26 : 0.80) * Math.exp(-rr / 27) * (1 + env * 0.30);
        if (I > 0.46) c.put(x, y, '▓', R);
        else if (I > 0.22) c.put(x, y, '▒', R);
        else if (I > 0.08) c.put(x, y, '░', R);
        else if (hash16(x * 17 + y * 41) % 100 < 20) c.put(x, y, '·', R);
      }
    }
    // 地面一条亮线，两人站在上面
    for (x = 6; x < c.w - 6; x++)
      if (hash16(x * 29 + (e * 4 | 0)) % 100 < 64) c.put(x, bt - 1, '─', x % 3 ? R : N);
    var push = 1 + luEase(clamp01(e / 4.1)) * 0.12;
    var w = 32 * push;
    c.queen = { x: 38 - w / 2, y: 5.0, width: w, t: t, reveal: clamp01(e / 0.7) };
    c.roxy = { x: 82 - w / 2, y: 5.0, width: w, t: t, vis: 1, reveal: clamp01(e / 0.7) };
    clearRect(c, 0, top, c.w, 1);
  }

  // 164.00–167.96 "Link link link link up now"（第二遍）：
  // 参考 MV 174.6–178.6 是一串人物特写快切。副歌的力度靠**剪辑**给，
  // 不靠叠更多特效：0.99 秒一刀，女王 / 洛克茜交替，切点留三帧白闪。
  function lu_s12_shatter(c, t, top, bt, elapsed) {
    var e = elapsed;
    var shot = Math.min(3, Math.floor(e / 0.99));
    var se = mod(e, 0.99);
    var who = shot % 2;                              // 0 = 女王，1 = 洛克茜
    var beat = mod(t * 1.9, 1), env = Math.exp(-beat * 4.2);
    var x, y;
    // 底：暗红放射，跟着切点换方向（每刀换个机位的感觉）
    var dirS = shot % 2 ? -1 : 1;
    for (y = top + 1; y < bt; y++) {
      for (x = 2; x < c.w - 2; x++) {
        var dx = (x - 60) / 2.2, dy = y - (top + bt) / 2;
        var rr = Math.sqrt(dx * dx + dy * dy);
        var th = Math.atan2(dy, dx * dirS);
        var wedge = mod(Math.floor(((th + Math.PI) / TAU) * 24 + shot * 3), 2);
        var I = (wedge ? 0.22 : 0.72) * Math.exp(-rr / 24) * (1 + env * 0.3);
        if (I > 0.42) c.put(x, y, '▓', R);
        else if (I > 0.18) c.put(x, y, '▒', R);
        else if (I > 0.06) c.put(x, y, '░', R);
      }
    }
    // 特写：70 格宽，按镜头左右错开，脸落在画面上三分之一
    var w = 70 * (1 + se * 0.10);
    // 机位只小幅偏移（52 / 68）：偏到 74 时人物会被推到右边缘、左边空一大块
    var ax = shot % 2 ? 68 : 52;
    if (who === 0) {
      c.queen = { x: ax - w / 2, y: 3.6, width: w, t: t, reveal: 1 };
    } else {
      c.roxy = { x: ax - w / 2, y: 3.6, width: w, t: t, vis: 1, reveal: 1 };
    }
    // 切点白闪：三帧，只铺上半屏，别把人糊没
    if (se < 0.075) {
      var k = 1 - se / 0.075;
      for (y = top + 1; y < bt; y++)
        for (x = 2; x < c.w - 2; x++)
          if (hash16(x * 7 + y * 13 + (e * 30 | 0)) % 100 < 70 * k)
            c.put(x, y, '█', k > 0.55 ? W : B);
    }
    clearRect(c, 0, top, c.w, 1);
  }

  // 167.96–172.15 "I was left for dead but you salvaged me"：
  // 参考 MV 178.6–182.75 ＝ 白紫漩涡 → 红黑碎片 → 红色放射 → **俯视的棋盘地板**。
  // 旧稿是"曳光对射 + 两个 5 格小人 + SIEGE.SYS 日志"，全是占位水平。
  // 现在改成一点透视的棋盘地面：等距格子投影后近疏远密，横线按 (k/N)^2 取，
  // 中央一束光柱从上方照下来，人站在光里——"被从死地里捞起来"。
  function lu_s13_cross(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i, k;
    var cx = 60, vpy = top + 5;
    var rise = luEase(clamp01(e / 2.6));
    var beat = mod(t * 1.7, 1), env = Math.exp(-beat * 4.2);
    // 一切先画暗底，格子盖上去
    for (y = top + 1; y < bt; y++)
      for (x = 2; x < c.w - 2; x++)
        if (hash16(x * 31 + y * 53) % 100 < 16) c.put(x, y, '·', K);
    // 地面：整个台座都撤掉。人物 41 格宽时脚踝本来就在画面外，
    // 任何"脚下的台座"都会贴在裁切线上，堆成一堵砖墙（试过三版）。
    // 光柱落地的位置只留一道极淡的地面辉光，其余交给人物自己。
    for (k = 0; k < 2; k++) {
      var ly2 = bt - 0.8 - k * 1.4;
      var hw2 = 40 - k * 12;
      for (x = cx - hw2; x <= cx + hw2; x++) {
        var uu2 = Math.abs(x - cx) / hw2;
        if (hash16(x * 23 + k * 71 + (e * 4 | 0)) % 100 < 52 * (1 - uu2))
          c.put(x, ly2, k ? '░' : '─', k ? K : R);
      }
    }

    // 光柱：从上方一束射下来，**越往下越淡**（光散开了），不是越往下越亮。
    // ⚠️ 反过来的话底部会积成一块梯形实心块，缩略图里就是一堵砖墙（踩过）。
    // 而且只用 `░` / `·` 两档，密度低，才读成"光"而不是"墙"。
    var halfTop = 5, halfBot = 19;
    for (y = top + 1; y < bt; y++) {
      var uu = (y - top) / (bt - top);
      var hw = halfTop + (halfBot - halfTop) * uu * uu;
      for (x = -hw; x <= hw; x += 0.5) {
        var ex = Math.abs(x) / hw;
        var I = (1 - ex * ex) * (0.66 - uu * 0.52) * (1 + env * 0.22);
        if (I > 0.40) c.put(cx + x, y, '░', R);
        else if (I > 0.16 && hash16(x * 7 + y * 3) % 100 < 62) c.put(cx + x, y, '·', R);
      }
    }
    // 光里的浮尘
    for (i = 0; i < 40; i++) {
      var hs = hash16(i * 173 + 7);
      var lv = mod(e * (0.25 + (hs >> 5) % 40 / 40 * 0.5) + hs / 65535, 1);
      var dx2 = ((hs % 100) / 100 - 0.5) * 2 * (halfTop + (halfBot - halfTop) * (1 - lv) * 0.5);
      c.put(cx + dx2, bt - 1 - lv * (bt - top - 3), i % 5 === 0 ? '+' : '·',
            i % 5 === 0 ? N : R);
    }
    // 人：站在光柱中心，从暗到亮浮现
    var w = 38 + rise * 4;
    c.queen = { x: cx - w / 2, y: 6.2 - rise * 1.2, width: w, t: t,
                reveal: clamp01(e / 1.1) };
  }

  // 172.15–176.25 "Quench this molten lead 'cause it's overheating"：
  // 参考 MV 182.4–186.9：先一瞬红晶片特写，随即切到**红色岩洞里的王座全景**
  // （中央血红巨月 → 月前王座 → 王座前的双人 → 左右锯齿岩壁 → 底部岩浆岩台）。
  // ⚠️ 旧稿做成"熔金拱门"是方向错：MV 里根本没有拱门，而且门板门框用 G/K
  // （#875f00 / #5f5f00）铺大面积，整座门泛黄绿。这次不再用这两个色做实体块。
  // ⚠️ 这里的"巨月"是平面同心纹理，不是 luSphere：3D 球在 1:2 字符比下后半面
  // 会被压成一团，读不出"月亮"，而且 72 颗散点的位置会随投影乱跳。
  function lu_s13_throne(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i, k, side;
    var cx = 60, baseY = bt - 5;                       // 地平面，前景岩台在它下面
    var beat = mod(t * 1.75, 1), env = Math.exp(-beat * 4.2);
    var push = 1 + luEase(clamp01(e / 4.1)) * 0.11;   // 全程极缓推入

    // 巨月：rx 用格、ry 用行（字符高宽 1:2，半径必须差 2 倍才是圆）
    // ⚠️ 月心必须压到 y≈10：12.4 那版月心正好落在女王头顶和齿轮上，被挡掉正中一块，
    // 剩下一个空环，怎么调密度都读不出月亮。
    var mCX = cx, mCY = 10.2 - (push - 1) * 3.2, mRX = 15.5 * push, mRY = 7.6 * push;

    // 1) 洞窟底光：只在月周围三层扩散，远处留黑（整屏铺噪点会读成雪花）
    // ⚠️ 光晕是月亮"在发光"的唯一凭据：三层都摊得太稀（原来最内也只有 30% 的 ░），
    // 月亮就只是一枚贴在黑底上的红圆片。这里按半径分成 45% / 26% / 11% 三档。
    var halo = 0.62 + env * 0.38;
    for (y = top; y < bt; y++) {
      for (x = 1; x < c.w - 1; x++) {
        var gx = (x - mCX) / (mRX * 2.25), gy = (y - mCY) / (mRY * 2.4);
        var gd = Math.sqrt(gx * gx + gy * gy);
        if (gd >= 1) continue;
        var gq = 1 - gd;
        if (gq < 0.14) {
          if (hash16(x * 131 + y * 67 + (e * 3 | 0)) % 100 < 30 * halo) c.put(x, y, '·', R);
        } else if (gq < 0.32) {
          if (hash16(x * 131 + y * 67) % 100 < 52 * halo) c.put(x, y, '░', R);
        } else if (hash16(x * 131 + y * 67) % 100 < 78 * halo) c.put(x, y, '░', R);
      }
    }

    // 2) 巨月本体
    // ⚠️ 别按 hash 逐格分档（`dens` 那种写法）：随机取档会把月面打成红色噪点云，
    // 中心被陨击坑一挖就只剩个空心环。
    // ⚠️ 也别在档内部拿 hash 掺邻档（`mh<76?'█':'▓'`）：录制宽度只有 864px，
    // 一格 `▓` 缩到 7×14 后点阵混叠成灰斑，和相邻的实心 `█` 一拼就是"红黑棋盘"，
    // 整个月亮读成马赛克团。**同一档内必须是同一种字符**，明暗只靠档位切换；
    // 不呆板的感觉交给低频正弦（成片起伏），而不是逐格随机。
    for (y = top; y <= bt; y++) {
      for (x = mCX - mRX * 1.14; x <= mCX + mRX * 1.14; x++) {
        var ux = (x - mCX) / mRX, uy = (y - mCY) / mRY;
        var d = Math.sqrt(ux * ux + uy * uy);
        if (d > 1.14) continue;
        var mh = hash16((x | 0) * 73 + (y | 0) * 41) % 100;
        if (d > 1) {                                   // 边缘一圈毛边，不要硬圆
          if (mh < 26 * halo) c.put(x, y, '·', R);
          continue;
        }
        // 低频起伏：两路正弦叠加，周期 15~25 格，缩到 864 宽仍然看得成"斑驳"
        var lf = Math.sin((x - mCX) * 0.41 + (y - mCY) * 0.33) * 0.055
               + Math.sin((x - mCX) * 0.17 - (y - mCY) * 0.29 + 1.7) * 0.045;
        var dj = d + lf;
        // 陨击坑：左上 + 右下各一个，只降一档（降到 ▒ 会在月面上抠出两个黑方块，
        // 864 宽下读成"月亮破了洞"）。坑也别压到正中，正中必须留亮心。
        var cr1x = (x - (mCX - 6.2)) / 6.0, cr1y = (y - (mCY - 2.2)) / 2.6;
        var cr2x = (x - (mCX + 7.0)) / 3.6, cr2y = (y - (mCY + 3.4)) / 1.7;
        var pit = (cr1x * cr1x + cr1y * cr1y < 1) || (cr2x * cr2x + cr2y * cr2y < 1);
        if (dj > 0.95) { if (mh < 52) c.put(x, y, '░', R); }
        else if (dj > 0.84) c.put(x, y, '▒', R);
        else if (dj > 0.62) c.put(x, y, '▓', R);
        else if (pit) c.put(x, y, '▓', R);                   // 坑底：只降一档
        else c.put(x, y, '█', R);                            // 亮心
      }
    }

    // 3) 两侧锯齿岩壁：从地平面向上收窄的尖柱，朝洞心一侧被月光照亮
    // ⚠️ 横向别侵进月亮：旧稿 px 从 cx±16 起，最内一根正好压在月面上，
    // 月亮被啃掉大半读不出来。这里最内一根 px=cx±33，月亮外沿 cx±19.5 稳留 13 格空。
    for (side = -1; side <= 1; side += 2) {
      for (k = 0; k < 7; k++) {
        var hs0 = hash16(k * 317 + (side > 0 ? 917 : 73));
        var tk = k / 6;                                  // 0=靠画面边 1=靠洞心
        var px = cx + side * (61 - tk * 28 + ((hs0 % 100) / 100 - 0.5) * 4) * push;
        var hh = (6 + tk * 13 + (hs0 >> 4) % 5) * push;
        if (hh > baseY - top - 1) hh = baseY - top - 1;
        var hw0 = 1.8 + ((hs0 >> 9) % 30) / 10 * 1.5;
        if (px - hw0 < 1 || px + hw0 > c.w - 2) continue;
        for (y = baseY; y > baseY - hh; y--) {
          var u = (baseY - y) / hh;
          var hwv = hw0 * Math.pow(1 - u, 0.75);
          if (hwv < 0.3) hwv = 0.3;
          for (x = px - hwv; x <= px + hwv; x++) {
            var xi = Math.round(x), yi = Math.round(y);
            var inward = -(xi - px) * side;            // >0 = 朝洞心（受光面）
            // 纹理按 2 行一段取样：逐行 hash 会给柱子刷出棋盘格，读成碎砖
            var rh = hash16(xi * 53 + Math.floor(yi / 2) * 191) % 100;
            if (inward > hwv * 0.4) {
              // 受光面只到 ▓：月亮才是画面里唯一的 █，岩壁一旦也用实心 █，
              // 两侧和月面一样亮，主体就散了（截图里读成"红砖墙夹着一团红"）。
              if (rh < 56) c.put(xi, yi, rh < 30 ? '▓' : '▒', R);
            } else if (inward > -hwv * 0.35) {
              if (rh < 62) c.put(xi, yi, rh < 26 ? '▒' : '░', R);
            } else if (rh < 48) {
              c.put(xi, yi, '░', R);
            }
          }
        }
      }
    }

    // 4) 月下光柱 + 两人脚下的石台
    // ⚠️ 原本这里做的是"用空格从月面抠出王座剪影"，抠出来确实干净（纯黑），
    // 但王座顶部 qhw≈3~14 格正好落在月心上，月亮被掏成一个空心环，调密度救不回来。
    // 字符画只有 29 行可用，人 16 行 + 月 15 行已经占满，塞不下第三层主体——
    // 所以不做王座，改画 MV 里同样成立的两件事：月心往下打的光柱（给画面一条纵轴），
    // 和人物脚下抬起来的一级石台。
    for (y = mCY + mRY * 0.7; y < baseY; y++) {
      var su = (y - (mCY + mRY * 0.7)) / Math.max(1, baseY - (mCY + mRY * 0.7));
      var shw = (5 + su * 13) * push;                  // 越往下越张
      for (x = cx - shw; x <= cx + shw; x++) {
        var eL = Math.abs(x - cx) / shw;
        var sg = hash16((x | 0) * 89 + (y | 0) * 37 + (e * 4 | 0)) % 100;
        var lim = (1 - eL * eL) * (0.62 - su * 0.34) * 100;
        if (lim > 26 && sg < lim * 0.30) c.put(x, y, '·', R);
        else if (sg < lim) c.put(x, y, '░', R);
      }
    }
    // 石台：人物脚下抬起来的一级，只在中段，两端用 · 化开
    for (x = cx - 20; x <= cx + 20; x++) {
      var pq = hash16((x | 0) * 131 + (e * 9 | 0)) % 100;
      var pn = 1 - Math.abs(x - cx) / 21;
      if (pq < 30 + pn * 46) c.put(x, baseY + 0.4, pn > 0.55 && pq < 62 ? '─' : '·', N);
    }



    // 5) 前景岩台：地平线以下越往下越实的块状暗红
    for (y = baseY + 1; y < bt; y++) {
      var depth = (y - baseY) / (bt - baseY);
      for (x = 1; x < c.w - 1; x++) {
        var bxx = Math.floor(x / 3);
        var hv = hash16(bxx * 137 + y * 71) % 100;
        var lim = 32 + depth * 20;
        if (hv < lim) c.put(x, y, hv < lim * 0.32 ? '▒' : '░', R);
      }
    }
    for (x = 1; x < c.w - 1; x++) {                     // 地平线：中间最烫、两端渐熄
      var hz = hash16(x * 29 + (e * 7 | 0)) % 100;
      var near = 1 - Math.abs(x - cx) / 60;
      if (hz < 16 + near * 36) c.put(x, baseY + 1, near > 0.42 ? '─' : '·', N);
    }

    // 6) 火星：从岩台升向月亮
    for (i = 0; i < 26; i++) {
      var sh = hash16(i * 191 + 11);
      var rise = mod(e * (0.26 + (sh >> 5) % 40 / 40 * 0.6) + sh / 65535, 1);
      c.put(cx + ((sh % 100) / 100 - 0.5) * 96,
            baseY - rise * (baseY - top - 2), i % 6 === 0 ? '+' : '·',
            i % 6 === 0 ? B : N);
    }

    // 7) 两个人：真立绘（宽 19 / 16 格 → 高约 16 / 13 行），脚踩地平面
    var wQ = 19, wR = 16;
    c.queen = { x: cx - 6 - wQ / 2, y: luActorY(wQ, baseY, window.__LU_QUEEN_ANSI),
                width: wQ, t: t, reveal: clamp01((e - 0.25) / 1.1) };
    c.roxy = { x: cx + 11 - wR / 2, y: luActorY(wR, baseY, window.__LU_ROXY_ANSI),
               width: wR, t: t, anchor: 'foot', vis: 1,
               reveal: clamp01((e - 0.55) / 1.1) };
  }

  // 176.25–179.96 "Link link link link up now"：镜头钻进巨月，月面开裂、熔金从裂缝里挤出来。
  // 参考 MV 在这一段已经切到厂牌台标（186.9 秒起全是 LALALA 标），没有画面可移植，
  // 所以按歌词自己收束：s13 是"远远看着红洞里的月和人"，这里推成月面特写，
  // 裂缝就是 "link" 的具象——两块东西被烧在一起，中间那道缝是最烫的地方。
  // ⚠️ 逐格 hash 分档在 864 宽下会碎成马赛克（见 s13 的注释），这里月面明暗只由
  // 低频正弦 + 半径决定，同一档内所有格子用同一个字符。
  function lu_s14_hell(c, t, top, bt, elapsed) {
    var e = elapsed, x, y, i;
    var cx = 60, cy = 17.5, RX = 34;
    var beat = mod(t * 1.75, 1), env = Math.exp(-beat * 4.5);
    // ⚠️ open 从 0.18 起，不是从 0：open=0 时 ci 恒为 0，整盘只有 coreR≈1.2 的
    // 中心核，画面上就是一枚孤零零的黄格子，像是贴图没加载完。给个初始张开量后，
    // 第一帧就有细裂纹，之后才是"张开"而不是"凭空出现"。
    var open = 0.18 + 0.82 * luEase(clamp01((e - 0.05) / 2.5));
    var spin = e * 0.12;

    // 月面：以格为单位的半径（纵向 ×2 修正字符高宽比），周界 34 格
    for (y = top - 1; y < bt + 1; y++) {
      for (x = 1; x < c.w - 1; x++) {
        var nx = x - cx, ny = (y - cy) * 2;
        var rr = Math.sqrt(nx * nx + ny * ny);
        var mh0 = hash16((x | 0) * 131 + (y | 0) * 67) % 100;
        if (rr > RX * 1.55) continue;
        if (rr > RX) {                                   // 盘外的红色光晕，别让边界像剪纸
          var gq = (rr - RX) / (RX * 0.55);
          if (mh0 < 40 * (1 - gq)) c.put(x, y, gq > 0.6 ? '·' : '░', R);
          continue;
        }
