  /* ── 设计 token ─────────────────────────────────────────────────────

    /* 铺满：不留居中留白。原来是 max-width:1280px + padding，在大屏上四周围出

  /* 页面级深色。只在本页生效；色值与上面 .pr-wrap 里的 token 同源，改色请一起改。

<script>
(function () {
  // media_paper 镜像。raw 在国内会整段超时（实测与 cdn.jsdelivr 可能同时挂），
  // 所以按顺序回退；首个成功的镜像记进 localStorage，下次直接用，省掉等待。
  // 两者都支持 CORS，也都按正确 Content-Type 返回图片等资源。
  var MIRRORS = [
    'https://raw.githubusercontent.com/CrescentVelvet/media_paper/main/',
    'https://cdn.jsdelivr.net/gh/CrescentVelvet/media_paper@main/'
  ];
  var MIRROR_NAMES = ['raw', 'jsdelivr'];
  var MIRROR_KEY = 'pr-mirror-idx';
  // 单次尝试上限。raw 挂掉时是「连接挂起」而不是快速失败，
  // 不设它就等于让用户等浏览器默认的几十秒。
  var MIRROR_TIMEOUT = 8000;
  var mirrorIdx = 0;
  try {
    var savedIdx = parseInt(window.localStorage.getItem(MIRROR_KEY), 10);
    if (savedIdx >= 0 && savedIdx < MIRRORS.length) mirrorIdx = savedIdx;
  } catch (e) { /* 隐私模式/禁用存储时会抛错，退回默认镜像即可 */ }

  var INDEX = 'index.html';
  var DOMAIN_ORDER = ['3D', 'VideoGen', 'SR', 'CV-AI'];

  var shell    = document.getElementById('prShell');
  var frame    = document.getElementById('prFrame');
  var statusEl = document.getElementById('prStatus');
  var crumb    = document.getElementById('prCrumb');
  var progress = document.getElementById('prProgress');
  var bar      = document.getElementById('prBar');
  var listEl   = document.getElementById('prList');
  var sideMeta = document.getElementById('prSideMeta');
  var searchEl = document.getElementById('prSearch');
  var footInfo = document.getElementById('prFootInfo');
  var footNow  = document.getElementById('prFootNow');
  var backBtn  = document.getElementById('prBack');
  var reloadBtn = document.getElementById('prReload');
  var openLink  = document.getElementById('prOpen');
  var drawerBtn = document.getElementById('prDrawer');
  var indexBtn  = document.getElementById('prIndexBtn');

  // 导航历史：stack 保存上一页，便于"返回"
  var stack = [];      // [{ url, html }]
  var current = null;  // { url, html }
  var reports = [];     // [{ file, domain, date, title, cardTitle }]
  var activeFile = '';

  // 点击拦截脚本：站内 .html 跳转交给外层接管。
  // base href 不能写死 —— 它必须指向**本次真正取到这份文档的那个镜像**，
  // 否则正文里的相对图片会去另一个（可能正挂着的）镜像取。
  var INTERCEPT =
    '<script>' +
    'document.addEventListener("click", function (e) {' +
    '  var a = e.target.closest && e.target.closest("a[href]");' +
    '  if (!a) return;' +
    '  var href = a.getAttribute("href");' +
    '  if (!href || /^(https?:|mailto:|#)/i.test(href)) return;' +
    '  if (/\\.html?$/i.test(href.split("#")[0])) {' +
    '    e.preventDefault();' +
    '    parent.postMessage({ type: "pr-navigate", href: a.href }, "*");' +
    '  }' +
    '}, true);' +
    '<\/script>';

  function injectInto(text, base) {
    var inject = '<base href="' + base + '">' + INTERCEPT;
    return /<head[^>]*>/i.test(text)
      ? text.replace(/<head[^>]*>/i, function (m) { return m + inject; })
      : inject + text;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function decodeName(file) {
    try { return decodeURIComponent(file); } catch (e) { return file; }
  }

  // 报告文件名规范：<领域>-<YYYYMMDD>-<标题>.html（如 3D-20260810-微动人体三维重建调研.html）
  // ⚠️ 领域名可能以数字开头（3D），所以首字符类必须含 0-9，否则会整组掉进「其他」
  function parseFileName(file) {
    var name = decodeName(file).replace(/^\.\//, '').replace(/\.html?$/i, '');
    var m = /^([A-Za-z0-9][A-Za-z0-9_-]*?)-(\d{4})(\d{2})(\d{2})-(.+)$/.exec(name);
    if (m) {
      return {
        domain: m[1],
        date: m[2] + '-' + m[3] + '-' + m[4],
        title: m[5],
        cardTitle: ''
      };
    }
    return { domain: '其他', date: '', title: name, cardTitle: '' };
  }

  // 从索引页 HTML 里收集报告清单（只看站内 .html 链接）
  // 索引页自身不进清单——它已降级为侧栏顶部的固定条目
  function collectReports(text) {
    var doc;
    try {
      doc = new DOMParser().parseFromString(text, 'text/html');
    } catch (e) {
      return [];
    }
    var as = doc.querySelectorAll('a[href]');
    var out = [];
    var seen = {};
    for (var i = 0; i < as.length; i++) {
      var href = as[i].getAttribute('href') || '';
      if (/^[a-z][a-z0-9+.-]*:/i.test(href)) continue;   // 带协议的绝对链接
      if (href.charAt(0) === '/' || href.charAt(0) === '#') continue;
      var file = href.split('#')[0];
      if (!/\.html?$/i.test(file)) continue;
      file = decodeName(file.replace(/^\.\//, ''));   // 统一存解码后的相对路径
      if (file.toLowerCase() === INDEX || seen[file]) continue;
      seen[file] = 1;
      var item = parseFileName(file);
      item.file = file;
      var card = as[i].closest ? as[i].closest('.note-card') : null;
      if (card) {
        var h = card.querySelector('h1, h2, h3, h4, strong');
        if (h) {
          var t = (h.textContent || '').replace(/\s+/g, ' ').trim();
          if (t && t !== item.title) item.cardTitle = t;
        }
      }
      out.push(item);
    }
    return out;
  }

  function domainRank(d) {
    var i = DOMAIN_ORDER.indexOf(d);
    return i < 0 ? DOMAIN_ORDER.length : i;
  }

  function renderList() {
    var q = (searchEl.value || '').trim().toLowerCase();
    var hit = reports.filter(function (r) {
      if (!q) return true;
      return (r.title + ' ' + r.file + ' ' + r.domain + ' ' + r.date + ' ' + r.cardTitle)
        .toLowerCase().indexOf(q) >= 0;
    });

    var groups = [];
    var byDomain = {};
    hit.forEach(function (r) {
      if (!byDomain[r.domain]) {
        byDomain[r.domain] = [];
        groups.push(r.domain);
      }
      byDomain[r.domain].push(r);
    });
    groups.sort(function (a, b) {
      return domainRank(a) - domainRank(b) || a.localeCompare(b, 'zh');
    });

    var html = '';
    groups.forEach(function (g) {
      var items = byDomain[g];
      html += '<div class="pr-group"><span>' + esc(g) + '</span><i>' + items.length + '</i></div>';
      items.forEach(function (r) {
        html +=
          '<button type="button" class="pr-item' + (r.file === activeFile ? ' is-active' : '') +
          '" data-file="' + esc(r.file) + '" title="' + esc(r.file) + '">' +
          '<span class="pr-item-t">' + esc(r.title) + '</span>' +
          '<span class="pr-item-d">' + esc(r.date || '—') + '</span>' +
          '</button>';
      });
    });

    if (!html) {
      html = '<div class="pr-empty">没有匹配的报告</div>';
    }
    listEl.innerHTML = html;
    sideMeta.textContent = q
      ? ('命中 ' + hit.length + ' / ' + reports.length + ' 份')
      : (reports.length + ' 份报告 · ' + groups.length + ' 个领域');
  }

  function setActive(file) {
    activeFile = '';
    for (var i = 0; i < reports.length; i++) {
      if (reports[i].file === file) { activeFile = file; break; }
    }
    indexBtn.classList.toggle('is-active', file === INDEX);
    renderList();
    if (activeFile) {
      var el = listEl.querySelector('.pr-item.is-active');
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    }
  }

  function setStatus(text, isError) {
    statusEl.textContent = text || '';
    statusEl.classList.toggle('is-on', !!text);
    statusEl.classList.toggle('is-error', !!isError);
  }

  function progressStart() {
    progress.classList.remove('is-error');
    bar.style.transition = 'none';
    bar.style.opacity = '1';
    bar.style.width = '0';
    requestAnimationFrame(function () {
      bar.style.transition = 'width .55s ease, opacity .3s ease';
      bar.style.width = '70%';
    });
  }

  function progressEnd(isError) {
    bar.style.width = '100%';
    if (isError) {
      progress.classList.add('is-error');
      return;
    }
    setTimeout(function () {
      bar.style.opacity = '0';
      setTimeout(function () { bar.style.width = '0'; }, 300);
    }, 220);
  }

  function render(doc) {
    current = doc;
    frame.srcdoc = doc.html;
    backBtn.hidden = stack.length === 0;
    openLink.href = 'https://htmlpreview.github.io/?' + doc.url;
    crumb.textContent = doc.file || INDEX;
    footNow.textContent = doc.file || INDEX;
    var base = reports.length
      ? ('共 ' + reports.length + ' 份报告 · 浏览 ' + (stack.length + 1) + ' 页')
      : ('浏览 ' + (stack.length + 1) + ' 页');
    // 非首选镜像时常驻显示，让用户一眼看出"现在其实走的是备用线路"
    footInfo.textContent = base + (mirrorIdx === 0 ? '' : (' · ' + MIRROR_NAMES[mirrorIdx] + ' 镜像'));
  }

  function withTimeout(url, ms) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms);
    var opt = { cache: 'no-cache' };
    if (ctrl) opt.signal = ctrl.signal;
    return fetch(url, opt).then(function (res) {
      clearTimeout(timer);
      return res;
    }, function (err) {
      clearTimeout(timer);
      throw err;
    });
  }

  // 当前镜像优先（上一次成功过的那个），其余按序回退
  function mirrorOrder() {
    var o = [mirrorIdx];
    for (var i = 0; i < MIRRORS.length; i++) {
      if (i !== mirrorIdx) o.push(i);
    }
    return o;
  }

  function tryMirror(file, order, k) {
    if (k >= order.length) {
      return Promise.reject(new Error('所有镜像均不可用（' + MIRROR_NAMES.join(' / ') + '）'));
    }
    var idx = order[k];
    var base = MIRRORS[idx];
    var url = base + encodeURI(file);
    return withTimeout(url, MIRROR_TIMEOUT).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text().then(function (text) {
        var switched = (idx !== mirrorIdx);
        if (switched) {
          mirrorIdx = idx;
          try { window.localStorage.setItem(MIRROR_KEY, String(idx)); } catch (e) {}
          setStatus('首选镜像不可用，已切到 ' + MIRROR_NAMES[idx] + ' 镜像。', false);
          setTimeout(function () {
            if (statusEl.textContent.indexOf('已切到') >= 0) setStatus('', false);
          }, 5000);
        }
        return {
          file: file, url: url, base: base,
          html: injectInto(text, base), text: text, switched: switched
        };
      });
    }).catch(function () {
      return tryMirror(file, order, k + 1);
    });
  }

  function fetchDoc(file) {
    return tryMirror(file, mirrorOrder(), 0);
  }

  // iframe 里的 a.href 是**基于 base 的绝对 URL**（且可能来自上一次使用的镜像），
  // 要剥掉任一镜像前缀才回到相对路径。
  function toFile(href) {
    var u = String(href || '');
    for (var i = 0; i < MIRRORS.length; i++) {
      if (u.indexOf(MIRRORS[i]) === 0) {
        return decodeName(u.slice(MIRRORS[i].length).split('#')[0].split('?')[0]);
      }
    }
    var tail = u.split('#')[0].split('?')[0].split('/').pop() || INDEX;
    return decodeName(tail);
  }

  function navigate(file, push) {
    setStatus('正在加载：' + file, false);
    progressStart();
    fetchDoc(file).then(function (doc) {
      if (push && current) stack.push(current);
      render(doc);
      setActive(doc.file);
      if (!doc.switched) setStatus('', false);   // 切过镜像时保留那句提示
      progressEnd(false);
    }).catch(function (err) {
      setStatus('加载失败（' + err.message + '），请检查网络或点击"刷新"重试。', true);
      progressEnd(true);
    });
  }

  // 只读索引页、更新目录，不改变当前阅读页
  function loadIndex() {
    return fetchDoc(INDEX).then(function (doc) {
      var found = collectReports(doc.text);
      if (found.length) reports = found;
      return reports;
    });
  }

  // 默认落点：全库日期最新的那份报告（索引页已降级，不再作为首页）
  function pickDefault() {
    var best = '', bestDate = '';
    for (var i = 0; i < reports.length; i++) {
      var r = reports[i];
      if (r.date && r.date > bestDate) { bestDate = r.date; best = r.file; }
    }
    if (best) return best;
    return (reports[0] && reports[0].file) || INDEX;
  }

  function boot() {
    setStatus('正在读取索引…', false);
    progressStart();
    loadIndex().then(function () {
      renderList();
      navigate(pickDefault(), false);
    }).catch(function (err) {
      setStatus('索引读取失败（' + err.message + '），可点左侧「总索引」重试。', true);
      progressEnd(true);
    });
  }

  // 接收 iframe 内的站内跳转请求
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'pr-navigate') navigate(toFile(e.data.href), true);
  });

  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.pr-item') : null;
    if (!btn) return;
    var file = btn.getAttribute('data-file');
    if (!file) return;
    navigate(file, true);
    if (window.matchMedia('(max-width: 900px)').matches) shell.classList.remove('is-side-open');
  });

  indexBtn.addEventListener('click', function () {
    navigate(INDEX, true);
    if (window.matchMedia('(max-width: 900px)').matches) shell.classList.remove('is-side-open');
  });

  searchEl.addEventListener('input', renderList);
  searchEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { searchEl.value = ''; renderList(); searchEl.blur(); }
  });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      shell.classList.add('is-side-open');
      searchEl.focus();
      searchEl.select();
    }
  });

  backBtn.addEventListener('click', function () {
    var prev = stack.pop();
    if (prev) {
      render(prev);
      setActive(prev.file);
    }
  });

  // 刷新 = 重读目录 + 重载当前页（不把用户踢回默认落点）
  reloadBtn.addEventListener('click', function () {
    var file = current ? current.file : null;
    stack = [];
    setStatus('正在刷新…', false);
    progressStart();
    loadIndex().then(function () {
      renderList();
      navigate(file || pickDefault(), false);
    }).catch(function (err) {
      setStatus('刷新失败（' + err.message + '）', true);
      progressEnd(true);
    });
  });

  drawerBtn.addEventListener('click', function () {
    shell.classList.toggle('is-side-open');
  });

  // 按 shell 的文档顶边算高：站点页头高度不是固定值（改动导航/字体就会变），
  // 写死 calc(100vh - N) 迟早把底部状态栏切掉。用文档坐标，滚动时结果也稳定。
  // 不再留底边距 —— 铺满到视口底，向下滚才看到站点页脚。
  function fitShell() {
    var rect = shell.getBoundingClientRect();
    var docTop = rect.top + (window.scrollY || window.pageYOffset || 0);
    shell.style.height = Math.max(420, window.innerHeight - docTop) + 'px';
  }
  window.addEventListener('resize', fitShell);
  window.addEventListener('orientationchange', fitShell);
  fitShell();
  requestAnimationFrame(fitShell);

  // 先读目录，再落到默认报告（索引页只是侧栏里的一个条目）
  boot();
})();
</script>
