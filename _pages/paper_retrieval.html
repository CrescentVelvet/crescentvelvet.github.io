<style>
  .pr-wrap {

    display: flex;

  }
  .pr-title {
    font-size: 1.15em;

  }
  .pr-actions {
    display: flex;

  }
  .pr-btn {
    display: inline-block;
    padding: 6px 14px;
    font-size: 0.9em;
    font-weight: 600;
    color: #4a90e2;
    background: #fff;
    border: 1px solid #d9e2ec;

  }

  }
  @media (max-width: 640px) {

  }
</style>

<div class="pr-wrap">
  <div class="pr-toolbar">
    <div class="pr-title">📄 论文调研 · media_paper 知识库</div>
    <div class="pr-actions">
      <button id="prBack" class="pr-btn" hidden>← 返回索引</button>
      <button id="prReload" class="pr-btn">刷新</button>
      <a id="prOpen" class="pr-btn" target="_blank" rel="noopener">新窗口打开 ↗</a>
    </div>
  </div>
  <div id="prStatus" class="pr-status">正在加载知识库索引…</div>
  <iframe id="prFrame" class="pr-frame" title="media_paper 知识库"></iframe>
</div>

<script>
(function () {
  // media_paper 仓库（raw 支持 CORS，图片等资源按正确类型返回）
  var RAW = 'https://raw.githubusercontent.com/CrescentVelvet/media_paper/main/';

  var frame   = document.getElementById('prFrame');
  var status  = document.getElementById('prStatus');
  var backBtn = document.getElementById('prBack');
  var reloadBtn = document.getElementById('prReload');
  var openLink  = document.getElementById('prOpen');

  // 导航历史：stack 保存上一页，便于"返回索引"
  var stack = [];      // [{ url, html }]
  var current = null;  // { url, html }

  // 注入 base（让相对图片/资源指向 raw）和点击拦截脚本（站内 .html 跳转交给外层接管）
  var INJECT =
    '<base href="' + RAW + '">' +
    '<script>' +
    'document.addEventListener("click", function (e) {' +
    '  var a = e.target.closest && e.target.closest("a[href]");' +
    '  if (!a) return;' +
    '  var href = a.getAttribute("href");' +
    '  if (!href || /^(https?:|mailto:|#)/i.test(href)) return;' +
    '  if (/\\.html?$/i.test(href.split("#")[0])) {' +
    '    e.preventDefault();' +
    '    parent.postMessage({ type: "pr-navigate", href: a.href }, "*");' +
    '  }' +
    '}, true);' +
    '<\/script>';

  function setStatus(text, isError) {
    status.textContent = text;
    status.classList.toggle('is-error', !!isError);
  }

  function render(doc) {
    current = doc;
    frame.srcdoc = doc.html;
    backBtn.hidden = stack.length === 0;
    openLink.href = 'https://htmlpreview.github.io/?' + doc.url;
  }

  function fetchDoc(url) {
    setStatus('正在加载：' + url.replace(RAW, ''));
    return fetch(url, { cache: 'no-cache' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text().then(function (text) {
        // 在 <head> 后注入 base 与拦截脚本
        var html = /<head[^>]*>/i.test(text)
          ? text.replace(/<head[^>]*>/i, function (m) { return m + INJECT; })
          : INJECT + text;
        return { url: url, html: html };
      });
    });
  }

  function navigate(url, push) {
    fetchDoc(url).then(function (doc) {
      if (push && current) stack.push(current);
      render(doc);
      setStatus('共 ' + (stack.length + 1) + ' 页浏览记录 · 当前：' +
        decodeURIComponent(url.replace(RAW, '')));
    }).catch(function (err) {
      setStatus('加载失败（' + err.message + '），请检查网络或点击"刷新"重试。', true);
    });
  }

  // 接收 iframe 内的站内跳转请求
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'pr-navigate') navigate(e.data.href, true);
  });

  backBtn.addEventListener('click', function () {
    var prev = stack.pop();
    if (prev) render(prev);
  });

  reloadBtn.addEventListener('click', function () {
    stack = [];
    navigate(RAW + 'index.html', false);
  });

  // 初始加载索引页
  navigate(RAW + 'index.html', false);
})();
</script>
