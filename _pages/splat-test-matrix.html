<script type="module">
import * as THREE from 'three';
import { DropInViewer, SceneFormat } from '@mkkellogg/gaussian-splats-3d';

// ===== 变体开关（URL 参数）=====
const qs = new URLSearchParams(location.search);
const V = {
    src: qs.get('src') || '/assets/splat-test/synth.ply',
    gpuSort: qs.get('gpusort') === '1',            // 默认关
    halfPrec: qs.get('halfprec') === '1',          // 默认关
    dynScene: qs.get('dyn') === '1',               // 默认 false（与原版一致）
    manualUpdate: qs.get('manual') === '1',        // 手动调 viewer.update 而不依赖 onBeforeRender
    noOffset: qs.get('nooffset') === '1',          // 不做 sceneCenter 偏移
    forceAll: qs.get('forceall') === '1',          // 每次 runSplatSort(true, true)
    clearColor: qs.get('clear') || '222233'
};
const TAG = `[matrix ${qs.get('tag')||''}]`;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setClearColor(new THREE.Color('#' + V.clearColor), 1);
renderer.setSize(900, 640, false);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(65, 900/640, 0.1, 500);
camera.position.set(2, 2, 3);
camera.up.set(0, 1, 0);
camera.lookAt(0, 0, 0);

const { OrbitControls } = await import('@mkkellogg/gaussian-splats-3d');
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;

const splatGroup = new DropInViewer({
    gpuAcceleratedSort: V.gpuSort,
    halfPrecisionCovariancesOnGPU: V.halfPrec,
    sharedMemoryForWorkers: false,
    integerBasedSort: true,
    dynamicScene: V.dynScene,
    webXRMode: 0
});
const scene = new THREE.Scene();
scene.add(splatGroup);

console.log(TAG, 'loading', V.src);
await splatGroup.addSplatScene(V.src, {
    splatAlphaRemovalThreshold: 1,
    showLoadingUI: false,
    format: SceneFormat.Ply,
    progressiveLoad: false
});
console.log(TAG, 'addSplatScene 完成');

const splatMesh = splatGroup.viewer.getSplatMesh();
const scene0 = splatMesh.getScene(0);
const sb = scene0.splatBuffer;
console.log(TAG, 'sceneCenter=', sb.sceneCenter ? [sb.sceneCenter.x, sb.sceneCenter.y, sb.sceneCenter.z] : null,
            'boundsMin=', sb.minBound ? [sb.minBound.x.toFixed(2), sb.minBound.y.toFixed(2), sb.minBound.z.toFixed(2)] : null,
            'boundsMax=', sb.maxBound ? [sb.maxBound.x.toFixed(2), sb.maxBound.y.toFixed(2), sb.maxBound.z.toFixed(2)] : null);

if (!V.noOffset && sb.sceneCenter) {
    scene0.position.copy(sb.sceneCenter).multiplyScalar(-1);
    scene0.updateMatrix();
    console.log(TAG, 'scene0.position =', scene0.position.toArray().map(v => +v.toFixed(2)).join(','));
} else {
    console.log(TAG, 'no offset applied');
}

// ==== 插桩 ====
const viewer = splatGroup.viewer;
let onBeforeRenderCalls = 0;
const origOBR = DropInViewer.onBeforeRender;
// hook callbackMesh
const cbm = splatGroup.callbackMesh;
if (cbm) {
    const orig = cbm.onBeforeRender;
    cbm.onBeforeRender = function(...args) { onBeforeRenderCalls++; return orig.apply(this, args); };
    console.log(TAG, 'callbackMesh hooked, visible=', cbm.visible, 'parent=', !!cbm.parent);
} else {
    console.log(TAG, 'NO callbackMesh!');
}

let sortDoneCount = 0;
const origUpdateRenderIndexes = splatMesh.updateRenderIndexes.bind(splatMesh);
splatMesh.updateRenderIndexes = function(idx, count) {
    sortDoneCount++;
    if (sortDoneCount <= 3) console.log(TAG, 'sortDone -> renderCount=', count);
    return origUpdateRenderIndexes(idx, count);
};

// 手动 update 模式：在 render 前主动调 viewer.update（绕过 onBeforeRender 依赖）
if (V.manualUpdate) {
    const origRenderFn = renderer.render.bind(renderer);
    renderer.render = function(s, c) {
        if (viewer.initialized) viewer.update(this, c);
        else viewer.update(this, c);
        return origRenderFn(s, c);
    };
}

window.__viewer = viewer;
window.__splatMesh = splatMesh;

let frame = 0;
function tick() {
    requestAnimationFrame(tick);
    orbit.update();
    renderer.render(scene, camera);
    frame++;
    if (frame === 3 || frame === 90) {
        const gl = renderer.getContext();
        const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
        const px = new Uint8Array(4 * 400);
        let idx = 0, nonBg = 0;
        for (let y = 0; y < 20; y++) {
            for (let x = 0; x < 20; x++) {
                const rx = Math.floor(x / 20 * w), ry = Math.floor(y / 20 * h);
                gl.readPixels(rx, ry, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px, idx * 4);
                const rr = px[idx*4], gg = px[idx*4+1], bb = px[idx*4+2];
                if (Math.abs(rr-34) > 25 || Math.abs(gg-34) > 25 || Math.abs(bb-51) > 25) nonBg++;
                idx++;
            }
        }
        const inst = splatMesh.geometry.instanceCount;
        console.log(TAG, 'frame', frame,
            'nonBg/400=', nonBg,
            'instanceCount=', inst,
            'splatCount=', splatMesh.getSplatCount(),
            'obrCalls=', onBeforeRenderCalls,
            'sortDones=', sortDoneCount,
            'drawCalls=', renderer.info.render.calls,
            'tri=', renderer.info.render.triangles);
    }
}
tick();
</script>
</body>
