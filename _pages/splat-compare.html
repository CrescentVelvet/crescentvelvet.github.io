<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高斯对比 - Gaussian Splat PLY Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        /* 顶部工具栏 */
        #toolbar {
            position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 100;
            background: #252525; border-bottom: 1px solid #3a3a3a;
            display: flex; align-items: center; padding: 0 16px; gap: 12px;
        }
        #toolbar h1 { font-size: 16px; font-weight: 500; color: #f0f0f0; margin-right: auto; }
        #toolbar button, #toolbar label.btn {
            background: #3a3a3a; color: #e0e0e0; border: 1px solid #4a4a4a;
            padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;
            transition: all 0.15s; user-select: none;
        }
        #toolbar button:hover, #toolbar label.btn:hover { background: #4a4a4a; border-color: #5a5a5a; }
        #toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
        #toolbar button.active { background: #2f4f3f; border-color: #5a9; color: #cfe; }
        #toolbar .hint { font-size: 12px; color: #888; }

        /* 窗口网格容器 */
        #grid {
            position: fixed; top: 48px; left: 0; right: 0; bottom: 0;
            display: grid; gap: 2px; background: #0a0a0a;
            padding: 2px;
        }
        #grid.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        #grid.count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        #grid.count-3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; }
        #grid.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

        /* 单个窗口 */
        .panel {
            position: relative; background: #111; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .panel-header {
            height: 28px; background: #2a2a2a; border-bottom: 1px solid #3a3a3a;
            display: flex; align-items: center; padding: 0 8px; gap: 6px; flex-shrink: 0;
        }
        .panel-title {
            flex: 1; font-size: 12px; color: #ccc; cursor: text;
            padding: 2px 6px; border-radius: 3px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .panel-title:hover { background: #3a3a3a; }
        .panel-title.editing { background: #1a1a1a; outline: 1px solid #5a9; }
        .panel-close {
            width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
            color: #888; cursor: pointer; font-size: 14px; border-radius: 3px;
            user-select: none;
        }
        .panel-close:hover { background: #4a2a2a; color: #e88; }

        /* 单模型「调正」按钮 + 调正工具条 */
        .panel-adjust {
            font-size: 12px; color: #999; cursor: pointer; padding: 1px 7px;
            border-radius: 3px; user-select: none; white-space: nowrap;
            border: 1px solid transparent; line-height: 1.5;
        }
        .panel-adjust:hover { background: #3a4a3a; color: #9c9; }
        .panel-adjust.active { background: #2f4f3f; border-color: #5a9; color: #cfe; }
        .panel-adjust.disabled { opacity: 0.35; cursor: not-allowed; }
        .panel-adjust.disabled:hover { background: transparent; color: #999; }
        .panel-adjust-bar {
            position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 8;
            display: none; align-items: center; gap: 5px; flex-wrap: wrap;
            background: rgba(18, 24, 21, 0.88); border: 1px solid #3a5a4a;
            border-radius: 4px; padding: 6px 8px;
        }
        .panel-adjust-bar.show { display: flex; }
        .panel-adjust-bar .adj-hint { font-size: 11px; color: #9cb; margin-right: auto; }
        .panel-adjust-bar button {
            background: #2f3a34; color: #cfe; border: 1px solid #4a5a52;
            padding: 3px 7px; border-radius: 3px; cursor: pointer; font-size: 11px;
        }
        .panel-adjust-bar button:hover { background: #3f4f46; }
        .panel-adjust-bar button.adj-reset { border-color: #5a4a4a; color: #ebc; }
        .panel-canvas-wrap.adjusting { cursor: grab; }
        .panel-canvas-wrap.adjusting.dragging { cursor: grabbing; }

        .panel-canvas-wrap { flex: 1; position: relative; }
        .panel-canvas-wrap canvas { display: block; width: 100%; height: 100%; }

        /* 空状态/拖拽提示 */
        .panel-empty {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 13px; pointer-events: none; text-align: center;
        }
        .panel-loading {
            position: absolute; inset: 0; background: rgba(20,20,20,0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; z-index: 10;
        }
        .spinner {
            width: 32px; height: 32px; border: 3px solid #3a3a3a;
            border-top-color: #5a9; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-bar {
            width: 180px; height: 4px; background: #2a2a2a; border-radius: 2px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: #5a9; width: 0%; transition: width 0.2s;
        }
        .loading-text { font-size: 12px; color: #aaa; }
        .panel-error {
            position: absolute; inset: 0; background: rgba(40,20,20,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 8px; z-index: 10; padding: 20px; text-align: center;
        }
        .panel-error .err-icon { font-size: 24px; color: #e88; }
        .panel-error .err-msg { font-size: 12px; color: #c88; max-width: 240px; word-break: break-word; }

        /* 整页空状态 */
        #empty-state {
            position: fixed; top: 48px; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #555; gap: 16px; z-index: 5;
            border: 2px dashed #2a2a2a; margin: 2px; background: #111;
        }
        #empty-state .big-hint { font-size: 18px; color: #888; }
        #empty-state .small-hint { font-size: 13px; color: #555; }
        #empty-state.dragover { border-color: #5a9; background: #1a2a2a; }
        #empty-state.dragover .big-hint { color: #7c9; }

        /* 拖拽高亮 */
        body.drag-active #grid { outline: 2px dashed #5a9; outline-offset: -4px; }
    </style>
</head>
<body>
    <div id="toolbar">
        <h1>高斯对比</h1>
        <span class="hint">拖入 .ply 文件或点击添加 · 最多 4 个</span>
        <label class="btn" id="add-btn-label">+ 添加模型
            <input type="file" id="file-input" accept=".ply" multiple style="display:none">
        </label>
        <button id="fit-btn" disabled>对齐视角 (Fit All)</button>
        <button id="flip-btn" disabled title="所有模型统一上下翻转（绕 X 轴 180°）">上下翻转</button>
        <button id="reset-btn" disabled>重置</button>
    </div>

    <div id="empty-state">
        <div class="big-hint">拖入 .ply 文件开始对比</div>
        <div class="small-hint">支持同时对比 2-4 个高斯泼溅模型 · 鼠标联动控制</div>
        <div class="small-hint">左键拖拽=旋转 · 右键拖拽=平移 · 滚轮=缩放</div>
    </div>

    <div id="grid" style="display:none"></div>

    <!-- import map: 让浏览器解析 bare import -->
    <script type="importmap">
    {
        "imports": {
            "three": "/assets/splat-vendor/three.module.js",
            "@mkkellogg/gaussian-splats-3d": "/assets/splat-vendor/gaussian-splats-3d.module.js"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { DropInViewer, OrbitControls, SceneFormat } from '@mkkellogg/gaussian-splats-3d';

    // ============ 全局状态 ============
    const MAX_PANELS = 4;
    const panels = []; // {el, canvasWrap, viewer, renderer, camera, controls, title, state, bbox}
    let grid = document.getElementById('grid');
    let emptyState = document.getElementById('empty-state');
    let fitBtn = document.getElementById('fit-btn');
    let resetBtn = document.getElementById('reset-btn');
    let flipBtn = document.getElementById('flip-btn');
    let fileInput = document.getElementById('file-input');

    // 联动锁，防止循环广播
    let syncLock = false;

    // 全局翻转开关：true = 所有模型绕 X 轴转 180°（上下颠倒）
    // 默认 false = 模型原始数据朝向，无预置摆正
    let allFlipped = false;

    // ============ 单模型「调正」 ============
    // 有些模型的坐标系和其他模型不一致（例如 COLMAP Y-down vs Y-up），
    // 直接对比看不出差异，必须先各自转到同一朝向。
    //
    // 注意「转模型」和「转相机」在正交视图下**视觉等价**：
    //   绕世界轴 a 转模型角度 θ  ⟺  相机绕 a 转 −θ
    //   （模型多转 θ 则它每个点在相机空间也多转 θ，等同相机反向转 θ 把画面补偿回来）
    // 所以调正这里不做任何旋转动作了：旋转完全交给 OrbitControls 的相机环绕，
    // 观感与「查看模型」**逐像素一致**，也不再有"相机坐标系被换掉"的副作用。
    // 真正的朝向修正在退出调正时落到 panel.userQuat 上（见 setPanelAdjusting 的提交逻辑）。
    const AXIS_X = new THREE.Vector3(1, 0, 0);
    const AXIS_Y = new THREE.Vector3(0, 1, 0);
    const AXIS_Z = new THREE.Vector3(0, 0, 1);

    // 说明：调正模式下旋转/滚轮都交给 OrbitControls，原来的模型自转与
    // 模型缩放（含这条从库内抄来的滚轮阻尼曲线）已不再需要，故移除。
    // 若将来需要恢复，注意别把曲线函数命名成 zf：vendor 模块在模块级声明了
    // `let zf`，我们内联模块脚本与它同处一个全局词法环境，重名会让库的 zf 被 raise 成
    // TDZ（"Cannot access 'zf' before initialization"），OrbitControls 直接失效。

    // ============ 布局管理 ============
    function getGridClass(count) {
        return 'count-' + Math.max(1, Math.min(4, count));
    }

    function relayout() {
        const count = panels.length;
        if (count === 0) {
            grid.style.display = 'none';
            emptyState.style.display = 'flex';
            fitBtn.disabled = true;
            resetBtn.disabled = true;
            flipBtn.disabled = true;
            return;
        }
        emptyState.style.display = 'none';
        grid.style.display = 'grid';
        grid.className = getGridClass(count);
        fitBtn.disabled = false;
        resetBtn.disabled = false;
        flipBtn.disabled = false;
        // 通知每个 renderer 重新计算尺寸
        let sizeChanged = false;
        for (const p of panels) {
            if (p.renderer) {
                const w = p.canvasWrap.clientWidth;
                const h = p.canvasWrap.clientHeight;
                if (w > 0 && h > 0) {
                    p.renderer.setSize(w, h, false);
                    p.camera.aspect = w / h;
                    p.camera.updateProjectionMatrix();
                    sizeChanged = true;
                }
            }
        }
        // 尺寸变了需要重画（resize 不会触发 controls change）
        if (sizeChanged) wakeRenderLoop();
    }

    // ============ 创建空面板 ============
    function createPanel() {
        const el = document.createElement('div');
        el.className = 'panel';
        el.innerHTML = `
            <div class="panel-header">
                <span class="panel-title" contenteditable="false">未加载</span>
                <span class="panel-adjust disabled" title="单独调正该模型朝向">调正</span>
                <span class="panel-close" title="关闭">×</span>
            </div>
            <div class="panel-canvas-wrap">
                <div class="panel-empty">拖入 .ply 或点击添加</div>
            </div>
            <div class="panel-adjust-bar">
                <span class="adj-hint">旋转/缩放=环绕视角（同查看） · 右键=平移模型</span>
                <button data-axis="x" data-dir="-1">X−90°</button>
                <button data-axis="x" data-dir="1">X+90°</button>
                <button data-axis="y" data-dir="-1">Y−90°</button>
                <button data-axis="y" data-dir="1">Y+90°</button>
                <button data-axis="z" data-dir="-1">Z−90°</button>
                <button data-axis="z" data-dir="1">Z+90°</button>
                <button class="adj-commit" title="把当前朝向固化为模型姿态（相机回正视角）">固化朝向</button>
                <button class="adj-scale-reset" title="缩放倍数回到 1">复原尺寸</button>
                <button class="adj-reset" title="朝向/平移/缩放全部复原">重置</button>
            </div>
        `;
        grid.appendChild(el);

        const titleEl = el.querySelector('.panel-title');
        const closeEl = el.querySelector('.panel-close');
        const canvasWrap = el.querySelector('.panel-canvas-wrap');
        const adjustEl = el.querySelector('.panel-adjust');
        const adjustBar = el.querySelector('.panel-adjust-bar');

        // 标题编辑
        titleEl.addEventListener('click', () => {
            titleEl.contentEditable = 'true';
            titleEl.classList.add('editing');
            titleEl.focus();
            document.execCommand('selectAll', false, null);
        });
        titleEl.addEventListener('blur', () => {
            titleEl.contentEditable = 'false';
            titleEl.classList.remove('editing');
            const p = panels.find(x => x.el === el);
            if (p) p.title = titleEl.textContent.trim() || '未命名';
        });
        titleEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
        });

        // 关闭
        closeEl.addEventListener('click', () => {
            const idx = panels.findIndex(x => x.el === el);
            if (idx >= 0) removePanel(idx);
        });

        // 「调正」：进入/退出单模型朝向调整
        adjustEl.addEventListener('click', () => {
            const p = panels.find(x => x.el === el);
            if (!p || p.state !== 'ready') return;
            setPanelAdjusting(p, !p.adjusting);
        });

        // 调正工具条：轴向 ±90° 快捷键 + 重置
        adjustBar.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const p = panels.find(x => x.el === el);
            if (!p || !p.adjusting) return;
            if (btn.classList.contains('adj-reset')) {
                p.userQuat.identity();
                p.userScale = 1;
                p.userOffset.set(0, 0, 0);
            } else if (btn.classList.contains('adj-scale-reset')) {
                p.userScale = 1;
            } else if (btn.classList.contains('adj-commit')) {
                commitAdjustRotation(p);   // 把当前视角的朝向差固化进 userQuat，相机回正
                return;                    // commitAdjustRotation 内部已处理渲染唤醒
            } else {
                // 轴向 ±90°：与「旋转=环绕视角」同一套语义——改的是**相机方位**，
                // 不是模型朝向。OrbitControls 无 API 直接转世界轴，这里按
                // 相机系轴 → 世界轴的映射反推（up / 视线 / 二者叉积）。
                const deg = (parseFloat(btn.dataset.dir) || 1) * 90;
                orbitCameraByWorldAxis(p, axisVector(btn.dataset.axis), deg);
            }
            applyGroupTransform(p, p.sceneCenter);
            forceResort(p);
            wakeRenderLoop();
        });

        // 调正模式下：
        //   左键拖 = 环绕视角（与查看模型完全一致，OrbitControls 原生）
        //   滚轮   = 拉近/拉远（同上）
        //   右键拖 = 平移模型（唯一与查看不同的地方：平移作用在模型上而非 target）
        // 左键 / 滚轮不拦截，直接交给下面的 OrbitControls（指针事件会落到 canvas）。
        canvasWrap.addEventListener('contextmenu', (e) => {
            const p = panels.find(x => x.el === el);
            if (p && p.adjusting) e.preventDefault(); // 调正时右键用于平移，屏蔽菜单
        });
        canvasWrap.addEventListener('pointerdown', (e) => {
            const p = panels.find(x => x.el === el);
            if (!p || !p.adjusting || p.state !== 'ready') return;
            // 右键 = 平移模型；中键/左键不接管，让 OrbitControls 处理左键环绕、中键推拉
            if (e.button !== 2) return;
            e.preventDefault();
            e.stopPropagation(); // 别让 OrbitControls 也收到这次右键
            p.adjustDrag = { x: e.clientX, y: e.clientY, mode: 'translate' };
            canvasWrap.classList.add('dragging');
            setAdjustCursor(p, 'translate', true);
            try { canvasWrap.setPointerCapture(e.pointerId); } catch (_) {}
        });
        canvasWrap.addEventListener('pointermove', (e) => {
            const p = panels.find(x => x.el === el);
            if (!p) return;
            if (!p.adjustDrag) { updateAdjustHoverCursor(p, e); return; }
            const dx = e.clientX - p.adjustDrag.x;
            const dy = e.clientY - p.adjustDrag.y;
            p.adjustDrag = { x: e.clientX, y: e.clientY };
            translateModelByDrag(p, dx, dy);
        });
        const endAdjustDrag = (e) => {
            const p = panels.find(x => x.el === el);
            if (!p || !p.adjustDrag) return;
            p.adjustDrag = null;
            setAdjustCursor(p, null, false);
            canvasWrap.classList.remove('dragging');
            try { canvasWrap.releasePointerCapture(e.pointerId); } catch (_) {}
        };
        canvasWrap.addEventListener('pointerup', endAdjustDrag);
        canvasWrap.addEventListener('pointercancel', endAdjustDrag);
        // 滚轮交给 OrbitControls 做推拉（与查看模型同一手感），此处不再拦截。
        // 仅做一件小事：调正中不阻止默认行为可能导致页面滚动，但画布本身不可滚动，
        // 所以保持默认即可。

        const panel = {
            el, titleEl, closeEl, canvasWrap, adjustEl, adjustBar,
            title: '未加载',
            viewer: null, renderer: null, camera: null, controls: null,
            scene: null,
            state: 'empty', // empty | loading | ready | error
            bbox: null,
            scale: 1, // 归一化缩放
            userQuat: new THREE.Quaternion(), // 单模型调正累积旋转（世界空间），退出调正时按视角差固化
            userScale: 1,                     // 单模型调正缩放倍数（退出时已折算回 userQuat）
            userOffset: new THREE.Vector3(),  // 单模型调正平移（世界坐标）
            adjusting: false,                 // 调正中：本面板 OrbitControls 输入冻结，改为直接操作模型
            adjustDrag: null,                 // {x, y, mode:'rotate'|'translate'|'zoom'}
            sortDirty: false,                 // 朝向/缩放变了待重排（排序进行中时补跑）
        };
        panels.push(panel);
        relayout();
        return panel;
    }

    function removePanel(idx) {
        const p = panels[idx];
        if (!p) return;
        if (p.viewer) { try { p.viewer.dispose(); } catch(e){} }
        if (p.renderer) { p.renderer.dispose(); }
        p.el.remove();
        panels.splice(idx, 1);
        relayout();
    }

    // ============ splatGroup 变换（全局翻转 × 单模型调正 + 摆位） ============
    // 统一入口：把变换应用到 splatGroup 级。
    // 必须放 group 级 —— v0.4.7 static 模式 scene0 变换被烘焙进数据纹理，
    // 事后改无效；splatMesh.matrixWorld 含 group 变换，排序+渲染都吃。
    //
    // 最终变换（与查看模型时的语义一致）：
    //   R = flip · userQuat   朝向；  S = userScale  缩放；
    //   t = -R·(c·S) + userOffset   位置（把模型中心搬到 userOffset）
    //   · flip     在左（世界空间），全局上下翻转动的是这一层；
    //   · userQuat 在内层，是单模型自己的坐标系修正。
    //     这样点「上下翻转」时所有模型整体一起翻，彼此相对朝向不被打乱。
    //   · 居中不变式：userOffset=0 时中心 c 必须落到原点 → t = -R·c（R 变了 t 必须重算）。
    //     userOffset 就是「右键平移」的等价物，默认 0。
    function applyGroupTransform(panel, sceneCenter) {
        const g = panel.splatGroup;
        if (!g) return;
        const q = currentFlipQuat().multiply(panel.userQuat);
        g.quaternion.copy(q);
        g.scale.setScalar(panel.userScale);
        // 中心先随缩放移动（模型空间），再转到世界空间，最后加用户平移
        g.position.copy(sceneCenter).multiplyScalar(panel.userScale)
            .applyQuaternion(q).multiplyScalar(-1).add(panel.userOffset);
        g.updateMatrix();
        // 排序读 splatMesh.matrixWorld（库 L14102：mvpMatrix × splatMesh.matrixWorld），
        // 而这行代码可能在 render 之前执行（forceResort），必须立刻把 matrixWorld
        // 刷成新朝向，否则这一轮强排用的是上一帧的旧矩阵。
        g.updateMatrixWorld(true);
    }

    // 全局翻转对应的四元数（绕 X 轴 180°）
    function currentFlipQuat() {
        return new THREE.Quaternion().setFromAxisAngle(AXIS_X, allFlipped ? Math.PI : 0);
    }

    // 一个屏幕像素在「过原点、垂直于视线」的平面上对应多少世界单位。
    // 用来把鼠标位移换算成模型平移，使不同面板（不同距离/视锥）手感一致。
    function worldPerPixel(panel) {
        const cam = panel.camera;
        const h = panel.canvasWrap.clientHeight || panel.renderer.domElement.clientHeight || 1;
        return (2 * Math.tan(cam.fov * Math.PI / 360) * cam.position.distanceTo(panel.controls.target)) / h;
    }

    // 强制重排：模型朝向变了，view-space 深度全变，复用旧排序会串色。
    // runSplatSort(force, forceSortAll) 在排序进行中会直接 return true（库 L14071），
    // 所以记一个 sortDirty，交给渲染循环在排序结束后补跑，保证最后一次改动落地。
    function forceResort(panel) {
        if (!panel.viewer) return;
        panel.sortDirty = true;
        tryResort(panel);
    }

    function tryResort(panel) {
        const v = panel.viewer;
        if (!v || !panel.sortDirty) return;
        if (!v.initialized || v.sortRunning) return; // 排序中，等下一帧再试
        panel.sortDirty = false;
        try {
            const r = v.runSplatSort(true, true);
            if (r && typeof r.catch === 'function') r.catch(() => {});
        } catch (e) {
            panel.sortDirty = false;
        }
    }

    // 所有已就绪面板统一切换翻转，相机不动（模型仍绕原点翻转，画面居中不变）
    function setAllFlipped(flipped) {
        allFlipped = flipped;
        flipBtn.classList.toggle('active', flipped);
        for (const p of panels) {
            if (p.state === 'ready' && p.sceneCenter) {
                applyGroupTransform(p, p.sceneCenter);
                forceResort(p);
            }
        }
        // 模型变换不触发 controls change，必须手动唤醒渲染
        wakeRenderLoop();
    }

    // ============ 单模型调正：进入 / 退出 / 平移 / 光标 ============
    // 进入调正：OrbitControls **不冻结**，左键环绕 + 滚轮推拉完全保持查看模型时的手感。
    // 只是把右键接管为"平移模型"（也参与相机联动，各面板机位始终一致，
    // 方便一边转视角一边和对面模型比对）。
    //
    // 「转模型」和「转相机」在正交视图下视觉等价（见文件上方常量区注释），
    // 所以调正期间对朝向**不做任何动作**：转完视角退出调正时，
    // 把「当前视角 − 进入调正时的视角」这个朝向差一次性固化进 userQuat，
    // 并把相机拉回进入时的机位 —— 于是画面定格成你刚才调好的样子，
    // 而模型自身姿态被改掉了，这就是"调正"的结果。
    function setPanelAdjusting(panel, on) {
        if (on && panel.state !== 'ready') return;
        panel.adjusting = on;
        panel.adjustEl.classList.toggle('active', on);
        panel.adjustBar.classList.toggle('show', on);
        panel.canvasWrap.classList.toggle('adjusting', on);
        if (on) {
            // 进入：记下当前相机方位（退出时按差值固化朝向）；右键此刻起平移模型
            if (panel.controls) { panel.controls.mouseButtons.RIGHT = null; }
            panel.adjustEnterState = computeCameraState(panel);
            setAdjustCursor(panel, null, false);
        } else {
            // 退出：把视角变化固化进模型朝向，相机回正到进入时的机位
            if (panel.controls) { panel.controls.mouseButtons.RIGHT = THREE.MOUSE.PAN; }
            panel.adjustDrag = null;
            panel.canvasWrap.classList.remove('dragging');
            setAdjustCursor(panel, null, false);
            commitAdjustRotation(panel);
        }
        wakeRenderLoop();
    }

    // 「当前视角」相对「进入调正时的视角」多转了多少 —— 即相机从 A 到 B 的世界旋转差。
    // 直接按定义算就行：把两个相机态各自还原成旋转矩阵（position + lookAt(target)，
    // up 固定世界 Y），再取 R_cam = rot(B) · rot(A)⁻¹。
    // 之所以不需要"投影/拟合"那套：相机旋转本身就是在世界系里表达的，
    // 两个旋转右乘相除即为增量，无奇异性、无精度损失。
    function cameraOrbitDelta(panel, inState, outState) {
        if (!inState || !outState) return new THREE.Quaternion();
        function camRot(state) {
            const target = state.target ? state.target.clone() : new THREE.Vector3();
            const sph = new THREE.Spherical(state.distance, state.elevation, state.azimuth);
            const pos = new THREE.Vector3().addVectors(target, new THREE.Vector3().setFromSpherical(sph));
            const m = new THREE.Matrix4().lookAt(pos, target, AXIS_Y);
            return new THREE.Quaternion().setFromRotationMatrix(m).normalize();
        }
        const rotA = camRot(inState);
        const rotB = camRot(outState);
        return rotB.multiply(rotA.clone().invert()).normalize();
    }

    // 把「世界空间的旋转增量 D」施加到面板当前姿态上。
    // panel.userQuat 承载 R = flip · userQuat，世界增量 D 要右乘其共轭：
    //   R ← D·R  ⟺  userQuat ← userQuat · (R⁻¹·D·R)
    // 不要尝试"直接右乘某个轴向四元数"来近似 —— 只有 D 与当前 R 共轴时才成立。
    function applyWorldDelta(panel, D) {
        const R0 = currentFlipQuat().multiply(panel.userQuat).normalize();
        const local = R0.clone().invert().multiply(D).multiply(R0).normalize();
        panel.userQuat.multiply(local).normalize();
    }

    // 退出调正时调用：把「调正期间的视角变化」折算成模型朝向修正并落地。
    //   R_cam = rot(B) · rot(A)⁻¹   （相机在 A 基础上多转的量，**世界系**表达）
    // 退出时要求「回到 A 机位看到的画面」== 「退出前 B 机位看到的画面」：
    //   rot(A)⁻¹ · R1 = rot(B)⁻¹ · R0
    //   ⟹ R1 = rot(A) · rot(B)⁻¹ · R0 = R_cam⁻¹ · R0
    // 即 Δworld = R_cam⁻¹（**不需要对 A 做共轭** —— 相机旋转本身就是在世界系里
    // 表达的，"参考系"就是世界系；共轭只在我们往内层变量 userQuat 里塞数据时才需要，
    // 由 applyWorldDelta 统一处理）。
    //
    // 注意：这里**只做 R_cam⁻¹ 这一步**。不要额外再乘一次 Ry(−azimuth) 的"自旋"——
    // 相机随后会被 applyCameraState 拉回 A 机位，此时任何附加转动都等于是
    // 对最终画面做一次纯旋转（不再被相机抵销），会直接把定格好的画面转掉。
    // 实测：加上那次自旋后视图矩阵差 1.35e-1、像素差 30.3%；
    // 去掉后视图矩阵差 2.5e-5（数值等价）、像素差降到 4.8%（纯排序残差）。
    // 方位角归一化没有必要：全套面板共用同一个 mainCameraState，
    // 各面板的朝向信息已经完整存在各自的 userQuat 里了。
    function commitAdjustRotation(panel) {
        const inState = panel.adjustEnterState;
        panel.adjustEnterState = null;
        if (!panel.controls || panel.state !== 'ready') return;
        if (inState) {
            const Rcam = cameraOrbitDelta(panel, inState, computeCameraState(panel));
            applyWorldDelta(panel, Rcam.clone().invert().normalize());   // Δworld = R_cam⁻¹

            applyGroupTransform(panel, panel.sceneCenter);
            forceResort(panel);

            // 相机回正到进入调正时的机位：画面定格在刚调好的样子
            applyCameraState(panel, inState);
            mainCameraState = computeCameraState(panel);
            if (panel.controls) panel.controls.update();
        }
        wakeRenderLoop();
    }

    // 平移该模型：位移加在 userOffset 上（世界坐标，即模型的最终位置）。
    // 方向与查看模型时右键平移（OrbitControls pan）一致：水平拖 → 模型跟手横移，
    // 竖直拖 → 模型跟手上下移（模型在屏幕上往哪走，userOffset 就往哪加）。
    function translateModelByDrag(panel, dx, dy) {
        if (!dx && !dy) return;
        const k = worldPerPixel(panel);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(panel.camera.quaternion);
        const up = new THREE.Vector3(0, 1, 0).applyQuaternion(panel.camera.quaternion);
        panel.userOffset.addScaledVector(right, dx * k).addScaledVector(up, -dy * k);
        applyGroupTransform(panel, panel.sceneCenter);
        forceResort(panel);
        wakeRenderLoop();
    }

    // 轴向快捷键在调正语义下改的是**相机方位**：OrbitControls 没有"绕世界轴转相机"
    // 的公开 API，这里把世界轴换算成相机当前方位球坐标的增量（θ=方位角, φ=极角）：
    //   · 世界 Y（竖直轴）：直接加在方位角上
    //   · 相机右轴（屏幕水平）：只动极角（绕 Y 转任意角度都改不了俯仰，只有俯仰轴能）
    //   · 相机上轴（屏幕竖直）：同时改方位角与极角，仰角越大方位变化越快
    function orbitCameraByWorldAxis(panel, axisVec, deg) {
        if (!panel.controls) return;
        const rad = deg * Math.PI / 180;
        const cam = panel.camera;
        const target = panel.controls.target;
        const sph = new THREE.Spherical().setFromVector3(
            new THREE.Vector3().subVectors(cam.position, target));
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(cam.quaternion).normalize();
        const up = new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion).normalize();

        if (Math.abs(axisVec.dot(AXIS_Y)) > 0.999) {
            sph.theta -= rad * Math.sign(axisVec.y);
        } else if (Math.abs(axisVec.dot(right)) > 0.999) {
            sph.phi -= rad * Math.sign(axisVec.dot(right));
        } else if (Math.abs(axisVec.dot(up)) > 0.999) {
            // 绕相机上轴转：方位角变化率 = 1/cos(仰角)（俯仰到极点时发散，做钳制），
            // 同时按当前俯仰角把极角也带动一点，手感才连续。
            const elev = Math.PI / 2 - sph.phi;                       // 仰角（水平以上为正）
            const s = Math.sign(axisVec.dot(up));
            const cosE = Math.max(0.08, Math.cos(elev));               // 远离奇异
            sph.theta -= rad * s / cosE;
            sph.phi   += rad * s * Math.sign(Math.sin(elev)) * 0.35;   // 轻微联动，避免"纯水平转"
        } else {
            return; // 非正交轴不处理（按钮只会传 X/Y/Z）
        }
        sph.phi = Math.min(Math.PI - 0.001, Math.max(0.001, sph.phi));
        const offset = new THREE.Vector3().setFromSpherical(sph);
        cam.position.copy(new THREE.Vector3().addVectors(target, offset));
        cam.lookAt(target);
        panel.controls.update();
        // 相机方位变了 → 广播给其他面板（调正期间机位仍保持联动）
        if (!syncLock) {
            syncLock = true;
            broadcastCameraState(panel);
            requestAnimationFrame(() => { syncLock = false; });
        }
        wakeRenderLoop();
    }

    function axisVector(name) {
        if (name === 'x') return AXIS_X;
        if (name === 'y') return AXIS_Y;
        return AXIS_Z;
    }

    // 调正光标：右键（平移模型）给 move，其余（左键环绕 / 滚轮推拉）与查看模型一致
    function setAdjustCursor(panel, mode, dragging) {
        const w = panel.canvasWrap;
        if (!panel.adjusting) { w.style.cursor = ''; return; }
        if (mode === 'translate') {
            w.style.cursor = dragging ? 'move' : 'move';
        } else {
            w.style.cursor = dragging ? 'grabbing' : 'grab';
        }
    }

    // 未按下时根据按键实时切换光标（不触发任何变换）
    function updateAdjustHoverCursor(panel, e) {
        if (!panel.adjusting) return;
        setAdjustCursor(panel, (e.buttons & 2) ? 'translate' : 'rotate', false);
    }

    // ============ 加载 PLY 到面板 ============
    async function loadPlyToPanel(panel, file) {
        // 清理旧状态
        if (panel.splatGroup) {
            try { await panel.splatGroup.dispose(); } catch(e){}
            panel.splatGroup = null;
            panel.viewer = null;
        }
        if (panel.renderer) {
            panel.renderer.dispose();
        }
        // 换模型 → 单模型调正状态作废（调正是针对当前模型调的，不跨模型沿用）
        panel.adjusting = false;
        panel.adjustDrag = null;
        panel.adjustEnterState = null;
        panel.sortDirty = false;
        panel.userQuat.identity();
        panel.userScale = 1;
        panel.userOffset.set(0, 0, 0);
        // 右键要交还给 OrbitControls 平移（上一次可能在调正中途被换掉）
        if (panel.controls) panel.controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
        panel.adjustEl.classList.add('disabled');
        panel.adjustEl.classList.remove('active');
        panel.adjustBar.classList.remove('show');
        panel.canvasWrap.classList.remove('adjusting', 'dragging');
        panel.canvasWrap.style.cursor = '';
        // 无条件清空容器（移除 .panel-empty / 旧 canvas / 旧 loading / 旧 error）
        panel.canvasWrap.innerHTML = '';

        // 显示 loading
        panel.state = 'loading';
        const loadingEl = document.createElement('div');
        loadingEl.className = 'panel-loading';
        loadingEl.innerHTML = `
            <div class="spinner"></div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <div class="loading-text">解析中...</div>
        `;
        panel.canvasWrap.appendChild(loadingEl);
        const progressFill = loadingEl.querySelector('.progress-fill');
        const loadingText = loadingEl.querySelector('.loading-text');

        // 设置标题
        const fileName = file.name.replace(/\.ply$/i, '');
        panel.title = fileName;
        panel.titleEl.textContent = fileName;

        try {
            const url = URL.createObjectURL(file);

            // 创建 renderer
            // antialias:false —— MSAA 只对几何边缘有效，splat 是软 alpha 椭球，
            //   开 MSAA 纯浪费显存和带宽（回调 mesh 不写颜色，场景里没有别的几何）
            // setPixelRatio(1) —— HiDPI 屏（dpr=2）下片元量是 1x 的 4 倍；
            //   纯查看场景 cap 到 1，GPU 压力直接除以 dpr²。要更锐可改 1.5
            const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
            renderer.setClearColor(0x222233, 1); // 深蓝灰背景，用于确认 renderer 在画
            const w = panel.canvasWrap.clientWidth || 400;
            const h = panel.canvasWrap.clientHeight || 300;
            renderer.setSize(w, h, false);
            renderer.setPixelRatio(1);
            panel.canvasWrap.appendChild(renderer.domElement);

            // 创建 camera（标准 three.js Y-up 坐标系）
            const camera = new THREE.PerspectiveCamera(65, w / h, 0.1, 500);
            camera.position.set(2, 2, 3);
            camera.up.set(0, 1, 0);
            camera.lookAt(0, 0, 0);

            // 创建 OrbitControls
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.15;
            controls.rotateSpeed = 0.5;
            controls.mouseButtons = {
                LEFT: THREE.MOUSE.ROTATE,
                MIDDLE: THREE.MOUSE.DOLLY,
                RIGHT: THREE.MOUSE.PAN
            };

            // 创建 DropInViewer（继承自 THREE.Group，直接加到 scene 里）
            // 每帧通过 callbackMesh.onBeforeRender 自动调用 viewer.update(renderer, camera)
            // sharedMemoryForWorkers=false：避免 SharedArrayBuffer 需要 crossOriginIsolated 的问题
            // gpuAcceleratedSort 必须为 false！
            // 库 v0.4.7 的 bug：开启后主线程不向排序 worker 发送 centers 数据
            // （addSplatBuffers 中 if (!this.gpuAcceleratedSort) 才 push centers 消息），
            // 而 worker 内 renderCount = min(splatRenderCount, uploadedSplatCount)，
            // uploadedSplatCount 只随 centers 消息更新 → 恒为 0 → 回信 splatRenderCount=0
            // → geometry.instanceCount=0 → 一个 splat 都不画 → 黑屏。
            // CPU 排序（integerBasedSort）对百万级 splat 也是毫秒级，性能无感知差异。
            const splatGroup = new DropInViewer({
                gpuAcceleratedSort: false,
                halfPrecisionCovariancesOnGPU: true,
                sharedMemoryForWorkers: false,
                integerBasedSort: true,
                dynamicScene: false,
                webXRMode: 0, // None
                // 纯查看模式：显式固定 SH degree=0（v0.4.7 默认也是 0）。
                // PLY 里的 45 个 SH 视角依赖颜色系数在解析阶段直接丢弃，
                // 只保留 f_dc 基础色。对比消融模型时视觉差异可忽略，
                // 解析更快、显存/带宽更省。注意：必须构造时传，之后改无效。
                sphericalHarmonicsDegree: 0
            });

            // 创建 three.js scene 并把 splatGroup 加进去
            const scene = new THREE.Scene();
            scene.add(splatGroup);

            panel.renderer = renderer;
            panel.camera = camera;
            panel.controls = controls;
            panel.scene = scene;
            panel.splatGroup = splatGroup;
            // 保留 panel.viewer 引用用于 dispose 和状态查询
            panel.viewer = splatGroup.viewer;

            // 绑定 controls change → 唤醒按需渲染 + 联动广播
            controls.addEventListener('change', () => {
                wakeRenderLoop();
                if (syncLock) return;
                syncLock = true;
                broadcastCameraState(panel);
                requestAnimationFrame(() => { syncLock = false; });
            });

            // 加载场景
            // blob URL 无扩展名，必须显式传 format，否则 sceneFormatFromPath 推断失败
            console.log('[splat-compare] 开始 addSplatScene, url=', url);
            const loadPromise = splatGroup.addSplatScene(url, {
                splatAlphaRemovalThreshold: 1,
                showLoadingUI: false,
                format: SceneFormat.Ply,
                position: [0, 0, 0],
                rotation: [0, 0, 0, 1],
                scale: [1, 1, 1],
                progressiveLoad: false
            });
            console.log('[splat-compare] addSplatScene 返回:', loadPromise, '类型:', typeof loadPromise);
            await loadPromise;
            console.log('[splat-compare] addSplatScene 完成');

            // 通过 splatGroup.viewer.getSplatMesh() 拿到 SplatMesh
            const splatMesh = splatGroup.viewer.getSplatMesh();
            console.log('[splat-compare] splatMesh:', splatMesh, 'scenes:', splatMesh.scenes);
            const scene0 = splatMesh.getScene(0);
            console.log('[splat-compare] scene0:', scene0);
            const splatBuffer = scene0.splatBuffer;
            const sceneCenter = splatBuffer.sceneCenter.clone(); // 模型原始中心
            console.log('[splat-compare] sceneCenter:', sceneCenter);

            // 居中：必须应用到 splatGroup（THREE.Group）级别！
            // 库 v0.4.7 在 dynamicScene=false 时把 scene 变换烘焙进数据纹理，
            // 事后改 scene0.position/rotation 不参与渲染（已用截图对比证实无效）。
            // 而 splatMesh 的 matrixWorld 包含 splatGroup 的变换，
            // 排序（mvpMatrix × splatMesh.matrixWorld）和渲染（场景图）都吃这套。
            //
            // 保持模型原始朝向加载（不做预置摆正，需要时用「上下翻转」按钮统一调）；
            // 把模型中心移到原点（多模型对齐）：world = R*p + t，center c 映射到 0
            // 需要 t = -R*c。R 变了 t 必须重算，统一走 applyGroupTransform。
            applyGroupTransform(panel, sceneCenter);

            panel.sceneCenter = sceneCenter;
            panel.scale = 1; // 暂不强行归一化尺寸，3DGS 消融模型通常尺寸接近

            // 移除 loading
            loadingEl.remove();
            panel.state = 'ready';
            panel.adjustEl.classList.remove('disabled'); // 就绪后「调正」才可用
            console.log('[splat-compare] 加载完成，panel.state=ready');

            // 唤醒渲染循环（fit/sync 改了相机，change 事件也会触发，双保险）
            wakeRenderLoop();

            // 如果是第一个加载完成的，触发 fit all
            const readyCount = panels.filter(p => p.state === 'ready').length;
            if (readyCount === 1) {
                fitAllToFirst(panel);
            } else {
                // 后续加载的，同步到当前主视角
                syncPanelToMain(panel);
            }

            URL.revokeObjectURL(url);
        } catch (err) {
            console.error('加载失败:', err);
            loadingEl.remove();
            panel.state = 'error';
            const errEl = document.createElement('div');
            errEl.className = 'panel-error';
            errEl.innerHTML = `
                <div class="err-icon">!</div>
                <div class="err-msg">加载失败: ${String(err.message || err).slice(0, 200)}</div>
                <div class="small-hint" style="color:#777;font-size:11px">可重新拖入文件</div>
            `;
            panel.canvasWrap.appendChild(errEl);
        }
    }

    // ============ 渲染循环（按需渲染） ============
    // 纯查看模式：相机静止时排序很快收尾（排序是相机变化触发的，静止即无新排序），
    // 渲染循环继续空转纯属浪费 CPU/GPU（百万 splat 每帧都是重活）。
    // 策略：相机静止超过 idleFramesAfterStill 帧后挂起 rAF，改为事件驱动：
    //   - controls 'change'（旋转/平移/缩放/联动）
    //   - renderer size 变化（relayout）
    //   - 面板加载完成
    // 唤醒后先连续渲染若干帧，等 damping 惯性和异步排序（worker 回信后库会
    // forceRenderNextFrame，但那只是库内部标志，DropIn 模式下要靠我们继续画）
    // 都收敛，再次静止时重新挂起。
    const STILL_IDLE_FRAMES = 20; // 静止 ~333ms（60fps）后挂起，覆盖排序收尾
    let renderLoopRunning = false;
    let stillFrameCount = 0;
    let renderDebugLogged = false;

    function cameraMoved(p) {
        // OrbitControls.update() 返回 bool：position/rotation/target 是否变化
        return p.controls.update();
    }

    function tick() {
        let hasActive = false;
        let anyMoving = false;
        let anyPending = false; // 有面板待重排/正在排序：不能挂起，否则停在旧排序上
        for (const p of panels) {
            if (p.state === 'ready' && p.viewer && p.renderer && p.scene) {
                hasActive = true;
                if (cameraMoved(p)) anyMoving = true;
                // DropInViewer 模式：splatGroup 加在 scene 里，
                // renderer.render(scene, camera) 时 splatGroup.callbackMesh.onBeforeRender
                // 会自动调用 viewer.update(renderer, camera)，内部完成排序和 uniform 更新
                p.renderer.render(p.scene, p.camera);
                // 排序放在 render 之后：此时 camera.matrixWorld 和 splatMesh.matrixWorld
                // 都已是本帧最新值，强排用的是准确矩阵（朝向改动才置的 sortDirty）。
                if (p.sortDirty) tryResort(p); // 若正撞上库自身在排序，留到下一帧补跑
                if (p.sortDirty || p.viewer.sortRunning) anyPending = true;
                if (!renderDebugLogged) {
                    const sm = p.viewer.splatMesh;
                    console.log('[splat-compare] render tick: initialized=', p.viewer.initialized,
                                'splatRenderReady=', p.viewer.splatRenderReady,
                                'splatMesh.visible=', sm.visible,
                                'getSplatCount=', sm.getSplatCount ? sm.getSplatCount() : 'no method',
                                'splatGroup.children=', p.splatGroup.children.length,
                                'camera.pos=', p.camera.position,
                                'camera.target=', p.controls.target);
                    renderDebugLogged = true;
                }
            }
        }
        if (!hasActive) {
            renderLoopRunning = false;
            stillFrameCount = 0;
            return;
        }
        // 静止计数：所有相机都连续 STILL_IDLE_FRAMES 帧没动、且没有待落地的排序
        // → 挂起循环。排序在 worker 里异步跑，结果要等回信后才画得出来，
        // 有排序在跑或待补排时不挂起，防止停在"旧排序结果"上。
        if (anyMoving || anyPending) {
            stillFrameCount = 0;
        } else {
            stillFrameCount++;
            if (stillFrameCount > STILL_IDLE_FRAMES) {
                renderLoopRunning = false;
                return; // 挂起，等事件唤醒
            }
        }
        requestAnimationFrame(tick);
    }

    function wakeRenderLoop() {
        stillFrameCount = 0;
        if (renderLoopRunning) return;
        renderLoopRunning = true;
        requestAnimationFrame(tick);
    }

    // ============ 相机联动 ============
    // 同步完整相机状态：target（含右键平移）+ 相对 target 的球面偏移
    // （azimuth/elevation/distance）。各模型已各自居中到原点，平移量
    // 直接共享 target 即可保持所有窗口同步。
    let mainCameraState = null; // {target, azimuth, elevation, distance}

    function computeCameraState(panel) {
        if (!panel.controls) return null;
        const target = panel.controls.target.clone();
        const offset = new THREE.Vector3().subVectors(panel.camera.position, target);
        const spherical = new THREE.Spherical().setFromVector3(offset);
        return {
            target,
            azimuth: spherical.theta,
            elevation: spherical.phi,
            distance: spherical.radius
        };
    }

    function broadcastCameraState(sourcePanel) {
        const state = computeCameraState(sourcePanel);
        if (!state) return;
        mainCameraState = state;
        for (const p of panels) {
            if (p === sourcePanel) continue;
            if (p.state !== 'ready' || !p.controls) continue;
            applyCameraState(p, state);
        }
    }

    function applyCameraState(panel, state) {
        if (!panel.controls) return;
        const target = state.target ? state.target.clone() : new THREE.Vector3(0, 0, 0);
        const spherical = new THREE.Spherical(state.distance, state.elevation, state.azimuth);
        const offset = new THREE.Vector3().setFromSpherical(spherical);
        const newPos = new THREE.Vector3().addVectors(target, offset);

        panel.controls.target.copy(target);
        panel.camera.position.copy(newPos);
        panel.camera.up.set(0, 1, 0);
        panel.camera.lookAt(target);
        panel.controls.update();
    }

    function syncPanelToMain(panel) {
        if (mainCameraState) applyCameraState(panel, mainCameraState);
    }

    function fitAllToFirst(firstPanel) {
        // 给第一个 panel 设一个合理的初始视角（模型已居中到原点）
        // 标准 three.js 坐标系：Y-up
        // 距离 4，俯角 45°（phi 从 Y 轴量起），方位角 45°（theta 绕 Y 轴）
        const initialDist = 4;
        const initialPhi = Math.PI * 0.4;    // ~72° from Y axis（略俯视）
        const initialTheta = Math.PI * 0.25; // 45°
        const target = new THREE.Vector3(0, 0, 0);
        const spherical = new THREE.Spherical(initialDist, initialPhi, initialTheta);
        const offset = new THREE.Vector3().setFromSpherical(spherical);
        const newPos = new THREE.Vector3().addVectors(target, offset);

        firstPanel.controls.target.copy(target);
        firstPanel.camera.position.copy(newPos);
        firstPanel.camera.up.set(0, 1, 0);
        firstPanel.camera.lookAt(target);
        firstPanel.controls.update();

        const state = computeCameraState(firstPanel);
        if (!state) return;
        // 初始视角以模型中心（原点）为注视点
        state.target = new THREE.Vector3(0, 0, 0);
        mainCameraState = state;
        for (const p of panels) {
            if (p === firstPanel) continue;
            if (p.state !== 'ready') continue;
            applyCameraState(p, state);
        }
    }

    // ============ 按钮事件 ============
    fitBtn.addEventListener('click', () => {
        const first = panels.find(p => p.state === 'ready');
        if (first) fitAllToFirst(first);
    });

    // 统一翻转开关
    flipBtn.addEventListener('click', () => setAllFlipped(!allFlipped));

    resetBtn.addEventListener('click', () => {
        while (panels.length > 0) removePanel(0);
        mainCameraState = null;
        setAllFlipped(false);
    });

    // 文件选择
    fileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files).filter(f => /\.ply$/i.test(f.name));
        for (const f of files) {
            if (panels.length >= MAX_PANELS) break;
            const p = createPanel();
            loadPlyToPanel(p, f);
        }
        fileInput.value = '';
    });

    document.getElementById('add-btn-label').addEventListener('click', (e) => {
        if (panels.length >= MAX_PANELS) {
            e.preventDefault();
            alert('已达到最大窗口数 4');
        }
    });

    // ============ 拖拽 ============
    let dragCounter = 0;

    window.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dragCounter++;
        document.body.classList.add('drag-active');
        emptyState.classList.add('dragover');
    });
    window.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragCounter--;
        if (dragCounter <= 0) {
            dragCounter = 0;
            document.body.classList.remove('drag-active');
            emptyState.classList.remove('dragover');
        }
    });
    window.addEventListener('dragover', (e) => { e.preventDefault(); });
    window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragCounter = 0;
        document.body.classList.remove('drag-active');
        emptyState.classList.remove('dragover');
        const files = Array.from(e.dataTransfer.files).filter(f => /\.ply$/i.test(f.name));
        for (const f of files) {
            if (panels.length >= MAX_PANELS) break;
            const p = createPanel();
            loadPlyToPanel(p, f);
        }
    });

    // ============ 窗口尺寸变化 ============
    let resizeTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(relayout, 100);
    });

    // ============ 初始化 ============
    relayout();

    // 调试钩子：渲染循环状态（验证按需渲染挂起/唤醒）
    window.__perfState = () => ({
        running: renderLoopRunning,
        suspended: !renderLoopRunning,
        stillFrames: stillFrameCount,
        readyPanels: panels.filter(p => p.state === 'ready').length
    });
    // 调试钩子（Playwright/控制台用）：读取各面板相机状态
    window.__debugCameras = () => panels.map(p => ({
        state: p.state,
        target: p.controls ? p.controls.target.toArray().map(v => +v.toFixed(3)) : null,
        pos: p.camera ? p.camera.position.toArray().map(v => +v.toFixed(3)) : null,
    }));
    // 调试钩子：读取各面板 splatGroup 变换（验证翻转/居中/调正）
    window.__debugGroupXform = () => panels.map(p => {
        if (!p.splatGroup || p.state !== 'ready') return null;
        return {
            rotationX: +p.splatGroup.rotation.x.toFixed(3),
            quat: p.splatGroup.quaternion.toArray().map(v => +v.toFixed(4)),
            position: p.splatGroup.position.toArray().map(v => +v.toFixed(3)),
            sceneCenter: p.sceneCenter ? p.sceneCenter.toArray().map(v => +v.toFixed(3)) : null,
            userQuat: p.userQuat.toArray().map(v => +v.toFixed(4)),
            userScale: +p.userScale.toFixed(5),
            userOffset: p.userOffset.toArray().map(v => +v.toFixed(4)),
            adjusting: p.adjusting,
            controlsEnabled: p.controls ? p.controls.enabled : null,
            sortDirty: p.sortDirty,
            allFlipped,
        };
    });
    // 调试钩子：强制渲染一帧并直接读回像素（验证"确实画出来了 / 换朝向后画面变了"）。
    // readPixels 必须和 render 在同一个任务内执行，否则默认帧缓冲已被合成清空。
    // 返回非背景像素数（背景 0x222233）和一个滚动校验和，用来做像素级回归比对。
    window.__pixelStats = (i = 0) => {
        const p = panels[i];
        if (!p || p.state !== 'ready' || !p.renderer || !p.scene || !p.camera) return null;
        p.renderer.render(p.scene, p.camera);
        const gl = p.renderer.getContext();
        const w = gl.drawingBufferWidth;
        const h = gl.drawingBufferHeight;
        const buf = new Uint8Array(w * h * 4);
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
        let nonBg = 0;
        let sum = 0;
        for (let k = 0; k < buf.length; k += 4) {
            const r = buf[k], g = buf[k + 1], b = buf[k + 2];
            if (Math.abs(r - 0x22) > 8 || Math.abs(g - 0x22) > 8 || Math.abs(b - 0x33) > 8) nonBg++;
            sum = (sum * 31 + r * 7 + g * 13 + b * 17) >>> 0;
        }
        return { w, h, nonBg, sum };
    };
    // 调试钩子：本面板 splat 渲染计数（区分"真的没画全"和"朝向变了"）
    window.__splatCounts = (i = 0) => {
        const p = panels[i];
        if (!p || p.state !== 'ready' || !p.viewer) return null;
        let total = null;
        try { total = p.viewer.getSplatMesh().getSplatCount(); } catch (e) { total = null; }
        return {
            renderCount: p.viewer.splatRenderCount,
            total,
            sortRunning: !!p.viewer.sortRunning,
            initialized: !!p.viewer.initialized,
            ready: !!p.viewer.splatRenderReady,
        };
    };
    // 调试钩子：脚本驱动单模型调正（Playwright / 控制台）
    // 语义与 UI 一致：调正期间旋转/缩放改的是**相机视角**，平移改的是模型位置。
    window.__adjust = {
        toggle: (i, on) => {
            const p = panels[i];
            if (!p) return null;
            setPanelAdjusting(p, on === undefined ? !p.adjusting : !!on);
            return p.adjusting;
        },
        // 环绕视角：与「查看模型」左键拖动同一路径（OrbitControls 原生）
        orbit: (i, dTheta, dPhi) => {
            const p = panels[i];
            if (!p || !p.controls) return null;
            rotateOrbit(p, dTheta || 0, dPhi || 0);
            return computeCameraState(p);
        },
        // 轴向 ±90°：与工具条按钮同一条实现（改相机方位）
        axis: (i, axis, deg) => {
            const p = panels[i];
            if (!p) return null;
            orbitCameraByWorldAxis(p, axisVector(axis), deg);
            return computeCameraState(p);
        },
        // 平移模型（屏幕像素增量，方向与右键平移一致）
        translate: (i, dx, dy) => {
            const p = panels[i];
            if (!p) return null;
            translateModelByDrag(p, dx, dy);
            return p.userOffset.toArray().map(v => +v.toFixed(4));
        },
        // 把当前视角的朝向差固化进 userQuat（等价于退出调正）
        commit: (i) => {
            const p = panels[i];
            if (!p) return null;
            commitAdjustRotation(p);
            return p.userQuat.toArray().map(v => +v.toFixed(4));
        },
        // 当前累积朝向（世界空间）
        quat: (i) => (panels[i] ? panels[i].userQuat.toArray().map(v => +v.toFixed(4)) : null),
        // 当前画布光标（验证按键与光标对应）
        cursor: (i) => (panels[i] ? panels[i].canvasWrap.style.cursor : null),
        // 把相机搬到指定机位（仅调试用；重置/固化本身不负责搬相机）
        // 入参可给 {target, pos}（__debugCameras 的输出），由页面反推球坐标。
        restoreCamera: (state) => {
            const p = panels[0];
            if (!p || !p.controls) return false;
            const target = new THREE.Vector3().fromArray(state.target || [0, 0, 0]);
            let st;
            if (typeof state.distance === 'number') {
                st = { target, azimuth: state.azimuth, elevation: state.elevation, distance: state.distance };
            } else {
                const pos = new THREE.Vector3().fromArray(state.pos || [0, 0, 0]);
                const sph = new THREE.Spherical().setFromVector3(new THREE.Vector3().subVectors(pos, target));
                st = { target, azimuth: sph.theta, elevation: sph.phi, distance: sph.radius };
            }
            applyCameraState(p, st);
            broadcastCameraState(p);
            wakeRenderLoop();
            return true;
        },
        reset: (i) => {
            const p = panels[i];
            if (!p) return null;
            p.userQuat.identity();
            p.userScale = 1;
            p.userOffset.set(0, 0, 0);
            applyGroupTransform(p, p.sceneCenter);
            forceResort(p);
            wakeRenderLoop();
            return true;
        }
    };
    // 环绕视角的共用实现（左键拖动 / 调试钩子 / 轴向快捷键都走它）
    function rotateOrbit(panel, dTheta, dPhi) {
        if (!panel.controls) return;
        const cam = panel.camera;
        const target = panel.controls.target;
        const sph = new THREE.Spherical().setFromVector3(
            new THREE.Vector3().subVectors(cam.position, target));
        sph.theta += dTheta;
        sph.phi = Math.min(Math.PI - 0.001, Math.max(0.001, sph.phi + dPhi));
        const offset = new THREE.Vector3().setFromSpherical(sph);
        cam.position.copy(new THREE.Vector3().addVectors(target, offset));
        cam.lookAt(target);
        panel.controls.update();
        if (!syncLock) {
            syncLock = true;
            broadcastCameraState(panel);
            requestAnimationFrame(() => { syncLock = false; });
        }
        wakeRenderLoop();
    }
    </script>
</body>
</html>
