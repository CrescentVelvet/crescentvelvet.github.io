    {
        "imports": {
            "three": "/assets/splat-vendor/three.module.js",

    <script type="module">
    import * as THREE from 'three';
    import { DropInViewer, OrbitControls, SceneFormat } from '@mkkellogg/gaussian-splats-3d';

    // ============ 全局状态 ============
    const MAX_PANELS = 4;
    const panels = []; // {el, canvasWrap, viewer, renderer, camera, controls, title, state, bbox}
    let grid = document.getElementById('grid');
    let emptyState = document.getElementById('empty-state');
    let fitBtn = document.getElementById('fit-btn');
    let resetBtn = document.getElementById('reset-btn');
    let flipBtn = document.getElementById('flip-btn');
    let fileInput = document.getElementById('file-input');

    // 联动锁，防止循环广播
    let syncLock = false;

    // 全局翻转开关：true = 所有模型绕 X 轴再转 180°（上下颠倒）
    // 默认 false = 已摆正状态（3DGS COLMAP Y-down 数据预转 180°）
    let allFlipped = false;

    // ============ 布局管理 ============
    function getGridClass(count) {
        return 'count-' + Math.max(1, Math.min(4, count));
    }

    function relayout() {
        const count = panels.length;
        if (count === 0) {
            grid.style.display = 'none';
            emptyState.style.display = 'flex';
            fitBtn.disabled = true;
            resetBtn.disabled = true;
            flipBtn.disabled = true;
            return;
        }
        emptyState.style.display = 'none';
        grid.style.display = 'grid';
        grid.className = getGridClass(count);
        fitBtn.disabled = false;
        resetBtn.disabled = false;
        flipBtn.disabled = false;
        // 通知每个 renderer 重新计算尺寸
        for (const p of panels) {
            if (p.renderer) {
                const w = p.canvasWrap.clientWidth;
                const h = p.canvasWrap.clientHeight;
                p.renderer.setSize(w, h, false);
                p.camera.aspect = w / h;
                p.camera.updateProjectionMatrix();
            }
        }
    }

    // ============ 创建空面板 ============
    function createPanel() {
        const el = document.createElement('div');
        el.className = 'panel';
        el.innerHTML = `
            <div class="panel-header">
                <span class="panel-title" contenteditable="false">未加载</span>
                <span class="panel-close" title="关闭">×</span>
            </div>
            <div class="panel-canvas-wrap">
                <div class="panel-empty">拖入 .ply 或点击添加</div>
            </div>
        `;
        grid.appendChild(el);

        const titleEl = el.querySelector('.panel-title');
        const closeEl = el.querySelector('.panel-close');
        const canvasWrap = el.querySelector('.panel-canvas-wrap');

        // 标题编辑
        titleEl.addEventListener('click', () => {
            titleEl.contentEditable = 'true';
            titleEl.classList.add('editing');
            titleEl.focus();
            document.execCommand('selectAll', false, null);
        });
        titleEl.addEventListener('blur', () => {
            titleEl.contentEditable = 'false';
            titleEl.classList.remove('editing');
            const p = panels.find(x => x.el === el);
            if (p) p.title = titleEl.textContent.trim() || '未命名';
        });
        titleEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
        });

        // 关闭
        closeEl.addEventListener('click', () => {
            const idx = panels.findIndex(x => x.el === el);
            if (idx >= 0) removePanel(idx);
        });

        const panel = {
            el, titleEl, closeEl, canvasWrap,
            title: '未加载',
            viewer: null, renderer: null, camera: null, controls: null,
            scene: null,
            state: 'empty', // empty | loading | ready | error
            bbox: null,
            scale: 1, // 归一化缩放
        };
        panels.push(panel);
        relayout();
        return panel;
    }

    function removePanel(idx) {
        const p = panels[idx];
        if (!p) return;
        if (p.viewer) { try { p.viewer.dispose(); } catch(e){} }
        if (p.renderer) { p.renderer.dispose(); }
        p.el.remove();
        panels.splice(idx, 1);
        relayout();
    }

    // ============ splatGroup 变换（翻转 + 居中） ============
    // 统一入口：按 allFlipped 状态把变换应用到 splatGroup 级。
    // 必须放 group 级 —— v0.4.7 static 模式 scene0 变换被烘焙进数据纹理，
    // 事后改无效；splatMesh.matrixWorld 含 group 变换，排序+渲染都吃。
    // world = R*p + t，center c 映射到原点需要 t = -R*c（R 变了 t 必须重算）。
    function applyGroupTransform(panel, sceneCenter) {
        const g = panel.splatGroup;
        if (!g) return;
        // 预置 180°（COLMAP Y-down → Y-up 摆正），allFlipped 时再转 180° = 回到原始朝向
        const extra = allFlipped ? Math.PI : 0;
        g.rotation.set(Math.PI + extra, 0, 0);
        g.position.copy(sceneCenter).applyEuler(g.rotation).multiplyScalar(-1);
        g.scale.set(1, 1, 1);
        g.updateMatrix();
    }

    // 所有已就绪面板统一切换翻转，相机不动（模型仍绕原点翻转，画面居中不变）
    function setAllFlipped(flipped) {
        allFlipped = flipped;
        flipBtn.classList.toggle('active', flipped);
        for (const p of panels) {
            if (p.state === 'ready' && p.sceneCenter) {
                applyGroupTransform(p, p.sceneCenter);
            }
        }
    }

    // ============ 加载 PLY 到面板 ============
    async function loadPlyToPanel(panel, file) {
        // 清理旧状态
        if (panel.splatGroup) {
            try { await panel.splatGroup.dispose(); } catch(e){}
            panel.splatGroup = null;
            panel.viewer = null;
        }
        if (panel.renderer) {
            panel.renderer.dispose();
        }
        // 无条件清空容器（移除 .panel-empty / 旧 canvas / 旧 loading / 旧 error）
        panel.canvasWrap.innerHTML = '';

        // 显示 loading
        panel.state = 'loading';
        const loadingEl = document.createElement('div');
        loadingEl.className = 'panel-loading';
        loadingEl.innerHTML = `
            <div class="spinner"></div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <div class="loading-text">解析中...</div>
        `;
        panel.canvasWrap.appendChild(loadingEl);
        const progressFill = loadingEl.querySelector('.progress-fill');
        const loadingText = loadingEl.querySelector('.loading-text');

        // 设置标题
        const fileName = file.name.replace(/\.ply$/i, '');
        panel.title = fileName;
        panel.titleEl.textContent = fileName;

        try {
            const url = URL.createObjectURL(file);

            // 创建 renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setClearColor(0x222233, 1); // 深蓝灰背景，用于确认 renderer 在画
            const w = panel.canvasWrap.clientWidth || 400;
            const h = panel.canvasWrap.clientHeight || 300;
            renderer.setSize(w, h, false);
            renderer.setPixelRatio(window.devicePixelRatio);
            panel.canvasWrap.appendChild(renderer.domElement);

            // 创建 camera（标准 three.js Y-up 坐标系）
            const camera = new THREE.PerspectiveCamera(65, w / h, 0.1, 500);
            camera.position.set(2, 2, 3);
            camera.up.set(0, 1, 0);
            camera.lookAt(0, 0, 0);

            // 创建 OrbitControls
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.15;
            controls.rotateSpeed = 0.5;
            controls.mouseButtons = {
                LEFT: THREE.MOUSE.ROTATE,
                MIDDLE: THREE.MOUSE.DOLLY,
                RIGHT: THREE.MOUSE.PAN
            };

            // 创建 DropInViewer（继承自 THREE.Group，直接加到 scene 里）
            // 每帧通过 callbackMesh.onBeforeRender 自动调用 viewer.update(renderer, camera)
            // sharedMemoryForWorkers=false：避免 SharedArrayBuffer 需要 crossOriginIsolated 的问题
            // gpuAcceleratedSort 必须为 false！
            // 库 v0.4.7 的 bug：开启后主线程不向排序 worker 发送 centers 数据
            // （addSplatBuffers 中 if (!this.gpuAcceleratedSort) 才 push centers 消息），
            // 而 worker 内 renderCount = min(splatRenderCount, uploadedSplatCount)，
            // uploadedSplatCount 只随 centers 消息更新 → 恒为 0 → 回信 splatRenderCount=0
            // → geometry.instanceCount=0 → 一个 splat 都不画 → 黑屏。
            // CPU 排序（integerBasedSort）对百万级 splat 也是毫秒级，性能无感知差异。
            const splatGroup = new DropInViewer({
                gpuAcceleratedSort: false,
                halfPrecisionCovariancesOnGPU: true,
                sharedMemoryForWorkers: false,
                integerBasedSort: true,
                dynamicScene: false,
                webXRMode: 0 // None
            });

            // 创建 three.js scene 并把 splatGroup 加进去
            const scene = new THREE.Scene();
            scene.add(splatGroup);

            panel.renderer = renderer;
            panel.camera = camera;
            panel.controls = controls;
            panel.scene = scene;
            panel.splatGroup = splatGroup;
            // 保留 panel.viewer 引用用于 dispose 和状态查询
            panel.viewer = splatGroup.viewer;

            // 绑定 controls change → 联动广播
            controls.addEventListener('change', () => {
                if (syncLock) return;
                syncLock = true;
                broadcastCameraState(panel);
                requestAnimationFrame(() => { syncLock = false; });
            });

            // 加载场景
            // blob URL 无扩展名，必须显式传 format，否则 sceneFormatFromPath 推断失败
            console.log('[splat-compare] 开始 addSplatScene, url=', url);
            const loadPromise = splatGroup.addSplatScene(url, {
                splatAlphaRemovalThreshold: 1,
                showLoadingUI: false,
                format: SceneFormat.Ply,
                position: [0, 0, 0],
                rotation: [0, 0, 0, 1],
                scale: [1, 1, 1],
                progressiveLoad: false
            });
            console.log('[splat-compare] addSplatScene 返回:', loadPromise, '类型:', typeof loadPromise);
            await loadPromise;
            console.log('[splat-compare] addSplatScene 完成');

            // 通过 splatGroup.viewer.getSplatMesh() 拿到 SplatMesh
            const splatMesh = splatGroup.viewer.getSplatMesh();
            console.log('[splat-compare] splatMesh:', splatMesh, 'scenes:', splatMesh.scenes);
            const scene0 = splatMesh.getScene(0);
            console.log('[splat-compare] scene0:', scene0);
            const splatBuffer = scene0.splatBuffer;
            const sceneCenter = splatBuffer.sceneCenter.clone(); // 模型原始中心
            console.log('[splat-compare] sceneCenter:', sceneCenter);

            // Y 轴翻转 + 居中：必须应用到 splatGroup（THREE.Group）级别！
            // 库 v0.4.7 在 dynamicScene=false 时把 scene 变换烘焙进数据纹理，
            // 事后改 scene0.position/rotation 不参与渲染（已用截图对比证实无效）。
            // 而 splatMesh 的 matrixWorld 包含 splatGroup 的变换，
            // 排序（mvpMatrix × splatMesh.matrixWorld）和渲染（场景图）都吃这套。
            //
            // 3DGS 数据沿用 COLMAP 约定（Y 轴朝下），在标准 three.js Y-up 视图里
            // 上下颠倒。绕 X 轴转 180° 摆正；再把模型中心移到原点（多模型对齐）：
            // world = R*p + t，center c 映射到 0 需要 t = -R*c。
            applyGroupTransform(panel, sceneCenter);

            panel.sceneCenter = sceneCenter;
            panel.scale = 1; // 暂不强行归一化尺寸，3DGS 消融模型通常尺寸接近

            // 移除 loading
            loadingEl.remove();
            panel.state = 'ready';
            console.log('[splat-compare] 加载完成，panel.state=ready');

            // 启动渲染循环
            startRenderLoop();

            // 如果是第一个加载完成的，触发 fit all
            const readyCount = panels.filter(p => p.state === 'ready').length;
            if (readyCount === 1) {
                fitAllToFirst(panel);
            } else {
                // 后续加载的，同步到当前主视角
                syncPanelToMain(panel);
            }

            URL.revokeObjectURL(url);
        } catch (err) {
            console.error('加载失败:', err);
            loadingEl.remove();
            panel.state = 'error';
            const errEl = document.createElement('div');
            errEl.className = 'panel-error';
            errEl.innerHTML = `
                <div class="err-icon">!</div>
                <div class="err-msg">加载失败: ${String(err.message || err).slice(0, 200)}</div>
                <div class="small-hint" style="color:#777;font-size:11px">可重新拖入文件</div>
            `;
            panel.canvasWrap.appendChild(errEl);
        }
    }

    // ============ 渲染循环 ============
    let renderLoopRunning = false;
    let renderDebugLogged = false;
    function startRenderLoop() {
        if (renderLoopRunning) return;
        renderLoopRunning = true;
        function tick() {
            let hasActive = false;
            for (const p of panels) {
                if (p.state === 'ready' && p.viewer && p.renderer && p.scene) {
                    hasActive = true;
                    p.controls.update();
                    // DropInViewer 模式：splatGroup 加在 scene 里，
                    // renderer.render(scene, camera) 时 splatGroup.callbackMesh.onBeforeRender
                    // 会自动调用 viewer.update(renderer, camera)，内部完成排序和 uniform 更新
                    p.renderer.render(p.scene, p.camera);
                    // 诊断：首次渲染时打印状态
                    if (!renderDebugLogged) {
                        const sm = p.viewer.splatMesh;
                        console.log('[splat-compare] render tick: initialized=', p.viewer.initialized,
                                    'splatRenderReady=', p.viewer.splatRenderReady,
                                    'splatMesh.visible=', sm.visible,
                                    'getSplatCount=', sm.getSplatCount ? sm.getSplatCount() : 'no method',
                                    'splatGroup.children=', p.splatGroup.children.length,
                                    'camera.pos=', p.camera.position,
                                    'camera.target=', p.controls.target);
                        renderDebugLogged = true;
                    }
                }
            }
            if (hasActive) {
                requestAnimationFrame(tick);
            } else {
                renderLoopRunning = false;
            }
        }
        requestAnimationFrame(tick);
    }

    // ============ 相机联动 ============
    // 同步完整相机状态：target（含右键平移）+ 相对 target 的球面偏移
    // （azimuth/elevation/distance）。各模型已各自居中到原点，平移量
    // 直接共享 target 即可保持所有窗口同步。
    let mainCameraState = null; // {target, azimuth, elevation, distance}

    function computeCameraState(panel) {
        if (!panel.controls) return null;
        const target = panel.controls.target.clone();
        const offset = new THREE.Vector3().subVectors(panel.camera.position, target);
        const spherical = new THREE.Spherical().setFromVector3(offset);
        return {
            target,
            azimuth: spherical.theta,
            elevation: spherical.phi,
            distance: spherical.radius
        };
    }

    function broadcastCameraState(sourcePanel) {
        const state = computeCameraState(sourcePanel);
        if (!state) return;
        mainCameraState = state;
        for (const p of panels) {
            if (p === sourcePanel) continue;
            if (p.state !== 'ready' || !p.controls) continue;
            applyCameraState(p, state);
        }
    }

    function applyCameraState(panel, state) {
        if (!panel.controls) return;
        const target = state.target ? state.target.clone() : new THREE.Vector3(0, 0, 0);
        const spherical = new THREE.Spherical(state.distance, state.elevation, state.azimuth);
        const offset = new THREE.Vector3().setFromSpherical(spherical);
        const newPos = new THREE.Vector3().addVectors(target, offset);

        panel.controls.target.copy(target);
        panel.camera.position.copy(newPos);
        panel.camera.up.set(0, 1, 0);
        panel.camera.lookAt(target);
        panel.controls.update();
    }

    function syncPanelToMain(panel) {
        if (mainCameraState) applyCameraState(panel, mainCameraState);
    }

    function fitAllToFirst(firstPanel) {
        // 给第一个 panel 设一个合理的初始视角（模型已居中到原点）
        // 标准 three.js 坐标系：Y-up
        // 距离 4，俯角 45°（phi 从 Y 轴量起），方位角 45°（theta 绕 Y 轴）
        const initialDist = 4;
        const initialPhi = Math.PI * 0.4;    // ~72° from Y axis（略俯视）
        const initialTheta = Math.PI * 0.25; // 45°
        const target = new THREE.Vector3(0, 0, 0);
        const spherical = new THREE.Spherical(initialDist, initialPhi, initialTheta);
        const offset = new THREE.Vector3().setFromSpherical(spherical);
        const newPos = new THREE.Vector3().addVectors(target, offset);

        firstPanel.controls.target.copy(target);
        firstPanel.camera.position.copy(newPos);
        firstPanel.camera.up.set(0, 1, 0);
        firstPanel.camera.lookAt(target);
        firstPanel.controls.update();

        const state = computeCameraState(firstPanel);
        if (!state) return;
        // 初始视角以模型中心（原点）为注视点
        state.target = new THREE.Vector3(0, 0, 0);
        mainCameraState = state;
        for (const p of panels) {
            if (p === firstPanel) continue;
            if (p.state !== 'ready') continue;
            applyCameraState(p, state);
        }
    }

    // ============ 按钮事件 ============
    fitBtn.addEventListener('click', () => {
        const first = panels.find(p => p.state === 'ready');
        if (first) fitAllToFirst(first);
    });

    // 统一翻转开关
    flipBtn.addEventListener('click', () => setAllFlipped(!allFlipped));

    resetBtn.addEventListener('click', () => {
        while (panels.length > 0) removePanel(0);
        mainCameraState = null;
        setAllFlipped(false);
    });

    // 文件选择
    fileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files).filter(f => /\.ply$/i.test(f.name));
        for (const f of files) {
            if (panels.length >= MAX_PANELS) break;
            const p = createPanel();
            loadPlyToPanel(p, f);
        }
        fileInput.value = '';
    });

    document.getElementById('add-btn-label').addEventListener('click', (e) => {
        if (panels.length >= MAX_PANELS) {
            e.preventDefault();
            alert('已达到最大窗口数 4');
        }
    });

    // ============ 拖拽 ============
    let dragCounter = 0;

    window.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dragCounter++;
        document.body.classList.add('drag-active');
        emptyState.classList.add('dragover');
    });
    window.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragCounter--;
        if (dragCounter <= 0) {
            dragCounter = 0;
            document.body.classList.remove('drag-active');
            emptyState.classList.remove('dragover');
        }
    });
    window.addEventListener('dragover', (e) => { e.preventDefault(); });
    window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragCounter = 0;
        document.body.classList.remove('drag-active');
        emptyState.classList.remove('dragover');
        const files = Array.from(e.dataTransfer.files).filter(f => /\.ply$/i.test(f.name));
        for (const f of files) {
            if (panels.length >= MAX_PANELS) break;
            const p = createPanel();
            loadPlyToPanel(p, f);
        }
    });

    // ============ 窗口尺寸变化 ============
    let resizeTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(relayout, 100);
    });

    // ============ 初始化 ============
    relayout();

    // 调试钩子（Playwright/控制台用）：读取各面板相机状态
    window.__debugCameras = () => panels.map(p => ({
        state: p.state,
        target: p.controls ? p.controls.target.toArray().map(v => +v.toFixed(3)) : null,
        pos: p.camera ? p.camera.position.toArray().map(v => +v.toFixed(3)) : null,
    }));
    // 调试钩子：读取各面板 splatGroup 变换（验证翻转/居中）
    window.__debugGroupXform = () => panels.map(p => {
        if (!p.splatGroup || p.state !== 'ready') return null;
        return {
            rotationX: +p.splatGroup.rotation.x.toFixed(3),
            position: p.splatGroup.position.toArray().map(v => +v.toFixed(3)),
            sceneCenter: p.sceneCenter ? p.sceneCenter.toArray().map(v => +v.toFixed(3)) : null,
            allFlipped,
        };
    });
    </script>
</body>
</html>
