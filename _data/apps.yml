# 由 _pages/about.md 的 .button-grid 用 Liquid 循环渲染，**数组顺序 = 页面显示顺序**。
# 新增一个页面：在对应位置加一项即可（title = 按钮文字，url = 站内路径，icon = Font Awesome 类名）。
# 注意 url 用绝对路径（/xxx.html 或 /xxx/），与本页 permalink: / 的部署方式无关。
#
# icon 用 Font Awesome 5 Free Solid 的类名（页面里拼成 class="fas fa-<icon>"）。
# 该字体已由主题 assets/css/main.scss 全量编译（1259 个图标类），**不产生额外网络请求**。
# 校验类名是否存在：.workbuddy/tmp/check_fa_icons.js
# 刻意不给分类：所有卡片同色同权，避免从外观上暴露哪些子页更重要。

